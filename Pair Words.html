    const container = document.getElementById('app');

    function render() {
        const favs = JSON.parse(localStorage.getItem('favs') || '[]');
        container.innerHTML = '<h1>চাকরি প্রস্তুতি: Pair Words (৭৪ টি)</h1>';
        
        data.forEach(item => {
            const isFav = favs.includes(item.id.toString());
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="header" onclick="toggle(this)">
                    <span class="title">${item.id}. ${item.q}</span>
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${item.id})">★</button>
                </div>
                <div class="content">
                    <p class="pronounce">উচ্চারণ: ${item.p}</p>
                    <p class="meaning">অর্থ: ${item.m}</p>
                    <p class="explanation"><strong>ব্যাখ্যা:</strong> ${item.e}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggle(el) {
        const content = el.nextElementSibling;
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function toggleFav(event, id) {
        event.stopPropagation();
        let favs = JSON.parse(localStorage.getItem('favs') || '[]');
        if (favs.includes(id.toString())) {
            favs = favs.filter(i => i !== id.toString());
        } else {
            favs.push(id.toString());
        }
        localStorage.setItem('favs', JSON.stringify(favs));
        render();
    }

    render();
</script>
