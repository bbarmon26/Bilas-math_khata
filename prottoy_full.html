<html lang="bn">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        :root {
            --bg-color: #08071a;
            --glass-card: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f2fe;
            --neon-gold: #fbc531;
            --neon-pink: #ff3860;
            --neon-emerald: #00e676;
            --text-primary: #f5f6fa;
            --text-secondary: #a4b0be;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 90px;
            background-image:

                radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.14) 0%, transparent 45%),

            background-attachment: fixed;
        }

        /* Fixed Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8, 7, 26, 0.92);
            backdrop-filter: blur(20px);
            padding: 14px 20px 18px 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-header { text-align: center; margin-bottom: 10px; }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            display: inline-block;
        }

        .header-controls {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 22px;
            border-radius: 50px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .search-box:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        .top-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
        }
        .btn:hover { border-color: var(--neon-cyan); }

        .btn-cyan { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .btn-cyan.active-mode {
            background: var(--neon-cyan);
            color: #08071a;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .fav-filter-btn { border-color: var(--neon-pink); color: var(--neon-pink); }
        .fav-filter-btn.active-view {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .last-read-btn { border-color: var(--neon-gold); color: var(--neon-gold); }

        /* Container */
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 215px 18px 40px 18px;
        }

        .progress-text {
            text-align: center;
            color: var(--neon-gold);
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(251, 197, 49, 0.3);
        }

        .item-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 16px; 
            scroll-margin-top: 230px;
        }

        .serial { 
            color: var(--neon-cyan); 
            font-weight: 700; 
            font-size: 14px; 
            min-width: 28px; 
            text-align: center;
            opacity: 0.8;
        }

        .card {
            flex-grow: 1;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 14px 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 52px;
        }
        .card:hover {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }
        .card:active { transform: scale(0.985); }

        /* Left side word */
        .word-text {
            font-size: 21px;
            color: var(--neon-gold);
            font-weight: 700;
            text-align: left;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .ans-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .ans-box.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .breakdown-text {
            font-size: 17px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

            font-size: 12px;
            padding: 2px 9px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;

            color: var(--neon-emerald);
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .fav-btn { 
            font-size: 24px; 
            color: rgba(255, 255, 255, 0.12); 
            cursor: pointer; 
            transition: 0.3s; 
            user-select: none;
        }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.active {

            filter: drop-shadow(0 0 10px var(--neon-pink));

        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }

</head>

 { word: "বাক্য", prokriti: "√বচ্+য", type: "কৃৎ প্রত্যয়" },
 { word: "সাহিত্য", prokriti: "সহিত+য", type: "তদ্ধিত প্রত্যয়" },
 { word: "সাহিত্যিক", prokriti: "সাহিত্য+ষ্ণিক", type: "তদ্ধিত প্রত্যয়" },
    ];

    // বর্ণানুক্রমিক সর্ট (অ থেকে হ ক্রমানুসারে সাজানো)
    const data = rawData.sort((a, b) => a.word.localeCompare(b.word, 'bn'));

    let favorites = JSON.parse(localStorage.getItem('prottoyFavs_v1')) || [];
    let showFavsOnly = false;
    let currentMode = 'study'; // 'study' অথবা 'practice'

    // হেডার অটো-হাইড স্ক্রল লজিক
    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if (mode === 'study') {
            document.getElementById('modeStudy').classList.add('active-mode');
        } else {
            document.getElementById('modePractice').classList.add('active-mode');
        }
        render();
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        let activeData = showFavsOnly ? data.filter((_, idx) => favorites.includes(idx)) : data;
        
        if (showFavsOnly) {
            document.getElementById('progress-info').innerText = `⭐ ফেভারিট তালিকা (মোট ${activeData.length} টি)`;
        } else {
            document.getElementById('progress-info').innerText = `মোট প্রত্যয়: ${data.length} টি`;
        }

        if (activeData.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#a4b0be; margin-top:40px; font-size:16px;">কোনো তথ্য পাওয়া যায়নি!</div>`;
            return;
        }

        activeData.forEach((item, index) => {
            const originalIndex = data.indexOf(item);
            const isFav = favorites.includes(originalIndex);
            const showClass = currentMode === 'study' ? 'show' : '';
            const badgeClass = item.type.includes('কৃৎ') ? 'badge-krit' : 'badge-taddhit';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${originalIndex + 1}`;
            div.innerHTML = `
                <span class="serial">${originalIndex + 1}</span>
                <div class="card" onclick="handleCardClick(${originalIndex})">
                    <div class="word-text">${item.word}</div>
                    <div id="ans-${originalIndex}" class="ans-box ${showClass}">
                        <div class="breakdown-text">${item.prokriti}</div>
                        <span class="type-badge ${badgeClass}">${item.type}</span>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${originalIndex})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('prottoyLastRead_v1', index + 1);
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(e, originalIndex) {
        e.stopPropagation();
        const pos = favorites.indexOf(originalIndex);
        if (pos === -1) favorites.push(originalIndex);
        else favorites.splice(pos, 1);
        localStorage.setItem('prottoyFavs_v1', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavsOnly = !showFavsOnly;
        const btn = document.getElementById('favFilterBtn');
        if (showFavsOnly) {
            btn.innerText = "📖 সব দেখুন";
            btn.classList.add('active-view');
        } else {
            btn.innerText = "⭐ ফেভারিট";
            btn.classList.remove('active-view');
        }
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        } else {
            alert('এই নম্বরের কোনো তথ্য পাওয়া যায়নি!');
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('prottoyLastRead_v1');
        if (last) {
            const el = document.getElementById(`item-${last}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert('এখনো কোনো শেষ পড়া সেভ করা হয়নি!');
        }
    }

    render();
</script>
</body>
</html>
