<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS - GK বাংলাদেশের অভ্যুদয়</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(18, 24, 40, 0.88);
            --border-color: rgba(255, 255, 255, 0.08);
            --mint-green: #2dd4bf;      
            --gold-glow: #facc15;       
            --switch-pink: #f43f5e;    
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #05070f 80%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* কমপ্যাক্ট মোবাইল হেডার */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8, 11, 22, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 14px 8px 14px;
            border-bottom: 2px solid rgba(250, 204, 21, 0.35);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-hide { transform: translateY(-110%); }

        .header-container {
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(to right, #ff3366, var(--gold-glow), var(--mint-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: var(--gold-glow);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        .mode-bar {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.45);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .mode-pill {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 2px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .mode-pill.active {
            background: linear-gradient(135deg, var(--switch-pink), #e11d48);
            color: white;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        .search-box {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-box:focus {
            border-color: var(--mint-green);
        }

        /* ৩টি ট্যাব বার */
        .category-bar {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .cat-pill {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-pill.active {
            background: var(--gold-glow);
            color: #05070f;
            border-color: var(--gold-glow);
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.35);
        }

        /* মূল কন্টেইনার - মোবাইলের কাট-অফ দূর করতে প্যাডিং */
        .container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            padding: 175px 12px 90px 12px;
            box-sizing: border-box;
        }

        #main-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* কার্ড ডিজাইন */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .fav-node-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25); 
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            z-index: 10;
        }

        .fav-node-btn.active {
            color: var(--switch-pink);
            text-shadow: 0 0 8px var(--switch-pink);
        }

        .question-node {
            font-size: 15.5px; 
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            text-align: left;
            padding-right: 32px;
        }

        .inline-serial {
            color: var(--gold-glow);
            font-weight: 800;
            margin-right: 6px;
        }

        .ans-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ans-inner-content {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card.card-revealed {
            border-color: rgba(45, 212, 191, 0.35);
            background: rgba(18, 24, 40, 0.95);
        }

        .card.card-revealed .ans-container {
            grid-template-rows: 1fr;
            margin-top: 10px;
        }

        .ans-preview-box {
            padding: 8px 12px;
            background: rgba(45, 212, 191, 0.08);
            border-left: 3px solid var(--mint-green);
            border-radius: 6px;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--mint-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explanation-box {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-left: 3px solid var(--gold-glow);
            border-radius: 6px;
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.55;
            text-align: left;
        }

        /* রকেট হাব (শাফল ছাড়া) */
        .rocket-hub { position: fixed; right: 16px; bottom: 20px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 8px; background: rgba(7, 10, 19, 0.98); padding: 10px 8px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        .r-circle { width: 36px; height: 36px; background: #1e293b; border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 13px; }
        .jump-box { width: 40px; height: 28px; background: #000; border: 1px solid var(--switch-pink); color: white; text-align: center; border-radius: 6px; font-size: 12px; outline: none; }
        .go-btn { background: var(--switch-pink); border: none; padding: 4px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px; }
        .rocket-icon { font-size: 32px; cursor: pointer; filter: drop-shadow(0 3px 8px rgba(244, 63, 94, 0.4)); }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .modal-title { font-size: 16px; font-weight: 800; color: var(--gold-glow); }
        .modal-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

        .guide-item { margin-bottom: 12px; text-align: left; }
        .guide-item h4 { font-size: 13.5px; color: var(--mint-green); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .guide-item p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    </style>
</head>
<body>

<div class="header-section" id="headerNav">
    <div class="header-container">
        <div class="brand-bar">
            <span class="brand-name">GK বাংলাদেশের অভ্যুদয়</span>
            <button class="info-btn" onclick="openGuideModal()"><i class="fas fa-info"></i></button>
        </div>

        <div class="mode-bar">
            <button class="mode-pill active" id="btn-study" onclick="switchMode('study')"><i class="fas fa-book-open"></i> স্টাডি মোড</button>
            <button class="mode-pill" id="btn-practice" onclick="switchMode('practice')"><i class="fas fa-eye-slash"></i> প্র্যাকটিস</button>
            <button class="mode-pill" id="btn-fav" onclick="switchMode('favorite')"><i class="fas fa-star"></i> ফেভারিট</button>
        </div>

        <input type="text" id="mainSearch" class="search-box" placeholder="প্রশ্ন বা উত্তরের কি-ওয়ার্ড খুঁজুন..." oninput="handleSearchFilter()">

        <div class="category-bar">
            <button class="cat-pill active" id="tab-all" onclick="filterCategory('ALL', this)">সব প্রশ্ন (242)</button>
            <button class="cat-pill" id="tab-bcs" onclick="filterCategory('BCS', this)">বিসিএস (106)</button>
            <button class="cat-pill" id="tab-prev" onclick="filterCategory('Previous', this)">বাংলাদেশের অভ্যুদয় (136)</button>
        </div>
    </div>
</div>

<div class="container" id="viewWrapper">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpToQuestion()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocketMenu()">🚀</div>
</div>

<div class="modal-backdrop" id="guideModal" onclick="closeGuideModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title">📖 নির্দেশিকা</span>
            <button class="modal-close" onclick="closeGuideModal()">&times;</button>
        </div>
        <div class="guide-item">
            <h4><i class="fas fa-book-open"></i> স্টাডি মোড</h4>
            <p>প্রশ্ন এবং উত্তর সরাসরি উন্মুক্ত থাকবে দ্রুত পড়ার জন্য।</p>
        </div>
        <div class="guide-item">
            <h4><i class="fas fa-eye-slash"></i> প্র্যাকটিস মোড</h4>
            <p>উত্তর লুকানো থাকবে। কার্ডে ট্যাপ করলে উত্তর ও ব্যাখ্যা দেখতে পাবেন। প্রশ্নগুলোর সিরিয়াল সবসময় অপরিবর্তিত থাকবে।</p>
        </div>
    </div>
</div>

<script>

    {

        e: "১৯৭১ সালের ১৬ ডিসেম্বর বিকাল ৪টা ৩১ মিনিটে পাকিস্তানি বাহিনীর পূর্বাঞ্চলীয় কমান্ডার লে. জেনারেল নিয়াজী আত্মসমর্পণ দলিলে স্বাক্ষর করেন।"
    }
    

    ];

    let currentMode = 'study';
    let currentCategory = 'ALL';
    let favorites = JSON.parse(localStorage.getItem('gkMasterFavs')) || [];

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('headerNav');
        if (top > lastScroll && top > 60) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
        if (mode === 'study') document.getElementById('btn-study').classList.add('active');
        if (mode === 'practice') document.getElementById('btn-practice').classList.add('active');
        if (mode === 'favorite') document.getElementById('btn-fav').classList.add('active');
        render();
    }

    function filterCategory(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function toggleFav(e, id) {
        e.stopPropagation();
        const pos = favorites.indexOf(id);
        if (pos === -1) favorites.push(id);
        else favorites.splice(pos, 1);
        localStorage.setItem('gkMasterFavs', JSON.stringify(favorites));
        render();
    }

    function toggleCard(cardEl) {
        cardEl.classList.toggle('card-revealed');
    }

    function render() {
        const listContainer = document.getElementById('main-list');
        listContainer.innerHTML = "";

        // সবসময় ডেটাবেসের নিজস্ব নির্দিষ্ট সিরিয়াল অনুযায়ী থাকবে (কোনো শাফল হবে না)
        let source = database;

        let filtered = source.filter(item => {
            const matchCategory = (currentCategory === 'ALL') || (item.type === currentCategory);
            const matchFav = (currentMode !== 'favorite') || favorites.includes(item.id);
            return matchCategory && matchFav;
        });

        const searchTerm = document.getElementById('mainSearch').value.trim().toLowerCase();
        if (searchTerm) {
            filtered = filtered.filter(item => 
                item.q.toLowerCase().includes(searchTerm) || 
                item.a.toLowerCase().includes(searchTerm) ||
                item.e.toLowerCase().includes(searchTerm)
            );
        }

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">কোনো প্রশ্ন পাওয়া যায়নি!</div>`;
            return;
        }

        filtered.forEach((item, index) => {
            const isFav = favorites.includes(item.id);
            const revealedClass = (currentMode === 'study') ? 'card-revealed' : '';

            const card = document.createElement('div');
            card.className = `card ${revealedClass}`;
            card.id = `q-${item.id}`;
            card.onclick = () => toggleCard(card);

            card.innerHTML = `
                <button class="fav-node-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${item.id})">
                    <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <div class="question-node">
                    <span class="inline-serial">${index + 1}.</span>${item.q}
                </div>
                <div class="ans-container">
                    <div class="ans-inner-content">
                        <div class="ans-preview-box">
                            <i class="fas fa-check-circle"></i> ${item.a}
                        </div>
                        <div class="explanation-box">
                            💡 ${item.e}
                        </div>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function handleSearchFilter() {
        render();
    }

    function toggleRocketMenu() {
        const m = document.getElementById('rocketMenu');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function jumpToQuestion() {
        const val = parseInt(document.getElementById('jumpInput').value);
        const cards = document.querySelectorAll('.card');
        if (val > 0 && val <= cards.length) {
            cards[val - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketMenu();
        }
    }

    function openGuideModal() { document.getElementById('guideModal').style.display = 'flex'; }
    function closeGuideModal(e) { document.getElementById('guideModal').style.display = 'none'; }

    render();
</script>
</body>
</html>
