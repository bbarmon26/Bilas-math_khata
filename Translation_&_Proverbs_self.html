<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS Translation PRO - Premium Gold Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #070a13;
            --card-bg: rgba(18, 24, 40, 0.75);
            --border-color: rgba(255, 255, 255, 0.05);
            --mint-ans: #2dd4bf;       /* নরমাল ইংরেজি উত্তরের জন্য নরম মিন্ট গ্রিন */
            --grey-pron: #94a3b8;      /* নরমাল উচ্চারণের জন্য মেটালিক স্ল্যাট */
            --gold-glow: #facc15;      /* প্র্যাকটিস মোডে ইংরেজি উত্তরের জন্য উজ্জ্বল গোল্ডেন হলুদ */
            --switch-pink: #f43f5e;    /* ফেভারিট ও প্র্যাকটিস সুইচের নিওন পিঙ্ক */
            --tab-unselected: #64748b; 
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #161630 0%, #070a13 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Top Header - আল্ট্রা স্লিম ও মিনিমালিস্ট লেআউট */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(7, 10, 19, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 8px 16px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .header-hide { transform: translateY(-110%); }

        .header-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, var(--mint-ans), var(--gold-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fav-main-tab {
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            transition: all 0.2s ease;
            user-select: none;
            opacity: 0.5;
        }
        .fav-main-tab.fav-view-active {
            opacity: 1;
            filter: drop-shadow(0 0 10px var(--switch-pink));
        }

        .practice-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
        }

        .p-icon { font-size: 11px; }
        .p-label { font-size: 11px; font-weight: 700; color: var(--tab-unselected); }
        .p-active-ui { border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.06); }
        .p-active-ui .p-label { color: var(--switch-pink); text-shadow: 0 0 8px rgba(244, 63, 94, 0.3); }

        /* ক্যাপসুল আকৃতির রিয়েল বাটন ট্যাব বার */
        .modern-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .web-tab {
            flex: 1;
            padding: 8px 4px;
            background: transparent;
            border: none;
            color: var(--tab-unselected);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .web-tab.active-tab {
            background: rgba(45, 212, 191, 0.12);
            color: var(--mint-ans);
            border: 1px solid rgba(45, 212, 191, 0.2);
        }

        .search-container { width: 100%; }
        .search-box {
            width: 100%;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        /* Container Settings */
        .wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 145px 12px 80px 12px;
            box-sizing: border-box;
        }

        /* ফাঁকা কলাম দূর করে ১০০% ফুল-স্ক্রিন লেআউট */
        .item-wrapper {
            display: flex;
            width: 100%; 
            margin-bottom: 12px;
        }

        .card {
            flex-grow: 1; 
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            min-height: 75px;
            display: flex;
            align-items: center;
            position: relative; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* কার্ডের ভেতরে বামদিকের কোণায় থাকা ছোট ও মার্জিত সিরিয়াল নম্বর */
        .serial-inside {
            position: absolute;
            top: 10px;
            left: 14px;
            color: var(--mint-ans);
            font-weight: 700;
            font-size: 11px;
            opacity: 0.4;
            user-select: none;
        }

        .content-engine {
            width: 100%;
            padding: 28px 45px 14px 14px; /* ওপরে প্যাডিং বাড়ানো হয়েছে সিরিয়ালের জন্য */
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .bengali-node {
            color: #f8fafc;
            font-weight: 600;
            font-size: 15.5px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .practice-on-container .bengali-node {
            font-size: 17.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .practice-on-container .card-revealed .bengali-node {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.35;
            transform: translateY(-2px);
        }

        .english-node {
            color: var(--mint-ans);
            font-weight: 700;
            font-size: 14.5px;
            text-align: left;
        }

        .pronun-node {
            color: var(--grey-pron);
            font-size: 12px;
            text-align: left;
        }

        /* প্র্যাকটিস কভার মেকানিজম */
        .practice-on-container .english-node,
        .practice-on-container .pronun-node {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        /* প্র্যাকটিস ক্লিকে কাঙ্ক্ষিত পারফেক্ট কালার ফিক্স */
        .practice-on-container .card-revealed .english-node {
            color: var(--gold-glow) !important; /* ইংরেজি উত্তর হবে উজ্জ্বল গোল্ডেন হলুদ */
            opacity: 1;
            visibility: visible;
            height: auto;
            margin-top: 2px;
        }

        .practice-on-container .card-revealed .pronun-node {
            color: #e2e8f0 !important; /* উচ্চারণ টেক্সট হবে স্পষ্ট লাইট ক্রিস্টাল গ্রে */
            opacity: 1;
            visibility: visible;
            height: auto;
            margin-top: 1px;
        }

        /* কার্ডের ভেতরে ওপরের ডানদিকের কোনায় লাভ বাটন */
        .item-fav-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }
        .item-fav-btn.fav-active {
            color: var(--switch-pink);
            text-shadow: 0 0 10px var(--switch-pink);
        }

        /* Smart Rocket Hub */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(7, 10, 19, 0.98);
            padding: 15px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 10px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
        }

        .r-circle {
            width: 40px;
            height: 40px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .jump-box {
            width: 40px;
            height: 32px;
            background: #000;
            border: 1px solid var(--switch-pink);
            color: white;
            text-align: center;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .go-btn { background: var(--switch-pink); border: none; padding: 5px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px;}
        .rocket-icon { font-size: 36px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-section" id="headerNav">
    <div class="header-container">
        <div class="brand-bar">
            <span class="brand-name">Translation PRO</span>
            <div class="controls-area">
                <div class="fav-main-tab" id="favMainBtn" onclick="toggleFavoriteViewMode()">❤️</div>
                <div class="practice-toggle-wrapper" id="practiceToggle" onclick="switchPracticeEngine()">
                    <span class="p-icon">🎯</span>
                    <span class="p-label" id="stateLabel">Practice OFF</span>
                </div>
            </div>
        </div>
        
        <div class="modern-tabs" id="tabsNavigationBar">
            <button class="web-tab active-tab" id="btnProv" onclick="loadTab('proverbs')">Proverbs</button>
            <button class="web-tab" id="btnTrans" onclick="loadTab('translations')">Translations</button>
            <button class="web-tab" id="btnPrev" onclick="loadTab('previous')">Previous Questions</button>
        </div>

        <div class="search-container">
            <input type="text" id="mainSearch" class="search-box" placeholder="বাংলা বা ইংরেজি বাক্য দিয়ে সার্চ করুন..." onkeyup="executeSearchFilter()">
        </div>
    </div>
</div>

<div class="wrapper" id="viewWrapper">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpToCell()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocketHub()">🚀</div>
</div>

        isPracticeActivated = !isPracticeActivated;
        const toggleNode = document.getElementById('practiceToggle');
        const labelNode = document.getElementById('stateLabel');
        const wrapperNode = document.getElementById('viewWrapper');
        
        if (isPracticeActivated) {
            toggleNode.classList.add('p-active-ui');
            labelNode.innerText = "Practice ON";
            wrapperNode.classList.add('practice-on-container');
        } else {
            toggleNode.classList.remove('p-active-ui');
            labelNode.innerText = "Practice OFF";
            wrapperNode.classList.remove('practice-on-container');
        }
        renderListEngine();
    }

    function toggleFavoriteViewMode() {
        isFavoriteViewOn = !isFavoriteViewOn;
        document.getElementById('favMainBtn').classList.toggle('fav-view-active', isFavoriteViewOn);
        document.getElementById('tabsNavigationBar').style.opacity = isFavoriteViewOn ? "0.3" : "1";
        document.getElementById('tabsNavigationBar').style.pointerEvents = isFavoriteViewOn ? "none" : "auto";
        renderListEngine();
    }

    function renderListEngine() {
        const listContainer = document.getElementById('main-list');
        listContainer.innerHTML = "";

        let sourceData = [];
        if (currentTabId === 'proverbs') sourceData = proverbsData;
        else if (currentTabId === 'translations') sourceData = translationsData;
        else sourceData = previousData;

        sourceData.forEach((item, index) => {
            const uniqueKeyId = `${currentTabId}_${index}`;
            const isItemFav = favoriteList.includes(uniqueKeyId);
            if (isFavoriteViewOn && !isItemFav) return;

            const rowNode = document.createElement('div');
            rowNode.className = 'item-wrapper';
            rowNode.id = `cell-item-${index + 1}`;
            
            // সিরিয়াল নম্বরকে সরাসরি কার্ডের ইনসাইডে সেট করা হয়েছে
            rowNode.innerHTML = `
                <div class="card" onclick="triggerCardFlip(event, this)">
                    <span class="serial-inside">${index + 1}</span>
                    <div class="content-engine">
                        <div class="bengali-node">${item.w}</div>
                        <div class="english-node">${item.a}</div>
                        <div class="pronun-node">${item.p}</div>
                    </div>
                    <div class="item-fav-btn ${isItemFav ? 'fav-active' : ''}" onclick="toggleSingleItemFav(event, '${uniqueKeyId}')">❤️</div>
                </div>
            `;
            listContainer.appendChild(rowNode);
        });
    }

    function toggleSingleItemFav(event, keyId) {
        event.stopPropagation(); 
        const position = favoriteList.indexOf(keyId);
        if (position === -1) { favoriteList.push(keyId); } 
        else { favoriteList.splice(position, 1); }
        localStorage.setItem('bacademy_favs_v4', JSON.stringify(favoriteList));
        renderListEngine();
    }

    function triggerCardFlip(event, cardEl) {
        if (!isPracticeActivated) return;
        cardEl.classList.toggle('card-revealed');
    }

    function toggleRocketHub() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function jumpToCell() {
        let inputVal = document.getElementById('jumpInput').value;
        let targetEl = document.getElementById(`cell-item-${inputVal}`);
        if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketHub();
        }
    }

    let lastScrollPosition = 0;
    window.onscroll = () => {
        let currentScrollPosition = window.scrollY;
        const navHeader = document.getElementById('headerNav');
        if (currentScrollPosition > lastScrollPosition && currentScrollPosition > 80) {
            navHeader.classList.add('header-hide');
        } else {
            navHeader.classList.remove('header-hide');
        }
        lastScrollPosition = currentScrollPosition;
    };

    function executeSearchFilter() {
        let searchString = document.getElementById('mainSearch').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(searchString) ? "block" : "none";
        });
    }

    renderListEngine();
</script>
</body>
</html>
