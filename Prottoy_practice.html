<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS ACADEMY - প্রত্যয় মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        :root {
            --bg-pure: #030208;
            --glass-bg: rgba(18, 16, 32, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #9b51e0;
            --accent-gold: #ffbe0b;
            --accent-pink: #ff2a6d;
            --accent-green: #05ffa1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-pure);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-bottom: 50px;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(155, 81, 224, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 90% 40%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(255, 42, 109, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Top Slim Progress Bar */
        .progress-rail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background: transparent;
            z-index: 2100;
        }
        .progress-line {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            box-shadow: 0 0 12px var(--accent-cyan);
            transition: width 0.15s ease-out;
        }

        /* Unified Fixed Master Header */
        .master-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(6, 4, 18, 0.88);
            backdrop-filter: blur(25px) saturate(160%);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px 14px 16px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .master-header.hidden { transform: translateY(-110%); }

        .header-inner {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Top Brand & Stats Row */
        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats-chip {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--accent-gold);
            background: rgba(255, 190, 11, 0.1);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 190, 11, 0.25);
        }

        /* Integrated Controls Dock in Header */
        .controls-dock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 4px 8px;
        }

        .dock-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.25s;
            font-family: 'Hind Siliguri', sans-serif;
        }
        .dock-btn:hover { color: #fff; }
        .dock-btn.active {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.35);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }
        .dock-btn.fav-btn-active {
            background: rgba(255, 42, 109, 0.15);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 42, 109, 0.35);
        }

        .dock-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14.5px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .rocket-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
        }

        /* Search Dropdown Panel */
        .search-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .search-panel.active { display: block; }
        .search-field {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.35);
            background: rgba(18, 16, 32, 0.95);
            color: #fff;
            outline: none;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* Main Container */
        .app-body {
            max-width: 650px;
            margin: 0 auto;
            padding: 145px 16px 30px 16px;
        }

        /* Item Row & Card */
        .item-card-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            scroll-margin-top: 155px;
        }

        .num-index {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-purple);
            min-width: 26px;
            text-align: center;
            opacity: 0.85;
        }

        .holo-card {
            flex-grow: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 14px 18px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .holo-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.35), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.7;
        }
        .holo-card:active { transform: scale(0.985); }

        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-word {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .peek-hint {
            font-size: 11px;
            color: var(--accent-cyan);
            opacity: 0.6;
            font-weight: 600;
            transition: opacity 0.25s;
        }
        .holo-card.open .peek-hint { opacity: 0; }

        .reveal-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-drawer.expanded {
            grid-template-rows: 1fr;
        }

        .drawer-inner {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease, padding-top 0.3s ease;
        }
        .reveal-drawer.expanded .drawer-inner {
            opacity: 1;
            transform: translateY(0);
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }

        .breakdown-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 0.4px;
        }

        .type-pill {
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .type-taddhit {
            color: var(--accent-gold);
            background: rgba(255, 190, 11, 0.12);
            border: 1px solid rgba(255, 190, 11, 0.28);
        }
        .type-krit {
            color: var(--accent-green);
            background: rgba(5, 255, 161, 0.12);
            border: 1px solid rgba(5, 255, 161, 0.28);
        }

        .fav-star {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: 0.25s;
            user-select: none;
        }
        .fav-star:hover { transform: scale(1.15); }
        .fav-star.active {
            color: var(--accent-pink);
            filter: drop-shadow(0 0 8px var(--accent-pink));
        }

        /* Rocket Modal */
        .rocket-dialog {
            display: none;
            position: fixed;
            top: 125px;
            right: 20px;
            background: rgba(14, 12, 26, 0.96);
            border: 1px solid var(--accent-cyan);
            backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 14px 10px;
            flex-direction: column;
            gap: 10px;
            z-index: 2500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: fadeIn 0.2s ease;
        }
        .nav-circ-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }
        .jump-inp {
            width: 40px;
            height: 32px;
            background: #000;
            border: 1px solid var(--accent-pink);
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 13px;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="progress-rail">
    <div id="progressTrack" class="progress-line"></div>
</div>

<!-- Unified Master Header -->
<header class="master-header" id="headerNav">
    <div class="header-inner">
        <div class="brand-row">
            <span class="brand-logo">BILAS PROTOY</span>
            <div class="stats-chip" id="countDisplay">০ টি শব্দ</div>
        </div>

        <!-- Integrated Controls Dock in Header -->
        <div class="controls-dock">
            <button class="dock-btn active" id="modeSwitchBtn" onclick="toggleMode()">
                <span id="modeIcon">📖</span> <span id="modeLabel">স্টাডি</span>
            </button>
            <button class="dock-btn" id="favFilterBtn" onclick="toggleFavs()">
                ⭐ ফেভারিট
            </button>
            
            <div class="dock-divider"></div>
            
            <div class="icon-btn" onclick="toggleSearch()" title="খুঁজুন">🔍</div>
            <div class="icon-btn" onclick="restoreLastRead()" title="শেষ পড়া">🕒</div>
            <div class="icon-btn rocket-btn" onclick="toggleRocketDialog()" title="রকেট">🚀</div>
        </div>

        <div class="search-panel" id="searchPanel">
            <input type="text" id="filterInput" class="search-field" placeholder="শব্দ বা প্রত্যয় টাইপ করে খুঁজুন..." onkeyup="filterData()">
        </div>
    </div>
</header>

<main class="app-body">
    <div id="cardDeck"></div>
</main>

<!-- Rocket Quick Nav Menu -->
<div class="rocket-dialog" id="rocketHub">
    <div class="nav-circ-btn" onclick="scrollToEdge('top')">⬆</div>
    <input type="number" id="quickNum" class="jump-inp" placeholder="#">
    <div class="nav-circ-btn" style="background:var(--accent-pink); border:none; font-weight:bold; font-size:12px;" onclick="jumpToCard()">GO</div>
    <div class="nav-circ-btn" onclick="scrollToEdge('bottom')">⬇</div>
</div>

 { word: "উক্তি", prokriti: "√বচ্+তি", type: "কৃৎ প্রত্যয়" },
 { word: "বক্তব্য", prokriti: "√বচ্+তব্য", type: "কৃৎ প্রত্যয়" },
 { word: "সত্য", prokriti: "সং+য", type: "তদ্ধিত প্রত্যয়" },
 { word: "দর্শনীয়", prokriti: "√দৃশ্+অনীয়", type: "কৃৎ প্রত্যয়" },
 { word: "জাগরিত", prokriti: "√জাগ্+ত", type: "কৃৎ প্রত্যয়" },
 { word: "ধার্য", prokriti: "√ধৃ+য", type: "কৃৎ প্রত্যয়" },
 { word: "কুণ্ঠিত", prokriti: "কুণ্ঠ+ত", type: "কৃৎ প্রত্যয়" },
 { word: "যোদ্ধা", prokriti: "যুধ+তৃচ্", type: "কৃৎ প্রত্যয়" },
 { word: "বাক্য", prokriti: "√বচ্+য", type: "কৃৎ প্রত্যয়" },
 { word: "সাহিত্য", prokriti: "সহিত+য", type: "তদ্ধিত প্রত্যয়" },
 { word: "সাহিত্যিক", prokriti: "সাহিত্য+ষ্ণিক", type: "তদ্ধিত প্রত্যয়" }
    ];

    const dataset = rawData.sort((a, b) => a.word.localeCompare(b.word, 'bn'));

    let savedFavs = JSON.parse(localStorage.getItem('protoy_master_favs')) || [];
    let isStudyMode = true;
    let isFavOnly = false;

    let lastY = 0;
    window.addEventListener('scroll', () => {
        const top = window.scrollY;
        const nav = document.getElementById('headerNav');
        
        if (top > lastY && top > 80) nav.classList.add('hidden');
        else nav.classList.remove('hidden');
        lastY = top;

        const max = document.documentElement.scrollHeight - window.innerHeight;
        const pct = max > 0 ? (top / max) * 100 : 0;
        document.getElementById('progressTrack').style.width = pct + '%';
    });

    function renderDeck() {
        const container = document.getElementById('cardDeck');
        container.innerHTML = "";

        let filtered = dataset.filter((item, idx) => {
            return !isFavOnly || savedFavs.includes(idx);
        });

        document.getElementById('countDisplay').innerText = `${filtered.length} টি শব্দ`;

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:15px;">কোনো শব্দ পাওয়া যায়নি!</div>`;
            return;
        }

        filtered.forEach((item, index) => {
            const orgIndex = dataset.indexOf(item);
            const isFav = savedFavs.includes(orgIndex);
            const isExpanded = isStudyMode ? 'expanded' : '';
            const isOpen = isStudyMode ? 'open' : '';
            const typeClass = item.type.includes('কৃৎ') ? 'type-krit' : 'type-taddhit';

            const card = document.createElement('div');
            card.className = 'item-card-row';
            card.id = `holo-node-${orgIndex + 1}`;
            card.innerHTML = `
                <span class="num-index">${orgIndex + 1}</span>
                <div class="holo-card ${isOpen}" onclick="toggleReveal(${orgIndex})">
                    <div class="card-top-row">
                        <span class="main-word">${item.word}</span>
                        <span class="peek-hint">ট্যাপ করুন ❯</span>
                    </div>
                    <div id="drawer-${orgIndex}" class="reveal-drawer ${isExpanded}">
                        <div class="drawer-inner">
                            <span class="breakdown-text">${item.prokriti}</span>
                            <span class="type-pill ${typeClass}">${item.type}</span>
                        </div>
                    </div>
                </div>
                <div class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavItem(event, ${orgIndex})">❤</div>
            `;
            container.appendChild(card);
        });
    }

    function toggleReveal(idx) {
        localStorage.setItem('protoy_master_last', idx + 1);
        if (!isStudyMode) {
            const drawer = document.getElementById(`drawer-${idx}`);
            const card = drawer.closest('.holo-card');
            drawer.classList.toggle('expanded');
            card.classList.toggle('open');
        }
    }

    function toggleMode() {
        isStudyMode = !isStudyMode;
        const btn = document.getElementById('modeSwitchBtn');
        const icon = document.getElementById('modeIcon');
        const label = document.getElementById('modeLabel');

        if (isStudyMode) {
            icon.innerText = "📖";
            label.innerText = "স্টাডি";
            btn.classList.add('active');
        } else {
            icon.innerText = "🎯";
            label.innerText = "প্র্যাকটিস";
            btn.classList.remove('active');
        }
        renderDeck();
    }

    function toggleFavs() {
        isFavOnly = !isFavOnly;
        const btn = document.getElementById('favFilterBtn');
        btn.classList.toggle('fav-btn-active', isFavOnly);
        btn.innerText = isFavOnly ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        renderDeck();
    }

    function toggleFavItem(e, idx) {
        e.stopPropagation();
        const pos = savedFavs.indexOf(idx);
        if (pos === -1) savedFavs.push(idx);
        else savedFavs.splice(pos, 1);
        localStorage.setItem('protoy_master_favs', JSON.stringify(savedFavs));
        renderDeck();
    }

    function toggleSearch() {
        const wrap = document.getElementById('searchPanel');
        wrap.classList.toggle('active');
        if (wrap.classList.contains('active')) {
            document.getElementById('filterInput').focus();
        }
    }

    function filterData() {
        const q = document.getElementById('filterInput').value.toLowerCase();
        document.querySelectorAll('.item-card-row').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }

    function toggleRocketDialog() {
        const hub = document.getElementById('rocketHub');
        hub.style.display = hub.style.display === 'flex' ? 'none' : 'flex';
    }

    function scrollToEdge(pos) {
        window.scrollTo({ top: pos === 'top' ? 0 : document.body.scrollHeight, behavior: 'smooth' });
        toggleRocketDialog();
    }

    function jumpToCard() {
        const val = document.getElementById('quickNum').value;
        const target = document.getElementById(`holo-node-${val}`);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketDialog();
        } else {
            alert('এই নম্বরের কোনো শব্দ নেই!');
        }
    }

    function restoreLastRead() {
        const last = localStorage.getItem('protoy_master_last');
        if (last) {
            const el = document.getElementById(`holo-node-${last}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert('এখনো কোনো পড়ার হিস্ট্রি নেই!');
        }
    }

    renderDeck();
</script>
</body>
</html>
