<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAcademy - Appropriate Preposition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Bengali', sans-serif; }

        :root {
            --bg-dark: #020617;
            --container-bg: #0f172a;
            --mint-green: #2dd4bf;
            --gold-glow: #facc15;
            --switch-pink: #f43f5e;
            --sky-blue: #38bdf8;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background-color: var(--container-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .ocean {
            position: fixed; bottom: -650px; left: 50%; width: 800px; height: 800px;
            margin-left: -400px; z-index: 0; pointer-events: none;
        }
        .water {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.25) 0%, rgba(79, 70, 229, 0.5) 100%);
            border-radius: 40%; animation: spin 14s linear infinite;
        }
        .water:nth-child(2) {
            background: linear-gradient(180deg, rgba(244, 114, 182, 0.2) 0%, rgba(190, 24, 93, 0.4) 100%);
            border-radius: 45%; animation: spin 20s linear infinite reverse;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        header { 
            position: sticky; top: 0;
            padding: 16px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 50; 
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo h1 { font-size: 20px; font-weight: 800; background: linear-gradient(to right, #38bdf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { font-size: 11px; color: #94a3b8; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .header-icon { font-size: 16px; color: #e2e8f0; cursor: pointer; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .header-icon:active { transform: scale(0.92); }

        .content-area { 
            flex: 1; 
            padding: 15px 16px 110px;
            z-index: 10; 
            position: relative; 
        }
        .view-section { display: none; flex-direction: column; width: 100%; animation: fade 0.25s ease; }
        .active-view { display: flex; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 18px; }
        .search-box i { color: #94a3b8; margin-right: 12px; font-size: 15px; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 14px; }
        .search-box input::placeholder { color: #64748b; }

        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .prep-card { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; padding: 16px 6px; 
            text-align: center; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; gap: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            transition: all 0.2s ease;
        }
        .prep-card:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.09); }
        .prep-card i { font-size: 20px; color: #38bdf8; }
        .prep-card span { font-size: 14px; font-weight: 700; color: #ffffff; }
        
        .mixed-card { grid-column: span 3; background: linear-gradient(135deg, rgba(244, 114, 182, 0.15), rgba(56, 189, 248, 0.15)); flex-direction: row; justify-content: center; gap: 12px; padding: 14px; border-color: rgba(244, 114, 182, 0.3); }
        .mixed-card i { color: #f472b6; font-size: 18px; }

        .data-item { 
            background: rgba(15, 23, 42, 0.85); padding: 18px; border-radius: 20px; border-left: 4px solid #fb923c; margin-bottom: 14px; position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); cursor: pointer; overflow: hidden;
        }
        .primary-content { transition: opacity 0.3s ease; }
        .data-item.show-overlay .primary-content { opacity: 0.06; } 

        .card-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge-container { display: flex; gap: 6px; align-items: center; }
        .serial-badge { background: #38bdf8; color: #020617; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .book-badge { background: rgba(255,255,255,0.05); color: #cbd5e1; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
        .fav-btn { font-size: 18px; color: #475569; padding: 4px; transition: 0.2s; }
        .fav-btn.active { color: #f43f5e; text-shadow: 0 0 10px rgba(244,63,94,0.5); }

        .data-item h3 { font-size: 19px; color: #ffffff; font-weight: 800; margin-bottom: 10px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
        .data-item .pron { font-size: 13px; color: #94a3b8; font-weight: 400; font-style: normal; }
        .data-item .meaning { font-size: 13px; color: #f472b6; font-weight: 600; background: rgba(244, 114, 182, 0.1); padding: 8px 10px; border-radius: 10px; display: inline-block; width: 100%; text-align: center; border: 1px solid rgba(244, 114, 182, 0.15); }

        .sentence-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; text-align: center;
        }
        .data-item.show-overlay .sentence-overlay { opacity: 1; pointer-events: auto; }
        .sentence-overlay .eng-sen { font-size: 15px; color: #f8fafc; font-style: italic; font-weight: 600; margin-bottom: 6px; }
        .sentence-overlay .bn-sen { font-size: 13px; color: #cbd5e1; line-height: 1.4; }
        .overlay-hint { position: absolute; bottom: 8px; font-size: 9px; color: #64748b; font-weight: 600; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 6px; }

        /* Smooth Practice Card Animation (Butter Smooth Accordion) */
        .practice-card { 
            background: rgba(15, 23, 42, 0.9); 
            padding: 16px 18px; 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 4px solid var(--mint-green); 
            margin-bottom: 14px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.35); 
            cursor: pointer; 
            user-select: none;
            transition: transform 0.15s ease, border-color 0.2s ease;
            will-change: transform;
        }
        .practice-card:active { transform: scale(0.985); }

        .sentence-node { font-size: 16px; font-weight: 600; color: #ffffff; line-height: 1.6; margin-top: 4px; }
        .dot-placeholder {
            color: transparent; font-weight: 700;
            border-bottom: 2px dashed var(--gold-glow);
            padding: 0 6px; margin: 0 3px;
            display: inline-block; text-align: center;
            transition: all 0.2s ease;
        }
        .practice-card.card-revealed .dot-placeholder {
            color: var(--mint-green);
            text-shadow: 0 0 8px rgba(45, 212, 191, 0.6);
            background: rgba(45, 212, 191, 0.12);
            padding: 1px 8px; border-radius: 6px;
            border-bottom: 2px solid var(--mint-green);
        }

        .extra-info-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .practice-card.card-revealed .extra-info-wrapper {
            grid-template-rows: 1fr;
        }
        .extra-info-content {
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease 0.05s;
        }
        .practice-card.card-revealed .extra-info-content {
            opacity: 1;
            padding-top: 12px;
            margin-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }

        .prep-detail-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(250, 204, 21, 0.12); color: var(--gold-glow);
            padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700;
            margin-bottom: 8px; border: 1px solid rgba(250, 204, 21, 0.25);
        }
        .meaning-line { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-bottom: 4px; }
        .meaning-line strong { color: var(--mint-green); font-weight: 700; margin-right: 4px; }

        .rocket-hub { position: fixed; right: 16px; bottom: 80px; display: flex; flex-direction: column; align-items: center; z-index: 999; }
        .rocket-menu { display: none; flex-direction: column; gap: 8px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); padding: 12px 8px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .r-circle { width: 38px; height: 38px; background: #1e293b; border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 14px; font-weight: bold; }
        .jump-box { width: 44px; height: 32px; background: #020617; border: 1px solid var(--switch-pink); color: white; text-align: center; border-radius: 8px; font-size: 12px; outline: none; }
        .go-btn { background: var(--switch-pink); border: none; padding: 4px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px; }
        .rocket-icon { font-size: 32px; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .rocket-icon:active { transform: scale(0.9); }

        .bottom-nav { 
            position: fixed; 
            bottom: 12px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 28px); 
            max-width: 460px; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 10px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            z-index: 1000; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .nav-item { color: #64748b; font-size: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: 0.2s; }
        .nav-item span { font-size: 10px; font-weight: 600; transition: 0.2s; }
        .nav-item.active { color: #38bdf8; transform: translateY(-2px); }
        .nav-item.active span { color: #38bdf8; font-weight: 700; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 12px; font-size: 12px; color: white; display: none; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="ocean" id="wavesBG">
            <div class="water"></div>
            <div class="water"></div>
        </div>

        <div class="toast" id="toastMsg">Saved!</div>

        <!-- 1. HOME VIEW -->
        <div id="homeView" class="view-section active-view">
            <header>
                <div class="logo">
                    <h1>BILAS</h1>
                    <p>Appropriate Preposition</p>
                </div>
                <div class="header-icon" onclick="showToast('প্রোফাইল প্যানেল তৈরি হচ্ছে ⌛', '#38bdf8')">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
            </header>

            <div class="content-area">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="প্রিপজিশন শব্দ বা অর্থ খুঁজুন..." id="searchInput">
                </div>
                
                <div id="searchResultsZone" style="margin-bottom: 20px;"></div>
                <div class="grid-container" id="cardGrid"></div>
            </div>
        </div>

        <!-- 2. DETAILS / CATEGORY VIEW -->
        <div id="detailsView" class="view-section">
            <header>
                <div class="header-icon" onclick="switchView('homeView')">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="logo" style="text-align: right;">
                    <h1 id="categoryTitle" style="text-transform: uppercase;">Category</h1>
                    <p>কার্ডে ট্যাপ করে বাক্য দেখুন</p>
                </div>
            </header>
            <div class="content-area" id="dataList"></div>
        </div>

        <!-- 3. PRACTICE TAB -->
        <div id="practiceView" class="view-section">
            <header>
                <div class="logo">
                    <h1>Fill in the Blank</h1>
                    <p>প্র্যাকটিস টেস্ট</p>
                </div>
                <div class="header-icon" title="এলোমেলো (Shuffle) করুন" onclick="shufflePracticeList()">
                    <i class="fa-solid fa-shuffle"></i>
                </div>
            </header>
            <div class="content-area" id="practiceList"></div>
        </div>

        <!-- 4. NOTEBOOK / SAVED VIEW -->
        <div id="favoritesView" class="view-section">
            <header>
                <div class="logo">
                    <h1>My Notebook</h1>
                    <p>সেভ করা কালেকশন</p>
                </div>
            </header>
            <div class="content-area" id="favoritesList"></div>
        </div>

        <!-- 🚀 ROCKET NAVIGATION HUB -->
        <div class="rocket-hub" id="rocketHub">
            <div class="rocket-menu" id="rocketMenu">
                <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆</div>
                <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
                <button class="go-btn" onclick="jumpToCell()">GO</button>
                <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇</div>
            </div>
            <div class="rocket-icon" onclick="toggleRocketHub()">🚀</div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="switchView('homeView')">
                <i class="fa-solid fa-house"></i><span>Home</span>
            </div>
            <div class="nav-item" id="nav-practice" onclick="openPracticeView()">
                <i class="fa-solid fa-bolt"></i><span>Practice</span>
            </div>
            <div class="nav-item" id="nav-fav" onclick="openFavoritesView()">
                <i class="fa-solid fa-bookmark"></i><span>Saved</span>
            </div>
        </div>
    </div>

    <script>
        // আপনার সম্পূর্ণ ৮৮০+ ডেটাবেজ (const db = [...];) এখানে বসবে।

        // ----------------------------------------------------

        const db = [
    { id: 1, bookNo: "142:b", phrase: "About to", targetPrep: "to", pron: "অ্যাবাউট টু", meaning: "প্রায় উপক্রম হওয়া (মরো মরো অবস্থা)", sentence: "He is about to die.", trans: "সে প্রায় মৃতপ্রায় বা মরো মরো অবস্থা।" },

    { id: 11, bookNo: "136:a", phrase: "Adjacent to", targetPrep: "to", pron: "অ্যাডজেসেন্ট টু", meaning: "সংলগ্ন/নিকটে", sentence: "His home is adjacent to mine.", trans: "তার বাড়িটি আমার বাড়ির সংলগ্ন বা পাশে।" },
    { id: 12, bookNo: "173:b", phrase: "Admitted to", targetPrep: "to", pron: "অ্যাডমিটেড টু", meaning: "কোনো প্রতিষ্ঠানে ভর্তি হওয়া", sentence: "I was admitted to Dhaka College.", trans: "আমি ঢাকা কলেজে ভর্তি হয়েছিলাম।" },

    { id: 877, bookNo: "145:a", phrase: "Died after", targetPrep: "after", pron: "ডাইড আফটার", meaning: "কোনো সময়ের পরে মারা যাওয়া", sentence: "His father died after two months.", trans: "তার বাবা দুই মাস পরে মারা গিয়েছিলেন।" },
    { id: 878, bookNo: "2:e", phrase: "Hanker after", targetPrep: "after", pron: "হ্যাংকার আফটার", meaning: "পিছনে ছোটা", sentence: "He hankers after pride.", trans: "সে অহংকারের পেছনে ছোটে।" },
    { id: 879, bookNo: "25:d", phrase: "Hankers after", targetPrep: "after", pron: "হ্যাংকার্স আফটার", meaning: "পিছনে ছোটা", sentence: "An honest man never hankers after riches.", trans: "একজন সৎ মানুষ কখনো ধন-সম্পদের পেছনে diliছায় না।" },
    { id: 880, bookNo: "83:e", phrase: "Look after", targetPrep: "after", pron: "লুক আফটার", meaning: "দেখাশোনা করা", sentence: "There is none to look after her.", trans: "তার দেখাশোনা করারএই ধরনের কিছু করার জন্য আমায় প্রোগ্রাম করা হয়নি।" }
    ];


        const categories = [
            { name: "to", icon: "fa-arrow-right" }, { name: "of", icon: "fa-share-nodes" },
            { name: "for", icon: "fa-heart" }, { name: "in", icon: "fa-box-open" },
            { name: "at", icon: "fa-map-pin" }, { name: "with", icon: "fa-handshake" },
            { name: "from", icon: "fa-door-open" }, { name: "on", icon: "fa-toggle-on" },
            { name: "into", icon: "fa-right-to-bracket" }, { name: "by", icon: "fa-user-tag" },
            { name: "after", icon: "fa-clock-rotate-left" }, { name: "against", icon: "fa-shield" },
            { name: "about", icon: "fa-circle-info" }, { name: "upon", icon: "fa-arrow-up" },
            { name: "out", icon: "fa-door-closed" }, { name: "above", icon: "fa-cloud" },
            { name: "off", icon: "fa-power-off" }, { name: "beside", icon: "fa-people-arrows" }
        ];

        let favorites = JSON.parse(localStorage.getItem('bacademy_favs')) || [];
        let practiceData = null;

        // Build Home Categories
        const grid = document.getElementById('cardGrid');
        categories.forEach(cat => {
            let div = document.createElement('div');
            div.className = 'prep-card';
            div.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.name}</span>`;
            div.onclick = () => openCategoryList(cat.name);
            grid.appendChild(div);
        });

        let mixedDiv = document.createElement('div');
        mixedDiv.className = 'prep-card mixed-card';
        mixedDiv.innerHTML = `<i class="fa-solid fa-layer-group"></i><span>Mixed Elements</span>`;
        mixedDiv.onclick = () => openCategoryList("Mixed");
        grid.appendChild(mixedDiv);

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(viewId === 'homeView') document.getElementById('nav-home').classList.add('active');
            if(viewId === 'practiceView') document.getElementById('nav-practice').classList.add('active');
            if(viewId === 'favoritesView') document.getElementById('nav-fav').classList.add('active');

            document.getElementById('wavesBG').style.display = (viewId === 'homeView') ? 'block' : 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Standard Card Builder
        function compileStandardCardHtml(item, index) {
            const isFav = favorites.includes(item.id);
            const favClass = isFav ? 'fa-solid active' : 'fa-regular';
            return `
                <div class="data-item" id="cell-item-${index + 1}" onclick="toggleOverlay(this)">
                    <div class="primary-content">
                        <div class="card-meta-row">
                            <div class="badge-container">
                                <span class="serial-badge">#${index + 1}</span>
                                <span class="book-badge"><i class="fa-solid fa-book-bookmark"></i> Book: ${item.bookNo}</span>
                            </div>
                            <i class="fa-heart ${favClass} fav-btn" onclick="event.stopPropagation(); toggleFav(${item.id}, this)"></i>
                        </div>
                        <h3>${item.phrase} <span class="pron">(${item.pron})</span></h3>
                        <p class="meaning">${item.meaning}</p>
                    </div>
                    <div class="sentence-overlay">
                        <p class="eng-sen"><i class="fa-solid fa-quote-left" style="color:#38bdf8; font-size:12px;"></i> ${item.sentence} <i class="fa-solid fa-quote-right" style="color:#38bdf8; font-size:12px;"></i></p>
                        <p class="bn-sen">${item.trans}</p>
                        <span class="overlay-hint"><i class="fa-solid fa-hand-pointer"></i> Tap again to hide</span>
                    </div>
                </div>
            `;
        }

        function toggleOverlay(element) { element.classList.toggle('show-overlay'); }

        function renderList(containerId, dataArray, emptyMsg) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if(dataArray.length === 0) {
                container.innerHTML = `<p style="text-align:center; opacity:0.5; margin-top:40px;">${emptyMsg}</p>`;
                return;
            }
            let html = '';
            dataArray.forEach((item, index) => {
                html += compileStandardCardHtml(item, index);
            });
            container.innerHTML = html;
        }

        function openCategoryList(categoryName) {
            document.getElementById('categoryTitle').innerText = categoryName;
            let filtered = [];
            if(categoryName === "Mixed") {
                filtered = db.filter(item => item.targetPrep === "Mixed");
            } else {
                filtered = db.filter(item => {
                    let targets = item.targetPrep.toLowerCase().split(/[\/\s,]+/);
                    return targets.includes(categoryName.toLowerCase());
                });
            }
            renderList('dataList', filtered, `এই ক্যাটাগরিতে কোনো ডেটা নেই।`);
            switchView('detailsView');
        }

        function openFavoritesView() {
            const favData = db.filter(item => favorites.includes(item.id));
            renderList('favoritesList', favData, `আপনার নোটবুকে কোনো প্রিপজিশন সেভ করা নেই।`);
            switchView('favoritesView');
        }

        // --- PRACTICE ENGINE WITH PERSISTENT SHUFFLE ---
        function loadSavedPracticeOrder() {
            const savedOrderIds = JSON.parse(localStorage.getItem('bacademy_practice_order'));
            if (savedOrderIds && Array.isArray(savedOrderIds) && savedOrderIds.length > 0) {
                const dbMap = new Map(db.map(item => [item.id, item]));
                practiceData = savedOrderIds.map(id => dbMap.get(id)).filter(Boolean);
                if (practiceData.length !== db.length) practiceData = [...db];
            } else {
                practiceData = [...db];
            }
        }

        function openPracticeView() {
            switchView('practiceView');
            if (!practiceData) {
                loadSavedPracticeOrder();
                renderPracticeList();
            }
        }

        function shufflePracticeList() {
            practiceData = [...db].sort(() => Math.random() - 0.5);
            localStorage.setItem('bacademy_practice_order', JSON.stringify(practiceData.map(i => i.id)));
            renderPracticeList();
            showToast("তালিকা এলোমেলো ও সংরক্ষিত হয়েছে! 🔀", "#2dd4bf");
        }

        function renderPracticeList() {
            const container = document.getElementById('practiceList');
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();

            practiceData.forEach((item, index) => {
                let ans = item.targetPrep === "Mixed" ? item.phrase.split(' ')[0] : item.targetPrep;
                let targetWordRegex = new RegExp(`\\b${ans}\\b`, "i");
                
                let blankSentence = item.sentence;
                if(targetWordRegex.test(blankSentence)) {
                    blankSentence = blankSentence.replace(targetWordRegex, `<span class="dot-placeholder">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
                } else {
                    blankSentence = `${item.sentence} (<span class="dot-placeholder">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>)`;
                }

                let card = document.createElement('div');
                card.className = 'practice-card';
                card.id = `cell-item-${index + 1}`;
                card.onclick = () => triggerPracticeFlip(card, ans);
                card.innerHTML = `
                    <div class="card-meta-row">
                        <div class="badge-container">
                            <span class="serial-badge" style="background:var(--mint-green);">#${index + 1}</span>
                            <span class="book-badge"><i class="fa-solid fa-book-bookmark"></i> Book: ${item.bookNo}</span>
                        </div>
                    </div>
                    
                    <div class="sentence-node">${blankSentence}</div>
                    
                    <div class="extra-info-wrapper">
                        <div class="extra-info-content">
                            <div class="prep-detail-badge"><i class="fa-solid fa-circle-check"></i> ${item.phrase} (${item.pron})</div>
                            <p class="meaning-line"><strong>👉</strong> ${item.meaning}</p>
                            <p class="meaning-line" style="color:#94a3b8;"><strong>📝</strong> ${item.trans}</p>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }

        function triggerPracticeFlip(cardEl, answerText) {
            const isRevealed = cardEl.classList.contains('card-revealed');
            const placeholder = cardEl.querySelector('.dot-placeholder');
            if(!isRevealed) {
                cardEl.classList.add('card-revealed');
                if(placeholder) placeholder.innerText = answerText;
            } else {
                cardEl.classList.remove('card-revealed');
                if(placeholder) placeholder.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
            }
        }

        // Rocket Hub Jump
        function toggleRocketHub() {
            const menu = document.getElementById('rocketMenu');
            menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        }

        function jumpToCell() {
            let inputVal = document.getElementById('jumpInput').value;
            let targetEl = document.getElementById(`cell-item-${inputVal}`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                toggleRocketHub();
            } else {
                showToast("নম্বরটি খুঁজে পাওয়া যায়নি!", "#f43f5e");
            }
        }

        // Favorites Handler
        function toggleFav(id, element) {
            if(favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                element.className = 'fa-heart fa-regular fav-btn';
                showToast("নোটবুক থেকে মুছে ফেলা হয়েছে", "#475569");
            } else {
                favorites.push(id);
                element.className = 'fa-heart fa-solid active fav-btn';
                showToast("নোটবুকে সেভ করা হয়েছে!", "#f43f5e");
            }
            localStorage.setItem('bacademy_favs', JSON.stringify(favorites));
            if(document.getElementById('favoritesView').classList.contains('active-view')) openFavoritesView();
        }

        function showToast(msg, color) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg; toast.style.borderLeft = `4px solid ${color}`; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // Ultra Fast Debounced Search
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimer);
            const val = e.target.value.toLowerCase().trim();
            const gridContainer = document.getElementById('cardGrid');
            const resultsZone = document.getElementById('searchResultsZone');

            if(val === "") {
                gridContainer.style.display = "grid";
                resultsZone.innerHTML = "";
                return;
            }

            searchTimer = setTimeout(() => {
                gridContainer.style.display = "none";
                const matches = db.filter(item => 
                    item.phrase.toLowerCase().includes(val) || 
                    item.targetPrep.toLowerCase().includes(val) || 
                    item.meaning.toLowerCase().includes(val) ||
                    item.sentence.toLowerCase().includes(val)
                );

                if(matches.length === 0) {
                    resultsZone.innerHTML = `<p style="text-align:center; opacity:0.5; font-size:14px; margin-top:20px;">কোনো ফলাফল পাওয়া যায়নি।</p>`;
                    return;
                }

                let html = '';
                matches.forEach((item, index) => {
                    html += compileStandardCardHtml(item, index);
                });
                resultsZone.innerHTML = html;
            }, 100);
        });
    </script>
</body>
</html>
