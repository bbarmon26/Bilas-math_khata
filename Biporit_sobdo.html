<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বিপরীত শব্দ মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg: #0d0221;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;
            --neon-pink: #ff416c;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Header Section */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.98);
            backdrop-filter: blur(25px);
            padding: 10px 20px 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fav-logo { font-size: 24px; cursor: pointer; filter: drop-shadow(0 0 10px var(--neon-pink)); }

        .mode-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            padding: 4px;
            margin: 10px auto;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 2px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 5px;
            border-radius: 50px;
            border: none;
            background: transparent;
            color: #999;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 250px 20px 100px 20px;
        }

        /* Item UI */
        .item-wrapper { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; scroll-margin-top: 240px; }
        .serial { color: var(--neon-blue); font-weight: bold; font-size: 13px; min-width: 25px; opacity: 0.4; }

        .card {
            flex-grow: 1;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Study Style */
        .study-content { display: flex; width: 100%; justify-content: space-around; padding: 0 15px; }
        .study-word { color: #fff; font-weight: 600; font-size: 18px; }
        .study-antonym { color: var(--neon-gold); font-weight: 800; font-size: 20px; }

        /* Practice Style */
        .practice-trigger { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-word { font-size: 20px; color: #d1d5db; transition: 0.3s; }
        .faded { opacity: 0.15; }
        .p-ans {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            color: var(--neon-gold); font-size: 24px; font-weight: 800;
            text-shadow: 0 0 15px var(--neon-gold); opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .show-ans { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .item-fav-btn { font-size: 20px; color: rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .item-fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        /* Quiz UI */
        .quiz-container { display: none; text-align: center; }
        .quiz-card { background: var(--glass); padding: 30px 20px; border-radius: 30px; border: 1px solid var(--neon-blue); margin-bottom: 25px; }
        .quiz-word { font-size: 32px; font-weight: 800; color: #fff; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; border-radius: 15px; color: #fff; font-size: 18px; cursor: pointer;
        }
        .option-btn.correct { background: var(--correct) !important; color: #000; font-weight: bold; }
        .option-btn.wrong { background: var(--wrong) !important; }
        .next-btn { margin-top: 25px; background: var(--neon-pink); border: none; padding: 12px 35px; border-radius: 50px; color: #fff; font-weight: bold; cursor: pointer; display: none; }

        /* Smart Rocket Navigator */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 16, 61, 0.98);
            padding: 25px 12px;
            border-radius: 50px;
            border: 1px solid var(--neon-blue);
            margin-bottom: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
        }

        .r-circle {
            width: 50px;
            height: 50px;
            background: #1a103d;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .jump-box {
            width: 50px;
            height: 40px;
            background: #000;
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .go-btn { background: var(--neon-pink); border: none; padding: 8px; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px;}

        .rocket-icon {
            font-size: 48px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            transition: 0.3s;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>

<div class="header-section" id="header">

    </div>
</div>

<div class="rocket-hub">

    let favorites = JSON.parse(localStorage.getItem('antonymFavs_v3')) || [];
    let currentMode = 'study';
    let showFavsOnly = false;

    function setMode(mode) {
        currentMode = mode;
        showFavsOnly = false;
        updateUI();
    }

    function toggleFavView() {
        if (currentMode === 'quiz') return;
        showFavsOnly = !showFavsOnly;
        document.getElementById('favMainBtn').style.filter = showFavsOnly ? "drop-shadow(0 0 20px var(--neon-pink)) scale(1.2)" : "drop-shadow(0 0 10px var(--neon-pink))";
        renderList();
    }

    function updateUI() {
        document.getElementById('studyBtn').classList.toggle('active', currentMode === 'study');
        document.getElementById('practiceBtn').classList.toggle('active', currentMode === 'practice');
        document.getElementById('quizBtn').classList.toggle('active', currentMode === 'quiz');
        
        const listDiv = document.getElementById('main-list');
        const quizDiv = document.getElementById('quiz-area');
        const searchArea = document.getElementById('searchArea');

        if (currentMode === 'quiz') {
            listDiv.style.display = 'none';
            quizDiv.style.display = 'block';
            searchArea.style.visibility = 'hidden';
            startQuiz();
        } else {
            listDiv.style.display = 'block';
            quizDiv.style.display = 'none';
            searchArea.style.visibility = 'visible';
            renderList();
        }
    }

    function renderList() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavsOnly && !isFav) return;

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`; // রকেটের জাম্পের জন্য আইডি যুক্ত করা হলো
            
            let cardContent = "";
            if (currentMode === 'study') {
                cardContent = `
                    <div class="study-content">
                        <div class="study-word">${item.w}</div>
                        <div style="color:var(--neon-blue); opacity:0.3;">×</div>
                        <div class="study-antonym">${item.a}</div>
                    </div>`;
            } else {
                cardContent = `
                    <div class="practice-trigger" onclick="magicFlip(${index})">
                        <div id="w-${index}" class="p-word">${item.w}</div>
                        <div id="a-${index}" class="p-ans">${item.a}</div>
                    </div>`;
            }

            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card">${cardContent}</div>
                <div class="item-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤️</div>
            `;
            list.appendChild(div);
        });
    }

    function magicFlip(index) {
        const w = document.getElementById(`w-${index}`);
        const a = document.getElementById(`a-${index}`);
        if (a.classList.contains('show-ans')) {
            w.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            w.classList.add('faded');
            a.classList.add('show-ans');
        }
    }

    function toggleFav(idx) {
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('antonymFavs_v3', JSON.stringify(favorites));
        renderList();
    }

    function startQuiz() {
        document.getElementById('nextBtn').style.display = 'none';
        const randomIndex = Math.floor(Math.random() * data.length);
        const currentItem = data[randomIndex];
        document.getElementById('targetWord').innerText = currentItem.w;
        
        let opts = [currentItem.a];
        while (opts.length < 4 && opts.length < data.length) {
            let r = data[Math.floor(Math.random() * data.length)].a;
            if (!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => Math.random() - 0.5);
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                const all = document.querySelectorAll('.option-btn');
                all.forEach(b => b.disabled = true);
                if (opt === currentItem.a) btn.classList.add('correct');
                else {
                    btn.classList.add('wrong');
                    all.forEach(b => { if(b.innerText === currentItem.a) b.classList.add('correct'); });
                }
                document.getElementById('nextBtn').style.display = 'inline-block';
            };
            optionsDiv.appendChild(btn);
        });
    }

    /* রকেটের ফংশনগুলো */
    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
    };

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    renderList();
</script>
</body>
</html>
