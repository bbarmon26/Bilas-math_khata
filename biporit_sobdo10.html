<html lang="bn">

    <style>

        :root {
            --bg: #070314;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00f2fe;
            --neon-purple: #7f00ff;
            --neon-gold: #ffbe0b;
            --neon-pink: #ff007f;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px;
            background-image: radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.18) 0%, transparent 45%),

            background-attachment: fixed;
        }

        /* Fixed Header */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(7, 3, 20, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .top-btns {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            padding: 11px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
        }

        .fav-filter-btn {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 0 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        .fav-filter-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 160px 20px 50px 20px;
        }

        .progress-text {
            text-align: center;
            color: var(--neon-gold);
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 190, 11, 0.3);
        }

        .item-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 20px; 
        }

        .serial { 
            color: var(--neon-cyan); 
            font-weight: 700; 
            font-size: 14px; 
            min-width: 28px; 
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        .card {
            flex-grow: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            box-sizing: border-box;
        }

        .word { 
            font-size: 19px; 
            color: #f1f5f9; 
            font-weight: 500; 
            transition: 0.4s;
        }
        
        /* ডিফল্ট অ্যানিমেশন বেস ক্লাস */
        .antonym {
            font-size: 22px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 15px rgba(255, 190, 11, 0.6);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ১. বাম দিক থেকে স্লাইড হয়ে আসা */
        .card.type-1.show .antonym { opacity: 1; transform: translateX(0); animation: animSlideL 0.5s ease; }
        .card.type-1 .antonym { transform: translateX(-50px); }

        /* ২. জুম ইন */
        .card.type-2.show .antonym { opacity: 1; transform: scale(1); }
        .card.type-2 .antonym { transform: scale(0.1); }

        /* ৩. রোটেট বা স্পিন হয়ে আসা */
        .card.type-3.show .antonym { opacity: 1; transform: rotate(0deg) scale(1); }
        .card.type-3 .antonym { transform: rotate(180deg) scale(0.2); }

        /* ৪. ডান দিক থেকে স্লাইড হয়ে আসা */
        .card.type-4.show .antonym { opacity: 1; transform: translateX(0); }
        .card.type-4 .antonym { transform: translateX(50px); }

        /* ৫. নিচ থেকে উপরে বাউন্স করা */
        .card.type-5.show .antonym { opacity: 1; transform: translateY(0); }
        .card.type-5 .antonym { transform: translateY(40px); }

        /* ৬. উপর থেকে নিচে ড্রপ হওয়া */
        .card.type-6.show .antonym { opacity: 1; transform: translateY(0); }
        .card.type-6 .antonym { transform: translateY(-40px); }

        /* ৭. স্কিউ বা বাঁকা হয়ে সোজা হওয়া */
        .card.type-7.show .antonym { opacity: 1; transform: skewX(0deg) scale(1); }
        .card.type-7 .antonym { transform: skewX(40deg) scale(0.5); }

        /* ৮. পপ-আপ ইফেক্ট */
        .card.type-8.show .antonym { opacity: 1; transform: scale(1); }
        .card.type-8 .antonym { transform: scale(1.5); opacity: 0; }

        /* ৯. থ্রিডি ফ্লিপ এক্স एक्सिस */
        .card.type-9.show .antonym { opacity: 1; transform: rotateX(0deg); }
        .card.type-9 .antonym { transform: perspective(300px) rotateX(90deg); }

        /* ১০. ব্লার থেকে পরিষ্কার হওয়া */
        .card.type-10.show .antonym { opacity: 1; filter: blur(0px); transform: scale(1); }
        .card.type-10 .antonym { filter: blur(10px); transform: scale(0.8); }

        .card.show .word {
            opacity: 0.3;
            transform: scale(0.95);
        }

        .item-fav-btn { 
            font-size: 24px; 
            color: rgba(255, 255, 255, 0.15); 
            cursor: pointer; 
            transition: 0.3s; 
            padding: 5px;
        }
        .item-fav-btn:hover { transform: scale(1.2); }
        .item-fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* নেভিগেশন বাটন */
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 40px 0 20px 0;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 22px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
            flex: 1;
            text-align: center;
        }

        .nav-btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);

            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: #fff;
            box-shadow: 0 5px 20px rgba(127, 0, 255, 0.4);
            flex: 1.5;
        }
        
        .complete-btn:hover {
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }

        showFavsOnly = !showFavsOnly;
        currentIndex = 0;
        const btn = document.getElementById('favFilterBtn');
        if (showFavsOnly) {
            btn.innerText = "📖 সব দেখুন";
            btn.style.background = "var(--neon-pink)";
            btn.style.color = "#fff";
        } else {
            btn.innerText = "⭐ ফেভারিট";
            btn.style.background = "rgba(255, 0, 127, 0.15)";
            btn.style.color = "var(--neon-pink)";
        }
        renderList();
    }

    function renderList() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        let activeData = showFavsOnly ? data.filter((_, idx) => favorites.includes(idx)) : data;
        let endIndex = Math.min(currentIndex + batchSize, activeData.length);
        
        if (showFavsOnly) {
            document.getElementById('progress-info').innerText = `⭐ ফেভারিট তালিকা (${activeData.length} টি)`;
        } else {
            document.getElementById('progress-info').innerText = `প্রদর্শিত হচ্ছে: ${currentIndex + 1} থেকে ${endIndex} (মোট ${data.length} টি)`;
        }

        if (activeData.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#999; margin-top:40px; font-size:16px;">কোনো ডেটা পাওয়া যায়নি!</div>`;
            document.getElementById('navContainer').style.display = 'none';
            return;
        } else {
            document.getElementById('navContainer').style.display = 'flex';
        }

        for (let i = currentIndex; i < endIndex; i++) {
            const item = showFavsOnly ? activeData[i] : data[i];
            const originalIndex = data.indexOf(item);
            const isFav = favorites.includes(originalIndex);

            // ১০টি কার্ডের জন্য ১০ রকমের সম্পূর্ণ আলাদা অ্যানিমেশন ক্লাস (type-1 থেকে type-10)
            const animType = ((i - currentIndex) % 10) + 1;

            const div = document.createElement('div');
            div.className = `item-wrapper`;
            div.innerHTML = `
                <span class="serial">${originalIndex + 1}</span>
                <div class="card type-${animType}" onclick="this.classList.toggle('show')">
                    <div class="card-inner">
                        <span class="word">${item.w}</span>
                        <span class="antonym">${item.a}</span>
                    </div>
                </div>
                <div class="item-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${originalIndex})">❤️</div>
            `;
            list.appendChild(div);
        }

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        if (currentIndex === 0) {
            prevBtn.style.opacity = "0.3";
            prevBtn.style.pointerEvents = "none";
        } else {
            prevBtn.style.opacity = "1";
            prevBtn.style.pointerEvents = "auto";
        }

        if (endIndex >= activeData.length) {
            nextBtn.innerText = showFavsOnly ? "শুরুতে ফিরুন ⟳" : "সবগুলো শেষ! প্রথম থেকে শুরু করুন ⟳";
        } else {
            nextBtn.innerText = "কমপ্লিট (পরবর্তী ১০টি) ➡";
        }
    }

    function toggleFav(originalIndex) {
        const pos = favorites.indexOf(originalIndex);
        if (pos === -1) favorites.push(originalIndex);
        else favorites.splice(pos, 1);
        localStorage.setItem('antonymFavs_v9', JSON.stringify(favorites));
        renderList();
    }

    function loadNextBatch() {
        let activeData = showFavsOnly ? data.filter((_, idx) => favorites.includes(idx)) : data;
        currentIndex += batchSize;
        if (currentIndex >= activeData.length) {
            currentIndex = 0;
        }
        renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadPrevBatch() {
        currentIndex -= batchSize;
        if (currentIndex < 0) {
            currentIndex = 0;
        }
        renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    renderList();
