<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পারিভাষিক শব্দ Mastery (New List)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --primary-accent: #58a6ff;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary-accent);
            margin-bottom: 5px;
        }

        .search-container {
            text-align: center;
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-btn.active {
            background-color: #21262d;
            border-color: #8b949e;
            color: #fff;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .card:hover {
            border-color: #8b949e;
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: #30363d;
            cursor: pointer;
        }

        .fav-btn.active {
            color: #e3b341;
        }

        .term-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .pronunciation-line {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .meaning-line {
            font-size: 1.2rem;
            color: #f0f6fc;
            font-weight: 600;
            padding-left: 10px;
            border-left: 3px solid var(--primary-accent);
        }

        /* Practice Mode Specifics */
        .practice-card { cursor: pointer; }
        .hidden-details { 
            display: none; 
            margin-top: 15px; 
            border-top: 1px solid var(--border-color); 
            padding-top: 15px;
            animation: fadeIn 0.3s;
        }
        .practice-card.open .hidden-details { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .no-result { text-align: center; color: var(--text-muted); padding: 50px; }
    </style>
</head>

    </header>

    <div class="search-container">
        <input type="text" id="searchInput" oninput="searchData()" placeholder="ইংরেজি বা বাংলা লিখে খুঁজুন...">
    </div>

    <div class="nav-buttons">
        <button id="btn-study" class="nav-btn active" onclick="switchTab('study')">Study Mode</button>
        <button id="btn-practice" class="nav-btn" onclick="switchTab('practice')">Practice</button>
        <button id="btn-favorites" class="nav-btn" onclick="switchTab('favorites')">⭐ Favorites</button>

    <div id="app-content"></div>
</div>

    ];

    let currentTab = 'study';
    let favorites = JSON.parse(localStorage.getItem('termNewFavs')) || [];

    function toggleFavorite(id, event) {
        event.stopPropagation();
        if(favorites.includes(id)) {
            favorites = favorites.filter(fId => fId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('termNewFavs', JSON.stringify(favorites));
        renderContent();
    }

    function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + tabId).classList.add('active');
        renderContent();
    }

    function searchData() {
        renderContent();
    }

    function renderContent() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let data = termData.filter(item => item.en.toLowerCase().includes(query) || item.bn.includes(query));

        if(currentTab === 'favorites') {
            data = data.filter(item => favorites.includes(item.id));
        }

        let html = '';
        data.forEach((item, index) => {
            const color = titleColors[index % titleColors.length];
            const isFav = favorites.includes(item.id);
            const details = `
                <div class="pronunciation-line">উচ্চারণ: ${item.pr}</div>
                <div class="meaning-line">${item.bn}</div>
            `;

            if(currentTab === 'practice') {
                html += `
                    <div class="card practice-card" onclick="this.classList.toggle('open')">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.id}, event)">★</button>
                        <div class="term-title" style="color: ${color}">${item.id}. ${item.en}</div>
                        <div class="hidden-details">${details}</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="card">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.id}, event)">★</button>
                        <div class="term-title" style="color: ${color}">${item.id}. ${item.en}</div>
                        ${details}
                    </div>
                `;
            }
        });

        document.getElementById('app-content').innerHTML = html || '<div class="no-result">কিছু পাওয়া যায়নি! 😞</div>';
    }

    renderContent();
</script>
