<html lang="bn">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Eye-friendly Deep Slate Palette (চোখের জন্য আরামদায়ক) */
            --bg-main: #0b0f19; 
            --panel-bg: #151b26;
            --glass-card: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #38bdf8;
            --accent-pink: #fb7185;
            --accent-yellow: #fde047;
            --accent-purple: #c084fc;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; position: relative;
        }

        .app-layout {
            width: 100%; max-width: 600px; height: 100vh;
            position: relative; display: flex; flex-direction: column; z-index: 10;
        }

        /* Fixed Main Header & Navigation Panel Bar */
        .dynamic-header {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 14px 20px; border-bottom: 1px solid var(--glass-border);
            z-index: 200; display: flex; flex-direction: column; gap: 12px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-hidden { transform: translateX(-50%) translateY(-100%); }

        /* Premium Main Header */
        .main-app-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, var(--accent-cyan), #a855f7, var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 42px; border-radius: 14px;
            border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.3);
            color: white; outline: none; font-size: 0.95rem; transition: 0.3s ease;
        }
        .search-box input:focus { border-color: var(--accent-cyan); background: rgba(0,0,0,0.4); }
        .search-box .search-icon-text { position: absolute; left: 16px; top: 12px; color: #475569; font-size: 1rem; }

        /* Smooth Pill Controls */
        .nav-buttons { display: flex; gap: 6px; width: 100%; }
        .nav-btn {
            flex: 1; background: var(--glass-card); color: #64748b;
            border: 1px solid var(--glass-border); padding: 11px 4px;
            font-size: 0.85rem; border-radius: 12px; cursor: pointer; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover { color: white; }
        .nav-btn.active { color: white; border-color: transparent; }
        
        #btn-study.active { background: linear-gradient(135deg, #0284c7, #0369a1); }
        #btn-practice.active { background: linear-gradient(135deg, #e11d48, #be185d); }
        #btn-random.active { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        #btn-favorites.active { background: linear-gradient(135deg, #d97706, #b45309); }

        /* Scroll Area Layout */
        .list-container {
            flex: 1; overflow-y: auto; padding: 200px 18px 60px 18px; /* Offset adjusted for Main Header */
            display: flex; flex-direction: column; gap: 12px; height: 100%;
        }

        /* Neumorphic Glass Cards */
        .card {
            background: var(--panel-bg);
            border-radius: 20px; padding: 22px; position: relative;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, border-color 0.2s;
        }
        .card:hover {
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Floating Absolute Star Button layer */
        .fav-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            width: 36px; height: 36px; border-radius: 50%;
            color: #334155; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; z-index: 50; font-size: 1.1rem;
        }
        .fav-btn:hover { background: rgba(0,0,0,0.5); color: #94a3b8; }
        .fav-btn.active {
            color: var(--accent-yellow); background: rgba(251, 191, 36, 0.08);
            border-color: rgba(251, 191, 36, 0.15);
        }

        .term-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 12px; padding-right: 45px; }
        .pronunciation-line { color: #475569; font-size: 0.95rem; margin-bottom: 8px; font-weight: 500; }
        .meaning-line {
            font-size: 1.25rem; color: #f1f5f9; font-weight: 600;
            padding-left: 14px; border-left: 4px solid var(--accent-cyan);
        }

        .clickable-trigger { cursor: pointer; }
        .hidden-details { display: none; margin-top: 16px; border-top: 1px dashed var(--glass-border); padding-top: 16px; }
        
        .card.open .hidden-details { display: block; animation: smoothReveal 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .card.open .meaning-line { border-left-color: var(--accent-pink); }

        /* Standalone Random View: Massive Flashcard View Engine */
        .random-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%; padding-top: 25px;
        }
        .notice-badge {
            background: rgba(124, 61, 237, 0.15); color: #d8b4fe;
            padding: 6px 18px; border-radius: 20px; font-size: 0.85rem;
            font-weight: 700; margin-bottom: 25px; border: 1px solid rgba(124, 61, 237, 0.25);
        }
        
        /* HUGE CARD STYLING FOR RANDOM MODE */
        .random-box-holder { width: 100%; }
        .random-box-holder .card {
            min-height: 260px; /* High Expansion Height Box */
            display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(145deg, #182030, #131926);
            border-color: rgba(124, 61, 237, 0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .random-box-holder .term-title {
            font-size: 1.8rem; /* Extremely Bold Text Layout */
            text-align: center;
            padding-right: 0;
            margin-bottom: 15px;
        }
        .random-box-holder .card p { text-align: center; margin-bottom: 10px; }
        .random-box-holder .hidden-details { width: 100%; }

        .btn-roll-dice {
            background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white;
            padding: 15px 36px; border-radius: 50px; font-weight: 700; border: none;
            font-size: 1.05rem; cursor: pointer; box-shadow: 0 8px 25px rgba(124, 61, 237, 0.3);
            margin-top: 30px; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-roll-dice:active { transform: scale(0.96); }

        @keyframes smoothReveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .no-result { text-align: center; color: #475569; padding: 60px 20px; font-size: 1rem; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
    </style>

    let currentTab = 'study';
    let favorites = JSON.parse(localStorage.getItem('termNewFavs')) || [];
    let lastScrollTop = 0;
    
    const contentBox = document.getElementById('app-content');
    const headerNav = document.getElementById('dynamicHeader');

    /* ================= SMOOTH SCROLL HIDE SYSTEM ================= */
    contentBox.addEventListener('scroll', () => {
        if(currentTab === 'random') return; 
        let scrollTop = contentBox.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 75) {
            headerNav.classList.add('header-hidden');
        } else {
            headerNav.classList.remove('header-hidden');
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });

    function handleFavToggle(id) {
        if(favorites.includes(id)) {
            favorites = favorites.filter(fId => fId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('termNewFavs', JSON.stringify(favorites));
        
        const targetBtn = document.getElementById(`fav-btn-${id}`);
        if(targetBtn) targetBtn.classList.toggle('active');
        
        if(currentTab === 'favorites') { renderApplication(); }
    }

    function handleCardExpansion(card) {
        if(currentTab === 'study') return; 
        card.classList.toggle('open');
    }

    function handleTabSwitch(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + tabId).classList.add('active');
        
        const searchInputBox = document.getElementById('searchContainer');
        if(tabId === 'random') {
            searchInputBox.style.display = 'none';
        } else {
            searchInputBox.style.display = 'block';
        }
        
        renderApplication();
        contentBox.scrollTo({ top: 0 });
    }

    function triggerSearch() {
        renderApplication();
    }

    /* ================= RANDOM FLASHCARD ENGINE ================= */
    function loadNextRandomFlashcard() {
        const placeholder = document.getElementById('randomFlashcardBox');
        if(!placeholder) return;
        
        const item = termData[Math.floor(Math.random() * termData.length)];
        const color = themeColors[item.id % themeColors.length];
        const isFav = favorites.includes(item.id);
        
        placeholder.innerHTML = `
            <div class="card clickable-trigger animate-fade" onclick="handleCardExpansion(this)">
                <button class="fav-btn ${isFav ? 'active' : ''}" id="fav-btn-${item.id}" onclick="handleFavToggle(${item.id}); event.stopPropagation();">★</button>
                <div class="term-title" style="color: ${color}">${item.id}. ${item.en}</div>
                <p style="color: #475569; font-size:0.9rem; margin-bottom:4px;">টাচ করে উত্তর দেখুন</p>
                <div class="hidden-details">
                    <div class="pronunciation-line">উচ্চারণ: ${item.pr}</div>
                    <div class="meaning-line" style="border-left-color: var(--accent-purple);">${item.bn}</div>
                </div>
            </div>
        `;
    }

    function renderApplication() {
        if(currentTab === 'random') {
            contentBox.innerHTML = `
                <div class="random-wrapper">
                    <div class="notice-badge">🧠 Self-Check Mode</div>
                    <div class="random-box-holder" id="randomFlashcardBox"></div>
                    <button class="btn-roll-dice" onclick="loadNextRandomFlashcard()">
                        🎲 Next
                    </button>
                </div>
            `;
            loadNextRandomFlashcard();
            return;
        }

        const query = document.getElementById('searchInput').value.toLowerCase();
        let listData = termData.filter(item => item.en.toLowerCase().includes(query) || item.bn.includes(query));

        if(currentTab === 'favorites') {
            listData = listData.filter(item => favorites.includes(item.id));
        }

        let outputHTML = '';
        listData.forEach((item, index) => {
            const color = themeColors[index % themeColors.length];
            const isFav = favorites.includes(item.id);
            const cardInnerDetails = `
                <div class="pronunciation-line">🗣️ ${item.pr}</div>
                <div class="meaning-line">${item.bn}</div>
            `;

            if(currentTab === 'practice') {
                outputHTML += `
                    <div class="card clickable-trigger" onclick="handleCardExpansion(this)">
                        <button class="fav-btn ${isFav ? 'active' : ''}" id="fav-btn-${item.id}" onclick="handleFavToggle(${item.id}); event.stopPropagation();">★</button>
                        <div class="term-title" style="color: ${color}">${item.id}. ${item.en}</div>
                        <p style="color: #475569; font-size:0.85rem; margin-bottom:4px;"></p>
                        <div class="hidden-details">${cardInnerDetails}</div>
                    </div>
                `;
            } else {
                outputHTML += `
                    <div class="card">
                        <button class="fav-btn ${isFav ? 'active' : ''}" id="fav-btn-${item.id}" onclick="handleFavToggle(${item.id}); event.stopPropagation();">★</button>
                        <div class="term-title" style="color: ${color}">${item.id}. ${item.en}</div>
                        ${cardInnerDetails}
                    </div>
                `;
            }
        });

        contentBox.innerHTML = outputHTML || '<div class="no-result">কোনো শব্দ খুঁজে পাওয়া যায়নি! 😞</div>';
    }

    // Direct initialization
    renderApplication();
