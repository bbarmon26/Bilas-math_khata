<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বিপরীত শব্দ মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg: #070314;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00f2fe;
            --neon-purple: #7f00ff;
            --neon-gold: #ffbe0b;
            --neon-pink: #ff007f;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 90px;
            background-image: radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.18) 0%, transparent 45%),
                              radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.18) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Fixed Header with Auto-hide on Scroll */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(7, 3, 20, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 20px 18px 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-header { text-align: center; margin-bottom: 8px; }
        .brand-name {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: inline-block;
        }

        .header-controls {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
        }

        .top-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 9px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .fav-filter-btn {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.12);
        }

        .fav-filter-btn.active-view {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .last-read-btn {
            border-color: var(--neon-gold);
            color: var(--neon-gold);
            background: rgba(255, 190, 11, 0.12);
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 210px 20px 30px 20px;
        }

        .progress-text {
            text-align: center;
            color: var(--neon-gold);
            margin-bottom: 22px;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 190, 11, 0.3);
        }

        .item-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 18px; 
            scroll-margin-top: 220px;
        }

        .serial { 
            color: var(--neon-cyan); 
            font-weight: 700; 
            font-size: 14px; 
            min-width: 30px; 
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        .card {
            flex-grow: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            box-sizing: border-box;
            gap: 10px;
        }

        .word { 
            font-size: 19px; 
            color: #f1f5f9; 
            font-weight: 500; 
            transition: 0.4s;
            flex: 1;
        }
        
        .antonym {
            font-size: 22px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 15px rgba(255, 190, 11, 0.6);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: right;
            white-space: nowrap;
        }

        /* কার্ডের ১০ প্রকার বৈচিত্র্যময় অ্যানিমেশন */
        .card.type-1.show .antonym { opacity: 1; transform: translateX(0); }
        .card.type-1 .antonym { transform: translateX(-40px); }

        .card.type-2.show .antonym { opacity: 1; transform: scale(1); }
        .card.type-2 .antonym { transform: scale(0.2); }

        .card.type-3.show .antonym { opacity: 1; transform: rotate(0deg) scale(1); }
        .card.type-3 .antonym { transform: rotate(180deg) scale(0.2); }

        .card.type-4.show .antonym { opacity: 1; transform: translateX(0); }
        .card.type-4 .antonym { transform: translateX(40px); }

        .card.type-5.show .antonym { opacity: 1; transform: translateY(0); }
        .card.type-5 .antonym { transform: translateY(30px); }

        .card.type-6.show .antonym { opacity: 1; transform: translateY(0); }
        .card.type-6 .antonym { transform: translateY(-30px); }

        .card.type-7.show .antonym { opacity: 1; transform: skewX(0deg) scale(1); }
        .card.type-7 .antonym { transform: skewX(30deg) scale(0.6); }

        .card.type-8.show .antonym { opacity: 1; transform: scale(1); }
        .card.type-8 .antonym { transform: scale(1.4); opacity: 0; }

        .card.type-9.show .antonym { opacity: 1; transform: rotateX(0deg); }
        .card.type-9 .antonym { transform: perspective(300px) rotateX(90deg); }

        .card.type-10.show .antonym { opacity: 1; filter: blur(0px); transform: scale(1); }
        .card.type-10 .antonym { filter: blur(8px); transform: scale(0.8); }

        .card.show .word {
            opacity: 0.35;
            transform: scale(0.96);
        }

        .item-fav-btn { 
            font-size: 24px; 
            color: rgba(255, 255, 255, 0.15); 
            cursor: pointer; 
            transition: 0.3s; 
            padding: 5px;
            user-select: none;
        }
        .item-fav-btn:hover { transform: scale(1.2); }
        .item-fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Rocket Hub Navigator */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 16, 61, 0.96);
            padding: 20px 12px;
            border-radius: 50px;
            border: 1px solid var(--neon-cyan);
            margin-bottom: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease;
        }

        .r-circle {
            width: 46px;
            height: 46px;
            background: #12092f;
            border: 1px solid var(--neon-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 19px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .r-circle:hover { background: var(--neon-purple); }

        .jump-box {
            width: 48px;
            height: 38px;
            background: #000;
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .go-btn { 
            background: var(--neon-pink); 
            border: none; 
            padding: 7px; 
            border-radius: 8px; 
            font-weight: bold; 
            color: #fff; 
            cursor: pointer; 
            font-size: 12px;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .rocket-icon {
            font-size: 45px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            transition: 0.3s;
            user-select: none;
        }
        .rocket-icon:hover { transform: scale(1.1); }

        @keyframes slideUp { 
            from { transform: translateY(25px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
    </style>
</head>

// বর্ণানুক্রমিক (অ থেকে ঁ) সর্ট করার এক্সট্রা লাইন:
    const data = rawData.sort((a, b) => a.w.localeCompare(b.w, 'bn'));

    let favorites = JSON.parse(localStorage.getItem('antonymFavs_v10')) || [];
    let showFavsOnly = false;

    // Scroll Logic for Header Auto-Hide
    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) {
            header.classList.add('header-hide');
        } else {
            header.classList.remove('header-hide');
        }
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function toggleFavView() {
        showFavsOnly = !showFavsOnly;
        const btn = document.getElementById('favFilterBtn');
        if (showFavsOnly) {
            btn.innerText = "📖 সব দেখুন";
            btn.classList.add('active-view');
        } else {
            btn.innerText = "⭐ ফেভারিট";
            btn.classList.remove('active-view');
        }
        renderList();
    }

    function renderList() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        let activeData = showFavsOnly ? data.filter((_, idx) => favorites.includes(idx)) : data;
        
        if (showFavsOnly) {
            document.getElementById('progress-info').innerText = `⭐ ফেভারিট তালিকা (মোট ${activeData.length} টি)`;
        } else {
            document.getElementById('progress-info').innerText = `মোট বিপরীত শব্দ: ${data.length} টি`;
        }

        if (activeData.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#999; margin-top:40px; font-size:16px;">কোনো শব্দ পাওয়া যায়নি!</div>`;
            return;
        }

        activeData.forEach((item, index) => {
            const originalIndex = data.indexOf(item);
            const isFav = favorites.includes(originalIndex);
            const animType = (index % 10) + 1; // ১০টি আলাদা ইফেক্ট

            const div = document.createElement('div');
            div.className = `item-wrapper`;
            div.id = `item-${originalIndex + 1}`;
            div.innerHTML = `
                <span class="serial">${originalIndex + 1}</span>
                <div class="card type-${animType}" onclick="toggleCard(this, ${originalIndex + 1})">
                    <div class="card-inner">
                        <span class="word">${item.w}</span>
                        <span class="antonym">${item.a}</span>
                    </div>
                </div>
                <div class="item-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${originalIndex})">❤️</div>
            `;
            list.appendChild(div);
        });
    }

    function toggleCard(cardElement, itemNumber) {
        cardElement.classList.toggle('show');
        // শেষ পড়ার পজিশন সেভ
        localStorage.setItem('antonymLastRead_v10', itemNumber);
    }

    function toggleFav(e, originalIndex) {
        e.stopPropagation();
        const pos = favorites.indexOf(originalIndex);
        if (pos === -1) favorites.push(originalIndex);
        else favorites.splice(pos, 1);
        localStorage.setItem('antonymFavs_v10', JSON.stringify(favorites));
        renderList();
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        } else {
            alert('এই নম্বরের কোনো শব্দ খুঁজে পাওয়া যায়নি!');
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('antonymLastRead_v10');
        if (last) {
            const el = document.getElementById(`item-${last}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } else {
            alert('এখনো কোনো শেষ পড়া সেভ করা হয়নি!');
        }
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    renderList();
</script>
