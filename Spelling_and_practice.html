<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilas Academy - Typing & Spelling Master v7</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark-purple: #1e0b2b;
            --panel-bg: #2d1340;
            --box-bg: #3b1d52;
            --accent-green: #a7f3d0;
            --accent-green-glow: #34d399;
            --accent-yellow: #fde047;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --error-red: #ef4444;
            --correct-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark-purple);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header */
        .main-header {
            width: 100%;
            background: linear-gradient(90deg, #2d1340 0%, #4c1d6f 50%, #2d1340 100%);
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid rgba(167, 243, 208, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .main-header h1 {
            color: var(--accent-green);
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(167, 243, 208, 0.4);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 0 15px;
            margin-bottom: 50px;
        }

        /* Tabs & Language Selector */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(167, 243, 208, 0.1);
            color: var(--accent-green);
            border-bottom: 3px solid var(--accent-green);
        }
        
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .lang-btn {
            padding: 8px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .lang-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= TYPING MODE (Laptop) ================= */
        .typing-panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .typing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .timer {
            background: var(--error-red);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* NEW: Display Mode Selector */
        .display-mode-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .mode-btn {
            padding: 6px 15px;
            margin: 0 5px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .mode-btn.active {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 10px rgba(253, 224, 71, 0.4);
        }

        .word-stream {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            min-height: 150px;
            max-height: 220px;
            overflow-y: auto;
            font-size: 1.4rem;
            line-height: 2.2;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stream-word {
            display: inline-block;
            margin-right: 12px;
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .stream-word.active {
            background: rgba(167, 243, 208, 0.2);
            color: var(--accent-green);
            font-weight: bold;
        }
        .stream-word.correct { color: var(--correct-green); }
        .stream-word.wrong { color: var(--error-red); text-decoration: line-through; }

        textarea.type-input {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 1.3rem;
            padding: 15px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea.type-input:focus { border-color: var(--accent-green); }

        .btn-group-typing {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-start {
            width: 100%;
            padding: 15px;
            background: var(--accent-green);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .btn-finish {
            width: 100%;
            padding: 15px;
            background: var(--accent-blue);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            transition: 0.3s;
        }
        .btn-finish:hover { background: #2563eb; }

        .btn-reload {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Result Report */
        .result-report {
            display: none;
            margin-top: 25px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(167, 243, 208, 0.3);
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .report-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .report-item span:last-child { font-weight: bold; color: var(--accent-green); }
        
        .mistake-analysis {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }
        .mistake-analysis h3 { color: #fca5a5; margin-bottom: 15px; text-align: center; }
        .mistake-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.2);
        }
        .mistake-table th, .mistake-table td {
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .mistake-table th { background: rgba(255,255,255,0.05); color: var(--accent-yellow); }
        .m-wrong { color: var(--error-red); }
        .m-right { color: var(--correct-green); font-weight: bold; }

        /* ================= STUDY MODE ================= */
        .study-panel {
            background: var(--panel-bg);
            padding: 20px 10px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        
        .study-top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-dark-purple);
            color: white;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 14px;
            color: var(--text-muted);
        }

        .btn-study-action {
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-fav { background: #dcfce7; color: #166534; box-shadow: 0 0 10px rgba(167, 243, 208, 0.5); }
        .btn-last { background: #e0e7ff; color: #3730a3; box-shadow: 0 0 10px rgba(224, 231, 255, 0.5); }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 5px;
            padding-bottom: 60px;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: var(--box-bg);
            border-radius: 8px;
            border: 1px dashed rgba(255,255,255,0.1);
            padding: 12px 15px;
            transition: 0.2s;
        }

        .item-number {
            width: 50px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .item-word-area {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .word-wrong { color: var(--text-main); transition: 0.2s; }
        .word-arrow { color: var(--text-muted); display: none; }
        .word-right { color: var(--correct-green); display: none; }
        
        .list-item.revealed .word-wrong { text-decoration: line-through; color: var(--error-red); }
        .list-item.revealed .word-arrow { display: inline; }
        .list-item.revealed .word-right { display: inline; animation: fadeIn 0.3s; }

        .item-star {
            width: 30px;
            text-align: right;
            cursor: pointer;
            color: #4b5563;
            font-size: 1.2rem;
        }
        .item-star.active { color: var(--accent-yellow); text-shadow: 0 0 10px var(--accent-yellow); }

        /* Floating Rocket Menu */
        .rocket-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        .rocket-btn {
            background: #312e81;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .rocket-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(167, 243, 208, 0.4); }
        
        .rocket-menu {
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(30, 11, 43, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            width: 150px;
        }
        .rocket-menu.show { display: flex; animation: fadeIn 0.2s; }
        .rm-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
        }
        .rm-btn:hover { background: rgba(255,255,255,0.1); color: var(--accent-green); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>✨ BILAS ACADEMY ✨</h1>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchMode('typing')"><i class="fas fa-laptop-code"></i> লাইভ টাইপিং 🖥️⌨️</button>
            <button class="tab-btn" onclick="switchMode('study')"><i class="fas fa-mobile-alt"></i> বানান (অনুশীলন)</button>
        </div>
        
        <div class="lang-selector">
            <button class="lang-btn active" id="btn-bn" onclick="setLanguage('bn')">বাংলা</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
        </div>

        <div id="typing-panel" class="view-panel active typing-panel">
            <div class="typing-header">
                <h3 style="color:var(--accent-green);" id="typingTitle">টাইপিং স্পিড টেস্ট (৫ মিনিট - ১৫০ শব্দ)</h3>
                <div class="timer" id="timerClock">05:00</div>
            </div>

            <div class="display-mode-selector">
                <span style="color:var(--text-muted); margin-right:10px; font-weight:bold;"><i class="fas fa-eye"></i> :</span>
                <button class="mode-btn active" id="btn-mode-wrong" onclick="setDisplayMode('wrong')">❌</button>
                <button class="mode-btn" id="btn-mode-right" onclick="setDisplayMode('right')">✅</button>
            </div>

            <div class="word-stream" id="wordStream">
                </div>

            <textarea id="typeInput" class="type-input" placeholder="পরীক্ষা শুরু করতে নিচের বাটনে ক্লিক করুন..." disabled spellcheck="false" autocomplete="off"></textarea>
            
            <div class="btn-group-typing">
                <button class="btn-start" id="startBtn" onclick="startExam()">Start</button>
                <button class="btn-finish" id="finishBtn" onclick="finishExam()" style="display:none;"><i class="fas fa-check-circle"></i> </button>
                <button class="btn-reload" id="reloadBtn" onclick="reloadExam()" style="display:none;"><i class="fas fa-sync-alt"></i> পুনরায় শুরু করুন </button>
            </div>

            <div class="result-report" id="resultReport">
                <h3 style="text-align: center; color: var(--accent-green); margin-bottom: 15px;">📊 টাইপিং পরীক্ষার রিপোর্ট</h3>
                <div class="report-grid">
                    <div class="report-item"><span>WPM (Without Space):</span><span id="repWpmNoSpace">0</span></div>
                    <div class="report-item"><span>WPM (With Space):</span><span id="repWpmSpace">0</span></div>
                    <div class="report-item"><span>Accuracy:</span><span id="repAccuracy">0%</span></div>
                    <div class="report-item"><span>Total Words Typed:</span><span id="repTotal">0</span></div>
                    <div class="report-item"><span>Correct Words:</span><span id="repCorrect">0</span></div>
                    <div class="report-item"><span>Mistakes:</span><span id="repMistake">0</span></div>
                </div>
                
                <div class="mistake-analysis" id="mistakeAnalysisBox">
                    <h3>❌ ভুলগুলোর বিশ্লেষণ</h3>
                    <div style="max-height: 200px; overflow-y: auto;">
                        <table class="mistake-table" id="mistakeTable">
                            <tr><th>আপনি টাইপ করেছেন</th><th>সঠিক বানানটি হতো</th></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="study-panel" class="view-panel study-panel">
            <div class="study-top-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="বানান খুঁজুন..." onkeyup="filterStudyList()">
                </div>
                <button class="btn-study-action btn-fav" onclick="toggleFavFilter()"><i class="fas fa-star"></i> ফেভারিটগুলো</button>
                <button class="btn-study-action btn-last" onclick="goToLastRead()"><i class="fas fa-clock"></i> শেষ পড়া স্থানে যান</button>
            </div>

            <div class="list-container" id="studyList">
                </div>

            <div class="rocket-container">
                <div class="rocket-menu" id="rocketMenu">
                    <button class="rm-btn" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i> Page Up</button>
                    <button class="rm-btn" onclick="scrollToBottom()"><i class="fas fa-arrow-down"></i> Page Down</button>
                    <button class="rm-btn" onclick="promptJump()"><i class="fas fa-hashtag"></i> Number Search</button>
                </div>
                <div class="rocket-btn" onclick="toggleRocketMenu()">
                    🚀
                </div>
            </div>
        </div>
    </div>

<script>
    // =======================================================
    // আপনার সম্পূর্ণ ডাটাবেস (const db) ঠিক এখান থেকে শুরু করুন
    // =======================================================

    const db = [
        // এখানে আপনার সব ডেটা পেস্ট করুন...
    ];

    // =======================================================
    // ডাটাবেস পেস্ট করার জায়গা শেষ
    // =======================================================

    /* ================= GLOBAL, TABS & LANGUAGE ================= */
    let currentLang = 'bn';
    let typingDisplayMode = 'wrong'; // Default: shows wrong words

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('btn-bn').classList.remove('active');
        document.getElementById('btn-en').classList.remove('active');
        document.getElementById('btn-' + lang).classList.add('active');
        
        if (document.getElementById('typing-panel').classList.contains('active')) {
            reloadExam();
        } else {
            renderStudyList();
        }
    }

    function switchMode(mode) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        
        if (mode === 'typing') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('typing-panel').classList.add('active');
            reloadExam();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('study-panel').classList.add('active');
            renderStudyList();
        }
    }

    // Set Display Mode (Wrong or Right word to show in box)
    function setDisplayMode(mode) {
        typingDisplayMode = mode;
        document.getElementById('btn-mode-wrong').classList.remove('active');
        document.getElementById('btn-mode-right').classList.remove('active');
        document.getElementById('btn-mode-' + mode).classList.add('active');
        
        reloadExam();
    }

    function getFilteredDb() {
        return db.filter(item => {
            const itemLang = item.lang || 'bn';
            return itemLang === currentLang;
        });
    }

    /* ================= TYPING MODE LOGIC ================= */
    let typingWords = [];
    let isTypingActive = false;
    let timerRef = null;
    let timeLeft = 300; 
    const wordStream = document.getElementById('wordStream');
    const typeInput = document.getElementById('typeInput');
    const timerClock = document.getElementById('timerClock');
    const reportBox = document.getElementById('resultReport');

    function generateStream() {
        wordStream.innerHTML = '';
        typingWords = [];
        const activeDb = getFilteredDb();
        
        if(activeDb.length === 0) {
            wordStream.innerHTML = `<p style="color:var(--text-muted); text-align:center;">দয়া করে ডাটাবেস (const db) যুক্ত করুন!</p>`;
            document.getElementById('startBtn').disabled = true;
            return;
        }
        document.getElementById('startBtn').disabled = false;

        for (let i = 0; i < 150; i++) {
            const randomItem = activeDb[Math.floor(Math.random() * activeDb.length)];
            typingWords.push(randomItem);
            
            // Choose which word to display based on the toggle setting
            const wordToShow = typingDisplayMode === 'wrong' ? randomItem.wrong : randomItem.right;
            
            const span = document.createElement('span');
            span.innerText = wordToShow;
            span.className = 'stream-word';
            span.id = 'tw-' + i;
            wordStream.appendChild(span);
        }
        highlightWord(0);
    }

    function highlightWord(index) {
        document.querySelectorAll('.stream-word').forEach(w => w.classList.remove('active'));
        const target = document.getElementById('tw-' + index);
        if (target) {
            target.classList.add('active');
            wordStream.scrollTop = target.offsetTop - wordStream.offsetTop - 40;
        }
    }

    function startExam() {
        reportBox.style.display = 'none';
        generateStream();
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('finishBtn').style.display = 'block';
        document.getElementById('reloadBtn').style.display = 'block';
        
        typeInput.disabled = false;
        typeInput.value = '';
        typeInput.placeholder = "শুদ্ধ বানান টাইপ করে একটি করে স্পেস (Space) দিন...";
        typeInput.focus();
        isTypingActive = true;
        timeLeft = 300;

        timerRef = setInterval(() => {
            timeLeft--;
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerClock.innerText = `${m}:${s}`;
            if (timeLeft <= 0) finishExam();
        }, 1000);
    }

    function reloadExam() {
        clearInterval(timerRef);
        timerClock.innerText = "05:00";
        typeInput.value = '';
        typeInput.disabled = true;
        isTypingActive = false;
        reportBox.style.display = 'none';
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('finishBtn').style.display = 'none';
        document.getElementById('reloadBtn').style.display = 'none';
        generateStream();
    }

    typeInput.addEventListener('input', () => {
        if (!isTypingActive) return;
        const text = typeInput.value;
        const words = text.trimStart().split(/\\s+/);
        let ptr = words.length - 1;
        if (text.endsWith(' ')) ptr = words.length;
        highlightWord(ptr);
    });

    function finishExam() {
        clearInterval(timerRef);
        isTypingActive = false;
        typeInput.disabled = true;
        document.getElementById('finishBtn').style.display = 'none';

        const typedText = typeInput.value.trim();
        const typedArr = typedText.length > 0 ? typedText.split(/\\s+/) : [];
        
        let correctCount = 0;
        let mistakes = 0;
        let mistakeDetails = [];

        // Evaluation always compares against the 'right' word, regardless of display mode
        for (let i = 0; i < typedArr.length; i++) {
            if (i < typingWords.length) {
                const domWord = document.getElementById('tw-' + i);
                if (typedArr[i] === typingWords[i].right) {
                    correctCount++;
                    if(domWord) domWord.className = 'stream-word correct';
                } else {
                    mistakes++;
                    if(domWord) domWord.className = 'stream-word wrong';
                    mistakeDetails.push({ typed: typedArr[i], correct: typingWords[i].right });
                }
            }
        }

        const charsWithSpace = typedText.length;
        const charsWithoutSpace = typedText.replace(/\\s+/g, '').length;
        const timeSpentSec = 300 - timeLeft;
        const minsPassed = timeSpentSec > 0 ? timeSpentSec / 60 : 1/60;
        
        const wpmWith = Math.round((charsWithSpace / 5) / minsPassed);
        const wpmWithout = Math.round((charsWithoutSpace / 5) / minsPassed);
        const acc = typedArr.length > 0 ? Math.round((correctCount / typedArr.length) * 100) : 0;

        document.getElementById('repWpmNoSpace').innerText = wpmWithout;
        document.getElementById('repWpmSpace').innerText = wpmWith;
        document.getElementById('repAccuracy').innerText = acc + '%';
        document.getElementById('repTotal').innerText = typedArr.length;
        document.getElementById('repCorrect').innerText = correctCount;
        document.getElementById('repMistake').innerText = mistakes;

        const mTable = document.getElementById('mistakeTable');
        mTable.innerHTML = '<tr><th>আপনি টাইপ করেছেন</th><th>সঠিক বানানটি হতো</th></tr>';
        if (mistakeDetails.length === 0) {
            mTable.innerHTML += '<tr><td colspan="2" style="color:#10b981; font-weight:bold;">অসাধারণ! কোনো ভুল নেই। Passed!</td></tr>';
        } else {
            mistakeDetails.forEach(m => {
                mTable.innerHTML += `<tr><td class="m-wrong">${m.typed}</td><td class="m-right">${m.correct}</td></tr>`;
            });
        }

        reportBox.style.display = 'block';
    }

    /* ================= STUDY MODE LOGIC ================= */
    const studyListDom = document.getElementById('studyList');
    let showingFavsOnly = false;
    
    function getFavs() { return JSON.parse(localStorage.getItem('bilas_favs') || '[]'); }
    function setFavs(favs) { localStorage.setItem('bilas_favs', JSON.stringify(favs)); }
    function getLastRead() { return localStorage.getItem('bilas_last_read'); }
    function setLastRead(id) { localStorage.setItem('bilas_last_read', id); }

    function renderStudyList(filterText = '') {
        studyListDom.innerHTML = '';
        const favs = getFavs();
        const activeDb = getFilteredDb();
        
        let displayCount = 0;

        activeDb.forEach((item) => {
            if (showingFavsOnly && !favs.includes(item.id)) return;
            if (filterText && !item.wrong.toLowerCase().includes(filterText.toLowerCase()) && !item.right.toLowerCase().includes(filterText.toLowerCase())) return;

            displayCount++;
            const isFav = favs.includes(item.id);
            
            const div = document.createElement('div');
            div.className = 'list-item';
            div.id = 'list-item-' + item.id;
            div.innerHTML = `
                <div class="item-number">${displayCount}.</div>
                <div class="item-word-area" onclick="revealStudyWord(${item.id})">
                    <span class="word-wrong">${item.wrong}</span>
                    <span class="word-arrow"> ➔ </span>
                    <span class="word-right">${item.right}</span>
                </div>
                <div class="item-star ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id}, this); event.stopPropagation();">
                    <i class="fas fa-star"></i>
                </div>
            `;
            studyListDom.appendChild(div);
        });

        if(displayCount === 0) {
            studyListDom.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">কোনো ডেটা পাওয়া যায়নি!</p>`;
        }
    }

    function revealStudyWord(id) {
        const row = document.getElementById('list-item-' + id);
        if (row) {
            row.classList.toggle('revealed');
            setLastRead(id);
        }
    }

    function toggleFav(id, starElement) {
        let favs = getFavs();
        if (favs.includes(id)) {
            favs = favs.filter(fid => fid !== id);
            starElement.classList.remove('active');
            if(showingFavsOnly) renderStudyList();
        } else {
            favs.push(id);
            starElement.classList.add('active');
        }
        setFavs(favs);
    }

    function filterStudyList() {
        const text = document.getElementById('searchInput').value.trim();
        renderStudyList(text);
    }

    function toggleFavFilter() {
        showingFavsOnly = !showingFavsOnly;
        document.querySelector('.btn-fav').style.background = showingFavsOnly ? '#fde047' : '#dcfce7';
        document.querySelector('.btn-fav').style.color = showingFavsOnly ? '#854d0e' : '#166534';
        renderStudyList(document.getElementById('searchInput').value);
    }

    function goToLastRead() {
        const lastId = getLastRead();
        if (lastId) {
            showingFavsOnly = false;
            document.querySelector('.btn-fav').style.background = '#dcfce7';
            renderStudyList();
            
            setTimeout(() => {
                const target = document.getElementById('list-item-' + lastId);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.style.border = "2px solid #a7f3d0";
                    setTimeout(()=> target.style.border = "1px dashed rgba(255,255,255,0.1)", 2000);
                }
            }, 100);
        } else {
            alert("আপনি এখনো কোনো শব্দ পড়েননি!");
        }
    }

    /* ================= ROCKET MENU LOGIC ================= */
    const rMenu = document.getElementById('rocketMenu');
    function toggleRocketMenu() { rMenu.classList.toggle('show'); }
    function scrollToTop() { studyListDom.scrollTo({ top: 0, behavior: 'smooth' }); rMenu.classList.remove('show'); }
    function scrollToBottom() { studyListDom.scrollTo({ top: studyListDom.scrollHeight, behavior: 'smooth' }); rMenu.classList.remove('show'); }

    function promptJump() {
        rMenu.classList.remove('show');
        const num = prompt("কত নম্বর শব্দে যেতে চান?");
        if (num && !isNaN(num)) {
            showingFavsOnly = false;
            renderStudyList();
            setTimeout(() => {
                // Find by displayed visual number (displayCount)
                const items = document.querySelectorAll('.list-item');
                let target = null;
                items.forEach(item => {
                    if(item.querySelector('.item-number').innerText.includes(num + ".")) {
                        target = item;
                    }
                });

                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.style.border = "2px solid var(--accent-yellow)";
                    setTimeout(()=> target.style.border = "1px dashed rgba(255,255,255,0.1)", 2000);
                } else {
                    alert("এই নম্বরের কোনো শব্দ এই তালিকায় নেই।");
                }
            }, 100);
        }
    }

    // Default initialization
    generateStream();
</script>

</body>
