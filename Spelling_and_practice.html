    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #06b6d4; /* Cyan */
            --accent-secondary: #ec4899; /* Pink */
            --accent-yellow: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-red: #ef4444;
            --correct-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevent body scroll, layout uses internal container scroll */
        }

        /* Full Screen Main Application Layout */
        .app-layout {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Auto-Hide Sticky Action Bar */
        .dynamic-header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* CSS Class to Auto Hide Header on Scroll Down */
        .header-hidden {
            transform: translateX(-50%) translateY(-100%);
        }
        
        /* Language Selector (Pill Badges) */
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        
        .lang-btn {
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .lang-btn.active#btn-bn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .lang-btn.active#btn-en {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        /* Study Action Area Inside Header */
        .study-top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 14px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .btn-study-action {
            height: 44px;
            width: 44px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-fav { 
            background: rgba(251, 191, 36, 0.08); 
            color: var(--accent-yellow); 
        }
        .btn-fav:hover { background: rgba(251, 191, 36, 0.18); }
        .btn-last { 
            background: rgba(6, 182, 212, 0.08); 
            color: var(--accent-primary); 
        }
        .btn-last:hover { background: rgba(6, 182, 212, 0.18); }

        /* Full Height Scrollable List Area */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 140px 16px 80px 16px; /* Dynamic padding top to compensate for fixed header */
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        /* Glassmorphism Cards */
        .list-item {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 16px 18px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .list-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .item-number {
            width: 44px;
            height: 32px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 1rem;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .item-word-area {
            flex: 1;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            padding: 4px;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .word-wrong { color: var(--text-main); transition: 0.25s; }
        .word-arrow { color: rgba(255,255,255,0.15); display: none; }
        .word-right { color: var(--correct-green); display: none; }
        
        /* Reveal Logic with Animations */
        .list-item.revealed {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.03), rgba(16, 185, 129, 0.03));
            border-color: rgba(16, 185, 129, 0.25);
        }
        .list-item.revealed .word-wrong { 
            text-decoration: line-through; 
            color: var(--error-red); 
            opacity: 0.6;
        }
        .list-item.revealed .word-arrow { 
            display: inline; 
            color: var(--text-muted);
            animation: slideRight 0.2s forwards;
        }
        .list-item.revealed .word-right { 
            display: inline; 
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; 
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-5px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .item-star {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            color: #475569;
            font-size: 1.15rem;
            transition: all 0.2s;
            background: rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .item-star.active { 
            color: var(--accent-yellow); 
            background: rgba(251, 191, 36, 0.1);
        }

        /* Floating Controls */
        .rocket-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 110;
        }
        .rocket-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .rocket-btn:hover { 
            transform: translateY(-3px); 
        }
        
        .rocket-menu {
            position: absolute;
            bottom: 66px;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            width: 160px;
        }
        .rocket-menu.show { display: flex; animation: fadeIn 0.2s; }
        
        .rm-btn {
            background: rgba(255,255,255,0.04);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rm-btn:hover { background: rgba(255,255,255,0.12); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>
</head>

            </div>
        </header>

        <!-- Main Scrollable Content List Container -->
        <div class="list-container" id="studyList">
            <!-- Items injected dynamically -->
        </div>

        <!-- Floating Action Rockets -->
        <div class="rocket-container">
            <div class="rocket-menu" id="rocketMenu">
                <button class="rm-btn" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i> Page Up</button>

            </div>
            <div class="rocket-btn" onclick="toggleRocketMenu()">
                🚀

        </div>
        
    </div>

    let currentLang = 'bn';
    const studyListDom = document.getElementById('studyList');
    const headerDom = document.getElementById('dynamicHeader');
    let showingFavsOnly = false;
    let lastScrollTop = 0;

    /* ================= DYNAMIC AUTO HIDE HEADER LOGIC ================= */
    studyListDom.addEventListener('scroll', () => {
        let scrollTop = studyListDom.scrollTop;
        
        // Hide Header on Scroll Down, Show on Scroll Up
        if (scrollTop > lastScrollTop && scrollTop > 60) {
            headerDom.classList.add('header-hidden');
        } else {
            headerDom.classList.remove('header-hidden');
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('btn-bn').classList.remove('active');
        document.getElementById('btn-en').classList.remove('active');
        document.getElementById('btn-' + lang).classList.add('active');
        renderStudyList();
        studyListDom.scrollTo({ top: 0 });
    }

    function getFilteredDb() {
        return db.filter(item => (item.lang || 'bn') === currentLang);
    }

    function getFavs() { return JSON.parse(localStorage.getItem('bilas_favs') || '[]'); }
    function setFavs(favs) { localStorage.setItem('bilas_favs', JSON.stringify(favs)); }
    function getLastRead() { return localStorage.getItem('bilas_last_read'); }
    function setLastRead(id) { localStorage.setItem('bilas_last_read', id); }

    function renderStudyList(filterText = '') {
        studyListDom.innerHTML = '';
        const favs = getFavs();
        const activeDb = getFilteredDb();
        
        let displayCount = 0;

        activeDb.forEach((item) => {
            if (showingFavsOnly && !favs.includes(item.id)) return;
            if (filterText && !item.wrong.toLowerCase().includes(filterText.toLowerCase()) && !item.right.toLowerCase().includes(filterText.toLowerCase())) return;

            displayCount++;
            const isFav = favs.includes(item.id);
            
            const div = document.createElement('div');
            div.className = 'list-item';
            div.id = 'list-item-' + item.id;
            div.innerHTML = `
                <div class="item-number">${displayCount}</div>
                <div class="item-word-area" onclick="revealStudyWord(${item.id})">
                    <span class="word-wrong">${item.wrong}</span>
                    <span class="word-arrow"><i class="fas fa-arrow-right"></i></span>
                    <span class="word-right">${item.right}</span>
                </div>
                <div class="item-star ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id}, this); event.stopPropagation();">
                    <i class="fas fa-star"></i>
                </div>
            `;
            studyListDom.appendChild(div);
        });

        if(displayCount === 0) {
            studyListDom.innerHTML = `<p style="color:var(--text-muted); text-align:center; font-size:1.1rem; padding-top:40px;">কোনো শব্দ পাওয়া যায়নি!</p>`;
        }
    }

    function revealStudyWord(id) {
        const row = document.getElementById('list-item-' + id);
        if (row) {
            row.classList.toggle('revealed');
            setLastRead(id);
        }
    }

    function toggleFav(id, starElement) {
        let favs = getFavs();
        if (favs.includes(id)) {
            favs = favs.filter(fid => fid !== id);
            starElement.classList.remove('active');
            if(showingFavsOnly) renderStudyList();
        } else {
            favs.push(id);
            starElement.classList.add('active');
        }
        setFavs(favs);
    }

    function filterStudyList() {
        const text = document.getElementById('searchInput').value.trim();
        renderStudyList(text);
    }

    function toggleFavFilter() {
        showingFavsOnly = !showingFavsOnly;
        const favBtn = document.querySelector('.btn-fav');
        if(showingFavsOnly) {
            favBtn.style.background = 'rgba(251, 191, 36, 0.2)';
            favBtn.style.borderColor = 'rgba(251, 191, 36, 0.4)';
        } else {
            favBtn.style.background = 'rgba(251, 191, 36, 0.08)';
            favBtn.style.borderColor = 'var(--glass-border)';
        }
        renderStudyList(document.getElementById('searchInput').value);
    }

    function goToLastRead() {
        const lastId = getLastRead();
        if (lastId) {
            showingFavsOnly = false;
            document.querySelector('.btn-fav').style.background = 'rgba(251, 191, 36, 0.08)';
            document.querySelector('.btn-fav').style.borderColor = 'var(--glass-border)';
            renderStudyList();
            
            setTimeout(() => {
                const target = document.getElementById('list-item-' + lastId);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.style.border = "2px solid var(--accent-primary)";
                    target.style.transform = "scale(1.02)";
                    setTimeout(() => {
                        target.style.border = "1px solid var(--glass-border)";
                        target.style.transform = "scale(1)";
                    }, 2000);
                }
            }, 100);
        } else {
            alert("আপনি এখনো কোনো শব্দ পড়েননি!");
        }
    }

    /* ================= ROCKET CONTROL MENU ================= */
    const rMenu = document.getElementById('rocketMenu');
    function toggleRocketMenu() { rMenu.classList.toggle('show'); }
    function scrollToTop() { studyListDom.scrollTo({ top: 0, behavior: 'smooth' }); rMenu.classList.remove('show'); }
    function scrollToBottom() { studyListDom.scrollTo({ top: studyListDom.scrollHeight, behavior: 'smooth' }); rMenu.classList.remove('show'); }

    function promptJump() {
        rMenu.classList.remove('show');
        const num = prompt("কত নম্বর শব্দে যেতে চান?");
        if (num && !isNaN(num)) {
            showingFavsOnly = false;
            renderStudyList();
            setTimeout(() => {
                const items = document.querySelectorAll('.list-item');
                let target = null;
                items.forEach(item => {
                    if(item.querySelector('.item-number').innerText === num) {
                        target = item;
                    }
                });

                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.style.border = "2px solid var(--accent-secondary)";
                    target.style.transform = "scale(1.02)";
                    setTimeout(() => {
                        target.style.border = "1px solid var(--glass-border)";
                        target.style.transform = "scale(1)";
                    }, 2000);
                } else {
                    alert("এই নম্বরের কোনো শব্দ এই তালিকায় নেই।");
                }
            }, 100);
        }
    }

    window.onload = () => {
        renderStudyList();
    };
</script>

</body>
</html>
