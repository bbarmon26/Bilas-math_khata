            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;

        body {

            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Header Section */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.98);
            backdrop-filter: blur(25px);
            padding: 10px 20px 20px 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-header { text-align: center; padding: 5px 0; }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 14px 25px;
            border-radius: 50px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        .top-btns { display: flex; gap: 10px; justify-content: center; }
        .btn {
            background: var(--glass);
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }

        /* Content Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 230px 20px 100px 20px;
        }

        .item-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            scroll-margin-top: 240px;
        }

        .serial { color: var(--neon-blue); font-weight: bold; font-size: 14px; min-width: 20px; opacity: 0.4; }

        /* Stable Glass Card */
        .card {
            flex-grow: 1;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .text-trigger {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .sentence { 
            font-size: 19px; 
            color: #d1d5db; 
            font-weight: 500; 
            text-align: center;
            transition: opacity 0.3s ease;
            width: 100%;
            user-select: none;
        }
        
        /* 85% Transparent (15% Opacity) */
        .faded { opacity: 0.15; }

        /* Answer Overlay (100% Solid) */
        .one-word {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(246, 211, 101, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            user-select: none;
        }

        .show-ans {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-btn { font-size: 24px; color: rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Smart Rocket Navigator */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 16, 61, 0.98);
            padding: 25px 12px;
            border-radius: 50px;
            border: 1px solid var(--neon-blue);
            margin-bottom: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;

            width: 50px;
            height: 50px;
            background: #1a103d;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;

            width: 50px;
            height: 40px;
            background: #000;
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 12px;
            font-size: 16px;

            filter: drop-shadow(0 0 15px var(--neon-blue));
            transition: 0.3s;

</head>

        data.forEach((item, index) => {

            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="magicFlip(${index})">

                        <div id="a-${index}" class="one-word">${item.a}</div>

    function magicFlip(index) {
        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        if (a.classList.contains('show-ans')) {
            q.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            q.classList.add('faded');
            a.classList.add('show-ans');
        }
        localStorage.setItem('bilasLastRead', index + 1);
    }

    function toggleFav(idx) {
        event.stopPropagation();
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);

        render();
    }

        }
    }

        let last = localStorage.getItem('bilasLastRead');
