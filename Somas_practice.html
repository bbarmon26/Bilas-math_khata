<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - সমাস মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --accent-cyan: #00e5ff;
            --accent-gold: #ffcf54;
            --accent-pink: #ff416c;
            --card-radius: 18px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(15, 12, 41, 0.92);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(0, 229, 255, 0.3);
            margin-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .top-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover, .btn.active-mode {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 207, 84, 0.4);
        }
        .btn-cyan { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-cyan.active-mode { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Container */
        .container { max-width: 720px; margin: 0 auto; padding: 220px 20px 100px 20px; }

        .item-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            scroll-margin-top: 230px;
        }

        .serial { 
            color: var(--accent-cyan); 
            font-weight: 700; 
            font-size: 15px; 
            min-width: 28px; 
            text-align: center;
            opacity: 0.7; 
        }

        /* Card Layout: Left Question, Right Answer */
        .card {
            flex-grow: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 16px 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 55px;
        }
        .card:hover {
            border-color: rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }
        .card:active { transform: scale(0.98); }

        /* Question on the Left */
        .q-text {
            font-size: 21px;
            color: var(--accent-gold);
            font-weight: 700;
            text-align: left;
            flex-shrink: 0;
        }

        /* Answer on the Right */
        .ans-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transform: translateX(25px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .ans-box.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .byasbakya-text {
            font-size: 17px;
            color: #ffffff;
            font-weight: 600;
        }

        .samas-badge {
            font-size: 13px;
            color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.12);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            align-self: flex-end;
            border: 1px solid rgba(0, 229, 255, 0.25);
        }

        .fav-btn { 
            font-size: 24px; 
            color: rgba(255,255,255,0.15); 
            cursor: pointer; 
            transition: 0.3s; 
            user-select: none;
        }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.active { 
            color: var(--accent-pink); 
            filter: drop-shadow(0 0 10px var(--accent-pink)); 
        }

        /* Rocket Navigator */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(15, 12, 41, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-cyan); margin-bottom: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s ease; }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; user-select: none; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-pink); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: var(--accent-pink); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px; }
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 10px var(--accent-cyan)); transition: 0.3s; user-select: none; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>

        <div class="top-btns">

            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">

    ];

    // Bornonukromik (A to Z) Auto-Sorting Logic
    const data = rawData.sort((a, b) => a.word.localeCompare(b.word, 'bn'));

    let favorites = JSON.parse(localStorage.getItem('bilasSamasFavs_v2')) || [];
    let showFavs = false;
    let currentMode = 'study'; // 'study' or 'practice'

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if (mode === 'study') {
            document.getElementById('modeStudy').classList.add('active-mode');
        } else {
            document.getElementById('modePractice').classList.add('active-mode');
        }
        render();
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const showClass = currentMode === 'study' ? 'show' : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="q-text">${item.word}</div>
                    <div id="ans-${index}" class="ans-box ${showClass}">
                        <div class="byasbakya-text">${item.byasbakya}</div>
                        <span class="samas-badge">${item.samas}</span>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${index})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasSamasLastRead_v2', index + 1);
        
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(e, idx) {
        e.stopPropagation();
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasSamasFavs_v2', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if (showFavs) {
            document.getElementById('favViewBtn').classList.add('active-mode');
        } else {
            document.getElementById('favViewBtn').classList.remove('active-mode');
        }
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        } else {
            alert('এই নম্বরের কোনো তথ্য পাওয়া যায়নি!');
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasSamasLastRead_v2');
        if (last) {
            const el = document.getElementById(`item-${last}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert('এখনো কোনো শেষ পড়া সেভ করা হয়নি!');
        }
    }

    render();
