    let currentCategory = 'All';
    let favorites = JSON.parse(localStorage.getItem('ow_favs_vFinal')) || [];

    function speakWord(text, event) {
        event.stopPropagation();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderWords(filterText = '') {
        const listContainer = document.getElementById('wordList');
        listContainer.innerHTML = '';

        const cleanFilter = filterText.trim().toLowerCase();

        const filtered = wordsData.filter(item => {
            const matchesSearch = item.word.toLowerCase().includes(cleanFilter) || 
                                  item.meaning.toLowerCase().includes(cleanFilter) || 
                                  item.pron.toLowerCase().includes(cleanFilter) ||
                                  item.def.toLowerCase().includes(cleanFilter) ||
                                  item.defBn.toLowerCase().includes(cleanFilter);
            
            if (currentCategory === 'All') return matchesSearch;
            if (currentCategory === 'Favorites') return matchesSearch && favorites.includes(item.sn);
            return matchesSearch && item.cat === currentCategory;
        });

        if(filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:30px;">কোনো মিল পাওয়া যায়নি!</p>';
            return;
        }

        filtered.forEach(item => {
            const isFav = favorites.includes(item.sn);
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = (e) => {
                if(e.target.closest('.card-actions') || e.target.closest('.audio-btn')) return;
                card.classList.toggle('open');
            };

            card.innerHTML = `
                <div class="card-header">
                    <div class="info-left">
                        <span class="sn-badge">#${item.sn}</span>
                        <div>
                            <div class="def-title">${item.def}</div>
                            <div class="click-hint">👆 অর্থ, উত্তর ও উচ্চারণ দেখতে ক্লিক করুন</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <span class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFav(${item.sn}, this, event)">★</span>
                    </div>
                </div>
                <div class="card-details">
                    <div class="def-bn-box">
                        <strong>বাক্যের অর্থ:</strong> ${item.defBn}
                    </div>
                    <div class="answer-row">
                        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                            <span class="word-tag">${item.word}</span>
                            <span class="pronun-tag">উচ্চারণ: ${item.pron}</span>
                        </div>
                        <button class="audio-btn" onclick="speakWord('${item.word.replace(/'/g, "\\'")}', event)">
                            🔊 শুনুন
                        </button>
                    </div>
                    <div class="meaning-title">বাংলা অর্থ: ${item.meaning}</div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function toggleFav(sn, element, event) {
        event.stopPropagation();
        if (favorites.includes(sn)) {
            favorites = favorites.filter(id => id !== sn);
            element.classList.remove('active');
        } else {
            favorites.push(sn);
            element.classList.add('active');
        }
        localStorage.setItem('ow_favs_vFinal', JSON.stringify(favorites));
        if(currentCategory === 'Favorites') renderWords(document.getElementById('searchBar').value);
    }

    function filterCategory(category) {
        currentCategory = category;
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');
        renderWords(document.getElementById('searchBar').value);
    }

    document.getElementById('searchBar').addEventListener('input', (e) => {
        renderWords(e.target.value);
    });

    renderWords();
</script>
