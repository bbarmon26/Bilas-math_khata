<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - লিঙ্গ পরিবর্তন প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            /* Royal Premium Colors */
            --bg-grad: linear-gradient(135deg, #0B0E14, #1A1F35, #0B0E14);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --accent-gold: #FFD700;
            --accent-ruby: #FF3366;
            --accent-glow: rgba(255, 215, 0, 0.4);
            --card-radius: 18px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dynamic Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 15px 20px 20px 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, var(--accent-gold), #FFAA00, var(--accent-ruby));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px var(--accent-glow);
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 14px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.4s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .search-box:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(20, 20, 30, 0.8);
        }

        .top-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ddd;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }
        .btn.active-mode {
            background: linear-gradient(135deg, var(--accent-gold), #FFAA00);
            color: #000;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Container */
        .container { max-width: 900px; margin: 0 auto; padding: 270px 20px 100px 15px; }

        .item-wrapper {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
            scroll-margin-top: 250px;
        }

        /* Serial */
        .serial { 
            color: var(--accent-gold); 
            font-weight: 800; 
            font-size: 18px; 
            width: 25px; 
            text-align: center;
            flex-shrink: 0;
            text-shadow: 0 2px 5px rgba(255, 215, 0, 0.3);
        }

        /* Premium Card */
        .card {
            flex: 1;
            background: rgba(26, 31, 53, 0.5);
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--accent-gold);
            border-radius: var(--card-radius);
            padding: 20px 25px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            min-width: 0;
        }
        .card:hover { 
            border-color: rgba(255, 215, 0, 0.4); 
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.1);
        }
        .card:active { transform: scale(0.98); }

        /* Left - Center - Right Layout */
        .card-body {
            display: flex;
            flex-direction: row !important;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0; 
            word-wrap: break-word;
        }

        .left-box { text-align: left; }
        .right-box { text-align: right; }

        .word-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .right-box .word-title {
            color: var(--accent-ruby);
            font-size: 22px;
        }

        .word-subtitle {
            font-size: 13px;
            color: var(--accent-gold);
            font-style: italic;
        }

        /* Center Fav */
        .center-fav-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 15px;
            flex-shrink: 0;
        }
        .center-fav-btn:hover { 
            color: #fff; 
            transform: scale(1.15); 
        }
        .center-fav-btn.active { 
            color: var(--accent-ruby); 
            filter: drop-shadow(0 0 8px var(--accent-ruby)); 
        }

        /* Blur Practice Effect */
        .ans-wrapper {
            position: relative;
            width: 100%;
        }

        .ans-inner {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ans-wrapper:not(.show) .ans-inner {
            filter: blur(6px);
            opacity: 0.15;
            transform: translateX(15px);
        }

        .ans-wrapper.show .ans-inner {
            filter: blur(0);
            opacity: 1;
            transform: translateX(0);
        }

        .tap-overlay {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: rgba(10, 15, 25, 0.85);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .ans-wrapper:not(.show) .tap-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* Mobile */
        @media screen and (max-width: 600px) {
            .container { padding-top: 260px; } 
            .card { padding: 15px 15px; }
            .word-title { font-size: 19px; }
            .right-box .word-title { font-size: 18px; }
            .word-subtitle { font-size: 11px; }
            .center-fav-btn { font-size: 22px; padding: 0 8px; }
            .tap-overlay { font-size: 11px; padding: 4px 8px; }
            .serial { font-size: 16px; width: 20px; }
        }

        /* Rocket */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(11, 14, 20, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-gold); margin-bottom: 15px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .r-circle:hover { background: var(--accent-gold); color: #000; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-ruby); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: linear-gradient(135deg, var(--accent-ruby), #ff0044); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px; transition: 0.3s;}
        .go-btn:hover { box-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 15px var(--accent-glow)); transition: transform 0.3s ease; }
        .rocket-icon:hover { transform: scale(1.1) translateY(-5px); }
        @keyframes slideUp { from { transform: translateY(20px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="header-section" id="header">
    <span class="brand-name">লিঙ্গ পরিবর্তন প্রো</span>
    <div style="max-width:900px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: বিদ্বান, সম্রাট, শিক্ষক)..." onkeyup="filter()">
        <div class="top-btns">
            <button class="btn active-mode" id="modeStudy" onclick="setMode('study')">📖 স্টাডি মোড</button>
            <button class="btn" id="modePractice" onclick="setMode('practice')">🎯 প্র্যাকটিস মোড</button>
            <button class="btn" id="favViewBtn" onclick="toggleFavView()">⭐ ফেভারিট</button>
            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<script>
    // CSV থেকে প্রসেসকৃত ৬৩টি লিঙ্গ পরিবর্তন ডেটা
    const data = [
        { w1: "কুমার", w2: "কুমারনী" },
        { w1: "ধাত্রী", w2: "ধাতা" },
        { w1: "সুকেশ", w2: "সুকেশা" },
        { w1: "অরণ্য", w2: "অরণ্যানী" },
        { w1: "গরীয়সী", w2: "গরীয়ান" },
        { w1: "শিক্ষক", w2: "শিক্ষিকা / শিক্ষয়িত্রী" },
        { w1: "তেজস্বী", w2: "তেজস্বিনী" },
        { w1: "চাকর", w2: "চাকরানি" },
        { w1: "বিদ্বান", w2: "বিদূষী" },
        { w1: "গরীয়ান", w2: "গরীয়সী" },
        { w1: "কর্তা", w2: "কর্ত্রী" },
        { w1: "সৎ", w2: "সতী" },
        { w1: "সম্রাট", w2: "সম্রাজ্ঞী" },
        { w1: "বাদশা", w2: "বেগম" },
        { w1: "শূদ্রানী", w2: "শূদ্র" },
        { w1: "ধনী", w2: "ধনিনী" },
        { w1: "নবীন", w2: "নবীনা" },
        { w1: "মানী", w2: "মানিনী" },
        { w1: "সতী", w2: "সৎ" },
        { w1: "মহৎ", w2: "মহতী" },
        { w1: "অজ", w2: "অজা" },
        { w1: "শিষ্য", w2: " শিষ্যা" },
        { w1: "অধ্যাপক", w2: "অধ্যাপিকা" },
        { w1: "সেবক", w2: "সেবিকা" },
        { w1: "রচয়িতা", w2: "রচয়িত্রী" },
        { w1: "অশ্ব", w2: "অশ্বী" },
        { w1: "জেলে", w2: "জেলেনি" },
        { w1: "সদাশয়", w2: "সদাশয়া" },
        { w1: "বেদে", w2: "বেদেনী" },
        { w1: "প্রতিনিধি", w2: "মহিলা প্রতিনিধি" },
        { w1: "অনুরোগী", w2: "অনুরোগিনী" },
        { w1: "ইন্দ্র", w2: "ইন্দ্রাণী" },
        { w1: "যোগী", w2: "যোগিনী" },
        { w1: "মামা", w2: "মামী" },
        { w1: "হরিণ", w2: "হরিণী" },
        { w1: "নারী", w2: "পুরুষ" },
        { w1: "যশস্বী", w2: "যশস্বতী" },
        { w1: "বিহঙ্গ", w2: "বিহঙ্গী" },
        { w1: "শুক", w2: "সারী" },
        { w1: "বীর", w2: "বীরাঙ্গনা" },
        { w1: "বোষ্টমী", w2: "বোষ্টম" },
        { w1: "কলুনী", w2: "কলু" },
        { w1: "নেতা", w2: "নেত্রী" },
        { w1: "বাঘ", w2: "বাঘিনী" },
        { w1: "নাপিত", w2: "নাপিতানী" },
        { w1: "পাঠক", w2: "পাঠিকা" },
        { w1: "বাঁদি", w2: "গোলাম" },
        { w1: "মালা", w2: "মালিকা" },
        { w1: "প্রবীণ", w2: "প্রবীণা" },
        { w1: "অনাথিনী", w2: "অনাথ" },
        { w1: "অষ্টাদশী", w2: "অষ্টাদশ" },
        { w1: "গয়লা", w2: "গয়লা বউ" },
        { w1: "মাতুল", w2: "মাতুলানী" },
        { w1: "সভাপতি", w2: "সভানেত্রী" },
        { w1: "কল্যাণীয়", w2: "কল্যাণীয়া" },
        { w1: "গুরু", w2: "গুর্বী" },
        { w1: "দৌহিত্র", w2: "দৌহিত্রী" },
        { w1: "মহীয়ান", w2: "মহীয়সী" },
        { w1: "জনক", w2: "জননী" },
        { w1: "মহাশয়", w2: "মহাশয়া" },
        { w1: "জনক", w2: "জননী বা জনিকা" },
        { w1: "কৃষক", w2: "কৃষাণী / কিষাণী" },
        { w1: "বুদ্ধিমান", w2: "বুদ্ধিমতী" }
    ];

    let favorites = JSON.parse(localStorage.getItem('bilasLingoFavs')) || [];
    let showFavs = false;
    let currentMode = 'study'; 

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if(mode === 'study') document.getElementById('modeStudy').classList.add('active-mode');
        else document.getElementById('modePractice').classList.add('active-mode');
        
        render();
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const showClass = currentMode === 'study' ? 'show' : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <div class="serial">${index + 1}</div>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="card-body">
                        <!-- Left Box -->
                        <div class="word-box left-box">
                            <span class="word-title">${item.w1}</span>
                            <span class="word-subtitle">মূল পদ</span>
                        </div>
                        
                        <!-- Center Favorite Button -->
                        <button class="center-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${index})">❤</button>

                        <!-- Right Box -->
                        <div id="ans-${index}" class="word-box right-box ans-wrapper ${showClass}">
                            <div class="ans-inner">
                                <span class="word-title">${item.w2}</span>
                                <span class="word-subtitle">পরিবর্তিত রূপ</span>
                            </div>
                            <div class="tap-overlay">👁️ Tap to view</div>
                        </div>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasLingoLastRead', index + 1);
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(event, idx) {
        event.stopPropagation();
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasLingoFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if(showFavs) document.getElementById('favViewBtn').classList.add('active-mode');
        else document.getElementById('favViewBtn').classList.remove('active-mode');
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasLingoLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Initial Render
    render();
</script>
</body>
</html>
