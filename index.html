                "orientation": "portrait"
            };
            const stringManifest = JSON.stringify(manifestObj);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                const swCode = `
                    self.addEventListener('install', function(e) { self.skipWaiting(); });
                    self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', function(e) {
                        e.respondWith(fetch(e.request));
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swURL = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swURL).catch(function(err) {
                    console.log('SW registration error:', err);
                });
            });
        }
    </script>

        .shelf-wood::before {

            justify-content: center;
            z-index: 12;

        .book-cover::after {

        .book-cover::before {
            content: ''; position: absolute; top: 2px; bottom: 2px; right: -4px; width: 4px;

        .book-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 0 4px; }
        
        .book-3d:hover { transform: translateY(-4px); }

        function refreshIcons() {
            try {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                }
            } catch (e) {}
        }

        /* 🕰️ Real-time Clock Engine */
        function updateClock() {
            const now = new Date();
            const s = now.getSeconds();
            const m = now.getMinutes();
            const h = now.getHours() % 12;
            
            const sDeg = s * 6;
            const mDeg = (m * 6) + (s * 0.1);
            const hDeg = (h * 30) + (m * 0.5);
            
            const hh = document.getElementById('hourHand');
            const mm = document.getElementById('minHand');
            const ss = document.getElementById('secHand');
            if(hh) hh.style.transform = `rotate(${hDeg}deg)`;
            if(mm) mm.style.transform = `rotate(${mDeg}deg)`;
            if(ss) ss.style.transform = `rotate(${sDeg}deg)`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* 📉 AUTO-HIDE HEADER ON SCROLL DOWN */
        const mainAppContainer = document.getElementById('mainApp');
        const tocHeaderEl = document.getElementById('tocHeader');
        let lastScrollY = 0;

        mainAppContainer.addEventListener('scroll', function() {
            if (currentViewState !== 'dashboard') return;
            const currentScrollY = mainAppContainer.scrollTop;
            
            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                tocHeaderEl.classList.add('header-hidden');
            } else if (currentScrollY < lastScrollY - 8 || currentScrollY <= 20) {
                tocHeaderEl.classList.remove('header-hidden');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        /* 🎨 BULLETPROOF NATIVE TOUCH LONG-PRESS ENGINE */
        const META_STORAGE_KEY = 'bilas_academy_item_marks_v1';
        let savedItemMarks = {};
        try {
            savedItemMarks = JSON.parse(localStorage.getItem(META_STORAGE_KEY) || '{}');
        } catch(e) { savedItemMarks = {}; }

        let activeContextKey = null;

        function getItemKey(type, name) {
            return `${currentSubject}__${type}__${name}`;
        }

        function openContextSheet(key, title) {
            activeContextKey = key;
            const titleEl = document.getElementById('contextItemTitle');
            if (titleEl) titleEl.innerText = title || '';
            const overlay = document.getElementById('contextSheetOverlay');
            if (overlay) overlay.classList.add('active');
        }

        function closeContextSheet() {
            const overlay = document.getElementById('contextSheetOverlay');
            if (overlay) overlay.classList.remove('active');
            activeContextKey = null;
        }

        function applyItemStyle(action, value) {
            if (!activeContextKey) return;
            if (!savedItemMarks[activeContextKey]) {
                savedItemMarks[activeContextKey] = { color: 'none', done: false, star: false };
            }

            if (action === 'color') {
                savedItemMarks[activeContextKey].color = value;
            } else if (action === 'toggleDone') {
                savedItemMarks[activeContextKey].done = !savedItemMarks[activeContextKey].done;
            } else if (action === 'toggleStar') {
                savedItemMarks[activeContextKey].star = !savedItemMarks[activeContextKey].star;
            }

            try {
                localStorage.setItem(META_STORAGE_KEY, JSON.stringify(savedItemMarks));
            } catch(e) {}
            refreshCurrentViewMarks();
            closeContextSheet();
        }

        function refreshCurrentViewMarks() {
            const rows = document.querySelectorAll('.topic-row[data-item-key]');
            rows.forEach(row => {
                const key = row.getAttribute('data-item-key');
                const mark = savedItemMarks[key] || { color: 'none', done: false, star: false };

                row.classList.remove('hl-yellow', 'hl-green', 'hl-rose', 'hl-blue', 'is-completed');
                if (mark.color && mark.color !== 'none') row.classList.add(mark.color);
                if (mark.done) row.classList.add('is-completed');

                const badgeBox = row.querySelector('.item-status-badges');
                if (badgeBox) {
                    let badgesHTML = '';
                    if (mark.star) badgesHTML += `<span class="text-amber-500 text-sm">⭐</span>`;
                    if (mark.done) badgesHTML += `<span class="text-emerald-600 text-xs font-bold bg-emerald-100 px-1.5 py-0.5 rounded-md">✓</span>`;
                    badgeBox.innerHTML = badgesHTML;
                }
            });
        }

        function buildRowClassesAndBadges(key) {
            const mark = savedItemMarks[key] || { color: 'none', done: false, star: false };
            let extraClasses = '';
            if (mark.color && mark.color !== 'none') extraClasses += ` ${mark.color}`;
            if (mark.done) extraClasses += ` is-completed`;

            let badgesHTML = '';
            if (mark.star) badgesHTML += `<span class="text-amber-500 text-sm">⭐</span>`;
            if (mark.done) badgesHTML += `<span class="text-emerald-600 text-xs font-bold bg-emerald-100 px-1.5 py-0.5 rounded-md">✓</span>`;

            return { extraClasses, badgesHTML };
        }

        /* Dedicated Touch & Mouse Long-Press Handler */
        function bindInteractiveRows(containerEl) {
            if (!containerEl) return;
            const rows = containerEl.querySelectorAll('.topic-row');
            rows.forEach(row => {
                let holdTimer = null;
                let startX = 0, startY = 0;
                let isLongPress = false;

                const key = row.getAttribute('data-item-key');
                const title = row.getAttribute('data-item-title');

                const startHold = (x, y) => {
                    isLongPress = false;
                    startX = x;
                    startY = y;
                    if (holdTimer) clearTimeout(holdTimer);
                    holdTimer = setTimeout(() => {
                        isLongPress = true;
                        row.classList.add('pressing-hold');
                        try { if (navigator.vibrate) navigator.vibrate(45); } catch(e){}
                        openContextSheet(key, title);
                        setTimeout(() => row.classList.remove('pressing-hold'), 200);
                    }, 420);
                };

                const moveHold = (x, y) => {
                    if (!holdTimer) return;
                    if (Math.abs(x - startX) > 15 || Math.abs(y - startY) > 15) {
                        clearTimeout(holdTimer);
                        holdTimer = null;
                        row.classList.remove('pressing-hold');
                    }
                };

                const endHold = () => {
                    if (holdTimer) {
                        clearTimeout(holdTimer);
                        holdTimer = null;
                    }
                    row.classList.remove('pressing-hold');
                };

                // Mobile Touch Events
                row.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        startHold(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });

                row.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        moveHold(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });

                row.addEventListener('touchend', endHold);
                row.addEventListener('touchcancel', endHold);

                // Desktop Mouse Events
                row.addEventListener('mousedown', (e) => {
                    if (e.button === 0) startHold(e.clientX, e.clientY);
                });
                row.addEventListener('mousemove', (e) => moveHold(e.clientX, e.clientY));
                row.addEventListener('mouseup', endHold);
                row.addEventListener('mouseleave', endHold);

                // Normal Tap Action
                row.addEventListener('click', (e) => {
                    if (isLongPress) {
                        e.preventDefault();
                        e.stopPropagation();
                        isLongPress = false;
                        return;
                    }
                    const actionType = row.getAttribute('data-action-type');
                    const idx = parseInt(row.getAttribute('data-idx'), 10);

                    if (actionType === 'chapter') {
                        openChapterByIndex(idx);
                    } else if (actionType === 'topic-group') {
                        openTopicGroupByIndex(idx);
                    } else if (actionType === 'subtopic-item') {
                        openSubtopicItemByIndex(idx);
                    } else if (actionType === 'search-item') {
                        openSearchItemByIndex(idx);
                    }
                });
            });
        }

        function loadDataForSubject() {
            const loader = document.getElementById('loader');
            const viewDash = document.getElementById('view-dashboard');
            const cacheKey = 'bilas_academy_cache_' + currentSubject;
            let cachedData = null;
            try { cachedData = localStorage.getItem(cacheKey); } catch(e){}

            if (cachedData) {
                try {
                    rawData = JSON.parse(cachedData);
                    processData();
                    if(loader) { loader.classList.remove('flex'); loader.classList.add('hidden'); }
                } catch(e) {}
            } else {
                if(viewDash) viewDash.innerHTML = '';
                if(loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }
            }

            if (DB_URLS[currentSubject]) {
                fetch(DB_URLS[currentSubject] + "&_t=" + Date.now())
                    .then(response => {
                        if (!response.ok) throw new Error("Network error");
                        return response.text();
                    })
                    .then(text => {
                        if(loader) { loader.classList.remove('flex'); loader.classList.add('hidden'); }
                        parseCSV(text, cacheKey);
                    })
                    .catch(err => {
                        if(loader) { loader.classList.remove('flex'); loader.classList.add('hidden'); }
                        if(!cachedData && viewDash && (!rawData || rawData.length === 0)) {
                            viewDash.innerHTML = `<p class="text-center mt-10 text-red-600 font-bold">ইন্টারনেট কানেকশন চেক করুন!</p>`;
                        }
                    });
            }
        }

        function parseCSV(text, cacheKey) {
            let lines = text.split(/\r?\n/);
            if(lines.length === 0) return;
            let headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
            let tempData = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() == "") continue;
                let currentline = [];
                let inQuotes = false;
                let val = '';
                for(let char of lines[i]) {
                    if(char === '"') inQuotes = !inQuotes;
                    else if(char === ',' && !inQuotes) {
                        currentline.push(val.trim().replace(/^"|"$/g, ''));
                        val = '';
                    } else val += char;
                }
                currentline.push(val.trim().replace(/^"|"$/g, ''));
                if (currentline.length < 2) continue;
                let obj = {};
                headers.forEach((h, idx) => { obj[h] = currentline[idx]; });
                tempData.push(obj);
            }

            const newJson = JSON.stringify(tempData);
            let oldJson = null;
            try { oldJson = cacheKey ? localStorage.getItem(cacheKey) : null; } catch(e){}

            if (newJson !== oldJson) {
                try { if(cacheKey) localStorage.setItem(cacheKey, newJson); } catch(e){}
                rawData = tempData;
                if (currentViewState === 'dashboard') {
                    processData();
                }
            }
        }

                    setTimeout(() => { 
                        app.classList.add('hidden'); 
                        app.classList.remove('page-shrink-out');
                        document.querySelectorAll('.book-3d').forEach(b => b.classList.remove('is-open'));
                    }, 450);
                }
                currentViewState = 'hub';
            }
            else if (state === 'dashboard') {
                const sInput = document.getElementById('searchInput');
                if(sInput) sInput.value = '';
                performPageFlip('view-dashboard', renderDashboard, true);
            } 
            else if (state === 'topics') {
                openChapter(event.state.chapter, true);
            }
            else if (state === 'subtopics') {
                openSubtopicView(event.state.chapter, event.state.topic, true);
            }
        });

        function performPageFlip(targetViewId, logicCallback, isBackward = false) {
            const d = document.getElementById('view-dashboard');
            const t = document.getElementById('view-topics');
            const st = document.getElementById('view-subtopics');
            const i = document.getElementById('view-image');
            const header = document.getElementById('tocHeader');
            const trackerBtn = document.getElementById('trackerBtn');

            if(d) d.classList.add('hidden');
            if(t) t.classList.add('hidden');
            if(st) st.classList.add('hidden');
            if(i) i.classList.add('hidden');
            
            if (targetViewId === 'view-dashboard') {
                if(header) header.classList.remove('hidden', 'header-hidden');
                if(trackerBtn) trackerBtn.classList.remove('hidden');
            } else {
                if(header) header.classList.add('hidden');
                if(trackerBtn) trackerBtn.classList.add('hidden');
            }

            mainAppContainer.scrollTop = 0;
            if(logicCallback) logicCallback();
            const target = document.getElementById(targetViewId);
            if(target) target.classList.remove('hidden');
            currentViewState = targetViewId.replace('view-', '');
            refreshIcons();
        }

        /* 🔍 ULTRA-SMOOTH PINCH TO ZOOM & PAN ENGINE */
        let zoomScale = 1;
        let panX = 0, panY = 0;
        let isPanning = false;
        let startX = 0, startY = 0;
        let initialDistance = 0;
        let initialScale = 1;
        let lastTap = 0;

        function updateTransform() {
            const img = document.getElementById('fullscreenImg');
            const indicator = document.getElementById('zoomPercent');
            if(img) {
                img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            }
            if(indicator) {
                indicator.innerText = Math.round(zoomScale * 100) + '%';
            }
        }

        function resetZoom() {
            zoomScale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function changeZoom(delta) {
            zoomScale = Math.min(Math.max(0.6, zoomScale + delta), 4.5);
            if(zoomScale === 1) { panX = 0; panY = 0; }
            updateTransform();
        }

        const viewport = document.getElementById('zoomViewport');

        viewport.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                isPanning = false;
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = zoomScale;
            } else if (e.touches.length === 1) {
                const now = Date.now();
                if (now - lastTap < 300) {
                    if (zoomScale > 1.2) {
                        resetZoom();
                    } else {
                        zoomScale = 2.2;
                        updateTransform();
                    }
                    lastTap = 0;
                    return;
                }
                lastTap = now;
                isPanning = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (e.touches.length === 2) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialDistance > 0) {
                    zoomScale = Math.min(Math.max(0.6, initialScale * (currentDistance / initialDistance)), 4.5);
                    updateTransform();
                }
            } else if (e.touches.length === 1 && isPanning) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) {
                initialDistance = 0;
            }
            if (e.touches.length === 0) {
                isPanning = false;
            }
        });

        viewport.addEventListener('mousedown', function(e) {
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', function(e) {
            if (!isPanning) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', function() {
            isPanning = false;
        });

        viewport.addEventListener('wheel', function(e) {
            e.preventDefault();
            changeZoom(e.deltaY < 0 ? 0.2 : -0.2);
        }, { passive: false });

        function openFullImage(encodedLink) {
            const rawLink = decodeURIComponent(encodedLink);
            if(!rawLink) return;

            resetZoom();
            try { history.pushState({view: 'fullscreen'}, '', '#full'); } catch(e){}
            const viewer = document.getElementById('fullscreenViewer');
            const img = document.getElementById('fullscreenImg');
            const frame = document.getElementById('fullscreenFrame');

            if (rawLink.includes('drive.google.com')) {
                const match = rawLink.match(/[-\w]{25,}/);
                if (match) {
                    const fileId = match[0];
                    img.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;
                    img.classList.remove('hidden');
                    frame.classList.add('hidden');
                    
                    img.onerror = function() {
                        img.classList.add('hidden');
                        frame.classList.remove('hidden');
                        frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
                    };
                } else {
                    frame.classList.remove('hidden');
                    img.classList.add('hidden');
                    frame.src = rawLink;
                }
            } else {
                img.src = rawLink;
                img.classList.remove('hidden');
                frame.classList.add('hidden');
                
                img.onerror = function() {
                    img.classList.add('hidden');
                    frame.classList.remove('hidden');
                    frame.src = rawLink;
                };
            }
            
            if(viewer) viewer.style.display = 'flex';
            refreshIcons();
        }

        function closeFullImage() { history.back(); }
        function closeFullImageUI() { 
            const viewer = document.getElementById('fullscreenViewer'); 
            const img = document.getElementById('fullscreenImg');
            const frame = document.getElementById('fullscreenFrame');
            if(img) img.src = '';
            if(frame) frame.src = '';
            resetZoom();
            if(viewer) viewer.style.display = 'none'; 
        }

        function executeSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            if(!q) { if(currentViewState !== 'dashboard') goHome(); else renderDashboard(); return; }
            const res = rawData.filter(i => (i.Topic && i.Topic.toLowerCase().includes(q)) || (i.Subtopic && i.Subtopic.toLowerCase().includes(q)));
            if(currentViewState === 'dashboard') { renderDashboard(res); } 
            else { performPageFlip('view-dashboard', () => renderDashboard(res), true); }
        }

        window.onload = () => { refreshIcons(); try { history.replaceState({view: 'hub'}, '', '#hub'); } catch(e){} };
    </script>
</body>
