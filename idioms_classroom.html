<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idioms & Phrases - Complete Master Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --card-bg: #1e293b;
            --card-hover: #223047;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --accent-green: #34d399;
            --accent-green-bg: rgba(52, 211, 153, 0.1);
            --border-color: #334155;
            --favorite-color: #f43f5e;
            --clue-bg: rgba(245, 158, 11, 0.08);
            --clue-border: #f59e0b;
            --clue-text: #fef08a;
            --shadow-premium: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', system-ui, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--accent-color);
            font-size: 0.95rem;
            background: rgba(56, 189, 248, 0.08);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 10px 0;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-premium);
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .filter-btns {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #0f172a;
        }

        .idioms-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .idiom-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-premium);
        }

        .idiom-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background-color: var(--card-hover);
        }

        .card-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .idiom-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .sl-no {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .idiom-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.3rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .fav-btn.active {
            color: var(--favorite-color);
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .chevron {
            transition: transform 0.3s ease;
            fill: var(--text-secondary);
            width: 20px;
            height: 20px;
        }

        .idiom-card.open .chevron {
            transform: rotate(180deg);
        }

        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            background-color: rgba(15, 23, 42, 0.5);
            border-top: 1px solid transparent;
        }

        .idiom-card.open .card-body {
            max-height: 1000px;
            padding: 20px;
            border-top-color: var(--border-color);
        }

        .detail-section {
            margin-bottom: 12px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .pronunciation-content {
            font-size: 0.95rem;
            color: #7dd3fc;
            font-weight: 600;
        }

        .meaning-bn-content {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-green);
            background: var(--accent-green-bg);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            line-height: 1.4;
        }

        .meaning-en-content {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .clue-box {
            background: var(--clue-bg);
            border-left: 4px solid var(--clue-border);
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .clue-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--clue-border);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .clue-content {
            font-size: 0.95rem;
            color: var(--clue-text);
            line-height: 1.6;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            display: none;
        }
    </style>
</head>
