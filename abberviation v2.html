<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abbreviation PRO</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0e121f;
            --card-bg: #141a2d;
            --card-border: rgba(255, 255, 255, 0.07);
            --title-yellow: #f59e0b;
            --ans-mint: #2dd4bf;
            --accent-pink: #ff4d6d;
            --text-sub: #94a3b8;
            --hint-bg: rgba(255, 255, 255, 0.05);
            --hint-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Fixed Top Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(14, 18, 31, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 12px 16px 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-hide { transform: translateY(-110%); }

        .header-container {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .brand-first { color: #f43f5e; }
        .brand-second { color: #2dd4bf; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fav-badge-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(244, 63, 94, 0.35);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            color: #ffcad4;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .fav-badge-btn.active {
            background: #f43f5e;
            color: #ffffff;
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        /* Large Mode Switcher */
        .mode-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
            gap: 6px;
        }

        .mode-btn {
            flex: 1; 
            padding: 8px 10px;
            border-radius: 8px; 
            border: none;
            background: transparent; 
            color: var(--text-sub);
            font-weight: 700; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        /* Categories horizontal bar */
        .category-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .cat-chip {
            white-space: nowrap;
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-chip.active {
            background: var(--ans-mint);
            color: #0d1e1c;
            border-color: var(--ans-mint);
            font-weight: 700;
        }

        .search-box {
            width: 100%; 
            padding: 10px 16px;
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(8, 11, 20, 0.7); 
            color: #fff;
            outline: none; 
            font-size: 13.5px;
        }
        .search-box:focus {
            border-color: #2dd4bf;
        }

        /* Main Container */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 195px 14px 80px 14px;
        }

        .section-header {
            margin: 14px 0 10px 0;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid #2dd4bf;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--title-yellow);
        }

        /* Card Container - Screenshot Style */
        .card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 16px 14px 16px;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .q-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 800;
            color: var(--title-yellow);
        }

        .q-serial {
            color: var(--title-yellow);
        }

        .q-text {
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .item-fav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: rgba(255, 255, 255, 0.2);
            padding: 4px;
            transition: color 0.2s, transform 0.2s;
        }
        .item-fav-btn.active {
            color: #f43f5e;
            transform: scale(1.1);
        }

        /* Default Tap Hint Pill */
        .tap-hint-pill {
            display: inline-flex;
            align-items: center;
            margin-top: 12px;
            padding: 6px 14px;
            background: var(--hint-bg);
            border: 1px solid var(--hint-border);
            border-radius: 6px;
            font-size: 11.5px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* Answer Detail Section */
        .ans-detail {
            display: none;
            margin-top: 10px;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ans-full-form {
            font-size: 16px;
            font-weight: 700;
            color: var(--ans-mint);
            line-height: 1.4;
        }

        .ans-pronounce {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13.5px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .ans-pronounce i {
            color: #38bdf8;
            font-size: 13px;
        }

        /* Active expanded card state */
        .card.expanded .tap-hint-pill {
            display: none;
        }
        .card.expanded .ans-detail {
            display: flex;
        }

        /* Floating Rocket */
        .rocket-hub { 
            position: fixed; 
            right: 18px; 
            bottom: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 2000; 
        }

        .rocket-menu {
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            background: rgba(20, 26, 45, 0.96);
            padding: 12px 6px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 8px; 
            backdrop-filter: blur(10px); 
        }

        .rocket-menu.active { display: flex; }

        .r-circle { 
            width: 36px; 
            height: 36px; 
            background: #141a2d; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            cursor: pointer; 
            font-size: 13px;
        }

        .jump-box { 
            width: 36px; 
            height: 32px; 
            background: #000; 
            border: 1px solid var(--accent-pink); 
            color: white; 
            text-align: center; 
            border-radius: 6px; 
            font-size: 12px;
            outline: none;
        }

        .go-btn { 
            background: var(--accent-pink); 
            border: none; 
            padding: 5px; 
            border-radius: 6px; 
            font-weight: bold; 
            color: #fff; 
            cursor: pointer; 
            font-size: 11px;
        }

        .rocket-icon { 
            font-size: 36px; 
            cursor: pointer; 
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6)); 
        }

        /* Guide Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box {
            background: #141a2d;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 18px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .modal-title { font-size: 16px; font-weight: 700; color: var(--title-yellow); }
        .modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .guide-item h4 { font-size: 13px; color: var(--ans-mint); margin-bottom: 3px; }
        .guide-item p { font-size: 12px; color: var(--text-sub); line-height: 1.4; }
    </style>
</head>
<body>

<div class="header-section" id="header">
    <div class="header-container">
        <div class="brand-area">
            <span class="brand-name">
                <span class="brand-first">Abbreviation</span>
                <span class="brand-second">PRO</span>
            </span>
            <div class="header-actions">
                <div class="fav-badge-btn" id="favMainBtn" onclick="toggleFavView()">
                    <i class="fas fa-heart" style="color: #f43f5e;"></i> ফেভারিট
                </div>
                <button class="info-btn" onclick="openGuideModal()"><i class="fas fa-info"></i></button>
            </div>
        </div>
        
        <!-- Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn active" id="btnTopic" onclick="switchMode('topic')">
                <i class="fas fa-layer-group"></i> বিষয়ভিত্তিক
            </button>
            <button class="mode-btn" id="btnAtoZ" onclick="switchMode('atoz')">
                <i class="fas fa-arrow-down-a-z"></i> A to Z
            </button>
        </div>

        <!-- Categories bar -->
        <div class="category-bar" id="categoryBar"></div>

        <!-- Search Bar -->
        <input type="text" id="search" class="search-box" placeholder="সার্চ করুন..." oninput="renderList()">
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<!-- Rocket Hub -->
<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'}); closeRocket();">⬆</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); closeRocket();">⬇</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<!-- Guide Modal -->
<div class="modal-backdrop" id="guideModal" onclick="closeGuideModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title">📖 ব্যবহার নির্দেশিকা</span>
            <button class="modal-close" onclick="closeGuideModal()">&times;</button>
        </div>
        <div class="guide-item">
            <h4><i class="fas fa-hand-pointer"></i> Full Form দেখা</h4>
            <p>যেকোনো কার্ডে ট্যাপ করলে সংক্ষিপ্ত রূপের নিচেই তার পূর্ণরূপ ও বাংলা উচ্চারণ ভেসে উঠবে। পুনরায় ট্যাপ করলে তা বন্ধ হয়ে যাবে।</p>
        </div>
    </div>
</div>

  { q: "Gen Z", a: "Generation Z", bn: "জেনারেশন জেড", topic: "৬. শিক্ষা, খেলাধুলা, গণমাধ্যম ও সমাজকল্যাণ" },

  { q: "NID", a: "National Identity Card", bn: "ন্যাশনাল আইডেন্টিটি কার্ড", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "e-Judiciary", a: "Electronic Judiciary", bn: "ইলেকট্রনিক জুডিশিয়ারি", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "DCR", a: "Duplicate Carbon Receipt", bn: "ডুপ্লিকেট কার্বন রিসিট", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "FIR", a: "First Information Report", bn: "ফার্স্ট ইনফরমেশন রিপোর্ট", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "CS", a: "Cadastral Survey", bn: "ক্যাডাস্ট্রাল সার্ভে", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "SA", a: "State Acquisition", bn: "স্টেট একুইজিশন", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "RS", a: "Revisional Survey", bn: "রিভিশনাল সার্ভে", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "LD Tax", a: "Land Development Tax", bn: "ল্যান্ড ডেভেলপমেন্ট ট্যাক্স", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },
  { q: "PR", a: "Proportional representation", bn: "প্রোপোরশনাল রিপ্রেজেন্টেশন", topic: "৭. আইন, বিচার, ভূমি ও প্রশাসন" },

  // ৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান
  { q: "BMI", a: "Body Mass Index", bn: "বডি ম্যাস ইনডেক্স", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "MRI", a: "Magnetic Resonance Imaging", bn: "ম্যাগনেটিক রেজোন্যান্স ইমেজিং", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "ICDDR'B", a: "International Centre for Diarrheal Disease Research, Bangladesh", bn: "ইন্টারন্যাশনাল সেন্টার ফর ডায়রিয়াল ডিজিজ রিসার্চ, বাংলাদেশ", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "DNA", a: "Deoxyribonucleic Acid", bn: "ডিঅক্সিরাইবোনিউক্লিক অ্যাসিড", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "EPI", a: "Expanded Programme on Immunization", bn: "এক্সপ্যান্ডেড প্রোগ্রাম অন ইমিউনাইজেশন", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "HMPV", a: "Human Metapneumovirus", bn: "হিউম্যান মেটানিমোভাইরাস", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "TCV", a: "Typhoid Conjugate Vaccine", bn: "টাইফয়েড কনজুগেট ভ্যাকসিন", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "AIDS", a: "Acquired Immune Deficiency Syndrome", bn: "অ্যাকোয়ার্ড ইমিউন ডেফিসিয়েন্সি সিনড্রোম", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "HIV", a: "Human Immunodeficiency Virus", bn: "হিউম্যান ইমিউনোডেফিসিয়েন্সি ভাইরাস", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "ICU", a: "Intensive Care Unit", bn: "ইনটেনসিভ কেয়ার ইউনিট", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" },
  { q: "ECG", a: "Electrocardiogram", bn: "ইলেক্ট্রোকার্ডিওগ্রাম", topic: "৮. চিকিৎসা, স্বাস্থ্য ও জীববিজ্ঞান" }

    ];

    let currentMode = 'topic'; 
    let activeCategory = 'ALL';
    let showFavsOnly = false;
    let favorites = JSON.parse(localStorage.getItem('my_abbr_favs')) || [];

    window.addEventListener('DOMContentLoaded', () => {
        renderCategories();
        renderList();
    });

    function switchMode(mode) {
        currentMode = mode;
        activeCategory = 'ALL';
        document.getElementById('btnTopic').classList.toggle('active', mode === 'topic');
        document.getElementById('btnAtoZ').classList.toggle('active', mode === 'atoz');
        renderCategories();
        renderList();
    }

    function renderCategories() {
        const catBar = document.getElementById('categoryBar');
        catBar.innerHTML = "";

        let items = ['ALL'];
        if (currentMode === 'topic') {
            const topics = [...new Set(rawData.map(i => i.topic))];
            items = items.concat(topics);
        } else {
            const letters = "34ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            items = items.concat(letters);
        }

        items.forEach(cat => {
            const chip = document.createElement('button');
            chip.className = `cat-chip ${activeCategory === cat ? 'active' : ''}`;
            chip.textContent = cat;
            chip.onclick = () => {
                activeCategory = cat;
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                renderList();
            };
            catBar.appendChild(chip);
        });
    }

    function toggleFavView() {
        showFavsOnly = !showFavsOnly;
        document.getElementById('favMainBtn').classList.toggle('active', showFavsOnly);
        renderList();
    }

    function renderList() {
        const listContainer = document.getElementById('main-list');
        const query = document.getElementById('search').value.toLowerCase().trim();
        listContainer.innerHTML = "";

        let filtered = rawData.filter(item => {
            const matchesFav = !showFavsOnly || favorites.includes(item.q);
            const matchesSearch = !query || 
                                  item.q.toLowerCase().includes(query) || 
                                  item.a.toLowerCase().includes(query) || 
                                  (item.bn && item.bn.toLowerCase().includes(query));
            
            let matchesCat = true;
            if (activeCategory !== 'ALL') {
                if (currentMode === 'topic') {
                    matchesCat = (item.topic === activeCategory);
                } else {
                    matchesCat = item.q.toUpperCase().startsWith(activeCategory.toUpperCase());
                }
            }

            return matchesFav && matchesSearch && matchesCat;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = `
                <div style="text-align:center; padding: 40px 14px; color: var(--text-sub); background: var(--card-bg); border-radius: 14px; border: 1px dashed var(--card-border);">
                    <i class="fas fa-search" style="font-size: 26px; color: var(--title-yellow); margin-bottom: 8px; display:block;"></i>
                    <p style="font-size: 14px; color: #fff;">কোনো তথ্য পাওয়া যায়নি!</p>
                </div>
            `;
            return;
        }

        let serialCounter = 1;

        if (currentMode === 'atoz') {
            filtered.sort((a, b) => a.q.localeCompare(b.q, undefined, { numeric: true, sensitivity: 'base' }));
            filtered.forEach(item => {
                listContainer.appendChild(createCard(item, serialCounter++));
            });
        } else {
            const uniqueTopics = [...new Set(filtered.map(i => i.topic))];
            uniqueTopics.forEach(topName => {
                const groupItems = filtered.filter(i => i.topic === topName);
                if (groupItems.length > 0) {
                    if (activeCategory === 'ALL') {
                        const sec = document.createElement('div');
                        sec.className = 'section-header';
                        sec.innerHTML = `<i class="fas fa-folder"></i> ${topName} (${groupItems.length})`;
                        listContainer.appendChild(sec);
                    }
                    groupItems.forEach(item => {
                        listContainer.appendChild(createCard(item, serialCounter++));
                    });
                }
            });
        }
    }

    function createCard(item, index) {
        const isFav = favorites.includes(item.q);
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `item-${index}`;

        const safeQ = item.q.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        card.innerHTML = `
            <div class="card-top">
                <div class="q-title-wrap">
                    <span class="q-serial">${index}.</span>
                    <span class="q-text">${item.q}</span>
                </div>
                <button class="item-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${safeQ}', event)">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
            
            <!-- Default Hint -->
            <div class="tap-hint-pill">Full Form দেখতে ট্যাপ করুন</div>

            <!-- Expanded Answer Section -->
            <div class="ans-detail">
                <div class="ans-full-form">${item.a}</div>
                ${item.bn ? `
                <div class="ans-pronounce">
                    <i class="fas fa-comment-dots"></i> ${item.bn}
                </div>` : ''}
            </div>
        `;

        card.onclick = () => card.classList.toggle('expanded');
        return card;
    }

    function toggleFav(text, event) {
        if (event) event.stopPropagation();
        const pos = favorites.indexOf(text);
        if (pos === -1) favorites.push(text);
        else favorites.splice(pos, 1);
        localStorage.setItem('my_abbr_favs', JSON.stringify(favorites));
        renderList();
    }

    function toggleRocket() {
        document.getElementById('rocketMenu').classList.toggle('active');
    }

    function closeRocket() {
        document.getElementById('rocketMenu').classList.remove('active');
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) { 
            el.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            closeRocket(); 
        } else {
            alert('উক্ত নম্বরের আইটেম পাওয়া যায়নি!');
        }
    }

    function openGuideModal() { document.getElementById('guideModal').style.display = 'flex'; }
    function closeGuideModal(e) {
        if(!e || e.target.id === 'guideModal' || e.target.classList.contains('modal-close')) {
            document.getElementById('guideModal').style.display = 'none';
        }
    }

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        closeRocket();
        if (top > lastScroll && top > 90) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };
</script>
