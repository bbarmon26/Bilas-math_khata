    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(18, 24, 40, 0.75);
            --border-color: rgba(255, 255, 255, 0.05);
            --mint-green: #2dd4bf;      
            --gold-glow: #facc15;       
            --switch-pink: #f43f5e;    
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #161630 0%, #05070f 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* 👑 Ultra-Modern Premium Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background-image: linear-gradient(rgba(8, 11, 22, 0.9), rgba(8, 11, 22, 0.95)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 12px 16px;
            border-bottom: 2px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-hide { transform: translateY(-110%); }

        .header-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to right, #ff3366, var(--gold-glow), var(--mint-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(250, 204, 21, 0.3));
        }

        .btn-fav-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: var(--gold-glow);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-fav-toggle.active-mode {
            background: var(--switch-pink);
            border-color: transparent;
            color: white;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .search-box {
            width: 100%;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* Container Layout - Responsive Grid */
        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 115px 12px 80px 12px;
            box-sizing: border-box;
        }

        #main-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            width: 100%;
        }

        @media screen and (min-width: 768px) {
            #main-list {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }

        .item-wrapper { display: flex; width: 100%; }

        /* Full Screen Card Setup */
        .card {
            flex-grow: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            position: relative; 
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            padding: 16px 18px;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        /* সাদা আউটলাইন লাভার আইকন */
        .fav-node-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25); 
            font-size: 19px;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s;
            z-index: 10;
        }
        .fav-node-btn.active {
            color: var(--switch-pink);
            text-shadow: 0 0 8px var(--switch-pink);
        }

        .content-engine {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .sentence-node {
            font-size: 20px; 
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 8px;
            margin-right: 25px;
        }

        /* কার্ডের ভেতরে ইন-লাইন সিরিয়াল নম্বর */
        .inline-serial {
            color: var(--gold-glow);
            font-weight: 800;
            margin-right: 8px;
            font-size: 20px;
        }

        .dot-placeholder {
            color: var(--gold-glow);
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .card-revealed .dot-placeholder {
            color: var(--mint-green);
            text-shadow: 0 0 8px rgba(45, 212, 191, 0.4);
            background: rgba(45, 212, 191, 0.08);
            padding: 1px 6px;
            border-radius: 5px;
        }

        .card-controls {
            display: flex;
            justify-content: flex-end; 
            width: 100%;
            min-height: 26px;
        }

        .exp-btn {
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(250, 204, 21, 0.25);
            color: var(--gold-glow);
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0; 
            visibility: hidden;
            transform: translateY(4px);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .card-revealed .exp-btn {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .explanation-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--gold-glow);
            border-radius: 5px;
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: left;
            animation: slideDown 0.2s ease forwards;
        }

        .hi-gold { color: var(--gold-glow); font-weight: 700; background: rgba(250, 204, 21, 0.08); padding: 1px 4px; border-radius: 4px; }
        .hi-mint { color: var(--mint-green); font-weight: 700; background: rgba(45, 212, 191, 0.08); padding: 1px 4px; border-radius: 4px; }

        /* Smart Rocket Hub with Manual Shuffle Button */
        .rocket-hub { position: fixed; right: 20px; bottom: 25px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 10px; background: rgba(7, 10, 19, 0.98); padding: 15px 8px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px; }
        .r-circle { width: 40px; height: 40px; background: #1e293b; border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .jump-box { width: 40px; height: 32px; background: #000; border: 1px solid var(--switch-pink); color: white; text-align: center; border-radius: 6px; font-size: 13px; outline: none; }
        .go-btn { background: var(--switch-pink); border: none; padding: 5px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px;}
        .rocket-icon { font-size: 36px; cursor: pointer; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<script>
    const articleData = [

        // --- পার্ট ১ (১ থেকে ১০০) ---
        { w: "He spent <span class='dot-placeholder'>......</span> lot of money.", a: "a", e: "নিয়ম: ইংরেজিতে <span class='hi-gold'>'A lot of'</span> একটি নির্দিষ্ট ফ্রেজ (Phrase), যার অর্থ প্রচুর পরিমাণ। এখানে <span class='hi-mint'>Lot</span> শব্দের পূর্বে সর্বদা অনির্দিষ্ট আর্টিকেল হিসেবে <span class='hi-mint'>'a'</span> বসে।" },
        { w: "Let us go out for <span class='dot-placeholder'>......</span> walk.", a: "a", e: "নিয়ম: <span class='hi-gold'>'Go for a walk'</span> (হাঁটতে যাওয়া) একটি খাঁটি ইংরেজি ইডিয়ম বা বাগধারা। তাই ব্যাকরণগত নিয়ম অনুযায়ী এখানে শূন্যস্থানে অপশন <span class='hi-mint'>'a'</span> বসবে।" },
        { w: "He thinks he is <span class='dot-placeholder'>.........</span> Rabindranath.", a: "a", e: "নিয়ম: যখন সাধারণ কোনো ব্যক্তির তুলনা কোনো জগৎবিখ্যাত ব্যক্তির সাথে করা হয় (Proper Noun যখন Common Noun হয়), তখন সেই বিখ্যাত নামের পূর্বে <span class='hi-mint'>'a'</span> যুক্ত করতে হয়।" },
        { w: "He reads in <span class='dot-placeholder'>...............</span> university.", a: "a", e: "নিয়ম: <span class='hi-gold'>University</span> শব্দের শুরুতে ভাওয়েল <span class='hi-gold'>'U'</span> থাকলেও এর উচ্চারণ যদি স্পষ্ট <span class='hi-mint'>'ইউ' (You)</span> এর মতো শোনা যায়, তবে তার পূর্বে 'an' না বসে বিশেষ নিয়মে <span class='hi-mint'>'a'</span> বসে।" },
        { w: "I saw <span class='dot-placeholder'>.........</span> one eyed man yesterday.", a: "a", e: "নিয়ম: শব্দের শুরুতে ভাওয়েল <span class='hi-gold'>'O'</span> থাকা সত্ত্বেও তার উচ্চারণ যদি ওয়া <span class='hi-mint'>'ওয়া' (Wa)</span> এর মতো হয় (যেমন: <span class='hi-gold'>One</span>), তবে তার আগে সর্বদা <span class='hi-mint'>'a'</span> বসাতে হবে।" },
        { w: "<span class='dot-placeholder'>......</span> person's birthday is a special day.", a: "A", e: "নিয়ম: এখানে যেকোনো একজন অনির্দিষ্ট সাধারণ ব্যক্তিকে নির্দেশ করা হচ্ছে। শব্দের শুরুতে ব্যঞ্জনবর্ণ বা <span class='hi-gold'>Consonant</span> থাকায় বাক্যের শুরুতে ক্যাপিটাল লেটার <span class='hi-mint'>'A'</span> বসবে।" },
        { w: "Sima has a cough and <span class='dot-placeholder'>.........</span> sore throat.", a: "a", e: "নিয়ম: সাধারণ শারীরিক বিভিন্ন ব্যাধি বা ঠাণ্ডা লাগার মতো অসুস্থতার নামের আগে সাধারণত ইংরেজি কাঠামোতে ইনডেফিনিট আর্টিকেল <span class='hi-mint'>'a'</span> ব্যবহার করা হয়।" },
        { w: "This is <span class='dot-placeholder'>......</span> unique opportunity.", a: "a", e: "নিয়ম: <span class='hi-gold'>Unique</span> শব্দের প্রথম অক্ষরটির উচ্চারণ সরাসরি <span class='hi-mint'>'ইউ' (You)</span> এর মতো প্রকাশ পায়। ভাওয়েল থাকা সত্ত্বেও এমন উচ্চারণে আর্টিকেলের নিয়ম অনুযায়ী <span class='hi-mint'>'a'</span> বসে।" },
        { w: "He is <span class='dot-placeholder'>.........</span> BBA student.", a: "a", e: "নিয়ম: সংক্ষিপ্ত শব্দ বা Abbreviation এর প্রথম অক্ষরটি হলো <span class='hi-gold'>'B'</span> (বি)। এর উচ্চারণ করতে কোনো ভাওয়েল সাউন্ড বা স্বরবর্ণ প্রথমে আসে না, তাই এর পূর্বে <span class='hi-mint'>'a'</span> বসবে।" },
        { w: "I met <span class='dot-placeholder'>.......</span> European this afternoon.", a: "a", e: "নিয়ম: <span class='hi-gold'>European</span> শব্দের শুরুতে ভাওয়েল জোড় <span class='hi-gold'>'Eu'</span> থাকলেও এর উচ্চারণ খাঁটি <span class='hi-mint'>'ইউ' (You)</span> এর মতো হওয়ায় এর পূর্বে সর্বদা <span class='hi-mint'>'a'</span> ব্যবহৃত হয়।" },
        { w: "He took <span class='dot-placeholder'>........</span> short sleep.", a: "a", e: "নিয়ম: <span class='hi-gold'>Short sleep</span> এর পূর্বে সাধারণ নিয়ম অনুসারে ব্যঞ্জনবর্ণ বা Consonant সাউন্ডের কারণে অনির্দিষ্ট আর্টিকেল হিসেবে <span class='hi-mint'>'a'</span> ব্যবহৃত হয়।" },
        { w: "The cow is <span class='dot-placeholder'>........</span> useful animal.", a: "a", e: "নিয়ম: <span class='hi-gold'>Useful</span> শব্দের শুরুতে 'U' ভাওয়েল হলেও এর উচ্চারণ <span class='hi-mint'>'ইউ' (You)</span> এর মতো প্রকাশ পাওয়ায় এর পূর্বে 'an' না বসে <span class='hi-mint'>'a'</span> বসবে।" },
        { w: "We had <span class='dot-placeholder'>.......</span> good breakfast yesterday.", a: "a", e: "নিয়ম: সাধারণত খাবারের (Meals) আগে আর্টিকেল বসে না, তবে খাবারের আগে কোনো <span class='hi-gold'>Adjective</span> (যেমন: Good) থাকলে তার পূর্বে সাধারণ নিয়মে <span class='hi-mint'>'a'</span> বা 'an' বসে।" },
        { w: "Kindness is <span class='dot-placeholder'>.............</span> great virtue.", a: "a", e: "নিয়ম: <span class='hi-gold'>Great virtue</span> (মহৎ গুণ) এর পূর্বে ব্যঞ্জনবর্ণের স্বাভাবিক উচ্চারণের কারণে ইনডেফিনিট আর্টিকেল <span class='hi-mint'>'a'</span> বসে।" },

        { w: "Italy is <span class='dot-placeholder'>.......</span> European country.", a: "a", e: "নিয়ম: <span class='hi-gold'>European</span> শব্দের শুরুতে ভাওয়েল জোড় 'Eu' থাকলেও এর উচ্চারণ খাঁটি <span class='hi-mint'>'ইউ' (You)</span> এর মতো হওয়ায় এর পূর্বে সর্বদা <span class='hi-mint'>'a'</span> ব্যবহৃত হয়।" },

        { w: "He speaks <span class='dot-placeholder'>.......</span> English like <span class='dot-placeholder'>......</span> English.", a: "Cross (×), the", e: "নিয়ম: ভাষার নামের পূর্বে আর্টিকেল বসে না তাই Cross, কিন্তু জাতির নামের পূর্বে <span class='hi-mint'>'the'</span> বসে।" },

        { w: "<span class='dot-placeholder'>......</span> Punjab is <span class='dot-placeholder'>.....</span> land of five rivers.", a: "The, the", e: "নিয়ম: প্রদেশ বা ভৌগোলিক অর্থপূর্ণ স্থানের নামের (Punjab) পূর্বে <span class='hi-mint'>'The'</span> বসে এবং Noun + of + Noun কাঠামোর কারণে 'the' বসে।" },

        { w: "<span class='dot-placeholder'>......</span> iron is <span class='dot-placeholder'>......</span> useful metal.", a: "Cross (×), a", e: "নিয়ম: Material Noun (Iron) এর পূর্বে আর্টিকেল বসে না (Cross), এবং Useful এর 'U' উচ্চারণ 'ইউ' হওয়ায় <span class='hi-mint'>'a'</span> বসে।" },

        { w: "He likes <span class='dot-placeholder'>......</span> yellow of <span class='dot-placeholder'>......</span> egg.", a: "the, an", e: "নিয়ম: নির্দিষ্ট করে ডিমের কুসুম বোঝাতে 'the yellow' এবং সাধারণ ডিমের পূর্বে ভাওয়েল সাউন্ড অনুযায়ী 'an' বসে।" },
        { w: "He entered <span class='dot-placeholder'>......</span> thick of <span class='dot-placeholder'>....</span> forest.", a: "the, the", e: "নিয়ম: <span class='hi-gold'>Noun + of + Noun</span> কাঠামোর কারণে প্রথম Noun এর পূর্বে নির্দিষ্ট করতে 'the' বসে এবং নির্দিষ্ট জঙ্গলের পূর্বেও 'the' বসে।" }


            ];

    let isFavoriteViewOn = false;
    let favoriteList = JSON.parse(localStorage.getItem('bacademy_art_pro_favs')) || [];

    // --- 🎯 স্মার্ট মেমোরি শাফেল (Static Memory Shuffle) ---
    let savedOrder = JSON.parse(localStorage.getItem('bacademy_art_order'));

    if (!savedOrder || savedOrder.length !== articleData.length) {
        savedOrder = articleData.map((_, index) => index);
        for (let i = savedOrder.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [savedOrder[i], savedOrder[j]] = [savedOrder[j], savedOrder[i]];
        }
        localStorage.setItem('bacademy_art_order', JSON.stringify(savedOrder));
    }

    const finalDisplayData = savedOrder.map(index => articleData[index]);

    function toggleFavoriteViewMode() {
        isFavoriteViewOn = !isFavoriteViewOn;
        document.getElementById('favViewBtn').classList.toggle('active-mode', isFavoriteViewOn);
        document.getElementById('favViewBtn').innerText = isFavoriteViewOn ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        renderListEngine();
    }

    function renderListEngine() {
        const listContainer = document.getElementById('main-list');
        listContainer.innerHTML = "";

        finalDisplayData.forEach((item, index) => {
            const originalIndex = savedOrder[index];
            const isItemFav = favoriteList.includes(originalIndex);
            
            if (isFavoriteViewOn && !isItemFav) return;

            const rowNode = document.createElement('div');
            rowNode.className = 'item-wrapper';
            rowNode.id = `cell-item-${index + 1}`;
            
            // কোটেশন কনফ্লিক্ট এড়ানোর জন্য নিরাপদ অ্যানসার স্ট্রিং
            const safeAnswer = item.a.replace(/'/g, "\\'");
            
            rowNode.innerHTML = `
                <div class="card" onclick="triggerCardFlip(this, '${safeAnswer}', ${index})">
                    <button class="fav-node-btn ${isItemFav ? 'active' : ''}" onclick="toggleSingleItemFav(event, ${originalIndex})">♡</button>
                    
                    <div class="content-engine">
                        <div class="sentence-node"><span class="inline-serial">${index + 1}.</span>${item.w}</div>
                    </div>
                    
                    <div class="card-controls">
                        <button class="exp-btn" id="btn-exp-${index}" onclick="toggleExplanation(event, ${index})">💡 ব্যাখ্যা দেখুন</button>
                    </div>
                    
                    <div class="explanation-box" id="exp-box-${index}">${item.e}</div>
                </div>
            `;
            listContainer.appendChild(rowNode);
        });
    }

    function toggleSingleItemFav(event, originalIndex) {
        event.stopPropagation(); 
        const position = favoriteList.indexOf(originalIndex);
        if (position === -1) favoriteList.push(originalIndex);
        else favoriteList.splice(position, 1);
        localStorage.setItem('bacademy_art_pro_favs', JSON.stringify(favoriteList));
        renderListEngine();
    }

    function triggerCardFlip(cardEl, answerText, index) {
        const isRevealed = cardEl.classList.contains('card-revealed');
        const placeholders = cardEl.querySelectorAll('.dot-placeholder');
        
        if (!isRevealed) {
            cardEl.classList.add('card-revealed');
            
            // 🎯 ডাবল শূন্যস্থানের জন্য সলিড লজিক
            if (answerText.includes(',') && placeholders.length > 1) {
                let ansParts = answerText.split(',');
                placeholders.forEach((p, i) => {
                    if (ansParts[i]) {
                        p.innerHTML = ` ${ansParts[i].trim()} `;
                    }
                });
            } else {
                // সিঙ্গেল শূন্যস্থানের জন্য
                placeholders.forEach(p => p.innerHTML = ` ${answerText} `);
            }
        } else {
            cardEl.classList.remove('card-revealed');
            document.getElementById(`exp-box-${index}`).style.display = "none";
            document.getElementById(`btn-exp-${index}`).innerText = "💡 ব্যাখ্যা দেখুন";
            placeholders.forEach(p => p.innerText = "......");
        }
    }

    function toggleExplanation(event, index) {
        event.stopPropagation();
        const expBox = document.getElementById(`exp-box-${index}`);
        const isVisible = expBox.style.display === "block";
        expBox.style.display = isVisible ? "none" : "block";
        event.target.innerText = isVisible ? "💡 ব্যাখ্যা দেখুন" : "❌ বন্ধ করুন";
    }

    function toggleRocketHub() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function jumpToCell() {
        let inputVal = document.getElementById('jumpInput').value;
        let targetEl = document.getElementById(`cell-item-${inputVal}`);
        if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketHub();
        }
    }

    function resetShuffle() {
        if(confirm("আপনি কি সম্পূর্ণ নতুন মিক্সড সেট তৈরি করতে চান? (আপনার বর্তমান সিরিয়াল ওলটপালট হয়ে যাবে)")) {
            localStorage.removeItem('bacademy_art_order');
            location.reload();
        }
    }

    /* 🎯 নিখুঁত হেডার স্ক্রল হাইড ইঞ্জিন */
    let lastScrollPosition = 0;
    window.addEventListener('scroll', () => {
        let currentScrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        const navHeader = document.getElementById('headerNav');
        
        if (currentScrollPosition > lastScrollPosition && currentScrollPosition > 50) {
            navHeader.classList.add('header-hide'); 
        } else {
            navHeader.classList.remove('header-hide'); 
        }
        lastScrollPosition = currentScrollPosition <= 0 ? 0 : currentScrollPosition;
    }, { passive: true });

    function executeSearchFilter() {
        let searchString = document.getElementById('mainSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(row => {
            row.closest('.item-wrapper').style.display = row.innerText.toLowerCase().includes(searchString) ? "flex" : "none";
        });
    }

    renderListEngine();
</script>
</body>
</html>
