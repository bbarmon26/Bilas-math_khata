    {id: 154, bookNum: "31.a", type: "normal", ruleId: "R5", raw: "He ________ home last night. (leave)", ans: "left", bn: "সে গত রাতে বাড়ি থেকে চলে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>leave -> left।"},
    {id: 155, bookNum: "31.b", type: "normal", ruleId: "R12", raw: "I fancy I ________ pale. (turn)", ans: "turned", bn: "আমার মনে হলো আমি যেন ফ্যাকাশে হয়ে গেলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish / I fancy + Subject' থাকলে পরবর্তী ভার্বটি সর্বদা Past Form [V2] হয়!</strong>তাই 'turned' বসেছে।"},
    {id: 156, bookNum: "31.c", type: "normal", ruleId: "R9", raw: "I would help him, if he ________ (want).", ans: "wanted", bn: "সে যদি চাইতো, তবে আমি তাকে সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): প্রথম অংশে [would + V1 (would help)] থাকায় 'if' যুক্ত অংশটি Past Indefinite [V2] হয়েছে!</strong>তাই 'wanted' বসেছে।"},
    {id: 157, bookNum: "31.d", type: "normal", ruleId: "R6", raw: "I always remember your ________ by me. (stand)", ans: "standing", bn: "আমার পাশে তোমার দাঁড়ানোর কথা আমি সবসময় মনে রাখি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 & R7 (Possessive + Gerund): Preposition অথবা Possessive Pronoun (my, your, his, her)-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing] বসে!</strong>এখানে 'your' থাকায় 'standing' হয়েছে।"},
    {id: 158, bookNum: "31.e", type: "normal", ruleId: "R10", raw: "I ________ the work before he came back. (finish)", ans: "had finished", bn: "সে ফিরে আসার পূর্বেই আমি কাজটি শেষ করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর পরে V2 (came) থাকায় before-এর আগে Past Perfect [had + V3] বসেছে!</strong>তাই 'had finished' হয়েছে।"},
    {id: 159, bookNum: "32.a", type: "normal", ruleId: "R13", raw: "A lot of money ________ spent.", ans: "is", bn: "প্রচুর টাকা ব্যয় করা হয়/হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - পরিমাণ): 'Money' হলো Uncountable Noun (গণনা করা যায় না), তাই এর পরিমাণ সর্বদা Singular Verb [is / was] নেয়!</strong>"},
    {id: 160, bookNum: "32.b", type: "normal", ruleId: "R13", raw: "A huge quantity of sugar ________ exported.", ans: "was", bn: "বিপুল পরিমাণ চিনি রপ্তানি করা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - ওজন/পরিমাণ): 'Sugar' আনকাউন্টেবল এবং 'A huge quantity' একবচন হওয়ায় Singular Verb [was / is] বসেছে!</strong>"},
    {id: 161, bookNum: "32.c", type: "normal", ruleId: "R13", raw: "One and a half hour ________ a long time.", ans: "is", bn: "দেড় ঘণ্টা একটি দীর্ঘ সময়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - সময়): নির্দিষ্ট সময়ের একক সমষ্টি (One and a half hour) সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 162, bookNum: "32.d", type: "normal", ruleId: "R13", raw: "Three fourths of the books ________ been sold.", ans: "have", bn: "বইগুলোর তিন-চতুর্থাংশ বিক্রি হয়ে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement - ভগ্নাংশ): ভগ্নাংশের পর 'of'-এর পরের Noun-টি যদি গণনাযোগ্য বহুবচন (the books) হয়, তবে Plural Verb [have] বসে!</strong>"},
    {id: 163, bookNum: "33.a", type: "normal", ruleId: "R7", raw: "The audience started ________ (clap).", ans: "clapping", bn: "দর্শকরা তালি দেওয়া শুরু করলো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'start, begin, stop, finish, give up'-এর পর ২য় ভার্ব আসলে সরাসরি [V1 + ing] বসে!</strong>তাই 'clapping' হয়েছে।"},
    {id: 164, bookNum: "33.b", type: "normal", ruleId: "R5", raw: "The book ________ (write) by him few years ago.", ans: "was written", bn: "বইটি কয়েক বছর আগে তাঁর দ্বারা লেখা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Passive): বাক্যে 'ago' (অতীত) এবং 'by him' (প্যাসিভ) থাকায় সিঙ্গুলার সাবজেক্ট অনুযায়ী [was + V3] বসেছে!</strong>তাই 'was written' হয়েছে।"},
    {id: 165, bookNum: "33.c", type: "normal", ruleId: "R12", raw: "I wish I ________ (be) a king!", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (be) থাকলে সর্বদা [were] বসে!</strong>"},
    {id: 166, bookNum: "33.d", type: "normal", ruleId: "R13", raw: "Rahim and Reshma ________ (be) siblings.", ans: "are", bn: "রহিম এবং রেশমা ভাইবোন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): দুটি ভিন্ন নাম 'and' দ্বারা যুক্ত হলে Subject বহুবচন (Plural) হয়, তাই বর্তমান কালে [are] বসেছে!</strong>"},
    {id: 167, bookNum: "33.e", type: "normal", ruleId: "R6", raw: "He took these measures with a view to ________ (help) people.", ans: "helping", bn: "সে মানুষের সাহায্য করার উদ্দেশ্যে এই পদক্ষেপগুলো নিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): বাক্যে 'with a view to' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing] বসে!</strong>তাই 'helping' হয়েছে।"},
    {id: 168, bookNum: "34.a", type: "normal", ruleId: "R13", raw: "Each of the girls ________ (be) present in the class yesterday.", ans: "was", bn: "মেয়েদের প্রত্যেকেই গতকাল ক্লাসে উপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'Each of' সিঙ্গুলার এবং 'yesterday' থাকায় Past সিঙ্গুলার ভার্ব [was] বসেছে!</strong>"},
    {id: 169, bookNum: "34.b", type: "normal", ruleId: "R13", raw: "You, he and I ________ (be) friend.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): একাধিক Person 'and' দ্বারা যুক্ত হওয়ায় Plural Verb [are] বসেছে!</strong>"},
    {id: 170, bookNum: "34.c", type: "normal", ruleId: "R1", raw: "One fourth of the work ________ (to finish).", ans: "has been finished", bn: "কাজের এক-চতুর্থাংশ শেষ হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R13 (Passive + Uncountable): 'the work' আনকাউন্টেবল সিঙ্গুলার এবং কাজটি অন্যের দ্বারা শেষ হওয়ায় প্যাসিভ রূপে [has been finished] বসেছে!</strong>"},
    {id: 171, bookNum: "35.a", type: "normal", ruleId: "R1", raw: "Did you ________ (go) to school yesterday?", ans: "go", bn: "তুমি কি গতকাল স্কুলে গিয়েছিলে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs): বাক্যে 'do / does / did' থাকলে মূল ভার্বের সাথে কখনোই কিছু যুক্ত হয় না, সর্বদা আসল রূপ [V1] বসে!</strong>এখানে 'Did' দেওয়াই থাকায় অপরিবর্তিত 'go' বসেছে।"},
    {id: 172, bookNum: "35.b", type: "normal", ruleId: "R10", raw: "John asked me what I ________ (be) doing.", ans: "was", bn: "জন আমাকে জিজ্ঞেস করলো আমি কী করছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance / Tense-এর সমতা): প্রথম অংশে Past (asked) থাকায় পরের অংশেও Past হবে এবং 'I'-এর সাথে সিঙ্গুলার Past Be-verb হিসেবে [was] বসেছে!</strong>"},
    {id: 173, bookNum: "35.c", type: "normal", ruleId: "R5", raw: "I ________ (see) a good film yesterday.", ans: "saw", bn: "আমি গতকাল একটি ভালো সিনেমা দেখেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>see -> saw।"},
    {id: 174, bookNum: "35.d", type: "normal", ruleId: "R10", raw: "I'll see you when I ________ (come) back.", ans: "come", bn: "আমি ফিরে আসলে তোমার সাথে দেখা করবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Future): প্রথম অংশে Future (I'll see) থাকলে 'when / until / as soon as / before' যুক্ত অংশটি সর্বদা Present Indefinite [V1] হয়!</strong>তাই 'come' বসেছে।"},
    {id: 175, bookNum: "35.e", type: "normal", ruleId: "R5", raw: "Last year I ________ (used to walk) to school every day.", ans: "used to walk", bn: "গত বছর আমি প্রতিদিন হেঁটে স্কুলে যেতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R6 (Past Habit): অতীতের নিয়মিত অভ্যাস বোঝাতে এবং এর আগে কোনো Be-verb না থাকায় সরাসরি [used to + V1 (used to walk)] বসেছে!</strong>"},
    {id: 176, bookNum: "36.a", type: "normal", ruleId: "R6", raw: "We are looking forward to ________ (hear) from you.", ans: "hearing", bn: "আমরা আপনার কাছ থেকে শোনার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'look forward to / are looking forward to'-এর পর সর্বদা [V1 + ing] বসে!</strong>তাই 'hearing' হয়েছে।"},
    {id: 177, bookNum: "36.b", type: "normal", ruleId: "R1", raw: "Bengali ________ (speak) in Calcutta also.", ans: "is spoken", bn: "কলকাতাতেও বাংলা ভাষা বলা হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): বাংলা ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয়। তাই Present Passive রূপে [is + V3 (is spoken)] বসেছে!</strong>"},
    {id: 178, bookNum: "36.c", type: "normal", ruleId: "R10", raw: "He said that he ________ (will go) home soon.", ans: "would go", bn: "সে বললো যে সে শীঘ্রই বাড়ি যাবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Said that): প্রথম অংশে Past (He said that) থাকায় পরের অংশে will পরিবর্তিত হয়ে [would + V1 (would go)] হয়েছে!</strong>"},
    {id: 179, bookNum: "36.d", type: "normal", ruleId: "R11", raw: "Two years ________ (pass) since he left home.", ans: "have passed", bn: "সে বাড়ি ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর ডান পাশে Past Indefinite (left) থাকলে বাম পাশে Present Indefinite বা Present Perfect [have / has + V3] বসে!</strong>'Two years' বহুবচন হওয়ায় 'have passed' হয়েছে।"},
    {id: 180, bookNum: "36.e", type: "normal", ruleId: "R5", raw: "What you ________ (do) last night?", ans: "did you do", bn: "গত রাতে তুমি কী করেছিলে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'last night' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did you do)] বসেছে!</strong>"},
    {id: 181, bookNum: "37.a", type: "normal", ruleId: "R1", raw: "The doctor suggested that the patient ________ (lose) weight.", ans: "lose / should lose", bn: "ডাক্তার পরামর্শ দিলেন যেন রোগী ওজন কমায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Subjunctive / Modal Rule): 'suggest that / recommend that'-এর পর যেকোনো Subject-এর পরেই সরাসরি Base Form [V1] অথবা [should + V1] বসে!</strong>তাই 'lose' বসেছে।"},
    {id: 182, bookNum: "37.b", type: "normal", ruleId: "R7", raw: "I gave up ________ (play) cricket when I got a job.", ans: "playing", bn: "চাকরি পাওয়ার পর আমি ক্রিকেট খেলা ছেড়ে দিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'give up / gave up'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing] যুক্ত হয়!</strong>তাই 'playing' হয়েছে।"},
    {id: 183, bookNum: "37.c", type: "normal", ruleId: "R5", raw: "A fire ________ (break) out in the slum last night.", ans: "broke", bn: "গত রাতে বস্তিতে আগুন লেগেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>break-এর V2 হলো 'broke'।"},
    {id: 184, bookNum: "37.d", type: "normal", ruleId: "R9", raw: "Don't mention anything unless you ________ (ask) for.", ans: "are asked", bn: "তোমাকে জিজ্ঞাসা না করা পর্যন্ত কোনো কিছু উল্লেখ করো না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 & R1 (1st Conditional Passive): 'Unless' যুক্ত অংশটি Present Tense হয় এবং তোমাকে অন্যের দ্বারা জিজ্ঞাসা করা হবে (Passive) বোঝাতে [are asked] বসেছে!</strong>"},
    {id: 185, bookNum: "37.e", type: "normal", ruleId: "R10", raw: "I waited for my friend until he ________ (come).", ans: "came", bn: "আমার বন্ধু না আসা পর্যন্ত আমি তার জন্য অপেক্ষা করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Until): প্রথম অংশে Past (waited) থাকায় 'until'-এর পরের অংশেও Past Indefinite [V2 = came] বসেছে!</strong>"},
    {id: 186, bookNum: "38.a", type: "normal", ruleId: "R2", raw: "Look before you ________ (leap).", ans: "leap", bn: "ভাবিয়া করিও কাজ, করিয়া ভাবিও না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (প্রবাদ বাক্য): চিরন্তন প্রবাদ বাক্য সর্বদা Present Indefinite Tense-এ হয়!</strong>Subject 'you'-এর সাথে Base Form 'leap' বসেছে।"},
    {id: 187, bookNum: "38.b", type: "normal", ruleId: "R12", raw: "Let me ________ (go) there.", ans: "go", bn: "আমাকে সেখানে যেতে দাও।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'Make / Let + ব্যক্তি (me)' থাকলে পরের ভার্বের আগে কখনোই 'to' বসে না, সরাসরি [V1] বসে!</strong>তাই 'go' বসেছে।"},
    {id: 188, bookNum: "38.c", type: "normal", ruleId: "R5", raw: "He ________ (come) yesterday.", ans: "came", bn: "সে গতকাল এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি Past Indefinite [V2 = came] বসেছে!</strong>"},
    {id: 189, bookNum: "38.d", type: "normal", ruleId: "R12", raw: "I wish I ________ (be) in the occasion.", ans: "were", bn: "আমি যদি ওই অনুষ্ঠানে উপস্থিত থাকতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (be) থাকলে যেকোনো Subject-এর পরেই সর্বদা [were] বসে!</strong>"},
    {id: 190, bookNum: "38.e", type: "normal", ruleId: "R5", raw: "It has been ________ (rain) since morning.", ans: "raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): 'since morning' এবং শূন্যস্থানের আগে 'has been' দেওয়াই থাকায় সরাসরি [V1 + ing (raining)] বসেছে!</strong>"},
    {id: 191, bookNum: "39.a", type: "normal", ruleId: "R10", raw: "No sooner had he ________ (see) the police than he ________ (run).", ans: "seen, ran", bn: "পুলিশকে দেখা মাত্রই সে দৌড়ে পালিয়ে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): [No sooner had + Sub + V3 ... than + Sub + V2] — তাই ১ম শূন্যস্থানে V3 (seen) এবং ২য় শূন্যস্থানে V2 (ran) বসেছে!</strong>"},
    {id: 192, bookNum: "39.b", type: "normal", ruleId: "R12", raw: "Would that I ________ (go) to college.", ans: "could go", bn: "আমি যদি কলেজে যেতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that' থাকলে Subject-এর পর সর্বদা [could + V1] বসে!</strong>তাই 'could go' হয়েছে।"},
    {id: 193, bookNum: "39.c", type: "normal", ruleId: "R12", raw: "I wish, I ________ (be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (be) থাকলে সর্বদা [were] বসে!</strong>"},
    {id: 194, bookNum: "39.d", type: "normal", ruleId: "R11", raw: "Many years passed, since I ________ (meet) her last.", ans: "had met", bn: "তার সাথে আমার শেষ দেখা হওয়ার পর অনেক বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর বাম পাশে Past Indefinite [V2 = passed] থাকলে ডান পাশে সর্বদা Past Perfect [had + V3] বসে!</strong>তাই 'had met' হয়েছে।"},
    {id: 195, bookNum: "39.e", type: "normal", ruleId: "R7", raw: "Would you mind ________ (have) a cup of tea?", ans: "having", bn: "আপনি কি এক কাপ চা খাবেন?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind'-এর ঠিক পরেই সর্বদা [V1 + ing] বসে!</strong>তাই have + ing = 'having' হয়েছে।"},
    {id: 196, bookNum: "40.a", type: "normal", ruleId: "R12", raw: "I wish I ________ (be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর অবাস্তব কল্পনা বোঝাতে Be-verb হিসেবে সর্বদা [were] বসে!</strong>"},
    {id: 197, bookNum: "40.b", type: "normal", ruleId: "R11", raw: "Many years passed since I ________ (meet) him last.", ans: "had met", bn: "তার সাথে আমার শেষ দেখা হওয়ার পর অনেক বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর আগে V2 (passed) থাকায় পরে [had + V3 = had met] বসেছে!</strong>"},
    {id: 201, bookNum: "41.a", type: "normal", ruleId: "R5", raw: "Rahim ________ (come) home yesterday.", ans: "came", bn: "রহিম গতকাল বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি Past Indefinite [V2 = came] বসেছে!</strong>"},
    {id: 202, bookNum: "41.b", type: "normal", ruleId: "R2", raw: "He ________ (go) to school.", ans: "goes", bn: "সে স্কুলে যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (Present Indefinite): সাধারণ নিয়মিত কাজ বোঝালে এবং Subject 3rd Person Singular (He) হলে ভার্বের সাথে [s/es] যুক্ত হয়!</strong>তাই 'goes' হয়েছে।"},
    {id: 203, bookNum: "41.c", type: "normal", ruleId: "R5", raw: "It ________ (rain) for two hours.", ans: "has been raining", bn: "দুই ঘণ্টা ধরে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for + মোট সময় (two hours)' থাকায় [has been + V1 + ing] বসেছে!</strong>"},
    {id: 204, bookNum: "41.d", type: "normal", ruleId: "R6", raw: "My younger daughter is looking forward to ________ (meet) her grandmother.", ans: "meeting", bn: "আমার ছোট মেয়ে তার দাদীর সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'is looking forward to'-এর পর সর্বদা [V1 + ing] বসে!</strong>তাই 'meeting' হয়েছে।"},
    {id: 205, bookNum: "41.e", type: "normal", ruleId: "R1", raw: "I have ________ (have) a headache.", ans: "had", bn: "আমার মাথা ব্যথা হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): শূন্যস্থানের আগে 'have' দেওয়াই থাকায় মূল ভার্ব (have)-এর ৩য় রূপ [V3 = had] বসেছে!</strong>"},
	// =======================================================
    // Part 3: Question 201 to 300 (ID: 206 to 309)
    // =======================================================
    {id: 206, bookNum: "42.a", type: "normal", ruleId: "R5", raw: "She ________ (meet) her last year.", ans: "met", bn: "গত বছর সে তার সাথে দেখা করেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে অতীতের সংকেত 'last year' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>meet-এর পাস্ট ফর্ম 'met'।"},
    {id: 207, bookNum: "42.b", type: "normal", ruleId: "R9", raw: "If he had come, I ________ to market.", ans: "would have gone", bn: "সে যদি আসতো, তবে আমি বাজারে যেতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাম পাশে [If + had + V3 (had come)] থাকায় ডান পাশে সর্বদা [would / could / might have + V3] বসে!</strong>তাই 'would have gone' হয়েছে।"},
    {id: 208, bookNum: "42.c", type: "normal", ruleId: "R11", raw: "While ________ (walk) on the road, a kite flew away.", ans: "walking", bn: "রাস্তায় হাঁটার সময়, একটি চিল উড়ে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While'-এর ঠিক পরেই কোনো Subject না থেকে সরাসরি ভার্ব থাকলে [V1 + ing] বসে!</strong>তাই 'walking' হয়েছে।"},
    {id: 209, bookNum: "42.e", type: "normal", ruleId: "R10", raw: "We will wait here until you ________ (return).", ans: "return", bn: "তুমি ফিরে না আসা পর্যন্ত আমরা এখানে অপেক্ষা করবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Future): [Future ⟷ Until / As soon as ⟷ V1] — প্রথম অংশে Future (will wait) থাকায় 'until'-এর পরে Present Indefinite [V1 = return] বসেছে!</strong>"},
    {id: 210, bookNum: "43.a", type: "normal", ruleId: "R10", raw: "He ________ (go) to bed before I came.", ans: "had gone", bn: "আমি আসার পূর্বেই সে ঘুমাতে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before মানে আগে' — তাই before-এর আগে সর্বদা Past Perfect [had + V3] বসে!</strong>তাই 'had gone' হয়েছে।"},
    {id: 211, bookNum: "43.b", type: "normal", ruleId: "R12", raw: "I got the letter ________ (type).", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'get / got + বস্তু (the letter)' থাকলে পরের ভার্বটি সর্বদা [V3] হয়!</strong>তাই 'typed' বসেছে।"},
    {id: 212, bookNum: "43.c", type: "normal", ruleId: "R11", raw: "She spoke as if I ________ (not hear).", ans: "had not heard", bn: "সে এমনভাবে কথা বলল যেন আমি শুনতেই পাইনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As if): 'As if / As though'-এর বাম পাশে Past [V2 = spoke] থাকলে ডান পাশে সর্বদা Past Perfect [had + V3] বসে!</strong>তাই নেগেটিভ রূপে 'had not heard' হয়েছে।"},
    {id: 213, bookNum: "43.d", type: "normal", ruleId: "R3", raw: "He ________ (read) a book now.", ans: "is reading", bn: "সে এখন একটি বই পড়ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'now' থাকায় কাজটি এই মুহূর্তে চলছে বোঝায়, তাই [is reading] বসেছে!</strong>"},
    {id: 214, bookNum: "43.e", type: "normal", ruleId: "R5", raw: "The boy ________ yesterday.", ans: "did not play", bn: "ছেলেটি গতকাল খেলেনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Negative): বাক্যে 'yesterday' থাকায় না-বোধক করতে [did not + V1 (did not play)] বসেছে!</strong>"},
    {id: 215, bookNum: "44.a", type: "normal", ruleId: "R11", raw: "I ________ him long since.", ans: "had seen / saw", bn: "অনেক আগে আমি তাকে দেখেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 & R5 (Long since): বাক্যের শেষে 'long since' (অনেক আগে) থাকলে অতীতের ঘটনা বোঝাতে [had seen / saw] বসে!</strong>"},
    {id: 216, bookNum: "44.b", type: "normal", ruleId: "R12", raw: "Work hard lest you ________ (fail).", ans: "should fail", bn: "কঠোর পরিশ্রম করো পাছে তুমি পরীক্ষায় ফেল না করো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Warning - Lest): বাক্যে 'lest' থাকলে Subject-এর পর চোখ বন্ধ করে Active-এ [should / might + V1] বসে!</strong>তাই 'should fail' হয়েছে।"},
    {id: 217, bookNum: "44.c", type: "normal", ruleId: "R1", raw: "Did he not ________ (eat) rice?", ans: "eat", bn: "সে কি ভাত খায়নি?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs): বাক্যে 'do / does / did' থাকলে মূল ভার্বের সর্বদা আসল রূপ [V1] বসে!</strong>এখানে 'Did' থাকায় অপরিবর্তিত 'eat' বসেছে।"},
    {id: 218, bookNum: "44.d", type: "normal", ruleId: "R10", raw: "She studied hard so that she ________ (may pass).", ans: "might pass", bn: "সে কঠোর পড়াশোনা করেছিল যেন সে পাস করতে পারে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 & R1 (Tense-এর সমতা - So that): 'so that'-এর আগের অংশে Past [V2 = studied] থাকায় পরের অংশে may পরিবর্তিত হয়ে [might + V1] বসেছে!</strong>"},
    {id: 219, bookNum: "44.e", type: "normal", ruleId: "R9", raw: "If you had not helped me, I ________ (fail).", ans: "would have failed", bn: "তুমি যদি আমাকে সাহায্য না করতে, তবে আমি ব্যর্থ হতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাম পাশে [If + had not + V3] থাকায় ডান পাশে [would have + V3 (would have failed)] বসেছে!</strong>"},
    {id: 220, bookNum: "45.a", type: "normal", ruleId: "R9", raw: "If I were a bird, I ________ (fly) in the sky.", ans: "would fly", bn: "আমি যদি পাখি হতাম, তবে আকাশে উড়ে বেড়াতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে সর্বদা [would / could + V1] বসে!</strong>তাই 'would fly' হয়েছে।"},
    {id: 221, bookNum: "45.b", type: "normal", ruleId: "R12", raw: "I wish I ________ (know) the address of his house.", ans: "knew", bn: "আমি যদি তার বাড়ির ঠিকানাটি জানতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish + Subject' থাকলে পরবর্তী মূল ভার্বটি সর্বদা Past Form [V2] হয়!</strong>তাই know -> knew।"},
    {id: 222, bookNum: "45.c", type: "normal", ruleId: "R9", raw: "If I ________ (try), I might have succeeded.", ans: "had tried", bn: "আমি যদি চেষ্টা করতাম, তবে হয়তো সফল হতে পারতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): ডান পাশে [might have + V3] দেওয়াই আছে, তাই বাম পাশের 'If' অংশে Past Perfect [had + V3 = had tried] বসেছে!</strong>"},
    {id: 223, bookNum: "45.d", type: "normal", ruleId: "R5", raw: "I ________ (suffer) from fever for a long time.", ans: "have been suffering", bn: "আমি দীর্ঘ সময় ধরে জ্বরে ভুগছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for + সময় (for a long time)' থাকায় [have been + V1 + ing] বসেছে!</strong>"},
    {id: 224, bookNum: "46.a", type: "normal", ruleId: "R6", raw: "I am not used to ________ at this time of the day. (walk)", ans: "walking", bn: "দিনের এই সময়ে আমি হাঁটাহাঁটি করায় অভ্যস্ত নই।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'be used to (am not used to)' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing] যুক্ত হয়!</strong>তাই 'walking' হয়েছে।"},
    {id: 225, bookNum: "46.b", type: "normal", ruleId: "R5", raw: "What you ________ last night? (to do)", ans: "did you do", bn: "গত রাতে তুমি কী করেছিলে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'last night' এবং প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did you do)] বসেছে!</strong>"},
    {id: 226, bookNum: "46.c", type: "normal", ruleId: "R11", raw: "Twenty years ________ since my father died. (pass)", ans: "have passed", bn: "আমার বাবা মারা যাওয়ার পর থেকে বিশটি বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর ডান পাশে V2 (died) থাকায় বাম পাশে Present Perfect [have passed] বসেছে!</strong>"},
    {id: 227, bookNum: "46.d", type: "normal", ruleId: "R5", raw: "I ________ the documentary for the last twenty minutes. (watch)", ans: "have been watching", bn: "আমি গত বিশ মিনিট ধরে প্রামাণ্যচিত্রটি দেখছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for + সময় (for the last twenty minutes)' থাকায় [have been watching] বসেছে!</strong>"},
    {id: 228, bookNum: "47.a", type: "normal", ruleId: "R4", raw: "Population of Dhaka city ________ (to increase) recently.", ans: "has increased", bn: "সম্প্রতি ঢাকা শহরের জনসংখ্যা বৃদ্ধি পেয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'recently' থাকলে Present Perfect [have / has + V3] হয়!</strong>আসল সাবজেক্ট 'Population' সিঙ্গুলার হওয়ায় 'has increased' বসেছে।"},
    {id: 229, bookNum: "47.b", type: "normal", ruleId: "R12", raw: "I wish I ________ (to be) the king.", ans: "were", bn: "আমি যদি রাজা হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (to be) থাকলে সর্বদা [were] বসে!</strong>"},
    {id: 230, bookNum: "47.c", type: "normal", ruleId: "R10", raw: "The patient had died before the doctor ________ (come).", ans: "came", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3] দেওয়াই আছে, তাই before-এর পরে সর্বদা Past Indefinite [V2 = came] বসে!</strong>"},
    {id: 231, bookNum: "47.d", type: "normal", ruleId: "R3", raw: "He ________ (read) now.", ans: "is reading", bn: "সে এখন পড়ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'now' থাকায় Present Continuous [is reading] বসেছে!</strong>"},
    {id: 232, bookNum: "47.e", type: "normal", ruleId: "R5", raw: "Halim ________ (dream) a bad dream last night.", ans: "dreamt", bn: "হালিম গত রাতে একটি দুঃস্বপ্ন দেখেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2 = dreamt] বসেছে!</strong>"},
    {id: 233, bookNum: "48.a", type: "normal", ruleId: "R1", raw: "Rome was not ________ (build) in a day.", ans: "built", bn: "রোম এক দিনে তৈরি হয়নি। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): রোম শহর নিজে তৈরি হয়নি (Passive), তাই 'was not'-এর পর build-এর ৩য় রূপ [V3 = built] বসেছে!</strong>"},
    {id: 234, bookNum: "48.b", type: "normal", ruleId: "R9", raw: "If I ________ (see) him, I would have given him the news.", ans: "had seen", bn: "আমি যদি তাকে দেখতাম, তবে তাকে খবরটি দিতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): ডান পাশে [would have + V3] থাকায় বাম পাশের 'If' অংশে Past Perfect [had + V3 = had seen] বসেছে!</strong>"},
    {id: 235, bookNum: "48.c", type: "normal", ruleId: "R2", raw: "Bees ________ (gather) honey.", ans: "gather", bn: "মৌমাছিরা মধু সংগ্রহ করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য): চিরন্তন সত্য বাক্য Present Indefinite হয় এবং Subject 'Bees' বহুবচন হওয়ায় সরাসরি [V1 = gather] বসেছে!</strong>"},
    {id: 236, bookNum: "48.d", type: "normal", ruleId: "R4", raw: "Recently use of mobile phones ________ (increase).", ans: "has increased", bn: "সম্প্রতি মোবাইল ফোনের ব্যবহার বৃদ্ধি পেয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 & R13 (Raj-Ley + 'of' রুল): বাক্যে 'Recently' আছে এবং 'of'-এর আগের আসল সাবজেক্ট 'use' সিঙ্গুলার হওয়ায় [has increased] বসেছে!</strong>"},
    {id: 237, bookNum: "48.e", type: "normal", ruleId: "R1", raw: "A penny saved is a penny ________ (earn).", ans: "earned", bn: "এক পয়সা জমানো মানে এক পয়সা আয় করা। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Passive Participle): পয়সা অন্যের দ্বারা আয় করা হয় (Passive Participle), তাই আগের 'saved'-এর সাথে মিল রেখে [V3 = earned] বসেছে!</strong>"},
    {id: 238, bookNum: "49.a", type: "normal", ruleId: "R5", raw: "A fire ________ (break) out in the slums last night.", ans: "broke", bn: "গত রাতে বস্তিতে আগুন লেগেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2 = broke] বসেছে!</strong>"},
    {id: 239, bookNum: "49.b", type: "normal", ruleId: "R1", raw: "Speak the truth or you ________ (punish).", ans: "will be punished", bn: "সত্য কথা বলো অন্যথায় তোমাকে শাস্তি দেওয়া হবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive - Future): ভবিষ্যতে অন্যের দ্বারা তোমাকে শাস্তি দেওয়া হবে (Passive), তাই [will be + V3 (will be punished)] বসেছে!</strong>"},
    {id: 240, bookNum: "49.c", type: "normal", ruleId: "R9", raw: "I would knit a sweater if I ________ (have) more wool.", ans: "had", bn: "আমার যদি আরও উল থাকতো, তবে আমি একটি সোয়েটার বুনতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): প্রথম অংশে [would + V1 (would knit)] থাকায় 'if' যুক্ত অংশে Past Indefinite [V2 = had] বসেছে!</strong>"},
    {id: 241, bookNum: "49.d", type: "normal", ruleId: "R11", raw: "While they ________ (play), it started raining.", ans: "were playing", bn: "যখন তারা খেলছিল, তখন বৃষ্টি শুরু হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (they - বহুবচন)' থাকায় অতীতে চলমান কাজে [were playing] বসেছে!</strong>"},
    {id: 242, bookNum: "49.e", type: "normal", ruleId: "R10", raw: "The train ________ (leave) the platform before we arrived.", ans: "had left", bn: "আমরা পৌঁছানোর পূর্বেই ট্রেনটি প্ল্যাটফর্ম ছেড়ে চলে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে সর্বদা Past Perfect [had + V3 = had left] বসে!</strong>"},
    {id: 243, bookNum: "50.a", type: "normal", ruleId: "R12", raw: "It is high time we ________ (act) on the matter.", ans: "acted", bn: "এটাই উপযুক্ত সময় এই বিষয়ে আমাদের পদক্ষেপ নেওয়ার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (we)' থাকলে পরবর্তী ভার্বটি সর্বদা Past Form [V2 = acted] হয়!</strong>"},
    {id: 244, bookNum: "50.b", type: "normal", ruleId: "R13", raw: "The police ________ (be verb) informed yesterday.", ans: "were", bn: "পুলিশকে গতকাল জানানো হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Plural + Past): 'Police' শব্দটি সর্বদা Plural এবং বাক্যে 'yesterday' থাকায় Past Plural Be-verb হিসেবে [were] বসেছে!</strong>"},
    {id: 245, bookNum: "50.c", type: "normal", ruleId: "R13", raw: "The Arabian Nights ________ (be verb) still a great.", ans: "is", bn: "আরব্য রজনী (বইটি) এখনও একটি দুর্দান্ত বই।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - বইয়ের নাম): 'The Arabian Nights' একটি একক বইয়ের নাম হওয়ায় সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 246, bookNum: "50.d", type: "normal", ruleId: "R10", raw: "My father ________ (leave) before I came.", ans: "had left", bn: "আমি আসার পূর্বেই আমার বাবা চলে গিয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে সর্বদা Past Perfect [had + V3 = had left] বসে!</strong>"},
    {id: 247, bookNum: "51.a", type: "normal", ruleId: "R1", raw: "Why ________ she laugh at me?", ans: "did/does", bn: "সে কেন আমাকে দেখে হাসল/হাসে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs in Question): পরে মূল ভার্বের V1 (laugh) দেওয়া থাকায় সাবজেক্ট 'she'-এর আগে বর্তমানে [does] এবং অতীতে [did] বসে!</strong>"},
    {id: 248, bookNum: "51.b", type: "normal", ruleId: "R10", raw: "We ________ dinner when the phone rang?", ans: "were having", bn: "ফোনটি যখন বেজে উঠেছিল তখন আমরা রাতের খাবার খাচ্ছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 & R11 (Past Continuous with When): অতীতে একটি কাজ চলার সময় আরেকটি ঘটনা (when the phone rang) ঘটলে চলমান কাজটি [was / were + V1 + ing (were having)] হয়!</strong>"},
    {id: 249, bookNum: "51.c", type: "normal", ruleId: "R5", raw: "It ________ (rain) since morning.", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since morning' থাকায় [has been raining] বসেছে!</strong>"},
    {id: 250, bookNum: "51.d", type: "normal", ruleId: "R5", raw: "I ________ (meet) him yesterday.", ans: "met", bn: "গতকাল আমি তার সাথে দেখা করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি Past Indefinite [V2 = met] বসেছে!</strong>"},
    {id: 251, bookNum: "51.e", type: "normal", ruleId: "R2", raw: "Babies ________ (cry) when they are hungry.", ans: "cry", bn: "শিশুরা ক্ষুধার্ত হলে কাঁদে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন স্বভাব): শিশুদের চিরন্তন স্বভাব এবং পরের অংশে Present (are) থাকায় Plural Subject 'Babies'-এর সাথে সরাসরি [V1 = cry] বসেছে!</strong>"},
    {id: 252, bookNum: "52.a", type: "normal", ruleId: "R11", raw: "While ________ (walk) on the road, I saw a snake.", ans: "walking", bn: "রাস্তায় হাঁটার সময়, আমি একটি সাপ দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While'-এর ঠিক পরেই কোনো Subject না থাকলে সরাসরি [V1 + ing = walking] বসে!</strong>"},
    {id: 253, bookNum: "52.b", type: "normal", ruleId: "R5", raw: "I ________ (go) to my village home last week.", ans: "went", bn: "গত সপ্তাহে আমি আমার গ্রামের বাড়িতে গিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last week' থাকায় সরাসরি Past Indefinite [V2 = went] বসেছে!</strong>"},
    {id: 254, bookNum: "53.a", type: "normal", ruleId: "R13", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'One of' সর্বদা Singular এবং 'yesterday' থাকায় [was] বসেছে!</strong>"},
    {id: 255, bookNum: "53.b", type: "normal", ruleId: "R12", raw: "It is time ________ (start).", ans: "to start", bn: "এখনই শুরু করার সময়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act - No Subject): 'It is time'-এর পর যদি কোনো Subject না থাকে, তবে সরাসরি [to + V1 (to start)] বসে!</strong>"},
    {id: 256, bookNum: "53.c", type: "normal", ruleId: "R9", raw: "If I were a bird, I ________ (fly).", ans: "would fly", bn: "আমি যদি পাখি হতাম, তবে উড়ে বেড়াতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে [would + V1 (would fly)] বসেছে!</strong>"},
    {id: 257, bookNum: "53.d", type: "normal", ruleId: "R12", raw: "I got my rice ________ (cook).", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তু (my rice)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = cooked] বসেছে!</strong>"},
    {id: 258, bookNum: "53.e", type: "normal", ruleId: "R5", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি [V2 = came] বসেছে!</strong>"},
    {id: 259, bookNum: "54.a", type: "normal", ruleId: "R9", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + had + noun] থাকায় ডান পাশে [would open] বসেছে!</strong>"},
    {id: 260, bookNum: "54.b", type: "normal", ruleId: "R13", raw: "More than one person ________ (interest) in the problem given yesterday.", ans: "was interested", bn: "গতকাল দেওয়া সমস্যাটিতে একের বেশি ব্যক্তি আগ্রহী ছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Singular Structure + Past): 'More than one + singular noun' থাকলে ভার্ব সর্বদা Singular হয় এবং 'yesterday' থাকায় [was interested] বসেছে!</strong>"},
    {id: 261, bookNum: "55.a", type: "normal", ruleId: "R2", raw: "It often heavily ________ in Bangladesh. (rain)", ans: "rains", bn: "বাংলাদেশে প্রায়শই প্রচুর বৃষ্টিপাত হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'often' থাকায় Present Indefinite হয়েছে এবং Subject 'It' সিঙ্গুলার হওয়ায় [rains] বসেছে!</strong>"},
    {id: 262, bookNum: "55.b", type: "normal", ruleId: "R10", raw: "The train already ________ when I reached the station. (leave)", ans: "had left", bn: "আমি যখন স্টেশনে পৌঁছালাম তখন ট্রেনটি ইতিমধ্যেই ছেড়ে চলে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance): অতীতের দুটি কাজের মধ্যে (when I reached - V2) ট্রেনটি তারও আগে চলে গিয়েছিল বোঝাতে Past Perfect [had left] বসেছে!</strong>"},
    {id: 263, bookNum: "55.c", type: "normal", ruleId: "R1", raw: "He ________ to Delhi tomorrow. (go)", ans: "will go", bn: "সে আগামীকাল দিল্লি যাবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Future Time): বাক্যে 'tomorrow' (আগামীকাল) থাকায় Future Indefinite [will + V1 (will go)] বসেছে!</strong>"},
    {id: 264, bookNum: "55.d", type: "normal", ruleId: "R7", raw: "I cannot help ________ (laugh).", ans: "laughing", bn: "আমি না হেসে পারি না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'cannot help / could not help'-এর ঠিক পরেই সর্বদা [V1 + ing = laughing] বসে!</strong>"},
    {id: 265, bookNum: "55.e", type: "normal", ruleId: "R9", raw: "I had the time I ________ (go).", ans: "would go", bn: "আমার সময় থাকলে আমি যেতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): প্রথম অংশে Past Indefinite (had the time) থাকায় পরের অংশে [would + V1 (would go)] বসেছে!</strong>"},
    {id: 266, bookNum: "56.a", type: "normal", ruleId: "R13", raw: "Fifty kilometers ________ (be) a long distance.", ans: "is", bn: "পঞ্চাশ কিলোমিটার একটি দীর্ঘ দূরত্ব।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - দূরত্ব): নির্দিষ্ট একক দূরত্ব (Fifty kilometers) সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 267, bookNum: "56.b", type: "normal", ruleId: "R7", raw: "He gave up ________ (play) football when he got married.", ans: "playing", bn: "বিয়ের পর সে ফুটবল খেলা ছেড়ে দিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'give up / gave up'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = playing] যুক্ত হয়!</strong>"},
    {id: 268, bookNum: "57.a", type: "normal", ruleId: "R2", raw: "Rahim always ________ (feel) tension.", ans: "feels", bn: "রহিম সবসময় মানসিক চাপ অনুভব করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'always' থাকায় এবং Subject 'Rahim' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [feels] হয়েছে!</strong>"},
    {id: 269, bookNum: "57.b", type: "normal", ruleId: "R4", raw: "I already ________ (forget) his name.", ans: "have already forgotten", bn: "আমি ইতিমধ্যেই তার নাম ভুলে গিয়েছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'already' থাকায় Present Perfect [have already forgotten] বসেছে!</strong>"},
    {id: 270, bookNum: "57.c", type: "normal", ruleId: "R6", raw: "I prefer ________ (dance) to playing.", ans: "dancing", bn: "আমি খেলার চেয়ে নাচ বেশি পছন্দ করি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 & R7 (Prefer...to): 'prefer'-এর পর দুটি কাজের তুলনায় উভয় ভার্বের সাথেই [V1 + ing] বসে!</strong>তাই 'dancing' হয়েছে।"},
    {id: 271, bookNum: "57.d", type: "normal", ruleId: "R5", raw: "I ________ (meet) him last night.", ans: "met", bn: "গত রাতে আমি তার সাথে দেখা করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি [V2 = met] বসেছে!</strong>"},
    {id: 272, bookNum: "57.e", type: "normal", ruleId: "R7", raw: "I feel like ________ (cry).", ans: "crying", bn: "আমার কাঁদতে ইচ্ছে করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind, cannot help, feel like, worth'—এদের পরে সর্বদা [V1 + ing] বসে!</strong>তাই 'crying' হয়েছে।"},
    {id: 273, bookNum: "58.a", type: "normal", ruleId: "R1", raw: "It is a big factory, five hundred people ________ (employ) there.", ans: "are employed", bn: "এটি একটি বড় কারখানা, সেখানে পাঁচশত লোক নিয়োজিত আছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): পাঁচশত লোক কারখানার দ্বারা নিয়োজিত (Passive) এবং প্রথম অংশ Present (It is) হওয়ায় [are employed] বসেছে!</strong>"},
    {id: 274, bookNum: "58.b", type: "normal", ruleId: "R5", raw: "I've been ________ (walk) for three hours.", ans: "walking", bn: "আমি তিন ঘন্টা ধরে হাঁটছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): 'for three hours' এবং আগে 'I've been' দেওয়াই থাকায় সরাসরি [V1 + ing = walking] বসেছে!</strong>"},
    {id: 275, bookNum: "58.c", type: "normal", ruleId: "R13", raw: "The boat sank quickly but fortunately everybody ________ (rescue).", ans: "was rescued", bn: "নৌকাটি দ্রুত ডুবে গিয়েছিল কিন্তু ভাগ্যবশত সবাই উদ্ধার পেয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R1 (Always Singular + Past Passive): 'everybody' সর্বদা Singular, বাক্যটি অতীতকালের (sank) এবং অন্যের দ্বারা উদ্ধার করা হয়েছিল (Passive) বোঝাতে [was rescued] বসেছে!</strong>"},
    {id: 276, bookNum: "58.d", type: "normal", ruleId: "R1", raw: "When I was on holiday, my camera ________ (steal) from my hotel.", ans: "was stolen", bn: "আমি যখন ছুটিতে ছিলাম, তখন আমার হোটেল থেকে আমার ক্যামেরাটি চুরি হয়ে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R5 (Past Passive): ক্যামেরা নিজে চুরি করতে পারে না, চোরের দ্বারা চুরি হয়েছিল (Passive) এবং ঘটনাটি অতীতের (When I was) হওয়ায় [was stolen] বসেছে!</strong>"},
    {id: 277, bookNum: "58.e", type: "normal", ruleId: "R5", raw: "I ________ (buy) a new bicycle last week.", ans: "bought", bn: "গত সপ্তাহে আমি একটি নতুন বাইসাইকেল কিনেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last week' থাকায় সরাসরি Past Indefinite [V2 = bought] বসেছে!</strong>"},
    {id: 278, bookNum: "59.a", type: "normal", ruleId: "R8", raw: "He is yet ________ (return).", ans: "to return", bn: "সে এখনও ফিরে আসেনি / তার এখনো ফিরতে বাকি আছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Be yet to): শূন্যস্থানের আগে 'am / is / are + yet' দেওয়াই থাকলে কোনো কাজ এখনো বাকি আছে বোঝাতে [to + V1 (to return)] বসে!</strong>"},
    {id: 279, bookNum: "59.b", type: "normal", ruleId: "R7", raw: "We found him ________ (watch) TV.", ans: "watching", bn: "আমরা তাকে টিভি দেখা অবস্থায় দেখতে পেলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'see, hear, find/found'-এর পর ২য় ভার্ব আসলে সরাসরি [V1 + ing = watching] বসে!</strong>"},
    {id: 280, bookNum: "59.c", type: "normal", ruleId: "R2", raw: "The more you read, the more you ________ (learn).", ans: "learn/will learn", bn: "যত পড়িবে, তত শিখিবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (প্রবাদ বাক্য / Parallel Structure): 'The more... the more...' যুক্ত প্রবাদ বাক্যে Present Indefinite [learn] বা Future [will learn] বসে!</strong>"},
    {id: 281, bookNum: "59.d", type: "normal", ruleId: "R11", raw: "While ________ (walk) along the road, I saw him.", ans: "walking", bn: "রাস্তা দিয়ে হাঁটার সময়, আমি তাকে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While'-এর ঠিক পরেই কোনো Subject না থাকায় সরাসরি [V1 + ing = walking] বসেছে!</strong>"},
    {id: 282, bookNum: "59.e", type: "normal", ruleId: "R2", raw: "There is no mother but ________ (love) her child.", ans: "loves", bn: "এমন কোনো মা নেই যিনি তার সন্তানকে ভালোবাসেন না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R13 (Universal Truth + Singular): এটি একটি চিরন্তন সত্য বাক্য এবং সাবজেক্ট 'mother' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [loves] বসেছে!</strong>"},
    {id: 283, bookNum: "60.a", type: "normal", ruleId: "R1", raw: "What is lotted cannot ________ (blot).", ans: "be blotted", bn: "ভাগ্যের লিখন না যায় খণ্ডন। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): ভাগ্যের লিখন নিজে মুছে যায় না, অন্যের দ্বারা মুছে ফেলা যায় না (Passive), তাই 'cannot'-এর পর [be + V3 (be blotted)] বসেছে!</strong>"},
    {id: 284, bookNum: "60.b", type: "normal", ruleId: "R5", raw: "The police ________ (recover) the stolen money yesterday.", ans: "recovered", bn: "পুলিশ গতকাল চুরি হওয়া টাকা উদ্ধার করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' এবং Active অর্থ থাকায় সরাসরি Past Indefinite [V2 = recovered] বসেছে!</strong>"},
    {id: 285, bookNum: "60.c", type: "normal", ruleId: "R12", raw: "He got his house ________ (repair).", ans: "repaired", bn: "সে তার বাড়িটি মেরামত করিয়ে নিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তু (his house)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = repaired] বসেছে!</strong>"},
    {id: 286, bookNum: "60.d", type: "normal", ruleId: "R1", raw: "We cannot but ________ (obey) our parents.", ans: "obey", bn: "আমরা আমাদের বাবা-মাকে মান্য না করে পারি না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'cannot but / had better / would rather'-এর ঠিক পরেই সর্বদা মূল ভার্বের আসল রূপ [V1 = obey] বসে!</strong>(মনে রাখবেন: cannot help থাকলে ing হয়, কিন্তু cannot but থাকলে V1 হয়)।"},
    {id: 287, bookNum: "60.e", type: "normal", ruleId: "R8", raw: "He is too clever to ________ (cheat).", ans: "be cheated", bn: "সে এতই চালাক যে তাকে ঠকানো অসম্ভব।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Passive): 'too...[adj]...to' যুক্ত বাক্যে সে নিজে ঠকবে না বরং অন্য কেউ তাকে ঠকাতে পারবে না (Passive) বোঝাতে 'to'-এর পর [be + V3 (be cheated)] বসেছে!</strong>"},
    {id: 288, bookNum: "61.a", type: "normal", ruleId: "R2", raw: "The girl ________ (not sing) a song.", ans: "does not sing", bn: "মেয়েটি গান গায় না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R1 (Present Negative): Subject 'The girl' (3rd Person Singular) হওয়ায় না-বোধক করতে [does not + V1 (does not sing)] বসেছে!</strong>"},
    {id: 289, bookNum: "61.b", type: "normal", ruleId: "R5", raw: "He ________ (not go) to school yesterday.", ans: "did not go", bn: "সে গতকাল স্কুলে যায়নি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Negative): বাক্যে 'yesterday' থাকায় না-বোধক করতে [did not + V1 (did not go)] বসেছে!</strong>"},
    {id: 290, bookNum: "61.c", type: "normal", ruleId: "R5", raw: "I ________ (read) for three hours.", ans: "have been reading", bn: "আমি তিন ঘন্টা ধরে পড়ছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for three hours' থাকায় [have been reading] বসেছে!</strong>"},
    {id: 291, bookNum: "61.d", type: "normal", ruleId: "R9", raw: "If I were a king, I ________ (help) the poor.", ans: "would help", bn: "আমি যদি রাজা হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে সর্বদা [would + V1 (would help)] বসে!</strong>"},
    {id: 292, bookNum: "61.e", type: "normal", ruleId: "R12", raw: "He ran fast lest he ________ (miss) the train.", ans: "should miss", bn: "সে দ্রুত দৌড়েছিল পাছে সে ট্রেনটি মিস না করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Warning - Lest): বাক্যে 'lest' থাকলে Subject-এর পর সর্বদা [should / might + V1 (should miss)] বসে!</strong>"},
    {id: 293, bookNum: "62.a", type: "normal", ruleId: "R5", raw: "It ________ (be verb) raining yesterday.", ans: "was", bn: "গতকাল বৃষ্টি হচ্ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Continuous): বাক্যে 'yesterday' এবং পরে raining দেওয়া থাকায় 'It'-এর সাথে সিঙ্গুলার Past Be-verb [was] বসেছে!</strong>"},
    {id: 294, bookNum: "62.b", type: "normal", ruleId: "R7", raw: "The baby came to me ________ (ran).", ans: "running", bn: "শিশুটি দৌড়াতে দৌড়াতে আমার কাছে এলো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Participle - ২য় ভার্ব): সরল বাক্যে একটি মূল ভার্বের (came) পর আরেকটি চলমান কাজ বোঝাতে ২য় ভার্বের Base Form-এর সাথে [V1 + ing = running] যুক্ত হয়!</strong>"},
    {id: 295, bookNum: "62.c", type: "normal", ruleId: "R1", raw: "The class ________ (be verb) shifted to another room.", ans: "is/was", bn: "ক্লাসটি অন্য রুমে স্থানান্তরিত করা হয়েছে/হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): পরে V3 (shifted) দেওয়া থাকায় সিঙ্গুলার সাবজেক্ট 'The class'-এর সাথে প্যাসিভ সাহায্যকারী ভার্ব হিসেবে [is / was] বসেছে!</strong>"},
    {id: 296, bookNum: "62.d", type: "normal", ruleId: "R5", raw: "His mother ________ (die) last year.", ans: "died", bn: "তার মা গত বছর মারা গিয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last year' থাকায় সরাসরি Past Indefinite [V2 = died] বসেছে!</strong>"},
    {id: 297, bookNum: "62.e", type: "normal", ruleId: "R10", raw: "The patient had died before the doctor ________ (come).", ans: "came", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3] থাকায় পরে সর্বদা [V2 = came] বসে!</strong>"},
    {id: 298, bookNum: "63.a", type: "normal", ruleId: "R1", raw: "He ran away having ________ (take) the money.", ans: "taken", bn: "টাকাটা নিয়ে সে পালিয়ে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): 'have / has / had / having'-এর ঠিক পরেই সর্বদা মূল ভার্বের ৩য় রূপ [V3 = taken] বসে!</strong>"},
    {id: 299, bookNum: "63.b", type: "normal", ruleId: "R13", raw: "The colour of his eye ________ (be) blue.", ans: "is", bn: "তার চোখের রঙ নীল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের আসল সাবজেক্ট 'The colour' সিঙ্গুলার হওয়ায় [is] বসেছে!</strong>"},
    {id: 300, bookNum: "63.c", type: "normal", ruleId: "R12", raw: "I got the work ________ (do) by him.", ans: "done", bn: "আমি তাকে দিয়ে কাজটি করিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'get / got + বস্তু (the work)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = done] বসেছে!</strong>"},
    {id: 301, bookNum: "63.d", type: "normal", ruleId: "R11", raw: "He speaks as though ________ everything.", ans: "he knew", bn: "সে এমনভাবে কথা বলে যেন সে সবকিছুই জানতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As though): 'As though / As if'-এর বাম পাশে Present (speaks) থাকলে ডান পাশে Past Indefinite [Subject + V2 (he knew)] বসে!</strong>"},
    {id: 302, bookNum: "63.e", type: "normal", ruleId: "R9", raw: "I would help him if he ________ (want).", ans: "wanted", bn: "সে যদি চাইতো, তবে আমি তাকে সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): প্রথম অংশে [would + V1 (would help)] থাকায় 'if' যুক্ত অংশে Past Indefinite [V2 = wanted] বসেছে!</strong>"},
    {id: 303, bookNum: "64.a", type: "normal", ruleId: "R2", raw: "A stitch in time ________ (save) nine.", ans: "saves", bn: "সময়ের এক ফোঁড়, অসময়ের দশ ফোঁড়। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (প্রবাদ বাক্য): চিরন্তন প্রবাদ বাক্য Present Indefinite হয় এবং সাবজেক্ট 'A stitch' সিঙ্গুলার হওয়ায় [saves] বসেছে!</strong>"},
    {id: 304, bookNum: "64.b", type: "normal", ruleId: "R6", raw: "He came here with a view to ________ (help) me.", ans: "helping", bn: "সে আমাকে সাহায্য করার উদ্দেশ্যে এখানে এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = helping] বসে!</strong>"},
    {id: 305, bookNum: "64.c", type: "normal", ruleId: "R10", raw: "She said that she ________ (do) the work the previous day.", ans: "had done", bn: "সে বলেছিল যে সে আগের দিন কাজটি করেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Said that): প্রথম অংশে Past (said that) এবং শেষে 'the previous day' (আগের দিন) থাকায় Past Perfect [had + V3 = had done] বসেছে!</strong>"},
    {id: 306, bookNum: "64.d", type: "normal", ruleId: "R2", raw: "There is no mother but ________ (love) her child.", ans: "loves", bn: "এমন কোনো মা নেই যিনি তার সন্তানকে ভালোবাসেন না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (Universal Truth): চিরন্তন সত্য এবং 'mother' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [loves] হয়েছে!</strong>"},
    {id: 307, bookNum: "64.e", type: "normal", ruleId: "R5", raw: "The girl ________ (play) since afternoon.", ans: "has been playing", bn: "মেয়েটি বিকেল থেকে খেলছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since + নির্দিষ্ট সময় (afternoon)' থাকায় [has been playing] বসেছে!</strong>"},
    {id: 308, bookNum: "65.a", type: "normal", ruleId: "R13", raw: "Why he has done it ________ (be) a mystery.", ans: "is", bn: "সে কেন এটি করেছে তা একটি রহস্য।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Clause Subject): পুরো একটি বাক্যাংশ বা Clause (Why he has done it) সাবজেক্ট হিসেবে বসলে তা সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 309, bookNum: "66.a", type: "normal", ruleId: "R1", raw: "What cannot be cured must ________ (endure).", ans: "be endured", bn: "যা প্রতিকার করা যায় না তা অবশ্যই সহ্য করতে হবে। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): এটি নিজে সহ্য করে না, মানুষের দ্বারা সহ্য করতে হয় (Passive), তাই Modal 'must'-এর পর [be + V3 (be endured)] বসেছে!</strong>"},

    {id: 310, bookNum: "67.a", type: "normal", ruleId: "R2", raw: "He always ________ (carry) an umbrella with him.", ans: "carries", bn: "সে সবসময় নিজের সাথে একটি ছাতা বহন করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'always' (নিয়মিত অভ্যাস) থাকায় Present Indefinite হয়েছে!</strong>Subject 'He' (3rd Person Singular) হওয়ায় carry-এর y উঠে ies যুক্ত হয়ে 'carries' বসেছে।"},
    {id: 311, bookNum: "67.b", type: "normal", ruleId: "R5", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'yesterday' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did they go)] বসেছে!</strong>"},
    {id: 312, bookNum: "67.c", type: "normal", ruleId: "R10", raw: "No sooner had he ________ (take) the money than he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): [No sooner had + Sub + V3 ... than + Sub + V2] — এখানে 'No sooner had' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = taken] বসেছে!</strong>"},
    {id: 313, bookNum: "67.d", type: "normal", ruleId: "R12", raw: "I wish I ________ eat not so much.", ans: "ate", bn: "আমি যদি এত বেশি না খেতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish + Subject' থাকলে পরবর্তী মূল ভার্বটি সর্বদা Past Form [V2 = ate] হয়!</strong>"},
    {id: 314, bookNum: "68.a", type: "normal", ruleId: "R6", raw: "They look forward to ________ (receive).", ans: "receiving", bn: "তারা চিঠি বা প্রত্যুত্তর পাওয়ার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): বাক্যে 'look forward to' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = receiving] বসে!</strong>"},
    {id: 315, bookNum: "68.b", type: "normal", ruleId: "R12", raw: "I wish I ________ (meet) you.", ans: "met", bn: "আমি যদি তোমার সাথে দেখা করতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish + Subject' থাকলে পরবর্তী মূল ভার্বটি সর্বদা Past Form [V2 = met] হয়!</strong>"},
    {id: 316, bookNum: "68.c", type: "normal", ruleId: "R11", raw: "They came home while I ________ (study).", ans: "was studying", bn: "যখন আমি পড়ছিলাম তখন তারা বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (I)' থাকায় অতীতে চলমান কাজ বোঝাতে [was / were + V1 + ing (was studying)] বসেছে!</strong>"},
    {id: 317, bookNum: "68.d", type: "normal", ruleId: "R12", raw: "Would that I ________ (go) there.", ans: "could go", bn: "আমি যদি সেখানে যেতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that' থাকলে Subject-এর পর সর্বদা [could + V1 (could go)] বসে!</strong>"},
    {id: 318, bookNum: "68.e", type: "normal", ruleId: "R11", raw: "Shanto played as though he ________ (see) the ball clearly.", ans: "had seen", bn: "শান্ত এমনভাবে খেলল যেন সে বলটি একদম পরিষ্কার দেখতে পেয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As though): 'As though / As if'-এর বাম পাশে Past [V2 = played] থাকলে ডান পাশে সর্বদা Past Perfect [had + V3 (had seen)] বসে!</strong>"},
    {id: 319, bookNum: "69.a", type: "normal", ruleId: "R2", raw: "Ice ________ (float) on water.", ans: "floats", bn: "বরফ পানিতে ভাসে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য): বৈজ্ঞানিক বা চিরন্তন সত্য বাক্য সর্বদা Present Indefinite হয় এবং 'Ice' সিঙ্গুলার হওয়ায় [floats] বসেছে!</strong>"},
    {id: 320, bookNum: "69.b", type: "normal", ruleId: "R7", raw: "I saw him ________ (run).", ans: "running", bn: "আমি তাকে দৌড়াতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing = running] বসে!</strong>"},
    {id: 321, bookNum: "69.c", type: "normal", ruleId: "R11", raw: "While walking at the station. I ________ (meet) him.", ans: "met", bn: "স্টেশনে হাঁটার সময়, তার সাথে আমার দেখা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 & R5 (While Clause + Past Action): অতীতে হাঁটার সময় (While walking) একটি ঘটনা ঘটেছিল বোঝাতে পরের অংশে Past Indefinite [V2 = met] বসেছে!</strong>"},
    {id: 322, bookNum: "69.d", type: "normal", ruleId: "R13", raw: "One of the mangoes ________ (be) rotten.", ans: "was / is", bn: "আমগুলোর মধ্যে একটি পচা ছিল/আছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'One of'-এর পর Noun বহুবচন (mangoes) হলেও আসল কর্তা একটি হওয়ায় সর্বদা Singular Verb [was / is] বসে!</strong>"},
    {id: 323, bookNum: "69.e", type: "normal", ruleId: "R1", raw: "You had better ________ (go) to the class.", ans: "go", bn: "তোমার বরং ক্লাসে যাওয়াই ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'had better / would rather / cannot but'-এর ঠিক পরেই সর্বদা মূল ভার্বের আসল রূপ [V1 = go] বসে!</strong>"},
    {id: 324, bookNum: "70.b", type: "normal", ruleId: "R7", raw: "Karim watched the boat ________ (flow) down the water.", ans: "flowing", bn: "করিম নৌকাটিকে পানির স্রোতে ভেসে যেতে দেখল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'see, watch/watched, hear, find'-এর পর ২য় ভার্ব আসলে [V1 + ing = flowing] বসে!</strong>"},
    {id: 325, bookNum: "70.c", type: "normal", ruleId: "R1", raw: "We ________ (play) a cricket match tomorrow.", ans: "will play", bn: "আমরা আগামীকাল একটি ক্রিকেট ম্যাচ খেলবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Future Time): বাক্যে 'tomorrow' (আগামীকাল) থাকায় Future Indefinite [will + V1 (will play)] বসেছে!</strong>"},
    {id: 326, bookNum: "70.d", type: "normal", ruleId: "R7", raw: "I love ________ (watch) football.", ans: "watching", bn: "আমি ফুটবল দেখতে ভালোবাসি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Emotion & Preference): 'enjoy, love, like, prefer, dislike'-এর পর সাধারণ অভ্যাস বা পছন্দ বোঝাতে ২য় ভার্বের সাথে [V1 + ing = watching] বসে!</strong>"},
    {id: 327, bookNum: "70.e", type: "normal", ruleId: "R2", raw: "Samina ________ (wash) her hands daily.", ans: "washes", bn: "সামিনা প্রতিদিন তার হাত ধোয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'daily' থাকায় Present Indefinite হয়েছে এবং 'Samina' সিঙ্গুলার হওয়ায় [washes] বসেছে!</strong>"},
    {id: 328, bookNum: "71.e", type: "normal", ruleId: "R10", raw: "I shall ________ (do) the sum before the teacher comes.", ans: "have done", bn: "শিক্ষক আসার পূর্বেই আমি অঙ্কটি করে ফেলবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর Future নিয়ম): 'Before'-এর পরে Present Indefinite (comes) থাকলে, আগে Future Perfect [shall / will + have + V3] হয়!</strong>এখানে 'shall' দেওয়াই থাকায় 'have done' বসেছে।"},
    {id: 329, bookNum: "72.b", type: "normal", ruleId: "R9", raw: "If I were you, I ________ (plant) some trees round the house.", ans: "would plant", bn: "আমি যদি তোমার জায়গায় হতাম, তবে বাড়ির চারপাশে কিছু গাছ লাগাতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে সর্বদা [would + V1 (would plant)] বসে!</strong>"},
    {id: 330, bookNum: "72.c", type: "normal", ruleId: "R1", raw: "My father was ________ (transfer) from Dhaka to Chattogram.", ans: "transferred", bn: "আমার বাবা ঢাকা থেকে চট্টগ্রামে বদলি হয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): বাবাকে কর্তৃপক্ষের দ্বারা বদলি করা হয়েছিল (Passive), তাই 'was'-এর পর ৩য় রূপ [V3 = transferred] বসেছে!</strong>"},
    {id: 331, bookNum: "72.d", type: "normal", ruleId: "R13", raw: "The size of the shoes ________ (be) short.", ans: "is", bn: "জুতো জোড়ার আকার ছোট।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের শব্দই আসল Subject! এখানে 'shoes' নয়, বরং 'The size' (একবচন) অনুযায়ী [is] বসেছে!</strong>"},
    {id: 332, bookNum: "72.e", type: "normal", ruleId: "R13", raw: "There ________ (be) two high schools in our village.", ans: "are", bn: "আমাদের গ্রামে দুটি উচ্চ বিদ্যালয় আছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): 'There' দিয়ে বাক্য শুরু হলে পরের Noun (two high schools - বহুবচন) অনুযায়ী Plural Verb [are] বসে!</strong>"},
    {id: 333, bookNum: "73.b", type: "normal", ruleId: "R1", raw: "That room ________ (use) for a meeting today.", ans: "is used", bn: "ওই রুমটি আজ মিটিংয়ের জন্য ব্যবহার করা হচ্ছে/হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): রুম নিজে নিজেকে ব্যবহার করতে পারে না, মানুষের দ্বারা ব্যবহৃত হয় (Passive), তাই [is used] বসেছে!</strong>"},
    {id: 334, bookNum: "73.c", type: "normal", ruleId: "R13", raw: "Internet connectivity ________ (be) addressed in half a dozen different way.", ans: "is", bn: "ইন্টারনেট সংযোগের বিষয়টি আধ ডজন ভিন্ন উপায়ে সমাধান করা হয়েছে/হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R1 (Singular Subject in Passive): 'Internet connectivity' আনকাউন্টেবল সিঙ্গুলার সাবজেক্ট হওয়ায় এবং পরে V3 (addressed) থাকায় [is] বসেছে!</strong>"},
    {id: 335, bookNum: "73.d", type: "normal", ruleId: "R1", raw: "Ancient Greek ________ (teach) still in some school.", ans: "is still taught", bn: "প্রাচীন গ্রীক ভাষা এখনও কিছু স্কুলে পড়ানো হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): গ্রীক ভাষা নিজে পড়াতে পারে না, শিক্ষকদের দ্বারা পড়ানো হয় (Passive), তাই [is still taught] বসেছে!</strong>"},
    {id: 336, bookNum: "73.e", type: "normal", ruleId: "R1", raw: "I would rather ________ (have) coffee than tea.", ans: "have", bn: "আমি চায়ের চেয়ে বরং কফিই খাবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'would rather / had better'-এর ঠিক পরেই সর্বদা মূল ভার্বের আসল রূপ [V1 = have] বসে!</strong>"},
    {id: 337, bookNum: "74.b", type: "normal", ruleId: "R9", raw: "Don't come tomorrow unless I ________ (phone).", ans: "phone", bn: "আমি ফোন না করা পর্যন্ত আগামীকাল এসো না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Step 1): 'Unless / If' যুক্ত অংশে সাবজেক্ট 'I'-এর পর Present Indefinite [V1 = phone] বসেছে!</strong>"},
    {id: 338, bookNum: "74.c", type: "normal", ruleId: "R10", raw: "As soon as I ________ (hear) the bell ringing, I opened the door.", ans: "heard", bn: "ঘণ্টা বাজার শব্দ শোনা মাত্রই আমি দরজাটি খুলেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - As soon as): [V2 ⟷ As soon as ⟷ V2] — পরের অংশে Past (opened) থাকায় 'As soon as' অংশেও Past [V2 = heard] বসেছে!</strong>"},
    {id: 339, bookNum: "74.d", type: "normal", ruleId: "R5", raw: "We ________ up by a loud sound during the night.", ans: "woke", bn: "রাতের বেলা একটি বিকট শব্দে আমাদের ঘুম ভেঙে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Past Event): অতীতের একটি নির্দিষ্ট রাতের ঘটনা বোঝাতে wake-এর Past Form [V2 = woke] বসেছে!</strong>"},
    {id: 340, bookNum: "74.e", type: "normal", ruleId: "R12", raw: "The Principal had his teachers ________ (plan) their lessons in advance.", ans: "planned / plan", bn: "অধ্যক্ষ মহাশয় তাঁর শিক্ষকদের দিয়ে আগে থেকেই পাঠ পরিকল্পনা করিয়ে নিয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): বইটির উত্তরমালায় [planned] দেওয়া আছে (যদিও ব্যাকরণগতভাবে 'had + ব্যক্তি' থাকলে Base Form 'plan' ও সঠিক)!</strong>"},
    {id: 341, bookNum: "75.a", type: "normal", ruleId: "R5", raw: "The door ________ automatically.", ans: "opened", bn: "দরজাটি স্বয়ংক্রিয়ভাবে খুলে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Past Action): অতীতের সাধারণ ঘটনা হিসেবে open-এর Past Form [V2 = opened] বসেছে!</strong>"},
    {id: 342, bookNum: "75.b", type: "normal", ruleId: "R13", raw: "Four and four ________ eight.", ans: "makes", bn: "চারে চারে আট হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - গাণিতিক হিসাব): সংখ্যার যোগফল একক সমষ্টি নির্দেশ করায় Singular Verb [makes] বসে!</strong>"},
    {id: 343, bookNum: "75.c", type: "normal", ruleId: "R12", raw: "He made me ________ the car.", ans: "wash", bn: "সে আমাকে দিয়ে গাড়িটি ধুইয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made + ব্যক্তি (me)' থাকলে পরের ভার্বের আগে 'to' বসে না, সরাসরি [V1 = wash] বসে!</strong>"},
    {id: 344, bookNum: "75.d", type: "normal", ruleId: "R1", raw: "Have you ________ the letter?", ans: "written", bn: "তুমি কি চিঠিটি লিখেছ?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): বাক্যে 'Have' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = written] বসেছে!</strong>"},
    {id: 345, bookNum: "75.e", type: "normal", ruleId: "R12", raw: "I wish I ________ philosopher!", ans: "were", bn: "আমি যদি একজন দার্শনিক হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর অবাস্তব কল্পনা বোঝাতে যেকোনো Subject-এর পরেই Be-verb হিসেবে সর্বদা [were] বসে!</strong>"},
    {id: 346, bookNum: "76.a", type: "normal", ruleId: "R6", raw: "She insisted ________ (go) to the meeting.", ans: "on going", bn: "সে মিটিংয়ে যাওয়ার জন্য জেদ ধরেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 & R7 (Preposition + V1+ing): 'insist'-এর পর সর্বদা প্রিপজিশন 'on' বসে এবং প্রিপজিশনের পর ভার্বের সাথে ing যুক্ত হয়ে [on going] হয়েছে!</strong>"},
    {id: 347, bookNum: "76.b", type: "normal", ruleId: "R6", raw: "He is really good ________ (play) the guitar.", ans: "at playing", bn: "সে গিটার বাজানোয় সত্যিই খুব দক্ষ।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): দক্ষ অর্থে 'good at' বসে এবং প্রিপজিশন 'at'-এর পর ভার্বের সাথে ing যুক্ত হয়ে [at playing] হয়েছে!</strong>"},
    {id: 348, bookNum: "76.c", type: "normal", ruleId: "R6", raw: "We have been waiting ________ the bus.", ans: "for", bn: "আমরা বাসের জন্য অপেক্ষা করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Appropriate Preposition): কোনো ব্যক্তি বা বস্তুর জন্য অপেক্ষা করা অর্থে 'wait'-এর পর সর্বদা প্রিপজিশন [for] বসে!</strong>"},
    {id: 349, bookNum: "76.d", type: "normal", ruleId: "R6", raw: "They succeeded ________ (complete) the project.", ans: "in completing", bn: "তারা প্রজেক্টটি সফলভাবে সম্পন্ন করতে পেরেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): সফল হওয়া অর্থে 'succeed in' বসে এবং প্রিপজিশন 'in'-এর পর ভার্বের সাথে ing যুক্ত হয়ে [in completing] হয়েছে!</strong>"},
    {id: 350, bookNum: "76.e", type: "normal", ruleId: "R6", raw: "I am looking forward ________ (see) you next month.", ans: "to seeing", bn: "আমি আগামী মাসে তোমার সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'look forward to' ফ্রেজের পর সর্বদা [V1 + ing] বসে, তাই এখানে 'to' সহ [to seeing] বসেছে!</strong>"},
    {id: 351, bookNum: "77.a", type: "normal", ruleId: "R1", raw: "I have ________ (meet) with my friends.", ans: "met", bn: "আমি আমার বন্ধুদের সাথে দেখা করেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): শূন্যস্থানের আগে 'have' দেওয়াই থাকায় মূল ভার্ব (meet)-এর ৩য় রূপ [V3 = met] বসেছে!</strong>"},
    {id: 352, bookNum: "77.b", type: "normal", ruleId: "R1", raw: "Where are you ________ (go)?", ans: "going", bn: "তুমি কোথায় যাচ্ছ?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Active Voice): তুমি নিজে যাচ্ছ (Active) এবং আগে 'are' দেওয়াই থাকায় সরাসরি [V1 + ing = going] বসেছে!</strong>"},
    {id: 353, bookNum: "77.c", type: "normal", ruleId: "R1", raw: "I will be ________ (watch) movies.", ans: "watching", bn: "আমি সিনেমা দেখতে থাকবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Active Continuous): Subject 'I' নিজেই সিনেমা দেখবে (Active), তাই 'will be'-এর পর চলমান কাজ বোঝাতে সরাসরি [V1 + ing = watching] বসেছে!</strong>"},
    {id: 354, bookNum: "77.d", type: "normal", ruleId: "R2", raw: "Rita ________ (dance) on the floor.", ans: "dances/is dancing", bn: "রিতা মেঝেতে নাচছে / নাচে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R3: সাধারণ অভ্যাস বোঝালে 3rd Person Singular অনুযায়ী [dances] এবং বর্তমানে নাচছে বোঝালে [is dancing]—উভয়ই সঠিক!</strong>"},
    {id: 355, bookNum: "78.a", type: "normal", ruleId: "R2", raw: "Mother said that honesty ________ (be) the best policy.", ans: "is", bn: "মা বলেছিলেন যে সততাই সর্বোত্তম পন্থা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য ও প্রবাদ বাক্য): প্রথম অংশে Past (said that) থাকলেও পরের অংশটি চিরন্তন প্রবাদ বাক্য হওয়ায় সর্বদা Present Indefinite [is] হবে (কখনো was হবে না)!</strong>"},
    {id: 356, bookNum: "78.b", type: "normal", ruleId: "R9", raw: "If you (try), you could have succeeded.", ans: "had tried", bn: "তুমি যদি চেষ্টা করতে, তবে তুমি সফল হতে পারতে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): ডান পাশে [could have + V3] দেওয়াই আছে, তাই বাম পাশের 'If' অংশে Past Perfect [had + V3 = had tried] বসেছে!</strong>"},
    {id: 357, bookNum: "78.c", type: "normal", ruleId: "R6", raw: "I went there with a view to ________ (meet) my friend.", ans: "meeting", bn: "আমি আমার বন্ধুর সাথে দেখা করার উদ্দেশ্যে সেখানে গিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): বাক্যে 'with a view to' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = meeting] বসে!</strong>"},
    {id: 358, bookNum: "78.d", type: "normal", ruleId: "R10", raw: "No sooner ________ I (see) the boy than he went away.", ans: "had I seen", bn: "আমি বালকটিকে দেখতে না দেখতেই সে চলে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): [No sooner had + Sub + V3 ... than + Sub + V2] — তাই এখানে [had I seen] বসেছে!</strong>"},
    {id: 359, bookNum: "78.e", type: "normal", ruleId: "R12", raw: "I wish I ________ (can) speak English!", ans: "could", bn: "আমি যদি ইংরেজিতে কথা বলতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish + Subject' থাকলে পরবর্তী ভার্বটি সর্বদা Past Form হয়, তাই can-এর Past রূপ [could] বসেছে!</strong>"},
    {id: 360, bookNum: "79.a", type: "normal", ruleId: "R4", raw: "I ________ (open) the book already.", ans: "have opened", bn: "আমি ইতিমধ্যেই বইটি খুলেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'already' থাকলে চোখ বন্ধ করে Present Perfect [have / has + V3 (have opened)] বসে!</strong>"},
    {id: 361, bookNum: "79.b", type: "normal", ruleId: "R13", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'One of' সর্বদা Singular এবং 'yesterday' থাকায় Past সিঙ্গুলার ভার্ব [was] বসেছে!</strong>"},
