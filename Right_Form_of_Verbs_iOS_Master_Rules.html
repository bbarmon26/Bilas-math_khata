<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Right Form of Verbs | Visual Cheat Sheet & Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: rgba(28, 28, 32, 0.78);
            --ios-card-active: rgba(44, 44, 48, 0.9);
            --ios-border: rgba(255, 255, 255, 0.14);
            --ios-highlight: rgba(255, 255, 255, 0.08);
            --ios-blue: #0a84ff;
            --ios-cyan: #5ac8fa;
            --ios-pink: #ff375f;
            --ios-yellow: #ffd60a;
            --ios-purple: #bf5af2;
            --ios-green: #30d158;
            --ios-orange: #ff9f0a;
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --spring-easing: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            position: relative;
        }

        /* Ambient iOS Wallpaper Glow */
        .ambient-glow {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.24;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 { top: -90px; left: -90px; background: var(--ios-blue); }
        .glow-2 { bottom: 50px; right: -90px; background: var(--ios-purple); }
        .glow-3 { top: 40%; left: 30%; width: 240px; height: 240px; background: var(--ios-pink); opacity: 0.14; }

        .app-layout {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Smooth Scroll Container (Full Screen - No Top Header) */
        .list-container {
            flex: 1;
            display: block;
            overflow-y: auto;
            padding: 16px 14px 135px 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .list-container::-webkit-scrollbar { display: none; }

        /* 🍎 Floating iOS Glass Back Bar (Only visible inside a specific Rule) */
        .ios-floating-nav {
            position: sticky;
            top: 4px;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            pointer-events: none;
        }

        .ios-back-pill {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 16px 8px 12px;
            border-radius: 999px;
            background: rgba(30, 30, 36, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 0.5px solid rgba(255, 255, 255, 0.24);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            color: #5ac8fa;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.22s var(--spring-easing), background 0.2s ease;
        }
        .ios-back-pill:active {
            transform: scale(0.92);
            background: rgba(50, 50, 58, 0.85);
        }
        .ios-back-pill svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.8;
        }

        .ios-action-pill {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 999px;
            background: rgba(30, 30, 36, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 0.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffd60a;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.22s var(--spring-easing), background 0.2s ease;
        }
        .ios-action-pill:active { transform: scale(0.92); }
        .ios-action-pill.active-reveal {
            background: rgba(255, 55, 95, 0.82);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* NotebookLM Visual Slide Card Style */
        .nlm-slide-card {
            display: block;
            width: 100%;
            margin-bottom: 18px;
            background: linear-gradient(145deg, rgba(32, 32, 36, 0.9), rgba(18, 18, 22, 0.94));
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            overflow: visible;
            transition: transform 0.25s var(--spring-easing), border-color 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }
        .nlm-slide-card:active {
            transform: scale(0.985);
        }
        .nlm-slide-card:hover {
            border-color: rgba(90, 200, 250, 0.45);
            box-shadow: 0 20px 50px rgba(10, 132, 255, 0.18);
        }

        /* Light Paper Mode for NotebookLM Infographics */
        .nlm-canvas {
            background: #f8fafc;
            color: #0f172a;
            border-radius: 18px;
            padding: 16px;
            margin: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), 0 4px 15px rgba(0,0,0,0.25);
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .nlm-watermark {
            font-size: 0.65rem;
            font-weight: 700;
            color: #64748b;
            text-align: right;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        /* Handwritten Note Box Style */
        .handwritten-box {
            background: linear-gradient(135deg, rgba(254, 249, 195, 0.12), rgba(253, 224, 71, 0.06));
            border: 1px dashed rgba(250, 204, 21, 0.45);
            border-left: 4px solid #facc15;
            border-radius: 18px;
            padding: 16px;
            color: #fef08a;
            position: relative;
        }

        /* Real iOS Question Card Style */
        .card {
            display: block;
            width: 100%;
            margin-bottom: 14px;
            background: var(--ios-card);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 22px;
            padding: 18px;
            position: relative;
            border: 0.5px solid var(--ios-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--ios-highlight);
            cursor: pointer;
            transition: transform 0.28s var(--spring-easing), background 0.25s ease, border-color 0.25s ease;
        }
        .card:active { transform: scale(0.985); }
        .card.revealed {
            border-color: rgba(10, 132, 255, 0.45);
            background: rgba(32, 32, 38, 0.9);
        }

        .card-header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .num-prefix {
            color: var(--ios-cyan);
            font-weight: 800;
            margin-right: 6px;
            font-size: 1.05rem;
        }

        .book-num-tag {
            font-size: 0.73rem;
            color: var(--ios-yellow);
            font-weight: 700;
            margin-right: 6px;
            background: rgba(255, 214, 10, 0.12);
            padding: 2.5px 8px;
            border-radius: 8px;
            border: 0.5px solid rgba(255, 214, 10, 0.25);
            display: inline-block;
            vertical-align: middle;
        }

        .rule-badge-tag {
            font-size: 0.7rem;
            color: #c084fc;
            font-weight: 700;
            margin-right: 6px;
            background: rgba(192, 132, 252, 0.14);
            padding: 2px 8px;
            border-radius: 8px;
            border: 0.5px solid rgba(192, 132, 252, 0.28);
            display: inline-block;
            vertical-align: middle;
        }

        .sentence-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.55;
            color: #f2f2f7;
            display: inline;
        }

        /* Blank & 1st Click Answer Reveal */
        .ans-placeholder {
            color: transparent;
            border-bottom: 2px dashed #71717a;
            padding: 0 10px;
            margin: 0 4px;
            font-weight: 800;
            border-radius: 6px;
            transition: all 0.3s var(--spring-easing);
            user-select: none;
        }
        .card.revealed .ans-placeholder {
            color: var(--ios-pink);
            background: rgba(255, 55, 95, 0.15);
            border-bottom-color: transparent;
            padding: 2px 10px;
            text-shadow: 0 0 12px rgba(255, 55, 95, 0.3);
        }

        /* ⭐ Favorite Star Button - High Z-Index so Rocket never blocks it */
        .fav-star-btn {
            position: relative;
            z-index: 35;
            background: rgba(255, 255, 255, 0.07);
            border: 0.5px solid var(--ios-border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #636366;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s var(--spring-easing);
        }
        .fav-star-btn:active { transform: scale(0.82); }
        .fav-star-btn.is-fav {
            color: var(--ios-yellow);
            background: rgba(255, 214, 10, 0.18);
            border-color: rgba(255, 214, 10, 0.45);
            box-shadow: 0 0 15px rgba(255, 214, 10, 0.28);
        }

        /* Tap Hint */
        .tap-hint {
            color: var(--text-secondary);
            font-size: 0.76rem;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 500;
        }
        .card.revealed .tap-hint { display: none; }

        /* 1st Click Container: Meaning + "ব্যাখ্যা" Button */
        .first-click-area {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 0.5px solid var(--ios-border);
            animation: iosFadeIn 0.3s var(--spring-easing);
        }
        .card.revealed .first-click-area { display: block; }

        .meaning-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meaning-text {
            font-size: 1rem;
            color: var(--ios-green);
            font-weight: 600;
            flex: 1;
        }

        .btn-bekkha {
            background: rgba(10, 132, 255, 0.16);
            color: var(--ios-cyan);
            border: 0.5px solid rgba(90, 200, 250, 0.35);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.25s var(--spring-easing);
        }
        .btn-bekkha:active { transform: scale(0.92); }
        .card.show-ex .btn-bekkha {
            background: var(--ios-blue);
            color: #ffffff;
            border-color: var(--ios-blue);
        }

        /* 2nd Click Container: Detailed Explanation */
        .bekkha-box {
            display: none;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.44);
            border-radius: 14px;
            padding: 13px;
            border-left: 3.5px solid var(--ios-purple);
            font-size: 0.93rem;
            color: #e5e5ea;
            line-height: 1.6;
            animation: iosSlideDown 0.32s var(--spring-easing);
        }
        .card.show-ex .bekkha-box { display: block; }

        /* Floating iOS Spotlight Search Bar */
        .ios-search-sheet {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-160%);
            width: calc(100% - 28px);
            max-width: 680px;
            background: rgba(25, 25, 30, 0.72);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 0.5px solid rgba(255, 255, 255, 0.28);
            border-radius: 24px;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1100;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            transition: transform 0.4s var(--spring-easing);
        }
        .ios-search-sheet.open {
            transform: translateX(-50%) translateY(0);
        }
        .ios-search-sheet input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.98rem;
            outline: none;
        }
        .ios-search-sheet input::placeholder { color: #98989f; }
        .search-close-btn {
            background: rgba(255, 255, 255, 0.16);
            border: none;
            color: #d1d1d6;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🍎 Ultra-Realistic iPhone iOS 18 Liquid Glass Dock */
        .ios-glass-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 26px);
            max-width: 470px;
            height: 70px;
            background: linear-gradient(180deg, rgba(42, 42, 50, 0.52) 0%, rgba(18, 18, 24, 0.68) 100%);
            backdrop-filter: blur(45px) saturate(230%);
            -webkit-backdrop-filter: blur(45px) saturate(230%);
            border: 0.5px solid rgba(255, 255, 255, 0.26);
            box-shadow: 
                0 24px 50px rgba(0, 0, 0, 0.85),
                0 4px 16px rgba(0, 0, 0, 0.5),
                inset 0 1.5px 1px rgba(255, 255, 255, 0.32),
                inset 0 -1px 1px rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 7px;
            z-index: 950;
        }

        .dock-item {
            background: none;
            border: none;
            color: rgba(235, 235, 245, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            padding: 7px 13px;
            border-radius: 30px;
            transition: all 0.3s var(--spring-easing);
            position: relative;
        }
        .dock-item svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s var(--spring-easing);
        }
        .dock-item span {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .dock-item:active { transform: scale(0.88); }
        .dock-item.active {
            color: #ffffff;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%);
            box-shadow: 
                inset 0 1px 0.5px rgba(255, 255, 255, 0.35),
                0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .dock-item.active svg {
            color: var(--ios-cyan);
            filter: drop-shadow(0 0 10px rgba(90, 200, 250, 0.65));
        }

        /* 🚀 Assistive Rocket Button - Pointer-events fixed so it NEVER blocks Favorite Star */
        .rocket-master-container {
            position: fixed;
            bottom: 98px;
            right: 18px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 10px;
            z-index: 900;
            pointer-events: none; /* অদৃশ্য বক্স কখনোই নিচের স্টার বাটনের ক্লিক আটকাবে না */
        }
        .main-rocket-trigger {
            pointer-events: auto;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(52, 52, 60, 0.65), rgba(24, 24, 30, 0.78));
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 0.5px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s var(--spring-easing), background 0.3s;
        }
        .rocket-master-container.menu-open .main-rocket-trigger {
            background: var(--ios-blue);
            transform: rotate(45deg);
        }
        .rocket-sub-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(28, 28, 34, 0.78);
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);
            border: 0.5px solid rgba(255, 255, 255, 0.24);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 26px;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.6) translateY(20px);
            pointer-events: none;
            transform-origin: bottom center;
            transition: all 0.3s var(--spring-easing);
        }
        .rocket-master-container.menu-open .rocket-sub-menu {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .rocket-action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* iOS Modal for Number Jump */
        .ios-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .ios-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .ios-modal-box {
            width: 290px;
            background: rgba(36, 36, 42, 0.85);
            backdrop-filter: blur(45px) saturate(200%);
            border-radius: 22px;
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
            text-align: center;
            transform: scale(0.85);
            transition: transform 0.3s var(--spring-easing);
        }
        .ios-modal-backdrop.open .ios-modal-box { transform: scale(1); }

        @keyframes iosFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes iosSlideDown {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>
<div class="ambient-glow glow-3"></div>

<div class="app-layout">

    <!-- 🔍 Floating iOS Spotlight Search Sheet -->
    <div class="ios-search-sheet" id="searchSheet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="নিয়ম (DANGEROUS, Raj-Ley), শব্দ বা নাম্বার (01.a) খুঁজুন...">
        <button class="search-close-btn" onclick="closeSearchSheet()">✕</button>
    </div>

    <!-- 📜 Main Smooth Scroll Container (No Top Header!) -->
    <div class="list-container" id="app-content"></div>

    <!-- 🚀 Assistive Rocket Menu -->
    <div class="rocket-master-container" id="rocketMasterContainer">
        <button class="main-rocket-trigger" onclick="toggleRocketMenuPanel(event)" aria-label="Quick Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
            </svg>
        </button>
        <div class="rocket-sub-menu">
            <button class="rocket-action-btn" onclick="triggerRocketNavigation('top')" title="একদম উপরে">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
            </button>
            <button class="rocket-action-btn" onclick="openJumpModal()" title="নির্দিষ্ট নাম্বারে যান">

    {id: 13, bookNum: "03.d", type: "normal", ruleId: "R12", raw: "It is high time he ________ (leave) the place.", ans: "left", bn: "এটাই উপযুক্ত সময় তার স্থানটি ত্যাগ করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is time / It is high time + Subject' থাকলে পরবর্তী ভার্বটি সর্বদা Past Form [V2] হয়!</strong>এখানে সাবজেক্ট 'he' থাকায় leave-এর পাস্ট ফর্ম 'left' বসেছে।"},
    {id: 14, bookNum: "03.e", type: "normal", ruleId: "R10", raw: "When we went to the cinema it already ________ (start).", ans: "had started", bn: "আমরা যখন সিনেমা হলে গেলাম, তখন সেটি ইতিমধ্যেই শুরু হয়ে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance): অতীতের দুটি কাজের মধ্যে (When we went) যে কাজটি তারও আগে ঘটেছিল, সেটি Past Perfect [had + V3] হয়!</strong>আমরা যাওয়ার আগেই সিনেমা শুরু হয়ে গিয়েছিল, তাই 'had started' বসেছে।"},
    {id: 15, bookNum: "04.a", type: "normal", ruleId: "R6", raw: "He is accustomed to ________ (swim) in the river.", ans: "swimming", bn: "সে নদীতে সাঁতার কাটতে অভ্যস্ত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to, look forward to, be accustomed to, be used to'—এদের শেষে 'to' থাকা সত্ত্বেও সর্বদা [V1 + ing] বসে!</strong>তাই swim-এর সাথে ing যুক্ত হয়ে 'swimming' হয়েছে।"},
    {id: 16, bookNum: "04.b", type: "normal", ruleId: "R10", raw: "He ________ (reach) the station before the train leave.", ans: "had reached", bn: "ট্রেনটি ছেড়ে যাওয়ার পূর্বেই সে স্টেশনে পৌঁছেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before মানে আগে' — তাই before-এর আগে সর্বদা Past Perfect [had + V3] বসে!</strong>তাই 'had reached' হয়েছে।"},
    {id: 17, bookNum: "04.c", type: "normal", ruleId: "R5", raw: "It ________ (rain) since 9 a.m. today.", ans: "has been raining", bn: "আজ সকাল ৯টা থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since / for + সময়' থাকলে (আগে শুরু হয়ে এখনো চলছে বোঝালে) [have / has been + V1 + ing] বসে!</strong>সকাল ৯টা থেকে বৃষ্টি শুরু হয়ে এখনো চলছে, তাই 'has been raining' হয়েছে।"},
    {id: 18, bookNum: "04.d", type: "normal", ruleId: "R1", raw: "He would ________ (do) all his works in time.", ans: "do", bn: "সে সময়মতো তার সব কাজ সম্পন্ন করতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals): যেকোনো Modal (can, could, may, might, must, should, will, would)-এর পর Active Voice-এ সরাসরি Base Form [V1] বসে!</strong>তাই 'would'-এর পর অপরিবর্তিত V1 'do' বসেছে।"},
    {id: 19, bookNum: "05.a", type: "normal", ruleId: "R13", raw: "Neither of the two pens ________ (write) well.", ans: "writes", bn: "কলম দুটির একটিও ভালো লেখে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'One of, Each, Every, Either, Neither'-এর পর Noun বহুবচন (two pens) হলেও Verb সর্বদা Singular হয়!</strong>তাই ভার্বের সাথে s যুক্ত হয়ে 'writes' হয়েছে।"},
    {id: 20, bookNum: "05.b", type: "normal", ruleId: "R13", raw: "Gymnastics ________ (to be verb) my favorite sports.", ans: "is", bn: "জিমন্যাস্টিকস আমার প্রিয় খেলা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI): কিছু খেলা বা বিষয়ের নামের শেষে 's' থাকলেও (Gymnastics, Physics, News, Mathematics) এগুলো একক নাম হওয়ায় সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 21, bookNum: "05.c", type: "normal", ruleId: "R1", raw: "Having gone to market, I ________ (buy) a pen.", ans: "bought", bn: "বাজারে গিয়ে আমি একটি কলম কিনলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R5 (Having + V3): 'Having + V3' দিয়ে অতীতের সম্পন্ন কাজ শুরু হলে পরের প্রধান ক্লজটি সাধারণত Past Indefinite [V2] হয়!</strong>তাই buy-এর পাস্ট ফর্ম 'bought' বসেছে।"},
    {id: 22, bookNum: "05.d", type: "normal", ruleId: "R12", raw: "It is the proper time we ________ (start) the work.", ans: "started", bn: "এটাই উপযুক্ত সময় আমাদের কাজটি শুরু করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is time / It is high time / It is proper time + Subject' থাকলে মূল ভার্ব সর্বদা [V2] হয়!</strong>সাবজেক্ট 'we' থাকায় start-এর পাস্ট ফর্ম 'started' বসেছে।"},
    {id: 23, bookNum: "05.e", type: "normal", ruleId: "R6", raw: "I prefer riding ________ (to swim).", ans: "to swimming", bn: "আমি ঘোড়সওয়ারির চেয়ে সাঁতার কাটা বেশি পছন্দ করি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'prefer...to' দ্বারা দুটি কাজের তুলনা বোঝালে 'to'-এর আগে ও পরে উভয় স্থানেই [V1 + ing] বসে!</strong>আগে riding থাকায় পরে 'to swimming' হয়েছে।"},
    {id: 24, bookNum: "06.a", type: "normal", ruleId: "R2", raw: "A good boy ________ (prepare) his lessons regularly.", ans: "prepares", bn: "একটি ভালো ছেলে নিয়মিত তার পড়া প্রস্তুত করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'regularly, daily, always, usually' থাকলে Present Indefinite হয়!</strong>Subject 'A good boy' (3rd Person Singular) হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'prepares' হয়েছে।"},
    {id: 25, bookNum: "06.b", type: "normal", ruleId: "R5", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে অতীতের সংকেত (yesterday, last, ago, once) থাকলেই ভার্বের Past Form [V2] বসে!</strong>'yesterday' থাকায় come-এর V2 'came' বসেছে।"},
    {id: 26, bookNum: "06.c", type: "normal", ruleId: "R3", raw: "She ________ (sing) a song now.", ans: "is singing", bn: "সে এখন একটি গান গাইছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'now, right now, at present, at this moment' থাকলে [am / is / are + V1 + ing] হয়!</strong>এখানে 'now' থাকায় 'is singing' বসেছে।"},
    {id: 27, bookNum: "06.d", type: "normal", ruleId: "R5", raw: "He ________ (leave) home last night.", ans: "left", bn: "সে গত রাতে বাড়ি থেকে চলে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' (গত রাত) থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>leave-এর পাস্ট ফর্ম 'left'।"},
    {id: 28, bookNum: "06.e", type: "normal", ruleId: "R1", raw: "She has ________ (do) the work.", ans: "done", bn: "সে কাজটি করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): শূন্যস্থানের আগে 'have / has / had / having' দেওয়াই থাকলে মূল ভার্বের ৩য় রূপ [V3] বসে!</strong>তাই do-এর V3 'done' বসেছে।"},
    {id: 29, bookNum: "07.a", type: "normal", ruleId: "R5", raw: "Why ________ yesterday?", ans: "did he come", bn: "সে গতকাল কেন এসেছিল?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'yesterday' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকলে স্ট্রাকচার হয় [did + Subject + V1]!</strong>তাই 'did he come' বসেছে।"},
    {id: 30, bookNum: "07.b", type: "normal", ruleId: "R10", raw: "The patient ________ (died) before the doctor came.", ans: "had died", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before মানে আগে' — তাই before-এর আগে [had + V3] এবং পরে [V2] বসে!</strong>তাই 'had died' হয়েছে।"},
    {id: 31, bookNum: "07.c", type: "normal", ruleId: "R12", raw: "It is high time he ________ (change) his bad habit.", ans: "changed", bn: "এটাই উপযুক্ত সময় তার খারাপ অভ্যাস পরিবর্তন করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject' থাকলে চোখ বন্ধ করে ভার্বের Past Form [V2] বসে!</strong>তাই 'changed' হয়েছে।"},
    {id: 32, bookNum: "07.d", type: "normal", ruleId: "R9", raw: "Had I possessed vast property, I ________ (establish) a college.", ans: "would have established", bn: "আমার যদি বিশাল সম্পত্তি থাকতো, তবে আমি একটি কলেজ প্রতিষ্ঠা করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাক্যের শুরুতে [Had + Subject + V3] থাকলে অপর অংশে সর্বদা [would / could / might have + V3] বসে!</strong>তাই 'would have established' হয়েছে।"},
    {id: 33, bookNum: "07.e", type: "normal", ruleId: "R1", raw: "He may ________ (come) tomorrow.", ans: "come", bn: "সে আগামীকাল আসতে পারে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals): যেকোনো Modal Verb (may, can, must, should)-এর পর সরাসরি Base Form [V1] বসে!</strong>তাই অপরিবর্তিত 'come' বসেছে।"},
    {id: 34, bookNum: "08.a", type: "normal", ruleId: "R13", raw: "Each of the girls ________ (be) present in the class yesterday.", ans: "was", bn: "মেয়েদের প্রত্যেকেই গতকাল ক্লাসে উপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'Each of'-এর পর Noun বহুবচন হলেও ভার্ব সর্বদা Singular হয় এবং 'yesterday' থাকায় Past সিঙ্গুলার ভার্ব [was] বসেছে!</strong>"},
    {id: 35, bookNum: "08.b", type: "normal", ruleId: "R13", raw: "You, he and I ________ (be) friends.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): একাধিক ভিন্ন Person 'and' দ্বারা যুক্ত হলে Subject বহুবচন (Plural) হয়, তাই বর্তমান কালে [are] বসে!</strong>"},
    {id: 36, bookNum: "08.c", type: "normal", ruleId: "R1", raw: "One fourth of the work ________ (to finish).", ans: "has been finished", bn: "কাজের এক-চতুর্থাংশ শেষ হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R13 (Passive + Uncountable): 'the work' আনকাউন্টেবল হওয়ায় এর ভগ্নাংশও Singular এবং কাজটি অন্যের দ্বারা শেষ হওয়ায় প্যাসিভ রূপে [has been finished / is finished] বসেছে!</strong>"},
    {id: 37, bookNum: "08.d", type: "normal", ruleId: "R4", raw: "I already ________ (forget) his name.", ans: "have already forgotten", bn: "আমি ইতিমধ্যেই তার নাম ভুলে গিয়েছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'already' থাকলে Present Perfect Tense [have / has + V3] হয়!</strong>তাই 'have already forgotten' বসেছে।"},
    {id: 38, bookNum: "08.e", type: "normal", ruleId: "R6", raw: "After ________ (eat) rice, I shall go to market.", ans: "eating", bn: "ভাত খাওয়ার পর, আমি বাজারে যাবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): যেকোনো Preposition (after, before, by, without, in, of)-এর ঠিক পরেই সরাসরি ভার্ব আসলে [V1 + ing] বসে!</strong>এখানে 'After'-এর পর কোনো সাবজেক্ট না থেকে সরাসরি ব্র্যাকেট থাকায় 'eating' হয়েছে।"},
    {id: 39, bookNum: "09.a", type: "normal", ruleId: "R1", raw: "Government is ________ (import) Sugar from Brazil.", ans: "importing", bn: "সরকার ব্রাজিল থেকে চিনি আমদানি করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Active Voice): Subject (Government) নিজে কাজটি করছে বোঝাতে শূন্যস্থানের আগের 'is'-এর পর [V1 + ing] বসেছে!</strong>"},
    {id: 40, bookNum: "09.b", type: "normal", ruleId: "R1", raw: "They must ________ (follow) the rules of behavior.", ans: "follow", bn: "তাদের অবশ্যই আচরণের নিয়মগুলো মেনে চলতে হবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals): Modal Verb 'must'-এর পর Active Voice-এ সরাসরি Base Form [V1] বসে!</strong>"},
    {id: 41, bookNum: "09.c", type: "normal", ruleId: "R5", raw: "The boys ________ (send) to school yesterday.", ans: "were sent", bn: "বালকগুলোকে গতকাল স্কুলে পাঠানো হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Passive): বাক্যে 'yesterday' (অতীত) আছে এবং বালকদেরকে অন্যের দ্বারা পাঠানো হয়েছিল (Passive), তাই প্লুরাল সাবজেক্ট অনুযায়ী [were + V3] বসেছে!</strong>"},
    {id: 42, bookNum: "09.d", type: "normal", ruleId: "R1", raw: "This problem must ________ (solve) immediately.", ans: "be solved", bn: "এই সমস্যাটি অবিলম্বে সমাধান করা আবশ্যক।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): সমস্যা (This problem) নিজে নিজেকে সমাধান করতে পারে না, তাই প্যাসিভ সূত্র অনুযায়ী [Modal + be + V3] বসেছে!</strong>"},
    {id: 43, bookNum: "09.e", type: "normal", ruleId: "R12", raw: "I wish ________ (fill) my demand.", ans: "could fill", bn: "আমি যদি আমার চাহিদা পূরণ করতে পারতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যে 'I wish' থাকলে অপূর্ণ ইচ্ছা বা সামর্থ্য বোঝাতে পরের অংশে [could + V1] অথবা Past Form [V2] বসে!</strong>"},
    {id: 44, bookNum: "10.a", type: "normal", ruleId: "R4", raw: "You ever ________ (visit) Sylhet?", ans: "Have you ever visited", bn: "তুমি কি কখনো সিলেট গিয়েছ?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'ever' থাকলে সেটি Present Perfect Tense হয় এবং প্রশ্নবোধক হওয়ায় [Have + Subject + ever + V3] বসেছে!</strong>"},
    {id: 45, bookNum: "10.b", type: "normal", ruleId: "R12", raw: "I wish I ________ (to be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish / fancy'-এর পর ব্র্যাকেটে (be) থাকলে যেকোনো Subject-এর পরেই সর্বদা [were] বসে (কখনো was বসে না)!</strong>"},
    {id: 46, bookNum: "10.c", type: "normal", ruleId: "R9", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): 'If + Past Indefinite (had + noun)' থাকলে অপর অংশে সর্বদা [would / could / might + V1] বসে!</strong>এখানে had-এর পর কোনো V3 নেই (শুধু money আছে), তাই এটি 2nd Conditional।"},
    {id: 47, bookNum: "10.d", type: "normal", ruleId: "R12", raw: "I got the letter ________ (type)", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'get / got / have / had + বস্তু (the letter)' থাকলে পরের ভার্বটি সর্বদা [V3] হয়!</strong>চিঠি নিজে টাইপ করতে পারে না, তাই 'typed' বসেছে।"},
    {id: 48, bookNum: "10.e", type: "normal", ruleId: "R5", raw: "I ________ (read) for two hours.", ans: "have been reading", bn: "আমি দুই ঘন্টা ধরে পড়ছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): 'for + মোট সময় (for two hours)' থাকলে সর্বদা [have / has been + V1 + ing] বসে!</strong>"},
    {id: 49, bookNum: "11.a", type: "normal", ruleId: "R13", raw: "Neither he nor his friends ________ (attend) the function.", ans: "have attended", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'Neither...nor / Either...or' থাকলে ২য় Subject (his friends - Plural) অনুযায়ী বহুবচন ভার্ব [have attended] বসে!</strong>"},
    {id: 50, bookNum: "11.b", type: "normal", ruleId: "R12", raw: "I had my rice ________ (cook)", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'have / had + বস্তু (my rice)' থাকলে অন্যকে দিয়ে কাজটি করানো বোঝায়, তাই সর্বদা [V3] বসে!</strong>"},
    {id: 51, bookNum: "11.c", type: "normal", ruleId: "R7", raw: "I saw him ________ (read).", ans: "reading", bn: "আমি তাকে পড়তে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে দেখার/শোনার ভার্ব (see/saw, hear, find, watch)-এর পর ২য় ভার্ব আসলে তার সাথে [V1 + ing] যুক্ত হয়!</strong>"},
    {id: 52, bookNum: "11.d", type: "normal", ruleId: "R12", raw: "I got the letter ________ (type).", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'get / got + বস্তুবাচক Object (the letter)' থাকলে পরের ভার্বের ৩য় রূপ [V3] বসে!</strong>"},
    {id: 53, bookNum: "11.e", type: "normal", ruleId: "R5", raw: "I ________ (read) for two hours.", ans: "have been reading", bn: "আমি দুই ঘন্টা ধরে পড়ছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): সময়ের ব্যাপ্তি (for two hours) থাকায় [have been + V1 + ing] বসেছে!</strong>"},
    {id: 54, bookNum: "12.a", type: "normal", ruleId: "R13", raw: "Ill news ________ (run) apace.", ans: "runs", bn: "কুসংবাদ দ্রুত ছড়ায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R2 (Sop BD CGPI + প্রবাদ বাক্য): 'News' শব্দটি সর্বদা Singular এবং এটি একটি প্রবাদ বাক্য হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [runs] হয়েছে!</strong>"},
    {id: 55, bookNum: "12.b", type: "normal", ruleId: "R13", raw: "Five and five ________ (to make) ten.", ans: "makes", bn: "পাঁচে পাঁচে দশ হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - গাণিতিক হিসাব): সংখ্যার যোগফল একক সমষ্টি নির্দেশ করায় Singular Verb [makes] বসে!</strong>"},
    {id: 56, bookNum: "12.c", type: "normal", ruleId: "R1", raw: "English ________ (speak) all over the world.", ans: "is spoken", bn: "সারা বিশ্বে ইংরেজি বলা হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): ইংরেজি ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয়। তাই Present Passive রূপে [is + V3] বসেছে!</strong>"},
    {id: 57, bookNum: "12.d", type: "normal", ruleId: "R12", raw: "I fancy I ________ (turn) a trifle pale.", ans: "turned", bn: "আমার মনে হলো আমি যেন কিছুটা ফ্যাকাশে হয়ে গেলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যে 'I wish / I fancy + Subject' থাকলে পরবর্তী মূল ভার্বটি সর্বদা Past Form [V2] হয়!</strong>তাই 'turned' বসেছে।"},
    {id: 58, bookNum: "12.e", type: "normal", ruleId: "R13", raw: "Why you ________ (to be) not with her?", ans: "are/were", bn: "তুমি কেন তার সাথে নেই/ছিলে না?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): সাবজেক্ট 'you'-এর সাথে Be-verb হিসেবে বর্তমানে [are] এবং অতীতে [were] বসে!</strong>"},
    {id: 59, bookNum: "13.a", type: "normal", ruleId: "R3", raw: "What you ________ (want) now?", ans: "do you want", bn: "তুমি এখন কী চাও?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 & R1 (Stative Verb in Present): 'now' থাকলেও 'want, know, love, see' ভার্বগুলোর সাধারণত ing হয় না, তাই Present Indefinite প্রশ্নে [do you want] বসেছে!</strong>"},
    {id: 60, bookNum: "13.b", type: "normal", ruleId: "R11", raw: "It is many years since I ________ (come) to Dhaka.", ans: "came", bn: "অনেক বছর হলো আমি ঢাকায় এসেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর বাম পাশে Present (It is) থাকলে ডান পাশে সর্বদা Past Indefinite [V2] বসে!</strong>তাই come-এর V2 'came' হয়েছে।"},
    {id: 61, bookNum: "13.c", type: "normal", ruleId: "R7", raw: "I saw him ________ (go).", ans: "going", bn: "আমি তাকে যেতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'see/saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing] বসে!</strong>"},
    {id: 62, bookNum: "13.d", type: "normal", ruleId: "R9", raw: "He will not go out if it ________ (rain).", ans: "rains", bn: "যদি বৃষ্টি হয় তবে সে বাইরে যাবে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Step 1): একপাশে Future (will not go) থাকলে 'if' যুক্ত অংশটি Present Indefinite [V1 / V1+s] হয়!</strong>Subject 'it' সিঙ্গুলার হওয়ায় 'rains' হয়েছে।"},
    {id: 63, bookNum: "13.e", type: "normal", ruleId: "R5", raw: "He ________ (leave) last night.", ans: "left", bn: "সে গত রাতে চলে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>leave -> left।"},
    {id: 64, bookNum: "14.a", type: "normal", ruleId: "R13", raw: "Fifty miles ________ a long way.", ans: "is", bn: "পঞ্চাশ মাইল একটি দীর্ঘ পথ।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - দূরত্ব): নির্দিষ্ট দূরত্ব (Fifty miles) দেখতে বহুবচন হলেও একক পথ নির্দেশ করায় সর্বদা Singular Verb [is] বসে!</strong>"},
    {id: 65, bookNum: "14.b", type: "normal", ruleId: "R13", raw: "Cattle ________ grazing in the field.", ans: "are", bn: "গবাদিপশু মাঠে ঘাস খাচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Plural): 'Cattle, Police, People, Children' শব্দগুলো সর্বদা Plural, তাই এদের পর Plural Verb [are] বসে!</strong>"},
    {id: 66, bookNum: "14.c", type: "normal", ruleId: "R13", raw: "The news ________ false.", ans: "is", bn: "সংবাদটি মিথ্যা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI): 'News' শব্দটি দেখতে প্লুরাল মনে হলেও এটি সর্বদা Singular, তাই [is] বসেছে!</strong>"},
    {id: 67, bookNum: "14.d", type: "normal", ruleId: "R5", raw: "It ________ raining since Monday.", ans: "has been", bn: "সোমবার থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): 'since + নির্দিষ্ট সময় (Monday)' এবং শেষে raining দেওয়া থাকায় সাহায্যকারী ভার্ব হিসেবে [has been] বসেছে!</strong>"},
    {id: 68, bookNum: "14.e", type: "normal", ruleId: "R4", raw: "We ________ reached home just now.", ans: "have", bn: "আমরা এইমাত্র বাড়ি পৌঁছেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'just now' এবং V3 (reached) দেওয়া থাকায় সাবজেক্ট 'We' অনুযায়ী সাহায্যকারী ভার্ব [have] বসেছে!</strong>"},
    {id: 69, bookNum: "15.a", type: "normal", ruleId: "R4", raw: "I ________ (see) him recently.", ans: "have seen", bn: "আমি সম্প্রতি তাকে দেখেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'recently' থাকলে চোখ বন্ধ করে Present Perfect [have / has + V3] বসে!</strong>তাই 'have seen' হয়েছে।"},
    {id: 70, bookNum: "15.b", type: "normal", ruleId: "R9", raw: "If he came, I ________ (go).", ans: "would go", bn: "যদি সে আসতো, তবে আমি যেতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): একপাশে [If + V2 (came)] থাকলে অপর অংশে সর্বদা [would / could / might + V1] বসে!</strong>তাই 'would go' হয়েছে।"},
    {id: 71, bookNum: "15.c", type: "normal", ruleId: "R11", raw: "While he ________ (walk) in the garden, a snake bit him.", ans: "was walking", bn: "যখন সে বাগানে হাঁটছিল, তখন একটি সাপ তাকে কামড়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (he)' থাকলে অতীতে চলমান কাজ বোঝাতে সর্বদা [was / were + V1 + ing] বসে!</strong>তাই 'was walking' হয়েছে।"},
    {id: 72, bookNum: "15.d", type: "normal", ruleId: "R7", raw: "The girl went away ________ (dance).", ans: "dancing", bn: "মেয়েটি নাচতে নাচতে চলে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Gerund / Participle - ২য় ভার্ব): সরল বাক্যে একটি মূল ভার্বের (went away) পর আরেকটি চলমান অবস্থা বোঝাতে ২য় ভার্বের সাথে [V1 + ing] যুক্ত হয়!</strong>"},
    {id: 73, bookNum: "15.e", type: "normal", ruleId: "R13", raw: "How difficult the question paper ________ (be).", ans: "is", bn: "প্রশ্নপত্রটি কতই না কঠিন!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): এখানে সাবজেক্ট 'the question paper' একবচন (Singular) হওয়ায় বর্তমান কালে [is] বসেছে!</strong>"},
    {id: 74, bookNum: "16.a", type: "normal", ruleId: "R10", raw: "No sooner ________ than the students stood up.", ans: "had the teacher entered", bn: "শিক্ষক শ্রেণীকক্ষে প্রবেশ করতে না করতেই ছাত্ররা উঠে দাঁড়ালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): [No sooner had + Subject + V3 ... than + Subject + V2] — এই সূত্র অনুযায়ী 'had the teacher entered' বসেছে!</strong>"},
    {id: 75, bookNum: "16.b", type: "normal", ruleId: "R12", raw: "The teacher made the children ________ (read) the book.", ans: "read", bn: "শিক্ষক শিশুদের দিয়ে বইটি পড়ালেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made / let + ব্যক্তি (the children)' থাকলে পরের ভার্বের আগে কখনো 'to' বসে না, সরাসরি [V1] বসে!</strong>তাই অপরিবর্তিত 'read' বসেছে।"},
    {id: 76, bookNum: "16.c", type: "normal", ruleId: "R10", raw: "He had written the book before he ________ (retire).", ans: "retired", bn: "অবসর নেওয়ার পূর্বেই তিনি বইটি লিখেছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3] থাকলে, before-এর পরে সর্বদা Past Indefinite [V2] বসে!</strong>তাই retire-এর V2 'retired' হয়েছে।"},
    {id: 77, bookNum: "16.d", type: "normal", ruleId: "R7", raw: "As I reached home, I saw my sister ________ (shout) for help.", ans: "shouting", bn: "বাড়ি পৌঁছে আমি আমার বোনকে সাহায্যের জন্য চিৎকার করতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): 'see / saw / hear / find'-এর পর অবজেক্টের চলমান কাজ বোঝাতে ২য় ভার্বের সাথে [V1 + ing] যুক্ত হয়!</strong>"},
    {id: 78, bookNum: "16.e", type: "normal", ruleId: "R9", raw: "If I had seen him, I ________ (tell) him the matter.", ans: "would have told", bn: "আমি যদি তাকে দেখতাম, তবে তাকে বিষয়টি বলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): একপাশে [If + had + V3 (had seen)] থাকলে অপর অংশে সর্বদা [would / could / might have + V3] বসে!</strong>তাই 'would have told' হয়েছে।"},
    {id: 79, bookNum: "17.a", type: "normal", ruleId: "R5", raw: "His father ________ (come) yesterday.", ans: "came", bn: "তার বাবা গতকাল এসেছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে অতীতের সংকেত 'yesterday' থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>come -> came।"},
    {id: 80, bookNum: "17.b", type: "normal", ruleId: "R13", raw: "One of the boys ________ (have) done it.", ans: "has", bn: "বালকদের মধ্যে একজন এটি করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'One of'-এর পর Noun বহুবচন (the boys) হলেও আসল কর্তা একজন হওয়ায় সর্বদা Singular Verb [has] বসে!</strong>"},
    {id: 81, bookNum: "17.c", type: "normal", ruleId: "R1", raw: "The girls are ________ (play) in the field.", ans: "playing", bn: "মেয়েরা মাঠে খেলছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Active Voice): মেয়েরা নিজেরাই খেলছে (Active), তাই শূন্যস্থানের আগের 'are'-এর পর সরাসরি [V1 + ing] বসেছে!</strong>"},
    {id: 82, bookNum: "17.d", type: "normal", ruleId: "R4", raw: "He ________ (write) a letter to his father.", ans: "has written/wrote", bn: "সে তার বাবার কাছে একটি চিঠি লিখেছে/লিখেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 & R5: বাক্যে নির্দিষ্ট সময়ের উল্লেখ না থাকায় কাজটি শেষ হয়েছে অর্থে Present Perfect [has written] বা অতীতে ঘটেছে অর্থে [wrote] দুটিই সঠিক!</strong>"},
    {id: 83, bookNum: "17.e", type: "normal", ruleId: "R5", raw: "It ________ (rain) since morning.", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): 'since + নির্দিষ্ট সময় (morning)' থাকায় [has been + V1 + ing] বসেছে!</strong>"},
    {id: 84, bookNum: "18.a", type: "normal", ruleId: "R1", raw: "Child labor has ________ (forbid) internationally by the UN.", ans: "been forbidden", bn: "জাতিসংঘ কর্তৃক আন্তর্জাতিকভাবে শিশুশ্রম নিষিদ্ধ করা হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have/Has देয়া থাকলে Passive): শূন্যস্থানের আগে 'has' দেওয়াই আছে এবং কাজটি অন্যের দ্বারা (by the UN) হওয়ায় প্যাসিভ সূত্রে [been + V3] বসেছে!</strong>"},
    {id: 85, bookNum: "18.b", type: "normal", ruleId: "R3", raw: "Yet the number of child labor ________ (go) up day by day.", ans: "is going", bn: "তবুও দিন দিন শিশুশ্রমের সংখ্যা বৃদ্ধি পাচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'day by day' (দিন দিন ক্রমশ পরিবর্তনশীল) থাকায় Present Continuous [is going] বসেছে!</strong>সাবজেক্ট 'the number' সিঙ্গুলার হওয়ায় 'is' হয়েছে।"},
    {id: 86, bookNum: "18.c", type: "normal", ruleId: "R3", raw: "Many children ________ (work) at different sectors now.", ans: "are working", bn: "অনেক শিশু এখন বিভিন্ন খাতে কাজ করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'now' থাকায় এবং সাবজেক্ট বহুবচন (Many children) হওয়ায় [are working] বসেছে!</strong>"},
    {id: 87, bookNum: "18.d", type: "normal", ruleId: "R1", raw: "But he should not be ________ (carry) on.", ans: "carried", bn: "কিন্তু এটা চালিয়ে যাওয়া উচিত নয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): 'Modal + be' (should not be) দেওয়া থাকলে এর ঠিক পরেই সর্বদা মূল ভার্বের ৩য় রূপ [V3] বসে!</strong>তাই carry -> carried।"},
    {id: 88, bookNum: "18.e", type: "normal", ruleId: "R1", raw: "We ________ (to be) immediately address this problem.", ans: "should", bn: "আমাদের অবিলম্বে এই সমস্যাটির সমাধান করা উচিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals): মূল ভার্বের Base Form (address)-এর আগে কর্তব্য বা উচিত অর্থে উপযুক্ত Modal হিসেবে [should] বসেছে!</strong>"},
    {id: 89, bookNum: "19.a", type: "normal", ruleId: "R5", raw: "We ________ (learn) English since our childhood.", ans: "have been learning", bn: "আমরা আমাদের শৈশব থেকেই ইংরেজি শিখছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): অতীতের নির্দিষ্ট সময় থেকে (since our childhood) কাজটি এখনো চলছে বোঝাতে [have been + V1 + ing] বসেছে!</strong>"},
    {id: 90, bookNum: "19.b", type: "normal", ruleId: "R13", raw: "There ________ (be) no children in the park.", ans: "are/were", bn: "পার্কে কোনো শিশু নেই/ছিল না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Plural): 'There' যুক্ত বাক্যে পরের Noun (children - বহুবচন) অনুযায়ী Plural Verb [are / were] বসে!</strong>"},
    {id: 91, bookNum: "19.c", type: "normal", ruleId: "R12", raw: "He made me ________ (work) very hard.", ans: "work", bn: "সে আমাকে দিয়ে কঠোর পরিশ্রম করিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made / let + ব্যক্তি (me)' থাকলে পরের ভার্বটি সর্বদা সরাসরি Base Form [V1] হয়!</strong>তাই অপরিবর্তিত 'work' বসেছে।"},
    {id: 92, bookNum: "19.d", type: "normal", ruleId: "R1", raw: "I would rather die ________ (beg).", ans: "than beg", bn: "আমি বরং মরবো তাও ভিক্ষা করবো না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'would rather' যুক্ত বাক্যে দুটি কাজের তুলনায় ২য় ভার্বের আগে 'than' বসে এবং ভার্বের আসল রূপ [V1] হয়!</strong>তাই 'than beg' বসেছে।"},
    {id: 93, bookNum: "19.e", type: "normal", ruleId: "R10", raw: "We waited until the plane ________ (take) off.", ans: "took", bn: "বিমানটি উড্ডয়ন না করা পর্যন্ত আমরা অপেক্ষা করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Until): [V2 ⟷ Until / As soon as ⟷ V2] — প্রথম অংশে Past (waited) থাকায় until-এর পরেও Past [took] বসেছে!</strong>"},
    {id: 94, bookNum: "20.a", type: "normal", ruleId: "R9", raw: "If he (obey) ________ his teacher, he would be successful.", ans: "obeyed", bn: "যদি সে তার শিক্ষককে মান্য করতো, তবে সে সফল হতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): অপর অংশে [would + V1 (would be)] থাকায় 'If' যুক্ত অংশটি Past Indefinite [V2] হয়েছে!</strong>তাই obey -> obeyed।"},
    {id: 95, bookNum: "20.b", type: "normal", ruleId: "R7", raw: "We saw them (work) ________ in the field.", ans: "working", bn: "আমরা তাদেরকে মাঠে কাজ করতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing] বসে!</strong>তাই 'working' হয়েছে।"},
    {id: 96, bookNum: "20.c", type: "normal", ruleId: "R7", raw: "I hear her (sing) ________.", ans: "singing", bn: "আমি তাকে গান গাইতে শুনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): দেখার বা শোনার ভার্ব (see, hear, find)-এর পর ২য় ভার্ব আসলে সরাসরি [V1 + ing] বসে!</strong>তাই 'singing' হয়েছে।"},
    {id: 97, bookNum: "20.d", type: "normal", ruleId: "R12", raw: "I want to see the house (paint) ________ white.", ans: "painted", bn: "আমি বাড়িটি সাদা রঙ করা অবস্থায় দেখতে চাই।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 & R1 (Passive Participle): বাড়িটি (বস্তু) নিজে নিজেকে রঙ করতে পারে না, অন্যের দ্বারা রঙ করা অবস্থা বোঝাতে মূল ভার্বের ৩য় রূপ [V3] বসেছে!</strong>"},
    {id: 98, bookNum: "20.e", type: "normal", ruleId: "R6", raw: "He went to London with a view to (develop) ________ a business.", ans: "developing", bn: "সে একটি ব্যবসা বাড়ানোর উদ্দেশ্যে লন্ডনে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): বাক্যে 'with a view to' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing] যুক্ত হয়!</strong>তাই 'developing' বসেছে।"},
    {id: 101, bookNum: "21.a", type: "normal", ruleId: "R13", raw: "Many a boy ________ (to be) present in class.", ans: "is", bn: "অনেক ছেলেই ক্লাসে উপস্থিত থাকে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'Many a'-এর পর Noun এবং Verb দুটিই সর্বদা Singular হয়!</strong>তাই Be-verb হিসেবে 'is' বসেছে।"},
    {id: 102, bookNum: "21.b", type: "normal", ruleId: "R10", raw: "I ________ (finish) reading the book before he comes.", ans: "will have finished", bn: "সে আসার পূর্বেই আমি বইটি পড়া শেষ করে ফেলবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর Future নিয়ম): 'Before'-এর পরে Present Indefinite (comes) থাকলে, before-এর আগে Future Perfect [will / shall have + V3] বসে!</strong>তাই 'will have finished' হয়েছে।"},
	// =======================================================
    // Part 2: Question 101 to 200 (ID: 103 to 205)
    // =======================================================
    {id: 103, bookNum: "21.c", type: "normal", ruleId: "R13", raw: "________ (Child) like sweets.", ans: "Children", bn: "শিশুরা মিষ্টি পছন্দ করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R2 (Always Plural + অভ্যাস): সাধারণ সত্য বা অভ্যাস বোঝাতে এবং পরে প্লুরাল ভার্ব (like - s/es ছাড়া) থাকায় Subject-টি বহুবচন [Children] হবে!</strong>একবচন হলে likes হতো, কিন্তু এখানে 'like' থাকায় Child-এর প্লুরাল 'Children' বসেছে।"},
    {id: 104, bookNum: "21.d", type: "normal", ruleId: "R5", raw: "I ________ (live) here since 1980.", ans: "have been living", bn: "আমি ১৯৮০ সাল থেকে এখানে বসবাস করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since + নির্দিষ্ট সময় (1980)' থাকলে কাজটি আগে শুরু হয়ে এখনো চলছে বোঝায়, তাই [have / has been + V1 + ing] বসে!</strong>তাই 'have been living' হয়েছে।"},
    {id: 105, bookNum: "21.e", type: "normal", ruleId: "R11", raw: "The boy fell down while he ________ (run).", ans: "was running", bn: "দৌড়ানোর সময় ছেলেটি পড়ে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (he)' থাকলে অতীতে চলমান কাজ বোঝাতে সর্বদা [was / were + V1 + ing] বসে!</strong>তাই 'was running' হয়েছে।"},
    {id: 106, bookNum: "22.a", type: "normal", ruleId: "R5", raw: "Ratan ________ (swim) in the pond since morning.", ans: "has been swimming", bn: "রতন সকাল থেকে পুকুরে সাঁতার কাটছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since morning' (সকাল থেকে চলমান) থাকায় [has been + V1 + ing] বসেছে!</strong>Subject 'Ratan' সিঙ্গুলার হওয়ায় 'has been swimming' হয়েছে।"},
    {id: 107, bookNum: "22.b", type: "normal", ruleId: "R5", raw: "Halim ________ (dream) a bad dream last night.", ans: "dreamt", bn: "হালিম গত রাতে একটি দুঃস্বপ্ন দেখেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে অতীতের সংকেত 'last night' (গত রাত) থাকায় সরাসরি Past Indefinite [V2] বসেছে!</strong>dream-এর V2 হলো 'dreamt / dreamed'।"},
    {id: 108, bookNum: "22.c", type: "normal", ruleId: "R2", raw: "Samira ________ (go) to the book fair every year.", ans: "goes", bn: "সামীরা প্রতি বছর বইমেলায় যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'every year, everyday, regularly, always' থাকলে Present Indefinite হয়!</strong>Subject 'Samira' (3rd Person Singular) হওয়ায় ভার্বের সাথে es যুক্ত হয়ে 'goes' হয়েছে।"},
    {id: 109, bookNum: "22.d", type: "normal", ruleId: "R2", raw: "Tomorrow never ________ (die).", ans: "dies", bn: "আগামীকাল কখনো আসে না / শেষ হয় না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল - প্রবাদ ও Never): বাক্যে 'never' থাকলে এবং চিরন্তন প্রবাদ বাক্য বোঝালে Present Indefinite হয়!</strong>'Tomorrow' একক কাল বা 3rd Person Singular হওয়ায় 'dies' বসেছে।"},
    {id: 110, bookNum: "22.e", type: "normal", ruleId: "R10", raw: "The boy left the school after his father ________ (call) him.", ans: "had called", bn: "তার বাবা ডাকার পর ছেলেটি স্কুল ত্যাগ করেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (After-এর ছন্দ): 'After মানে পরে' — তাই after-এর পরে সর্বদা Past Perfect [had + V3] এবং আগে [V2] বসে!</strong>তাই 'had called' হয়েছে।"},
    {id: 111, bookNum: "23.a", type: "normal", ruleId: "R4", raw: "I ________ (write) him recently.", ans: "have written", bn: "আমি সম্প্রতি তাকে চিঠি লিখেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'recently' থাকলে চোখ বন্ধ করে Present Perfect [have / has + V3] বসে!</strong>তাই 'have written' হয়েছে।"},
    {id: 112, bookNum: "23.b", type: "normal", ruleId: "R2", raw: "He always ________ (get) up early.", ans: "gets", bn: "সে সবসময় ভোরে ঘুম থেকে ওঠে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'always' (নিয়মিত অভ্যাস) থাকায় Present Indefinite হয়েছে!</strong>Subject 'He' সিঙ্গুলার হওয়ায় 'gets' বসেছে।"},
    {id: 113, bookNum: "23.c", type: "normal", ruleId: "R13", raw: "Fifty miles ________ (be) a long way.", ans: "is", bn: "পঞ্চাশ মাইল একটি দীর্ঘ পথ।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - দূরত্ব): নির্দিষ্ট দূরত্ব (Fifty miles) একক সমষ্টি নির্দেশ করায় সর্বদা Singular Verb [is] বসে!</strong>"},
    {id: 114, bookNum: "23.d", type: "normal", ruleId: "R5", raw: "He ________ (play) since morning.", ans: "has been playing", bn: "সে সকাল থেকে খেলছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since morning' (সকাল থেকে চলমান) থাকায় [has been + V1 + ing] বসেছে!</strong>"},
    {id: 115, bookNum: "23.e", type: "normal", ruleId: "R13", raw: "The news ________ (be) false.", ans: "is", bn: "সংবাদটি মিথ্যা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI): 'News' শব্দটি দেখতে প্লুরাল মনে হলেও এটি সর্বদা Singular, তাই [is] বসেছে!</strong>"},
    {id: 116, bookNum: "24.a", type: "normal", ruleId: "R7", raw: "I heard her ________ (sing).", ans: "singing", bn: "আমি তাকে গান গাইতে শুনলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে দেখার/শোনার ভার্ব (see/saw, hear/heard, find)-এর পর ২য় ভার্ব আসলে তার সাথে [V1 + ing] যুক্ত হয়!</strong>তাই 'singing' হয়েছে।"},
    {id: 117, bookNum: "24.b", type: "normal", ruleId: "R2", raw: "She ________ (come) of a respectable family.", ans: "came / comes", bn: "সে একটি সম্ভ্রান্ত পরিবারে জন্মগ্রহণ করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R5: কোনো পরিবারে জন্মগ্রহণ করা অর্থে 'come of' বসে। সাধারণ পরিচয় অর্থে [comes] এবং অতীত ঘটনা অর্থে [came] ব্যবহৃত হয়!</strong>"},
    {id: 118, bookNum: "24.c", type: "normal", ruleId: "R1", raw: "I have ________ (have) a headache.", ans: "had", bn: "আমার মাথা ব্যথা হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): শূন্যস্থানের আগে সাহায্যকারী ভার্ব 'have' দেওয়াই আছে, তাই ব্র্যাকেটের মূল ভার্ব (have)-এর ৩য় রূপ [V3 = had] বসেছে!</strong>"},
    {id: 119, bookNum: "24.d", type: "normal", ruleId: "R6", raw: "My younger daughter is looking forward to ________ (meet) her grandmother.", ans: "meeting", bn: "আমার ছোট মেয়ে তার দাদীর সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'look forward to / is looking forward to'-এর পর 'to' থাকা সত্ত্বেও সর্বদা [V1 + ing] বসে!</strong>তাই 'meeting' হয়েছে।"},
    {id: 120, bookNum: "24.e", type: "normal", ruleId: "R1", raw: "Foods should be kept ________ (cover).", ans: "covered", bn: "খাবার ঢেকে রাখা উচিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Passive Participle): খাবার নিজে নিজেকে ঢাকতে পারে না, অন্যের দ্বারা ঢাকা অবস্থা (Past Participle Adjective) বোঝাতে [V3 = covered] বসেছে!</strong>"},
    {id: 121, bookNum: "25.a", type: "normal", ruleId: "R1", raw: "They are quite ________ (mistake).", ans: "mistaken", bn: "তারা সম্পূর্ণ ভুলের মধ্যে আছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb + V3 Adjective): কেউ ভুল ধারণা বা ভ্রান্ত অবস্থার মধ্যে আছে বোঝাতে 'am/is/are'-এর পর Past Participle [mistaken] বসে!</strong>"},
    {id: 122, bookNum: "25.b", type: "normal", ruleId: "R12", raw: "It is time we ________ (start) the project.", ans: "started", bn: "এটাই উপযুক্ত সময় আমাদের প্রজেক্টটি শুরু করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is time / It is high time + Subject (we)' থাকলে পরবর্তী ভার্বটি সর্বদা Past Form [V2] হয়!</strong>তাই 'started' বসেছে।"},
    {id: 123, bookNum: "25.c", type: "normal", ruleId: "R9", raw: "If I were there, I ________ (help) him.", ans: "would help", bn: "আমি যদি সেখানে থাকতাম, তবে তাকে সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে সর্বদা [would / could / might + V1] বসে!</strong>তাই 'would help' হয়েছে।"},
    {id: 124, bookNum: "25.d", type: "normal", ruleId: "R7", raw: "I cannot help ________ (go) there.", ans: "going", bn: "আমি সেখানে না গিয়ে পারি না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind, cannot help, could not help, feel like'—এদের ঠিক পরেই সর্বদা [V1 + ing] বসে!</strong>তাই 'going' হয়েছে।"},
    {id: 125, bookNum: "25.e", type: "normal", ruleId: "R6", raw: "I was used to ________ (take) exercise everyday.", ans: "taking", bn: "আমি প্রতিদিন ব্যায়াম করায় অভ্যস্ত ছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): শুধু 'used to' থাকলে V1 হয়, কিন্তু এর আগে Be-verb/Get (am/is/are/was/were/get used to) থাকলে সর্বদা [V1 + ing] বসে!</strong>এখানে 'was used to' থাকায় 'taking' হয়েছে।"},
    {id: 126, bookNum: "26.a", type: "normal", ruleId: "R10", raw: "She told me his name after he ________ (leave).", ans: "had left", bn: "সে চলে যাওয়ার পর সে আমাকে তার নাম বলেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (After-এর ছন্দ): 'After মানে পরে' — তাই after-এর পরে সর্বদা Past Perfect [had + V3] বসে!</strong>তাই 'had left' হয়েছে।"},
    {id: 127, bookNum: "26.b", type: "normal", ruleId: "R7", raw: "I saw him ________ (go).", ans: "going", bn: "আমি তাকে যেতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing] বসে!</strong>তাই 'going' হয়েছে।"},
    {id: 128, bookNum: "26.c", type: "normal", ruleId: "R12", raw: "Would that I ________ (go) to college.", ans: "could go", bn: "আমি যদি কলেজে যেতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that + Subject' থাকলে অসম্ভব ইচ্ছা বোঝাতে সর্বদা [could + V1] বসে!</strong>তাই 'could go' বসেছে।"},
    {id: 129, bookNum: "26.d", type: "normal", ruleId: "R9", raw: "If I had seen him, I ________ (tell) him the matter.", ans: "would have told", bn: "আমি যদি তাকে দেখতাম, তবে তাকে বিষয়টি বলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): একপাশে [If + had + V3 (had seen)] থাকলে অপর অংশে সর্বদা [would / could / might have + V3] বসে!</strong>তাই 'would have told' হয়েছে।"},
    {id: 130, bookNum: "26.e", type: "normal", ruleId: "R5", raw: "I ________ (read) for the three hours.", ans: "have been reading", bn: "আমি তিন ঘন্টা ধরে পড়ছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for + মোট সময় (three hours)' থাকায় [have been + V1 + ing] বসেছে!</strong>"},
    {id: 131, bookNum: "27.a", type: "normal", ruleId: "R1", raw: "You had better ________ (to take) rest.", ans: "take", bn: "তোমার বরং বিশ্রাম নেওয়াই ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'had better / would rather / cannot but'-এর পর ব্র্যাকেটের 'to' কেটে গিয়ে সরাসরি আসল রূপ [V1] বসে!</strong>তাই শুধু 'take' বসেছে।"},
    {id: 132, bookNum: "27.b", type: "normal", ruleId: "R12", raw: "Would that I ________ (see) a tiger.", ans: "could see", bn: "আমি যদি একটি বাঘ দেখতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that' থাকলে Subject-এর পর সর্বদা [could + V1] বসে!</strong>তাই 'could see' হয়েছে।"},
    {id: 133, bookNum: "27.c", type: "normal", ruleId: "R13", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'One of'-এর পর Noun বহুবচন হলেও ভার্ব সর্বদা Singular হয় এবং 'yesterday' থাকায় Past সিঙ্গুলার ভার্ব [was] বসেছে!</strong>"},
    {id: 134, bookNum: "27.d", type: "normal", ruleId: "R9", raw: "If I had much money, I ________ (buy) a car.", ans: "would buy", bn: "আমার যদি অনেক টাকা থাকতো, তবে আমি একটি গাড়ি কিনতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): 'If + Past Indefinite (had much money)' থাকায় অপর অংশে [would + V1] বসেছে!</strong>তাই 'would buy' হয়েছে।"},
    {id: 135, bookNum: "27.e", type: "normal", ruleId: "R11", raw: "While he ________ (walk) in the campus, he met me.", ans: "was walking", bn: "ক্যাম্পাসে হাঁটার সময় তার সাথে আমার দেখা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (he)' থাকলে অতীতে চলমান কাজ বোঝাতে সর্বদা [was / were + V1 + ing] বসে!</strong>তাই 'was walking' হয়েছে।"},
    {id: 136, bookNum: "28.a", type: "normal", ruleId: "R7", raw: "He gave up ________ (play) football when he got married.", ans: "playing", bn: "বিয়ের পর সে ফুটবল খেলা ছেড়ে দিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'give up, stop, finish, start, enjoy, avoid'-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing] বসে!</strong>তাই 'playing' হয়েছে।"},
    {id: 137, bookNum: "28.b", type: "normal", ruleId: "R12", raw: "I got my car ________ (repair).", ans: "repaired", bn: "আমি আমার গাড়িটি মেরামত করিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'get / got + বস্তু (my car)' থাকলে অন্যকে দিয়ে কাজটি করানো বোঝায়, তাই সর্বদা [V3] বসে!</strong>তাই 'repaired' হয়েছে।"},
    {id: 138, bookNum: "28.c", type: "normal", ruleId: "R12", raw: "Our teachers make us ________ (work) very hard.", ans: "work", bn: "আমাদের শিক্ষকরা আমাদের দিয়ে কঠোর পরিশ্রম করান।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made / let + ব্যক্তি (us)' থাকলে পরের ভার্বের আগে 'to' বসে না, সরাসরি [V1] বসে!</strong>তাই 'work' বসেছে।"},
    {id: 139, bookNum: "28.d", type: "normal", ruleId: "R7", raw: "Would you mind ________ (close) the door?", ans: "closing", bn: "আপনি কি দয়া করে দরজাটি বন্ধ করবেন?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind'-এর ঠিক পরেই সর্বদা [V1 + ing] বসে!</strong>তাই 'closing' হয়েছে।"},
    {id: 140, bookNum: "28.e", type: "normal", ruleId: "R6", raw: "She is looking forward to ________ (go) Europe.", ans: "going", bn: "সে ইউরোপ যাওয়ার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'look forward to / is looking forward to'-এর পর সর্বদা [V1 + ing] বসে!</strong>তাই 'going' হয়েছে।"},
    {id: 141, bookNum: "29.a", type: "normal", ruleId: "R7", raw: "I saw the farmer ________ (plough) his land.", ans: "ploughing", bn: "আমি কৃষকটিকে তার জমি চাষ করতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing] বসে!</strong>তাই 'ploughing' হয়েছে।"},
    {id: 142, bookNum: "29.b", type: "normal", ruleId: "R9", raw: "If he read, he ________ (pass).", ans: "would pass", bn: "যদি সে পড়তো, তবে সে পাস করতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): এখানে 'he read'-এ ভার্বের সাথে s নেই, অর্থাৎ এই 'read' হলো Past Form [V2]! তাই অপর অংশে [would + V1] বসেছে।</strong>"},
    {id: 143, bookNum: "29.c", type: "normal", ruleId: "R3", raw: "Listen, the clock ________ (strike).", ans: "is striking", bn: "শোনো, ঘড়িতে ঘণ্টা বাজছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (Direct Command Alert!): বাক্যে 'Listen!' বা 'Keep silent!' থাকলে কাজটি এই মুহূর্তে চলছে বোঝায়, তাই সরাসরি [am / is / are + V1 + ing] বসে!</strong>তাই 'is striking' হয়েছে।"},
    {id: 144, bookNum: "29.d", type: "normal", ruleId: "R12", raw: "It is high time he ________ (leave) the place.", ans: "left", bn: "এটাই উপযুক্ত সময় তার স্থানটি ত্যাগ করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (he)' থাকলে মূল ভার্ব সর্বদা Past Form [V2] হয়!</strong>তাই leave -> left।"},
    {id: 145, bookNum: "29.e", type: "normal", ruleId: "R1", raw: "Speak the truth or you ________ (punish).", ans: "will be punished", bn: "সত্য কথা বলো অন্যথায় তোমাকে শাস্তি দেওয়া হবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive - Future): সে নিজে নিজেকে শাস্তি দেবে না, অন্যের দ্বারা শাস্তি দেওয়া হবে (Passive), তাই [will be + V3] বসেছে!</strong>"},
    {id: 146, bookNum: "29.f", type: "normal", ruleId: "R5", raw: "The student ________ (rebuke) for his misbehavior yesterday.", ans: "was rebuked", bn: "ছাত্রটিকে গতকাল তার অসদাচরণের জন্য তিরস্কার করা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Passive): বাক্যে 'yesterday' (অতীত) আছে এবং ছাত্রটিকে অন্যের দ্বারা তিরস্কার করা হয়েছিল (Passive), তাই [was + V3] বসেছে!</strong>"},
    {id: 147, bookNum: "29.g", type: "normal", ruleId: "R2", raw: "It ________ (rain) heavily in the rainy season.", ans: "rains", bn: "বর্ষাকালে প্রচুর বৃষ্টিপাত হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (Present Indefinite - প্রাকৃতিক সত্য): বর্ষাকালে বৃষ্টি হওয়া একটি চিরন্তন প্রাকৃতিক নিয়ম, তাই Subject 'It' অনুযায়ী [rains] বসেছে!</strong>"},
    {id: 148, bookNum: "29.h", type: "normal", ruleId: "R13", raw: "Making a good result in the exam ________ (need) a lot of hard work.", ans: "needs", bn: "পরীক্ষায় ভালো ফলাফল করার জন্য প্রচুর কঠোর পরিশ্রমের প্রয়োজন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - Gerund Subject): বাক্যের শুরুতে Gerund (V1+ing = Making...) সাবজেক্ট হিসেবে বসলে তা সর্বদা Singular হয়!</strong>তাই ভার্বের সাথে s যুক্ত হয়ে 'needs' হয়েছে।"},
    {id: 149, bookNum: "30.a", type: "normal", ruleId: "R13", raw: "Every flower and every fruit ________ (be) the gift of God.", ans: "is", bn: "প্রতিটি ফুল এবং প্রতিটি ফলই ঈশ্বরের উপহার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'Each / Every' যুক্ত সাবজেক্ট 'and' দ্বারা যুক্ত হলেও Verb সর্বদা Singular [is] হয়!</strong>"},
    {id: 150, bookNum: "30.b", type: "normal", ruleId: "R1", raw: "The greater part of the village ________ (flood).", ans: "is flooded", bn: "গ্রামের সিংহভাগ এলাকা প্লাবিত হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R13 (Passive + Singular Subject): গ্রামের অংশ নিজে প্লাবিত হয় না, বন্যার পানিতে প্লাবিত হয় (Passive) এবং 'The greater part' একবচন হওয়ায় [is flooded] বসেছে!</strong>"},
    {id: 151, bookNum: "30.c", type: "normal", ruleId: "R7", raw: "I cannot help ________ (shed) tears.", ans: "shedding", bn: "আমি চোখের জল না ফেলে পারি না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'cannot help / could not help' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing] বসে!</strong>তাই 'shedding' হয়েছে।"},
    {id: 152, bookNum: "30.d", type: "normal", ruleId: "R10", raw: "The teacher ________ (arrive) before the students ________ (come).", ans: "had arrived, came", bn: "ছাত্ররা আসার পূর্বেই শিক্ষক এসে পৌঁছেছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before মানে আগে' — তাই before-এর আগে [had + V3 (had arrived)] এবং before-এর পরে [V2 (came)] বসে!</strong>"},
    {id: 153, bookNum: "30.e", type: "normal", ruleId: "R5", raw: "I ________ (wait) for the results for 7 days.", ans: "have been waiting", bn: "আমি ৭ দিন ধরে ফলাফলের জন্য অপেক্ষা করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for + মোট সময় (7 days)' থাকায় [have been + V1 + ing] বসেছে!</strong>"},
