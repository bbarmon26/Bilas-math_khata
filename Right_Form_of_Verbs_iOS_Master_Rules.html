    {id: 362, bookNum: "79.c", type: "normal", ruleId: "R7", raw: "Start ________ (write).", ans: "writing", bn: "লেখা শুরু করো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'Start, stop, begin, finish, give up, keep'-এর ঠিক পরেই ২য় ভার্ব আসলে সরাসরি [V1 + ing = writing] বসে!</strong>"},
    {id: 363, bookNum: "79.d", type: "normal", ruleId: "R6", raw: "He came here with a view to ________ (help) me.", ans: "helping", bn: "সে আমাকে সাহায্য করার উদ্দেশ্যে এখানে এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = helping] বসে!</strong>"},
    {id: 364, bookNum: "79.e", type: "normal", ruleId: "R5", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'yesterday' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did they go)] বসেছে!</strong>"},
    {id: 365, bookNum: "80.a", type: "normal", ruleId: "R7", raw: "I saw a bird ________ (fly) in the sky.", ans: "flying", bn: "আমি আকাশে একটি পাখিকে উড়ে বেড়াতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing = flying] বসে!</strong>"},
    {id: 366, bookNum: "80.b", type: "normal", ruleId: "R1", raw: "You had better ________ (to go) home.", ans: "go", bn: "তোমার বরং বাড়ি যাওয়াই ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'had better'-এর পর ব্র্যাকেটের 'to' কেটে গিয়ে সরাসরি আসল রূপ [V1 = go] বসে!</strong>"},
    {id: 367, bookNum: "80.c", type: "normal", ruleId: "R12", raw: "It is high time he ________ (to change) his mind.", ans: "changed", bn: "এটাই উপযুক্ত সময় তার মন পরিবর্তন করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (he)' থাকলে ব্র্যাকেটের 'to' উঠে গিয়ে মূল ভার্বের Past Form [V2 = changed] বসে!</strong>"},
    {id: 368, bookNum: "80.d", type: "normal", ruleId: "R12", raw: "I got my car ________ (repair).", ans: "repaired", bn: "আমি আমার গাড়িটি মেরামত করিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তু (my car)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = repaired] বসেছে!</strong>"},
    {id: 369, bookNum: "80.e", type: "normal", ruleId: "R1", raw: "He has ________ (do) the work.", ans: "done", bn: "সে কাজটি করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): শূন্যস্থানের আগে 'has' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = done] বসেছে!</strong>"},
    {id: 370, bookNum: "81.a", type: "normal", ruleId: "R12", raw: "It is time ________ (start).", ans: "to start", bn: "এখনই শুরু করার সময়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act - No Subject): 'It is time'-এর পর কোনো Subject না থাকলে সরাসরি [to + V1 (to start)] বসে!</strong>"},
    {id: 371, bookNum: "81.b", type: "normal", ruleId: "R12", raw: "I got my rice ________ (cook).", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তু (my rice)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = cooked] বসেছে!</strong>"},
    {id: 372, bookNum: "81.c", type: "normal", ruleId: "R9", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + had + noun] থাকায় ডান পাশে সর্বদা [would + V1 (would open)] বসে!</strong>"},
    {id: 373, bookNum: "81.d", type: "normal", ruleId: "R10", raw: "The train ________ (leave) already, when I reached the station.", ans: "had left", bn: "আমি যখন স্টেশনে পৌঁছালাম তখন ট্রেনটি ইতিমধ্যেই ছেড়ে চলে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance): অতীতে আমি স্টেশনে পৌঁছানোর আগেই (when I reached - V2) ট্রেনটি চলে গিয়েছিল, তাই আগে ঘটা কাজটি Past Perfect [had left] হয়েছে!</strong>"},
    {id: 374, bookNum: "82.a", type: "normal", ruleId: "R10", raw: "No sooner had he ________ (take) the money then he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): 'No sooner had' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = taken] বসেছে!</strong>"},
    {id: 375, bookNum: "82.b", type: "normal", ruleId: "R12", raw: "He made me ________ (to do) the work.", ans: "do", bn: "সে আমাকে দিয়ে কাজটি করিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made + ব্যক্তি (me)' থাকলে ব্র্যাকেটের 'to' উঠে গিয়ে সরাসরি Base Form [V1 = do] বসে!</strong>"},
    {id: 376, bookNum: "82.c", type: "normal", ruleId: "R11", raw: "While ________ (walk) at the station, I met him.", ans: "walking", bn: "স্টেশনে হাঁটার সময়, তার সাথে আমার দেখা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While'-এর ঠিক পরেই কোনো Subject না থাকায় সরাসরি [V1 + ing = walking] বসেছে!</strong>"},
    {id: 377, bookNum: "82.d", type: "normal", ruleId: "R13", raw: "Neither he nor his friends ________ (to have) attended the function.", ans: "have", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'Neither...nor' থাকলে ২য় Subject (his friends - বহুবচন) অনুযায়ী Plural Verb [have] বসে!</strong>"},
    {id: 378, bookNum: "83.a", type: "normal", ruleId: "R13", raw: "A good number of attendees ________ seen in the meeting.", ans: "are/were", bn: "সভায় বেশ ভালো সংখ্যক উপস্থিতি দেখা গিয়েছিল/যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): 'A number of / A good number of + plural noun' থাকলে সর্বদা Plural Verb [are / were] বসে!</strong>(কিন্তু The number of থাকলে Singular হয়)।"},
    {id: 379, bookNum: "83.b", type: "normal", ruleId: "R13", raw: "The banana of Narsingdi ________ famous.", ans: "is", bn: "নরসিংদীর কলা বিখ্যাত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের আসল সাবজেক্ট 'The banana' সিঙ্গুলার হওয়ায় [is] বসেছে!</strong>"},
    {id: 380, bookNum: "83.c", type: "normal", ruleId: "R13", raw: "Five and five ________ ten.", ans: "makes", bn: "পাঁচে পাঁচে দশ হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - গাণিতিক হিসাব): সংখ্যার যোগফল একক সমষ্টি হওয়ায় Singular Verb [makes] বসেছে!</strong>"},
    {id: 381, bookNum: "83.d", type: "normal", ruleId: "R13", raw: "The candidates of this recruitment test ________ very disciplined.", ans: "are", bn: "এই নিয়োগ পরীক্ষার প্রার্থীরা খুবই শৃঙ্খলিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের আসল সাবজেক্ট 'The candidates' বহুবচন (Plural) হওয়ায় [are] বসেছে!</strong>"},
    {id: 382, bookNum: "83.e", type: "normal", ruleId: "R9", raw: "If I ________ a king, I would help the poor.", ans: "were", bn: "আমি যদি একজন রাজা হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): ডান পাশে [would + V1] থাকায় বাম পাশের 'If' অংশে কাল্পনিক Be-verb হিসেবে সর্বদা [were] বসে!</strong>"},
    {id: 383, bookNum: "84.a", type: "normal", ruleId: "R1", raw: "Why are social networks ________ (expand) so fast?", ans: "expanding", bn: "সামাজিক যোগাযোগ মাধ্যমগুলো কেন এত দ্রুত প্রসারিত হচ্ছে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Active Continuous): আগে সাহায্যকারী ভার্ব 'are' দেওয়াই আছে এবং কাজটি বর্তমানে চলছে বোঝাতে সরাসরি [V1 + ing = expanding] বসেছে!</strong>"},
    {id: 384, bookNum: "84.b", type: "normal", ruleId: "R13", raw: "Most of the social ________ (service) are cost free.", ans: "services", bn: "অধিকাংশ সামাজিক সেবাই সম্পূর্ণ বিনামূল্যে পাওয়া যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): পরে Plural Verb 'are' দেওয়াই আছে, তাই 'Most of the'-এর পরের গণনাযোগ্য Noun-টি বহুবচন [services] হবে!</strong>"},
    {id: 385, bookNum: "84.c", type: "normal", ruleId: "R7", raw: "You can make use of them free, ________ (pay) a very little to your internet service provider.", ans: "paying", bn: "আপনার ইন্টারনেট সরবরাহকারীকে খুব সামান্য অর্থ প্রদান করে আপনি এগুলো বিনামূল্যে ব্যবহার করতে পারেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Participle - ২য় ভার্ব): একটি পূর্ণাঙ্গ ক্লজের পর কমা (,) দিয়ে আরেকটি আনুষঙ্গিক কাজ যুক্ত হলে সেই ভার্বের সাথে [V1 + ing = paying] বসে!</strong>"},
    {id: 386, bookNum: "84.d", type: "normal", ruleId: "R13", raw: "Moreover, you can make your personal profile public before the entire online ________ (community).", ans: "community", bn: "তাছাড়া, আপনি পুরো অনলাইন সম্প্রদায়ের সামনে আপনার ব্যক্তিগত প্রোফাইলটি উন্মুক্ত করতে পারেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Collective Noun): 'the entire online' (সমগ্র অনলাইন)-এর পর একক সমষ্টিগত Noun হিসেবে অপরিবর্তিত [community] বসেছে!</strong>"},
    {id: 387, bookNum: "84.e", type: "normal", ruleId: "R1", raw: "You can also look into other people's profile if you are ________ (interest).", ans: "interested", bn: "আপনি যদি আগ্রহী হন তবে অন্য লোকের প্রোফাইলেও নজর দিতে পারেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb + V3 Adjective): কোনো বিষয়ে ব্যক্তি নিজে আগ্রহী হওয়া বোঝাতে 'am/is/are'-এর পর সর্বদা Past Participle [interested] বসে!</strong>"},
    {id: 388, bookNum: "85.a", type: "normal", ruleId: "R12", raw: "Would that I ________ (see) a tiger.", ans: "could see", bn: "আমি যদি একটি বাঘ দেখতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that' থাকলে Subject-এর পর সর্বদা [could + V1 (could see)] বসে!</strong>"},
    {id: 389, bookNum: "85.b", type: "normal", ruleId: "R6", raw: "I went to the library with a view to ________ (make) note there.", ans: "making", bn: "আমি সেখানে নোট তৈরি করার উদ্দেশ্যে লাইব্রেরিতে গিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = making] বসে!</strong>"},
    {id: 390, bookNum: "85.c", type: "normal", ruleId: "R13", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'One of' সর্বদা Singular এবং 'yesterday' থাকায় [was] বসেছে!</strong>"},
    {id: 391, bookNum: "85.d", type: "normal", ruleId: "R10", raw: "The class started after the bell ________ (ring).", ans: "had rung", bn: "ঘণ্টা বাজার পর ক্লাস শুরু হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (After-এর ছন্দ): 'After মানে পরে' — তাই after-এর পরে সর্বদা Past Perfect [had + V3 (had rung)] বসে!</strong>"},
    {id: 392, bookNum: "86.a", type: "normal", ruleId: "R1", raw: "He ran away having ________ (see) the police.", ans: "seen", bn: "পুলিশকে দেখে সে পালিয়ে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): 'have / has / had / having'-এর ঠিক পরেই সর্বদা মূল ভার্বের ৩য় রূপ [V3 = seen] বসে!</strong>"},
    {id: 393, bookNum: "86.b", type: "normal", ruleId: "R1", raw: "You would better ________ (take) rest.", ans: "take", bn: "তোমার বরং বিশ্রাম নেওয়াই ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'would better / had better'-এর ঠিক পরেই সরাসরি মূল ভার্বের আসল রূপ [V1 = take] বসে!</strong>"},
    {id: 394, bookNum: "86.c", type: "normal", ruleId: "R10", raw: "I came after he ________ (leave) home.", ans: "had left", bn: "সে বাড়ি থেকে চলে যাওয়ার পর আমি এসেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (After-এর ছন্দ): 'After'-এর আগে V2 (came) থাকায় after-এর পরে সর্বদা Past Perfect [had + V3 = had left] বসে!</strong>"},
    {id: 395, bookNum: "86.d", type: "normal", ruleId: "R10", raw: "No sooner had he ________ (take) the money than he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): 'No sooner had' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = taken] বসেছে!</strong>"},
    {id: 396, bookNum: "87.a", type: "normal", ruleId: "R12", raw: "I wish I ________ (to be) a billionaire.", ans: "were", bn: "আমি যদি একজন বিলিয়নেয়ার হতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (to be) থাকলে সর্বদা [were] বসে!</strong>"},
    {id: 397, bookNum: "87.b", type: "normal", ruleId: "R5", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'yesterday' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did they go)] বসেছে!</strong>"},
    {id: 398, bookNum: "87.c", type: "normal", ruleId: "R13", raw: "It is I who ________ (be) responsible for this work.", ans: "am", bn: "আমিই এই কাজের জন্য দায়ী।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Relative Pronoun Agreement): 'who / which / that'-এর ঠিক আগের Noun বা Pronoun (এখানে 'I') অনুযায়ী পরের ভার্বটি বসে!</strong>তাই 'I'-এর সাথে মিল রেখে 'am' বসেছে।"},
    {id: 400, bookNum: "87.d", type: "normal", ruleId: "R13", raw: "Gulliver's Travels ________ (be) a famous book.", ans: "is", bn: "গুলিভার্স ট্রাভেলস একটি বিখ্যাত বই।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - বইয়ের নাম): 'Gulliver's Travels' একটি একক বইয়ের নাম হওয়ায় সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 401, bookNum: "87.e", type: "normal", ruleId: "R1", raw: "You had better ________ (went) to bed early.", ans: "go", bn: "তোমার বরং তাড়াতাড়ি ঘুমাতে যাওয়াই ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'had better'-এর পর কখনোই Past Form (went) বসে না, সর্বদা মূল ভার্বের আসল রূপ [V1 = go] বসে!</strong>"},
    {id: 402, bookNum: "88.a", type: "normal", ruleId: "R3", raw: "They ________ (play) at this moment.", ans: "are playing", bn: "তারা এই মুহূর্তে খেলছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'at this moment' থাকায় Present Continuous [are playing] বসেছে!</strong>"},
    {id: 403, bookNum: "88.b", type: "normal", ruleId: "R4", raw: "I ________ (see) him recently.", ans: "have seen", bn: "আমি সম্প্রতি তাকে দেখেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'recently' থাকায় Present Perfect [have seen] বসেছে!</strong>"},
    {id: 404, bookNum: "88.c", type: "normal", ruleId: "R12", raw: "He made me to ________ (do) the work.", ans: "do", bn: "সে আমাকে দিয়ে কাজটি করিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made + ব্যক্তি (me)' থাকলে পরের ভার্বের সাথে কখনোই কিছু যুক্ত হয় না, সরাসরি Base Form [V1 = do] বসে!</strong>"},
    {id: 405, bookNum: "88.d", type: "normal", ruleId: "R13", raw: "Either he or his brother ________ (be) guilty.", ans: "is/was", bn: "হয় সে অথবা তার ভাই দোষী।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'Either...or' থাকলে ২য় Subject (his brother - একবচন) অনুযায়ী Singular Verb [is / was] বসে!</strong>"},
    {id: 406, bookNum: "88.e", type: "normal", ruleId: "R13", raw: "A pair of shoes ________ (be) on the table.", ans: "is/was", bn: "টেবিলের ওপর এক জোড়া জুতো আছে/ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): শুধু 'shoes' থাকলে প্লুরাল হতো, কিন্তু 'of'-এর আগে 'A pair' (এক জোড়া - একবচন) থাকায় সর্বদা Singular Verb [is / was] বসে!</strong>"},
    {id: 407, bookNum: "89.a", type: "normal", ruleId: "R5", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি [V2 = came] বসেছে!</strong>"},
    {id: 408, bookNum: "89.b", type: "normal", ruleId: "R2", raw: "They ________ (not go) to school everyday.", ans: "do not go", bn: "তারা প্রতিদিন স্কুলে যায় না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R1 (DANGEROUS + Negative): বাক্যে 'everyday' থাকায় Present Indefinite হয়েছে এবং বহুবচন সাবজেক্ট 'They'-এর সাথে না-বোধক করতে [do not go] বসেছে!</strong>"},
    {id: 409, bookNum: "89.c", type: "normal", ruleId: "R2", raw: "The sun ________ (give) us light.", ans: "gives", bn: "সূর্য আমাদের আলো দেয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য): চিরন্তন সত্য বাক্য Present Indefinite হয় এবং 'The sun' সিঙ্গুলার হওয়ায় [gives] বসেছে!</strong>"},
    {id: 410, bookNum: "89.d", type: "normal", ruleId: "R5", raw: "I ________ (suffer) from fever for a long time.", ans: "have been suffering", bn: "আমি দীর্ঘ সময় ধরে জ্বরে ভুগছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'for a long time' থাকায় [have been suffering] বসেছে!</strong>"},
    {id: 411, bookNum: "89.e", type: "normal", ruleId: "R13", raw: "The brave never ________ (fear) death.", ans: "fear", bn: "বীরেরা কখনো মৃত্যুকে ভয় পায় না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R2 (Always Plural - The + Adjective): 'The brave, the poor, the rich' সমগ্র জাতিকে বোঝায় বলে সর্বদা Plural হয়!</strong>তাই ভার্বের সাথে s যুক্ত না হয়ে সরাসরি [V1 = fear] বসেছে।"},
    {id: 412, bookNum: "90.a", type: "normal", ruleId: "R8", raw: "To ________ (frank), he is a liar.", ans: "be frank", bn: "সত্যি বলতে, সে একজন মিথ্যাবাদী।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 & R1 (Infinitive Phrase): বাক্যের শুরুতে 'To' দেওয়াই আছে এবং 'frank' একটি Adjective হওয়ায় এর আগে মূল ভার্বের Base Form হিসেবে [be] বসে 'To be frank' গঠিত হয়েছে!</strong>"},
    {id: 413, bookNum: "90.b", type: "normal", ruleId: "R7", raw: "Would you mind ________ (to have) a cup of tea.", ans: "having", bn: "আপনি কি দয়া করে এক কাপ চা খাবেন?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind' থাকলে ব্র্যাকেটের 'to' কেটে দিয়ে সরাসরি মূল ভার্বের সাথে [V1 + ing = having] বসাতে হয়!</strong>"},
	// =======================================================
    // Part 5: Question 401 to 500 (ID: 414 to 522)
    // =======================================================
    {id: 414, bookNum: "90.c", type: "normal", ruleId: "R9", raw: "If you would like to come, I ________ wait for you.", ans: "will", bn: "তুমি যদি আসতে চাও, তবে আমি তোমার জন্য অপেক্ষা করবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Polite Request): 'If you would like to' দ্বারা বর্তমানের ভদ্র আমন্ত্রণ বা ইচ্ছা বোঝায়, তাই অপর অংশে ভবিষ্যৎ কাজের জন্য [will] বসেছে!</strong>"},
    {id: 415, bookNum: "90.e", type: "normal", ruleId: "R2", raw: "How often ________ the bell ring?", ans: "does", bn: "ঘণ্টাটি কতক্ষণ পর পর বাজে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R1 (DANGEROUS রুল - Question): বাক্যে 'often' থাকায় Present Indefinite হয়েছে এবং সাবজেক্ট 'the bell' (3rd Person Singular) হওয়ায় প্রশ্নে [does] বসেছে!</strong>"},
    {id: 416, bookNum: "91.a", type: "normal", ruleId: "R6", raw: "I am thinking of ________ away next week (go)", ans: "going", bn: "আমি আগামী সপ্তাহে চলে যাওয়ার কথা ভাবছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): যেকোনো Preposition (এখানে 'of')-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing = going] বসে!</strong>"},
    {id: 417, bookNum: "91.b", type: "normal", ruleId: "R8", raw: "He failed ________ the problem (solve)", ans: "to solve", bn: "সে সমস্যাটি সমাধান করতে ব্যর্থ হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'fail, want, decide, promise, hope, agree, advise, need'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to solve)] বসে!</strong>"},
    {id: 418, bookNum: "91.c", type: "normal", ruleId: "R1", raw: "His friends were not ________ by his sorrow (move)", ans: "moved", bn: "তার দুঃখ দেখে তার বন্ধুরা বিন্দুমাত্র বিচলিত হয়নি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): 'were not' এবং পরে 'by his sorrow' (অন্যের দ্বারা বিচলিত হওয়া) থাকায় মূল ভার্বের ৩য় রূপ [V3 = moved] বসেছে!</strong>"},
    {id: 419, bookNum: "91.d", type: "normal", ruleId: "R10", raw: "I never thought I ________ you again. (see)", ans: "would see", bn: "আমি কখনো ভাবিনি যে তোমার সাথে আমার আবার দেখা হবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance / Tense-এর সমতা): প্রথম অংশে Past (thought) থাকায় পরের অংশে ভবিষ্যতের সম্ভাবনা বোঝাতে will পরিবর্তিত হয়ে [would + V1 (would see)] বসেছে!</strong>"},
    {id: 420, bookNum: "92.a", type: "normal", ruleId: "R4", raw: "The innings just ________ (begin).", ans: "has been begun / has just begun", bn: "ইনিংসটি এইমাত্র শুরু হয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 & R13 (Raj-Ley + Singular Noun): বাক্যে 'just' থাকায় Present Perfect হয়েছে এবং 'innings' সিঙ্গুলার নাউন হওয়ায় [has been begun / has just begun] বসেছে!</strong>"},
    {id: 421, bookNum: "92.b", type: "normal", ruleId: "R8", raw: "Your bicycle needs ________ (repair).", ans: "to be repaired", bn: "তোমার সাইকেলটি মেরামত করা প্রয়োজন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Passive): সাইকেল নিজে নিজেকে মেরামত করতে পারে না (Passive), তাই 'needs'-এর পর প্যাসিভ ইনফিনিটিভ [to be + V3 (to be repaired)] বসেছে!</strong>"},
    {id: 422, bookNum: "92.c", type: "normal", ruleId: "R5", raw: "Where you ________ (go) yesterday?", ans: "did you go", bn: "গতকাল তোমরা কোথায় গিয়েছিলে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 & R1 (Past Question): বাক্যে 'yesterday' এবং শেষে প্রশ্নবোধক চিহ্ন (?) থাকায় [did + Subject + V1 (did you go)] বসেছে!</strong>"},
    {id: 423, bookNum: "92.d", type: "normal", ruleId: "R13", raw: "A lot of sugar from the sack ________ (steal).", ans: "was stolen", bn: "বস্তা থেকে প্রচুর চিনি চুরি হয়ে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R1 (Sop BD CGPI + Passive): 'Sugar' আনকাউন্টেবল নাউন হওয়ায় সিঙ্গুলার এবং চিনি অন্যের দ্বারা চুরি হয়েছিল (Passive) বোঝাতে [was stolen] বসেছে!</strong>"},
    {id: 424, bookNum: "93.a", type: "normal", ruleId: "R11", raw: "It is many years since I ________ (come) to your house.", ans: "came", bn: "অনেক বছর হলো আমি তোমার বাড়িতে এসেছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর বাম পাশে Present (It is) থাকলে ডান পাশে সর্বদা Past Indefinite [V2 = came] বসে!</strong>"},
    {id: 425, bookNum: "93.b", type: "normal", ruleId: "R11", raw: "He talked as if he ________ (know) everything.", ans: "had known", bn: "সে এমনভাবে কথা বলছিল যেন সে সবকিছুই জানতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As if): 'As if'-এর বাম পাশে Past [V2 = talked] থাকলে ডান পাশে সর্বদা Past Perfect [had + V3 (had known)] বসে!</strong>"},
    {id: 426, bookNum: "93.c", type: "normal", ruleId: "R13", raw: "You, he and I ________ (be) friends.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Subject-Verb Agreement): একাধিক Person 'and' দ্বারা যুক্ত হওয়ায় Plural Verb [are] বসেছে!</strong>"},
    {id: 427, bookNum: "93.d", type: "normal", ruleId: "R2", raw: "Time and tide ________ (wait) for none.", ans: "wait", bn: "সময় ও স্রোত কারো জন্য অপেক্ষা করে না। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R13 (প্রবাদ বাক্য): চিরন্তন প্রবাদ বাক্য 'Time and tide wait for none'-এ দুটি ভিন্ন সত্তা বোঝাতে ঐতিহ্যগতভাবে [wait] বসে!</strong>"},
    {id: 428, bookNum: "93.e", type: "normal", ruleId: "R11", raw: "While ________ (read) a book, I saw a picture of an ox.", ans: "reading", bn: "বই পড়ার সময়, আমি একটি ষাঁড়ের ছবি দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While'-এর ঠিক পরেই কোনো Subject না থাকায় সরাসরি [V1 + ing = reading] বসেছে!</strong>"},
    {id: 429, bookNum: "94.a", type: "normal", ruleId: "R2", raw: "The sun ________ (rise) in the east.", ans: "rises", bn: "সূর্য পূর্ব দিকে উদিত হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য): চিরন্তন সত্য বাক্য সর্বদা Present Indefinite হয় এবং 'The sun' সিঙ্গুলার হওয়ায় [rises] বসেছে!</strong>"},
    {id: 430, bookNum: "94.b", type: "normal", ruleId: "R2", raw: "The wearer best knows where the shoe ________ (pinch),", ans: "pinches", bn: "যার ফুস্কা সে-ই জানে জুতো কোথায় কামড়ায়। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (প্রবাদ বাক্য): এটি একটি চিরন্তন প্রবাদ বাক্য এবং সাবজেক্ট 'the shoe' (3rd Person Singular) হওয়ায় ভার্বের সাথে es যুক্ত হয়ে [pinches] বসেছে!</strong>"},
    {id: 431, bookNum: "94.c", type: "normal", ruleId: "R12", raw: "It is high time you ________ (do) it.", ans: "did", bn: "এটাই উপযুক্ত সময় তোমার এটি করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (you)' থাকলে পরবর্তী মূল ভার্ব সর্বদা Past Form [V2 = did] হয়!</strong>"},
    {id: 432, bookNum: "94.d", type: "normal", ruleId: "R13", raw: "The condition of flood victims ________ (beggar) description.", ans: "beggars", bn: "বন্যাদুর্গতদের অবস্থা বর্ণনা অতীত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের আসল সাবজেক্ট 'The condition' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [beggars] হয়েছে!</strong>"},
    {id: 433, bookNum: "95.a", type: "normal", ruleId: "R2", raw: "Traffic jam ________ (mean) blockade of vehicles.", ans: "means", bn: "যানজট মানেই যানবাহনের অবরুদ্ধ অবস্থা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (সাধারণ সত্য): যানজটের সাধারণ সংজ্ঞা বোঝাতে এবং সাবজেক্ট 'Traffic jam' সিঙ্গুলার হওয়ায় [means] বসেছে!</strong>"},
    {id: 434, bookNum: "95.b", type: "normal", ruleId: "R13", raw: "The increasing number of vehicles ________ (be) creating this problem.", ans: "is", bn: "যানবাহনের ক্রমবর্ধমান সংখ্যাই এই সমস্যাটি তৈরি করছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (The number of vs A number of): 'of'-এর আগে 'The increasing number' (একবচন) থাকায় সর্বদা Singular Verb [is] বসে!</strong>"},
    {id: 435, bookNum: "95.c", type: "normal", ruleId: "R1", raw: "However, this problem can ________ (solve) by taking some steps.", ans: "be solved", bn: "যাই হোক, কিছু পদক্ষেপ নেওয়ার মাধ্যমে এই সমস্যার সমাধান করা যেতে পারে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): সমস্যা নিজে সমাধান হয় না, পদক্ষেপ নেওয়ার মাধ্যমে সমাধান করা হয় (Passive), তাই Modal 'can'-এর পর [be + V3 (be solved)] বসেছে!</strong>"},
    {id: 436, bookNum: "95.d", type: "normal", ruleId: "R2", raw: "The authority ________ (impose) the traffic rules strictly.", ans: "imposes / should impose", bn: "কর্তৃপক্ষ ট্রাফিক নিয়মগুলো কঠোরভাবে আরোপ করে / করা উচিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 & R13: 'The authority' সিঙ্গুলার সাবজেক্ট হওয়ায় সাধারণ বর্তমানে ভার্বের সাথে s যুক্ত হয়ে [imposes] বসেছে!</strong>"},
    {id: 437, bookNum: "95.e", type: "normal", ruleId: "R6", raw: "By ________ (implement) some actions we can reduce the problem.", ans: "implementing", bn: "কিছু পদক্ষেপ বাস্তবায়নের মাধ্যমে আমরা এই সমস্যাটি কমিয়ে আনতে পারি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): যেকোনো Preposition (এখানে 'By')-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing = implementing] বসে!</strong>"},
    
    // --- 🔥 বিগত সালের প্রশ্নাবলি (Previous Years Questions) 🔥 ---
    {id: 447, bookNum: "Prev-01", type: "previous", ruleId: "R13", raw: "Five miles ________ (to be) too far to walk.", ans: "is", bn: "পাঁচ মাইল হাঁটার জন্য অনেক বেশি দূর।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - দূরত্ব): একক দূরত্ব (Five miles) দেখতে বহুবচন হলেও সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 448, bookNum: "Prev-02", type: "previous", ruleId: "R13", raw: "The page of the book ________ (be) torn.", ans: "is", bn: "বইটির পাতাটি ছেঁড়া।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের শব্দ (The page - একবচন) অনুযায়ী সিঙ্গুলার ভার্ব [is] বসেছে!</strong>"},
    {id: 449, bookNum: "Prev-03", type: "previous", ruleId: "R9", raw: "Had I been a poet, I ________ (write) a book of poems.", ans: "would have written", bn: "আমি যদি কবি হতাম, তবে একটি কবিতার বই লিখতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): শুরুতে 'Had + Sub + V3 (Had I been)' থাকলে অপর অংশে সর্বদা [would / could / might have + V3 (would have written)] বসে!</strong>"},
    {id: 450, bookNum: "Prev-04", type: "previous", ruleId: "R12", raw: "I got the book ________ (print).", ans: "printed", bn: "আমি বইটি ছাপিয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তুবাচক Object (the book)' থাকলে পরের ভার্ব সর্বদা [V3 = printed] হয়!</strong>"},
    {id: 451, bookNum: "Prev-05", type: "previous", ruleId: "R1", raw: "The event will be ________ (telecast) tomorrow.", ans: "telecast", bn: "অনুষ্ঠানটি আগামীকাল সম্প্রচার করা হবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): 'will be'-এর পর V3 বসে এবং 'telecast, broadcast, cut, put, read' ভার্বগুলোর V1, V2, V3 তিনটি রূপই এক [telecast]!</strong>"},
    {id: 452, bookNum: "Prev-06", type: "previous", ruleId: "R1", raw: "Sugar is ________ (import) from Brazil.", ans: "imported", bn: "ব্রাজিল থেকে চিনি আমদানি করা হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): চিনি নিজে আমদানি হতে পারে না, মানুষের দ্বারা আমদানি করা হয় (Passive), তাই 'is'-এর পর [V3 = imported] বসেছে!</strong>"},
    {id: 453, bookNum: "Prev-07", type: "previous", ruleId: "R1", raw: "I have never ________ (see) the Himalayas.", ans: "seen", bn: "আমি কখনো হিমালয় দেখিনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Have Verbs): বাক্যে 'have' দেওয়াই থাকায় মূল ভার্ব (see)-এর ৩য় রূপ [V3 = seen] বসেছে!</strong>"},
    {id: 454, bookNum: "Prev-08", type: "previous", ruleId: "R12", raw: "It is high time we ________ (give up) smoking.", ans: "gave up", bn: "এটাই উপযুক্ত সময় আমাদের ধূমপান ছেড়ে দেওয়ার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (we)' থাকলে ভার্বের Past Form [V2 = gave up] বসে!</strong>"},
    {id: 455, bookNum: "Prev-09", type: "previous", ruleId: "R10", raw: "As soon as he saw me, he ________ (flee) away.", ans: "fled", bn: "আমাকে দেখা মাত্রই সে পালিয়ে গেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - As soon as): [V2 ⟷ As soon as ⟷ V2] — প্রথম অংশে Past (saw) থাকায় পরের অংশেও Past Form [V2 = fled] বসেছে!</strong>"},
    {id: 456, bookNum: "Prev-10", type: "previous", ruleId: "R12", raw: "I wish I ________ (be) in the occasion.", ans: "were", bn: "আমি যদি ওই অনুষ্ঠানে উপস্থিত থাকতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish'-এর পর ব্র্যাকেটে (be) থাকলে সর্বদা [were] বসে!</strong>"},
    {id: 457, bookNum: "Prev-11", type: "previous", ruleId: "R1", raw: "Bengali ________ (speak) in Calcutta also.", ans: "is spoken", bn: "কলকাতাতেও বাংলা ভাষা বলা হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): বাংলা ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয় (Passive), তাই [is spoken] বসেছে!</strong>"},
    {id: 458, bookNum: "Prev-12", type: "previous", ruleId: "R11", raw: "Two years ________ (pass) since he left home.", ans: "have passed", bn: "সে বাড়ি ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর ডান পাশে V2 (left) থাকলে বাম পাশে Present Perfect [have passed] বসে!</strong>"},
    {id: 459, bookNum: "Prev-13", type: "previous", ruleId: "R8", raw: "The statement needs to ________ by Sunday. (submit)", ans: "be submitted", bn: "বিবৃতিটি রোববারের মধ্যে জমা দেওয়া প্রয়োজন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Passive): বিবৃতি নিজে জমা হতে পারে না (Passive), তাই 'needs to'-এর পর [be + V3 (be submitted)] বসেছে!</strong>"},
    {id: 460, bookNum: "Prev-14", type: "previous", ruleId: "R1", raw: "Why didn't you ________ (threw) the bag away?", ans: "throw", bn: "তুমি কেন ব্যাগটি ফেলে দিলে না?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs): বাক্যে 'did / didn't' থাকলে মূল ভার্বের কখনোই Past Form বসে না, সর্বদা আসল রূপ [V1 = throw] বসে!</strong>"},
    {id: 461, bookNum: "Prev-15", type: "previous", ruleId: "R2", raw: "She usually ________ (visit) her parents on Fridays.", ans: "visits", bn: "সে সাধারণত শুক্রবারগুলোতে তার বাবা-মায়ের সাথে দেখা করতে যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'usually' থাকায় Present Indefinite (visits) হয়েছে!</strong>"},
    {id: 462, bookNum: "Prev-16", type: "previous", ruleId: "R7", raw: "I enjoy ________ (write) stories for children.", ans: "writing", bn: "আমি শিশুদের জন্য গল্প লিখতে পছন্দ করি/উপভোগ করি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Emotion & Preference): 'enjoy'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = writing] বসে!</strong>"},
    {id: 463, bookNum: "Prev-17", type: "previous", ruleId: "R2", raw: "A good man always ________ (help) his neighbors.", ans: "helps", bn: "একজন ভালো মানুষ সবসময় তার প্রতিবেশীদের সাহায্য করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'always' থাকায় এবং সাবজেক্ট সিঙ্গুলার হওয়ায় [helps] বসেছে!</strong>"},
    {id: 464, bookNum: "Prev-18", type: "previous", ruleId: "R3", raw: "They ________ (play) at this moment.", ans: "are playing", bn: "তারা এই মুহূর্তে খেলছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'at this moment' থাকায় Present Continuous [are playing] বসেছে!</strong>"},
    {id: 465, bookNum: "Prev-19", type: "previous", ruleId: "R5", raw: "I ________ (see) a bird yesterday.", ans: "saw", bn: "গতকাল আমি একটি পাখি দেখেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'yesterday' থাকায় সরাসরি [V2 = saw] বসেছে!</strong>"},
    {id: 466, bookNum: "Prev-20", type: "previous", ruleId: "R12", raw: "Fahim walked quickly lest he ________ (miss) the train.", ans: "should miss", bn: "ফাহিম দ্রুত হেঁটেছিল পাছে সে ট্রেনটি মিস না করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Warning - Lest): বাক্যে 'lest' থাকলে Subject-এর পর সর্বদা [should + V1 (should miss)] বসে!</strong>"},
    {id: 467, bookNum: "Prev-21", type: "previous", ruleId: "R12", raw: "Would that I ________ (know) the answer to this question.", ans: "could know", bn: "আমি যদি এই প্রশ্নের উত্তরটি জানতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): বাক্যের শুরুতে 'Would that' থাকলে Subject-এর পর সর্বদা [could + V1 (could know)] বসে!</strong>"},
    {id: 468, bookNum: "Prev-22", type: "previous", ruleId: "R10", raw: "The doctor ________ (die) in his chamber before the patient ________ (come).", ans: "had died, came", bn: "রোগী আসার পূর্বেই ডাক্তার তাঁর চেম্বারে মারা গিয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3 (had died)] এবং before-এর পরে [V2 (came)] বসে!</strong>"},
    {id: 469, bookNum: "Prev-23", type: "previous", ruleId: "R11", raw: "He speaks as if he ________ (know) everything.", ans: "knew", bn: "সে এমনভাবে কথা বলে যেন সে সবকিছুই জানে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As if): 'as if'-এর বাম পাশে Present (speaks) থাকলে ডান পাশে Past Indefinite [V2 = knew] বসে!</strong>"},
    {id: 470, bookNum: "Prev-24", type: "previous", ruleId: "R7", raw: "Would you mind ________ (open) the window?", ans: "opening", bn: "আপনি কি দয়া করে জানালাটি খুলে দেবেন?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind' থাকলে পরের ভার্বের সাথে সর্বদা [V1 + ing = opening] বসে!</strong>"},
    {id: 471, bookNum: "Prev-25", type: "previous", ruleId: "R9", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + had + noun] থাকায় ডান পাশে [would open] বসেছে!</strong>"},
    {id: 472, bookNum: "Prev-26", type: "previous", ruleId: "R13", raw: "One of the students ________ (be) absent yesterday.", ans: "was", bn: "ছাত্রদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R5 (Always Singular + Past): 'One of' সর্বদা Singular এবং 'yesterday' থাকায় [was] বসেছে!</strong>"},
    {id: 473, bookNum: "Prev-27", type: "previous", ruleId: "R6", raw: "I went to my village home with a view to ________ (meet) my grandmother.", ans: "meeting", bn: "আমি আমার দাদীর সাথে দেখা করার উদ্দেশ্যে আমার গ্রামের বাড়িতে গিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = meeting] বসে!</strong>"},
    {id: 474, bookNum: "Prev-28", type: "previous", ruleId: "R8", raw: "To ________ (read) a book is pleasing; but to select what ________ (read) is difficult.", ans: "read, to read", bn: "বই পড়া আনন্দদায়ক; কিন্তু কী পড়তে হবে তা নির্বাচন করা কঠিন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers): ১ম শূন্যস্থানের আগে 'To' দেওয়াই আছে তাই [V1 = read] এবং ২য় শূন্যস্থানে 'what + to + V1' সূত্র অনুযায়ী [to read] বসেছে!</strong>"},
    {id: 475, bookNum: "Prev-29", type: "previous", ruleId: "R7", raw: "A ________ (roll) stone gathers no moss.", ans: "rolling", bn: "চলমান পাথরে শ্যাওলা জমে না। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Present Participle Adjective): কোনো Noun (stone)-এর ঠিক আগে চলমান অবস্থা বোঝাতে ভার্বের সাথে ing যুক্ত হয়ে [rolling] বসেছে!</strong>"},
    {id: 476, bookNum: "Prev-30", type: "previous", ruleId: "R13", raw: "Neither he nor his friends ________ (attend) the function.", ans: "have attended", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'Neither...nor' থাকলে ২য় Subject (his friends - বহুবচন) অনুযায়ী Plural Verb [have attended] বসে!</strong>"},
    {id: 477, bookNum: "Prev-31", type: "previous", ruleId: "R10", raw: "The patient ________ (die) before the doctor came.", ans: "had died", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে সর্বদা Past Perfect [had + V3 = had died] বসে!</strong>"},
    {id: 478, bookNum: "Prev-32", type: "previous", ruleId: "R5", raw: "It ________ (rain) since morning.", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since morning' থাকায় [has been raining] বসেছে!</strong>"},
    {id: 479, bookNum: "Prev-33", type: "previous", ruleId: "R9", raw: "If I were a bird, I ________ (fly) in the sky.", ans: "would fly", bn: "আমি যদি পাখি হতাম, তবে আকাশে উড়ে বেড়াতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + were] থাকায় ডান পাশে [would fly] বসেছে!</strong>"},
    {id: 480, bookNum: "Prev-34", type: "previous", ruleId: "R12", raw: "It is high time we ________ (change) our food habit.", ans: "changed", bn: "এটাই উপযুক্ত সময় আমাদের খাদ্যাভ্যাস পরিবর্তন করার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (we)' থাকলে পরবর্তী ভার্বের Past Form [V2 = changed] বসে!</strong>"},
    {id: 481, bookNum: "Prev-35", type: "previous", ruleId: "R7", raw: "I saw the boy ________ (cry) in the room.", ans: "crying", bn: "আমি ছেলেটিকে ঘরের ভেতর কাঁদতে দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'saw'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing = crying] বসে!</strong>"},
    {id: 482, bookNum: "Prev-36", type: "previous", ruleId: "R6", raw: "He is addicted to ________ (gamble).", ans: "gambling", bn: "সে জুয়া খেলায় আসক্ত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'addicted to, accustomed to, used to, look forward to'-এর পর সর্বদা [V1 + ing = gambling] বসে!</strong>"},
    {id: 483, bookNum: "Prev-37", type: "previous", ruleId: "R9", raw: "If you had invited me, I ________ (join) the party.", ans: "would have joined", bn: "তুমি যদি আমাকে আমন্ত্রণ জানাতে, তবে আমি পার্টিতে যোগ দিতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাম পাশে [If + had + V3 (had invited)] থাকায় ডান পাশে [would have joined] বসেছে!</strong>"},
    {id: 484, bookNum: "Prev-38", type: "previous", ruleId: "R13", raw: "Slow and steady ________ (win) the race.", ans: "wins", bn: "ধীর ও স্থির ব্যক্তিই জয়লাভ করে। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R2 (Single Idea + প্রবাদ): 'Slow and steady' দ্বারা একটি একক গুণ বা ধারণা বোঝায়, তাই Singular Verb [wins] বসেছে!</strong>"},
    {id: 485, bookNum: "Prev-39", type: "previous", ruleId: "R11", raw: "While he ________ (cross) the road, a bus hit him.", ans: "was crossing", bn: "যখন সে রাস্তা পার হচ্ছিল, তখন একটি বাস তাকে ধাক্কা দিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (he)' থাকায় অতীতে চলমান কাজে [was crossing] বসেছে!</strong>"},
    {id: 486, bookNum: "Prev-40", type: "previous", ruleId: "R1", raw: "You had better ________ (leave) the place right now.", ans: "leave", bn: "তোমার বরং এই মুহূর্তেই স্থানটি ত্যাগ করা ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'had better'-এর ঠিক পরেই সর্বদা মূল ভার্বের আসল রূপ [V1 = leave] বসে!</strong>"},
    {id: 487, bookNum: "Prev-41", type: "previous", ruleId: "R4", raw: "Have you ever ________ (be) to Cox's Bazar?", ans: "been", bn: "তুমি কি কখনো কক্সবাজার গিয়েছ?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 & R1 (Raj-Ley + Have Verb): বাক্যে 'Have' এবং 'ever' থাকায় ব্র্যাকেটের (be) ভার্বের ৩য় রূপ [V3 = been] বসেছে!</strong>"},
    {id: 488, bookNum: "Prev-42", type: "previous", ruleId: "R12", raw: "The teacher let the students ________ (go) home early.", ans: "go", bn: "শিক্ষক ছাত্রদেরকে তাড়াতাড়ি বাড়ি যেতে দিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'let / make + ব্যক্তি (the students)' থাকলে পরের ভার্বের আগে কখনো 'to' বসে না, সরাসরি [V1 = go] বসে!</strong>"},
    {id: 489, bookNum: "Prev-43", type: "previous", ruleId: "R13", raw: "Rifat as well as his parents ________ gone to London to spend the weekend.", ans: "has", bn: "তার বাবা-মায়ের পাশাপাশি রিফাতও সপ্তাহান্ত কাটাতে লন্ডনে গিয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'as well as, together with, along with' থাকলে ১ম কর্তা (Rifat - একবচন) অনুযায়ী সিঙ্গুলার ভার্ব [has] বসে!</strong>"},
    {id: 490, bookNum: "Prev-44", type: "previous", ruleId: "R7", raw: "I could not help ________ (laugh) at his joke.", ans: "laughing", bn: "তার কৌতুক শুনে আমি না হেসে পারলাম না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'cannot help / could not help'-এর ঠিক পরেই সর্বদা [V1 + ing = laughing] বসে!</strong>"},
    {id: 491, bookNum: "Prev-45", type: "previous", ruleId: "R10", raw: "No sooner had we ________ (reach) the station than the train left.", ans: "reached", bn: "আমরা স্টেশনে পৌঁছাতে না পৌঁছাতেই ট্রেনটি ছেড়ে দিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): 'No sooner had' দেওয়াই থাকায় মূল ভার্বের ৩য় রূপ [V3 = reached] বসেছে!</strong>"},
    {id: 492, bookNum: "Prev-46", type: "previous", ruleId: "R1", raw: "The thief was ________ (catch) red-handed.", ans: "caught", bn: "চোরটিকে হাতেনাতে ধরা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Be Verb - Passive Voice): চোর নিজে নিজেকে ধরেনি, অন্যের দ্বারা ধরা হয়েছিল (Passive), তাই 'was'-এর পর [V3 = caught] বসেছে!</strong>"},
    {id: 493, bookNum: "Prev-47", type: "previous", ruleId: "R6", raw: "Without ________ (work) hard, you cannot prosper in life.", ans: "working", bn: "কঠোর পরিশ্রম করা ছাড়া তুমি জীবনে উন্নতি করতে পারবে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): 'By / Without'-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing = working] বসে!</strong>"},
    {id: 494, bookNum: "Prev-48", type: "previous", ruleId: "R5", raw: "Columbus ________ (discover) America in 1492.", ans: "discovered", bn: "কলম্বাস ১৪৯২ সালে আমেরিকা আবিষ্কার করেছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট - Past Year): অতীতের সাল (in 1492) উল্লেখ থাকায় সরাসরি Past Indefinite [V2 = discovered] বসেছে!</strong>"},
    {id: 495, bookNum: "Prev-49", type: "previous", ruleId: "R13", raw: "The quality of the mangoes ________ (be) not good.", ans: "was / is", bn: "আমগুলোর গুণগত মান ভালো ছিল না / নয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Preposition 'of'-এর নিয়ম): 'of'-এর আগের আসল সাবজেক্ট 'The quality' (একবচন) অনুযায়ী Singular Verb [was / is] বসে!</strong>"},
    {id: 496, bookNum: "Prev-50", type: "previous", ruleId: "R9", raw: "Unless you ________ (read) attentively, you will fail.", ans: "read", bn: "যদি তুমি মনোযোগ দিয়ে না পড়ো, তবে তুমি ফেল করবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Step 1): ডান পাশে Future (will fail) থাকায় 'Unless' যুক্ত অংশে Present Indefinite [V1 = read] বসেছে!</strong>"},
    {id: 497, bookNum: "Prev-51", type: "previous", ruleId: "R8", raw: "I am sorry ________ (disturb) you.", ans: "to disturb", bn: "তোমাকে বিরক্ত করার জন্য আমি দুঃখিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19 Adjectives): অনুভূতিবাচক Adjective (sorry, glad, happy, surprised, easy, difficult)-এর পর ভার্ব আসলে সর্বদা [to + V1 (to disturb)] বসে!</strong>"},
    {id: 498, bookNum: "Prev-52", type: "previous", ruleId: "R7", raw: "The book is worth ________ (read).", ans: "reading", bn: "বইটি পড়ার যোগ্য / মূল্যবান।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind, cannot help, feel like, worth'—এদের ঠিক পরেই সর্বদা [V1 + ing = reading] বসে!</strong>"},
    {id: 499, bookNum: "Prev-53", type: "previous", ruleId: "R13", raw: "Everybody ________ (love) flowers.", ans: "loves", bn: "প্রত্যেকেই ফুল ভালোবাসে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'Everybody, everyone, somebody, nobody' সর্বদা Singular, তাই ভার্বের সাথে s যুক্ত হয়ে [loves] বসেছে!</strong>"},
    {id: 500, bookNum: "Prev-54", type: "previous", ruleId: "R10", raw: "He came home after the sun ________ (set).", ans: "had set", bn: "সূর্য অস্ত যাওয়ার পর সে বাড়ি এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (After-এর ছন্দ): 'After'-এর আগে V2 (came) থাকায় after-এর পরে সর্বদা Past Perfect [had + V3 = had set] বসে!</strong>(set-এর তিনটি রূপই set)।"},
    {id: 501, bookNum: "Prev-55", type: "previous", ruleId: "R2", raw: "Water ________ (boil) at 100 degrees Celsius.", ans: "boils", bn: "পানি ১০০ ডিগ্রি সেলসিয়াস তাপমাত্রায় ফোটে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (বৈজ্ঞানিক চিরন্তন সত্য): চিরন্তন সত্য বাক্য Present Indefinite হয় এবং 'Water' আনকাউন্টেবল সিঙ্গুলার হওয়ায় [boils] বসেছে!</strong>"},
    {id: 502, bookNum: "Prev-56", type: "previous", ruleId: "R8", raw: "He promised ________ (help) me in danger.", ans: "to help", bn: "সে বিপদে আমাকে সাহায্য করার প্রতিশ্রুতি দিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'promise, want, decide, fail, hope, refuse'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to help)] বসে!</strong>"},
    {id: 503, bookNum: "Prev-57", type: "previous", ruleId: "R3", raw: "Look! The birds ________ (fly) in the sky.", ans: "are flying", bn: "দেখো! পাখিগুলো আকাশে উড়ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (Direct Command Alert!): বাক্যে 'Look! / Listen! / Keep silent!' থাকলে কাজটি চোখের সামনে চলছে বোঝায়, তাই [are flying] বসেছে!</strong>"},
    {id: 504, bookNum: "Prev-58", type: "previous", ruleId: "R13", raw: "Physics ________ (be) my favorite subject.", ans: "is", bn: "পদার্থবিজ্ঞান আমার প্রিয় বিষয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI): বিষয়ের নামের শেষে 's' থাকলেও (Physics, Mathematics, Economics) এটি একক বিষয় হওয়ায় সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 505, bookNum: "Prev-59", type: "previous", ruleId: "R1", raw: "A bridge is ________ (build) over the river now.", ans: "being built", bn: "এখন নদীর ওপর একটি সেতু নির্মাণ করা হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R3 (Present Continuous Passive): বাক্যে 'now' আছে এবং সেতু নিজে তৈরি হতে পারে না (অন্যের দ্বারা নির্মিত হচ্ছে), তাই 'is'-এর পর [being + V3 (being built)] বসেছে!</strong>"},
    {id: 506, bookNum: "Prev-60", type: "previous", ruleId: "R7", raw: "He avoided ________ (make) the same mistake.", ans: "making", bn: "সে একই ভুল করা এড়িয়ে চলল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Gerund Triggers): 'avoid, keep, regret, enjoy, stop, finish'-এর পর ভার্ব আসলে সর্বদা [V1 + ing = making] বসে!</strong>"},
    {id: 507, bookNum: "Prev-61", type: "previous", ruleId: "R11", raw: "It was long since I ________ (see) her last.", ans: "had seen", bn: "অনেক দিন হয়ে গিয়েছিল আমি তাকে শেষ দেখেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর বাম পাশে Past (It was) থাকলে ডান পাশে সর্বদা Past Perfect [had + V3 (had seen)] বসে!</strong>"},
    {id: 508, bookNum: "Prev-62", type: "previous", ruleId: "R12", raw: "I had the boy ________ (wash) my car.", ans: "wash", bn: "আমি ছেলেটিকে দিয়ে আমার গাড়িটি ধুইয়ে নিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'have / had / make / let + ব্যক্তি (the boy)' থাকলে পরের ভার্বের Base Form [V1 = wash] বসে!</strong>(বস্তু থাকলে V3 হয়, ব্যক্তি থাকলে V1 হয়)।"},
    {id: 509, bookNum: "Prev-63", type: "previous", ruleId: "R4", raw: "He ________ (not return) home yet.", ans: "has not returned", bn: "সে এখনও বাড়ি ফেরেনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'yet' থাকলে নেগেটিভ Present Perfect [have / has not + V3 (has not returned)] বসে!</strong>"},
    {id: 510, bookNum: "Prev-64", type: "previous", ruleId: "R7", raw: "I regret ________ (spend) so much money.", ans: "spending", bn: "আমি এত টাকা খরচ করার জন্য অনুশোচনা করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Gerund Triggers): 'regret, avoid, keep, enjoy, mind'-এর পর ভার্বের সাথে সর্বদা [V1 + ing = spending] বসে!</strong>"},
    {id: 511, bookNum: "Prev-65", type: "previous", ruleId: "R8", raw: "We were surprised ________ (hear) the news.", ans: "to hear", bn: "খবরটি শুনে আমরা অবাক হয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19 Adjectives): অনুভূতিবাচক Adjective (surprised, sorry, glad, happy)-এর পর সর্বদা [to + V1 (to hear)] বসে!</strong>"},
    {id: 512, bookNum: "Prev-66", type: "previous", ruleId: "R13", raw: "Ten thousand taka ________ (be) a big amount.", ans: "is", bn: "দশ হাজার টাকা একটি বড় অঙ্ক।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - পরিমাণ/টাকা): নির্দিষ্ট টাকার পরিমাণ (Ten thousand taka) একক সমষ্টি নির্দেশ করায় সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 513, bookNum: "Prev-67", type: "previous", ruleId: "R8", raw: "She decided ________ (leave) the job.", ans: "to leave", bn: "সে চাকরিটি ছেড়ে দেওয়ার সিদ্ধান্ত নিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'decide, want, hope, promise, fail'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to leave)] বসে!</strong>"},
    {id: 514, bookNum: "Prev-68", type: "previous", ruleId: "R7", raw: "Keep ________ (try) until you succeed.", ans: "trying", bn: "সফল না হওয়া পর্যন্ত চেষ্টা চালিয়ে যাও।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception): 'keep, start, stop, avoid'-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing = trying] বসে!</strong>"},
    {id: 515, bookNum: "Prev-69", type: "previous", ruleId: "R1", raw: "Trees should not ________ (cut) down at random.", ans: "be cut", bn: "নির্বিচারে গাছ কাটা উচিত নয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): গাছ নিজে নিজেকে কাটে না (Passive), তাই 'should not'-এর পর [be + V3 (be cut)] বসেছে!</strong>(cut-এর ৩টি রূপই cut)।"},
    {id: 516, bookNum: "Prev-70", type: "previous", ruleId: "R2", raw: "He seldom ________ (visit) our house.", ans: "visits", bn: "সে আমাদের বাড়িতে কদাচিৎ আসে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল): বাক্যে 'seldom, sometimes, always, often' থাকলে Present Indefinite হয় এবং 'He' সিঙ্গুলার হওয়ায় [visits] বসেছে!</strong>"},
    {id: 517, bookNum: "Prev-71", type: "previous", ruleId: "R6", raw: "She is fond of ________ (listen) to music.", ans: "listening", bn: "সে গান শুনতে খুব পছন্দ করে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশন 'of'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = listening] যুক্ত হয়!</strong>"},
    {id: 518, bookNum: "Prev-72", type: "previous", ruleId: "R13", raw: "To walk in the morning ________ (be) good for health.", ans: "is", bn: "সকালে হাঁটা স্বাস্থ্যের জন্য ভালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - Infinitive Subject): বাক্যের শুরুতে Infinitive (To + V1 = To walk) সাবজেক্ট হিসেবে বসলে সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 519, bookNum: "Prev-73", type: "previous", ruleId: "R11", raw: "He speaks as if he ________ (be) mad.", ans: "were", bn: "সে এমনভাবে কথা বলে যেন সে পাগল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As if): 'as if'-এর বাম পাশে Present (speaks) এবং ডান পাশে ব্র্যাকেটে (be) থাকলে যেকোনো Subject-এর পরেই সর্বদা [were] বসে!</strong>"},
    {id: 520, bookNum: "Prev-74", type: "previous", ruleId: "R9", raw: "If you heat ice, it ________ (melt).", ans: "melts", bn: "তুমি যদি বরফে তাপ দাও, তবে তা গলে যায়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 & R2 (Zero Conditional / Scientific Truth): বৈজ্ঞানিক সত্য শর্ত বোঝালে উভয় অংশেই Present Indefinite হয়, তাই 'it'-এর পর [melts] বসেছে!</strong>"},
    {id: 521, bookNum: "Prev-75", type: "previous", ruleId: "R8", raw: "English is not difficult ________ (learn).", ans: "to learn", bn: "ইংরেজি শেখা কঠিন নয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19 Adjectives): 'easy, difficult, hard, impossible, happy, sorry'-এর পর সর্বদা [to + V1 (to learn)] বসে!</strong>"},
    {id: 522, bookNum: "Prev-76", type: "previous", ruleId: "R1", raw: "He might have ________ (hear) the name of Kazi Nazrul Islam.", ans: "heard", bn: "সে হয়তো কাজী নজরুল ইসলামের নাম শুনে থাকবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals - Perfect Form): [Modal + have] (might have, could have, should have, must have) দেওয়াই থাকলে এর ঠিক পরেই সর্বদা মূল ভার্বের ৩য় রূপ [V3 = heard] বসে!</strong>"},
	// =======================================================
    // Part 6: Question 501 to 600 (ID: 523 to 622 - Final Part)
    // =======================================================
    {id: 523, bookNum: "Prev-77", type: "previous", ruleId: "R6", raw: "He is capable of ________ (do) the work alone.", ans: "doing", bn: "সে একাই কাজটি করতে সক্ষম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশন 'of'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = doing] যুক্ত হয়!</strong>"},
    {id: 524, bookNum: "Prev-78", type: "previous", ruleId: "R11", raw: "She spoke as if she ________ (be) a philosopher.", ans: "had been", bn: "সে এমনভাবে কথা বলল যেন সে একজন দার্শনিক ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As if): 'as if'-এর বাম পাশে Past [V2 = spoke] এবং ডান পাশে ব্র্যাকেটে (be) থাকলে সর্বদা [had been] বসে!</strong>"},
    {id: 525, bookNum: "Prev-79", type: "previous", ruleId: "R13", raw: "Either you or he ________ (be) to blame.", ans: "is", bn: "হয় তুমি অথবা সে এটার জন্য দায়ী।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'Either...or' থাকলে ২য় কর্তা (he - একবচন) অনুযায়ী Singular Verb [is] বসে!</strong>"},
    {id: 526, bookNum: "Prev-80", type: "previous", ruleId: "R12", raw: "It is time we ________ (return) home.", ans: "returned", bn: "এটাই উপযুক্ত সময় আমাদের বাড়ি ফেরার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is time + Subject (we)' থাকলে পরবর্তী মূল ভার্ব সর্বদা Past Form [V2 = returned] হয়!</strong>"},
    {id: 527, bookNum: "Prev-81", type: "previous", ruleId: "R9", raw: "Had you told me earlier, I ________ (help) you.", ans: "would have helped", bn: "তুমি যদি আমাকে আগে বলতে, তবে আমি তোমাকে সাহায্য করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাক্যের শুরুতে 'Had + Sub + V3 (Had you told)' থাকায় অপর অংশে [would have + V3 (would have helped)] বসেছে!</strong>"},
    {id: 528, bookNum: "Prev-82", type: "previous", ruleId: "R7", raw: "I heard the baby ________ (cry) for food.", ans: "crying", bn: "আমি শিশুটিকে খাবারের জন্য কাঁদতে শুনলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Action & Perception - ২য় ভার্ব): সরল বাক্যে 'see, hear/heard, find'-এর পর ২য় ভার্ব আসলে চলমান কাজ বোঝাতে [V1 + ing = crying] বসে!</strong>"},
    {id: 529, bookNum: "Prev-83", type: "previous", ruleId: "R5", raw: "We ________ (live) in this house since 2015.", ans: "have been living", bn: "আমরা ২০১৫ সাল থেকে এই বাড়িতে বসবাস করছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since + নির্দিষ্ট সাল (2015)' থাকায় [have been living] বসেছে!</strong>"},
    {id: 530, bookNum: "Prev-84", type: "previous", ruleId: "R1", raw: "The letter ________ (post) yesterday.", ans: "was posted", bn: "চিঠিটি গতকাল পোস্ট করা হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R5 (Past Passive): চিঠি নিজে নিজেকে পোস্ট করতে পারে না (Passive) এবং 'yesterday' থাকায় সিঙ্গুলার সাবজেক্ট অনুযায়ী [was posted] বসেছে!</strong>"},
    {id: 531, bookNum: "Prev-85", type: "previous", ruleId: "R8", raw: "He wants me ________ (do) the work.", ans: "to do", bn: "সে চায় আমি যেন কাজটি করি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'want, advise, ask, expect, beg'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to do)] বসে!</strong>"},
    {id: 532, bookNum: "Prev-86", type: "previous", ruleId: "R13", raw: "The rich ________ (be) not always happy.", ans: "are", bn: "ধনীরা সবসময় সুখী হয় না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Plural - The + Adjective): 'The rich, the poor, the brave, the pious' দ্বারা পুরো জাতিকে বোঝায় বলে সর্বদা Plural Verb [are] বসে!</strong>"},
    {id: 533, bookNum: "Prev-87", type: "previous", ruleId: "R6", raw: "He is used to ________ (work) hard.", ans: "working", bn: "সে কঠোর পরিশ্রম করায় অভ্যস্ত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'be used to (am/is/are/was/were used to)' থাকলে এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = working] বসে!</strong>"},
    {id: 534, bookNum: "Prev-88", type: "previous", ruleId: "R10", raw: "Scarcely had we reached the station ________ the train left.", ans: "when", bn: "আমরা স্টেশনে পৌঁছাতে না পৌঁছাতেই ট্রেনটি ছেড়ে দিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula - Scarcely/Hardly): 'No sooner had' থাকলে 'than' বসে, কিন্তু 'Scarcely had / Hardly had' থাকলে জোড়া শব্দ হিসেবে [when] বসে!</strong>"},
    {id: 535, bookNum: "Prev-89", type: "previous", ruleId: "R2", raw: "Honesty ________ (be) the best policy.", ans: "is", bn: "সততাই সর্বোত্তম পন্থা। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (প্রবাদ বাক্য): চিরন্তন প্রবাদ বাক্য সর্বদা Present Indefinite হয় এবং 'Honesty' সিঙ্গুলার হওয়ায় [is] বসেছে!</strong>"},
    {id: 536, bookNum: "Prev-90", type: "previous", ruleId: "R12", raw: "Walk fast lest you ________ (miss) the bus.", ans: "should miss", bn: "দ্রুত হাঁটো পাছে তুমি বাসটি মিস না করো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Warning - Lest): বাক্যে 'lest' থাকলে Subject-এর পর সর্বদা [should + V1 (should miss)] বসে!</strong>"},
    {id: 537, bookNum: "Prev-91", type: "previous", ruleId: "R4", raw: "I ________ (receive) your letter just now.", ans: "have received", bn: "আমি এইমাত্র তোমার চিঠি পেয়েছি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'just now' থাকায় চোখ বন্ধ করে Present Perfect [have received] বসেছে!</strong>"},
    {id: 538, bookNum: "Prev-92", type: "previous", ruleId: "R13", raw: "The headmaster and secretary ________ (be) present in the meeting.", ans: "is / was", bn: "প্রধান শিক্ষক এবং সম্পাদক (একই ব্যক্তি) সভায় উপস্থিত আছেন/ছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Single Person with One 'The'): প্রথম পদের আগে একটি মাত্র 'The' থাকায় একই ব্যক্তিকে বোঝাচ্ছে, তাই Singular Verb [is / was] বসেছে!</strong>(দুই পদের আগেই The থাকলে Plural হতো)।"},
    {id: 539, bookNum: "Prev-93", type: "previous", ruleId: "R7", raw: "She finished ________ (write) the letter.", ans: "writing", bn: "সে চিঠিটি লেখা শেষ করল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Start & Stop Words): 'finish, stop, start, give up, enjoy'-এর পর ২য় ভার্ব আসলে সর্বদা [V1 + ing = writing] বসে!</strong>"},
    {id: 540, bookNum: "Prev-94", type: "previous", ruleId: "R9", raw: "If you come, I ________ (go) with you.", ans: "will go", bn: "তুমি যদি আসো, তবে আমি তোমার সাথে যাবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Step 1): বাম পাশে [If + Present (come)] থাকায় ডান পাশে Future [will + V1 (will go)] বসেছে!</strong>"},
    {id: 541, bookNum: "Prev-95", type: "previous", ruleId: "R1", raw: "He did not ________ (phone) me last night.", ans: "phone", bn: "সে গত রাতে আমাকে ফোন করেনি।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs): বাক্যে 'did not' দেওয়াই থাকায় মূল ভার্বের আসল রূপ [V1 = phone] বসেছে!</strong>"},
    {id: 542, bookNum: "Prev-96", type: "previous", ruleId: "R13", raw: "A number of boys ________ (be) playing in the field.", ans: "are / were", bn: "অনেকগুলো ছেলে মাঠে খেলছে/খেলছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (A number of vs The number of): 'A number of' (অনেকগুলো) থাকলে সর্বদা Plural Verb [are / were] বসে!</strong>"},
    {id: 543, bookNum: "Prev-97", type: "previous", ruleId: "R13", raw: "The number of students in this class ________ (be) fifty.", ans: "is", bn: "এই ক্লাসে ছাত্রছাত্রীর সংখ্যা পঞ্চাশ জন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (The number of): 'The number of' দ্বারা নির্দিষ্ট একক সংখ্যা বোঝায়, তাই সর্বদা Singular Verb [is] বসে!</strong>"},
    {id: 544, bookNum: "Prev-98", type: "previous", ruleId: "R11", raw: "Do not get down from the bus while it ________ (run).", ans: "is running", bn: "বাসটি চলার সময় বাস থেকে নামবে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While with Imperative): বর্তমানের আদেশ বা নিষেধাজ্ঞা (Do not get down) থাকলে 'while + Subject'-এর পর Present Continuous [is running] বসে!</strong>"},
    {id: 545, bookNum: "Prev-99", type: "previous", ruleId: "R8", raw: "He is too weak ________ (walk).", ans: "to walk", bn: "সে এতই দুর্বল যে হাঁটতে পারে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19): 'too + adjective (weak)' থাকলে এবং সাবজেক্ট নিজেই কাজটি করবে বোঝালে [to + V1 (to walk)] বসে!</strong>"},
    {id: 546, bookNum: "Prev-100", type: "previous", ruleId: "R12", raw: "I got my hair ________ (cut) yesterday.", ans: "cut", bn: "আমি গতকাল আমার চুল কাটিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'got + বস্তু (my hair)' থাকায় cut-এর ৩য় রূপ [V3 = cut] বসেছে!</strong>(cut-এর তিনটি রূপই cut)।"},
    {id: 547, bookNum: "Prev-101", type: "previous", ruleId: "R6", raw: "They came here with a view to ________ (visit) the museum.", ans: "visiting", bn: "তারা জাদুঘরটি পরিদর্শনের উদ্দেশ্যে এখানে এসেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'with a view to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = visiting] বসে!</strong>"},
    {id: 548, bookNum: "Prev-102", type: "previous", ruleId: "R5", raw: "Once there ________ (live) a kind king in a country.", ans: "lived", bn: "একদা এক দেশে একজন দয়ালু রাজা বাস করতেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'Once' (একদা - অতীতের সংকেত) থাকায় সরাসরি Past Indefinite [V2 = lived] বসেছে!</strong>"},
    {id: 549, bookNum: "Prev-103", type: "previous", ruleId: "R1", raw: "Rice ________ (sell) cheap now.", ans: "is sold / sells", bn: "এখন চাল সস্তায় বিক্রি হচ্ছে/হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Passive / Quasi-Passive): চাল মানুষের দ্বারা বিক্রি হয় (Passive), তাই [is sold] অথবা Quasi-passive নিয়মে [sells] বসে!</strong>"},
    {id: 550, bookNum: "Prev-104", type: "previous", ruleId: "R7", raw: "I don't feel like ________ (eat) anything now.", ans: "eating", bn: "আমার এখন কিছু খেতে ইচ্ছে করছে না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'feel like'-এর ঠিক পরেই সর্বদা [V1 + ing = eating] বসে!</strong>"},
    {id: 551, bookNum: "Prev-105", type: "previous", ruleId: "R13", raw: "Bread and butter ________ (be) my favorite breakfast.", ans: "is", bn: "রুটি এবং মাখন আমার প্রিয় সকালের নাস্তা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Single Idea / एकक খাবার): 'Bread and butter' বা 'Rice and curry' একটি একক খাবার বোঝালে সর্বদা Singular Verb [is] বসে!</strong>"},
    {id: 552, bookNum: "Prev-106", type: "previous", ruleId: "R10", raw: "He told me that he ________ (go) to Dhaka the next day.", ans: "would go", bn: "সে আমাকে বলেছিল যে সে পরের দিন ঢাকায় যাবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Indirect Speech): প্রথম অংশে Past (told) এবং শেষে 'the next day' থাকায় will পরিবর্তিত হয়ে [would go] বসেছে!</strong>"},
    {id: 553, bookNum: "Prev-107", type: "previous", ruleId: "R8", raw: "The man was too old ________ (work) hard.", ans: "to work", bn: "লোকটি এতই বৃদ্ধ ছিলেন যে কঠোর পরিশ্রম করতে পারতেন না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19): 'too + adjective (old)' থাকায় এর পরে সরাসরি [to + V1 (to work)] বসেছে!</strong>"},
    {id: 554, bookNum: "Prev-108", type: "previous", ruleId: "R3", raw: "The climate of the world ________ (change) day by day.", ans: "is changing", bn: "পৃথিবীর জলবায়ু দিন দিন পরিবর্তিত হচ্ছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 (NARA-D শর্টকাট): বাক্যে 'day by day' থাকায় এবং সাবজেক্ট 'The climate' সিঙ্গুলার হওয়ায় [is changing] বসেছে!</strong>"},
    {id: 555, bookNum: "Prev-109", type: "previous", ruleId: "R13", raw: "Politics ________ (be) a dirty game to many.", ans: "is", bn: "অনেকের কাছেই রাজনীতি একটি নোংরা খেলা।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI): 'Politics, Physics, News, Mathematics' দেখতে প্লুরাল হলেও সর্বদা Singular Verb [is] নেয়!</strong>"},
    {id: 556, bookNum: "Prev-110", type: "previous", ruleId: "R9", raw: "If I knew his phone number, I ________ (call) him.", ans: "would call", bn: "আমি যদি তার ফোন নাম্বার জানতাম, তবে তাকে কল করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Step 2): বাম পাশে [If + V2 (knew)] থাকায় ডান পাশে সর্বদা [would + V1 (would call)] বসে!</strong>"},
    {id: 557, bookNum: "Prev-111", type: "previous", ruleId: "R1", raw: "You must have ________ (hear) the name of Shakespeare.", ans: "heard", bn: "তুমি নিশ্চয়ই শেক্সপিয়ারের নাম শুনে থাকবে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modals - Perfect Form): [Modal + have] (must have) দেওয়াই থাকায় এর ঠিক পরেই মূল ভার্বের ৩য় রূপ [V3 = heard] বসেছে!</strong>"},
    {id: 558, bookNum: "Prev-112", type: "previous", ruleId: "R6", raw: "Instead of ________ (read), he wasted his time.", ans: "reading", bn: "পড়াশোনা করার পরিবর্তে সে তার সময় নষ্ট করেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশনাল ফ্রেজ 'Instead of'-এর ঠিক পরেই ভার্ব আসলে সর্বদা [V1 + ing = reading] বসে!</strong>"},
    {id: 559, bookNum: "Prev-113", type: "previous", ruleId: "R12", raw: "I wish I ________ (sing) a folk song.", ans: "could sing / sang", bn: "আমি যদি একটি লোকগান গাইতে পারতাম!", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Wishes): 'I wish + Subject' থাকলে পরবর্তী অংশে [could + V1 (could sing)] অথবা Past Form [V2 = sang] বসে!</strong>"},
    {id: 560, bookNum: "Prev-114", type: "previous", ruleId: "R10", raw: "We had reached the field before the match ________ (begin).", ans: "began", bn: "খেলা শুরু হওয়ার পূর্বেই আমরা মাঠে পৌঁছেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3] দেওয়াই আছে, তাই before-এর পরে সর্বদা Past Indefinite [V2 = began] বসে!</strong>"},
    {id: 561, bookNum: "Prev-115", type: "previous", ruleId: "R8", raw: "She refused ________ (marry) the man.", ans: "to marry", bn: "সে লোকটিকে বিয়ে করতে অস্বীকৃতি জানালো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'refuse, agree, promise, decide, want, fail'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to marry)] বসে!</strong>"},
    {id: 562, bookNum: "Prev-116", type: "previous", ruleId: "R1", raw: "He was ________ for murder. (to hang).", ans: "hanged", bn: "খুনের দায়ে তাঁর ফাঁসি দেওয়া হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Passive Voice - Hang vs Hanged): ফাঁসিতে ঝোলানো অর্থে hang-এর V3 হলো [hanged] (আর কোনো বস্তু দেয়ালে ঝোলানো অর্থে hung হয়)!</strong>"},
    {id: 563, bookNum: "Prev-117", type: "previous", ruleId: "R4", raw: "Lately he ________ (buy) a new car.", ans: "has bought", bn: "সম্প্রতি সে একটি নতুন গাড়ি কিনেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'Lately' (সম্প্রতি) থাকায় Present Perfect [has bought] বসেছে!</strong>"},
    {id: 564, bookNum: "Prev-118", type: "previous", ruleId: "R13", raw: "Each boy and each girl ________ (give) a prize yesterday.", ans: "was given", bn: "প্রতিটি ছেলে এবং প্রতিটি মেয়েকে গতকাল একটি করে পুরস্কার দেওয়া হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R1 (Always Singular + Past Passive): 'Each...and each' সর্বদা Singular, বাক্যে 'yesterday' আছে এবং তাদেরকে পুরস্কার দেওয়া হয়েছিল (Passive) বোঝাতে [was given] বসেছে!</strong>"},
    {id: 565, bookNum: "Prev-119", type: "previous", ruleId: "R7", raw: "I found the door ________ (lock).", ans: "locked", bn: "আমি দরজাটি তালাবদ্ধ অবস্থায় পেলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 & R1 (Passive Participle): দরজা (বস্তু) নিজে নিজেকে তালা দিতে পারে না, অন্যের দ্বারা তালাবদ্ধ অবস্থা বোঝাতে [V3 = locked] বসেছে!</strong>"},
    {id: 566, bookNum: "Prev-120", type: "previous", ruleId: "R2", raw: "The earth ________ (move) round the sun.", ans: "moves", bn: "পৃথিবী সূর্যের চারদিকে ঘোরে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (চিরন্তন সত্য): চিরন্তন সত্য বাক্য সর্বদা Present Indefinite হয় এবং 'The earth' সিঙ্গুলার হওয়ায় [moves] বসেছে!</strong>"},
    {id: 567, bookNum: "Prev-121", type: "previous", ruleId: "R11", raw: "While I ________ (walk) in the morning, I saw a dead cow.", ans: "was walking", bn: "সকালে যখন আমি হাঁটছিলাম, তখন একটি মরা গরু দেখলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (While-এর নিয়ম): 'While + Subject (I)' থাকায় অতীতে চলমান কাজে [was walking] বসেছে!</strong>"},
    {id: 568, bookNum: "Prev-122", type: "previous", ruleId: "R6", raw: "She is addicted to ________ (watch) television.", ans: "watching", bn: "সে টেলিভিশন দেখায় আসক্ত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'addicted to'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = watching] বসে!</strong>"},
    {id: 569, bookNum: "Prev-123", type: "previous", ruleId: "R5", raw: "My uncle ________ (leave) for London last night.", ans: "left", bn: "আমার চাচা গত রাতে লন্ডনের উদ্দেশ্যে রওনা দিয়েছেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (A loy শর্টকাট): বাক্যে 'last night' থাকায় সরাসরি Past Indefinite [V2 = left] বসেছে!</strong>"},
    {id: 570, bookNum: "Prev-124", type: "previous", ruleId: "R9", raw: "If you had started earlier, you ________ (catch) the train.", ans: "would have caught", bn: "তুমি যদি আরও আগে রওনা হতে, তবে ট্রেনটি ধরতে পারতে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাম পাশে [If + had + V3 (had started)] থাকায় ডান পাশে [would have + V3 (would have caught)] বসেছে!</strong>"},
    {id: 571, bookNum: "Prev-125", type: "previous", ruleId: "R1", raw: "We would rather ________ (starve) than steal.", ans: "starve", bn: "আমরা চুরি করার চেয়ে বরং না খেয়ে থাকবো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Semi-Modals): 'would rather'-এর ঠিক পরেই সর্বদা মূল ভার্বের আসল রূপ [V1 = starve] বসে!</strong>"},
    {id: 572, bookNum: "Prev-126", type: "previous", ruleId: "R8", raw: "I am glad ________ (receive) your letter.", ans: "to receive", bn: "তোমার চিঠি পেয়ে আমি আনন্দিত।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 19 Adjectives): 'glad, happy, sorry, surprised'-এর পর সর্বদা [to + V1 (to receive)] বসে!</strong>"},
