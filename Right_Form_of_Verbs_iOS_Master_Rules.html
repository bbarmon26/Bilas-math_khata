    {id: 573, bookNum: "Prev-127", type: "previous", ruleId: "R5", raw: "How long you ________ (wait) for me?", ans: "have you been waiting", bn: "তুমি কতক্ষণ ধরে আমার জন্য অপেক্ষা করছ?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous - How long): 'How long' দ্বারা কতক্ষণ ধরে কাজ চলছে প্রশ্ন করলে [have / has + Sub + been + V1 + ing] বসে!</strong>"},
    {id: 574, bookNum: "Prev-128", type: "previous", ruleId: "R13", raw: "The committee ________ (have) issued its report.", ans: "has", bn: "কমিটি তাদের প্রতিবেদন প্রকাশ করেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - Collective Noun): বাক্যে 'its report' (সিঙ্গুলার) থাকায় কমিটি একমত হয়ে কাজ করেছে বোঝায়, তাই Singular Verb [has] বসেছে!</strong>"},
    {id: 575, bookNum: "Prev-129", type: "previous", ruleId: "R1", raw: "Rome ________ (not build) in a day.", ans: "was not built", bn: "রোম এক দিনে তৈরি হয়নি। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Past Passive): রোম শহর নিজে তৈরি হয়নি (Passive), তাই অতীতের প্যাসিভ হিসেবে [was not built] বসেছে!</strong>"},
    {id: 576, bookNum: "Prev-130", type: "previous", ruleId: "R7", raw: "Do you mind ________ (take) a cup of coffee?", ans: "taking", bn: "আপনি কি এক কাপ কফি খেতে কিছু মনে করবেন?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (৪টি বিশেষ Phrase): 'Would you mind / Do you mind'-এর ঠিক পরেই সর্বদা [V1 + ing = taking] বসে!</strong>"},
    {id: 577, bookNum: "Prev-131", type: "previous", ruleId: "R10", raw: "Hardly had I gone out when it ________ (begin) to rain.", ans: "began", bn: "আমি বাইরে বের হতে না হতেই বৃষ্টি শুরু হলো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Train Formula): [Hardly had + Sub + V3 ... when + Sub + V2] — তাই 'when'-এর পরের অংশে [V2 = began] বসেছে!</strong>"},
    {id: 578, bookNum: "Prev-132", type: "previous", ruleId: "R13", raw: "Karim together with Rahim ________ (to be) absent.", ans: "is / was", bn: "রহিমের সাথে করিমও অনুপস্থিত আছে/ছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Tricky Connectors): 'together with, along with, as well as' থাকলে ১ম কর্তা (Karim - একবচন) অনুযায়ী Singular Verb [is / was] বসে!</strong>"},
    {id: 579, bookNum: "Prev-133", type: "previous", ruleId: "R8", raw: "The boy tried hard ________ (win) the prize.", ans: "to win", bn: "ছেলেটি পুরস্কারটি জেতার জন্য কঠোর চেষ্টা করেছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'try, attempt, want, fail, hope, decide'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to win)] বসে!</strong>"},
    {id: 580, bookNum: "Prev-134", type: "previous", ruleId: "R11", raw: "Ten years have passed since I ________ (visit) my village.", ans: "visited", bn: "আমি আমার গ্রামে যাওয়ার পর দশ বছর কেটে গেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - Since): 'Since'-এর বাম পাশে Present Perfect (have passed) থাকলে ডান পাশে সর্বদা Past Indefinite [V2 = visited] বসে!</strong>"},
    {id: 581, bookNum: "Prev-135", type: "previous", ruleId: "R2", raw: "A barking dog seldom ________ (bite).", ans: "bites", bn: "যত গর্জে তত বর্ষে না। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R2 (DANGEROUS রুল + প্রবাদ): বাক্যে 'seldom' আছে এবং সাবজেক্ট 'A barking dog' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে [bites] বসেছে!</strong>"},
    {id: 582, bookNum: "Prev-136", type: "previous", ruleId: "R12", raw: "He ran away lest he ________ (arrest).", ans: "should be arrested", bn: "সে পালিয়ে গেল পাছে সে গ্রেপ্তার না হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Warning - Lest in Passive): বাক্যে 'lest' আছে এবং সে নিজে গ্রেপ্তার করে না বরং পুলিশের দ্বারা গ্রেপ্তার হবে (Passive) বোঝাতে [should be + V3 (should be arrested)] বসেছে!</strong>"},
    {id: 583, bookNum: "Prev-137", type: "previous", ruleId: "R13", raw: "Reading books ________ (be) a good habit.", ans: "is", bn: "বই পড়া একটি ভালো অভ্যাস।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Sop BD CGPI - Gerund Subject): এখানে 'books' সাবজেক্ট নয়, বরং Gerund (Reading - বই পড়া কাজটি) হলো আসল সাবজেক্ট! তাই Singular Verb [is] বসেছে।</strong>"},
    {id: 584, bookNum: "Prev-138", type: "previous", ruleId: "R1", raw: "The work can ________ (finish) within an hour.", ans: "be finished", bn: "কাজটি এক ঘণ্টার মধ্যে শেষ করা যেতে পারে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Modal Passive): কাজটি নিজে নিজেকে শেষ করতে পারে না (Passive), তাই Modal 'can'-এর পর [be + V3 (be finished)] বসেছে!</strong>"},
    {id: 585, bookNum: "Prev-139", type: "previous", ruleId: "R4", raw: "She ________ (just go) out.", ans: "has just gone", bn: "সে এইমাত্র বাইরে গিয়েছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'just' থাকায় Present Perfect [has just gone] বসেছে!</strong>"},
    {id: 586, bookNum: "Prev-140", type: "previous", ruleId: "R9", raw: "If it rains, we ________ (not play) football.", ans: "will not play / shall not play", bn: "যদি বৃষ্টি হয়, তবে আমরা ফুটবল খেলবো না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (1st Conditional - Step 1): বাম পাশে [If + Present (rains)] থাকায় ডান পাশে Future Negative [will not play] বসেছে!</strong>"},
    {id: 587, bookNum: "Prev-141", type: "previous", ruleId: "R6", raw: "After ________ (complete) his graduation, he got a job.", ans: "completing", bn: "স্নাতক শেষ করার পর সে একটি চাকরি পেল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশন 'After'-এর পর কোনো Subject না থেকে সরাসরি ভার্ব আসায় [V1 + ing = completing] বসেছে!</strong>"},
    {id: 588, bookNum: "Prev-142", type: "previous", ruleId: "R12", raw: "Mother made the baby ________ (sleep).", ans: "sleep", bn: "মা শিশুটিকে ঘুম পাড়ালেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'make / made + ব্যক্তি (the baby)' থাকায় সরাসরি Base Form [V1 = sleep] বসেছে!</strong>"},
    {id: 589, bookNum: "Prev-143", type: "previous", ruleId: "R3", raw: "Now-a-days internet ________ (use) everywhere.", ans: "is used / is being used", bn: "আজকাল সর্বত্র ইন্টারনেট ব্যবহৃত হচ্ছে/হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R3 & R1 (Present Passive): ইন্টারনেট মানুষের দ্বারা ব্যবহৃত হয় (Passive), তাই বর্তমান কালে [is used / is being used] বসেছে!</strong>"},
    {id: 590, bookNum: "Prev-144", type: "previous", ruleId: "R13", raw: "Two-thirds of the city ________ (destroy) by the earthquake.", ans: "was destroyed", bn: "শহরের দুই-তৃতীয়াংশ ভূমিকম্পে ধ্বংস হয়ে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R1 (Fraction + Passive): ভগ্নাংশের পর 'the city' একবচন হওয়ায় এবং ভূমিকম্পের দ্বারা ধ্বংস হওয়ায় (Passive) [was destroyed] বসেছে!</strong>"},
    {id: 591, bookNum: "Prev-145", type: "previous", ruleId: "R8", raw: "He agreed ________ (help) me financially.", ans: "to help", bn: "সে আমাকে আর্থিকভাবে সাহায্য করতে রাজি হলো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'agree, promise, decide, offer, want, hope'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to help)] বসে!</strong>"},
    {id: 592, bookNum: "Prev-146", type: "previous", ruleId: "R11", raw: "He acted as though he ________ (know) nothing.", ans: "had known", bn: "সে এমনভাবে অভিনয় করল যেন সে কিছুই জানতো না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R11 (The Tense Bridge - As though): 'as though'-এর বাম পাশে Past [V2 = acted] থাকায় ডান পাশে সর্বদা Past Perfect [had + V3 = had known] বসে!</strong>"},
    {id: 593, bookNum: "Prev-147", type: "previous", ruleId: "R5", raw: "Alexander Fleming ________ (discover) penicillin.", ans: "discovered", bn: "আলেকজান্ডার ফ্লেমিং পেনিসিলিন আবিষ্কার করেছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Historical Past Event): ঐতিহাসিক অতীত ঘটনা সর্বদা Past Indefinite Tense [V2 = discovered] হয়!</strong>"},
    {id: 594, bookNum: "Prev-148", type: "previous", ruleId: "R13", raw: "Neither of the boys ________ (be) qualified for the post.", ans: "is / was", bn: "ছেলেদের কেউই পদটির জন্য যোগ্য নয়/ছিল না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Singular): 'Neither of / Either of / Each of / One of'-এর পর Noun বহুবচন হলেও Verb সর্বদা Singular [is / was] হয়!</strong>"},
    {id: 595, bookNum: "Prev-149", type: "previous", ruleId: "R6", raw: "I must confess to ________ (know) nothing about golf.", ans: "knowing", bn: "আমাকে স্বীকার করতেই হবে যে আমি গল্ফ সম্পর্কে কিছুই জানি না।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (The Preposition Trap): 'confess to, object to, accustomed to, look forward to'-এর পর সর্বদা [V1 + ing = knowing] বসে!</strong>"},
    {id: 596, bookNum: "Prev-150", type: "previous", ruleId: "R10", raw: "Wait here until I ________ (come) back.", ans: "come", bn: "আমি ফিরে না আসা পর্যন্ত এখানে অপেক্ষা করো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Time Balance - Imperative/Future): প্রথম অংশে আদেশ (Wait here) বা Future থাকলে 'until'-এর পর সর্বদা Present Indefinite [V1 = come] বসে!</strong>"},
    {id: 597, bookNum: "Prev-151", type: "previous", ruleId: "R9", raw: "Were I a rich man, I ________ (establish) a hospital.", ans: "would establish", bn: "আমি যদি ধনী মানুষ হতাম, তবে একটি হাসপাতাল প্রতিষ্ঠা করতাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (2nd Conditional - Inverted 'Were'): শুরুতে 'Were + Subject (Were I... = If I were...)' থাকলে অপর অংশে সর্বদা [would + V1 (would establish)] বসে!</strong>"},
    {id: 598, bookNum: "Prev-152", type: "previous", ruleId: "R7", raw: "We enjoyed ________ (swim) in the river.", ans: "swimming", bn: "আমরা নদীতে সাঁতার কাটা উপভোগ করেছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R7 (Emotion & Preference): 'enjoy / enjoyed'-এর ঠিক পরেই ২য় ভার্ব আসলে সর্বদা [V1 + ing = swimming] বসে!</strong>"},
    {id: 599, bookNum: "Prev-153", type: "previous", ruleId: "R1", raw: "Tea ________ (grow) plenty in Sylhet.", ans: "grows / is grown", bn: "সিলেটে প্রচুর চা জন্মে / উৎপাদিত হয়।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 & R2: সাধারণ সত্য অর্থে সিঙ্গুলার সাবজেক্ট অনুযায়ী [grows] অথবা মানুষের দ্বারা চাষ করা হয় (Passive) অর্থে [is grown] বসে!</strong>"},
    {id: 600, bookNum: "Prev-154", type: "previous", ruleId: "R12", raw: "It is high time the government ________ (take) steps against corruption.", ans: "took", bn: "এটাই উপযুক্ত সময় সরকারের দুর্নীতির বিরুদ্ধে পদক্ষেপ নেওয়ার।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Time to Act): 'It is high time + Subject (the government)' থাকলে পরবর্তী ভার্বের Past Form [V2 = took] বসে!</strong>"},
    {id: 601, bookNum: "Prev-155", type: "previous", ruleId: "R4", raw: "So far he ________ (write) five books.", ans: "has written", bn: "এ পর্যন্ত সে পাঁচটি বই লিখেছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R4 (Raj-Ley শর্টকাট): বাক্যে 'So far, yet, already, recently, just' থাকলে সর্বদা Present Perfect [has written] বসে!</strong>"},
    {id: 602, bookNum: "Prev-156", type: "previous", ruleId: "R8", raw: "My father advised me ________ (speak) the truth always.", ans: "to speak", bn: "আমার বাবা আমাকে সর্বদা সত্য কথা বলার পরামর্শ দিয়েছিলেন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R8 (Infinitive Triggers - Rule 18): 'advise, ask, tell, order, request + object'-এর পর ২য় ভার্ব আসলে সর্বদা [to + V1 (to speak)] বসে!</strong>"},
    {id: 603, bookNum: "Prev-157", type: "previous", ruleId: "R13", raw: "All that glitters ________ (be) not gold.", ans: "is", bn: "চকচক করলেই সোনা হয় না। (প্রবাদ বাক্য)", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 & R2 (প্রবাদ বাক্য): এখানে 'glitters' ভার্বের সাথে s থাকায় বোঝা যাচ্ছে 'All' একবচন (বস্তুবাচক), তাই Singular Verb [is] বসেছে!</strong>"},
    {id: 604, bookNum: "Prev-158", type: "previous", ruleId: "R6", raw: "He succeeded in ________ (pass) the examination.", ans: "passing", bn: "সে পরীক্ষায় পাস করতে সফল হয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশন 'in'-এর ঠিক পরের ভার্বের সাথে সর্বদা [V1 + ing = passing] যুক্ত হয়!</strong>"},
    {id: 605, bookNum: "Prev-159", type: "previous", ruleId: "R5", raw: "The baby ________ (cry) since morning.", ans: "has been crying", bn: "শিশুটি সকাল থেকে কাঁদছে।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R5 (Present Perfect Continuous): বাক্যে 'since morning' থাকায় [has been crying] বসেছে!</strong>"},
    {id: 606, bookNum: "Prev-160", type: "previous", ruleId: "R10", raw: "The bell had rung before I ________ (enter) the classroom.", ans: "entered", bn: "আমি শ্রেণীকক্ষে প্রবেশ করার পূর্বেই ঘণ্টা বেজে গিয়েছিল।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R10 (Before-এর ছন্দ): 'Before'-এর আগে [had + V3] থাকায় before-এর পরে সর্বদা Past Indefinite [V2 = entered] বসে!</strong>"},
    {id: 607, bookNum: "Prev-161", type: "previous", ruleId: "R1", raw: "Does he ________ (get) up early in the morning?", ans: "get", bn: "সে কি সকালে তাড়াতাড়ি ঘুম থেকে ওঠে?", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R1 (Do Verbs): বাক্যে 'Does' দেওয়াই থাকায় মূল ভার্বের সাথে s/es যুক্ত না হয়ে আসল রূপ [V1 = get] বসেছে!</strong>"},
    {id: 608, bookNum: "Prev-162", type: "previous", ruleId: "R13", raw: "The pious ________ (be) always happy.", ans: "are", bn: "ধার্মিকেরা সবসময় সুখী হন।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R13 (Always Plural - The + Adjective): 'The pious' (ধার্মিক জাতি) সর্বদা বহুবচন, তাই Plural Verb [are] বসেছে!</strong>"},
    {id: 609, bookNum: "Prev-163", type: "previous", ruleId: "R9", raw: "If he had tried, he ________ (succeed).", ans: "would have succeeded", bn: "সে যদি চেষ্টা করতো, তবে সফল হতো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R9 (3rd Conditional - Step 3): বাম পাশে [If + had + V3 (had tried)] থাকায় ডান পাশে [would have succeeded] বসেছে!</strong>"},
    {id: 610, bookNum: "Prev-164", type: "previous", ruleId: "R12", raw: "I had my room ________ (clean) yesterday.", ans: "cleaned", bn: "আমি গতকাল আমার ঘরটি পরিষ্কার করিয়ে নিয়েছিলাম।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R12 (Causative Verbs): 'had + বস্তু (my room)' থাকায় পরের ভার্বের ৩য় রূপ [V3 = cleaned] বসেছে!</strong>"},
    {id: 611, bookNum: "Prev-165", type: "previous", ruleId: "R6", raw: "By ________ (take) regular exercise, you can keep fit.", ans: "taking", bn: "নিয়মিত ব্যায়াম করার মাধ্যমে তুমি শরীর সুস্থ রাখতে পারো।", ex: "<strong style='color: #facc15; display: block; margin-bottom: 6px;'>⚡ নোট রুল R6 (Any Preposition + V1+ing): প্রিপজিশন 'By'-এর ঠিক পরেই ভার্ব আসায় সর্বদা [V1 + ing = taking] বসেছে!</strong>"},

    // =========================================================================
    // 🧠 3. SMART RULE CLASSIFIER & DEDICATED iOS RULE VIEW ENGINE
    // =========================================================================
    function classifyQuestionRule(item) {
        const s = (item.raw + " " + item.ex).toLowerCase();
        if (s.includes("it is time") || s.includes("it is high time") || s.includes("proper time") || s.includes("i wish") || s.includes("fancy") || s.includes("would that") || s.includes("lest ") || s.includes("causative") || s.includes("got the") || s.includes("got my") || s.includes("had my") || s.includes("made the") || s.includes("made me") || s.includes("make us") || s.includes("let me") || s.includes("was let")) return "R12";
        if (s.includes("as if") || s.includes("as though") || s.includes("while ") || (s.includes("since") && (s.includes("many years") || s.includes("two years") || s.includes("twenty years") || s.includes("long since") || s.includes("it was long")))) return "R11";
        if (s.includes("no sooner") || s.includes("before") || s.includes("after he") || s.includes("after his") || s.includes("after the") || s.includes("after we") || s.includes("as soon as") || s.includes("until") || s.includes("said that")) return "R10";
        if (s.includes("if ") || s.includes("unless") || s.includes("had i ") || s.includes("had you ") || s.includes("conditional")) return "R9";
        if (s.includes("with a view to") || s.includes("look forward") || s.includes("looking forward") || s.includes("accustomed to") || s.includes("be used to") || s.includes("was used to") || s.includes("are used to") || s.includes("not used to") || s.includes("confess to") || s.includes("prefer ") || s.includes("by ") || s.includes("after ________") || s.includes("thinking of")) return "R6";
        if (s.includes("would you mind") || s.includes("cannot help") || s.includes("could not help") || s.includes("feel like") || s.includes("gave up") || s.includes("enjoy") || s.includes("stop ") || s.includes("stopped") || s.includes("start ") || s.includes("started") || s.includes("regret") || s.includes("saw ") || s.includes("heard ") || s.includes("hear ") || s.includes("found ") || s.includes("watched ") || s.includes("kept ")) return "R7";
        if (s.includes("failed") || s.includes("advises") || s.includes("wanted him") || s.includes("needs ") || s.includes("too clever to") || s.includes("yet ________")) return "R8";
        if (s.includes("one of") || s.includes("each of") || s.includes("every ") || s.includes("neither") || s.includes("either") || s.includes("many a") || s.includes("as well as") || s.includes("together with") || s.includes("with two men") || s.includes("miles") || s.includes("kilometers") || s.includes("arabian nights") || s.includes("gulliver") || s.includes("cattle") || s.includes("police") || s.includes("news") || s.includes("gymnastics") || s.includes("five and five") || s.includes("four and four") || s.includes("color of") || s.includes("colour of") || s.includes("quality of") || s.includes("choice of") || s.includes("presence of") || s.includes("size of")) return "R13";
        if (s.includes("already") || s.includes("recently") || s.includes("just") || s.includes("ever ")) return "R4";
        if (s.includes("now") || s.includes("at this moment") || s.includes("at present") || s.includes("day by day") || s.includes("keep silent") || s.includes("listen,")) return "R3";
        if (s.includes("for two hours") || s.includes("for three hours") || s.includes("for five hours") || s.includes("for a long time") || s.includes("for ten years") || s.includes("since morning") || s.includes("since 9 a.m") || s.includes("since monday") || s.includes("since last night") || s.includes("since afternoon") || s.includes("since our childhood")) return "R5";
        if (s.includes("yesterday") || s.includes("last night") || s.includes("last week") || s.includes("last year") || s.includes("ago") || s.includes("1492")) return "R5";
        if (s.includes("regularly") || s.includes("always") || s.includes("usually") || s.includes("daily") || s.includes("often") || s.includes("every year") || s.includes("universal truth") || s.includes("চিরন্তন সত্য") || s.includes("প্রবাদ")) return "R2";
        return "R1";
    }

    // =========================================================================
    // 🍎 4. DEDICATED RULE VIEW WITH iOS FLOATING GLASS BACK BUTTON
    // =========================================================================
    function openSpecificRule(ruleId, event) {
        if (event) event.stopPropagation();

        // রুলস হোমপেজ থেকে ঢুকলে স্ক্রল পজিশন সেভ করে রাখবে
        if (currentTab === 'rules' && !activeSelectedRuleId) {
            savedRulesScrollTop = appContent.scrollTop;
        }

        activeSelectedRuleId = ruleId;
        const rule = masterRulesData.find(r => r.ruleId === ruleId);
        if (!rule) return;

        const ruleQuestions = verbData.filter(item => item.ruleId === ruleId);

        let html = `
            <!-- 🍎 iOS Floating Glass Back Button & Reveal Pill (No bulky header) -->
            <div class="ios-floating-nav">
                <button type="button" onclick="goBackFromRule()" class="ios-back-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    <span>রুলস</span>
                </button>

                <button type="button" onclick="toggleRevealAllInRule('${ruleId}')" class="ios-action-pill ${revealAllInRule ? 'active-reveal' : ''}">
                    <span>${revealAllInRule ? '🙈 সব উত্তর লুকান' : '👁️ সব উত্তর ও ব্যাখ্যা'}</span>
                </button>
            </div>

            <!-- Rule Visual Card -->
            <div class="nlm-slide-card cursor-default">
                <div class="px-4 pt-4 flex items-center justify-between">
                    <span class="px-2.5 py-1 rounded-lg text-xs font-black bg-gradient-to-r ${rule.badgeColor} text-white">
                        ${rule.ruleId} • ${rule.slideNum}
                    </span>
                    <span class="text-xs font-extrabold text-cyan-300 bg-cyan-500/15 border border-cyan-400/30 px-3 py-1 rounded-full">
                        🎯 ${ruleQuestions.length}টি প্রশ্ন
                    </span>
                </div>
                <div class="px-4 pt-1.5">
                    <h2 class="text-lg sm:text-xl font-black text-white">${rule.title}</h2>
                    <p class="text-xs text-zinc-400">${rule.subtitle}</p>
                </div>
                ${rule.visualHTML}
            </div>

            <!-- Handwritten Notes -->
            <div class="handwritten-box shadow-lg mb-4">
                ${rule.handwrittenHTML}
            </div>

            <!-- Practice Questions Header -->
            <div class="flex items-center justify-between px-2 pb-2.5">
                <span class="text-sm font-extrabold text-white">📝 এই নিয়মের অনুশীলন প্রশ্ন (${ruleQuestions.length}টি)</span>
                <span class="text-[11px] text-zinc-400">১ম ট্যাপে উত্তর • ২য় ট্যাপে ব্যাখ্যা</span>
            </div>

            <!-- Questions List -->
            <div class="space-y-3">
                ${ruleQuestions.map((qItem, idx) => createQuestionCardHTML(qItem, idx + 1, false)).join('')}
            </div>
        `;

        appContent.innerHTML = html;
        appContent.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBackFromRule() {
        activeSelectedRuleId = null;
        revealAllInRule = false;
        if (currentTab === 'rules') {
            renderVisualRulesHub(true);
        } else if (currentTab === 'all' || currentTab === 'fav') {
            executeQuestionFilter();
        } else {
            switchDockMode('rules');
        }
    }

    function toggleRevealAllInRule(ruleId) {
        revealAllInRule = !revealAllInRule;
        const currentScroll = appContent.scrollTop;
        openSpecificRule(ruleId);
        appContent.scrollTop = currentScroll;
    }

    // ১ম ক্লিক লজিক: শুধু উত্তর দেখাবে, ব্যাখ্যা লুকানো থাকবে

        }
    }

    // ২য় ক্লিক লজিক: "ব্যাখ্যা" বাটনে চাপ দিলে ব্যাখ্যা বের হবে
    function toggleBekkha(btnEl, event) {
        event.stopPropagation();
        const cardEl = btnEl.closest('.card');
        cardEl.classList.toggle('show-ex');
        const spanEl = btnEl.querySelector('span');
        if (cardEl.classList.contains('show-ex')) {
            spanEl.innerText = '🔼 ব্যাখ্যা লুকান';
        } else {
            spanEl.innerText = '💡 ব্যাখ্যা';
        }
    }

    // Render All / Filtered Questions List
    function renderQuestionList(dataArray, titleText = "সব অনুশীলন প্রশ্ন") {
        let filterPillsHTML = '';
        if (currentTab === 'all') {
            const totalAll = verbData.length;
            const totalNormal = verbData.filter(i => i.type === 'normal').length;
            const totalPrev = verbData.filter(i => i.type === 'previous').length;

            filterPillsHTML = `
                <div class="flex items-center justify-between gap-2 mb-3.5 flex-wrap">
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                        <button onclick="setAllQuestionSubFilter('all')" class="px-3 py-1.5 rounded-full text-xs font-extrabold border transition ${currentAllFilter === 'all' ? 'bg-sky-500 text-white border-sky-400' : 'bg-white/5 text-zinc-300 border-white/15'}">
                            সব (${totalAll})
                        </button>
                        <button onclick="setAllQuestionSubFilter('normal')" class="px-3 py-1.5 rounded-full text-xs font-extrabold border transition ${currentAllFilter === 'normal' ? 'bg-sky-500 text-white border-sky-400' : 'bg-white/5 text-zinc-300 border-white/15'}">
                            সাধারণ (${totalNormal})
                        </button>
                        <button onclick="setAllQuestionSubFilter('previous')" class="px-3 py-1.5 rounded-full text-xs font-extrabold border transition ${currentAllFilter === 'previous' ? 'bg-pink-600 text-white border-pink-400' : 'bg-white/5 text-pink-300 border-pink-400/30'}">
                            🔥 বিগত সাল (${totalPrev})
                        </button>
                    </div>
                    <button onclick="toggleListRevealAll()" class="ios-action-pill ${revealAllInRule ? 'active-reveal' : ''}">
                        <span>${revealAllInRule ? '🙈 সব লুকান' : '👁️ সব উত্তর'}</span>
                    </button>
                </div>
            `;
        }

        if (dataArray.length === 0) {
            appContent.innerHTML = `
                ${filterPillsHTML}
                <div class="text-center text-zinc-400 py-20">কোনো বাক্য পাওয়া যায়নি।</div>
            `;
            return;
        }

        let html = `
            ${filterPillsHTML}
        `;

        let prevSectionAdded = false;

        dataArray.forEach((item, index) => {
            if (item.type === 'previous' && !prevSectionAdded && currentTab === 'all' && currentAllFilter === 'all' && !searchInput.value.trim()) {
                html += `
                    <div class="text-center my-4 relative flex items-center justify-center">
                        <span class="bg-zinc-900 border border-pink-500/40 text-pink-400 text-xs font-extrabold px-4 py-1.5 rounded-full shadow">
                            🔥 বিগত সালের প্রশ্নাবলি 🔥
                        </span>
                    </div>
                `;
                prevSectionAdded = true;
            }
            html += createQuestionCardHTML(item, index + 1, false);
        });

        appContent.innerHTML = html;
    }

    function setAllQuestionSubFilter(filterType) {
        currentAllFilter = filterType;
        executeQuestionFilter();
        appContent.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleListRevealAll() {
        revealAllInRule = !revealAllInRule;
        const currentScroll = appContent.scrollTop;
        executeQuestionFilter();
        appContent.scrollTop = currentScroll;
    }

    // Handle Search Input across Rules and Questions
    function handleSearchInput() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
            if (currentTab === 'rules') renderVisualRulesHub();
            else executeQuestionFilter();
            return;
        }

        const matchingRules = masterRulesData.filter(r =>
            r.ruleId.toLowerCase().includes(query) ||
            r.title.toLowerCase().includes(query) ||
            r.subtitle.toLowerCase().includes(query) ||
            r.keywords.some(k => k.toLowerCase().includes(query)) ||
            r.handwrittenHTML.toLowerCase().includes(query)
        );

        const matchingQuestions = verbData.filter(item =>
            item.raw.toLowerCase().includes(query) ||
            item.ans.toLowerCase().includes(query) ||
            item.bn.toLowerCase().includes(query) ||
            item.ruleId.toLowerCase().includes(query) ||
            (item.bookNum && item.bookNum.toLowerCase().includes(query)) ||
            String(item.id).includes(query)
        );

        let html = `
            <div class="px-2 pt-12 pb-2 flex items-center justify-between">
                <span class="text-sm font-bold text-zinc-300">🔍 "${searchInput.value}" এর ফলাফল</span>
                <span class="text-xs text-cyan-300 font-bold">${matchingRules.length}টি রুল • ${matchingQuestions.length}টি প্রশ্ন</span>
            </div>
        `;

        matchingRules.forEach((rule) => {
            const rQuestions = verbData.filter(q => q.ruleId === rule.ruleId);
            html += `
                <div class="nlm-slide-card cursor-pointer" onclick="openSpecificRule('${rule.ruleId}', event)">
                    <div class="px-4 pt-3 flex items-center justify-between">
                        <span class="px-2.5 py-0.5 rounded text-xs font-black bg-gradient-to-r ${rule.badgeColor} text-white">${rule.ruleId}</span>
                        <span class="text-xs font-bold text-cyan-300">${rQuestions.length}টি প্রশ্ন ›</span>
                    </div>
                    <div class="px-4 pt-1">
                        <h2 class="text-base font-extrabold text-white">${rule.title}</h2>
                    </div>
                    ${rule.visualHTML}
                </div>
            `;
        });

        matchingQuestions.forEach((item, idx) => {
            html += createQuestionCardHTML(item, idx + 1, false);
        });

        if (matchingRules.length === 0 && matchingQuestions.length === 0) {
            html += `<div class="text-center text-zinc-400 py-16">কোনো ফলাফল পাওয়া যায়নি।</div>`;
        }

        appContent.innerHTML = html;
    }

    function executeQuestionFilter() {
        let filtered = verbData.filter(item => {
            if (currentTab === 'fav') return favorites.includes(item.id);
            if (currentTab === 'all') {
                if (currentAllFilter === 'normal') return item.type === 'normal';
                if (currentAllFilter === 'previous') return item.type === 'previous';
            }
            return true;
        });
        renderQuestionList(filtered, currentTab === 'fav' ? "⭐ প্রিয় প্রশ্নসমূহ" : "📚 সব অনুশীলন প্রশ্ন");
    }

    // Switch Bottom Dock Mode
    function switchDockMode(mode) {
        currentTab = mode;
        revealAllInRule = false;
        activeSelectedRuleId = null;

        document.querySelectorAll('.dock-item').forEach(btn => btn.classList.remove('active'));
        if (mode === 'rules') {
            document.getElementById('dockRules').classList.add('active');
            renderVisualRulesHub();
        } else if (mode === 'all') {
            document.getElementById('dockAll').classList.add('active');
            executeQuestionFilter();
        } else if (mode === 'fav') {
            document.getElementById('dockFav').classList.add('active');
            executeQuestionFilter();
        }
        appContent.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Random Challenge Mode
    function rollRandomChallengeCard(event) {
        if (event) event.stopPropagation();
        currentTab = 'random';
        revealAllInRule = false;
        activeSelectedRuleId = null;

        document.querySelectorAll('.dock-item').forEach(btn => btn.classList.remove('active'));
        document.getElementById('dockRandom').classList.add('active');

        const randomIndex = Math.floor(Math.random() * verbData.length);
        const randomItem = verbData[randomIndex];
        const ruleObj = masterRulesData.find(r => r.ruleId === randomItem.ruleId);

        appContent.innerHTML = `
            ${createQuestionCardHTML(randomItem, randomIndex + 1, true)}
            ${ruleObj ? `
                <div class="mt-2 bg-zinc-900/75 border border-white/15 rounded-2xl p-3.5 flex items-center justify-between gap-2">
                    <div class="text-xs text-zinc-300">এই প্রশ্নটি <strong>${ruleObj.ruleId}: ${ruleObj.title}</strong> নিয়মের অন্তর্গত।</div>
                    <button type="button" onclick="openSpecificRule('${ruleObj.ruleId}', event)" class="shrink-0 text-xs font-bold text-sky-400 bg-sky-500/15 px-3 py-1.5 rounded-xl border border-sky-400/30">
                        রুলটি দেখুন ›
                    </button>
                </div>
            ` : ''}
        `;
    }

    // ⭐ Favorite Toggle (Never blocked by rocket button)
    function toggleFavorite(id, btnEl, event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        const numId = Number(id);
        const idx = favorites.indexOf(numId);
        const svgEl = btnEl.querySelector('svg');

        if (idx > -1) {
            favorites.splice(idx, 1);
            btnEl.classList.remove('is-fav');
            if (svgEl) svgEl.setAttribute('fill', 'none');
        } else {
            favorites.push(numId);
            btnEl.classList.add('is-fav');
            if (svgEl) svgEl.setAttribute('fill', 'currentColor');
        }

        localStorage.setItem('bilas_rfv_favs', JSON.stringify(favorites));
        updateFavBadge();
        if (currentTab === 'fav' && !activeSelectedRuleId) executeQuestionFilter();
    }

    // Spotlight Search Toggle
    function toggleSearchSheet() {
        const isOpen = searchSheet.classList.toggle('open');
        document.getElementById('dockSearch').classList.toggle('active', isOpen);
        if (isOpen) {
            setTimeout(() => searchInput.focus(), 150);
        }
    }

    function closeSearchSheet() {
        searchSheet.classList.remove('open');
        document.getElementById('dockSearch').classList.remove('active');
        if (searchInput.value) {
            searchInput.value = '';
            if (currentTab === 'rules') renderVisualRulesHub();
            else executeQuestionFilter();
        }
    }

    // Rocket Assistive Menu
    function toggleRocketMenuPanel(event) {
        event.stopPropagation();
        rocketContainer.classList.toggle('menu-open');
    }

    function triggerRocketNavigation(direction) {
        rocketContainer.classList.remove('menu-open');
        if (direction === 'top') {
            appContent.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (direction === 'bottom') {
            appContent.scrollTo({ top: appContent.scrollHeight, behavior: 'smooth' });
        }
    }

    // iOS Number Jump Modal
    function openJumpModal() {
        rocketContainer.classList.remove('menu-open');
        document.getElementById('jumpModalSub').innerText = `১ থেকে ${verbData.length} এর মধ্যে নাম্বার লিখুন`;
        document.getElementById('jumpModal').classList.add('open');
        setTimeout(() => document.getElementById('jumpNumberInput').focus(), 150);
    }

    function closeJumpModal() {
        document.getElementById('jumpModal').classList.remove('open');
        document.getElementById('jumpNumberInput').value = '';
    }

    function confirmJumpToNumber() {
        const num = parseInt(document.getElementById('jumpNumberInput').value);
        closeJumpModal();
        if (!num || num < 1) return;

        currentAllFilter = 'all';
        switchDockMode('all');

        setTimeout(() => {
            const targetCard = document.getElementById(`card-${num}`);
            if (targetCard) {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.style.borderColor = '#5ac8fa';
                setTimeout(() => targetCard.style.borderColor = '', 1500);
            }
        }, 120);
    }

    document.addEventListener('click', () => {
        rocketContainer.classList.remove('menu-open');
    });

    // Initial Load: Start at Clean Visual Cheat Sheet Rules Hub
    updateFavBadge();
    renderVisualRulesHub();
</script>
</body>
</html>
