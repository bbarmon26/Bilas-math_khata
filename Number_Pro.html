<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - English Number Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            /* Royal Premium Colors */
            --bg-grad: linear-gradient(135deg, #0B0E14, #1A1F35, #0B0E14);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --accent-gold: #FFD700;
            --accent-ruby: #FF3366;
            --accent-glow: rgba(255, 215, 0, 0.4);
            --card-radius: 18px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Dynamic Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 15px 20px 20px 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .header-hide { 
            transform: translateY(-110%); 
        }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, var(--accent-gold), #FFAA00, var(--accent-ruby));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px var(--accent-glow);
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 14px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.4s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .search-box:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(20, 20, 30, 0.8);
        }

        .top-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ddd;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }
        .btn.active-mode {
            background: linear-gradient(135deg, var(--accent-gold), #FFAA00);
            color: #000;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Content Container */
        .container { max-width: 900px; margin: 0 auto; padding: 270px 20px 100px 15px; }

        .item-wrapper {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
            scroll-margin-top: 250px;
        }

        /* Left Serial Number */
        .serial { 
            color: var(--accent-gold); 
            font-weight: 800; 
            font-size: 18px; 
            width: 25px; 
            text-align: center;
            flex-shrink: 0;
            text-shadow: 0 2px 5px rgba(255, 215, 0, 0.3);
        }

        /* Ultra Premium Card Design */
        .card {
            flex: 1; /* Takes up all remaining space */
            background: rgba(26, 31, 53, 0.5);
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--accent-gold);
            border-radius: var(--card-radius);
            padding: 20px 25px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            min-width: 0;
        }
        .card:hover { 
            border-color: rgba(255, 215, 0, 0.4); 
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.1);
        }
        .card:active { transform: scale(0.98); }

        /* Left - Center - Right Layout Strict */
        .card-body {
            display: flex;
            flex-direction: row !important; /* Forces row everywhere */
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 0; 
            word-wrap: break-word;
        }

        .left-box { text-align: left; }
        .right-box { text-align: right; }

        .word-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .right-box .word-title {
            color: var(--accent-ruby);
        }

        .word-pronounce {
            font-size: 14px;
            color: var(--accent-gold);
            font-style: italic;
        }

        .word-meaning {
            font-size: 15px;
            color: #A0AABF;
        }

        /* Center Favorite Button */
        .center-fav-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 15px;
            flex-shrink: 0;
        }
        .center-fav-btn:hover { 
            color: #fff; 
            transform: scale(1.15); 
        }
        .center-fav-btn.active { 
            color: var(--accent-ruby); 
            filter: drop-shadow(0 0 8px var(--accent-ruby)); 
        }

        /* Premium Practice Mode Overlay */
        .ans-wrapper {
            position: relative;
            width: 100%;
        }

        .ans-inner {
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ans-wrapper:not(.show) .ans-inner {
            filter: blur(6px);
            opacity: 0.15;
            transform: translateX(15px);
        }

        .ans-wrapper.show .ans-inner {
            filter: blur(0);
            opacity: 1;
            transform: translateX(0);
        }

        .tap-overlay {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: rgba(10, 15, 25, 0.85);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .ans-wrapper:not(.show) .tap-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* ---- STRICT MOBILE SIDE-BY-SIDE FIX ---- */
        @media screen and (max-width: 600px) {
            .container { padding-top: 260px; } 
            .card {
                padding: 15px 15px;
            }
            .word-title {
                font-size: 18px; 
            }
            .word-pronounce {
                font-size: 12px;
            }
            .word-meaning {
                font-size: 13px;
            }
            .center-fav-btn {
                font-size: 22px;
                padding: 0 10px;
            }
            .tap-overlay {
                font-size: 11px;
                padding: 4px 8px;
            }
            .serial { font-size: 16px; width: 20px; }
        }

        /* Rocket Hub */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(11, 14, 20, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-gold); margin-bottom: 15px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .r-circle:hover { background: var(--accent-gold); color: #000; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-ruby); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: linear-gradient(135deg, var(--accent-ruby), #ff0044); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px; transition: 0.3s;}
        .go-btn:hover { box-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 15px var(--accent-glow)); transition: transform 0.3s ease; }
        .rocket-icon:hover { transform: scale(1.1) translateY(-5px); }
        @keyframes slideUp { from { transform: translateY(20px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

    </style>
</head>

        { s: "Brother-in-law", sp: "ব্রাদার-ইন-ল", sb: "শ্যালক / দেবর", p: "Brethren-in-law", pp: "ব্রেদরেন-ইন-ল", pb: "শ্যালকগণ" }
    ];


    let favorites = JSON.parse(localStorage.getItem('bilasNumberFavs')) || [];
    let showFavs = false;
    let currentMode = 'study'; 

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if(mode === 'study') document.getElementById('modeStudy').classList.add('active-mode');
        else document.getElementById('modePractice').classList.add('active-mode');
        
        render();
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const showClass = currentMode === 'study' ? 'show' : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <div class="serial">${index + 1}</div>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="card-body">
                        <!-- Left Side (Singular) -->
                        <div class="word-box left-box">
                            <span class="word-title">${item.s}</span>
                            <span class="word-pronounce">[ ${item.sp} ]</span>
                            <span class="word-meaning">${item.sb}</span>
                        </div>
                        
                        <!-- Center Favorite Button (Replaced Arrow) -->
                        <button class="center-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${index})">❤</button>

                        <!-- Right Side (Plural) -->
                        <div id="ans-${index}" class="word-box right-box ans-wrapper ${showClass}">
                            <div class="ans-inner">
                                <span class="word-title">${item.p}</span>
                                <span class="word-pronounce">[ ${item.pp} ]</span>
                                <span class="word-meaning">${item.pb}</span>
                            </div>
                            <div class="tap-overlay">👁️ Tap to view</div>
                        </div>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasNumberLastRead', index + 1);
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(event, idx) {
        event.stopPropagation();
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasNumberFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if(showFavs) document.getElementById('favViewBtn').classList.add('active-mode');
        else document.getElementById('favViewBtn').classList.remove('active-mode');
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasNumberLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Initial Render
    render();
</script>
