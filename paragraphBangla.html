<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS ACADEMY - বাংলা রচনা ও পত্র সম্ভার</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        :root {
            --bg-pure: #030208;
            --glass-bg: rgba(18, 16, 32, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #9b51e0;
            --accent-gold: #ffbe0b;
            --accent-pink: #ff2a6d;
            --accent-green: #05ffa1;
            --text-main: #f8fafc;
            --text-body: #d1d5db;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-pure);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-bottom: 60px;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(155, 81, 224, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 40%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Top Progress Bar */
        .progress-rail {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 3.5px;
            z-index: 2100;
        }
        .progress-line {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.15s ease-out;
        }

        /* Header */
        .master-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(6, 4, 18, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px 14px 16px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .master-header.hidden { transform: translateY(-110%); }

        .header-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats-chip {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--accent-gold);
            background: rgba(255, 190, 11, 0.1);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 190, 11, 0.25);
        }

        /* Controls Dock */
        .controls-dock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 4px 8px;
        }

        .category-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Hind Siliguri', sans-serif;
        }
        .category-tab-btn:hover { color: #fff; }
        .category-tab-btn.active {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.35);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .dock-divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.1); }

        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14.5px; color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .fav-filter-active { background: rgba(255, 42, 109, 0.2); border-color: var(--accent-pink); color: var(--accent-pink); }

        /* Search Bar */
        .search-panel { display: none; }
        .search-panel.active { display: block; }
        .search-field {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.35);
            background: rgba(18, 16, 32, 0.95);
            color: #fff;
            outline: none;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* Reading Container */
        .app-body {
            max-width: 700px;
            margin: 0 auto;
            padding: 140px 16px 30px 16px;
        }

        /* Reading Card */
        .reader-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 16px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        .reader-card.open {
            border-color: rgba(0, 242, 254, 0.35);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
        }

        .card-header-bar {
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .title-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        .tag-pill {
            align-self: flex-start;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .tag-ভাবসম্প্রসারণ { background: rgba(155, 81, 224, 0.15); color: #c084fc; border: 1px solid rgba(155, 81, 224, 0.3); }
        .tag-পত্র { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 242, 254, 0.3); }
        .tag-অনুচ্ছেদ { background: rgba(255, 190, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 190, 11, 0.3); }

        .card-title {
            font-size: 18.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
            white-space: pre-line;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .fav-heart {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: 0.2s;
        }
        .fav-heart.active { color: var(--accent-pink); filter: drop-shadow(0 0 6px var(--accent-pink)); }

        .arrow-indicator {
            font-size: 14px;
            color: var(--accent-cyan);
            transition: transform 0.3s ease;
        }
        .reader-card.open .arrow-indicator { transform: rotate(180deg); }

        /* Reading Drawer Content */
        .content-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reader-card.open .content-drawer { grid-template-rows: 1fr; }

        .drawer-inner {
            overflow: hidden;
            padding: 0 18px;
            transition: padding 0.3s;
        }
        .reader-card.open .drawer-inner {
            padding: 10px 18px 20px 18px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .body-text {
            font-size: 16.5px;
            line-height: 1.8;
            color: var(--text-body);
            white-space: pre-line;
            text-align: justify;
        }
		/* পত্রের ছক ও ডাকটিকেট স্টাইল */
.content-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 14.5px;
}
.content-table th, .content-table td {
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 8px;
    text-align: center;
}
.content-table th {
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent-cyan);
}
.envelope-box {
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    margin-top: 15px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.25);
    max-width: 420px;
}
.stamp-tag {
    float: right;
    border: 1px dashed var(--accent-gold);
    color: var(--accent-gold);
    padding: 2px 8px;
    font-size: 12px;
}
    </style>
</head>
<body>

<div class="progress-rail"><div id="progressTrack" class="progress-line"></div></div>

<header class="master-header" id="headerNav">
    <div class="header-inner">
        <div class="brand-row">
            <span class="brand-logo">BILAS READER</span>
            <div class="stats-chip" id="countDisplay">০ টি লেখা</div>
        </div>

        <div class="controls-dock">
            <button class="category-tab-btn active" onclick="setCategory('all', this)">সব</button>
            <button class="category-tab-btn" onclick="setCategory('ভাবসম্প্রসারণ', this)">ভাবসম্প্রসারণ</button>
            <button class="category-tab-btn" onclick="setCategory('পত্র', this)">পত্র/আবেদন</button>
            <button class="category-tab-btn" onclick="setCategory('অনুচ্ছেদ', this)">অনুচ্ছেদ</button>
            
            <div class="dock-divider"></div>
            
            <div class="icon-btn" onclick="toggleSearch()" title="খুঁজুন">🔍</div>
            <div class="icon-btn" id="favFilterBtn" onclick="toggleFavs()" title="ফেভারিট">⭐</div>
        </div>

        <div class="search-panel" id="searchPanel">
            <input type="text" id="filterInput" class="search-field" placeholder="শিরোনাম বা বিষয়বস্তু লিখে খুঁজুন..." onkeyup="filterData()">
        </div>
    </div>
</header>

<main class="app-body">
    <div id="readingDeck"></div>
</main>

<script>
    const rawData = [
        {
            category: "ভাবসম্প্রসারণ",
            title: "শৈবাল দিঘিরে বলে উচ্চ করি শির\nলিখে রেখ এক ফোঁটা দিলেম শিশির।",
            content: `পৃথিবীতে এমন কিছু লোক আছে, যারা উপকারীর উপকার স্বীকার করে না। বরং তারা সামান্য উপকার করতে পারলেই, দম্ভভরে তা প্রচার করে বেড়ায়।

দিঘির বিশাল জলরাশির মধ্যে শৈবালের অবস্থান ও অস্তিত্ব। এই শৈবালের ওপর জমেছে ভোরের শিশির। শিশিরের ক্ষুদ্র ফোঁটা গড়িয়ে পড়েছে দিঘির অগাধ জলে। এই সামান্য শিশির-ফোঁটাকে শৈবাল দিঘির প্রতি তার মহৎ দান বলে গণ্য করছে। অথচ দিঘির বিশাল জলরাশির কাছে এক ফোঁটা শিশির অতি তুচ্ছ। দিঘির জলেই যার অস্তিত্ব, সেই দিঘির প্রতি শৈবালের এমন দম্ভোক্তি সত্যি হীনম্মন্যতার পরিচায়ক।

শৈবালের মতো মানবসমাজেও এমন অনেক অকৃতজ্ঞ লোক আছে, যারা পরের দয়া-দাক্ষিণ্য দু হাতে গ্রহণ করে কিন্তু সামান্য উপকার করতে পারলেই মনে করে আমি মহৎ কিছু করে ফেলেছি। প্রকৃতপক্ষে যিনি মহৎ এবং যথার্থ পরোপকারী তিনি অপরের উপকার করে কখনো দম্ভ প্রকাশ করেন না। নিছক আত্মপ্রচারের জন্য নয়, বরং নিঃস্বার্থভাবেই তিনি পরের উপকার করেন।

প্রতিদানের প্রত্যাশা নয়, মানবকল্যাণের জন্য নিঃস্বার্থভাবে পরের উপকার করাই মহৎপ্রাণ ব্যক্তির কাজ।`
        },
        {
            category: "ভাবসম্প্রসারণ",
            title: "কীর্তিমানের মৃত্যু নেই / মানুষ বাঁচে তার কর্মের মধ্যে, বয়সের মধ্যে নহে / জীবনের মূল্য আয়ুতে নহে, কল্যাণ পূত কর্মে",
            content: `দীর্ঘদিন বেঁচে থেকে অনেকে পৃথিবীতে স্মরণীয় হতে পারে না। বরং সংক্ষিপ্ত জীবন যাপন করেও অনেকে ইতিহাসের পাতায় অমর হয়ে আছেন তাদের স্মরণীয় কীর্তির জন্যে।

এ নশ্বর পৃথিবীতে কেউ চিরদিন বেঁচে থাকে না। একদিন না একদিন তাকে পৃথিবী ছেড়ে চলে যেতে হয়। মৃত্যু অমোঘ জেনেও এ সংক্ষিপ্ত জীবনে কেউ কেউ মানবকল্যাণে এমন কিছু কীর্তি রেখে যান, মৃত্যুর পরও যারা মানুষের হৃদয়ে চিরকাল অমর হয়ে থাকেন। সাধারণ মানুষের মৃত্যু হলে পৃথিবীতে কেউ তাকে আর স্মরণ করে না। অথচ কীর্তিমানের মৃত্যু হলে তার শরীরের অবসান হয় বটে কিন্তু তার মহৎ কাজ, অম্লান কীর্তি তাকে বাঁচিয়ে রাখে। কীর্তিমান মানুষের মৃত্যুর শত শত বছর পরেও মানুষ তাকে স্মরণ করে। বায়ান্নর মহান ভাষা-আন্দোলনে শহীদ সালাম, বরকত, রফিক, শফিক, কিংবা মুক্তিযুদ্ধে ত্রিশ লক্ষ শহীদ বাংলার মানুষের হৃদয়ে চিরকাল অমর হয়ে থাকবে। তাদের অম্লান কীর্তি বাঙালি চিরকাল শ্রদ্ধার সঙ্গে স্মরণ করবে।

মানুষের দেহ নশ্বর কিন্তু মহৎ কীর্তি অবিনশ্বর। মৃত্যুর শত শত বছর পরেও কীর্তিমান মানুষের অমর অবদানের কথা মানুষ স্মরণ করে। তাই বলা হয়, কীর্তিমানের মৃত্যু নেই।`
        },
        {
            category: "ভাবসম্প্রসারণ",
            title: "পরিশ্রম সৌভাগ্যের প্রসূতি",
            content: `কোন কিছু অর্জন করতে হলে নিরলস পরিশ্রম ও একনিষ্ঠ সাধনার কোন বিকল্প নেই। পরিশ্রম করেই বিরূপ ভাগ্যকে করায়ত্ত করতে হয়।

ভাগ্যে বিশ্বাসী লোক অলস এবং শ্রমবিমুখ হয়। 'ভাগ্যে থাকলে পাবে'- এই আশায় কেউ বসে থাকলে জীবনে তার কোন উন্নতি হবে না। আসলে সৌভাগ্য নিয়ে কেউ পৃথিবীতে আসে না। কঠিন, কঠোর পরিশ্রম করেই বিরূপ ভাগ্যকে জয় করতে হয়। লক্ষ্য স্থির করে, সঠিক পদ্ধতিতে পরিশ্রম করলে সৌভাগ্য আপনা-আপনি ধরা দেয়। পৃথিবীতে এ পর্যন্ত যারা সফল হয়েছেন, তাদের সাফল্যের নেপথ্যে রয়েছে পরিশ্রমের জাদু। কৃষক ভাগ্যের ওপর বসে থেকে ফসল ফলায় না, তাকে হাড়ভাঙা পরিশ্রম করে, মাথার ঘাম পায়ে ফেলে ফসল উৎপন্ন করতে হয় তেমনি পরিশ্রম ছাড়া দুনিয়াতে ভালো কিছু অর্জিত হয় না।

আধুনিক বিশ্বের উন্নত দেশগুলোর দিকে তাকালে কিংবা তাদের ইতিহাস পর্যালোচনা করলে দেখা যায়, তারা নিরলস পরিশ্রম করেই উন্নতি চরম শিখরে পৌঁছেছে। একমাত্র শ্রমশক্তিই তাদেরকে কাঙ্ক্ষিত সাফল্যের স্বর্ণদ্বারে পৌঁছে দিয়েছে। অন্যদিকে শ্রমবিমুখ, অলস কত যুবক বেকার হয়ে অভিশপ্ত জীবন কাটাচ্ছে।

আশীর্বাদ নিও। গতকাল মায়ের হাতে লেখা একটা চিঠি পেয়ে খুবই উদ্বিগ্ন হলাম। মায়ের চিঠিতে জানতে পারলাম, তোমার ঘনিষ্ঠ বন্ধু সিহাব মাদকাসক্ত। ইদানিং সিহাবের সাথে চলাফেরা করে মূল্যবান সময় নষ্ট করছ, নিয়মিত পড়াশোনা করছ না। পরীক্ষার ফলও আশানুরূপ হচ্ছে না। মা আমার কাছে জানতে চেয়েছে- তুমি মাদকাসক্তির মরণ নেশায় আক্রান্ত হয়েছ কিনা? যদিও আমি মাকে আশ্বস্ত করেছি যে, তোমার পক্ষে এ কাজ করা কোনদিনই সম্ভব নয়। আমার দৃঢ় বিশ্বাস রয়েছে যে, এ বিষয়ে তুমি বেশ সচেতন তবু তোমাকে মাদকাসক্তির কুফল সম্পর্কে স্মরণ করিয়ে দিচ্ছি।

মাদকাসক্তিকে বলা হয় মরণ-নেশা। মৃত্যুই এর অনিবার্য পরিণতি। এই নেশা ধীরে ধীরে স্নায়ুকে দুর্বল করে দেয়। শরীরের প্রতিরোধ-ক্ষমতাকে নিঃশেষ করে দেয়। ক্রমশ ভোঁতা, অসাড় হয় এদের মননশক্তি। এদের খিদে পায় না, ঘুম হয় না, সময়ের বোধ কমে যায়। ওজন কমে যায়। ধীরে ধীরে এক অস্বাভাবিক জীবন্মৃত অবস্থায় পৌঁছে যায়। সর্বোপরি মাদকাসক্তির কুফল অতি মারাত্মক বলে বিবেচনা করা হয়, বিশেষত এ কারণে যে মাদকাসক্ত দেহে ক্ষতির কাজটি চলে ধীরগতিতে। মাদকাসক্ত ব্যক্তির পক্ষে এর প্রতিরোধ গড়ে তোলা সম্ভব হয়ে ওঠে না, ফলে ধীরে ধীরে সে এগিয়ে যায় মৃত্যুর দিকে। তুমি তোমার বন্ধুদেরও এ বিষয়ে সচেতন করে তুলবে বলে আশা করি। তোমার সামনে এসএসসি পরীক্ষা। তাই নিয়মিত পড়ালেখা একান্ত কাম্য।

স্বাস্থ্যের প্রতি বিশেষভাবে নজর দিও। আজ এখানেই শেষ করছি।

    let dataset = [...rawData];
    let savedFavs = JSON.parse(localStorage.getItem('bilas_reader_favs')) || [];
    let currentCategory = 'all';
    let isFavOnly = false;

    // Scroll progress & hide header
    let lastY = 0;
    window.addEventListener('scroll', () => {
        const top = window.scrollY;
        const nav = document.getElementById('headerNav');
        if (top > lastY && top > 80) nav.classList.add('hidden');
        else nav.classList.remove('hidden');
        lastY = top;

        const max = document.documentElement.scrollHeight - window.innerHeight;
        const pct = max > 0 ? (top / max) * 100 : 0;
        document.getElementById('progressTrack').style.width = pct + '%';
    });

    function renderDeck() {
        const container = document.getElementById('readingDeck');
        container.innerHTML = "";

        let filtered = dataset.filter((item, idx) => {
            const matchesCat = currentCategory === 'all' || item.category === currentCategory;
            const matchesFav = !isFavOnly || savedFavs.includes(idx);
            return matchesCat && matchesFav;
        });

        document.getElementById('countDisplay').innerText = `${filtered.length} টি লেখা`;

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:15px;">কোনো লেখা পাওয়া যায়নি!</div>`;
            return;
        }

        filtered.forEach((item, index) => {
            const orgIndex = dataset.indexOf(item);
            const isFav = savedFavs.includes(orgIndex);

            const card = document.createElement('div');
            card.className = 'reader-card';
            card.id = `item-${orgIndex}`;
            card.innerHTML = `
                <div class="card-header-bar" onclick="toggleCard(this)">
                    <div class="title-meta">
                        <span class="tag-pill tag-${item.category}">${item.category}</span>
                        <h3 class="card-title">${item.title}</h3>
                    </div>
                    <div class="card-actions">
                        <span class="fav-heart ${isFav ? 'active' : ''}" onclick="toggleFavItem(event, ${orgIndex})">❤</span>
                        <span class="arrow-indicator">▼</span>
                    </div>
                </div>
                <div class="content-drawer">
                    <div class="drawer-inner">
                        <div class="body-text">${item.content}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggleCard(headerEl) {
        const card = headerEl.closest('.reader-card');
        card.classList.toggle('open');
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.category-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDeck();
    }

    function toggleFavs() {
        isFavOnly = !isFavOnly;
        const btn = document.getElementById('favFilterBtn');
        btn.classList.toggle('fav-filter-active', isFavOnly);
        renderDeck();
    }

    function toggleFavItem(e, idx) {
        e.stopPropagation();
        const pos = savedFavs.indexOf(idx);
        if (pos === -1) savedFavs.push(idx);
        else savedFavs.splice(pos, 1);
        localStorage.setItem('bilas_reader_favs', JSON.stringify(savedFavs));
        renderDeck();
    }

    function toggleSearch() {
        const panel = document.getElementById('searchPanel');
        panel.classList.toggle('active');
        if (panel.classList.contains('active')) document.getElementById('filterInput').focus();
    }

    function filterData() {
        const q = document.getElementById('filterInput').value.toLowerCase();
        document.querySelectorAll('.reader-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    renderDeck();
</script>
