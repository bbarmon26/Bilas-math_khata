<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS ACADEMY | Study Hub PRO</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-dark: #050814;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --mint-green: #10b981;
            --gold-glow: #facc15;
            --switch-pink: #f43f5e;
            --ice-blue: #06b6d4;
            --premium-purple: #8b5cf6;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 12px 100px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #38bdf8, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        header p {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
        }

        /* 💎 ফুল-উইডথ ফোকাসড কার্ড */
        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s ease;
        }

        .topic-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .topic-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-note-mini {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c084fc;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: 0.2s;
        }

        .btn-note-mini:hover {
            background: rgba(139, 92, 246, 0.25);
            color: #fff;
        }

        .del-btn {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: var(--switch-pink);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .del-btn:hover {
            background: var(--switch-pink);
            color: #fff;
        }

        /* 🌟 একক ও বড় মেইন রিডিং প্যানেল */
        .main-read-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--ice-blue);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .read-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .read-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .stat-input-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .stat-mega-input {
            width: 60px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 8px;
            color: #38bdf8;
            font-size: 20px;
            font-weight: 900;
            padding: 2px 6px;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        .stat-mega-input:focus {
            border-color: var(--ice-blue);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.35);
        }

        .stat-total-text {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
        }

        /* পার্সেন্টেজ সামান্য ছোট ট্যাগ আকারে ডানে */
        .inline-percent-badge {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold-glow);
            background: rgba(250, 204, 21, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(250, 204, 21, 0.25);
        }

        /* 🌈 প্রগ্রেস বার */
        .progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #10b981, #facc15);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* ✏️ ভাসমান পেন বাটন */
        .fab-pen {
            position: fixed;
            bottom: 22px;
            right: 18px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--premium-purple), #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 999;
            transition: transform 0.2s;
        }

        .fab-pen:active {
            transform: scale(0.9);
        }

        /* 📱 মডাল পপআপ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #0b1120;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .modal-content h3 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            margin-bottom: 10px;
        }

        .modal-input:focus {
            border-color: var(--ice-blue);
        }

        textarea.modal-input {
            resize: none;
            height: 65px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--mint-green), #059669);
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .view-note-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--premium-purple);
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Study Progress Hub</h1>
        <p>দৈনিক পড়া ও পার্সেন্টেজ লাইভ ট্র্যাকার</p>
    </header>

    <div id="topicList"></div>
</div>

<!-- ✏️ ফ্লোটিং অ্যাকশন বাটন -->
<div class="fab-pen" onclick="openAddModal()" title="নতুন টপিক যোগ করুন">✏️</div>

<!-- 📱 টপিক অ্যাড মডাল -->
<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <h3>নতুন টপিক যোগ করুন</h3>
        <input type="text" id="topicName" class="modal-input" placeholder="টপিকের নাম (যেমন: Voice Change)">
        <input type="number" id="totalQuestions" class="modal-input" placeholder="মোট প্রশ্ন সংখ্যা (যেমন: ১০০)">
        <textarea id="topicNote" class="modal-input" placeholder="নোট বা টিপস (ঐচ্ছিক)..."></textarea>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeAddModal()">বাতিল</button>
            <button class="btn-save" onclick="saveNewTopic()">সেভ করুন</button>
        </div>
    </div>
</div>

<!-- 📱 নোট ভিউ মডাল -->
<div class="modal-overlay" id="noteViewModal">
    <div class="modal-content">
        <h3 id="noteModalTitle">📝 স্টাডি নোট</h3>
        <div class="view-note-text" id="noteModalBody"></div>
        <div class="modal-actions">
            <button class="btn-save" onclick="closeNoteModal()">ঠিক আছে</button>
        </div>
    </div>
</div>

<script>
    let studyData = JSON.parse(localStorage.getItem('bacademy_study_hub_focus')) || [
        { id: 1, title: "Voice Change (Transformation)", total: 100, read: 50, note: "Quasi-passive এবং Imperative নিয়মগুলো ভালো করে রিভিশন দিতে হবে।" }
    ];

    function openAddModal() {
        document.getElementById('addModal').classList.add('active');
        document.getElementById('topicName').focus();
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('active');
        document.getElementById('topicName').value = '';
        document.getElementById('totalQuestions').value = '';
        document.getElementById('topicNote').value = '';
    }

    function viewNote(title, note) {
        document.getElementById('noteModalTitle').innerText = `📝 ${title}`;
        document.getElementById('noteModalBody').innerText = note || "কোনো বিশেষ নোট যোগ করা নেই।";
        document.getElementById('noteViewModal').classList.add('active');
    }

    function closeNoteModal() {
        document.getElementById('noteViewModal').classList.remove('active');
    }

    function saveNewTopic() {
        const title = document.getElementById('topicName').value.trim();
        const total = parseInt(document.getElementById('totalQuestions').value);
        const note = document.getElementById('topicNote').value.trim();

        if (!title || isNaN(total) || total <= 0) {
            alert('সঠিক নাম ও মোট প্রশ্ন সংখ্যা লিখুন!');
            return;
        }

        studyData.push({
            id: Date.now(),
            title: title,
            total: total,
            read: 0,
            note: note || "কোনো বিশেষ নোট নেই।"
        });

        saveAndRender();
        closeAddModal();
    }

    function updateReadCount(id, value) {
        const topic = studyData.find(item => item.id === id);
        if (topic) {
            let readVal = parseInt(value);
            if (isNaN(readVal) || readVal < 0) readVal = 0;
            if (readVal > topic.total) readVal = topic.total;
            topic.read = readVal;
            saveAndRender();
        }
    }

    function deleteTopic(id) {
        if (confirm('টপিকটি মুছে ফেলতে চান?')) {
            studyData = studyData.filter(item => item.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('bacademy_study_hub_focus', JSON.stringify(studyData));
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('topicList');
        listEl.innerHTML = '';

        if (studyData.length === 0) {
            listEl.innerHTML = `<p style="text-align:center; color:#64748b; font-size:13px; margin-top:30px;">কোনো টপিক নেই। ✏️ বাটনে চাপ দিন।</p>`;
            return;
        }

        studyData.forEach(item => {
            const percent = Math.round((item.read / item.total) * 100) || 0;

            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="topic-title">${item.title}</div>
                    <div class="header-actions">
                        <button class="btn-note-mini" onclick="viewNote('${item.title.replace(/'/g, "\\'")}', '${item.note.replace(/'/g, "\\'")}')">📝 নোট</button>
                        <button class="del-btn" onclick="deleteTopic(${item.id})" title="মুছে ফেলুন">✕</button>
                    </div>
                </div>

                <!-- 🌟 মেইন ফোকাস: একক বক্সে পড়া হয়েছে + ডানে পার্সেন্টেজ -->
                <div class="main-read-box">
                    <div class="read-left-group">
                        <span class="read-label">পড়া হয়েছে:</span>
                        <div class="stat-input-row">
                            <input type="number" class="stat-mega-input" min="0" max="${item.total}" value="${item.read}" onchange="updateReadCount(${item.id}, this.value)">
                            <span class="stat-total-text">/ ${item.total}</span>
                        </div>
                    </div>
                    
                    <span class="inline-percent-badge">${percent}% সম্পন্ন</span>
                </div>

                <!-- প্রগ্রেস বার -->
                <div class="progress-track">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    window.onload = renderList;
</script>

</body>
</html>
