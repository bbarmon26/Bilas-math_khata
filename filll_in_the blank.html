        { w: "I shall .......... a cup of tea.", a: "have", p: "আই শ্যাল হ্যাভ আ কাপ অব টি", m: "আমি এক কাপ চা খাব।", e: "নিয়ম: মোডাল অক্সিলিয়ারী ভার্ব <span class='hi-gold'>'shall'</span> এর ঠিক পর পরই সর্বদা মূল ভার্বের বেস ফর্ম (V1) বসে। চা বা খাবার গ্রহণ করা বা খাওয়া অর্থে এখানে বেস ফর্ম হিসেবে <span class='hi-mint'>'have'</span> বসেছে।" },
        { w: "‘Black Death’ is the name of a ..........", a: "plague pandemic", p: "'ব্ল্যাক ডেথ' ইজ দ্য নেইম অব আ প্লেগ প্যান্ডেমিক", m: "‘ব্ল্যাক ডেথ’ হলো একটি প্লেগ মহামারীর নাম।", e: "নিয়ম: এটি একটি সাধারণ জ্ঞান ও ইতিহাসভিত্তিক প্রশ্ন। চতুর্দশ শতকে ইউরোপ ও এশিয়ায় কোটি কোটি মানুষের প্রাণ কেড়ে নেওয়া ইতিহাসের অন্যতম ভয়াবহ মহামারী বা প্লেগ রোগকে চিকিৎসাবিজ্ঞানে <span class='hi-mint'>'plague pandemic'</span> বলা হয়।" },
        { w: "The word ‘florid’ indicates ..........", a: "flower", p: "দ্য ওয়ার্ড 'ফ্লোরিড' ইন্ডিকেটস ফ্লাওয়ার", m: "‘florid’ শব্দটি ফুল বা ফুলের মতো সুসজ্জিত অবস্থাকে নির্দেশ করে।", e: "নিয়ম: ল্যাটিন মূল শব্দ থেকে আসা ইংরেজি অ্যাডজেক্টিভ <span class='hi-gold'>'florid'</span> শব্দের আক্ষরিক অর্থ হলো লালচে, জমকালো বা ফুলেল সুসজ্জিত অবস্থা, যা সরাসরি <span class='hi-mint'>'flower'</span> (ফুল) এর সাথে সম্পৃক্ত।" },
        { w: "To be or not to be, that is the ..........", a: "question", p: "টু বি অর নট টু বি দ্যাট ইজ দ্য কোশ্চেন", m: "ঘটনাটি ঘটবে কি ঘটবে না, সেটাই হলো আসল প্রশ্ন।", e: "নিয়ম: বিশ্বখ্যাত নাট্যকার উইলিয়াম শেক্সপিয়রের 'হ্যামলেট' নাটকের অত্যন্ত জনপ্রিয় এবং বিশ্বখ্যাত একক উক্তি। উক্তির নির্দিষ্ট অবয়ব ধরে রাখতে শূন্যস্থানে নাউন হিসেবে <span class='hi-mint'>'question'</span> বসেছে।" },
        { w: "Into the .......... of death rode the six hundred.", a: "valley", p: "ইনটু দ্য ভ্যালি অব ডেথ রোড দ্য সিক্স হানড্রেড", m: "মৃত্যু উপত্যকার ভেতরে সেই ৬০০ জন যোদ্ধা বীরদর্পে এগিয়ে গিয়েছিলেন।", e: "নিয়ম: বিখ্যাত কবি আলফ্রেড টেনিসনের 'The Charge of the Light Brigade' কবিতার অত্যন্ত জনপ্রিয় একটি ঐতিহাসিক লাইন। কবিতার মূল থিম ও সুনির্দিষ্ট লাইন অনুযায়ী শূন্যস্থানে নাউন হিসেবে <span class='hi-mint'>'valley'</span> বসেছে।" },
        { w: "Climate is a .......... of the environment.", a: "state", p: "ক্লাইমেট ইজ আ স্টেট অব দ্য এনভায়রনমেন্ট", m: "জলবায়ু হলো পরিবেশের একটি দীর্ঘকালীন সামগ্রিক অবস্থা।", e: "নিয়ম: জলবায়ু কোনো তাৎক্ষণিক জিনিস নয়, এটি পরিবেশের একটি দীর্ঘস্থায়ী আবহাওয়াগত পরিস্থিতি। তাই পরিবেশের অবস্থা বা রূপ প্রকাশ করতে এখানে নাউন হিসেবে <span class='hi-mint'>'state'</span> (অবস্থা) শব্দটি বসেছে।" },
        { w: "To stay healthy, we must plan to have a balanced ..........", a: "diet", p: "টু স্টে হ্যালদি উই মাস্ট প্ল্যান টু হ্যাভ আ ব্যালেন্সড ডায়েট", m: "সুস্থ থাকতে আমাদের অবশ্যই একটি সুষম খাদ্য তালিকার পরিকল্পনা করতে হবে।", e: "নিয়ম: শরীর সুস্থ ও রোগমুক্ত রাখার জন্য সুষম খাবার খাওয়া আবশ্যক। ইংরেজিতে সুষম খাদ্য তালিকাকে নির্দিষ্ট মেডিকেল টার্মে সর্বদা <span class='hi-gold'>'balanced diet'</span> বলা হয়।" },
        { w: "Handsome is that handsome ..........", a: "does", p: "হ্যান্ডসাম ইজ দ্যাট হ্যান্ডসাম ডাজ", m: "সুন্দর দেখায় সুন্দর মানুষ নয়, সুন্দর কাজই সুন্দর মানুষের পরিচয় (কাজের ছিরিই আসল ছিরি)।", e: "নিয়ম: এটি ইংরেজি সাহিত্যের একটি অত্যন্ত জনপ্রিয় প্রাচীন প্রবাদ বাক্য (Proverb)। প্রবাদের নিজস্ব অবয়ব ও শেষ ক্রিয়াপদ ধরে রাখতে শূন্যস্থানে থার্ড পারসন সিঙ্গুলার হিসেবে <span class='hi-mint'>'does'</span> বসে।" },
        { w: "The controlling sentence of a paragraph is known as ..........", a: "topic sentence", p: "দ্য কন্ট্রোলিং সেন্টেন্স অব আ প্যারাগ্রাফ ইজ নোন এজ টপিক সেন্টেন্স", m: "একটি প্যারাগ্রাফের মূল নিয়ন্ত্রণকারী বাক্যটিকে 'topic sentence' বলা হয়।", e: "নিয়ম: ইংরেজি রাইটিং বা কম্পোজিশনের নিয়ম অনুযায়ী, একটি প্যারাগ্রাফের শুরুতে যে মূল বাক্যটি পুরো প্যারাগ্রাফের মূল ভাব বা আইডিয়াকে নিয়ন্ত্রণ ও প্রকাশ করে, তাকে লিঙ্গুইস্টিক পরিভাষায় <span class='hi-mint'>'topic sentence'</span> বলা হয়।" },
        { w: "An extra message added at the end of a letter after it is signed is called ..........", a: "postscript", p: "অ্যান এক্সট্রা মেসেজ অ্যাডেড অ্যাট দ্য এন্ড অব আ লেটার আফটার ইট ইজ সাইনড ইজ কল্ড পোস্টস্ক্রিপ্ট", m: "একটি চিঠি স্বাক্ষর করার পর তার শেষে যোগ করা অতিরিক্ত বার্তাটিকে 'postscript' বলা হয়।", e: "নিয়ম: এটি লেটার রাইটিং বা পত্র লিখনের একটি সুনির্দিষ্ট প্রাতিষ্ঠানিক নিয়ম। চিঠি শেষ করে স্বাক্ষর করার পর হুট করে কোনো জরুরি কথা মনে পড়লে নিচে বিশেষ দ্রষ্টব্য বা পুনশ্চ আকারে যা লেখা হয়, তাকে ইংরেজিতে এক কথায় <span class='hi-mint'>'postscript'</span> (সংক্ষেপে P.S.) বলে।" },
        { w: "Julius Caesar was the ruler of Rome about ..........", a: "2000 years ago", p: "জুলিয়াস সিজার ওয়াজ দ্য রুলার অব রোম অ্যাবাউট টু থাউজেন্ড ইয়ার্স অ্যাগো", m: "জুলিয়াস সিজার প্রায় ২০০০ বছর আগে রোমের শাসক ছিলেন।", e: "নিয়ম: এটি প্রাচীন রোমান ইতিহাস ও সাহিত্যের একটি ঐতিহাসিক সাধারণ জ্ঞানভিত্তিক তথ্য। খ্রিষ্টপূর্ব প্রথম শতকে রোমান সাম্রাজ্যের একচ্ছত্র অধিপতি ও মহান শাসক জুলিয়াস সিজার আজ থেকে আনুমানিক <span class='hi-mint'>'2000 years ago'</span> (২০০০ বছর আগে) শাসন করেছিলেন।" }
    ];
    

    let isFavoriteViewOn = false;
    let favoriteList = JSON.parse(localStorage.getItem('bacademy_blank_pro_favs')) || [];

    function toggleFavoriteViewMode() {
        isFavoriteViewOn = !isFavoriteViewOn;
        document.getElementById('favViewBtn').classList.toggle('active-mode', isFavoriteViewOn);
        document.getElementById('favViewBtn').innerText = isFavoriteViewOn ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        renderListEngine();
    }

    function renderListEngine() {
        const listContainer = document.getElementById('main-list');
        listContainer.innerHTML = "";

        blankData.forEach((item, index) => {
            const isItemFav = favoriteList.includes(index);
            if (isFavoriteViewOn && !isItemFav) return;

            const rowNode = document.createElement('div');
            rowNode.className = 'item-wrapper';
            rowNode.id = `cell-item-${index + 1}`;
            
            let dashGuide = item.a.replace(/./g, '&nbsp;'); 
            let cleanSentence = item.w.replace(/\.{2,}/g, ` <span class='dot-placeholder'>${dashGuide}</span> `);

            rowNode.innerHTML = `
                <div class="card" onclick="triggerCardFlip(this, '${item.a}', ${index})">
                    <button class="fav-node-btn ${isItemFav ? 'active' : ''}" onclick="toggleSingleItemFav(event, ${index})">❤️</button>
                    
                    <div class="content-engine">
                        <div class="sentence-node"><span class="inline-serial">${index + 1}.</span>${cleanSentence}</div>
                        
                        <div class="extra-info-box">
                            <p class="pronounce-line"><strong>🗣️</strong> ${item.p}</p>
                            <p class="meaning-line"><strong>👉</strong> ${item.m}</p>
                        </div>
                    </div>
                    
                    <div class="card-controls">
                        <button class="exp-btn" id="btn-exp-${index}" onclick="toggleExplanation(event, ${index})">💡 ব্যাখ্যা দেখুন</button>
                    </div>
                    
                    <div class="explanation-box" id="exp-box-${index}">${item.e}</div>
                </div>
            `;
            listContainer.appendChild(rowNode);
        });
    }

    function toggleSingleItemFav(event, index) {
        event.stopPropagation(); 
        const position = favoriteList.indexOf(index);
        if (position === -1) favoriteList.push(index);
        else favoriteList.splice(position, 1);
        localStorage.setItem('bacademy_blank_pro_favs', JSON.stringify(favoriteList));
        renderListEngine();
    }

    function triggerCardFlip(cardEl, answerText, index) {
        const isRevealed = cardEl.classList.contains('card-revealed');
        const placeholders = cardEl.querySelectorAll('.dot-placeholder');
        
        if (!isRevealed) {
            cardEl.classList.add('card-revealed');
            placeholders.forEach(p => p.innerHTML = ` ${answerText} `);
        } else {
            cardEl.classList.remove('card-revealed');
            document.getElementById(`exp-box-${index}`).style.display = "none";
            document.getElementById(`btn-exp-${index}`).innerText = "💡 ব্যাখ্যা দেখুন";
            placeholders.forEach(p => p.innerHTML = answerText.replace(/./g, '&nbsp;'));
        }
    }

    function toggleExplanation(event, index) {
        event.stopPropagation();
        const expBox = document.getElementById(`exp-box-${index}`);
        const isVisible = expBox.style.display === "block";
        expBox.style.display = isVisible ? "none" : "block";
        event.target.innerText = isVisible ? "💡 ব্যাখ্যা দেখুন" : "❌ বন্ধ করুন";
    }

    function toggleRocketHub() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function jumpToCell() {
        let inputVal = document.getElementById('jumpInput').value;
        let targetEl = document.getElementById(`cell-item-${inputVal}`);
        if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketHub();
        }
    }

    let lastScrollPosition = 0;
    window.addEventListener('scroll', () => {
        let currentScrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        const navHeader = document.getElementById('headerNav');
        
        if (currentScrollPosition > lastScrollPosition && currentScrollPosition > 50) {
            navHeader.classList.add('header-hide'); 
        } else {
            navHeader.classList.remove('header-hide'); 
        }
        lastScrollPosition = currentScrollPosition <= 0 ? 0 : currentScrollPosition;
    }, { passive: true });

    function executeSearchFilter() {
        let searchString = document.getElementById('mainSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(row => {
            row.closest('.item-wrapper').style.display = row.innerText.toLowerCase().includes(searchString) ? "flex" : "none";
        });
    }

    renderListEngine();
</script>
</body>
</html>
