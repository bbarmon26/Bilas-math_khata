            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.98);
            backdrop-filter: blur(20px);
            padding: 10px 20px 20px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-header { text-align: center; padding: 5px 0; }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 14px 25px;
            border-radius: 50px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        .top-btns { display: flex; gap: 10px; justify-content: center; }
        .btn {
            background: var(--glass);
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
        }

        /* Content Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 230px 20px 100px 20px;
        }

        .item-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            scroll-margin-top: 240px;
        }

        .serial { color: var(--neon-blue); font-weight: bold; font-size: 14px; min-width: 20px; opacity: 0.4; }

        /* Stable Glass Card with Overlay Logic */
        .card {
            flex-grow: 1;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .text-trigger {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .sentence { 
            font-size: 22px; 
            color: var(--neon-blue); 
            font-weight: 700; 
            text-align: center;
            transition: opacity 0.3s ease;
            width: 100%;
        }
        
        .faded { opacity: 0.15; }

        .one-word {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(246, 211, 101, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .show-ans {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-btn { font-size: 24px; color: rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Smart Rocket Navigator */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 16, 61, 0.98);
            padding: 25px 12px;
            border-radius: 50px;
            border: 1px solid var(--neon-blue);
            margin-bottom: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;

            width: 50px;
            height: 50px;
            background: #1a103d;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;

            width: 50px;
            height: 40px;
            background: #000;
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 12px;

            transition: 0.3s;

        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        
        if (a.classList.contains('show-ans')) {
            q.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            q.classList.add('faded');
            a.classList.add('show-ans');
        }

    }

        event.stopPropagation();
