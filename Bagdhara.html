<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বাগধারা মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --accent-cyan: #00e5ff;
            --accent-gold: #ffcf54;
            --accent-pink: #ff416c;
            --card-radius: 16px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(0, 229, 255, 0.3);
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .top-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover, .btn.active-mode {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 207, 84, 0.4);
        }
        .btn-cyan { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-cyan.active-mode { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Content Container */
        .container { max-width: 700px; margin: 0 auto; padding: 220px 20px 100px 20px; }

        .item-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
            scroll-margin-top: 230px;
        }

        .serial { 
            color: var(--accent-cyan); 
            font-weight: 700; 
            font-size: 16px; 
            min-width: 25px; 
            padding-top: 15px;
            opacity: 0.7; 
        }

        /* Smart Card Design */
        .card {
            flex-grow: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 15px 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .card:active { transform: scale(0.98); }

        .q-text {
            font-size: 20px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* Answer Details - CSS Grid Smooth Animation */
        .ans-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ans-wrapper.show {
            grid-template-rows: 1fr;
        }

        .ans-details {
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ans-wrapper.show .ans-details {
            opacity: 1;
            transition: opacity 0.4s ease 0.1s;
        }

        .ans-content {
            margin-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            padding-top: 12px;
        }

        .ortho {
            font-size: 17px;
            color: #fff;
            margin-bottom: 6px;
        }
        .ortho strong { color: var(--accent-cyan); }

        .bakko {
            font-size: 15px;
            color: #b3b3c6;
            font-style: italic;
            line-height: 1.4;
        }
        .bakko strong { color: #8e8eb3; font-style: normal; }

        .fav-btn { 
            font-size: 22px; 
            color: rgba(255,255,255,0.1); 
            cursor: pointer; 
            padding-top: 12px;
            transition: 0.3s; 
        }
        .fav-btn.active { 
            color: var(--accent-pink); 
            filter: drop-shadow(0 0 8px var(--accent-pink)); 
        }

        /* Rocket Hub */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(15, 12, 41, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-cyan); margin-bottom: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s ease; }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-pink); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: var(--accent-pink); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px;}
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 10px var(--accent-cyan)); transition: 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

<div class="header-section" id="header">
    <span class="brand-name">বাগধারা মাস্টার প্রো</span>
    <div style="max-width:700px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: কানকাটা, বেহায়া)..." onkeyup="filter()">
        <div class="top-btns">
            <button class="btn btn-cyan active-mode" id="modeStudy" onclick="setMode('study')">📖 স্টাডি মোড</button>
            <button class="btn btn-cyan" id="modePractice" onclick="setMode('practice')">🎯 প্র্যাকটিস মোড</button>
            <button class="btn" id="favViewBtn" onclick="toggleFavView()">⭐ ফেভারিট</button>
            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<script>
    const data = [
        // --- 1 to 40 ---
        { q: "আ আ ক খ", a: "অর্থ: প্রাথমিক জ্ঞান। বাক্য: ছেলেটার কম্পিউটারের আ আ ক খ-ও জানা নেই, সে কীভাবে অফিসে কাজ করবে?" },
        { q: "কানকাটা", a: "অর্থ: বেহায়া। বাক্য: এমন কানকাটা লোকের সাথে তর্ক করে কোনো লাভ নেই।" },
        { q: "টাকার গরম", a: "অর্থ: বিত্তের অহংকার। বাক্য: টাকার গরমে সে আজকাল মাটিতে পা-ই ফেলে না।" },
        { q: "উজানের কই", a: "অর্থ: সহজলভ্য। বাক্য: আজকাল সরকারি চাকরি তো আর উজানের কই নয় যে চাইলেই মিলবে।" },
        { q: "কাকভূষণ্ডি", a: "অর্থ: দীর্ঘজীবী। বাক্য: গ্রামের ওই বৃদ্ধ যেন এক কাকভূষণ্ডি, যুগের পর যুগ বেঁচে আছেন।" },
        { q: "গোকুলের ষাঁড়", a: "অর্থ: স্বেচ্ছাচারী। বাক্য: সারাদিন গোকুলের ষাঁড়ের মতো ঘুরে বেড়ালে পরীক্ষায় পাস করবে কীভাবে?" },
        { q: "ঢাকের বাঁয়া", a: "অর্থ: অপ্রয়োজনীয়। বাক্য: অফিসের কাজে তার ভূমিকা নিছক ঢাকের বাঁয়ার মতো।" },
        { q: "ভূষণ্ডির কাক", a: "অর্থ: দীর্ঘায়ু ব্যক্তি। বাক্য: লোকটা তো দেখছি ভূষণ্ডির কাক, সহজে মরবে বলে মনে হয় না।" },
        { q: "নেই আঁকড়া", a: "অর্থ: একগুঁয়ে। বাক্য: এমন নেই আঁকড়া স্বভাবের মানুষের সাথে কাজ করা খুব কঠিন।" },
        { q: "আঠারো আনা", a: "অর্থ: বাড়াবাড়ি। বাক্য: সব ব্যাপারেই তোমার এমন আঠারো আনা করা ঠিক নয়।" },
        { q: "মিছরির ছুরি", a: "অর্থ: মুখে মধু অন্তরে বিষ। বাক্য: সাবধানে থেকো, লোকটি কিন্তু আস্ত একটা মিছরির ছুরি।" },
        { q: "এক ঘরের গিন্নি", a: "অর্থ: কর্তৃত্ব। বাক্য: সে অফিসে এক ঘরের গিন্নির মতো আচরণ করতে ভালোবাসে।" },
        { q: "বুদ্ধির ঢেঁকি", a: "অর্থ: নির্বোধ। বাক্য: এমন বুদ্ধির ঢেঁকিকে দিয়ে এই জটিল হিসাবের কাজ হবে নিয়োগ।" },
        { q: "চীনা জোঁক", a: "অর্থ: নাছোড়বান্দা। বাক্য: চাকরির খোঁজে ছেলেটা চীনা জোঁকের মতো লেগে আছে।" },
        { q: "কলির কেষ্ট", a: "অর্থ: লম্পট। বাক্য: সমাজের এই কলির কেষ্টদের থেকে দূরে থাকাই ভালো।" },
        { q: "অষ্টরম্ভা", a: "অর্থ: ফাঁকি/কিছুই না। বাক্য: সারাদিন এত খেটেও শেষমেশ জুটল সেই অষ্টরম্ভা।" },
        { q: "নদীকূলে বাস", a: "অর্থ: দুর্ভাবনা/দুশ্চিন্তা। বাক্য: আদালতে মামলা করা মানে তো নদীকূলে বাস করা।" },
        { q: "ছক্কা পাঞ্জা", a: "অর্থ: বড় বড় কথা বলা। বাক্য: কাজ তো কিছু পারো না, শুধু বসে বসে ছক্কা পাঞ্জা হাঁকতে পারো।" },
        { q: "অস্থির পঞ্চক", a: "অর্থ: অপদার্থ। বাক্য: ছেলেটা একটা অস্থির পঞ্চক, কোনো কাজেই তার মন নেই।" },
        { q: "আটক বিটক", a: "অর্থ: ছটফটানি। বাক্য: পরীক্ষার রেজাল্টের আগে এমন আটক বিটক করাটা স্বাভাবিক।" },
        { q: "ডুব মারা", a: "অর্থ: অদৃশ্য হওয়া/পালিয়ে যাওয়া। বাক্য: টাকাটা ধার নিয়েই সে একেবারে ডুব মেরেছে।" },
        { q: "উনপাঁজুরে", a: "অর্থ: অপদার্থ/দুর্বল। বাক্য: এমন উনপাঁজুরে ছেলেকে দিয়ে এই ভারী কাজ হবে না।" },
        { q: "কান খাড়া করা", a: "অর্থ: মনোযোগী হওয়া। বাক্য: নিজের নামে প্রশংসা হচ্ছে শুনে সে কান খাড়া করল।" },
        { q: "পালের গোদা", a: "অর্থ: দলপতি। বাক্য: চোর ধরা পড়েছে, এবার পালের গোদাকে ধরতে হবে।" },
        { q: "অগস্ত্য যাত্রা", a: "অর্থ: চিরদিনের জন্য প্রস্থান। বাক্য: সে গ্রাম ছেড়ে একেবারে অগস্ত্য যাত্রা করেছে।" },
        { q: "ঘোড়ার কামড়", a: "অর্থ: দৃঢ় পণ। বাক্য: ছেলেটার পড়াশোনায় ঘোড়ার কামড় দেখে আমি সত্যি মুগ্ধ।" },
        { q: "ঝড়ো কাক", a: "অর্থ: বিপর্যস্ত। বাক্য: হঠাৎ বৃষ্টিতে ভিজে সে একেবারে ঝড়ো কাক হয়ে গেছে।" },
        { q: "এক লহমা", a: "অর্থ: এক মুহূর্তে। বাক্য: এক লহমায় সে চোখের পলকে গায়েব হয়ে গেল।" },
        { q: "গরজ বড় বালাই", a: "অর্থ: প্রয়োজনে গুরুত্ব। বাক্য: গরজ বড় বালাই, তাই তো এত রাতে তোমার কাছে ছুটে এসেছি।" },
        { q: "চোখের সাঁতার পানি", a: "অর্থ: অতিরিক্ত মায়াকান্না। বাক্য: আর চোখের সাঁতার পানি ফেলে লাভ নেই, তোমার চালাকি ধরে ফেলেছি।" },
        { q: "ঢাকের কাঠি", a: "অর্থ: তোষামোদকারী। বাক্য: বড় সাহেবের সব কথায় সায় দেওয়াই ওই ঢাকের কাঠির প্রধান কাজ।" },
        { q: "পায়া ভারী", a: "অর্থ: অহংকারী। বাক্য: হঠাৎ বড়লোক হয়ে লোকটার পায়া ভারী হয়ে গেছে।" },
        { q: "কলমের এক খোঁচা", a: "অর্থ: লিখিত আদেশ। বাক্য: বসের কলমের এক খোঁচাতেই তার চাকরিটা পাকাপাকি হয়ে গেল।" },
        { q: "অক্ষরে অক্ষরে", a: "অর্থ: যথাযথ। বাক্য: স্যারের নির্দেশ অক্ষরে অক্ষরে পালন করতে হবে।" },
        { q: "অকালে বাদল", a: "অর্থ: অপ্রত্যাশিত বাধা। বাক্য: ভালোই তো কাজ চলছিল, হঠাৎ এ যেন অকালে বাদল নামল।" },
        { q: "কব্জে পাওয়া", a: "অর্থ: বশে আনা। বাক্য: অনেক চেষ্টার পর অবশেষে চোরটাকে কব্জে পাওয়া গেছে।" },

        { q: "একে একুশ করা", a: "অর্থ: অযথা বাড়ানো। বাক্য: সামান্য ঘটনাটাকে একে একুশ করে বড় করার কোনো মানে হয় না।" },

        { q: "চোখ নাচা", a: "অর্থ: শুভ লক্ষণ। বাক্য: সকাল থেকে আমার ডান চোখ নাচছে, মনে হয় ভালো কোনো খবর আসবে।" },
        { q: "থৈ পাওয়া", a: "অর্থ: সীমা পাওয়া। বাক্য: লোকটার পড়াশোনার জ্ঞানের কোনো থৈ পাওয়া যায় না।" },
        { q: "হরিয়ে বিষাদ", a: "অর্থ: আনন্দে হঠাৎ দুঃখ। বাক্য: বিয়ের দিনই দুর্ঘটনার খবরে একেবারে হরিয়ে বিষাদ নেমে এলো।" },
        { q: "কাগজে বাঘ", a: "অর্থ: মিথ্যা জুজু। বাক্য: ওর হুমকিকে ভয় পেয়ো না, ওটা একটা কাগজের বাঘ।" },
        { q: "বাঘের আড়ি", a: "অর্থ: নাছোড়বান্দা। বাক্য: ছেলেটার জেদ তো একদম বাঘের আড়ির মতো, যা ধরবে ছাড়বে না।" },
        { q: "বর্ণচোরা আম", a: "অর্থ: কপট ব্যক্তি। বাক্য: তাকে দেখে ভালো মানুষ মনে হলেও আসলে সে বর্ণচোরা আম।" },
        { q: "ফুটো পয়সার লড়াই", a: "অর্থ: সামান্য বিষয় নিয়ে বিবাদ। বাক্য: সামান্য জমি নিয়ে ভাইয়ে ভাইয়ে এই ফুটো পয়সার লড়াই মানায় না।" },
        { q: "ভাঁড়ের গোবর", a: "অর্থ: অপদার্থ। বাক্য: এমন ভাঁড়ের গোবরকে দিয়ে আমার কোনো কাজ হবে না।" },
        { q: "নাড়িনক্ষত্র", a: "অর্থ: সব খবর। বাক্য: আমি তার নাড়িনক্ষত্র জানি, আমাকে ধোঁকা দেওয়া সহজ নয়।" },
        { q: "কথা চালা", a: "অর্থ: রটনা করা। বাক্য: পাড়ায় পাড়ায় কথা চালা তার পুরোনো স্বভাব।" },
        { q: "সালামের ছুঁচো গেলা", a: "অর্থ: উভয় সংকট। বাক্য: এখন তো আমার সালামের ছুঁচো গেলার মতো অবস্থা, হ্যাঁ বা না কিছুই বলতে পারছি না।" },
        { q: "হাতে জল না গলা", a: "অর্থ: অতি কৃপণ। বাক্য: লোকটার তো হাতে জল গলে না, সে তোমাকে সাহায্য করবে?" },
        { q: "পই পই করে বলা", a: "অর্থ: বারবার বলা। বাক্য: তোমাকে পই পই করে বললাম ওই পথে যেয়ো না, তুমি শুনলে না।" },
        { q: "উনকোটি চৌষট্টি", a: "অর্থ: প্রায় সম্পূর্ণ। বাক্য: কাজ তো উনকোটি চৌষট্টি ভাগ শেষ, আর সামান্যই বাকি।" },
        { q: "গাটের পয়সা", a: "অর্থ: পূর্বে জমানো অর্থ। বাক্য: গাটের পয়সা খরচ করে আমি তার উপকার করতে যাব কেন?" },
        { q: "পুরনো কাসুন্দি ঘাঁটা", a: "অর্থ: অপ্রীতিকর আলোচনা। বাক্য: এখন আর পুরোনো কাসুন্দি ঘেঁটে লাভ নেই, সামনে এগিয়ে চলো।" },
        { q: "হাড়ে বাতাস লাগা", a: "অর্থ: শান্তি পাওয়া। বাক্য: ছেলেটা সরকারি চাকরি পাওয়ায় বৃদ্ধ বাবার হাড়ে বাতাস লেগেছে।" },
        { q: "কনের মাসি বরের পিসি", a: "অর্থ: উভয় কুল রক্ষা করে চলা। বাক্য: বিবাদে কারো পক্ষ না নিয়ে কনের মাসি বরের পিসি হয়ে থাকা তার স্বভাব।" },
        { q: "ওষুধ করা", a: "অর্থ: বশ করা। বাক্য: মনে হচ্ছে লোকটা তাকে ওষুধ করেছে, নাহলে এত কথা শুনবে কেন?" },
        { q: "ফোড়ন দেওয়া", a: "অর্থ: টিপ্পনি কাটা। বাক্য: আমি যখন কথা বলব, তখন তুমি মাঝে ফোড়ন দেবে না।" },
        { q: "পটের বিবি", a: "অর্থ: সুসজ্জিত। বাক্য: সারাদিন পটের বিবি হয়ে বসে থাকলে তো ঘরের কাজ হবে না।" },
        { q: "আস্তাকুঁড়ের পাতা", a: "অর্থ: নিচ ব্যক্তি। বাক্য: আস্তাকুঁড়ের পাতা হয়ে তুমি এমন সম্মানজনক কথা বলছ?" },
        { q: "মাছি মারা কেরানি", a: "অর্থ: অবিকল অনুসরণ। বাক্য: সে একজন মাছি মারা কেরানি, নিজের কোনো বুদ্ধিশুদ্ধি প্রয়োগ করে না।" },
                { q: "সবেধন নীলমণি", a: "অর্থ: একমাত্র অবলম্বন। বাক্য: বিধবা মায়ের সবেধন নীলমণি ওই একটিমাত্র ছেলে।" },
        { q: "ঘাম দিয়ে জ্বর ছাড়া", a: "অর্থ: বিপদ থেকে রক্ষা পাওয়া। বাক্য: পুলিশ আসল চোরকে ধরায় নির্দোষ লোকটার ঘাম দিয়ে জ্বর ছাড়ল।" },
        { q: "টোপ ফেলা", a: "অর্থ: প্রলুব্ধ করা। বাক্য: প্রতারক চক্রটি বেশি লাভের টোপ ফেলে মানুষের টাকা হাতিয়ে নিচ্ছে।" },
        { q: "রাঘব বোয়াল", a: "অর্থ: সর্বগ্রাসী ক্ষমতাবান ব্যক্তি। বাক্য: চুনোপুঁটিরা ধরা পড়লেও রাঘব বোয়ালরা সবসময় অধরাই থেকে যায়।" },
        { q: "মুখের খই ফোটা", a: "অর্থ: অনর্গল কথা বলা। বাক্য: সুযোগ পেলেই মেয়েটির মুখে কথার খই ফোটে।" },
        { q: "আদিখ্যেতা", a: "অর্থ: ন্যাকামি/বাড়াবাড়ি। বাক্য: সামান্য বিষয়ে এত আদিখ্যেতা করার কোনো মানে হয় না।" },
        { q: "মাথার মণি", a: "অর্থ: অত্যন্ত প্রিয় ব্যক্তি। বাক্য: ভালো ব্যবহারের জন্য সে গ্রামের সবার মাথার মণি হয়ে আছে।" },
        { q: "ছাদনাতলা", a: "অর্থ: বিয়ের মণ্ডপ। বাক্য: অবশেষে অনেক বাধা পেরিয়ে বর-কনে ছাদনাতলায় এসে দাঁড়াল।" },
        { q: "পথ ধরা", a: "অর্থ: প্রস্থান করা। বাক্য: এখানে তোমার কোনো কাজ নেই, এবার নিজের পথ ধরো।" },
        { q: "ছিঁচকাঁদুনে", a: "অর্থ: অল্পতেই যে কাঁদে। বাক্য: এমন ছিঁচকাঁদুনে ছেলেকে নিয়ে তো মহা বিপদ!" },
        { q: "অষ্ট প্রহর", a: "অর্থ: দিনরাত/সারাক্ষণ। বাক্য: ছেলেটা অষ্ট প্রহর শুধু মোবাইল নিয়েই পড়ে থাকে।" },
        { q: "আচমভূয়ার বোঝা", a: "অর্থ: অযথা ঝামেলা বা বোঝা। বাক্য: নিজের কাজ নেই, অন্যের আচমভূয়ার বোঝা ঘাড়ে নিচ্ছ কেন?" },
        { q: "জোটের পায়রা", a: "অর্থ: এক মতের অনুসারী বন্ধু। বাক্য: ওরা দুজন তো জোটের পায়রা, সব জায়গায় একসাথেই যায়।" },
        { q: "চোখের পর্দা", a: "অর্থ: লজ্জা। বাক্য: লোকটার চোখের পর্দা বলতে কিছু নেই, এত অপমানের পরও বসে আছে।" },
        { q: "কান ভাঙানো", a: "অর্থ: কুপরামর্শ দেওয়া। বাক্য: অন্যের নামে কান ভাঙানো তার পুরোনো স্বভাব।" },
        { q: "ঢাকায় উৎপন্ন", a: "অর্থ: খাঁটি বা অতি চালাক। বাক্য: সে তো দেখছি ঢাকায় উৎপন্ন, তাকে ঠকানো এত সহজ নয়।" },
        { q: "তেলা মাথায় তেল দেওয়া", a: "অর্থ: যার আছে তাকেই দেওয়া। বাক্য: গরিবকে সাহায্য না করে তেলা মাথায় তেল দেওয়া সমাজের রীতি হয়ে দাঁড়িয়েছে।" },
        { q: "ধর্মের ঢাক আপনি বাজে", a: "অর্থ: সত্য নিজে থেকেই প্রকাশ পায়। বাক্য: শত চেষ্টা করেও অপরাধ লুকাতে পারবে না, ধর্মের ঢাক আপনি বাজে।" },
        { q: "আপন ঢাক আপনি বাজানো", a: "অর্থ: নিজের প্রশংসা নিজে করা। বাক্য: আপন ঢাক আপনি বাজানো বুদ্ধিমানের কাজ নয়।" },
        { q: "এক হাতে তালি বাজে না", a: "অর্থ: এক পক্ষের দোষে বিবাদ হয় না। বাক্য: ওদের দুজনেরই দোষ আছে, কারণ এক হাতে তো আর তালি বাজে না।" },
        { q: "পিঁড়িতে বসে পেঁড়োর খবর", a: "অর্থ: ঘরে বসে দূরের খবর নেওয়া। বাক্য: তুমি তো দেখছি পিঁড়িতে বসে পেঁড়োর খবর রাখো!" },
        { q: "তালপুকুর", a: "অর্থ: নামে বড় কিন্তু বাস্তবে নেই। বাক্য: নাম তার তালপুকুর, অথচ তাতে ঘটি ডোবে না।" },
        { q: "ঘটি ডোবে না নামে", a: "অর্থ: সামান্য পরিমাণ। বাক্য: নামের এত বাহার, অথচ ঘটি ডোবে না নামে তালপুকুর অবস্থা।" },
        { q: "নখ নাড়া", a: "অর্থ: তাচ্ছিল্য করা। বাক্য: গরিব বলে এভাবে নখ নেড়ে অপমান করা ঠিক নয়।" },
        { q: "হাত কলমে", a: "অর্থ: বাস্তবে বা সরাসরি। বাক্য: সে কাজটা শুধু মুখেই বলেনি, হাত কলমে করেও দেখিয়েছে।" },
        { q: "ষোল কড়াই কানা", a: "অর্থ: সম্পূর্ণ ব্যর্থ। বাক্য: তার সব পরিকল্পনাই তো দেখছি ষোল কড়াই কানা।" },
        { q: "মাৎসন্যায়", a: "অর্থ: অরাজকতা। বাক্য: দেশে উপযুক্ত আইনের অভাবে মাৎসন্যায় শুরু হয়েছে।" },
        { q: "স্বখাত সলিল", a: "অর্থ: নিজের বিপদ নিজে ডেকে আনা। বাক্য: এমন দুর্জনদের সাথে মিশে সে স্বখাত সলিলে ডুবেছে।" },
        { q: "অচলায়তন", a: "অর্থ: সংস্কারাচ্ছন্ন পরিবেশ। বাক্য: আমাদের সমাজটাকে এই অচলায়তন থেকে মুক্ত করতে হবে।" },
        { q: "আঁটকুড়ো", a: "অর্থ: নিঃসন্তান। বাক্য: আঁটকুড়ো বলে লোকটাকে সমাজে অনেক গঞ্জনা সইতে হয়।" },
        { q: "স-সে-মি-রা অবস্থা", a: "অর্থ: কিংকর্তব্যবিমূঢ় অবস্থা। বাক্য: হঠাৎ বিপদের কথা শুনে তার স-সে-মি-রা অবস্থা হয়ে গেল।" },
        { q: "রাজযোটক", a: "অর্থ: উপযুক্ত মিলন। বাক্য: পাত্র-পাত্রী দুজনেই উচ্চশিক্ষিত, একেবারে রাজযোটক।" },

    let favorites = JSON.parse(localStorage.getItem('bilasBagdharaFavs')) || [];
    let showFavs = false;
    let currentMode = 'study'; // 'study' or 'practice'

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if(mode === 'study') {
            document.getElementById('modeStudy').classList.add('active-mode');
        } else {
            document.getElementById('modePractice').classList.add('active-mode');
        }
        render();
    }

    function parseAnswer(text) {
        let ortho = text;
        let bakko = "";
        if (text.includes("বাক্য:")) {
            let parts = text.split("বাক্য:");
            ortho = parts[0].replace("অর্থ:", "").trim();
            bakko = parts[1].trim();
        } else {
            ortho = text.replace("অর্থ:", "").trim();
        }
        return { ortho, bakko };
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const { ortho, bakko } = parseAnswer(item.a);
            const showClass = currentMode === 'study' ? 'show' : '';
            const sentenceHtml = bakko ? `<div class="bakko"><strong>বাক্য:</strong> ${bakko}</div>` : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="q-text">${item.q}</div>
                    <div id="ans-${index}" class="ans-wrapper ${showClass}">
                        <div class="ans-details">
                            <div class="ans-content">
                                <div class="ortho"><strong>অর্থ:</strong> ${ortho}</div>
                                ${sentenceHtml}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasBagdharaLastRead', index + 1);
        
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(idx) {
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasBagdharaFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if(showFavs) {
            document.getElementById('favViewBtn').classList.add('active-mode');
        } else {
            document.getElementById('favViewBtn').classList.remove('active-mode');
        }
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasBagdharaLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Initial Render
    render();
</script>
</body>
</html>
