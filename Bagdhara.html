<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বাগধারা মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --accent-cyan: #00e5ff;
            --accent-gold: #ffcf54;
            --accent-pink: #ff416c;
            --card-radius: 16px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(0, 229, 255, 0.3);
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .top-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover, .btn.active-mode {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 207, 84, 0.4);
        }
        .btn-cyan { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-cyan.active-mode { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Content Container */
        .container { max-width: 700px; margin: 0 auto; padding: 220px 20px 100px 20px; }

        .item-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
            scroll-margin-top: 230px;
        }

        .serial { 
            color: var(--accent-cyan); 
            font-weight: 700; 
            font-size: 16px; 
            min-width: 25px; 
            padding-top: 15px;
            opacity: 0.7; 
        }

        /* Smart Card Design */
        .card {
            flex-grow: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 15px 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .card:active { transform: scale(0.98); }

        .q-text {
            font-size: 20px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* Answer Details - CSS Grid Smooth Animation */
        .ans-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ans-wrapper.show {
            grid-template-rows: 1fr;
        }

        .ans-details {
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ans-wrapper.show .ans-details {
            opacity: 1;
            transition: opacity 0.4s ease 0.1s;
        }

        .ans-content {
            margin-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            padding-top: 12px;
        }

        .ortho {
            font-size: 17px;
            color: #fff;
            margin-bottom: 6px;
        }
        .ortho strong { color: var(--accent-cyan); }

        .bakko {
            font-size: 15px;
            color: #b3b3c6;
            font-style: italic;
            line-height: 1.4;
        }
        .bakko strong { color: #8e8eb3; font-style: normal; }

        .fav-btn { 
            font-size: 22px; 
            color: rgba(255,255,255,0.1); 
            cursor: pointer; 
            padding-top: 12px;
            transition: 0.3s; 
        }
        .fav-btn.active { 
            color: var(--accent-pink); 
            filter: drop-shadow(0 0 8px var(--accent-pink)); 
        }

        /* Rocket Hub */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(15, 12, 41, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-cyan); margin-bottom: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s ease; }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-pink); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: var(--accent-pink); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px;}
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 10px var(--accent-cyan)); transition: 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

<div class="header-section" id="header">
    <span class="brand-name">বাগধারা মাস্টার প্রো</span>
    <div style="max-width:700px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: কানকাটা, বেহায়া)..." onkeyup="filter()">
        <div class="top-btns">
            <button class="btn btn-cyan active-mode" id="modeStudy" onclick="setMode('study')">📖 স্টাডি মোড</button>
            <button class="btn btn-cyan" id="modePractice" onclick="setMode('practice')">🎯 প্র্যাকটিস মোড</button>
            <button class="btn" id="favViewBtn" onclick="toggleFavView()">⭐ ফেভারিট</button>
            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<script>
    const data = [
         { q: "অর্ধচন্দ্র", a: "অর্থ: গলাধাক্কা দেওয়া। বাক্য: অসদাচরণের জন্য দারোয়ান লোকটিকে অর্ধচন্দ্র দিয়ে বের করে দিল।" },
 { q: "ইতরবিশেষ", a: "অর্থ: পার্থক্য। বাক্য: সবার সাথে সমান আচরণ করো, কোনো ইতরবিশেষ করো না।" },
 { q: "একাদশে বৃহস্পতি", a: "অর্থ: সৌভাগ্যের বিষয়। বাক্য: লটারিতে প্রথম পুরস্কার পেয়ে তার এখন একাদশে বৃহস্পতি।" },
 { q: "আটকপালে", a: "অর্থ: হতভাগ্য। বাক্য: আমার মতো আটকপালে মানুষের কপালে এমন সুখ সইবে কেন?" },
 { q: "গাছপাথর", a: "অর্থ: হিসাব-নিকাশ। বাক্য: তার বিষয়-সম্পত্তির কোনো গাছপাথর নেই।" },
 { q: "কাক-ভূশুণ্ডি", a: "অর্থ: দীর্ঘায়ু ব্যক্তি। বাক্য: গ্রামের কাক-ভূশুণ্ডি বৃদ্ধ মানুষটি বহু ইতিহাসের সাক্ষী।" },
 { q: "গোঁফখেজুরে", a: "অর্থ: নিতান্ত অলস। বাক্য: গোঁফখেজুরে লোকের দ্বারা কোনো কঠিন কাজ সম্পন্ন হবে না।" },
 { q: "চাঁদের হাট", a: "অর্থ: প্রিয়জন সমাগম। বাক্য: ঈদের ছুটিতে আমাদের বাড়িতে যেন চাঁদের হাট বসেছে।" },
 { q: "ঢাকের কাঠি", a: "অর্থ: মোসাহেব/তোষামুদে। বাক্য: বড়কর্তার ঢাকের কাঠি হয়ে পদোন্নতি পাওয়ার চেষ্টা করো না।" },
 { q: "ঠোঁটকাটা", a: "অর্থ: স্পষ্টভাষী। বাক্য: রহিম সোজাসাপ্টা কথা বলে, সে বড়ই ঠোঁটকাটা স্বভাবের।" },
 { q: "ঢাকের বাঁয়া", a: "অর্থ: যার কোন মূল্য নেই। বাক্য: কমিটিতে আমাকে কেবল ঢাকের বাঁয়া করে রাখা হয়েছে।" },
 { q: "নিরানব্বইয়ের ধাক্কা", a: "অর্থ: সঞ্চয়ের প্রবৃত্তি। বাক্য: নিরানব্বইয়ের ধাক্কায় পড়ে সে দিনরাত শুধু টাকার পেছনে ছুটছে।" },
 { q: "ব্যাঙের সর্দি", a: "অর্থ: অসম্ভব ঘটনা। বাক্য: তার মতো ভীরু মানুষ সাহস দেখাবে? এ তো ব্যাঙের সর্দি।" },
 { q: "শরতের শিশির", a: "অর্থ: সুসময়ের বন্ধু। বাক্য: শরতের শিশিরের মতো বন্ধুরা বিপদের দিনে পাশে থাকে না।" },
 { q: "শিবরাত্রির সলতে", a: "অর্থ: একমাত্র সন্তান। বাক্য: ছেলেটি তার বৃদ্ধা মায়ের শিবরাত্রির সলতে।" },
 { q: "সপ্তকাণ্ড রামায়ণ", a: "অর্থ: বৃহৎ বিষয়। বাক্য: সামান্য ঘটনা নিয়ে সপ্তকাণ্ড রামায়ণ ফাঁদার কোনো মানে হয় না।" },
 { q: "হাতভারী", a: "অর্থ: কৃপণ। বাক্য: হাতভারী লোকটির কাছ থেকে কোনো সাহায্য আশা করা বৃথা।" },
 { q: "রামগরুড়ের ছানা", a: "অর্থ: গোমড়ামুখো লোক। বাক্য: সবসময় রামগরুড়ের ছানার মতো মুখ গোমড়া করে থেকো না।" },
 { q: "রাবণের চিতা", a: "অর্থ: চির অশান্তি। বাক্য: পারিবারিক কলহে তাদের সংসারে রাবণের চিতা জ্বলছে।" },
 { q: "অরণ্যে রোদন", a: "অর্থ: নিষ্ফল আবেদন। বাক্য: কঠোর হৃদয়ের মানুষের কাছে আকুতি জানানো অরণ্যে রোদন মাত্র।" },
 { q: "গড্ডলিকা প্রবাহ", a: "অর্থ: অন্ধ অনুকরণ। বাক্য: নিজের বুদ্ধি খাটাও, গড্ডলিকা প্রবাহে গা ভাসিও না।" },
 { q: "দুধের মাছি", a: "অর্থ: সুসময়ের বন্ধু। বাক্য: টাকা-পয়সা ফুরিয়ে গেলে দুধের মাছির মতো বন্ধুরা কেটে পড়ে।" },
 { q: "তাল পাতার সেপাই", a: "অর্থ: ক্ষীণজীবী। বাক্য: তাল পাতার সেপাই হয়ে পালোয়ানের সাথে লড়াই করতে যেও না।" },
 { q: "আকাশ পাতাল", a: "অর্থ: প্রচুর ব্যবধান। বাক্য: তোমার কথায় ও কাজে আকাশ পাতাল তফাত রয়েছে।" },
 { q: "হাত ভারি", a: "অর্থ: কৃপণ। বাক্য: তিনি হাত ভারি মানুষ, সহজে কাউকে এক পয়সাও দেন না।" },
 { q: "উত্তম মধ্যম", a: "অর্থ: প্রহার। বাক্য: চোরটাকে হাতেনাতে ধরে জনতা উত্তম মধ্যম দিল।" },
 { q: "ভরাডুবি", a: "অর্থ: সর্বনাশ। বাক্য: ব্যবসায় বড় লোকসান হয়ে তার সংসারে ভরাডুবি ঘটেছে।" },
 { q: "গোড়ায় গলদ", a: "অর্থ: শুরুতেই ভুল। বাক্য: কাজের গোড়ায় গলদ থাকলে সফল হওয়া অসম্ভব।" },
 { q: "অকাল কুষ্মাণ্ড", a: "অর্থ: অপদার্থ। বাক্য: এমন অকাল কুষ্মাণ্ড ছেলেকে দিয়ে কোনো দায়িত্ব পালন হবে না।" },
 { q: "কেতাদুরস্ত", a: "অর্থ: পরিপাটি। বাক্য: পোশাক-আশাকে সে বেশ কেতাদুরস্ত হলেও মনটা অহংকারী।" },
 { q: "অমাবস্যার চাঁদ", a: "অর্থ: দুর্লভ বস্তু। বাক্য: চাকরি পেয়ে তুমি তো একেবারে অমাবস্যার চাঁদ হয়ে গেছ।" },
 { q: "ব্যাঙের আধুলি", a: "অর্থ: সামান্য সম্পদ। বাক্য: ব্যাঙের আধুলি সম্বল করে সে বিদেশে ব্যবসা করতে গেছে।" },
 { q: "পায়ভারী", a: "অর্থ: অহংকার। বাক্য: বড় চাকরি পেয়ে লোকটির কেমন যেন পায়ভারী হয়েছে।" },
 { q: "বালির বাঁধ", a: "অর্থ: ক্ষণস্থায়ী। বাক্য: অন্যায়ের ওপর গড়ে ওঠা সম্পর্ক বালির বাঁধের মতো ভেঙে যায়।" },
 { q: "যক্ষের ধন", a: "অর্থ: কৃপণের অর্থ। বাক্য: কৃপণ ব্যক্তি যক্ষের ধনের মতো টাকা আগলে রাখে।" },
 { q: "ষোল আনা", a: "অর্থ: পুরোপুরি। বাক্য: তোমার যুক্তিতে ষোল আনা সত্যতা রয়েছে।" },
 { q: "মাকাল ফল", a: "অর্থ: অন্তঃসারশূন্য। বাক্য: বাইরে দেখতে ভালো হলেও লোকটি আসলে মাকাল ফল।" },
 { q: "বিষবৃক্ষ", a: "অর্থ: অনাচারের উৎস। বাক্য: সমাজে দুর্নীতিরূপ বিষবৃক্ষকে সমূলে বিনাশ করতে হবে।" },

 { q: "বারো সতেরো", a: "অর্থ: খুঁটিনাটি। বাক্য: সংসারের বারো সতেরো খুঁটিনাটি সমস্যা নিয়ে ভেবে কষ্ট পেয়ো না।" },
 { q: "অক্ষয় বট", a: "অর্থ: প্রাচীন ব্যক্তি। বাক্য: তিনি আমাদের পরিবারের প্রাচীন অভিভাবক ও অক্ষয় বট।" },
 { q: "কানাকড়ি", a: "অর্থ: অতি নগণ্য পরিমাণ। বাক্য: এই ভাঙা জিনিসের জন্য কেউ এক কানাকড়িও দেবে না।" },
 { q: "একই খুড়ে মাথা কামানো", a: "অর্থ: একই স্বভাবের। বাক্য: চোরেরা সবাই একই খুড়ে মাথা কামানো, একজনের চেয়ে আরেকজন ধূর্ত।" },
 { q: "আকাশ থেকে পড়া", a: "অর্থ: অপ্রত্যাশিত। বাক্য: তার মুখে এমন আজব প্রস্তাব শুনে আমি যেন আকাশ থেকে পড়লাম।" },
 { q: "সাত সতের", a: "অর্থ: বিচিত্র রকমের। বাক্য: সাত সতের নানা বিচিত্র ভাবনায় তার ঘুম ভেঙে গেল।" },
 { q: "অহিনকুল", a: "অর্থ: ভীষণ শত্রুতা। বাক্য: দুই পরিবারের মাঝে পুরুষানুক্রমিক অহিনকুল শত্রুতা চলছে।" },
 { q: "পোয়াবারো", a: "অর্থ: সৌভাগ্য। বাক্য: ব্যবসায় হঠাৎ বড় সুযোগ পাওয়ায় তার এখন পোয়াবারো।" },
 { q: "আঁকু পাঁকু করা", a: "অর্থ: ছটফট করা। বাক্য: দেরি হয়ে যাচ্ছে দেখে সে দ্রুত বের হওয়ার জন্য আঁকু পাঁকু করছে।" },
 { q: "হরিঘোষের গোয়াল", a: "অর্থ: বহু অপদার্থ ব্যক্তির সমাবেশ। বাক্য: অপদার্থদের ভিড়ে দপ্তরটি হরিঘোষের গোয়ালে রূপ নিয়েছে।" },
 { q: "জুতো সেলাই থেকে চন্ডি পাঠ", a: "অর্থ: ছোটবড় সব কাজ। বাক্য: সব দায়িত্ব একাই পালন করে সে জুতো সেলাই থেকে চন্ডি পাঠ করছে।" },
 { q: "ফতো নবাব", a: "অর্থ: সম্বলহীনের বড়লোকি ভাব। বাক্য: পকেটে টাকা নেই অথচ ফতো নবাবের মতো চালচলন দেখায়।" },
 { q: "গড্ডালিকা প্রবাহ", a: "অর্থ: অন্ধ অনুকরণ। বাক্য: নিজের বুদ্ধি না খাটিয়ে গড্ডালিকা প্রবাহে গা ভাসিও না।" },
 { q: "কেতা দুরন্ত", a: "অর্থ: পরিপাটি। বাক্য: তার পরিপাটি ও কেতা দুরন্ত পোশাক সবাইকে মুগ্ধ করে।" },
 { q: "ঝাকের কৈ", a: "অর্থ: এক দলভুক্ত। বাক্য: তারা সবাই একই দলের ও একই ঝাকের কৈ।" },
 { q: "ইতর-বিশেষ", a: "অর্থ: পার্থক্য। বাক্য: সবার প্রতি সদয় হও, মানুষে মানুষে কোনো ইতর-বিশেষ কোরো না।" },
 { q: "কাকভূশুণ্ডি", a: "অর্থ: দীর্ঘজীবী। বাক্য: শতবর্ষী কাকভূশুণ্ডির মতো তিনি বহু যুগের ইতিহাস দেখেছেন।" },
 { q: "গোকুলের ষাঁড়", a: "অর্থ: স্বেচ্ছাচারী। বাক্য: গোকুলের ষাঁড়ের মতো কারও কোনো বাধা না মেনে চললে বিপদ অনিবার্য।" },
 { q: "এক ঘরের গিন্নি", a: "অর্থ: কর্তৃত্ব। বাক্য: এক ঘরের গিন্নির মতো মা পুরো পরিবারের সবকিছু দেখাশোনা করেন।" },
 { q: "চীনা জোঁক", a: "অর্থ: নাছোড়বান্দা। বাক্য: চীনা জোঁকের মতো নাছোড়বান্দা হয়ে সে পাওনা টাকা আদায় করল।" },
 { q: "কলির কেষ্ট", a: "অর্থ: লম্পট। বাক্য: চরিত্রহীন এমন কলির কেষ্টকে বিশ্বাস করা বোকামি।" },
 { q: "নদীকূলে বাস", a: "অর্থ: দুর্ভাবনা/দুশ্চিন্তা। বাক্য: নদীকূলে বাসের মতো সবসময় তার মনে অজানা বিপদের দুশ্চিন্তা থাকে।" },
 { q: "ছক্কা পাঞ্জা", a: "অর্থ: বড় বড় কথা বলা। বাক্য: ছক্কা পাঞ্জা করে বড়াই না করে সততার সাথে কাজ করো।" },
 { q: "অস্থির পঞ্চক", a: "অর্থ: অপদার্থ। বাক্য: এমন অস্থির পঞ্চক অপদার্থকে দিয়ে কোনো বড় কাজ হবে না।" },
 { q: "অটক বিটক", a: "অর্থ: ছটফটানি। বাক্য: ব্যথায় কাতর হয়ে রোগী বিছানায় অটক বিটক করতে লাগল।" },
 { q: "ডুবমারা", a: "অর্থ: অদৃশ্য হওয়া। বাক্য: টাকা ধার নেওয়ার পর থেকেই লোকটি ডুবমেরে বসে আছে।" },
 { q: "কান খাড়া করা", a: "অর্থ: মনোযোগী হওয়া। বাক্য: গুরুত্বপূর্ণ কথা শুনে সবাই কান খাড়া করে শুনল।" },
 { q: "এক লহমা", a: "অর্থ: এক মুহূর্তে। বাক্য: এক লহমায় অগ্নিকাণ্ডে দোকানটি ভস্মীভূত হয়ে গেল।" },
 { q: "চোখের সাঁতার পানি", a: "অর্থ: অতিরিক্ত মায়াকান্না। বাক্য: চোখের সাঁতার পানি ফেলে সে নিজেকে নির্দোষ প্রমাণের চেষ্টা করছে।" },
 { q: "পায়া ভারী", a: "অর্থ: অহংকারী। বাক্য: বড় অফিসার হয়ে তার চলনে-বলনে পায়া ভারী ভাব দেখা যাচ্ছে।" },
 { q: "অক্ষরে অক্ষরে", a: "অর্থ: যথাযথ। বাক্য: তিনি পিতার শেষ উপদেশ অক্ষরে অক্ষরে পালন করেছেন।" },
 { q: "কন্ধে পাওয়া", a: "অর্থ: পাত্তা পাওয়া। বাক্য: তার মতো বিশিষ্ট পণ্ডিতের কাছে সাধারণের কন্ধে পাওয়া কঠিন।" },
 { q: "গা ঢাকা দেওয়া'", a: "অর্থ: আত্মগোপন। বাক্য: পুলিশের ভয়ে পলাতক আসামি কিছুদিন গা ঢাকা দিয়ে রইল।" },
 { q: "রাঙা মুলো", a: "অর্থ: সুন্দর কিন্তু গুণহীন। বাক্য: বাইরে দেখতে সুন্দর হলেও গুণহীন মানুষ আসলে রাঙা মুলো।" },
 { q: "অজগরবৃত্তি", a: "অর্থ: আলসেমি। বাক্য: অজগরবৃত্তির মতো আলসেমি করে কোনোদিন জীবনে উন্নতি করা যায় না।" },
 { q: "কাঁচা ঢিলা", a: "অর্থ: অসাবধানতা। বাক্য: কাঁচা ঢিলা ও অসাবধান লোকের হাতে গুরুত্বপূর্ণ নথি দেওয়া ঠিক নয়।" },
 { q: "অগ্রপশ্চাৎ", a: "অর্থ: ভেবে-চিন্তে। বাক্য: অগ্রপশ্চাৎ ভালো-মন্দ না ভেবে কোনো কাজে হাত দেওয়া উচিত নয়।" },
 { q: "জিলাপীর প্যাঁচ", a: "অর্থ: কুটিলতা। বাক্য: কুটিল মানুষের কথার ভেতরের জিলাপীর প্যাঁচ সহজে বোঝা যায় না।" },
 { q: "মাটির মানুষ", a: "অর্থ: নিরীহ ব্যক্তি। বাক্য: তিনি অত্যন্ত মাটির মানুষ, কারও সাতে-পাঁচে থাকেন না।" },
 { q: "জড়ভরত", a: "অর্থ: অকর্মণ্য ব্যক্তি। বাক্য: জড়ভরতের মতো নিষ্ক্রিয় হয়ে বসে না থেকে কাজে হাত লাগাও।" },
 { q: "ঘোড়ার ডিম", a: "অর্থ: অলীক বস্তু। বাক্য: অনেক খোঁজার পরও কাজের জায়গায় ঘোড়ার ডিম ছাড়া কিছুই নেই।" },
 { q: "ছকড়া-নকড়া", a: "অর্থ: সস্তা দর। বাক্য: পণ্যগুলো ছকড়া-নকড়া সস্তা দরে বিক্রি করে দেওয়া হলো।" },
 { q: "সোনায় সোহাগা", a: "অর্থ: উপযুক্ত মিলন। বাক্য: মেধাবী বর ও সুশিক্ষিত কনের এই বিয়ে যেন সোনায় সোহাগা।" },

    ];

    let favorites = JSON.parse(localStorage.getItem('bilasBagdharaFavs')) || [];
    let showFavs = false;
    let currentMode = 'study'; // 'study' or 'practice'

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if(mode === 'study') {
            document.getElementById('modeStudy').classList.add('active-mode');
        } else {
            document.getElementById('modePractice').classList.add('active-mode');
        }
        render();
    }

    function parseAnswer(text) {
        let ortho = text;
        let bakko = "";
        if (text.includes("বাক্য:")) {
            let parts = text.split("বাক্য:");
            ortho = parts[0].replace("অর্থ:", "").trim();
            bakko = parts[1].trim();
        } else {
            ortho = text.replace("অর্থ:", "").trim();
        }
        return { ortho, bakko };
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const { ortho, bakko } = parseAnswer(item.a);
            const showClass = currentMode === 'study' ? 'show' : '';
            const sentenceHtml = bakko ? `<div class="bakko"><strong>বাক্য:</strong> ${bakko}</div>` : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="q-text">${item.q}</div>
                    <div id="ans-${index}" class="ans-wrapper ${showClass}">
                        <div class="ans-details">
                            <div class="ans-content">
                                <div class="ortho"><strong>অর্থ:</strong> ${ortho}</div>
                                ${sentenceHtml}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasBagdharaLastRead', index + 1);
        
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(idx) {
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasBagdharaFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if(showFavs) {
            document.getElementById('favViewBtn').classList.add('active-mode');
        } else {
            document.getElementById('favViewBtn').classList.remove('active-mode');
        }
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasBagdharaLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Initial Render
    render();
</script>
</body>
</html>
