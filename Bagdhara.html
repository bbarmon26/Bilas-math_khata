<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বাগধারা মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg: #0d0221;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;
            --neon-pink: #ff416c;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Header Section */
        .header-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.98);
            backdrop-filter: blur(20px);
            padding: 10px 20px 20px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-header { text-align: center; padding: 5px 0; }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 14px 25px;
            border-radius: 50px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        .top-btns { display: flex; gap: 10px; justify-content: center; }
        .btn {
            background: var(--glass);
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
        }

        /* Content Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 230px 20px 100px 20px;
        }

        .item-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            scroll-margin-top: 240px;
        }

        .serial { color: var(--neon-blue); font-weight: bold; font-size: 14px; min-width: 20px; opacity: 0.4; }

        /* Stable Glass Card with Overlay Logic */
        .card {
            flex-grow: 1;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .text-trigger {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .sentence { 
            font-size: 22px; 
            color: var(--neon-blue); 
            font-weight: 700; 
            text-align: center;
            transition: opacity 0.3s ease;
            width: 100%;
        }
        
        .faded { opacity: 0.15; }

        .one-word {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(246, 211, 101, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .show-ans {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-btn { font-size: 24px; color: rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .fav-btn.active { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Smart Rocket Navigator */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(26, 16, 61, 0.98);
            padding: 25px 12px;
            border-radius: 50px;
            border: 1px solid var(--neon-blue);
            margin-bottom: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
        }

        .r-circle {
            width: 50px;
            height: 50px;
            background: #1a103d;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .jump-box {
            width: 50px;
            height: 40px;
            background: #000;
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .go-btn { background: var(--neon-pink); border: none; padding: 8px; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px;}

        .rocket-icon {
            font-size: 48px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            transition: 0.3s;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

<div class="header-section" id="header">
    <div class="brand-header">
        <span class="brand-name">BILAS ACADEMY</span>
    </div>
    <div style="max-width:600px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: অরণ্য, আকাশ)..." onkeyup="filter()">
        <div class="top-btns">
            <button class="btn" id="favViewBtn" onclick="toggleFavView()">⭐ ফেভারিট</button>
            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<script>
    // এখানে আপনার বাগধারা এবং তাদের অর্থ থাকবে
    const data = [
                
                    { q: "আ আ ক খ", a: "অর্থ: প্রাথমিক জ্ঞান। বাক্য: ছেলেটার কম্পিউটারের আ আ ক খ-ও জানা নেই, সে কীভাবে অফিসে কাজ করবে?" },
        { q: "কানকাটা", a: "অর্থ: বেহায়া। বাক্য: এমন কানকাটা লোকের সাথে তর্ক করে কোনো লাভ নেই।" },
        { q: "টাকার গরম", a: "অর্থ: বিত্তের অহংকার। বাক্য: টাকার গরমে সে আজকাল মাটিতে পা-ই ফেলে না।" },
        { q: "উজানের কই", a: "অর্থ: সহজলভ্য। বাক্য: আজকাল সরকারি চাকরি তো আর উজানের কই নয় যে চাইলেই মিলবে।" },
        { q: "কাকভূষণ্ডি", a: "অর্থ: দীর্ঘজীবী। বাক্য: গ্রামের ওই বৃদ্ধ যেন এক কাকভূষণ্ডি, যুগের পর যুগ বেঁচে আছেন।" },
        { q: "গোকুলের ষাঁড়", a: "অর্থ: স্বেচ্ছাচারী। বাক্য: সারাদিন গোকুলের ষাঁড়ের মতো ঘুরে বেড়ালে পরীক্ষায় পাস করবে কীভাবে?" },
        { q: "ঢাকের বাঁয়া", a: "অর্থ: অপ্রয়োজনীয়। বাক্য: অফিসের কাজে তার ভূমিকা নিছক ঢাকের বাঁয়ার মতো।" },
        { q: "ভূষণ্ডির কাক", a: "অর্থ: দীর্ঘায়ু ব্যক্তি। বাক্য: লোকটা তো দেখছি ভূষণ্ডির কাক, সহজে মরবে বলে মনে হয় না।" },
        { q: "নেই আঁকড়া", a: "অর্থ: একগুঁয়ে। বাক্য: এমন নেই আঁকড়া স্বভাবের মানুষের সাথে কাজ করা খুব কঠিন।" },
        { q: "আঠারো আনা", a: "অর্থ: বাড়াবাড়ি। বাক্য: সব ব্যাপারেই তোমার এমন আঠারো আনা করা ঠিক নয়।" },
        { q: "মিছরির ছুরি", a: "অর্থ: মুখে মধু অন্তরে বিষ। বাক্য: সাবধানে থেকো, লোকটি কিন্তু আস্ত একটা মিছরির ছুরি।" },
        { q: "এক ঘরের গিন্নি", a: "অর্থ: কর্তৃত্ব। বাক্য: সে অফিসে এক ঘরের গিন্নির মতো আচরণ করতে ভালোবাসে।" },
        { q: "বুদ্ধির ঢেঁকি", a: "অর্থ: নির্বোধ। বাক্য: এমন বুদ্ধির ঢেঁকিকে দিয়ে এই জটিল হিসাবের কাজ হবে না।" },
        { q: "চীনা জোঁক", a: "অর্থ: নাছোড়বান্দা। বাক্য: চাকরির খোঁজে ছেলেটা চীনা জোঁকের মতো লেগে আছে।" },
        { q: "কলির কেষ্ট", a: "অর্থ: লম্পট। বাক্য: সমাজের এই কলির কেষ্টদের থেকে দূরে থাকাই ভালো।" },
        { q: "অষ্টরম্ভা", a: "অর্থ: ফাঁকি/কিছুই না। বাক্য: সারাদিন এত খেটেও শেষমেশ জুটল সেই অষ্টরম্ভা।" },
        { q: "নদীকূলে বাস", a: "অর্থ: দুর্ভাবনা/দুশ্চিন্তা। বাক্য: আদালতে মামলা করা মানে তো নদীকূলে বাস করা।" },
        { q: "ছক্কা পাঞ্জা", a: "অর্থ: বড় বড় কথা বলা। বাক্য: কাজ তো কিছু পারো না, শুধু বসে বসে ছক্কা পাঞ্জা হাঁকতে পারো।" },
        { q: "অস্থির পঞ্চক", a: "অর্থ: অপদার্থ। বাক্য: ছেলেটা একটা অস্থির পঞ্চক, কোনো কাজেই তার মন নেই।" },
        { q: "আটক বিটক", a: "অর্থ: ছটফটানি। বাক্য: পরীক্ষার রেজাল্টের আগে এমন আটক বিটক করাটা স্বাভাবিক।" },
        { q: "ডুব মারা", a: "অর্থ: অদৃশ্য হওয়া/পালিয়ে যাওয়া। বাক্য: টাকাটা ধার নিয়েই সে একেবারে ডুব মেরেছে।" },
        { q: "উনপাঁজুরে", a: "অর্থ: অপদার্থ/দুর্বল। বাক্য: এমন উনপাঁজুরে ছেলেকে দিয়ে এই ভারী কাজ হবে না।" },
        { q: "কান খাড়া করা", a: "অর্থ: মনোযোগী হওয়া। বাক্য: নিজের নামে প্রশংসা হচ্ছে শুনে সে কান খাড়া করল।" },
        { q: "পালের গোদা", a: "অর্থ: দলপতি। বাক্য: চোর ধরা পড়েছে, এবার পালের গোদাকে ধরতে হবে।" },
        { q: "অগস্ত্য যাত্রা", a: "অর্থ: চিরদিনের জন্য প্রস্থান। বাক্য: সে গ্রাম ছেড়ে একেবারে অগস্ত্য যাত্রা করেছে।" },
        { q: "ঘোড়ার কামড়", a: "অর্থ: দৃঢ় পণ। বাক্য: ছেলেটার পড়াশোনায় ঘোড়ার কামড় দেখে আমি সত্যি মুগ্ধ।" },
        { q: "ঝড়ো কাক", a: "অর্থ: বিপর্যস্ত। বাক্য: হঠাৎ বৃষ্টিতে ভিজে সে একেবারে ঝড়ো কাক হয়ে গেছে।" },
        { q: "এক লহমা", a: "অর্থ: এক মুহূর্তে। বাক্য: এক লহমায় সে চোখের পলকে গায়েব হয়ে গেল।" },
        { q: "গরজ বড় বালাই", a: "অর্থ: প্রয়োজনে গুরুত্ব। বাক্য: গরজ বড় বালাই, তাই তো এত রাতে তোমার কাছে ছুটে এসেছি।" },
        { q: "চোখের সাঁতার পানি", a: "অর্থ: অতিরিক্ত মায়াকান্না। বাক্য: আর চোখের সাঁতার পানি ফেলে লাভ নেই, তোমার চালাকি ধরে ফেলেছি।" },
        { q: "ঢাকের কাঠি", a: "অর্থ: তোষামোদকারী। বাক্য: বড় সাহেবের সব কথায় সায় দেওয়াই ওই ঢাকের কাঠির প্রধান কাজ।" },
        { q: "পায়া ভারী", a: "অর্থ: অহংকারী। বাক্য: হঠাৎ বড়লোক হয়ে লোকটার পায়া ভারী হয়ে গেছে।" },
        { q: "কলমের এক খোঁচা", a: "অর্থ: লিখিত আদেশ। বাক্য: বসের কলমের এক খোঁচাতেই তার চাকরিটা পাকাপাকি হয়ে গেল।" },
        { q: "অক্ষরে অক্ষরে", a: "অর্থ: যথাযথ। বাক্য: স্যারের নির্দেশ অক্ষরে অক্ষরে পালন করতে হবে।" },
        { q: "অকালে বাদল", a: "অর্থ: অপ্রত্যাশিত বাধা। বাক্য: ভালোই তো কাজ চলছিল, হঠাৎ এ যেন অকালে বাদল নামল।" },
        { q: "কব্জে পাওয়া", a: "অর্থ: বশে আনা। বাক্য: অনেক চেষ্টার পর অবশেষে চোরটাকে কব্জে পাওয়া গেছে।" },
        { q: "ইন্দ্রপতন", a: "অর্থ: বিখ্যাত ব্যক্তির মৃত্যু। বাক্য: এই মহান নেতার মৃত্যুতে দেশের রাজনীতিতে এক ইন্দ্রপতন ঘটল।" },
        { q: "কেতাদুরস্ত", a: "অর্থ: পরিপাটি। বাক্য: অফিসে সব সময় তাকে কেতাদুরস্ত পোশাকে দেখা যায়।" },
        { q: "রাঙা মূলো", a: "অর্থ: সুন্দর কিন্তু গুণহীন। বাক্য: দেখতে রূপবান হলে কী হবে, ছেলেটা তো আস্ত একটা রাঙা মূলো।" },
        { q: "ভিটায় ঘুঘু চরানো", a: "অর্থ: সর্বস্বান্ত করা। বাক্য: বিশ্বাসঘাতক বন্ধুটি তার ভিটায় ঘুঘু চরিয়ে ছেড়েছে।" },

        { q: "আঠার মাসে বছর", a: "অর্থ: দীর্ঘসূত্রতা। বাক্য: তোমার তো দেখছি আঠার মাসে বছর, এইটুকু কাজ এখনও শেষ হলো না!" },
        { q: "বসন্তের কোকিল", a: "অর্থ: সুদিনের বন্ধু। বাক্য: সুসময়ে বসন্তের কোকিলের অভাব হয় না, কিন্তু বিপদে কাউকে পাওয়া যায় না।" },
        { q: "গড্ডালিকা প্রবাহ", a: "অর্থ: অন্ধ অনুকরণ। বাক্য: নিজে কিছু ভাবো, গড্ডালিকা প্রবাহে গা ভাসিয়ে দিও না।" },
        { q: "কাছা ঢিলা", a: "অর্থ: অসাবধানতা। বাক্য: এমন কাছা ঢিলা লোককে দিয়ে এত বড় দায়িত্ব পালন সম্ভব নয়।" },
        { q: "কুয়োর ব্যাঙ", a: "অর্থ: সংকীর্ণমনা/সীমাবদ্ধ জ্ঞান। বাক্য: সারা জীবন তো গ্রামেই কাটালে, দুনিয়ার কী জানো? তুমি তো একটা কুয়োর ব্যাঙ।" },
        { q: "বালির বাঁধ", a: "অর্থ: অস্থায়ী বস্তু। বাক্য: লোভের ওপর গড়া এই সম্পর্ক বালির বাঁধের মতোই যেকোনো সময় ভেঙে যাবে।" },
        { q: "আদার ব্যাপারী", a: "অর্থ: সামান্য বিষয়ে ব্যস্ত ব্যক্তি। বাক্য: আমি ভাই আদার ব্যাপারী, জাহাজের খবরে আমার কী কাজ?" },
        { q: "পর্বতের মূষিক প্রসব", a: "অর্থ: বিরাট সম্ভাবনার সামান্য প্রাপ্তি। বাক্য: এত আয়োজন করে শেষে এই ফল? এ তো দেখছি পর্বতের মূষিক প্রসব!" },
        { q: "অগ্রপশ্চাৎ", a: "অর্থ: ভেবে-চিন্তে। বাক্য: যেকোনো কাজ করার আগে অগ্রপশ্চাৎ বিবেচনা করা উচিত।" },

        { q: "হ-য-ব-র-ল", a: "অর্থ: বিশৃঙ্খলা। বাক্য: ঘরের জিনিসপত্র এমন হ-য-ব-র-ল করে রেখেছ কেন?" },
        { q: "চোরাবালি", a: "অর্থ: অদৃশ্য বিপদ/প্রচ্ছন্ন আকর্ষণ। বাক্য: এই চাকরিতে ঢোকা মানে চোরাবালিতে পা দেওয়া, বের হওয়া কঠিন।" },
        { q: "জিলাপির প্যাঁচ", a: "অর্থ: কুটিলতা। বাক্য: বাইরে থেকে সহজ মনে হলেও লোকটার মনে জিলাপির প্যাঁচ।" },
        { q: "কেঁচো গণ্ডূষ", a: "অর্থ: নতুন করে শুরু করা। বাক্য: এতদূর এসে আবার ভুল! এখন তো দেখছি কেঁচো গণ্ডূষ করতে হবে।" },

        { q: "কাপুড়ে বাবু", a: "অর্থ: বাহ্যিক সাজ/ভণ্ড। বাক্য: লোকটা আসলে একটা কাপুড়ে বাবু, ভেতরে কোনো গুণ নেই।" },
        { q: "শিবরাত্রির সলতে", a: "অর্থ: একমাত্র সন্তান/বংশধর। বাক্য: বুড়ো-বুড়ির ওই একটি ছেলেই শিবরাত্রির সলতে।" },

        { q: "আমড়া কাঠের ঢেঁকি", a: "অর্থ: অপদার্থ। বাক্য: এমন আমড়া কাঠের ঢেঁকি ছেলেকে চাকরিতে কে নেবে?" },

        { q: "আড়ংঘাটা", a: "অর্থ: খেয়াঘাট। বাক্য: বিকেল বেলা আড়ংঘাটায় বসে হাওয়া খেতে ভালোই লাগে।" },
        { q: "কাঁচা কথা", a: "অর্থ: গুরুত্বহীন কথা। বাক্য: তোমার মতো একজন দায়িত্বশীল মানুষের মুখে এমন কাঁচা কথা মানায় না।" },

        { q: "ঢাক ঢাক গুড় গুড়", a: "অর্থ: গোপন রাখার চেষ্টা। বাক্য: আসল কথাটা বলে ফেলো, এত ঢাক ঢাক গুড় গুড় করার কী আছে?" },

        { q: "ভালুক জ্বর", a: "অর্থ: অনিয়মিত/ক্ষণস্থায়ী। বাক্য: পড়াশোনার কথা শুনলেই তোমার এমন ভালুক জ্বর আসে কেন?" },
        { q: "খণ্ড প্রলয়", a: "অর্থ: ভীষণ ব্যাপার/কাণ্ড। বাক্য: দুই ভাইয়ের ঝগড়ায় বাড়িতে একেবারে খণ্ড প্রলয় বেঁধে গেছে।" },
        { q: "কানাকড়ি", a: "অর্থ: অতি নগণ্য পরিমাণ। বাক্য: তার কথায় কানাকড়িও বিশ্বাস করার কোনো কারণ নেই।" },
        { q: "একচোখা", a: "অর্থ: পক্ষপাতদুষ্ট। বাক্য: এমন একচোখা বিচারকের কাছে ন্যায়বিচার আশা করা বোকামি।" },
        { q: "দুধের মাছি", a: "অর্থ: সুসময়ের বন্ধু। বাক্য: দুধের মাছি বন্ধুরা বিপদের দিনে ছায়াও মাড়ায় না।" },
        { q: "হাড় হভাতে", a: "অর্থ: হতভাগা। বাক্য: এমন হাড় হভাতে ছেলের কপালে কি আর ভালো চাকরি জোটে!" },
        { q: "একই খুড়ে মাথা কামানো", a: "অর্থ: একই স্বভাবের। বাক্য: বুঝতেই পারছি, তোমরা দুজন একই খুড়ে মাথা কামানো।" },
        { q: "বর্ণচোরা", a: "অর্থ: কপট ব্যক্তি। বাক্য: লোকটাকে ভালো মনে হলেও আসলে সে একটা বর্ণচোরা।" }




    ];

    let favorites = JSON.parse(localStorage.getItem('bilasBagdharaFavs')) || [];
    let showFavs = false;

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="magicFlip(${index})">
                    <div class="text-trigger">
                        <div id="q-${index}" class="sentence">${item.q}</div>
                        <div id="a-${index}" class="one-word">${item.a}</div>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function magicFlip(index) {
        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        
        if (a.classList.contains('show-ans')) {
            q.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            q.classList.add('faded');
            a.classList.add('show-ans');
        }
        localStorage.setItem('bilasBagdharaLastRead', index + 1);
    }

    function toggleFav(idx) {
        event.stopPropagation();
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasBagdharaFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasBagdharaLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    render();
</script>
</body>
</html>
