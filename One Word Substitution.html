    let currentCategory = 'All';
    let favorites = JSON.parse(localStorage.getItem('ow_favs')) || [];

    function renderWords(filterText = '') {
        const listContainer = document.getElementById('wordList');
        listContainer.innerHTML = '';

        const filtered = wordsData.filter(item => {
            const matchesSearch = item.word.toLowerCase().includes(filterText.toLowerCase()) || 
                                  item.meaning.includes(filterText) || 
                                  item.def.toLowerCase().includes(filterText.toLowerCase());
            
            if (currentCategory === 'All') return matchesSearch;
            if (currentCategory === 'Favorites') return matchesSearch && favorites.includes(item.sn);
            return matchesSearch && item.cat === currentCategory;
        });

        if(filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">কোনো শব্দ পাওয়া যায়নি!</p>';
            return;
        }

        filtered.forEach(item => {
            const isFav = favorites.includes(item.sn);
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = (e) => {
                if(e.target.classList.contains('fav-icon')) return;
                card.classList.toggle('open');
            };

            card.innerHTML = `
                <div class="card-header">
                    <div class="info-left">
                        <span class="sn-badge">${item.sn}</span>
                        <span class="word-text">${item.word}</span>
                    </div>
                    <span class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFav(${item.sn}, this)">★</span>
                </div>
                <div class="card-details">
                    <div class="meaning-title">${item.meaning}</div>
                    <div class="def-title">${item.def}</div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function toggleFav(sn, element) {
        if (favorites.includes(sn)) {
            favorites = favorites.filter(id => id !== sn);
            element.classList.remove('active');
        } else {
            favorites.push(sn);
            element.classList.add('active');
        }
        localStorage.setItem('ow_favs', JSON.stringify(favorites));
        if(currentCategory === 'Favorites') renderWords(document.getElementById('searchBar').value);
    }

    function filterCategory(category) {
        currentCategory = category;
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');
        renderWords(document.getElementById('searchBar').value);
    }

    document.getElementById('searchBar').addEventListener('input', (e) => {
        renderWords(e.target.value);
    });

    renderWords();
