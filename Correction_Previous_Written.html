<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS ACADEMY | Sentence Correction PRO </title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        :root {
            --bg-dark: #030712;
            --container-bg: #0b1329;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-glow: rgba(56, 189, 248, 0.25);
            --mint-green: #2dd4bf;
            --gold-glow: #facc15;
            --switch-pink: #f43f5e;
            --sky-blue: #38bdf8;
            --purple-glow: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            min-height: 100vh;
            background-color: var(--container-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        header { 
            position: sticky; 
            top: 0;
            padding: 14px 20px 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            z-index: 50; 
            background: rgba(11, 19, 41, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            will-change: transform, opacity;
        }
        
        /* Auto Hide Header on Scroll Down */
        header.header-hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .brand-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #a855f7, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn { 
            background: rgba(255, 255, 255, 0.05); color: var(--text-main); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; 
            cursor: pointer; display: flex; align-items: center; gap: 6px; 
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
        }
        .action-btn:active { transform: scale(0.92); }

        .search-box { display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 10px 16px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; }
        .search-box i { color: var(--text-muted); margin-right: 12px; font-size: 14px; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 13.5px; }
        .search-box input::placeholder { color: #64748b; }

        .content-area { 
            flex: 1; 
            padding: 16px 16px 120px; 
            z-index: 10; 
            position: relative; 
        }

        /* Clean Compact Card */
        .card { 
            background: var(--card-bg); 
            padding: 18px 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-left: 4px solid var(--switch-pink); 
            margin-bottom: 14px; 
            position: relative; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); 
            user-select: none;
            cursor: pointer;
            will-change: transform, border-color, box-shadow;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { border-color: var(--border-glow); }
        .card:active { transform: scale(0.99); }
        
        /* Unified Question Header Row */
        .question-header-row { 
            display: flex; 
            align-items: flex-start; 
            gap: 10px; 
        }
        
        .serial-badge { 
            background: var(--mint-green); 
            color: #020617; 
            padding: 2px 8px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 800; 
            flex-shrink: 0;
            margin-top: 3px;
        }

        .incorrect-text { 
            flex: 1;
            font-size: 17.5px; 
            line-height: 1.45; 
            font-weight: 700; 
            color: #fb7185;
        }

        .fav-star { 
            font-size: 19px; 
            color: rgba(255, 255, 255, 0.2); 
            cursor: pointer; 
            padding: 0 4px; 
            flex-shrink: 0;
            margin-top: 2px;
            transition: color 0.2s ease, transform 0.2s ease; 
        }
        .fav-star:active { transform: scale(1.2); }
        .fav-star.active { color: var(--gold-glow); text-shadow: 0 0 10px var(--gold-glow); }

        /* Answer & Details Section */
        .answer-container {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            will-change: max-height, opacity, margin-top;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, margin-top 0.25s ease, padding-top 0.25s ease, border-color 0.25s ease;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }

        .card.revealed .answer-container {
            max-height: 650px;
            opacity: 1;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .correct-line {
            font-size: 17px;
            line-height: 1.45;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .correct-line i { color: var(--mint-green); font-size: 16px; margin-top: 5px; }

        /* Highlight Core Corrected Word */
        .hi-correct {
            color: var(--mint-green);
            background: rgba(45, 212, 191, 0.15);
            padding: 1px 6px;
            border-radius: 6px;
            border-bottom: 2px solid var(--mint-green);
        }

        .meta-line { font-size: 14px; color: #cbd5e1; line-height: 1.5; }
        .meta-line strong { color: var(--sky-blue); font-weight: 700; margin-right: 4px; }
        
        .meaning-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .meaning-action-row .meta-line.meaning { flex: 1; }
        .meaning-action-row .meta-line.meaning strong { color: var(--mint-green); }

        .btn-exp-inline { 
            background: rgba(250, 204, 21, 0.08); 
            border: 1px solid rgba(250, 204, 21, 0.35); 
            color: var(--gold-glow); 
            font-size: 11px; 
            font-weight: 700; 
            padding: 4px 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .btn-exp-inline:hover { background: rgba(250, 204, 21, 0.2); border-color: var(--gold-glow); }
        .btn-exp-inline:active { transform: scale(0.92); }
        
        .explanation-box { 
            display: none; 
            margin-top: 6px; 
            padding: 12px 14px; 
            background: rgba(0, 0, 0, 0.4); 
            border-left: 3px solid var(--gold-glow); 
            border-radius: 8px; 
            font-size: 13.5px; color: #cbd5e1; line-height: 1.6;
            animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hi-gold { color: var(--gold-glow); font-weight: 700; background: rgba(250, 204, 21, 0.12); padding: 1px 4px; border-radius: 4px; }
        .hi-mint { color: var(--mint-green); font-weight: 700; background: rgba(45, 212, 191, 0.12); padding: 1px 4px; border-radius: 4px; }
        .hi-trick { color: #f43f5e; font-weight: 700; background: rgba(244, 63, 94, 0.12); padding: 1px 4px; border-radius: 4px; }

        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-6px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .rocket-hub { position: fixed; right: 16px; bottom: 84px; display: flex; flex-direction: column; align-items: center; z-index: 999; }
        .rocket-menu { display: none; flex-direction: column; gap: 8px; background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(15px); padding: 12px 8px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .r-circle { width: 38px; height: 38px; background: #1e293b; border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 13px; font-weight: bold; transition: transform 0.15s ease; }
        .r-circle:active { transform: scale(0.9); }
        .jump-box { width: 44px; height: 32px; background: #030712; border: 1px solid var(--switch-pink); color: white; text-align: center; border-radius: 8px; font-size: 12px; outline: none; }
        .go-btn { background: var(--switch-pink); border: none; padding: 4px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px; }
        .rocket-icon { font-size: 32px; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .rocket-icon:active { transform: scale(0.9); }

        .bottom-nav { 
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); 
            width: calc(100% - 28px); max-width: 400px; 
            background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; padding: 10px 8px; 
            border: 1px solid rgba(255, 255, 255, 0.12); z-index: 1000; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .nav-item { color: #64748b; font-size: 19px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item span { font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--sky-blue); transform: translateY(-2px); }
        .nav-item.active span { color: var(--sky-blue); font-weight: 700; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 12px; font-size: 12px; color: white; display: none; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toast" id="toastMsg">Saved!</div>

        <!-- HEADER (Auto-hide on Scroll) -->
        <header id="mainHeader">
            <div class="brand-bar">
                <div class="logo">
                    <h1>BILAS</h1>
                    <p>Sentence Correction PRO </p>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="btnShuffle" onclick="shuffleData()">
                        <i class="fa-solid fa-shuffle"></i> <span>Shuffle</span>
                    </button>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ভুল বা সঠিক বাক্য, অর্থ বা ব্যাখ্যা খুঁজুন..." id="searchInput" oninput="renderCards()">
            </div>
        </header>

        <!-- MAIN LIST AREA -->
        <div class="content-area" id="cardsList"></div>

        <!-- 🚀 ROCKET NAVIGATION HUB -->
        <div class="rocket-hub" id="rocketHub">
            <div class="rocket-menu" id="rocketMenu">
                <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆</div>
                <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
                <button class="go-btn" onclick="jumpToCard()">GO</button>
                <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇</div>
            </div>
            <div class="rocket-icon" onclick="toggleRocketHub()">🚀</div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-practice" onclick="switchTab('practice')">
                <i class="fa-solid fa-bolt"></i><span>Practice</span>
            </div>
            <div class="nav-item" id="nav-fav" onclick="switchTab('favorites')">
                <i class="fa-solid fa-star"></i><span>Saved</span>
            </div>
        </div>
    </div>

    <script>
        const correctionDb = [

            {
                id: 1,
                incorrect: "He did a sin.",
                correctFormatted: "He <span class='hi-correct'>committed</span> a sin.",
                pronunciation: "হি কমিটেড আ সিন।",
                meaning: "তিনি একটি পাপ করেছিলেন।",
                explanation: "ব্যাখ্যা: পাপ বা অপরাধ করা বোঝাতে 'do' বসে না, Collocation হিসেবে সর্বদা <span class='hi-mint'>commit a sin / crime</span> বসে।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> Sin (পাপ), Crime (অপরাধ), Suicide (আত্মহত্যা) ইত্যাদির পূর্বে সর্বদা <b>Commit</b> বসবে।"
            },
            {
                id: 2,
                incorrect: "He came here by foot.",
                correctFormatted: "He came here <span class='hi-correct'>on foot</span>.",
                pronunciation: "হি কেইম হিয়ার অন ফুট।",
                meaning: "তিনি এখানে পায়ে হেঁটে এসেছিলেন।",
                explanation: "ব্যাখ্যা: যানবাহনে যাওয়ার ক্ষেত্রে 'by bus/car' হলেও পায়ে হেঁটে যাওয়ার সঠিক প্রবাদ/ইডিয়ম হলো <span class='hi-mint'>on foot</span>।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> পা সরাসরি মাটির ওপরে (On) থাকে, তাই 'By foot' নয়—সর্বদা <b>On foot</b>।"
            },
            {
                id: 3,
                incorrect: "We say him a liar.",
                correctFormatted: "We <span class='hi-correct'>call</span> him a liar.",
                pronunciation: "উই কল হিম আ লায়ার।",
                meaning: "আমরা তাকে মিথ্যাবাদী বলি।",
                explanation: "ব্যাখ্যা: কাউকে কোনো নামে বা উপাধিতে ডাকা/আখ্যায়িত করা বোঝাতে Factitive Verb হিসেবে <span class='hi-mint'>call</span> বসে (Call + Object + Complement)।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> কাউকে Liar, Fool, Thief ইত্যাদি আখ্যা দেওয়া মানে তাকে তা বলে <b>Call</b> করা।"
            },
            {
                id: 4,
                incorrect: "The man is mortal.",
                correctFormatted: "<span class='hi-correct'>Man</span> is mortal.",
                pronunciation: "ম্যান ইজ মর্টাল।",
                meaning: "মানুষ মরণশীল।",
                explanation: "ব্যাখ্যা: সমগ্র মানবজাতিকে সাধারণ সত্য হিসেবে প্রকাশ করার সময় 'Man/Woman'-এর পূর্বে কোনো Article (The/A) বসে না।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> সার্বজনীন মানবজাতি বোঝাতে 'The man' নয়, শুধুই <b>Man</b>।"
            },
            {
                id: 5,
                incorrect: "He gave a good speech.",
                correctFormatted: "He <span class='hi-correct'>delivered</span> a good speech.",
                pronunciation: "হি ডেলিভারড আ গুড স্পীচ।",
                meaning: "তিনি একটি চমৎকার বক্তৃতা দিয়েছিলেন।",
                explanation: "ব্যাখ্যা: ভাষণ বা বক্তব্য দেওয়ার ক্ষেত্রে উপযুক্ত প্রমিত Verb হলো <span class='hi-mint'>deliver a speech</span> (বা make a speech)।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> Speech শ্রোতাদের উদ্দেশ্যে পৌঁছে দেওয়া হয়, তাই 'Give' না হয়ে <b>Deliver</b> হয়।"
            },
            {
                id: 6,
                incorrect: "He is comparatively better today.",
                correctFormatted: "He is <span class='hi-correct'>better</span> today.",
                pronunciation: "হি ইজ বেটার টুডে।",
                meaning: "তিনি আজ তুলনামূলকভাবে ভালো আছেন।",
                explanation: "ব্যাখ্যা: <span class='hi-gold'>Comparatively</span> এবং Comparative Degree (better) দুটিই তুলনা প্রকাশ করে। একসাথে বসলে Double Comparative ভুল হয়।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> হয় 'He is better today' অথবা 'He is comparatively good today'।"
            },
            {
                id: 7,
                incorrect: "He is a honest man.",
                correctFormatted: "He is <span class='hi-correct'>an</span> honest man.",
                pronunciation: "হি ইজ অ্যান অনেস্ট ম্যান।",
                meaning: "তিনি একজন সৎ মানুষ।",
                explanation: "ব্যাখ্যা: 'Honest' শব্দের শুরুতে অনুচ্চারিত ব্যঞ্জনবর্ণ 'H' রয়েছে এবং উচ্চারণ 'অ' (Vowel sound)-এর মতো হওয়ায় Article হিসেবে <span class='hi-mint'>an</span> বসে।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> H এর উচ্চারণ উহ্য থাকলে (Honest, Hour, Heir) সর্বদা <b>An</b> বসে।"
            },
            {
                id: 8,
                incorrect: "We write by pen.",
                correctFormatted: "We write <span class='hi-correct'>with</span> pen.",
                pronunciation: "উই রাইট উইথ পেন।",
                meaning: "আমরা কলম দিয়ে লিখি।",
                explanation: "ব্যাখ্যা: কোনো বস্তু বা হাতিয়ার (Instrument) দিয়ে কাজ করা বোঝাতে Preposition <span class='hi-mint'>with</span> বসে (ব্যক্তির দ্বারা হলে 'by')।<br><span class='hi-trick'>🎯 শর্টকাট ট্রিক:</span> যা হাতে ধরা যায় (Pen, Knife, Gun) তার পূর্বে <b>With</b>; কিন্তু কালির ক্ষেত্রে <b>in ink</b>।"
            },
            {
                id: 9,
                incorrect: "What is the time in your watch?",
                correctFormatted: "What is the time <span class='hi-correct'>by</span> your watch?",

        let currentTab = 'practice';
        let favorites = JSON.parse(localStorage.getItem('bacademy_psc_favs')) || [];
        let renderList = [...correctionDb];

        /* --- Header Auto-Hide on Scroll Logic --- */
        let lastScrollTop = 0;
        const mainHeader = document.getElementById('mainHeader');
        const scrollThreshold = 10;

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (Math.abs(lastScrollTop - scrollTop) <= scrollThreshold) return;

            if (scrollTop > lastScrollTop && scrollTop > 60) {
                // Scrolling Down -> Hide Header
                mainHeader.classList.add('header-hidden');
            } else {
                // Scrolling Up -> Show Header
                mainHeader.classList.remove('header-hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, { passive: true });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(tab === 'practice') document.getElementById('nav-practice').classList.add('active');
            if(tab === 'favorites') document.getElementById('nav-fav').classList.add('active');

            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shuffleData() {
            renderList.sort(() => Math.random() - 0.5);
            renderCards();
            showToast("প্রশ্নগুলো এলোমেলো করা হয়েছে! 🔀", "#2dd4bf");
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            if(favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast("নোটবুক থেকে মুছে ফেলা হয়েছে", "#64748b");
            } else {
                favorites.push(id);
                showToast("নোটবুকে সেভ করা হয়েছে! ⭐", "#f59e0b");
            }
            localStorage.setItem('bacademy_psc_favs', JSON.stringify(favorites));
            renderCards();
        }

        function toggleCard(cardEl) {
            cardEl.classList.toggle('revealed');
        }

        function toggleExplanation(event, id) {
            event.stopPropagation();
            const expBox = document.getElementById(`exp-${id}`);
            const btn = event.currentTarget;
            if(expBox.style.display === 'block') {
                expBox.style.display = 'none';
                btn.innerHTML = `<i class="fa-regular fa-lightbulb"></i> ব্যাখ্যা`;
            } else {
                expBox.style.display = 'block';
                btn.innerHTML = `<i class="fa-solid fa-xmark"></i> বন্ধ`;
            }
        }

            let filtered = renderList.filter(item => {
                const rawCorrect = item.correctFormatted.replace(/<[^>]*>?/gm, '');
                const matchQuery = item.incorrect.toLowerCase().includes(query) ||
                                   rawCorrect.toLowerCase().includes(query) ||
                                   item.meaning.includes(query) ||
                                   item.explanation.includes(query);
                if(currentTab === 'favorites') {
                    return matchQuery && favorites.includes(item.id);
                }
                return matchQuery;
            });

            container.innerHTML = '';

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-folder-open" style="font-size: 32px; margin-bottom: 12px; opacity:0.5;"></i>
                        <p style="font-size: 15px;">কোনো প্রশ্ন পাওয়া যায়নি!</p>
                    </div>`;
                return;
            }

            filtered.forEach((item, index) => {
                const isFav = favorites.includes(item.id);
                const favClass = isFav ? 'fav-star active' : 'fav-star';
                const starIcon = isFav ? '★' : '☆';

                let card = document.createElement('div');
                card.id = `card-item-${item.id}`;
                card.className = 'card';
                card.onclick = () => toggleCard(card);

                card.innerHTML = `
                    <div class="question-header-row">
                        <span class="serial-badge">#${index + 1}</span>
                        <div class="incorrect-text">${item.incorrect}</div>
                        <span class="${favClass}" onclick="toggleFav(${item.id}, event)">${starIcon}</span>
                    </div>

                    <div class="answer-container">
                        <div class="correct-line">
                            <i class="fa-solid fa-check"></i>
                            <div>${item.correctFormatted}</div>
                        </div>
                        <p class="meta-line"><strong>🗣️</strong> ${item.pronunciation}</p>
                        <div class="meaning-action-row">
                            <p class="meta-line meaning"><strong>👉</strong> ${item.meaning}</p>
                            <button class="btn-exp-inline" onclick="toggleExplanation(event, ${item.id})"><i class="fa-regular fa-lightbulb"></i> ব্যাখ্যা</button>
                        </div>
                        <div class="explanation-box" id="exp-${item.id}">${item.explanation}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleRocketHub() {
            const menu = document.getElementById('rocketMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function jumpToCard() {
            const inputVal = document.getElementById('jumpInput').value.trim();
            const targetEl = document.getElementById(`card-item-${inputVal}`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                toggleRocketHub();
                targetEl.style.borderColor = 'var(--gold-glow)';
                setTimeout(() => { targetEl.style.borderColor = 'rgba(255, 255, 255, 0.07)'; }, 1600);
            } else {
                showToast("নম্বরটি খুঁজে পাওয়া যায়নি!", "#f43f5e");
            }
        }

        function showToast(msg, color) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg; toast.style.borderLeft = `4px solid ${color}`; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // Initialize App
        renderCards();
    </script>
</body>
</html>
