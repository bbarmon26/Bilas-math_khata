        {id: 351, bookNum: "77.a", type: "normal", raw: "I have ________ (meet) with my friends.", ans: "met", bn: "আমি আমার বন্ধুদের সাথে দেখা করেছি।", ex: "সহজ কারণ: বাক্যে সাহায্যকারী ভার্ব 'have' দেওয়া আছে। প্রেজেন্ট পারফেক্ট টেন্সের নিয়ম অনুযায়ী 'have/has' এর পর মূল ভার্বের সবসময় ৩য় রূপ বা Past Participle (meet -> met) বসে।"},
        {id: 352, bookNum: "77.b", type: "normal", raw: "Where are you ________ (go)?", ans: "going", bn: "তুমি কোথায় যাচ্ছ?", ex: "বাক্যে সাহায্যকারী ভার্ব হিসেবে 'are' আছে এবং এটি একটি চলমান প্রশ্ন। তাই Present Continuous Tense-এর নিয়ম অনুযায়ী মূল ভার্বের সাথে ing যুক্ত হয়ে 'going' হয়েছে।"},
        {id: 353, bookNum: "77.c", type: "normal", raw: "I will be ________ (watch) movies.", ans: "watching", bn: "আমি সিনেমা দেখতে থাকবো।", ex: "ভবিষ্যতে কোনো কাজ একটানা চলতে থাকবে বোঝাচ্ছে। নিয়মানুযায়ী Future Continuous Tense-এ 'will be' এর পর মূল ভার্বের সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 354, bookNum: "77.d", type: "normal", raw: "Rita ________ (dance) on the floor.", ans: "dances/is dancing", bn: "রিতা মেঝেতে নাচছে / নাচে।", ex: "রিতা বর্তমানে নাচছে বোঝালে Present Continuous (is dancing) অথবা সে সচরাচর নাচে বোঝালে Present Indefinite (dances) দুটিই ব্যাকরণগতভাবে সঠিক।"},
        {id: 355, bookNum: "78.a", type: "normal", raw: "Mother said that honesty ________ (be) the best policy.", ans: "is", bn: "মা বলেছিলেন যে সততাই সর্বোত্তম পন্থা।", ex: "খুব চমৎকার নিয়ম: রিপোর্টিং ভার্বটি অতীতে (said) থাকলেও, 'Honesty is the best policy' অংশটি একটি চিরন্তন সত্য বা প্রবাদ বাক্য। চিরন্তন সত্য কথা সবসময় Present Indefinite Tense-এর 'is' দিয়েই লিখতে হয়, কখনো 'was' হয় না।"},
        {id: 356, bookNum: "78.b", type: "normal", raw: "If you (try), you could have succeeded.", ans: "had tried", bn: "তুমি যদি চেষ্টা করতে, তবে তুমি সফল হতে পারতে।", ex: "এটি হলো Third Conditional। মূল ক্লজে যেহেতু 'could have + V3' (could have succeeded) দেওয়া আছে, তাই ইফ (if) ক্লজটি বাধ্যতামূলকভাবে Past Perfect Tense (had + V3 অর্থাৎ had tried) হবে।"},
        {id: 357, bookNum: "78.c", type: "normal", raw: "I went there with a view to ________ (meet) my friend.", ans: "meeting", bn: "আমি আমার বন্ধুর সাথে দেখা করার উদ্দেশ্যে সেখানে গিয়েছিলাম।", ex: "পরীক্ষায় বারবার আসা নিয়ম: সাধারণ 'To' এর পর V1 বসলেও, 'with a view to' (উদ্দেশ্যে) শব্দগুচ্ছের পর পরবর্তী মূল ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 358, bookNum: "78.d", type: "normal", raw: "No sooner ________ I (see) the boy than he went away.", ans: "had I seen", bn: "আমি বালকটিকে দেখতে না দেখতেই সে চলে গেল।", ex: "'No sooner... than' এর কোরিলেটিভ স্ট্রাকচার অনুযায়ী প্রথম অংশে সবসময় 'had + subject + V3' (had I seen) বসে বাক্যটি মেলাতে হয়।"},
        {id: 359, bookNum: "78.e", type: "normal", raw: "I wish I ________ (can) speak English!", ans: "could", bn: "আমি যদি ইংরেজিতে কথা বলতে পারতাম!", ex: "বাক্যে অবাস্তব ইচ্ছা বা আফসোস প্রকাশক 'I wish' থাকলে, তার ঠিক পরের ক্লজে সামর্থ্য বোঝাতে 'can' পরিবর্তিত হয়ে তার Past Form 'could' হয়ে যায়।"},
        {id: 360, bookNum: "79.a", type: "normal", raw: "I ________ (open) the book already.", ans: "have opened", bn: "আমি ইতিমধ্যেই বইটি খুলেছি।", ex: "শর্টকাট নিয়ম: বাক্যে 'already' (ইতিমধ্যেই) শব্দটি উল্লেখ থাকলে তা নির্দেশ করে কাজটি এইমাত্র শেষ হয়েছে, অর্থাৎ এটি Present Perfect Tense (have/has + V3) হবে।"},
        {id: 361, bookNum: "79.b", type: "normal", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "মনে রাখুন: 'One of'-এর পর Noun প্লুরাল (the boys) হলেও আসল সাবজেক্ট কিন্তু ওই একজন (One)। 'yesterday' (গতকাল) থাকায় অতীতকালের সিঙ্গুলার ভার্ব হিসেবে 'was' বসেছে।"},
        {id: 362, bookNum: "79.c", type: "normal", raw: "Start ________ (write).", ans: "writing", bn: "লেখা শুরু করো।", ex: "এটি একটি ইম্পারেটিভ বাক্য যেখানে 'Start' একটি ভার্ব। একই বাক্যে পরপর দুটি ভার্ব আসলে সাধারণত দ্বিতীয় ভার্বটির সাথে ing যুক্ত করে জেরান্ড বা পার্টিসিপল করতে হয়।"},
        {id: 363, bookNum: "79.d", type: "normal", raw: "He came here with a view to ________ (help) me.", ans: "helping", bn: "সে আমাকে সাহায্য করার উদ্দেশ্যে এখানে এসেছিল।", ex: "নিয়ম মেনে 'with a view to' ফ্রেজটির পর পরবর্তী প্রধান অ্যাকশন ভার্বটির সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 364, bookNum: "79.e", type: "normal", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' উল্লেখ আছে। তাই ইন্টারোগেটিভ বা প্রশ্নবোধক গঠনে Past Indefinite স্ট্রাকচার (Where + did + subject + V1) বসেছে।"},
        {id: 365, bookNum: "80.a", type: "normal", raw: "I saw a bird ________ (fly) in the sky.", ans: "flying", bn: "আমি আকাশে একটি পাখিকে উড়ে বেড়াতে দেখলাম।", ex: "সরল বাক্যে (Simple Sentence) প্রথম প্রধান ভার্বের (saw) পর দ্বিতীয় ভার্বটি দিয়ে যখন চোখের সামনে কোনো কাজ চলতে দেখা বোঝায়, তখন তার সাথে ing যুক্ত করে পার্টিসিপল করতে হয়।"},
        {id: 366, bookNum: "80.b", type: "normal", raw: "You had better ________ (to go) home.", ans: "go", bn: "তোমার বরং বাড়ি যাওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না (Bare Infinitive), সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 367, bookNum: "80.c", type: "normal", raw: "It is high time he ________ (to change) his mind.", ans: "changed", bn: "এটাই উপযুক্ত সময় তার মন পরিবর্তন করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (he) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ changed) হয়।"},
        {id: 368, bookNum: "80.d", type: "normal", raw: "I got my car ________ (repair).", ans: "repaired", bn: "আমি আমার গাড়িটি মেরামত করিয়ে নিলাম।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (my car) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 369, bookNum: "80.e", type: "normal", raw: "He has ________ (do) the work.", ans: "done", bn: "সে কাজটি করেছে।", ex: "Present Perfect Tense-এ 'have/has' এর পর মূল ভার্বের সবসময় Past Participle Form (V3) বসে। do -> done।"},
        {id: 370, bookNum: "81.a", type: "normal", raw: "It is time ________ (start).", ans: "to start", bn: "এখনই শুরু করার সময়।", ex: "পার্থক্যটি বুঝুন: 'It is time'-এর পর যদি কোনো Subject না থাকে, তবে সরাসরি ইনফিনিティブ অর্থাৎ 'to + V1' (to start) বসিয়ে বাক্যটি মেলাতে হয়।"},
        {id: 371, bookNum: "81.b", type: "normal", raw: "I got my rice ________ (cook).", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "Causative 'got'-এর পর বস্তুবাচক অবজেক্ট (my rice) থাকায় প্যাসিভ অ্যাকশন হিসেবে পরবর্তী ভার্বের ৩য় রূপ বা Past Participle (V3 অর্থাৎ cooked) বসেছে।"},
        {id: 372, bookNum: "81.c", type: "normal", raw: "If I had money, I ________ (open) a hospital.", ans: "Hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "এখানে 'had' ভার্বটি একাকী আছে, অর্থাৎ এটি Past Indefinite Tense (Second Conditional)। তাই নিয়ম মেনে পরের অংশে Subject + would + V1 (open) বসেছে।"},
        {id: 373, bookNum: "81.d", type: "normal", raw: "The train ________ (leave) already, when I reached the station.", ans: "had left", bn: "আমি যখন স্টেশনে পৌঁছালাম তখন ট্রেনটি ইতিমধ্যেই ছেড়ে চলে গিয়েছিল।", ex: "স্টেশনে পৌঁছানোর আগেই ট্রেনটি চলে যাওয়ার কাজটি আগে ঘটেছিল। অতীতে দুটি কাজের মধ্যে আগের কাজটি সবসময় Past Perfect Tense (had + V3 অর্থাৎ had left) হয়। 'already' শব্দটি এটির জোরালো প্রমাণ।"},
        {id: 374, bookNum: "82.a", type: "normal", raw: "No sooner had he ________ (take) the money then he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "শর্টকাট স্ট্রাকচার: 'No sooner had' এর ঠিক পরেই যেহেতু 'had' বসে গেছে, তাই পরবর্তী প্রধান ভার্বটির সবসময় ৩য় রূপ বা Past Participle (V3 অর্থাৎ taken) বসে।"},
        {id: 375, bookNum: "82.b", type: "normal", raw: "He made me ________ (to do) the work.", ans: "do", bn: "সে আমাকে দিয়ে কাজটি করিয়েছিল।", ex: "Causative Verb 'make/made' এর নিয়ম: মেক (made) এর পর যদি কোনো ব্যক্তি অবজেক্ট (me) থাকে, তবে পরবর্তী ভার্বের সাথে কোনো 'to' বসে না, সরাসরি Base Form (V1) বসে।"},
        {id: 376, bookNum: "82.c", type: "normal", raw: "While ________ (walk) at the station, I met him.", ans: "walking", bn: "স্টেশনে হাঁটার সময়, তার সাথে আমার দেখা হয়েছিল।", ex: "সহজ নিয়ম: 'While'-এর ঠিক পরেই যদি সরাসরি কোনো Subject না থাকে (ব্র্যাকেট থাকে), তবে ওই ভার্বের সাথে সরাসরি ing যুক্ত করে দিতে হয়।"},
        {id: 377, bookNum: "82.d", type: "normal", raw: "Neither he nor his friends ________ (to have) attended the function.", ans: "have", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "নিয়ম: 'Neither... nor' দ্বারা যুক্ত সাবজেক্টের ক্ষেত্রে 'nor'-এর ঠিক পরের সাবজেক্ট (his friends - Plural) অনুযায়ী ভার্ব নির্ধারিত হয়। যেহেতু friends বহুবচন, তাই 'have' বসেছে।"},
        {id: 378, bookNum: "83.a", type: "normal", raw: "A good number of attendees ________ seen in the meeting.", ans: "are/were", bn: "সভায় বেশ ভালো সংখ্যক উপস্থিতি দেখা গিয়েছিল/যায়।", ex: "নিয়ম: 'A good number of' ফ্রেজটির পর Noun এবং Verb দুটিই সবসময় Plural (বহুবচন) হয়। তাই বর্তমান হলে are অথবা অতীত হলে were সঠিক।"},
        {id: 379, bookNum: "83.b", type: "normal", raw: "The banana of Narsingdi ________ famous.", ans: "is", bn: "নরসিংদীর কলা বিখ্যাত।", ex: "এখানে কলাগুলো (banana - সিঙ্গুলার হিসেবে ব্যবহৃত যৌথ রূপ) নরসিংদীর একটি বিশেষত্ব নির্দেশ করছে। Subject সিঙ্গুলার হওয়ায় 'is' বসেছে।"},
        {id: 380, bookNum: "83.c", type: "normal", raw: "Five and five ________ ten.", ans: "makes", bn: "পাঁচে পাঁচে দশ হয়।", ex: "গাণিতিক সংখ্যার হিসাব বা যোগফলকে ইংরেজিতে সবসময় Singular (একবচন) ধারণা হিসেবে গণ্য করা হয়, তাই Singular Verb 'makes' বসেছে।"},
        {id: 381, bookNum: "83.d", type: "normal", raw: "The candidates of this recruitment test ________ very disciplined.", ans: "are", bn: "এই নিয়োগ পরীক্ষার প্রার্থীরা খুবই শৃঙ্খলিত।", ex: "এখানে আসল Subject হলো 'The candidates' (প্রার্থীরা), যা একটি Plural Noun (বহুবচন)। তাই সাহায্যকারী ভার্ব হিসেবে 'are' বসেছে।"},
        {id: 382, bookNum: "83.e", type: "normal", raw: "If I ________ a king, I would help the poor.", ans: "were", bn: "আমি যদি একজন রাজা হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "এটি কাল্পনিক অতীত বা Second Conditional বাক্য। ইফ ক্লজে অবাস্তব ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 383, bookNum: "84.a", type: "normal", raw: "Why are social networks ________ (expand) so fast?", ans: "expanding", bn: "সামাজিক যোগাযোগ মাধ্যমগুলো কেন এত দ্রুত প্রসারিত হচ্ছে?", ex: "বাক্যে প্রশ্নবোধক সাহায্যকারী ভার্ব হিসেবে 'are' আছে এবং কাজটি বর্তমানে অনবরত ঘটছে বোঝাচ্ছে। তাই Present Continuous Tense অনুযায়ী ভার্ব + ing (expanding) হয়েছে।"},
        {id: 384, bookNum: "84.b", type: "normal", raw: "Most of the social ________ (service) are cost free.", ans: "services", bn: "অধিকাংশ সামাজিক সেবাই সম্পূর্ণ বিনামূল্যে পাওয়া যায়।", ex: "নিয়ম: 'Most of the' ফ্রেজটির পর কাউন্টেবল নাউন আসলে তা সবসময় Plural (services) রূপে বসে।"},
        {id: 385, bookNum: "84.c", type: "normal", raw: "You can make use of them free, ________ (pay) a very little to your internet service provider.", ans: "paying", bn: "আপনার ইন্টারনেট সরবরাহকারীকে খুব সামান্য অর্থ প্রদান করে আপনি এগুলো বিনামূল্যে ব্যবহার করতে পারেন।", ex: "একটি সাধারণ বাক্যে মূল কাজের সাথে সাথে আরেকটি আনুষঙ্গিক কাজের চলমান অবস্থা বা মাধ্যম বোঝাতে দ্বিতীয় ভার্বের সাথে ing যুক্ত করে পার্টিসিপল করা হয়েছে।"},
        {id: 386, bookNum: "84.d", type: "normal", raw: "Moreover, you can make your personal profile public before the entire online ________ (community).", ans: "community", bn: "তাছাড়া, আপনি পুরো অনলাইন সম্প্রদায়ের সামনে আপনার ব্যক্তিগত প্রোফাইলটি উন্মুক্ত করতে পারেন।", ex: "এখানে 'online' শব্দটির পর উপযুক্ত অর্থপূর্ণ Noun হিসেবে 'community' (সম্প্রদায়) শব্দটি বসে বাক্যটির গঠন সম্পূর্ণ করেছে।"},
        {id: 387, bookNum: "84.e", type: "normal", raw: "You can also look into other people's profile if you are ________ (interest).", ans: "interested", bn: "আপনি যদি আগ্রহী হন তবে অন্য লোকের প্রোফাইলেও নজর দিতে পারেন।", ex: "এখানে 'are' ভার্বটির পর 'interested' শব্দটি সরাসরি ব্যক্তির একটি মানসিক অবস্থা বা Adjective হিসেবে ব্যবহৃত হয়েছে, যার অর্থ আগ্রহী হওয়া।"},
        {id: 388, bookNum: "85.a", type: "normal", raw: "Would that I ________ (see) a tiger.", ans: "could see", bn: "আমি যদি একটি বাঘ দেখতে পারতাম!", ex: "বাক্যের শুরুতে 'Would that' থাকা মানেই এটি একটি তীব্র অথচ অবাস্তব ইচ্ছা প্রকাশ করছে। এই ধরনের বাক্যে সাবজেক্টের পর সবসময় 'could + V1' (could see) বসাতে হয়।"},
        {id: 389, bookNum: "85.b", type: "normal", raw: "I went to the library with a view to ________ (make) note there.", ans: "making", bn: "আমি সেখানে নোট তৈরি করার উদ্দেশ্যে লাইব্রেরিতে গিয়েছিলাম।", ex: "মনে রাখার মতো নিয়ম: বাক্যে 'with a view to' ফ্রেজ থাকলে এর ঠিক পরের অ্যাকশন ভার্বটির সাথে সবসময় বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 390, bookNum: "85.c", type: "normal", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "'One of'-এর নিয়ম অনুযায়ী আসল সাবজেক্ট হলো একবচন (One)। 'yesterday' থাকায় অতীতকালের সিঙ্গুলার ভার্ব 'was' বসেছে।"},
        {id: 391, bookNum: "85.d", type: "normal", raw: "The class started after the bell ________ (ring).", ans: "had rung", bn: "ঘণ্টা বাজার পর ক্লাস শুরু হয়েছিল।", ex: "নিয়ম: 'After' যুক্ত অতীত বাক্যের প্রথমাংশ Past Indefinite (started) হলে 'after'-এর পরের অংশটি সবসময় Past Perfect Tense (had + V3 অর্থাৎ had rung) হয়।"},
        {id: 392, bookNum: "86.a", type: "normal", raw: "He ran away having ________ (see) the police.", ans: "seen", bn: "পুলিশকে দেখে সে পালিয়ে গেল।", ex: "নিখুঁত নিয়ম: ইংরেজিতে পারফেক্ট পার্টিসিপল গঠনের সময় 'having' শব্দটির পর কোনো অ্যাকশন ভার্ব আসলে সেই ভার্বটির সবসময় ৩য় রূপ বা Past Participle (see -> seen) বসে।"},
        {id: 393, bookNum: "86.b", type: "normal", raw: "You would better ________ (take) rest.", ans: "take", bn: "তোমার বরং বিশ্রাম নেওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'would better' বা 'had better' এর পর কোনো 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 394, bookNum: "86.c", type: "normal", raw: "I came after he ________ (leave) home.", ans: "had left", bn: "সে বাড়ি থেকে চলে যাওয়ার পর আমি এসেছিলাম।", ex: "শর্টকাট টেকনিক: 'After' (পরে) শব্দটির আগের অংশ যদি Past Indefinite (I came) হয়, তবে 'after'-এর পরের অংশটি সবসময় Past Perfect Tense (had + left) দিয়ে মেলাতে হয়।"},
        {id: 395, bookNum: "86.d", type: "normal", raw: "No sooner had he ________ (take) the money than he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "গঠনগত নিয়ম: 'No sooner had' দিয়ে বাক্য শুরু হলে 'had' এর কারণে পরবর্তী প্রধান ভার্বটির সবসময় ৩য় রূপ বা Past Participle (taken) বসে।"},
        {id: 396, bookNum: "87.a", type: "normal", raw: "I wish I ________ (to be) a billionaire.", ans: "were", bn: "আমি যদি একজন বিলিয়নেয়ার হতাম!", ex: "'I wish' এর পর অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 397, bookNum: "87.b", type: "normal", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "বাক্যে অতীত নির্দেশক শব্দ 'yesterday' (গতকাল) উল্লেখ থাকায় ইন্টারোগেটিভ গঠনে Past Indefinite স্ট্রাকচার (Where + did + subject + V1) বসেছে।"},
        {id: 398, bookNum: "87.c", type: "normal", raw: "It is I who ________ (be) responsible for this work.", ans: "am", bn: "আমিই এই কাজের জন্য দায়ী।", ex: "খুব চমৎকার নিয়ম: 'It is I who' বা রিলেটিভ প্রোনাউন যুক্ত বাক্যে 'who'-এর আগের Noun/Pronoun (এখানে 'I') অনুযায়ী ভার্ব বসে। যেহেতু 'I' আছে, তাই Be-verb হিসেবে 'am' বসেছে।"},
        {id: 400, bookNum: "87.d", type: "normal", raw: "Gulliver's Travels ________ (be) a famous book.", ans: "is", bn: "গুলিভার্স ট্রাভেলস একটি বিখ্যাত বই।", ex: "যদিও নামের শেষে 'Travels' (s যুক্ত) আছে, কিন্তু 'Gulliver's Travels' হলো একটি মাত্র নির্দিষ্ট সুপরিচিত বইয়ের নাম (Singular Noun)। তাই এর পর Singular Verb 'is' বসেছে।"},
        {id: 401, bookNum: "87.e", type: "normal", raw: "You had better ________ (went) to bed early.", ans: "go", bn: "তোমার বরং তাড়াতাড়ি ঘুমাতে যাওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' এর পর ভার্বের কোনো Past Form বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1 অর্থাৎ go) বসে।"},
        {id: 402, bookNum: "88.a", type: "normal", raw: "They ________ (play) at this moment.", ans: "are playing", bn: "তারা এই মুহূর্তে খেলছে।", ex: "বাক্যে 'at this moment' (এই মুহূর্তে) শব্দগুচ্ছ নির্দেশ করে যে কাজটি বর্তমানে চোখের সামনে অনবরত ঘটছে। তাই এটি Present Continuous Tense (are playing) হয়েছে।"},
        {id: 403, bookNum: "88.b", type: "normal", raw: "I ________ (see) him recently.", ans: "have seen", bn: "আমি সম্প্রতি তাকে দেখেছি।", ex: "বাক্যে 'recently' (সম্প্রতি) শব্দ থাকার কারণে এটি Present Perfect Tense। Subject 'I' এর পর সাহায্যকারী ভার্ব 'have' এবং see-এর ৩য় রূপ 'seen' বসেছে।"},
        {id: 404, bookNum: "88.c", type: "normal", raw: "He made me to ________ (do) the work.", ans: "do", bn: "সে আমাকে দিয়ে কাজটি করিয়েছিল।", ex: "Causative Verb 'make/made' এর নিয়ম: মেক (made) এর পর যদি কোনো ব্যক্তি অবজেক্ট (me) থাকে, তবে পরবর্তী ভার্বের সাথে 'to' সম্পূর্ণ ভুল, সরাসরি Base Form (V1) বসে।"},
        {id: 405, bookNum: "88.d", type: "normal", raw: "Either he or his brother ________ (be) guilty.", ans: "is/was", bn: "হয় সে অথবা তার ভাই দোষী।", ex: "নিয়ম: 'Either... or' দ্বারা যুক্ত সাবজেক্টের ক্ষেত্রে 'or'-এর ঠিক পরের সাবজেক্ট (his brother - Singular) অনুযায়ী ভার্ব নির্ধারিত হয়। তাই সিঙ্গুলার ভার্ব হিসেবে 'is' বা 'was' সঠিক।"},
        {id: 406, bookNum: "88.e", type: "normal", raw: "A pair of shoes ________ (be) on the table.", ans: "is/was", bn: "টেবিলের ওপর এক জোড়া জুতো আছে/ছিল।", ex: "যদিও জুতো (shoes) বহুবচন, কিন্তু এখানে সাবজেক্টের শুরুতে 'A pair of' (এক জোড়া) থাকার কারণে এটিকে একটি একক বা সিঙ্গুলার ধারণা হিসেবে ধরা হয়। তাই Singular Verb 'is' বা 'was' বসেছে।"},
        {id: 407, bookNum: "89.a", type: "normal", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (came) বসেছে।"},
        {id: 408, bookNum: "89.b", type: "normal", raw: "They ________ (not go) to school everyday.", ans: "do not go", bn: "তারা প্রতিদিন স্কুলে যায় না।", ex: "বাক্যে 'everyday' থাকা মানে এটি সাধারণ বর্তমান কাল। Present Indefinite Tense-কে নেগেটিভ বা না-বোধক করতে Subject Plural (They) হওয়ায় সাহায্যকারী ভার্ব 'do not' এবং এরপর ভার্বের V1 বসে।"},
        {id: 409, bookNum: "89.c", type: "normal", raw: "The sun ________ (give) us light.", ans: "সূর্য আমাদের আলো দেয়।", ans: "gives", ex: "এটি একটি চিরন্তন সত্য (Universal Truth) বাক্য। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'The sun' থার্ড পারসন সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'gives' হয়েছে।"},
        {id: 410, bookNum: "89.d", type: "normal", raw: "I ________ (suffer) from fever for a long time.", ans: "have been suffering", bn: "আমি দীর্ঘ সময় ধরে জ্বরে ভুগছি।", ex: "দীর্ঘ সময় ধরে (for a long time) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে চলছে। সময়ের এই ব্যাপ্তির কারণে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 411, bookNum: "89.e", type: "normal", raw: "The brave never ________ (fear) death.", ans: "বীরেরা কখনো মৃত্যুকে ভয় পায় না।", ans: "fear", bn: "বীরেরা কখনো মৃত্যুকে ভয় পায় না।", ex: "নিয়ম: 'The brave' শব্দটি দ্বারা পৃথিবীতে সমস্ত সাহসী মানুষদের সমষ্টিগতভাবে (Plural Noun) বোঝানো হয়। Subject বহুবচন হওয়ায় সাধারণ বর্তমানে ভার্বটি অপরিবর্তিত (fear) থাকবে।"},
        {id: 412, bookNum: "90.a", type: "normal", raw: "To ________ (frank), he is a liar.", ans: "be frank", bn: "সত্যি বলতে, সে একজন মিথ্যাবাদী।", ex: "এখানে 'To be frank' একটি চমৎকার ইংরেজি ফ্রেজ বা ইডিয়ম, যার অর্থ হলো স্পষ্ট করে বা খোলামেলাভাবে বলা। ইনফিনিটিভ 'To' এর পর এখানে 'be' বসে ফ্রেজটি পূর্ণ করেছে।"},
        {id: 413, bookNum: "90.b", type: "normal", raw: "Would you mind ________ (to have) a cup of tea.", ans: "having", bn: "আপনি কি দয়া করে এক কাপ চা খাবেন?", ex: "সহজ নিয়ম: বিনম্র অনুরোধের ফ্রেজ 'Would you mind' এর পর ব্র্যাকেটের 'to' উঠে যায় এবং পরবর্তী মূল ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত হয়ে Gerund গঠিত হয়।"},
        {id: 414, bookNum: "90.c", type: "normal", raw: "If you would like to come, I ________ wait for you.", ans: "will", bn: "তুমি যদি আসতে চাও, তবে আমি তোমার জন্য অপেক্ষা করবো।", ex: "এটি একটি সাধারণ শর্তযুক্ত বা First Conditional বাক্য। একপাশে বিনীত ইচ্ছা বা বর্তমান সাধারণ রূপ প্রকাশ পাওয়ায় অপর পাশে ভবিষ্যৎ নিশ্চিত কাজ হিসেবে 'will + V1' বসেছে।"},
        {id: 415, bookNum: "90.e", type: "normal", raw: "How often ________ the bell ring?", ans: "does", bn: "ঘণ্টাটি কতক্ষণ পর পর বাজে?", ex: "সাধারণ বর্তমান কালের ইন্টারোগেটিভ বা প্রশ্নবোধক বাক্য। Subject 'the bell' থার্ড পারসন সিঙ্গুলার বা একবচন হওয়ায় সাহায্যকারী ভার্ব হিসেবে 'does' বসেছে।"},
        {id: 416, bookNum: "91.a", type: "normal", raw: "I am thinking of ________ away next week (go)", ans: "going", bn: "আমি আগামী সপ্তাহে চলে যাওয়ার কথা ভাবছি।", ex: "সহজ নিয়ম: বাক্যে 'of' একটি Preposition (পদান্বয়ী অব্যয়)। ইংরেজি ব্যাকরণের নিয়ম অনুযায়ী প্রিপজিশনের পর কোনো ভার্ব আসলে তার সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 417, bookNum: "91.b", type: "normal", raw: "He failed ________ the problem (solve)", ans: "to solve", bn: "সে সমস্যাটি সমাধান করতে ব্যর্থ হয়েছিল।", ex: "বাক্যে 'failed' একটি মূল অ্যাকশন ভার্ব। একই সরল বাক্যে উদ্দেশ্য বা ফল প্রকাশ করতে পরবর্তী দ্বিতীয় ভার্বটির আগে 'to' বসিয়ে ইনফিনিটিভ (to solve) করতে হয়।"},
        {id: 418, bookNum: "91.c", type: "normal", raw: "His friends were not ________ by his sorrow (move)", ans: "moved", bn: "তার দুঃখ দেখে তার বন্ধুরা বিন্দুমাত্র বিচলিত হয়নি।", ex: "বন্ধুরা নিজে নিজে বিচলিত হয়নি, তার দুঃখের দ্বারা হয়েছিল (Passive Voice)। 'were not' এর পর প্যাসিভ ভয়েসের নিয়ম অনুযায়ী মূল ভার্বের Past Participle (V3 অর্থাৎ moved) বসেছে।"},
        {id: 419, bookNum: "91.d", type: "normal", raw: "I never thought I ________ you again. (see)", ans: "would see", bn: "আমি কখনো ভাবিনি যে তোমার সাথে আমার আবার দেখা হবে।", ex: "নিয়ম: প্রধান ক্লজটি অতীতে (thought) থাকার কারণে, পরবর্তী ভবিষ্যতের সম্ভাবনা প্রকাশ করতে 'will' পরিবর্তিত হয়ে তার Past Form 'would + V1' (would see) হয়েছে।"},
        {id: 420, bookNum: "92.a", type: "normal", raw: "The innings just ________ (begin).", ans: "has been begun", bn: "ইনিংসটি এইমাত্র শুরু করা হয়েছে।", ex: "বাক্যে 'just' থাকার কারণে এটি Present Perfect Tense। 'Innings' শব্দটি দেখতে বহুবচন হলেও এটি মূলত সিঙ্গুলার নাউন। খেলাটি নিজে শুরু হয় না বিধায় প্যাসিভ ভয়েসে 'has been begun' হয়েছে।"},
        {id: 421, bookNum: "92.b", type: "normal", raw: "Your bicycle needs ________ (repair).", ans: "to be repaired", bn: "তোমার সাইকেলটি মেরামত করা প্রয়োজন।", ex: "সাইকেল নিজে নিজেকে মেরামত করতে পারে না (Passive)। 'needs'-এর পর ইনফিনিটিভের প্যাসিভ রূপ হিসেবে 'to be + V3' (to be repaired) বসে বাক্যটি পূর্ণ করেছে।"},
        {id: 422, bookNum: "92.c", type: "normal", raw: "Where you ________ (go) yesterday?", ans: "did you go", bn: "গতকাল তোমরা কোথায় গিয়েছিলে?", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ইন্টারোগেটিভ বা প্রশ্নবোধক গঠনে Past Indefinite স্ট্রাকচার (Where + did + subject + V1) বসেছে।"},
        {id: 423, bookNum: "92.d", type: "normal", raw: "A lot of sugar from the sack ________ (steal).", ans: "was stolen", bn: "বস্তা থেকে প্রচুর চিনি চুরি হয়ে গিয়েছিল।", ex: "চিনি নিজে নিজে চুরি হতে পারে না, চোরের দ্বারা হয়েছিল (Passive Voice)। 'Sugar' আনকাউন্টেবল বা সিঙ্গুলার নাউন হওয়ায় অতীতের প্যাসিভ হিসেবে 'was stolen' বসেছে।"},
        {id: 424, bookNum: "93.a", type: "normal", raw: "It is many years since I ________ (come) to your house.", ans: "came", bn: "অনেক বছর হলো আমি তোমার বাড়িতে এসেছি।", ex: "টাইম লিঙ্কিং নিয়ম: 'Since'-এর আগের অংশ Present Indefinite (is) থাকলে, 'since'-এর পরের অংশটি সবসময় Past Indefinite Tense (V2 অর্থাৎ came) হয়।"},
        {id: 425, bookNum: "93.b", type: "normal", raw: "He talked as if he ________ (know) everything.", ans: "had known", bn: "সে এমনভাবে কথা বলছিল যেন সে সবকিছুই জানতো।", ex: "পরীক্ষার গুরুত্বপূর্ণ নিয়ম: বাক্যে 'as if' বা 'as though' এর আগের অংশ Past Indefinite (talked) হলে, পরের অংশটি সবসময় Past Perfect Tense (had + V3 অর্থাৎ had known) দিয়ে মেলাতে হয়।"},
        {id: 426, bookNum: "93.c", type: "normal", raw: "You, he and I ________ (be) friends.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "তিনটি ভিন্ন ভিন্ন পারসন 'and' দ্বারা যুক্ত হয়ে যৌথ বহুবচন সাবজেক্ট গঠন করায় এখানে সাহায্যকারী ভার্ব হিসেবে 'are' বসেছে।"},
        {id: 427, bookNum: "93.d", type: "normal", raw: "Time and tide ________ (wait) for none.", wait: "wait", bn: "সময় ও স্রোত কারো জন্য অপেক্ষা করে না। (বিখ্যাত প্রবাদ)", ex: "এটি একটি চিরন্তন সত্য এবং বিখ্যাত প্রবাদ বাক্য। 'Time and tide' দুটি ভিন্ন জিনিস হলেও প্রবাদ বাক্যের ঐতিহ্যগত নিয়ম অনুযায়ী এদের পর Plural Verb 'wait' বসে।"},
        {id: 428, bookNum: "93.e", type: "normal", raw: "While ________ (read) a book, I saw a picture of an ox.", ans: "reading", bn: "বই পড়ার সময়, আমি একটি ষাঁড়ের ছবি দেখলাম।", ex: "সহজ নিয়ম: 'While'-এর ঠিক পরেই যদি সরাসরি কোনো Subject না থাকে (ব্র্যাকেট থাকে), তবে ওই ভার্বের সাথে সরাসরি ing যুক্ত করে দিতে হয়।"},
        {id: 429, bookNum: "94.a", type: "normal", raw: "The sun ________ (rise) in the east.", ans: "rises", bn: "সূর্য পূর্ব দিকে উদিত হয়।", ex: "এটি একটি বৈজ্ঞানিক এবং চিরন্তন সত্য (Universal Truth) বাক্য। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'The sun' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'rises' হয়েছে।"},
        {id: 430, bookNum: "94.b", type: "normal", raw: "The wearer best knows where the shoe ________ (pinch),", ans: "pinches", bn: "যার ফুস্কা সে-ই জানে জুতো কোথায় কামড়ায়। (যার কষ্ট সে-ই বোঝে)", ex: "এটি একটি চমৎকার প্রবাদ বাক্য (Present Indefinite)। Subject 'the shoe' থার্ড পারসন সিঙ্গুলার বা একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'pinches' হয়েছে।"},
        {id: 431, bookNum: "94.c", type: "normal", raw: "It is high time you ________ (do) it.", ans: "did", bn: "এটাই উপযুক্ত সময় তোমার এটি করার।", ex: "নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (you) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ did) হয়।"},
        {id: 432, bookNum: "94.d", type: "normal", raw: "The condition of flood victims ________ (beggar) description.", ans: "beggars", bn: "বন্যাদুর্গতদের অবস্থা বর্ণনা অতীত।", ex: "এখানে 'beggar description' একটি ফ্রেজ যার অর্থ বর্ণনা অতীত হওয়া বা ভাষায় প্রকাশ না করা যাওয়া। 'The condition' সিঙ্গুলার সাবজেক্ট হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'beggars' হয়েছে।"},
        {id: 433, bookNum: "95.a", type: "normal", raw: "Traffic jam ________ (mean) blockade of vehicles.", ans: "means", bn: "যানজট মানেই যানবাহনের অবরুদ্ধ অবস্থা।", ex: "যানজটের একটি সাধারণ সংজ্ঞা বা চিরন্তন বাস্তব চিত্র প্রকাশ করছে (Present Indefinite)। Subject 'Traffic jam' সিঙ্গুলার বা একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'means' হয়েছে।"},
        {id: 434, bookNum: "95.b", type: "normal", raw: "The increasing number of vehicles ________ (be) creating this problem.", ans: "is", bn: "যানবাহনের ক্রমবর্ধমান সংখ্যাই এই সমস্যাটি তৈরি করছে।", ex: "এখানে যানবাহনগুলো (vehicles) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The increasing number' (ক্রমবর্ধমান সংখ্যা), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 435, bookNum: "95.c", type: "normal", raw: "However, this problem can ________ (solve) by taking some steps.", ans: "be solved", bn: "যাই হোক, কিছু পদক্ষেপ নেওয়ার মাধ্যমে এই সমস্যার সমাধান করা যেতে পারে।", ex: "সমস্যাটি নিজে নিজে সমাধান হতে পারে না, কর্তৃপক্ষের দ্বারা করা হবে (Passive Voice)। Modal verb-এর Passive করার সময় 'Modal (can) + be + V3 (solved)' স্ট্রাকচার বসে।"},
        {id: 436, bookNum: "95.d", type: "normal", raw: "The authority ________ (impose) the traffic rules strictly.", ans: "imposes", bn: "কর্তৃপক্ষ ট্রাফিক নিয়মগুলো কঠোরভাবে আরোপ করে।", ex: "কর্তৃপক্ষের একটি নিয়মিত বা সাধারণ দায়িত্ব প্রকাশ পাচ্ছে (Present Indefinite)। 'The authority' শব্দটিকে সিঙ্গুলার কালেক্টিভ নাউন হিসেবে ধরে ভার্বের সাথে s যুক্ত হয়ে 'imposes' হয়েছে।"},
        {id: 437, bookNum: "95.e", type: "normal", raw: "By ________ (implement) some actions we can reduce the problem.", ans: "implementing", bn: "কিছু পদক্ষেপ বাস্তবায়নের মাধ্যমে আমরা এই সমস্যাটি কমিয়ে আনতে পারি।", ex: "সহজ নিয়ম: বাক্যে 'By' একটি Preposition (দ্বারা/মাধ্যমে)। ইংরেজি ব্যাকরণের নিয়ম অনুযায়ী প্রিপজিশনের পর কোনো অ্যাকশন ভার্ব আসলে তার সাথে সবসময় ing যুক্ত করতে হয়।"},



        
                // =======================================================

        // =======================================================
        {id: 447, bookNum: "1", type: "previous", raw: "Five miles ________ (to be) too far to walk.", ans: "is", bn: "পাঁচ মাইল হাঁটার জন্য অনেক বেশি দূর।", ex: "সহজ কারণ: মাইলস (miles) দেখতে প্লুরাল মনে হলেও, যখন কোনো নির্দিষ্ট দূরত্ব বা ওজনকে একটি একক সমষ্টি হিসেবে ধরা হয়, তখন ভার্বটি সবসময় Singular বা 'is' হয়।"},
        {id: 448, bookNum: "2", type: "previous", raw: "The page of the book ________ (be) torn.", ans: "is", bn: "বইটির পাতাটি ছেঁড়া।", ex: "এখানে বইগুলো (books) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The page' (পাতা), যা একটি একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 449, bookNum: "3", type: "previous", raw: "Had I been a poet, I ________ (write) a book of poems.", ans: "would have written", bn: "আমি যদি কবি হতাম, তবে একটি কবিতার বই লিখতাম।", ex: "বাক্যের শুরুতে 'Had + Subject + V3' থাকা মানে এটি Third Conditional (অতীতের অবাস্তব ইচ্ছা)। তাই অপর অংশে নিয়ম মেনে 'Subject + would have + V3' বসাতে হয়।"},
        {id: 450, bookNum: "4", type: "previous", raw: "I got the book ________ (print).", ans: "printed", bn: "আমি বইটি ছাপিয়ে নিলাম।", ex: "Causative Verb-এর নিয়ম: 'get/got'-এর পর যখন কোনো বস্তুবাচক জিনিস (the book) থাকে, তখন তার ঠিক পরের ভার্বটির ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 451, bookNum: "5", type: "previous", raw: "The event will be ________ (telecast) tomorrow.", ans: "telecast", bn: "অনুষ্ঠানটি আগামীকাল সম্প্রচার করা হবে।", ex: "প্রথমত 'will be' এর পর প্যাসিভ ভয়েসের কারণে V3 বসবে। মনে রাখার মতো বিষয় হলো—'telecast' ভার্বটির প্রেজেন্ট, পাস্ট এবং পাস্ট পার্টিসিপল (V1, V2, V3) তিনটি রূপই হুবহু এক (telecast)।"},
        {id: 452, bookNum: "6", type: "previous", raw: "Sugar is ________ (import) from Brazil.", ans: "imported", bn: "ব্রাজিল থেকে চিনি আমদানি করা হয়।", ex: "চিনি নিজে নিজেকে আমদানি করতে পারে না, দেশের বা ব্যবসায়ীদের দ্বারা আমদানি করা হয় (Passive Voice)। তাই 'is' এর পর মূল ভার্বের Past Participle (V3) হিসেবে 'imported' বসেছে।"},
        {id: 453, bookNum: "7", type: "previous", raw: "I have never ________ (see) the Himalayas.", ans: "আমি কখনো হিমালয় দেখিনি।", ans: "seen", ex: "Present Perfect Tense-এর সাধারণ গঠন: 'have/has' এর পর মূল ভার্বের সবসময় ৩য় রূপ বা Past Participle রূপ বসে। see -> seen।"},
        {id: 454, bookNum: "8", type: "previous", raw: "It is high time we ________ (give up) smoking.", ans: "gave up", bn: "এটাই উপযুক্ত সময় আমাদের ধূমপান ছেড়ে দেওয়ার।", ex: "পরীক্ষায় বারবার আসা নিয়ম: বাক্যে 'It is time' বা 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি সবসময় Past Indefinite Form (V2 অর্থাৎ gave up) হয়।"},
        {id: 455, bookNum: "9", type: "previous", raw: "As soon as he saw me, he ________ (flee) away.", ans: "fled", bn: "আমাকে দেখা মাত্রই সে পালিয়ে গেল।", ex: "নিয়ম: 'As soon as' যুক্ত বাক্যের একপাশের ক্লজটি Past Indefinite (saw) হলে, অন্য পাশের ক্লজটিও সামঞ্জস্য রেখে Past Indefinite Tense (V2) হয়। flee এর পাস্ট ফর্ম হলো fled।"},
        {id: 456, bookNum: "10", type: "previous", raw: "I wish I ________ (be) in the occasion.", ans: "were", bn: "আমি যদি ওই অনুষ্ঠানে উপস্থিত থাকতে পারতাম!", ex: "'I wish' এর পর অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 457, bookNum: "11", type: "previous", raw: "Bengali ________ (speak) in Calcutta also.", ans: "is spoken", bn: "কলকাতাতেও বাংলা ভাষা বলা হয়।", ex: "বাংলা ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয় (Passive)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে সিঙ্গুলার নাউনের সাথে 'is + V3' (is spoken) বসেছে।"},
        {id: 458, bookNum: "12", type: "previous", raw: "Two years ________ (pass) since he left home.", ans: "have passed", bn: "সে বাড়ি ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "টাইম লিঙ্কিং নিয়ম: 'Since'-এর পরের অংশটি যদি Past Indefinite (left) হয়, তবে 'since'-এর আগের অংশটি সবসময় Present Perfect Tense (have/has + V3) হয়।"},
        {id: 459, bookNum: "13", type: "previous", raw: "The statement needs to ________ by Sunday. (submit)", ans: "be submitted", bn: "বিবৃতিটি রোববারের মধ্যে জমা দেওয়া প্রয়োজন।", ex: "বিবৃতিটি নিজে নিজে জমা হতে পারে না (Passive)। 'need to' এর পর ইনফিনিটিভের প্যাসিভ রূপ হিসেবে 'be + V3' (be submitted) বসে বাক্যটি পূর্ণ করেছে।"},
        {id: 460, bookNum: "14", type: "previous", raw: "Why didn't you ________ (threw) the bag away?", ans: "throw", bn: "তুমি কেন ব্যাগটি ফেলে দিলে না?", ex: "সহজ শর্টকাট: নেগেটিভ বা প্রশ্নবোধক বাক্যে সাহায্যকারী ভার্ব হিসেবে একবার 'did/didn't' (Past) বসে গেলে, মূল ভার্বটির সবসময় একদম আসল রূপ বা Base Form (V1 অর্থাৎ throw) বসে।"},
        {id: 461, bookNum: "15", type: "previous", raw: "She usually ________ (visit) her parents on Fridays.", ans: "visits", bn: "সে সাধারণত শুক্রবারগুলোতে তার বাবা-মায়ের সাথে দেখা করতে যায়।", ex: "বাক্যে 'usually' (সাধারণত) থাকা মানে এটি একটি নিয়মিত অভ্যাস (Present Indefinite)। Subject 'She' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'visits' হয়েছে।"},
        {id: 462, bookNum: "16", type: "previous", raw: "I enjoy ________ (write) stories for children.", ans: "writing", bn: "আমি শিশুদের জন্য গল্প লিখতে পছন্দ করি/উপভোগ করি।", ex: "ইংরেজিতে 'enjoy', 'mind', 'finish' ইত্যাদি ভার্বগুলোর ঠিক পরপরই যদি আরেকটি অ্যাকশন ভার্ব আসে, তবে তার সাথে বাধ্যতামূলকভাবে ing যুক্ত করে জেরান্ড করতে হয়।"},
        {id: 463, bookNum: "17", type: "previous", raw: "A good man always ________ (help) his neighbors.", ans: "একজন ভালো মানুষ সবসময় তার প্রতিবেশীদের সাহায্য করে।", ans: "helps", ex: "বাক্যে 'always' (সবসময়) শব্দটি নিয়মতান্ত্রিক ভালো স্বভাব বা সাধারণ বর্তমান নির্দেশ করে। Subject একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'helps' হয়েছে।"},
        {id: 464, bookNum: "18", type: "previous", raw: "They ________ (play) at this moment.", ans: "are playing", bn: "তারা এই মুহূর্তে খেলছে।", ex: "বাক্যে 'at this moment' (এই মুহূর্তে) শব্দগুচ্ছ নির্দেশ করে যে কাজটি বর্তমানে চোখের সামনে অনবরত ঘটছে। তাই এটি Present Continuous Tense (are playing) হয়েছে।"},
        {id: 465, bookNum: "19", type: "previous", raw: "I ________ (see) a bird yesterday.", ans: "saw", bn: "গতকাল আমি একটি পাখি দেখেছিলাম।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (saw) বসেছে।"},
        {id: 466, bookNum: "20", type: "previous", raw: "Fahim walked quickly lest he ________ (miss) the train.", ans: "should miss", bn: "ফাহিম দ্রুত হেঁটেছিল পাছে সে ট্রেনটি মিস না করে।", ex: "সবচেয়ে কমন নিয়ম: বাক্যে 'lest' (পাছে ভয় হয় যে) শব্দটি থাকলে, এর পরবর্তী সাবজেক্টের পর সবসময় 'should' অথবা 'might' বসিয়ে ভার্বের V1 বসাতে হয়।"},
        {id: 467, bookNum: "21", type: "previous", raw: "Would that I ________ (know) the answer to this question.", ans: "could know", bn: "আমি যদি এই প্রশ্নের উত্তরটি জানতে পারতাম!", ex: "বাক্যের শুরুতে 'Would that' থাকা মানেই এটি একটি তীব্র অথচ অসম্ভব ইচ্ছা প্রকাশ করছে। এই ধরনের বাক্যে সাবজেক্টের পর সবসময় 'could + V1' (could know) বসাতে হয়।"},
        {id: 468, bookNum: "22", type: "previous", raw: "The doctor ________ (die) in his chamber before the patient ________ (come).", ans: "had died, came", bn: "রোগী আসার পূর্বেই ডাক্তার তাঁর চেম্বারে মারা গিয়েছিলেন।", ex: "অতীতের দুটি কাজের মধ্যে 'before' (পূর্বে) এর আগের কাজটি আগে ঘটেছিল (ডাক্তার আগে মারা যান), তাই সেটি Past Perfect (had died) এবং পরের অংশটি Past Indefinite (came) হয়েছে।"},
        {id: 469, bookNum: "23", type: "previous", raw: "He speaks as if he ________ (know) everything.", ans: "knew", bn: "সে এমনভাবে কথা বলে যেন সে সবকিছুই জানে।", ex: "নিয়ম: বাক্যে 'as if' বা 'as though' এর আগের অংশ Present Indefinite (speaks) হলে, পরের অংশটি অবাস্তব বা কাল্পনিক ধারণা প্রকাশ করতে Past Indefinite Tense (V2 অর্থাৎ knew) হয়।"},
        {id: 470, bookNum: "24", type: "previous", raw: "Would you mind ________ (open) the window?", ans: "opening", bn: "আপনি কি দয়া করে জানালাটি খুলে দেবেন?", ex: "কাউকে ভদ্রভাবে বা বিনম্র অনুরোধ করতে যখন 'Would you mind' ব্যবহার করা হয়, তখন তার ঠিক পরের ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 471, bookNum: "25", type: "previous", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "এখানে 'had' ভার্বটি একা আছে, অর্থাৎ এটি Past Indefinite Tense (Second Conditional)। তাই নিয়ম মেনে পরের অংশে Subject + would + V1 (open) বসেছে।"},
        {id: 472, bookNum: "26", type: "previous", raw: "One of the students ________ (be) absent yesterday.", ans: "was", bn: "ছাত্রদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "মনে রাখবেন: 'One of'-এর পর Noun প্লুরাল হলেও আসল সাবজেক্ট কিন্তু ওই একজন (One)। 'yesterday' থাকায় অতীতকালের সিঙ্গুলার ভার্ব 'was' বসেছে।"},
        {id: 473, bookNum: "27", type: "previous", raw: "I went to my village home with a view to ________ (meet) my grandmother.", ans: "meeting", bn: "আমি আমার দাদীর সাথে দেখা করার উদ্দেশ্যে আমার গ্রামের বাড়িতে গিয়েছিলাম।", ex: "মনে রাখার মতো নিয়ম: বাক্যে 'with a view to' ফ্রেজ থাকলে এর ঠিক পরের অ্যাকশন ভার্বটির সাথে সবসময় বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 474, bookNum: "28", type: "previous", raw: "To ________ (read) a book is pleasing; but to select what ________ (read) is difficult.", ans: "reading, reading", ans_fix: "read, to read", bn: "বই পড়া আনন্দদায়ক; কিন্তু কী পড়তে হবে তা নির্বাচন করা কঠিন।", ex: "বাক্যের শুরুতে 'To' দেওয়া আছে, যা ইনফিনিটিভ নির্দেশ করে। সমান্তরাল গঠনে প্রথম অংশে To read এবং দ্বিতীয় অংশে 'what to read' (কী পড়তে হবে) ইনফিনিটিভ ফ্রেজ হিসেবে বসেছে।"},
        {id: 475, bookNum: "29", type: "previous", raw: "A ________ (roll) stone gathers no moss.", ans: "rolling", bn: "চলমান পাথরে শ্যাওলা ধরে না। / ঘূর্ণায়মান পাথরে শ্যাওলা জমে না। (বিখ্যাত প্রবাদ)", ex: "এখানে পাথরটির একটি চলমান অবস্থা বা গুণ প্রকাশ পাচ্ছে। Noun-এর পূর্বে যখন কোনো ভার্ব Adjective-এর মতো কাজ করে, তখন তার সাথে ing যুক্ত করে 'Present Participle' (rolling) করতে হয়।"},
        {id: 476, bookNum: "30", type: "previous", raw: "Neither he nor his friends ________ (attend) the function.", ans: "have attended", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "নিয়ম: 'Neither... nor' দ্বারা যুক্ত সাবজেক্টের ক্ষেত্রে 'nor'-এর ঠিক পরের সাবজেক্ট (his friends - Plural) অনুযায়ী ভার্ব নির্ধারিত হয়। যেহেতু friends বহুবচন, তাই 'have' বসেছে।"},
        {id: 477, bookNum: "31", type: "previous", raw: "One of the boys ________ (have) done it.", ans: "has", bn: "বালকদের মধ্যে একজন এটি করেছে।", ex: "নিয়ম: 'One of' এর পর Noun প্লুরাল হলেও এর ভেতরের একজনকে নির্দিষ্ট করায় প্রধান সাবজেক্ট Singular বা একবচন হয়, তাই 'has' বসেছে।"},
        {id: 478, bookNum: "32", type: "previous", raw: "The earth ________ (move) round the sun.", ans: "moves", bn: "পৃথিবী সূর্যের চারদিকে ঘোরে।", ex: "এটি একটি চিরন্তন বৈজ্ঞানিক সত্য (Universal Truth) বাক্য। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'The earth' একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'moves' হয়েছে।"},
        {id: 479, bookNum: "33", type: "previous", raw: "One of the girls ________ (have) done it.", ans: "has", bn: "মেয়েদের মধ্যে একজন এটি করেছে।", ex: "'One of' নিয়মানুযায়ী অনেক মেয়ের মধ্যে একজনকে বোঝানো হচ্ছে। Subject সিঙ্গুলার হওয়ায় সাহায্যকারী ভার্ব হিসেবে 'has' বসেছে।"},
        {id: 480, bookNum: "34", type: "previous", raw: "I wish I ________ a king. (was/were)", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "'I wish' এর পর অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে, কখনো 'was' হয় না।"},
        {id: 481, bookNum: "35", type: "previous", raw: "I want to see the house ________ white. (painting/painted)", ans: "painted", bn: "আমি বাড়িটি সাদা রঙ করা অবস্থায় দেখতে চাই।", ex: "বাড়িটি নিজে নিজেকে রঙ করতে পারে না, অন্যের দ্বারা করা সম্পূর্ণ অবস্থা বোঝাতে এখানে Past Participle বা Passive Participle (painted) বসেছে।"},
        {id: 482, bookNum: "36", type: "previous", raw: "I am looking forward ________ you. (to see/to seeing/seeing)", ans: "to seeing", bn: "আমি তোমার সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "খুব কমন নিয়ম: 'looking forward' এর পর এপ্রোপ্রিয়েট ফ্রেজ হিসেবে 'to' বসে এবং এরপর ভার্বের সাথে সর্বদা ing যুক্ত হয়ে 'to seeing' গঠিত হয়।"},
        {id: 483, bookNum: "37", type: "previous", raw: "Everybody ________ problems. (has/have)", ans: "has", bn: "প্রত্যেকেরই সমস্যা আছে।", ex: "ইংরেজি ব্যাকরণে 'Everybody', 'Everyone', 'Somebody' শব্দগুলোকে সবসময় Singular Pronoun বা একবচন হিসেবে গণ্য করা হয়। তাই সিঙ্গুলার ভার্ব 'has' বসেছে।"},
        {id: 484, bookNum: "38", type: "previous", raw: "We are looking forward to ________ (hear) from you.", ans: "hearing", bn: "আমরা আপনার কাছ থেকে শোনার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "নিয়ম মেনে 'looking forward to' ফ্রেজটির পর পরবর্তী প্রধান অ্যাকশন ভার্বটির সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 485, bookNum: "39", type: "previous", raw: "The room needs to be ________ (renovate).", ans: "renovated", bn: "রুমটি সংস্কার করা প্রয়োজন।", ex: "রুম নিজে নিজেকে সংস্কার করতে পারে না (Passive Voice)। 'to be' এর পর নিয়মানুযায়ী মূল ভার্বের Past Participle বা ৩য় রূপ (V3 অর্থাৎ renovated) বসে।"},
        {id: 486, bookNum: "40", type: "previous", raw: "It is high time you stopped ________ (smoke).", ans: "smoking", bn: "ধূমপান বন্ধ করার এটাই উপযুক্ত সময় তোমার।", ex: "এখানে 'stopped' অলরেডি একটি ভার্ব হিসেবে বসে গেছে। একই সরল বাক্যে আরেকটি কাজের সমাপ্তি বা জেরান্ড অবস্থা বোঝাতে ২য় ভার্বের সাথে ing যুক্ত হয়ে 'smoking' হয়েছে।"},
        {id: 487, bookNum: "41", type: "previous", raw: "It ________ (rain) since last night.", ans: "has been raining", bn: "গত রাত থেকে বৃষ্টি হচ্ছে।", ex: "গত রাত থেকে (since last night) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। তাই নিয়ম মেনে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 488, bookNum: "42", type: "previous", raw: "His choice of words ________ (be) excellent.", ans: "is", bn: "তার শব্দ চয়ন চমৎকার।", ex: "এখানে শব্দগুলো (words) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'His choice' (তার চয়ন), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 489, bookNum: "43", type: "previous", raw: "Rifat as well as his parents ________ gone to London to spend the weekend.", ans: "has", bn: "তার বাবা-মায়ের পাশাপাশি রিফাতও সপ্তাহান্ত কাটাতে লন্ডনে গিয়েছে।", ex: "গুরুত্বপূর্ণ নিয়ম: বাক্যে 'as well as', 'along with', 'with' দ্বারা দুটি সাবজেক্ট যুক্ত হলে, সবসময় প্রথম সাবজেক্ট (Rifat - Singular) অনুযায়ী ভার্ব বসে। তাই 'has' বসেছে।"},
        {id: 490, bookNum: "44", type: "previous", raw: "It ________ the students who should not miss any classes.", ans: "is", bn: "ছাত্রদেরই কোনো ক্লাস মিস করা উচিত নয়।", ex: "নিয়ম: 'It is... who' বা 'It is... that' স্ট্রাকচারে শুরুর 'It' একটি ইন্ট্রোডাক্টরি বা ডামি সাবজেক্ট, যার পর ভার্ব সবসময় বাধ্যতামূলকভাবে Singular বা 'is' হয়।"},
        {id: 491, bookNum: "45", type: "previous", raw: "Every boy and every girl ________ been given a gift.", ans: "has", bn: "প্রতিটি ছেলে এবং প্রতিটি মেয়েকে একটি করে উপহার দেওয়া হয়েছে।", ex: "সহজ নিয়ম: 'and' দ্বারা যুক্ত হলেও যদি প্রতিটির আগে 'Every' বা 'Each' শব্দ দুটি থাকে, তবে পুরো সাবজেক্টটি সবসময় একবচন বা Singular হয়, তাই 'has' বসেছে।"},
        {id: 492, bookNum: "46", type: "previous", raw: "One of the pens you bought me ________ not write well. (do/does)", ans: "does", bn: "তুমি আমাকে যে কলমগুলো কিনে দিয়েছিলে সেগুলোর মধ্যে একটি ভালো লেখে না।", ex: "মনে রাখবেন: 'One of'-এর পর অনেকগুলো কলমের (the pens) কথা বলা হলেও আসল সাবজেক্ট কিন্তু ওই একটি কলম (One)। তাই সাধারণ বর্তমানে সাহায্যকারী ভার্ব 'does' বসেছে।"},
        {id: 493, bookNum: "47", type: "previous", raw: "If I ________ you, I would study seriously. (was/were)", ans: "were", bn: "আমি যদি তোমার জায়গায় হতাম, তবে গুরুত্ব সহকারে পড়াশোনা করতাম।", ex: "এটি কাল্পনিক অতীত বা Second Conditional বাক্য। ইফ ক্লজে অবাস্তব ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 494, bookNum: "48", type: "previous", raw: "Why ________ yesterday?", ans: "did he come", bn: "সে গতকাল কেন বাড়ি এসেছিল?", ex: "বাক্যে অতীত নির্দেশক শব্দ 'yesterday' (গতকাল) উল্লেখ থাকায় ইন্টারোগেটিভ গঠনে Past Indefinite স্ট্রাকচার (Why + did + subject + V1) বসেছে।"},
        {id: 495, bookNum: "49", type: "previous", raw: "The patient ________ (die) before the doctor came.", ans: "had died", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "শর্টকাট টেকনিক: 'Before' (পূর্বে) শব্দটির আগের অংশটি সবসময় আগে ঘটে এবং সেটি Past Perfect Tense (had + V3 অর্থাৎ had died) নিয়মে পূরণ করতে হয়।"},
        {id: 496, bookNum: "50", type: "previous", raw: "It is high time he ________ (change) his bad habits.", ans: "changed", bn: "এটাই উপযুক্ত সময় তার খারাপ অভ্যাসগুলো পরিবর্তন করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (he) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ changed) হয়।"},
        {id: 497, bookNum: "51", type: "previous", raw: "Had I possessed vast property, I ________ (establish) a college.", ans: "would have established", bn: "আমার যদি বিশাল সম্পত্তি থাকতো, তবে আমি একটি কলেজ প্রতিষ্ঠা করতাম।", ex: "বাক্যের শুরুতে 'Had + Subject + V3' থাকা মানে এটি Third Conditional। তাই অপর অংশে নিয়ম মেনে 'Subject + would have + V3' বসাতে হয়।"},
        {id: 498, bookNum: "52", type: "previous", raw: "He may ________ (come) tomorrow.", ans: "come", bn: "সে আগামীকাল আসতে পারে।", ex: "Modal Auxiliary Verb (may, can, must ইত্যাদি) এর পর মূল ভার্বের সবসময় একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 499, bookNum: "53", type: "previous", raw: "She usually ________ (go) to college on foot.", ans: "সে সাধারণত পায়ে হেঁটে কলেজে যায়।", ans: "goes", ex: "বাক্যে 'usually' (সাধারণত) থাকা মানে এটি একটি নিয়মিত সাধারণ অভ্যাস (Present Indefinite)। Subject 'She' সিঙ্গুলার থাকায় ভার্বের সাথে es যুক্ত হয়ে 'goes' হয়েছে।"},
        {id: 500, bookNum: "54", type: "previous", raw: "He cannot help ________ (do) the work.", ans: "doing", bn: "সে কাজটি না করে পারে না।", ex: "সহজ নিয়ম: ইংরেজিতে 'cannot help' অথবা 'could not help' ফ্রেজটি থাকলে, এর ঠিক পরের অ্যাকশন ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 501, bookNum: "55", type: "previous", raw: "Many a man ________ (be) present on the spot where the accident occurred.", ans: "was", bn: "দুর্ঘটনাটি যেখানে ঘটেছিল সেই ঘটনাস্থলে অনেক মানুষ উপস্থিত ছিলেন।", ex: "নিয়ম: 'Many a'-এর পর Noun এবং Verb দুটিই সবসময় Singular (একবচন) হয়। তাছাড়া পেছনের ঘটনা (occurred) হওয়ায় Past Singular Be-verb হিসেবে 'was' বসেছে।"},
        {id: 502, bookNum: "56", type: "previous", raw: "If I had been there, I ________ done the job very efficiently.", ans: "would have done", bn: "আমি যদি সেখানে থাকতাম, তবে কাজটি খুব দক্ষতার সাথে করতাম।", ex: "এটি হলো Third Conditional। 'If' যুক্ত অংশটি যদি Past Perfect Tense (had + been) এ থাকে, তবে অপর অংশে সবসময় Subject + would have + V3 বসাতে হয়।"},
        {id: 503, bookNum: "57", type: "previous", raw: "Sorry! I ________ (punish) you.", ans: "must punish", bn: "দুঃখিত! আমি তোমাকে অবশ্যই শাস্তি দেবো।", ex: "ভবিষ্যতের কোনো দৃঢ় প্রতিজ্ঞা বা বাধ্যবাধকতা প্রকাশ করতে চমৎকার মোডাল ভার্ব হিসেবে 'must + V1' (must punish) বসে বাক্যটি পূর্ণ করেছে।"},
        {id: 504, bookNum: "58", type: "previous", raw: "I was let ________ (do) the work.", ans: "do", bn: "আমাকে কাজটি করতে দেওয়া হয়েছিল।", ex: "নিয়ম: বাক্যে 'let' ভার্বটি অ্যাক্টিভ বা প্যাসিভ যে রূপেই থাকুক না কেন, এর পরবর্তী মূল ভার্বটির সাথে কোনো 'to' বসে না, সরাসরি Base Form (V1) বসে।"},
        {id: 505, bookNum: "59", type: "previous", raw: "The police ________ (reach) the spot by this time.", ans: "will have reached", bn: "পুলিশ এতক্ষণে ঘটনাস্থলে পৌঁছে থাকবে।", ex: "বাক্যে 'by this time' বা 'by tomorrow' থাকলে কাজটি ভবিষ্যতের একটি নির্দিষ্ট সময়ের মধ্যে শেষ হয়ে থাকবে বোঝায়। তাই এটি Future Perfect Tense (will have + V3) হয়েছে।"},
        {id: 606, bookNum: "60", type: "previous", raw: "He talked as though he ________ (know) where he ________ (be).", ans: "had known, was", bn: "সে এমনভাবে কথা বলছিল যেন সে জানতো সে কোথায় ছিল।", ex: "নিয়ম: 'as though' এর আগের অংশ Past Indefinite (talked) হলে পরের অংশটি Past Perfect (had known) হয়। আর পরবর্তী অংশটি অতীতের সাধারণ অবস্থা প্রকাশ করায় 'was' বসেছে।"},
        {id: 507, bookNum: "61", type: "previous", raw: "When he ________ (shut) the window, we ________ (open) the door of the age.", ans: "shut, opened", bn: "যখন সে জানালাটি বন্ধ করেছিল, তখন আমরা খাঁচার দরজাটি খুলেছিলাম।", ex: "অতীতের দুটি ধারাবাহিক বা একটার পর একটা ঘটা তাৎক্ষণিক সাধারণ ঘটনা। তাই দুই পাশেই সামঞ্জস্য রেখে Past Indefinite Tense (V2) বসেছে। shut এর V2 রূপও shut।"},
        {id: 508, bookNum: "62", type: "previous", raw: "It is two years since he ________ (leave) the country.", ans: "left", bn: "সে দেশ ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "টাইম লিঙ্কিং নিয়ম: 'Since'-এর আগের অংশ Present Indefinite (is) থাকলে, 'since'-এর পরের অংশটি সবসময় Past Indefinite Tense (V2 অর্থাৎ left) হয়।"},
        {id: 509, bookNum: "63", type: "previous", raw: "Would you mind ________ (wait) a moment?", ans: "waiting", bn: "আপনি কি দয়া করে এক মুহূর্ত অপেক্ষা করবেন?", ex: "কাউকে ভদ্রভাবে বা বিনম্র অনুরোধ করতে যখন 'Would you mind' ব্যবহার করা হয়, তখন তার ঠিক পরের ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 510, bookNum: "64", type: "previous", raw: "I regret ________ (spend) so much money.", ans: "spending", bn: "আমি এত টাকা খরচ করার জন্য অনুশোচনা করছি।", ex: "কোনো কাজের অতীত ফলাফলের জন্য অনুশোচনা প্রকাশ করতে 'regret' ভার্বটির পর পরবর্তী অ্যাকশন ভার্বটির Gerund Form (verb+ing অর্থাৎ spending) বসাতে হয়।"},
        {id: 511, bookNum: "65", type: "previous", raw: "30 miles ________ (be) not a long distance.", ans: "is", bn: "৩০ মাইল দীর্ঘ দূরত্ব নয়।", ex: "নির্দিষ্ট দূরত্ব বা ওজনকে যখন একটি একক সমষ্টি হিসেবে ধরা হয়, তখন নাউনটি দেখতে প্লুরাল মনে হলেও ভার্বটি সবসময় Singular বা 'is' হয়।"},
        {id: 512, bookNum: "66", type: "previous", raw: "Bengali ________ (speak) in Calcutta also.", ans: "is spoken", bn: "কলকাতাতেও বাংলা ভাষা বলা হয়।", ex: "বাংলা ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয় (Passive Voice)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে 'is + V3' (is spoken) বসেছে।"},
        {id: 513, bookNum: "67", type: "previous", raw: "Did Mira ________ (join) there?", ans: "join", bn: "মীরা কি সেখানে যোগ দিয়েছিল?", ex: "সহজ শর্টকাট: প্রশ্নবোধক বাক্যে সাহায্যকারী ভার্ব হিসেবে একবার 'Did' (Past) বসে গেলে, মূল ভার্বটির সবসময় একদম আসল রূপ বা Base Form (V1 অর্থাৎ join) বসে।"},
        {id: 514, bookNum: "68", type: "previous", raw: "Have you ever ________ (be) to China?", ans: "been", bn: "তুমি কি কখনো চীনে গিয়েছ?", ex: "কোথাও গিয়ে ফিরে আসা বা ভ্রমণ করার অভিজ্ঞতার ক্ষেত্রে 'have/has' এর পর 'ever'-এর সাথে To-be verb এর ৩য় রূপ হিসেবে 'been' বসে (Have you ever been to...)।"},
        {id: 515, bookNum: "69", type: "previous", raw: "When he arrived, the followers ________ (stand) up.", ans: "stood", bn: "তিনি যখন পৌঁছালেন, অনুসারীরা উঠে দাঁড়ালো।", ex: "অতীতের একটি কাজের প্রেক্ষিতে আরেকটি ঘটনা সাথে সাথে সম্পন্ন হওয়া বোঝাচ্ছে। একপাশ Past Indefinite (arrived) থাকায় অপর পাশও Past Indefinite (V2 অর্থাৎ stood) হয়েছে।"},
        {id: 516, bookNum: "70", type: "previous", raw: "The law ________ (forbid) the sale of cigarettes to people under the age of 16.", ans: "forbids", bn: "আইন ১৬ বছরের কম বয়সী ব্যক্তিদের কাছে সিগারেট বিক্রি নিষিদ্ধ করে।", ex: "এটি একটি স্থায়ী বা প্রচলিত আইনি সাধারণ সত্য নিয়ম (Present Indefinite)। Subject 'The law' সিঙ্গুলার বা একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'forbids' হয়েছে।"},
        {id: 517, bookNum: "71", type: "previous", raw: "When she was in her teens she ________ (idolize) her father.", ans: "idolized", bn: "তিনি যখন কিশোরী ছিলেন তখন তিনি তাঁর বাবাকে আদর্শ মানতেন।", ex: "বাক্যের প্রথমাংশে 'was' দিয়ে কিশোরী বয়সের অতীতকাল নির্দিষ্ট করে দেওয়া হয়েছে। তাই সামঞ্জস্য রেখে পরবর্তী ভার্বটিও Past Indefinite (V2 অর্থাৎ idolized) হয়েছে।"},
        {id: 518, bookNum: "72", type: "previous", raw: "Can you ________ (give) me a date for another appointment?", ans: "give", bn: "আপনি কি আমাকে অন্য একটি অ্যাপয়েন্টমেন্টের তারিখ দিতে পারেন?", ex: "Modal Auxiliary Verb (can, could, may ইত্যাদি) এর পর প্রধান ভার্বের সবসময় একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 519, bookNum: "73", type: "previous", raw: "He speaks as if he ________ (be) mad.", ans: "were", bn: "সে এমনভাবে কথা বলে যেন সে পাগল।", ex: "নিয়ম: বাক্যে 'as if' বা 'as though' এর আগের অংশ Present Indefinite হলে, পরের অংশে অবাস্তব কাল্পনিক অবস্থা প্রকাশ করতে To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 520, bookNum: "74", type: "previous", raw: "You had better ________ (to leave) the job.", ans: "leave", bn: "তোমার বরং চাকরিটি ছেড়ে দেওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না (Bare Infinitive), সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 521, bookNum: "75", type: "previous", raw: "Who ________ (be) he?", ans: "is", bn: "সে কে?", ex: "সাধারণ বর্তমান কালের পরিচয়বাচক প্রশ্ন। Subject 'he' থার্ড পারসন সিঙ্গুলার বা একবচন হওয়ায় সাহায্যকারী Be-verb হিসেবে 'is' বসেছে।"},
        {id: 522, bookNum: "76", type: "previous", raw: "The poor woman could not help ________ (shed) tears.", ans: "shedding", bn: "অসহায় মহিলাটি চোখের জল না ফেলে পারল না।", ex: "মনে রাখার মতো নিয়ম: বাক্যে 'could not help' অথবা 'cannot help' ফ্রেজ থাকলে এর ঠিক পরের অ্যাকশন ভার্বটির সাথে সবসময় বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 523, bookNum: "77", type: "previous", raw: "I found the lion ________ (lie) in the cave.", ans: "lying", bn: "আমি সিংহটিকে গুহায় শুয়ে থাকা অবস্থায় দেখতে পেলাম।", ex: "সরল বাক্যে (Simple Sentence) প্রথম ভার্বের (found) পর অবজেক্টের একটি চলমান কাজ বা অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করে পার্টিসিপল করতে হয়।"},
        {id: 524, bookNum: "78", type: "previous", raw: "She spoke as if she ________ (be) a philosopher.", ans: "had been", bn: "সে এমনভাবে কথা বলল যেন সে একজন দার্শনিক ছিল।", ex: "খুব সূক্ষ্ম নিয়ম: বাক্যে 'as if' এর আগের অংশ Past Indefinite (spoke) হলে, পরের অংশে অবাস্তব অতীত প্রকাশ করতে Past Perfect Tense অর্থাৎ 'had been' বসাতে হয়।"},
        {id: 525, bookNum: "79", type: "previous", raw: "If I had much money, I ________ (buy) a car.", ans: "would buy", bn: "আমার যদি অনেক টাকা থাকতো, তবে আমি একটি গাড়ি কিনতাম।", ex: "এখানে 'had' ভার্বটি একাকী আছে, অর্থাৎ এটি Past Indefinite Tense (Second Conditional)। তাই নিয়ম মেনে পরের অংশে Subject + would + V1 (buy) বসেছে।"},
        {id: 526, bookNum: "80", type: "previous", raw: "She ________ (prefer) reading to writing.", ans: "prefers", bn: "সে লেখার চেয়ে পড়া বেশি পছন্দ করে।", ex: "তার একটি স্থায়ী সাধারণ পছন্দের কথা প্রকাশ পাচ্ছে (Present Indefinite)। Subject 'She' থার্ড পারসন সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'prefers' হয়েছে।"},
        {id: 527, bookNum: "81", type: "previous", raw: "I ________ (live) here for a long time.", ans: "have been living", bn: "আমি দীর্ঘ দিন ধরে এখানে বসবাস করছি।", ex: "দীর্ঘ সময় ধরে (for a long time) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। সময়ের এই ব্যাপ্তির কারণে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 528, bookNum: "82", type: "previous", raw: "He just ________ (have) his breakfast.", ans: "has just had", bn: "সে এইমাত্র তার সকালের নাস্তা খেয়েছে।", ex: "বাক্যে 'just' থাকায় এটি Present Perfect Tense। 'He' এর পর সাহায্যকারী ভার্ব বসে 'has' আর মূল ভার্ব (have/নাস্তা খাওয়া) এর ৩য় রূপ (V3) হলো 'had'—তাই 'has just had' হয়েছে।"},
        {id: 529, bookNum: "83", type: "previous", raw: "You would rather ________ (help) the boy.", ans: "help", bn: "তোমার বরং ছেলেটিকে সাহায্য করাই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'would rather' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 530, bookNum: "84", type: "previous", raw: "He ________ (work) for twenty five years before he retired.", ans: "had worked", bn: "অবসর নেওয়ার পূর্বে তিনি পঁচিশ বছর ধরে কাজ করেছিলেন।", ex: "অবসর নেওয়ার পূর্বের পঁচিশ বছর ধরে কাজ করার ঘটনাটি আগে একটানা ঘটেছিল। অতীতে দুটি কাজের মধ্যে আগের সুদীর্ঘ কাজটি সবসময় Past Perfect Tense (had + V3) হয়।"},
        {id: 531, bookNum: "85", type: "previous", raw: "The boat, with two men ________ (be) missing.", ans: "is", bn: "দুটি মানুষসহ নৌকাটি নিখোঁজ রয়েছে।", ex: "গুরুত্বপূর্ণ নিয়ম: বাক্যে 'with', 'along with', 'as well as' দ্বারা দুটি নাউন যুক্ত হলে, সবসময় প্রথম সাবজেক্ট (The boat - Singular) অনুযায়ী ভার্ব বসে। তাই 'is' বা 'was' বসেছে।"},
        {id: 532, bookNum: "86", type: "previous", raw: "I have not yet ________ (to take) tea.", ans: "taken", bn: "আমি এখনও চা খাইনি।", ex: "বাক্যে সাহায্যকারী ভার্ব 'have' দেওয়া আছে। প্রেজেন্ট পারফেক্ট টেন্সের নিয়ম অনুযায়ী 'have/has' এর পর মূল ভার্বের সবসময় ৩য় রূপ বা Past Participle (take -> taken) বসে।"},
        {id: 533, bookNum: "87", type: "previous", raw: "Two year ________ (pass) since he left home.", ans: "have passed", bn: "সে বাড়ি ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "টাইম লিঙ্কিং নিয়ম: 'Since'-এর পরের অংশ Past Indefinite (left) হলে, আগের অংশটি সবসময় Present Perfect Tense (have/has + V3) গঠনে রূপ নেয়।"},
        {id: 534, bookNum: "88", type: "previous", raw: "They ________ (not visit) us regularly.", ans: "তারা নিয়মিত আমাদের এখানে আসে না।", ans: "do not visit", ex: "বাক্যে 'regularly' থাকায় এটি সাধারণ বর্তমান কাল। Present Indefinite Tense-কে না-বোধক করতে Subject Plural (They) হওয়ায় সাহায্যকারী ভার্ব 'do not' এবং এরপর ভার্বের V1 বসে।"},
        {id: 535, bookNum: "89", type: "previous", raw: "Addiction ________ (give) rise to social crimes.", ans: "আসক্তি সামাজিক অপরাধের জন্ম দেয়।", ans: "gives", ex: "এটি একটি চিরন্তন সামাজিক বাস্তব সত্য ঘটনা (Present Indefinite)। Subject 'Addiction' সিঙ্গুলার বা আনকাউন্টেবল নাউন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'gives' হয়েছে।"},
        {id: 536, bookNum: "90", type: "previous", raw: "To see her ________ (be) to love her.", ans: "তাকে দেখাই তাকে ভালোবাসার সমান।", ans: "is", ex: "বাক্যের শুরুতে 'To see her' একটি ইনফিনিটিভ ফ্রেজ, যা ব্যাকরণে সবসময় একটি একক সিঙ্গুলার ধারণা হিসেবে কাজ করে। তাই সিঙ্গুলার ভার্ব 'is' বসেছে।"},
        {id: 537, bookNum: "91", type: "previous", raw: "We had better ________ (discuss) the matter now.", ans: "discuss", bn: "আমাদের বরং বিষয়টি এখন আলোচনা করাই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' এর পর কোনো ইনফিনিটিভ 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1 অর্থাৎ discuss) বসে।"},
        {id: 538, bookNum: "92", type: "previous", raw: "I got the work ________ (do) by him.", ans: "done", bn: "আমি তাকে দিয়ে কাজটি করিয়ে নিলাম।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (the work) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3 অর্থাৎ done) বসে।"},
        {id: 539, bookNum: "93", type: "previous", raw: "The quality of the mangoes ________ (be) good.", ans: "is", bn: "আমগুলোর গুণগত মান ভালো।", ex: "এখানে আমগুলো (mangoes) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The quality' (গুণগত মান), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 540, bookNum: "94", type: "previous", raw: "Many a boy ________ (be) present in the meeting.", ans: "is", bn: "অনেক ছেলেই সভায় উপস্থিত থাকে।", ex: "সহজ কথা: 'Many' এর পর Plural হলেও, 'Many a' ফ্রেজটির পর Noun এবং Verb দুটিই সবসময় Singular (একবচন) হয়। তাই এখানে 'is' বসেছে।"},
        {id: 541, bookNum: "95", type: "previous", raw: "She proceeded as though I ________ (not speak).", ans: "had not spoken", bn: "সে এমনভাবে এগিয়ে চলল যেন আমি কোনো কথাই বলিনি।", ex: "নিয়ম: বাক্যে 'as though' এর আগের অংশ Past Indefinite (proceeded) হলে, পরের অংশটি সবসময় Past Perfect Tense (had + not + V3) দিয়ে মেলাতে হয়।"},
        {id: 542, bookNum: "96", type: "previous", raw: "Had I possessed a vast property, I ________ (establish) a college.", ans: "would have established", bn: "আমার যদি বিশাল সম্পত্তি থাকতো, তবে আমি একটি কলেজ প্রতিষ্ঠা করতাম।", ex: "বাক্যের শুরুতে 'Had + Subject + V3' থাকা মানে এটি Third Conditional (অতীতের অবাস্তব ইচ্ছা)। তাই অপর অংশে নিয়ম মেনে 'Subject + would have + V3' বসাতে হয়।"},
        {id: 543, bookNum: "97", type: "previous", raw: "He said that he ________ (will go) home soon.", ans: "সে বললো যে সে শীঘ্রই বাড়ি যাবে।", ans: "would go", ex: "ন্যারেশনের নিয়ম অনুযায়ী প্রধান ক্লজটি অতীতে (said) থাকার কারণে, পরের ক্লজের 'will' পরিবর্তিত হয়ে তার Past Form 'would' হয়ে গেছে।"},
        {id: 544, bookNum: "98", type: "previous", raw: "It is high time we ________ (leave) the place.", ans: "left", bn: "এটাই উপযুক্ত সময় আমাদের স্থানটি ত্যাগ করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ left) হয়।"},
        {id: 545, bookNum: "99", type: "previous", raw: "Have you ever ________ (be) to Chittagong?", ans: "been", bn: "তুমি কি কখনো চট্টগ্রামে গিয়েছ?", ex: "কোথাও গিয়ে ফিরে আসা বা ভ্রমণ করার অভিজ্ঞতার ক্ষেত্রে 'have/has' এর পর 'ever'-এর সাথে To-be verb এর ৩য় রূপ হিসেবে 'been' বসে (Have you ever been to...)।"},
        {id: 546, bookNum: "100", type: "previous", raw: "The colour of his eyes ________ (are) blue.", ans: "is", bn: "তার চোখের রঙ নীল।", ex: "এখানে চোখগুলো (eyes) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The colour' (রঙ), যা সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
