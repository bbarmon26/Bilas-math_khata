        {id: 101, bookNum: "21.a", type: "normal", raw: "Many a boy ________ (to be) present in class.", ans: "is", bn: "অনেক ছেলেই ক্লাসে উপস্থিত থাকে।", ex: "সহজ কথা: 'Many' এর পর Plural হলেও, 'Many a' ফ্রেজটির পর Noun এবং Verb দুটিই সবসময় Singular (একবচন) হয়। তাই এখানে 'is' বসেছে।"},
        {id: 102, bookNum: "21.b", type: "normal", raw: "I ________ (finish) reading the book before he comes.", ans: "will have finished", bn: "সে আসার পূর্বেই আমি বইটি পড়া শেষ করে ফেলবো।", ex: "ভবিষ্যতের দুটি কাজের মধ্যে 'before'-এর পরের অংশটি যদি সাধারণ বর্তমান (comes) হয়, তবে তার আগের কাজটি সবসময় Future Perfect Tense (will have + V3) নিয়মে পূরণ করতে হয়।"},
        {id: 103, bookNum: "21.c", type: "normal", raw: "________ (Child) like sweets.", ans: "Children", bn: "শিশুরা মিষ্টি পছন্দ করে।", ex: "সাধারণ কোনো সত্য কথা বা অভ্যাস প্রকাশ করার সময় কোনো নির্দিষ্ট একটি শিশু নয়, বরং পুরো শিশু জাতিকে (বহুবচন) বোঝানো হয়। তাই 'Child'-এর Plural Form 'Children' করা হয়েছে।"},
        {id: 104, bookNum: "21.d", type: "normal", raw: "I ________ (live) here since 1980.", ans: "have been living", bn: "আমি ১৯৮০ সাল থেকে এখানে বসবাস করছি।", ex: "কাজটি অতীতে (১৯৮০ সালে) শুরু হয়েছিল এবং এখনও বর্তমানে চলছে। নিয়মানুযায়ী কোনো নির্দিষ্ট সময় থেকে কাজ চলতে থাকলে তা Present Perfect Continuous Tense হয়।"},
        {id: 105, bookNum: "21.e", type: "normal", raw: "The boy fell down while he ________ (run).", ans: "was running", bn: "দৌড়ানোর সময় ছেলেটি পড়ে গিয়েছিল।", ex: "ম্যাজিক নিয়ম: 'While'-এর ঠিক পরপরই যদি কোনো Subject থাকে, তবে সেই অংশটি সবসময় চলমান অতীত বা Past Continuous Tense (was/were + verb+ing) হয়।"},
        {id: 106, bookNum: "22.a", type: "normal", raw: "Ratan ________ (swim) in the pond since morning.", ans: "has been swimming", bn: "রতন সকাল থেকে পুকুরে সাঁতার কাটছে।", ex: "সকাল থেকে (since morning) কাজটি এখনও একটানা চলছে বোঝাচ্ছে। তাই Present Perfect Continuous Tense-এর নিয়ম অনুযায়ী 'has been swimming' হয়েছে।"},
        {id: 107, bookNum: "22.b", type: "normal", raw: "Halim ________ (dream) a bad dream last night.", ans: "dreamt", bn: "হালিম গত রাতে একটি দুঃস্বপ্ন দেখেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last night' (গত রাত) উল্লেখ আছে। তাই ভার্বটির চোখ বন্ধ করে Past Indefinite Form বা V2 (dreamt) হবে।"},
        {id: 108, bookNum: "22.c", type: "normal", raw: "Samira ________ (go) to the book fair every year.", ans: "goes", bn: "সামীরা প্রতি বছর বইমেলায় যায়।", ex: "বাক্যে 'every year' (প্রতি বছর) থাকা মানে এটি একটি নিয়মিত অভ্যাস। আর অভ্যাসগত ঘটনা সবসময় Present Indefinite Tense হয়। Subject থার্ড পারসন সিঙ্গুলার হওয়ায় ভার্বের সাথে es যুক্ত হয়েছে।"},
        {id: 109, bookNum: "22.d", type: "normal", raw: "Tomorrow never ________ (die).", ans: "dies", bn: "আগামীকাল কখনো আসে না।", ex: "এটি একটি বিখ্যাত প্রবাদ বাক্য। যেকোনো প্রবাদ বাক্য বা চিরন্তন সত্য সবসময় সাধারণ বর্তমান বা Present Indefinite Tense-এ লিখতে হয়।"},
        {id: 110, bookNum: "22.e", type: "normal", raw: "The boy left the school after his father ________ (call) him.", ans: "had called", bn: "তার বাবা ডাকার পর ছেলেটি school ত্যাগ করেছিল।", ex: "শর্টকাট টেকনিক: 'After'-এর আগের অংশ যদি Past Indefinite (left) হয়, তবে 'after'-এর পরের অংশটি সবসময় Past Perfect Tense (had + V3) দিয়ে মেলাতে হয়।"},
        {id: 111, bookNum: "23.a", type: "normal", raw: "I ________ (write) him recently.", ans: "have written", bn: "আমি সম্প্রতি তাকে চিঠি লিখেছি।", ex: "বাক্যে 'recently' (সম্প্রতি) বা 'lately' শব্দ দুটি থাকা মানেই কাজটি এইমাত্র শেষ হয়েছে কিন্তু তার ফল এখনও আছে। তাই এটি Present Perfect Tense (have/has + V3) হবে।"},
        {id: 112, bookNum: "23.b", type: "normal", raw: "He always ________ (get) up early.", ans: "gets", bn: "সে সবসময় ভোরে ঘুম থেকে ওঠে।", ex: "বাক্যে 'always' (সবসময়) শব্দটি নিয়মতান্ত্রিক অভ্যাস বোঝায়। তাই Present Indefinite Tense-এর নিয়মে Subject থার্ড পারসন সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'gets' হয়েছে।"},
        {id: 113, bookNum: "23.c", type: "normal", raw: "Fifty miles ________ (be) a long way.", ans: "is", bn: "পঞ্চাশ মাইল একটি দীর্ঘ পথ।", ex: "মাইলস (miles) দেখতে প্লুরাল মনে হলেও, যখন কোনো নির্দিষ্ট দূরত্ব বা ওজনকে একটি একক সমষ্টি হিসেবে ধরা হয়, তখন ভার্বটি সবসময় Singular বা 'is' হয়।"},
        {id: 114, bookNum: "23.d", type: "normal", raw: "He ________ (play) since morning.", ans: "has been playing", bn: "সে সকাল থেকে খেলছে।", ex: "সকাল থেকে (since morning) কাজটি এখনও চলছে। কোনো কাজ আগে শুরু হয়ে এখনও চলমান থাকলে তাকে Present Perfect Continuous Tense বলতে হয়।"},
        {id: 115, bookNum: "23.e", type: "normal", raw: "The news ________ (be) false.", ans: "is", bn: "সংবাদটি মিথ্যা।", ex: "'News' শব্দটির শেষে s থাকলেও এটি মূলত একটি Uncountable Noun এবং সিঙ্গুলার ধারণা। তাই এর পর Singular Verb 'is' বসেছে।"},
        {id: 116, bookNum: "24.a", type: "normal", raw: "I heard her ________ (sing).", ans: "singing", bn: "আমি তাকে গান গাইতে শুনলাম।", ex: "একটি সরল বাক্যে (Simple Sentence) দুটি ভার্ব থাকলে (এখানে heard এবং sing), সাধারণত দ্বিতীয় ভার্বটির সাথে ing যুক্ত করে তার চলমান অবস্থা বোঝাতে হয়।"},
        {id: 117, bookNum: "24.b", type: "normal", raw: "She ________ (come) of a respectable family.", ans: "came", bn: "সে একটি সম্ভ্রান্ত পরিবার থেকে এসেছে/জন্ম নিয়েছে।", ex: "বংশোদ্ভূত হওয়া বা পেছনের ইতিহাস প্রকাশ করতে এই বাক্যাংশটি Past Indefinite Form (V2 অর্থাৎ came) হিসেবে ব্যবহৃত হয়।"},
        {id: 118, bookNum: "24.c", type: "normal", raw: "I have ________ (have) a headache.", ans: "had", bn: "আমার মাথা ব্যথা করছে/হয়েছে।", ex: "Present Perfect Tense-এর গঠন হলো: Subject + have/has + V3। এখানে সাহায্যকারী ভার্ব হলো 'have' আর মূল ভার্ব (have)-এর ৩য় রূপ (V3) হলো 'had'।"},
        {id: 119, bookNum: "24.d", type: "normal", raw: "My younger daughter is looking forward to ________ (meet) her grandmother.", ans: "meeting", bn: "আমার ছোট মেয়ে তার দাদীর সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "খুব গুরুত্বপূর্ণ নিয়ম: সাধারণ To-এর পর V1 বসলেও, 'looking forward to' বা 'with a view to' ফ্রেজগুলোর পর ভার্বের সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 120, bookNum: "24.e", type: "normal", raw: "Foods should be kept ________ (cover).", ans: "covered", bn: "খাবার ঢেকে রাখা উচিত।", ex: "খাবার নিজে নিজেকে ঢেকে রাখতে পারে না, অন্যের দ্বারা রাখা হয় (Passive)। তাছাড়া 'should be' এর পর নিয়মানুযায়ী মূল ভার্বের Past Participle (V3) রূপ বসে।"},
        {id: 121, bookNum: "25.a", type: "normal", raw: "They are quite ________ (mistake).", ans: "mistaken", bn: "তারা সম্পূর্ণ ভুলের মধ্যে আছে।", ex: "এখানে 'are' ভার্বটির পর 'mistaken' শব্দটি সরাসরি একটি অবস্থা বা Adjective হিসেবে ব্যবহৃত হয়েছে, যার অর্থ ভুল করা বা ভ্রান্ত হওয়া।"},
        {id: 122, bookNum: "25.b", type: "normal", raw: "It is time we ________ (start) the project.", ans: "started", bn: "এটাই উপযুক্ত সময় আমাদের প্রজেক্টটি শুরু করার।", ex: "পরীক্ষায় বারবার আসা নিয়ম: বাক্যে 'It is time' বা 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি সবসময় Past Indefinite Form (V2) হয়।"},
        {id: 123, bookNum: "25.c", type: "normal", raw: "If I were there, I ________ (help) him.", ans: "would help", bn: "আমি যদি সেখানে থাকতাম, তবে তাকে সাহায্য করতাম।", ex: "এটি হলো Second Conditional (অবাস্তব অতীত)। 'If' যুক্ত অংশে 'were' (Past) থাকার কারণে অপর অংশে সবসময় Subject + would + V1 (base form) বসে।"},
        {id: 124, bookNum: "25.d", type: "normal", raw: "I cannot help ________ (go) there.", ans: "going", bn: "আমি সেখানে না গিয়ে পারি না।", ex: "সহজ নিয়ম: বাক্যে 'cannot help' অথবা 'could not help' থাকলে এর ঠিক পরের মূল ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 125, bookNum: "25.e", type: "normal", raw: "I was used to ________ (take) exercise everyday.", ans: "taking", bn: "আমি প্রতিদিন ব্যায়াম করায় অভ্যস্ত ছিলাম।", ex: "পার্থক্যটি বুঝুন: শুধু 'used to' এর পর V1 বসে, কিন্তু 'used to' এর আগে যদি কোনো Be-verb (am/is/are/was/were) থাকে, তবে তার অর্থ হয় অভ্যস্ততা এবং তখন ভার্ব + ing বসে।"},
        {id: 126, bookNum: "26.a", type: "normal", raw: "She told me his name after he ________ (leave).", ans: "had left", bn: "সে চলে যাওয়ার পর সে আমাকে তার নাম বলেছিল।", ex: "অতীতের দুটি কাজের মধ্যে 'after' (পরে) শব্দটির পরের কাজটি সবসময় আগে ঘটে। আর যে কাজটি আগে ঘটে তা Past Perfect Tense (had + V3) হয়।"},
        {id: 127, bookNum: "26.b", type: "normal", raw: "I saw him ________ (go).", ans: "going", bn: "আমি তাকে যেতে দেখলাম।", ex: "একটি সরল বাক্যে (Simple Sentence) প্রথম ভার্বের পর দ্বিতীয় ভার্বটি দিয়ে যদি কোনো চলমান অবস্থা বোঝায়, তবে তার সাথে ing যুক্ত করতে হয়।"},
        {id: 128, bookNum: "26.c", type: "normal", raw: "Would that I ________ (go) to college.", ans: "could go", bn: "আমি যদি কলেজে যেতে পারতাম!", ex: "বাক্যের শুরুতে 'Would that' থাকা মানেই এটি একটি তীব্র অথচ অসম্ভব ইচ্ছা প্রকাশ করছে। এই ধরনের বাক্যে সাবজেক্টের পর সবসময় 'could + V1' বসাতে হয়।"},
        {id: 129, bookNum: "26.d", type: "normal", raw: "If I had seen him, I ________ (tell) him the matter.", ans: "would have told", bn: "আমি যদি তাকে দেখতাম, তবে তাকে বিষয়টি বলতাম।", ex: "এটি হলো Third Conditional। ইফ যুক্ত অংশটি যদি Past Perfect Tense (had + seen) এ থাকে, তবে অপর অংশে বাধ্যতামূলকভাবে Subject + would have + V3 বসাতে হয়।"},
        {id: 130, bookNum: "26.e", type: "normal", raw: "I ________ (read) for the three hours.", ans: "have been reading", bn: "আমি তিন ঘন্টা ধরে পড়ছি।", ex: "তিন ঘন্টা ধরে (for three hours) কাজটি অতীতে শুরু হয়ে এখনও চলছে। সময়ের এই ব্যাপ্তির কারণে বাক্যটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 131, bookNum: "27.a", type: "normal", raw: "You had better ________ (to take) rest.", ans: "take", bn: "তোমার বরং বিশ্রাম নেওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 132, bookNum: "27.b", type: "normal", raw: "Would that I ________ (see) a tiger.", ans: "could see", bn: "আমি যদি একটি বাঘ দেখতে পারতাম!", ex: "বাক্যের শুরুতে অসম্ভব ইচ্ছা প্রকাশক 'Would that' থাকার কারণে নিয়ম অনুযায়ী সাবজেক্টের পর 'could' এবং ভার্বের ১ম রূপ (see) বসেছে।"},
        {id: 133, bookNum: "27.c", type: "normal", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "মনে রাখবেন: 'One of'-এর পর Noun প্লুরাল হলেও আসল সাবজেক্ট কিন্তু ওই একজন (One)। 'yesterday' (গতকাল) থাকায় অতীতকালের সিঙ্গুলার ভার্ব হিসেবে 'was' বসেছে।"},
        {id: 134, bookNum: "27.d", type: "normal", raw: "If I had much money, I ________ (buy) a car.", ans: "would buy", bn: "আমার যদি অনেক টাকা থাকতো, তবে আমি একটি গাড়ি কিনতাম।", ex: "এখানে 'had' ভার্বটি একাকী আছে, অর্থাৎ এটি Past Indefinite Tense (Second Conditional)। তাই নিয়ম মেনে পরের অংশে Subject + would + V1 (buy) বসেছে।"},
        {id: 135, rtype: "normal", raw: "While he ________ (walk) in the campus, he met me.", ans: "was walking", bn: "ক্যাম্পাসে হাঁটার সময় তার সাথে আমার দেখা হয়েছিল।", ex: "নিয়ম হলো: 'While'-এর ঠিক পরেই যদি সরাসরি কোনো Subject (he) চলে আসে, তবে সেই অংশটি সবসময় Past Continuous Tense (was/were + verb+ing) হয়।"},
        {id: 136, bookNum: "28.a", type: "normal", raw: "He gave up ________ (play) football when he got married.", ans: "playing", bn: "বিয়ের পর সে ফুটবল খেলা ছেড়ে দিয়েছিল।", ex: "'Give up' (ছেড়ে দেওয়া) একটি Prepositional Phrase বা Group Verb। ইংরেজিতে প্রিপজিশনের পর কোনো অ্যাকশন ভার্ব আসলে তার সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 137, bookNum: "28.b", type: "normal", raw: "I got my car ________ (repair).", ans: "repaired", bn: "আমি আমার গাড়িটি মেরামত করিয়ে নিলাম।", ex: "এটি একটি পজিটিভ বা Causative বাক্য। 'get/got'-এর পর যখন কোনো বস্তুবাচক জিনিস (my car) থাকে, তখন তার পরের ভার্বটির সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 138, bookNum: "28.c", type: "normal", raw: "Our teachers make us ________ (work) very hard.", ans: "work", bn: "আমাদের শিক্ষকরা আমাদের দিয়ে কঠোর পরিশ্রম করান।", ex: "Causative Verb 'make' এর নিয়ম: মেক (make/made) এর পর যদি কোনো ব্যক্তি (us) থাকে, তবে পরবর্তী ভার্বের সাথে কোনো s/es বা to যুক্ত হয় না, সরাসরি Base Form (V1) বসে।"},
        {id: 139, bookNum: "28.d", type: "normal", raw: "Would you mind ________ (close) the door?", ans: "closing", bn: "আপনি কি দয়া করে দরজাটি বন্ধ করবেন?", ex: "কাউকে ভদ্রভাবে বা বিনম্র অনুরোধ করতে যখন 'Would you mind' ব্যবহার করা হয়, তখন তার ঠিক পরের ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 140, bookNum: "28.e", type: "normal", raw: "She is looking forward to ________ (go) Europe.", ans: "going", bn: "সে ইউরোপ যাওয়ার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "খুব কমন নিয়ম: 'looking forward to' ফ্রেজটির ভেতরের 'to' কিন্তু ইনফিনিটিভ নয়, এটি প্রিপজিশনাল। তাই এর পর ভার্বের সাথে সর্বদা ing যুক্ত হয়।"},
        {id: 141, bookNum: "29.a", type: "normal", raw: "I saw the farmer ________ (plough) his land.", ans: "ploughing", bn: "আমি কৃষকটিকে তার জমি চাষ করতে দেখলাম।", ex: "সরল বাক্যে (Simple Sentence) প্রথম প্রধান ভার্বের পর দ্বিতীয় ভার্বটি দিয়ে যখন চোখের সামনে কোনো কাজ চলতে দেখা বোঝায়, তখন তার সাথে ing যুক্ত করতে হয়।"},
        {id: 142, bookNum: "29.b", type: "normal", raw: "If he read, he ________ (pass).", ans: "would pass", bn: "যদি সে পড়তো, তবে সে পাস করতো।", ex: "এখানে 'read' ভার্বটি Past Indefinite Form (V2) হিসেবে আছে (কারণ সিঙ্গুলার হওয়া সত্ত্বেও s নেই)। তাই Second Conditional নিয়মে পরে would + V1 (pass) বসেছে।"},
        {id: 143, bookNum: "29.c", type: "normal", raw: "Listen, the clock ________ (strike).", ans: "is striking", bn: "শোনো, ঘড়িতে ঘণ্টা বাজছে।", ex: "যখন কাউকে হুট করে কোনো কিছু 'শোনো' (Listen) বা 'দেখো' (Look) বলা হয়, তার মানে কাজটি চোখের সামনে এই মুহূর্তে ঘটছে। তাই এটি Present Continuous Tense হয়েছে।"},
        {id: 144, bookNum: "29.d", type: "normal", raw: "It is high time he ________ (leave) the place.", ans: "left", bn: "এটাই উপযুক্ত সময় তার স্থানটি ত্যাগ করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is time' বা 'It is high time' এর পর সাবজেক্ট থাকলে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2) হয়।"},
        {id: 145, bookNum: "29.e", type: "normal", raw: "Speak the truth or you ________ (punish).", ans: "will be punished", bn: "সত্য কথা বলো অন্যথায় তোমাকে শাস্তি দেওয়া হবে।", ex: "ভবিষ্যতের একটি ফলাফল বোঝাচ্ছে এবং শাস্তিটি সে নিজে নিজেকে দেবে না, অন্য কেউ দেবে (Passive Voice)। তাই এটি Future Indefinite Tense-এর Passive রূপ (will be + V3) নিয়েছে।"},
        {id: 146, bookNum: "29.f", type: "normal", raw: "The student ________ (rebuke) for his misbehavior yesterday.", ans: "was rebuked", bn: "ছাত্রটিকে গতকাল তার অসদাচরণের জন্য তিরস্কার করা হয়েছিল।", ex: "বাক্যে 'yesterday' থাকায় এটি অতীতকাল এবং তিরস্কারের কাজটি শিক্ষক বা অন্য কেউ করেছে (Passive)। তাই Past Indefinite-এর Passive Form (was + V3) বসেছে।"},
        {id: 147, bookNum: "29.g", type: "normal", raw: "It ________ (rain) heavily in the rainy season.", ans: "rains", bn: "বর্ষাকালে প্রচুর বৃষ্টিপাত হয়।", ex: "ঋতুভিত্তিক স্বাভাবিক বা প্রাকৃতিক সত্য ঘটনা। আর চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'It' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়েছে।"},
        {id: 148, bookNum: "29.h", type: "normal", raw: "Making a good result in the exam ________ (need) a lot of hard work.", ans: "needs", bn: "পরীক্ষায় ভালো ফলাফল করার জন্য প্রচুর কঠোর পরিশ্রমের প্রয়োজন।", ex: "এখানে আসল Subject কোনো ব্যক্তি নয়, বরং 'Making a good result' (জেরান্ড ফ্রেজ)। এই ধরনের সাবজেক্ট সবসময় Singular বা একবচন হিসেবে গণ্য হয়, তাই ভার্বের সাথে s যুক্ত হয়ে 'needs' হয়েছে।"},
        {id: 149, bookNum: "30.a", type: "normal", raw: "Every flower and every fruit ________ (be) the gift of God.", ans: "is", bn: "প্রতিটি ফুল এবং প্রতিটি ফলই ঈশ্বরের উপহার।", ex: "সহজ নিয়ম: 'and' দ্বারা যুক্ত হলেও যদি প্রতিটির আগে 'Every' বা 'Each' শব্দ দুটি থাকে, তবে পুরো সাবজেক্টটি সবসময় একবচন বা Singular হয়, তাই 'is' বসেছে।"},
        {id: 150, bookNum: "30.b", type: "normal", raw: "The greater part of the village ________ (flood).", ans: "is flooded", bn: "গ্রামের সিংহভাগ এলাকা প্লাবিত হয়েছে।", ex: "গ্রামের অংশটি নিজে নিজে প্লাবিত হতে পারে না, বন্যার পানি দ্বারা হয়েছে (Passive)। এটি একটি একক অংশ বা Singular ধারণা হওয়ায় 'is flooded' হয়েছে।"},
        {id: 151, bookNum: "30.c", type: "normal", raw: "I cannot help ________ (shed) tears.", ans: "shedding", bn: "আমি চোখের জল না ফেলে পারি না।", ex: "মনে রাখার মতো নিয়ম: বাক্যে 'cannot help' বা 'could not help' ফ্রেজ থাকলে এর ঠিক পরের অ্যাকশন ভার্বটির সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 152, bookNum: "30.d", type: "normal", raw: "The teacher ________ (arrive) before the students ________ (come).", ans: "had arrived, came", bn: "ছাত্ররা আসার পূর্বেই শিক্ষক এসে পৌঁছেছিলেন।", ex: "অতীতের দুটি কাজের মধ্যে 'before' (পূর্বে) এর আগের কাজটি আগে ঘটেছিল (Past Perfect - had arrived) এবং পরের কাজটি পরে ঘটেছিল (Past Indefinite - came)।"},
        {id: 153, bookNum: "30.e", type: "normal", raw: "I ________ (wait) for the results for 7 days.", ans: "have been waiting", bn: "আমি ৭ দিন ধরে ফলাফলের জন্য অপেক্ষা করছি।", ex: "৭ দিন ধরে (for 7 days) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে চলছে। সময়ের এই ব্যাপ্তির কারণে বাক্যটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 154, bookNum: "31.a", type: "normal", raw: "He ________ home last night. (leave)", ans: "left", bn: "সে গত রাতে বাড়ি থেকে চলে গেছে।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last night' (গত রাত) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (left) বসেছে।"},
        {id: 155, bookNum: "31.b", type: "normal", raw: "I fancy I ________ pale. (turn)", ans: "turned", bn: "আমার মনে হলো আমি যেন ফ্যাকাশে হয়ে গেলাম।", ex: "নিয়ম: বাক্যে কাল্পনিক বা অসম্ভব ইচ্ছা প্রকাশক 'fancy' বা 'wish' থাকলে তার পরের ক্লজের ভার্বটি সবসময় Past Indefinite Form (V2) হয়।"},
        {id: 156, bookNum: "31.c", type: "normal", raw: "I would help him, if he ________ (want).", ans: "wanted", bn: "সে যদি চাইতো, তবে আমি তাকে সাহায্য করতাম।", ex: "Second Conditional বাক্য। প্রধান ক্লজে যেহেতু 'would + V1' (would help) দেওয়া আছে, তাই ইফ ক্লজটি বাধ্যতামূলকভাবে Past Indefinite Tense (V2 অর্থাৎ wanted) হবে।"},
        {id: 157, bookNum: "31.d", type: "normal", raw: "I always remember your ________ by me. (stand)", ans: "standing", bn: "আমার পাশে তোমার দাঁড়ানোর কথা আমি সবসময় মনে রাখি।", ex: "এখানে 'your' হলো একটি Possessive Pronoun। ইংরেজি ব্যাকরণের নিয়ম অনুযায়ী পসেসিভ প্রোনাউনের পর কোনো ভার্ব আসলে তার Gerund Form (verb+ing) বসাতে হয়।"},
        {id: 158, bookNum: "31.e", type: "normal", raw: "I ________ the work before he came back. (finish)", ans: "had finished", bn: "সে ফিরে আসার পূর্বেই আমি কাজটি শেষ করেছিলাম।", ex: "'Before' (পূর্বে) যুক্ত অতীত বাক্যের প্রথমাংশের কাজটি সবসময় আগে শেষ হয়, তাই এটি Past Perfect Tense (had + V3 অর্থাৎ had finished) হয়েছে।"},
        {id: 159, bookNum: "32.a", type: "normal", raw: "A lot of money ________ spent.", ans: "is", bn: "প্রчুর টাকা ব্যয় করা হয়/হয়েছে।", ex: "'Money' হলো একটি Uncountable Noun (যা গণনা করা যায় না)। আর আনকাউন্টেবল নাউনের পরিমাণ সবসময় Singular বা একবচন হিসেবে গণ্য হয়, তাই 'is' বসেছে।"},
        {id: 160, bookNum: "32.b", type: "normal", raw: "A huge quantity of sugar ________ exported.", ans: "was", bn: "বিপুল পরিমাণ চিনি রপ্তানি করা হয়েছিল।", ex: "'Sugar' আনকাউন্টেবল নাউন হওয়ায় এর পরিমাণটি সিঙ্গুলার। যেহেতু চিনি নিজে নিজেকে রপ্তানি করতে পারে না (Passive Voice), তাই অতীতকালের প্যাসিভ হিসেবে 'was' বসেছে।"},
        {id: 161, bookNum: "32.c", type: "normal", raw: "One and a half hour ________ a long time.", ans: "is", bn: "দেড় ঘণ্টা একটি দীর্ঘ সময়।", ex: "সময়, দূরত্ব বা টাকার পরিমাণ দেখতে প্লুরাল মনে হলেও, তা যখন একটি নির্দিষ্ট একক সময়কাল বা ব্লককে নির্দেশ করে, তখন ভার্বটি সবসময় Singular বা 'is' হয়।"},
        {id: 162, bookNum: "32.d", type: "normal", raw: "Three fourths of the books ________ been sold.", ans: "have", bn: "বইগুলোর তিন-চতুর্থাংশ বিক্রি হয়ে গেছে।", ex: "ভগ্নাংশের ক্ষেত্রে নিয়মটি বুঝুন: 'of'-এর পরের নাউনটি যদি গণনাযোগ্য বহুবচন (the books - Plural) হয়, তবে সাবজেক্টটি Plural হয়ে যায়, তাই এখানে 'have' বসেছে।"},
        {id: 163, bookNum: "33.a", type: "normal", raw: "The audience started ________ (clap).", ans: "clapping", bn: "দর্শকরা তালি দেওয়া শুরু করলো।", ex: "একটি সরল বাক্যে (Simple Sentence) 'started' ভার্বের পর আরেকটি কাজের তাৎক্ষণিক শুরু বা চলমান অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করতে হয়।"},
        {id: 164, bookNum: "33.b", type: "normal", raw: "The book ________ (write) by him few years ago.", ans: "was written", bn: "বইটি কয়েক বছর আগে তাঁর দ্বারা লেখা হয়েছিল।", ex: "বাক্যে 'few years ago' (কয়েক বছর আগে) থাকায় এটি অতীতকাল এবং 'by him' থাকায় এটি Passive Voice। তাই Past Indefinite-এর Passive Form (was + V3) বসেছে।"},
        {id: 165, bookNum: "33.c", type: "normal", raw: "I wish I ________ (be) a king!", ans: "were", bn: "আমি যদি একজন রাজা hতাম!", ex: "'I wish' এর পর কাল্পনিক বা অবাস্তব ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 166, bookNum: "33.d", type: "normal", raw: "Rahim and Reshma ________ (be) siblings.", ans: "are", bn: "রহিম এবং রেশমা ভাইবোন।", ex: "দুটি আলাদা সিঙ্গুলার নাম 'and' দ্বারা যুক্ত হয়ে একটি বহুবচন বা Plural Subject গঠন করায় এখানে সাহায্যকারী ভার্ব হিসেবে 'are' বসেছে।"},
        {id: 167, bookNum: "33.e", type: "normal", raw: "He took these measures with a view to ________ (help) people.", ans: "helping", bn: "সে মানুষের সাহায্য করার উদ্দেশ্যে এই পদক্ষেপগুলো নিয়েছিল।", ex: "খুব গুরুত্বপূর্ণ নিয়ম: বাক্যে 'with a view to' (উদ্দেশ্যে) শব্দগুচ্ছ থাকলে এর পরবর্তী প্রধান ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 168, bookNum: "34.a", type: "normal", raw: "Each of the girls ________ (be) present in the class yesterday.", ans: "was", bn: "মেয়েদের প্রত্যেকেই gestern ক্লাসে উপস্থিত ছিল।", ex: "'Each of' এর পর Noun প্লুরাল হলেও আসল সাবজেক্ট কিন্তু সিঙ্গুলার। তাছাড়া 'yesterday' থাকায় অতীতকালের সিঙ্গুলার ভার্ব 'was' বসেছে।"},
        {id: 169, bookNum: "34.b", type: "normal", raw: "You, he and I ________ (be) friend.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "তিনটি ভিন্ন ভিন্ন পারসন 'and' দ্বারা যুক্ত হয়ে বহুবচন সাবজেক্ট গঠন করায় এখানে সাহায্যকারী ভার্ব হিসেবে 'are' বসেছে।"},
        {id: 170, bookNum: "34.c", type: "normal", raw: "One fourth of the work ________ (to finish).", ans: "has been finished", bn: "কাজের এক-চতুর্থাংশ শেষ হয়েছে।", ex: "ভগ্নাংশে আনকাউন্টেবল নাউনের ক্ষেত্রে সিঙ্গুলার ভার্ব বসে। কাজটি এইমাত্র অন্যের দ্বারা শেষ করা হয়েছে বোঝাতে এটি Present Perfect-এর Passive Voice (has been + V3) হয়েছে।"},
        {id: 171, bookNum: "35.a", type: "normal", raw: "Did you ________ (go) to school yesterday?", ans: "go", bn: "তুমি কি গতকাল স্কুলে গিয়েছিলে?", ex: "সহজ শর্টকাট: প্রশ্নবোধক বাক্যে সাহায্যকারী ভার্ব হিসেবে একবার 'did' (Past) ব্যবহৃত হয়ে গেলে, মূল ভার্বটির সবসময় একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 172, bookNum: "35.b", type: "normal", raw: "John asked me what I ________ (be) doing.", ans: "was", bn: "জন আমাকে জিজ্ঞেস করলো আমি কী করছিলাম।", ex: "ইনডাইরেক্ট ন্যারেশনের নিয়ম অনুযায়ী রিপোর্টিং ভার্বটি অতীতে (asked) থাকায় এবং 'I' সিঙ্গুলার হওয়ায় Past Continuous-এর সাহায্যকারী ভার্ব 'was' বসেছে।"},
        {id: 173, bookNum: "35.c", type: "normal", raw: "I ________ (see) a good film yesterday.", ans: "saw", bn: "আমি গতকাল একটি ভালো সিনেমা দেখেছি।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (saw) বসেছে।"},
        {id: 174, bookNum: "35.d", type: "normal", raw: "I'll see you when I ________ (come) back.", ans: "come", bn: "আমি ফিরে আসলে তোমার সাথে দেখা করবো।", ex: "নিয়ম: Future Time ক্লজে 'when' বা 'before'-এর যুক্ত অংশটি সবসময় সাধারণ বর্তমান বা Present Indefinite Tense (I come) দিয়ে লিখতে হয়।"},
        {id: 175, bookNum: "35.e", type: "normal", raw: "Last year I ________ (used to walk) to school every day.", ans: "used to walk", bn: "গত বছর আমি প্রতিদিন হেঁটে স্কুলে যেতাম।", ex: "অতীতের কোনো নিয়মিত অভ্যাস বা পুরোনো কাজ বোঝাতে সাবজেক্টের পর সরাসরি 'used to + V1' (used to walk) স্ট্রাকচার ব্যবহার করা হয়।"},
        {id: 176, bookNum: "36.a", type: "normal", raw: "We are looking forward to ________ (hear) from you.", ans: "hearing", bn: "আমরা আপনার কাছ থেকে শোনার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "নিয়ম মেনে 'looking forward to' ফ্রেজটির পর পরবর্তী প্রধান অ্যাকশন ভার্বটির সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 177, bookNum: "36.b", type: "normal", raw: "Bengali ________ (speak) in Calcutta also.", ans: "is spoken", bn: "কলকাতাতেও বাংলা ভাষা বলা হয়।", ex: "বাংলা ভাষা নিজে নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয় (Passive)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে 'is + V3' (is spoken) বসেছে।"},
        {id: 178, bookNum: "36.c", type: "normal", raw: "He said that he ________ (will go) home soon.", ans: "would go", bn: "সে বললো যে সে শীঘ্রই বাড়ি যাবে।", ex: "ন্যারেশনের নিয়ম অনুযায়ী প্রধান ক্লজটি অতীতে (said) থাকার কারণে, পরের ক্লজের 'will' পরিবর্তিত হয়ে তার Past Form 'would' হয়ে গেছে।"},
        {id: 179, bookNum: "36.d", type: "normal", raw: "Two years ________ (pass) since he left home.", ans: "have passed", bn: "সে বাড়ি ছাড়ার পর থেকে দুটি বছর কেটে গেছে।", ex: "গুরুত্বপূর্ণ নিয়ম: 'Since'-এর পরের অংশ যদি Past Indefinite (left) হয়, তবে 'since'-এর আগের অংশটি সবসময় Present Perfect Tense (have/has + V3) হয়।"},
        {id: 180, bookNum: "36.e", type: "normal", raw: "What you ________ (do) last night?", ans: "did you do", bn: "গত রাতে তুমি কী করেছিলে?", ex: "বাক্যে 'last night' থাকায় ইন্টারোগেটিভ বা প্রশ্নবোধক গঠনে Past Indefinite স্ট্রাকচার (Wh-word + did + subject + V1) বসেছে।"},
        {id: 181, bookNum: "37.a", type: "normal", raw: "The doctor suggested that the patient ________ (lose) weight.", ans: "lose", bn: "ডাক্তার পরামর্শ দিলেন যেন রোগী ওজন কমায়।", ex: "এটি একটি Subjunctive Mood-এর বাক্য। 'suggested that'-এর পর সাবজেক্ট থার্ড পারসন সিঙ্গুলার (the patient) হলেও ভার্বের সাথে কোনো s/es বসে না, সরাসরি Base Form (lose) বসে।"},
        {id: 182, bookNum: "37.b", type: "normal", raw: "I gave up ________ (play) cricket when I got a job.", ans: "playing", bn: "চাকরি পাওয়ার পর আমি ক্রিকেট খেলা ছেড়ে দিয়েছিলাম।", ex: "প্রিপজিশনাল গ্রুপ ভার্ব 'gave up' (ছেড়ে দেওয়া) এর পর কোনো অ্যাকশন ভার্ব আসলে তার সাথে সর্বদা ing যুক্ত হয়ে Gerund গঠিত হয়।"},
        {id: 183, bookNum: "37.c", type: "normal", raw: "A fire ________ (break) out in the slum last night.", ans: "broke", bn: "গত রাতে বস্তিতে আগুন লেগেছিল।", ex: "অতীত নির্দেশক শব্দ 'last night' থাকার কারণে বাক্যটি Past Indefinite Tense (V2) হয়েছে। break out -> broke out।"},
        {id: 184, bookNum: "37.d", type: "normal", raw: "Don't mention anything unless you ________ (ask) for.", ans: "are asked", bn: "তোমাকে জিজ্ঞাসা না করা পর্যন্ত কোনো কিছু উল্লেখ করো না।", ex: "বাক্যটি প্যাসিভ ভাব প্রকাশ করছে (অন্য কেউ তোমাকে জিজ্ঞাসা করলে)। সাধারণ বর্তমানে এটি 'are asked' (are + V3) রূপ নিয়েছে।"},
        {id: 185, bookNum: "37.e", type: "normal", raw: "I waited for my friend until he ________ (come).", ans: "came", bn: "আমার বন্ধু না আসা পর্যন্ত আমি তার জন্য অপেক্ষা করেছিলাম।", ex: "প্রধান ক্লজটি Past Indefinite Tense ('waited') এ থাকায় 'until' এর পরের অংশটিও সামঞ্জস্য রেখে Past Indefinite (came) হয়েছে।"},
        {id: 186, bookNum: "38.a", type: "normal", raw: "Look before you ________ (leap).", ans: "leap", bn: "ভাবিয়া করিও কাজ, করিয়া ভাবিও না।", ex: "এটি একটি অতি পরিচিত প্রবাদ বাক্য। প্রবাদ বাক্য সবসময়ই সাধারণ বর্তমান বা Present Indefinite Tense-এর Base Form-এ গঠিত হয়।"},
        {id: 187, bookNum: "38.b", type: "normal", raw: "Let me ________ (go) there.", ans: "go", bn: "আমাকে সেখানে যেতে দাও।", ex: "নিয়ম: বাক্যে 'Let'-এর পর অবজেক্টিভ প্রোনাউন (me) থাকলে পরবর্তী প্রধান ভার্বটির সাথে কোনো 'to' বসে না, সরাসরি Base Form (V1) বসে।"},
        {id: 188, bookNum: "38.c", type: "normal", raw: "He ________ (come) yesterday.", ans: "came", bn: "সে গতকাল এসেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' থাকার কারণে বাক্যটি Past Indefinite Tense (V2) হয়েছে। come -> came।"},
        {id: 189, bookNum: "38.d", type: "normal", raw: "I wish I ________ (be) in the occasion.", ans: "were", bn: "আমি যদি ওই অনুষ্ঠানে উপস্থিত থাকতে পারতাম!", ex: "'I wish' এর পর অবাস্তব বা অপূর্ণ আকাঙ্ক্ষা প্রকাশ করতে To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 190, bookNum: "38.e", type: "normal", raw: "It has been ________ (rain) since morning.", ans: "raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "সকাল থেকে (since morning) কোনো কাজ শুরু হয়ে এখনও চলছে বোঝালে তা Present Perfect Continuous Tense (has been + verb+ing) হয়।"},
        {id: 191, bookNum: "39.a", type: "normal", raw: "No sooner had he ________ (see) the police than he ________ (run).", ans: "seen, ran", bn: "পুলিশকে দেখা মাত্রই সে দৌড়ে পালিয়ে গেল।", ex: "'No sooner had... than' এর স্ট্রাকচার অনুযায়ী প্রথমাংশে 'had'-এর পর V3 (seen) এবং 'than'-এর পরের অংশে Past Indefinite (ran) বসে।"},
        {id: 192, bookNum: "39.b", type: "normal", raw: "Would that I ________ (go) to college.", ans: "could go", bn: "আমি যদি কলেজে যেতে পারতাম!", ex: "বাক্যের শুরুতে 'Would that' থাকলে অসম্ভব ইচ্ছা প্রকাশ করতে Subject-এর পর 'could + V1' বসে।"},
        {id: 193, bookNum: "39.c", type: "normal", raw: "I wish, I ________ (be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "'I wish' এর পর কাল্পনিক বা অবাস্তব ইচ্ছা প্রকাশ করতে To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 194, bookNum: "39.d", type: "normal", raw: "Many years passed, since I ________ (meet) her last.", ans: "had met", bn: "তার সাথে আমার শেষ দেখা হওয়ার পর অনেক বছর কেটে গেছে।", ex: "নিয়ম: 'Since'-এর আগের অংশ Past Indefinite (passed) থাকলে পরের অংশটি Past Perfect Tense (had + V3) হয়।"},
        {id: 195, bookNum: "39.e", type: "normal", raw: "Would you mind ________ (have) a cup of tea?", ans: "having", bn: "আপনি কি এক কাপ চা খাবেন?", ex: "নিয়ম: বিনম্র অনুরোধের ফ্রেজ 'Would you mind' এর পর পরবর্তী মূল ভার্বের সাথে সর্বদা ing যুক্ত করতে হয়।"},
        {id: 196, bookNum: "40.a", type: "normal", raw: "I wish I ________ (be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "'I wish' এর পর অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশে To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 197, bookNum: "40.b", type: "normal", raw: "Many years passed since I ________ (meet) him last.", ans: "had met", bn: "তার সাথে আমার শেষ দেখা হওয়ার পর অনেক বছর কেটে গেছে।", ex: "'Since'-এর প্রথম ক্লজটি Past Indefinite হওয়ায় পরের ক্লজটি Past Perfect Tense (had + V3) হয়েছে।"},
                // =======================================================
        // Right Form of Verbs - 201 to 350 (Premium Detailed Explanations)
        // =======================================================
        {id: 201, bookNum: "41.a", type: "normal", raw: "Rahim ________ (come) home yesterday.", ans: "came", bn: "রহিম গতকাল বাড়ি এসেছিল।", ex: "সহজ কারণ: বাক্যে অতীত নির্দেশক শব্দ 'yesterday' (গতকাল) আছে। তাই ভার্বটির Past Indefinite Form বা V2 (came) বসেছে।"},
        {id: 202, bookNum: "41.b", type: "normal", raw: "He ________ (go) to school.", ans: "goes", bn: "সে স্কুলে যায়।", ex: "এটি একটি সাধারণ বা নিত্যদিনের কাজ। সাধারণ বর্তমান বা Present Indefinite Tense-এ Subject যদি Third Person Singular (He) হয়, তবে ভার্বের শেষে s/es যুক্ত করতে হয়।"},
        {id: 203, bookNum: "41.c", type: "normal", raw: "It ________ (rain) for two hours.", ans: "has been raining", bn: "দুই ঘণ্টা ধরে বৃষ্টি হচ্ছে।", ex: "কাজটি অতীতে শুরু হয়ে এখনও একটানা চলছে (for two hours)। সময়ের এই ব্যাপ্তির কারণে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 204, bookNum: "41.d", type: "normal", raw: "My younger daughter is looking forward to ________ (meet) her grandmother.", ans: "meeting", bn: "আমার ছোট মেয়ে তার দাদীর সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "ম্যাজিক নিয়ম: সাধারণ To-এর পর ভার্বের ১ম রূপ বসলেও, 'looking forward to' ফ্রেজটির পর ভার্বের সাথে সবসময় ing যুক্ত হয়।"},
        {id: 205, bookNum: "41.e", type: "normal", raw: "I have ________ (have) a headache.", ans: "had", bn: "আমার মাথা ব্যথা করছে/হয়েছে।", ex: "Present Perfect Tense-এর গঠন হলো: Subject + have/has + V3। এখানে প্রথম 'have' হলো সাহায্যকারী ভার্ব, আর ব্র্যাকেটের মূল ভার্ব (have)-এর ৩য় রূপ (V3) হলো 'had'।"},
        {id: 206, bookNum: "42.a", type: "normal", raw: "She ________ (meet) her last year.", ans: "met", bn: "গত বছর সে তার সাথে দেখা করেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last year' (গত বছর) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (met) হবে।"},
        {id: 207, bookNum: "42.b", type: "normal", raw: "If he had come, I ________ to market.", ans: "would have gone", bn: "সে যদি আসতো, তবে আমি বাজারে যেতাম।", ex: "এটি হলো Third Conditional। 'If' যুক্ত অংশটি যদি Past Perfect Tense (had + V3) এ থাকে, তবে অপর অংশে সবসময় Subject + would have + V3 বসাতে হয়।"},
        {id: 208, bookNum: "42.c", type: "normal", raw: "While ________ (walk) on the road, a kite flew away.", ans: "walking", bn: "রাস্তায় হাঁটার সময়, একটি চিল উড়ে গেল।", ex: "শর্টকাট নিয়ম: 'While'-এর ঠিক পরেই যদি কোনো Subject না থাকে (সরাসরি শূন্যস্থান থাকে), তবে ওই ভার্বের সাথে সরাসরি ing যুক্ত করে দিতে হয়।"},
        {id: 209, bookNum: "42.e", type: "normal", raw: "We will wait here until you ________ (return).", ans: "return", bn: "তুমি ফিরে না আসা পর্যন্ত আমরা এখানে অপেক্ষা করবো।", ex: "নিয়ম: 'until' বা 'as soon as' যুক্ত টাইম ক্লজের একপাশে Future Indefinite Tense (will wait) থাকলে, অন্য অংশটি সবসময় Present Indefinite Tense (V1) হয়।"},
        {id: 210, bookNum: "43.a", type: "normal", raw: "He ________ (go) to bed before I came.", ans: "had gone", bn: "আমি আসার পূর্বেই সে ঘুমাতে গিয়েছিল।", ex: "অতীতের দুটি কাজের মধ্যে 'before' (পূর্বে) এর আগের কাজটি আগে ঘটেছিল। আর যে কাজটি আগে ঘটে, সেটি সবসময় Past Perfect Tense (had + V3) হয়।"},
        {id: 211, bookNum: "43.b", type: "normal", raw: "I got the letter ________ (type).", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিলাম।", ex: "Causative Verb-এর নিয়ম: 'get/got'-এর পর যখন কোনো বস্তুবাচক জিনিস (the letter) থাকে, তখন তার ঠিক পরের ভার্বটির ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 212, bookNum: "43.c", type: "normal", raw: "She spoke as if I ________ (not hear).", ans: "had not heard", bn: "সে এমনভাবে কথা বলল যেন আমি শুনতেই পাইনি।", ex: "নিয়ম: বাক্যে 'as if' বা 'as though' এর আগের অংশ Past Indefinite (spoke) হলে, পরের অংশটি সবসময় Past Perfect Tense (had + not + V3) দিয়ে মেলাতে হয়।"},
        {id: 213, bookNum: "43.d", type: "normal", raw: "He ________ (read) a book now.", ans: "is reading", bn: "সে এখন একটি বই পড়ছে।", ex: "বাক্যে 'now' (এখন) শব্দটি উল্লেখ থাকা মানে কাজটি এই মুহূর্তে চোখের সামনে সচল আছে। তাই এটি Present Continuous Tense (is + verb+ing) হয়েছে।"},
        {id: 214, bookNum: "43.e", type: "normal", raw: "The boy ________ yesterday.", ans: "did not play", bn: "ছেলেটি গতকাল খেলেনি।", ex: "বাক্যে 'yesterday' থাকায় এটি অতীতকাল। আর Past Indefinite Tense-কে নেগেটিভ বা না-বোধক করতে সাহায্যকারী ভার্ব 'did not' এবং এরপর ভার্বের ১ম রূপ (play) বসে।"},
        {id: 215, bookNum: "44.a", type: "normal", raw: "I ________ him long since.", ans: "had seen", bn: "অনেক আগে আমি তাকে দেখেছিলাম।", ex: "নিয়ম: 'long since' যুক্ত বাক্যে যদি অতীতের গভীরতা বোঝায়, তবে ব্যাকরণের নিয়ম অনুযায়ী সেটি Past Perfect Tense (had + V3) গঠনে রূপ নেয়।"},
        {id: 216, bookNum: "44.b", type: "normal", raw: "Work hard lest you ________ (fail).", ans: "should fail", bn: "কঠোর পরিশ্রম করো পাছে তুমি পরীক্ষায় ফেল না করো।", ex: "পরীক্ষায় বারবার আসা নিয়ম: বাক্যে 'lest' (পাছে ভয় হয় যে) শব্দটি থাকলে, এর পরবর্তী সাবজেক্টের পর সবসময় 'should' অথবা 'might' বসাতে হয়।"},
        {id: 217, bookNum: "44.c", type: "normal", raw: "Did he not ________ (eat) rice?", ans: "eat", bn: "সে কি ভাত খায়নি?", ex: "সহজ শর্টকাট: প্রশ্নবোধক বাক্যে সাহায্যকারী ভার্ব হিসেবে একবার 'did' (Past) বসে গেলে, মূল ভার্বটির সবসময় একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 218, bookNum: "44.d", type: "normal", raw: "She studied hard so that she ________ (may pass).", ans: "might pass", bn: "সে কঠোর পড়াশোনা করেছিল যেন সে পাস করতে পারে।", ex: "নিয়ম: বাক্যে উদ্দেশ্য প্রকাশক 'so that' এর আগের অংশটি যদি Past Tense (studied) হয়, তবে পরের অংশে 'may' এর পরিবর্তে Past Form 'might + V1' বসে।"},
        {id: 219, bookNum: "44.e", type: "normal", raw: "If you had not helped me, I ________ (fail).", ans: "would have failed", bn: "তুমি যদি আমাকে সাহায্য না করতে, তবে আমি ব্যর্থ হতাম।", ex: "এটি Third Conditional বাক্য। ইফ ক্লজটি Past Perfect (had not helped) এ থাকার কারণে, প্রিন্সিপাল ক্লজে Subject + would have + V3 বসেছে।"},
        {id: 220, bookNum: "45.a", type: "normal", raw: "If I were a bird, I ________ (fly) in the sky.", ans: "would fly", bn: "আমি যদি পাখি হতাম, তবে আকাশে উড়ে বেড়াতাম।", ex: "এটি কাল্পনিক অতীত বা Second Conditional বাক্য। ইফ ক্লজে অবাস্তব ইচ্ছা হিসেবে 'were' থাকায় অপর অংশে Subject + would + V1 (base form) বসে।"},
        {id: 221, bookNum: "45.b", type: "normal", raw: "I wish I ________ (know) the address of his house.", ans: "knew", bn: "আমি যদি তার বাড়ির ঠিকানাটি জানতাম!", ex: "নিয়ম: বাক্যে অবাস্তব বা অপূর্ণ ইচ্ছা প্রকাশক 'I wish' থাকলে, তার ঠিক পরের ক্লজের মূল ভার্বটি Past Indefinite Form বা V2 (knew) হয়।"},
        {id: 222, bookNum: "45.c", type: "normal", raw: "If I ________ (try), I might have succeeded.", ans: "had tried", bn: "আমি যদি চেষ্টা করতাম, তবে হয়তো সফল হতে পারতাম।", ex: "Third Conditional-এর উল্টো নিয়ম: মূল ক্লজে যেহেতু 'might have + V3' দেওয়া আছে, তাই ইফ ক্লজটি বাধ্যতামূলকভাবে Past Perfect Tense (had + V3 অর্থাৎ had tried) হবে।"},
        {id: 223, bookNum: "45.d", type: "normal", raw: "I ________ (suffer) from fever for a long time.", ans: "have been suffering", bn: "আমি দীর্ঘ সময় ধরে জ্বরে ভুগছি।", ex: "দীর্ঘ সময় ধরে (for a long time) অসুস্থতার কাজটি অতীতে শুরু হয়ে এখনও চলছে। সময়ের এই ব্যাপ্তির কারণে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 224, bookNum: "46.a", type: "normal", raw: "I am not used to ________ at this time of the day. (walk)", ans: "walking", bn: "দিনের এই সময়ে আমি হাঁটাহাঁটি করায় অভ্যস্ত নই।", ex: "মনে রাখুন: শুধু 'used to' এর পর V1 বসে, কিন্তু 'used to' এর আগে যদি কোনো Be-verb (am/is/are) থাকে, তবে তার অর্থ হয় অভ্যস্ততা এবং তখন ভার্ব + ing বসে।"},
        {id: 225, bookNum: "46.b", type: "normal", raw: "What you ________ last night? (to do)", ans: "did you do", bn: "গত রাতে তুমি কী করেছিলে?", ex: "বাক্যে 'last night' (গত রাত) থাকায় প্রশ্নবোধক বাক্যটি Past Indefinite স্ট্রাকচার (What + did + subject + V1) নিয়মে গঠিত হয়েছে।"},
        {id: 226, bookNum: "46.c", type: "normal", raw: "Twenty years ________ since my father died. (pass)", ans: "have passed", bn: "আমার বাবা মারা যাওয়ার পর থেকে বিশটি বছর কেটে গেছে।", ex: "টাইম লিঙ্কিং নিয়ম: 'Since'-এর পরের অংশটি যদি Past Indefinite (died) হয়, তবে 'since'-এর আগের অংশটি সবসময় Present Perfect Tense (have/has + V3) হয়।"},
        {id: 227, bookNum: "46.d", type: "normal", raw: "I ________ the documentary for the last twenty minutes. (watch)", ans: "have been watching", bn: "আমি গত বিশ মিনিট ধরে প্রামাণ্যচিত্রটি দেখছি।", ex: "বিগত ২০ মিনিট ধরে (for the last twenty minutes) কাজটি বর্তমানেও একটানা চলছে বোঝাচ্ছে। তাই নিয়মানুযায়ী এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 228, bookNum: "47.a", type: "normal", raw: "Population of Dhaka city ________ (to increase) recently.", ans: "has increased", bn: "সম্প্রতি ঢাকা শহরের জনসংখ্যা বৃদ্ধি পেয়েছে।", ex: "সহজ নিয়ম: বাক্যে 'recently' (সম্প্রতি) শব্দটি থাকলে তা Present Perfect Tense (have/has + V3) নির্দেশ করে। জনসংখ্যা সিঙ্গুলার ধারণা হওয়ায় 'has increased' বসেছে।"},
        {id: 229, bookNum: "47.b", type: "normal", raw: "I wish I ________ (to be) the king.", ans: "were", bn: "আমি যদি রাজা হতাম!", ex: "'I wish' এর পর কোনো অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 230, bookNum: "47.c", type: "normal", raw: "The patient had died before the doctor ________ (come).", ans: "came", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "শর্টকাট টেকনিক: 'Before' (পূর্বে) শব্দটির আগের অংশ যদি Past Perfect (had died) হয়, তবে 'before'-এর পরের অংশটি সবসময় Past Indefinite Form (V2 অর্থাৎ came) হয়।"},
        {id: 231, bookNum: "47.d", type: "normal", raw: "He ________ (read) now.", ans: "is reading", bn: "সে এখন পড়ছে।", ex: "বাক্যে 'now' (এখন) শব্দটি নির্দেশ করে যে কাজটি এই মুহূর্তে সচল বা চলমান আছে। তাই এটি Present Continuous Tense (is + reading) হয়েছে।"},
        {id: 232, bookNum: "47.e", type: "normal", raw: "Halim ________ (dream) a bad dream last night.", ans: "dreamt", bn: "হালিম গত রাতে একটি দুঃস্বপ্ন দেখেছিল।", ex: "অতীত নির্দেশক স্পষ্ট শব্দ 'last night' উল্লেখ থাকায় ভার্বটির চোখ বন্ধ করে Past Indefinite Form বা V2 (dreamt) বসেছে।"},
        {id: 233, bookNum: "48.a", type: "normal", raw: "Rome was not ________ (build) in a day.", ans: "built", bn: "রোম এক দিনে তৈরি হয়নি। (বিখ্যাত প্রবাদ)", ex: "রোম শহর নিজে নিজেকে তৈরি করেনি, মানুষের দ্বারা হয়েছিল (Passive)। তাছাড়া 'was not' এর পর প্যাসিভ ভয়েসের নিয়ম অনুযায়ী মূল ভার্বের Past Participle (V3 অর্থাৎ built) বসেছে।"},
        {id: 234, bookNum: "48.b", type: "normal", raw: "If I ________ (see) him, I would have given him the news.", ans: "had seen", bn: "আমি যদি তাকে দেখতাম, তবে তাকে খবরটি দিতাম।", ex: "Third Conditional-এর নিয়ম: মূল ক্লজে যেহেতু 'would have + V3' দেওয়া আছে, তাই ইফ ক্লজটি বাধ্যতামূলকভাবে Past Perfect Tense (had + V3 অর্থাৎ had seen) হবে।"},
        {id: 235, bookNum: "48.c", type: "normal", raw: "Bees ________ (gather) honey.", ans: "gather", bn: "মৌমাছিরা মধু সংগ্রহ করে।", ex: "এটি মৌমাছিদের একটি স্বাভাবিক ও চিরন্তন সত্য স্বভাব। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'Bees' প্লুরাল বা বহুবচন হওয়ায় ভার্বের কোনো পরিবর্তন হয়নি।"},
        {id: 236, bookNum: "48.d", type: "normal", raw: "Recently use of mobile phones ________ (increase).", ans: "has increased", bn: "সম্প্রতি মোবাইল ফোনের ব্যবহার বৃদ্ধি পেয়েছে।", ex: "বাক্যে 'recently' (সম্প্রতি) শব্দ থাকার কারণে এটি Present Perfect Tense। এখানে আসল সাবজেক্ট হলো 'use' (ব্যবহার-সিঙ্গুলার), তাই 'has increased' হয়েছে।"},
        {id: 237, bookNum: "48.e", type: "normal", raw: "A penny saved is a penny ________ (earn).", ans: "earned", bn: "এক পয়সা জমানো মানে এক পয়সা আয় করা। (বিখ্যাত প্রবাদ)", ex: "এটি একটি প্রবাদ বাক্য। এখানে 'saved' এর মতো 'earned' শব্দটিও একটি অবস্থা বা Passive Participle (V3) হিসেবে সমান্তরালভাবে বসেছে।"},
        {id: 238, bookNum: "49.a", type: "normal", raw: "A fire ________ (break) out in the slums last night.", ans: "broke", bn: "গত রাতে বস্তিতে আগুন লেগেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last night' উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (broke) বসেছে। break out মানে আগুন লাগা বা ছড়িয়ে পড়া।"},
        {id: 239, bookNum: "49.b", type: "normal", raw: "Speak the truth or you ________ (punish).", ans: "will be punished", bn: "সত্য কথা বলো অন্যথায় তোমাকে শাস্তি দেওয়া হবে।", ex: "ভবিষ্যতের ফলাফল বোঝাচ্ছে এবং শাস্তিটি সে নিজে নিজেকে দেবে না (Passive Voice)। তাই এটি Future Indefinite Tense-এর Passive রূপ (will be + punished) নিয়েছে।"},
        {id: 240, bookNum: "49.c", type: "normal", raw: "I would knit a sweater if I ________ (have) more wool.", ans: "had", bn: "আমার যদি আরও উল থাকতো, তবে আমি একটি সোয়েটার বুনতাম।", ex: "Second Conditional-এর উল্টো নিয়ম: মূল ক্লজে 'would + V1' (would knit) থাকার কারণে ইফ ক্লজটি বাধ্যতামূলকভাবে Past Indefinite Tense (V2 অর্থাৎ had) হবে।"},
        {id: 241, bookNum: "49.d", type: "normal", raw: "While they ________ (play), it started raining.", ans: "were playing", bn: "যখন তারা খেলছিল, তখন বৃষ্টি শুরু হয়েছিল।", ex: "ম্যাজিক নিয়ম: 'While'-এর ঠিক পরপরই যদি সরাসরি কোনো Subject (they) থাকে, তবে সেই অংশটি সবসময় চলমান অতীত বা Past Continuous Tense (were playing) হয়।"},
        {id: 242, bookNum: "49.e", type: "normal", raw: "The train ________ (leave) the platform before we arrived.", ans: "had left", bn: "আমরা পৌঁছানোর পূর্বেই ট্রেনটি প্ল্যাটফর্ম ছেড়ে চলে গিয়েছিল।", ex: "অতীতের দুটি কাজের মধ্যে 'before' (পূর্বে) এর আগের কাজটি আগে ঘটেছিল (ট্রেন আগে চলে গিয়েছিল)। তাই সেটি Past Perfect Tense (had + left) হয়েছে।"},
        {id: 243, bookNum: "50.a", type: "normal", raw: "It is high time we ________ (act) on the matter.", ans: "acted", bn: "এটাই উপযুক্ত সময় এই বিষয়ে আমাদের পদক্ষেপ নেওয়ার।", ex: "নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি সবসময় Past Indefinite Form (V2 অর্থাৎ acted) হয়।"},
        {id: 244, bookNum: "50.b", type: "normal", raw: "The police ________ (be verb) informed yesterday.", ans: "were", bn: "পুলিশকে গতকাল জানানো হয়েছিল।", ex: "বাক্যে 'yesterday' থাকায় এটি অতীতকাল। ইংরেজি ব্যাকরণে 'Police' শব্দটিকে সবসময়ই Plural Noun বা বহুবচন হিসেবে গণ্য করা হয়, তাই Past Plural Be-verb হিসেবে 'were' বসেছে।"},
        {id: 245, bookNum: "50.c", type: "normal", raw: "The Arabian Nights ________ (be verb) still a great.", ans: "is", bn: "আরব্য রজনী (বইটি) এখনও একটি দুর্দান্ত বই।", ex: "যদিও নামের শেষে 'Nights' (s যুক্ত) আছে, কিন্তু 'The Arabian Nights' হলো একটি মাত্র নির্দিষ্ট বইয়ের নাম (Singular Noun)। তাই এর পর Singular Verb 'is' বসেছে।"},
        {id: 246, bookNum: "50.d", type: "normal", raw: "My father ________ (leave) before I came.", ans: "had left", bn: "আমি আসার পূর্বেই আমার বাবা চলে গিয়েছিলেন।", ex: "শর্টকাট টেকনিক: 'Before' (পূর্বে) শব্দটির আগের অংশটি সবসময় আগে ঘটে এবং সেটি Past Perfect Tense (had + V3 অর্থাৎ had left) নিয়মে পূরণ করতে হয়।"},
        {id: 247, bookNum: "51.a", type: "normal", raw: "Why ________ she laugh at me?", ans: "did/does", bn: "সে কেন আমাকে দেখে হাসল/হাসে?", ex: "প্রশ্নবোধক বাক্যে Subject 'she' অনুযায়ী বর্তমান অভ্যাস বোঝালে সাহায্যকারী ভার্ব 'does' অথবা অতীতের কোনো ঘটনা বোঝালে 'did' দুটিই ব্যাকরণগতভাবে সঠিক।"},
        {id: 248, bookNum: "51.b", type: "normal", raw: "We ________ dinner when the phone rang?", ans: "were having", bn: "ফোনটি যখন বেজে উঠেছিল তখন আমরা রাতের খাবার খাচ্ছিলাম।", ex: "অতীতকালে একটি কাজ চলার সময় (খাবার খাওয়া) মাঝপথে আরেকটি ঘটনা ঘটলে (ফোন বাজা), চলমান কাজটি সবসময় Past Continuous Tense (were having) হয়।"},
        {id: 249, bookNum: "51.c", type: "normal", raw: "It ________ (rain) since morning.", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "সকাল থেকে (since morning) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। তাই নিয়ম মেনে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 250, bookNum: "51.d", type: "normal", raw: "I ________ (meet) him yesterday.", ans: "met", bn: "গতকাল আমি তার সাথে দেখা করেছিলাম।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (met) বসেছে।"},
        {id: 251, bookNum: "51.e", type: "normal", raw: "Babies ________ (cry) when they are hungry.", ans: "cry", bn: "শিশুরা ক্ষুধার্ত হলে কাঁদে।", ex: "এটি শিশুদের একটি চিরন্তন স্বাভাবিক স্বভাব ও সত্য ঘটনা। আর চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'Babies' বহুবচন হওয়ায় ভার্বটি অপরিবর্তিত (cry) আছে।"},
        {id: 252, bookNum: "52.a", type: "normal", raw: "While ________ (walk) on the road, I saw a snake.", ans: "walking", bn: "রাস্তায় হাঁটার সময়, আমি একটি সাপ দেখলাম।", ex: "সহজ নিয়ম: 'While'-এর ঠিক পরেই যদি কোনো Subject না থাকে (সরাসরি ব্র্যাকেট থাকে), তবে ওই ভার্বের সাথে সরাসরি ing যুক্ত করে দিতে হয়।"},
        {id: 253, bookNum: "52.b", type: "normal", raw: "I ________ (go) to my village home last week.", ans: "went", bn: "গত সপ্তাহে আমি আমার গ্রামের বাড়িতে গিয়েছিলাম।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last week' (গত সপ্তাহ) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (went) বসেছে।"},
        {id: 254, bookNum: "53.a", type: "normal", raw: "One of the boys ________ (be) absent yesterday.", ans: "was", bn: "বালকদের মধ্যে একজন গতকাল অনুপস্থিত ছিল।", ex: "মনে রাখবেন: 'One of'-এর পর অনেকগুলো বালকের কথা বলা হলেও আসল সাবজেক্ট কিন্তু ওই একজন (One)। 'yesterday' থাকায় অতীতকালের সিঙ্গুলার ভার্ব 'was' বসেছে।"},
        {id: 255, bookNum: "53.b", type: "normal", raw: "It is time ________ (start).", ans: "to start", bn: "এখনই শুরু করার সময়।", ex: "পার্থক্যটি বুঝুন: 'It is time'-এর পর যদি কোনো Subject না থাকে, তবে সরাসরি ইনফিনিটিভ অর্থাৎ 'to + V1' (to start) বসিয়ে বাক্যটি মেলাতে হয়।"},
        {id: 256, bookNum: "53.c", type: "normal", raw: "If I were a bird, I ________ (fly).", ans: "আমি যদি পাখি হতাম, তবে উড়ে বেড়াতাম।", ans: "would fly", ex: "এটি হলো Second Conditional (অবাস্তব ইচ্ছা)। ইফ ক্লজে 'were' থাকায় অপর অংশে নিয়ম অনুযায়ী Subject + would + V1 (fly) বসেছে।"},
        {id: 257, bookNum: "53.d", type: "normal", raw: "I got my rice ________ (cook).", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (my rice) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 258, bookNum: "53.e", type: "normal", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (came) বসেছে।"},
        {id: 259, bookNum: "54.a", type: "normal", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "এখানে 'had' ভার্বটি একা আছে, অর্থাৎ এটি Past Indefinite Tense (Second Conditional)। তাই নিয়ম মেনে পরের অংশে Subject + would + V1 (open) বসেছে।"},
        {id: 260, bookNum: "54.b", type: "normal", raw: "More than one person ________ (interest) in the problem given yesterday.", ans: "was interested", bn: "গতকাল দেওয়া সমস্যাটিতে একের বেশি ব্যক্তি আগ্রহী ছিলেন।", ex: "গুরুত্বপূর্ণ নিয়ম: 'More than one' এর পর Noun এবং Verb দুটিই সবসময় Singular বা একবচন হয়। তাছাড়া গতকালের প্যাসিভ অবস্থা বোঝাতে 'was interested' বসেছে।"},
        {id: 261, bookNum: "55.a", type: "normal", raw: "It often heavily ________ in Bangladesh. (rain)", ans: "rains", bn: "বাংলাদেশে প্রায়শই প্রচুর বৃষ্টিপাত হয়।", ex: "বাক্যে 'often' (প্রায়শই) থাকা মানে এটি একটি প্রাকৃতিক স্বাভাবিক ঘটনা (Present Indefinite)। Subject 'It' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'rains' হয়েছে।"},
        {id: 262, bookNum: "55.b", type: "normal", raw: "The train already ________ when I reached the station. (leave)", ans: "had left", bn: "আমি যখন স্টেশনে পৌঁছালাম তখন ট্রেনটি ইতিমধ্যেই ছেড়ে চলে গিয়েছিল।", ex: "স্টেশনে পৌঁছানোর আগেই ট্রেনটি চলে যাওয়ার কাজটি আগে ঘটেছিল। অতীতে দুটি কাজের মধ্যে আগের কাজটি সবসময় Past Perfect Tense (had + left) হয়।"},
        {id: 263, bookNum: "55.c", type: "normal", raw: "He ________ to Delhi tomorrow. (go)", ans: "will go", bn: "সে আগামীকাল দিল্লি যাবে।", ex: "বাক্যে ভবিষ্যৎ নির্দেশক স্পষ্ট শব্দ 'tomorrow' (আগামীকাল) উল্লেখ আছে। তাই ভবিষ্যৎ সাধারণ ঘটনা হিসেবে এটি Future Indefinite Tense (will go) হয়েছে।"},
        {id: 264, bookNum: "55.d", type: "normal", raw: "I cannot help ________ (laugh).", ans: "laughing", bn: "আমি না হেসে পারি না।", ex: "সহজ নিয়ম: ইংরেজিতে 'cannot help' অথবা 'could not help' ফ্রেজটি থাকলে, এর ঠিক পরের অ্যাকশন ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 265, bookNum: "55.e", type: "normal", raw: "I had the time I ________ (go).", ans: "would go", bn: "আমার সময় থাকলে আমি যেতাম।", ex: "এটি একটি শর্তযুক্ত সেকেন্ড কন্ডিশনাল বাক্যের মতো ভাব প্রকাশ করছে। অতীতে কোনো ইচ্ছা বা সম্ভাবনা প্রকাশ করতে এখানে 'would + V1' বা 'would go' বসেছে।"},
        {id: 266, bookNum: "56.a", type: "normal", raw: "Fifty kilometers ________ (be) a long distance.", ans: "is", bn: "পঞ্চাশ কিলোমিটার একটি দীর্ঘ দূরত্ব।", ex: "কিলোমিটারস (kilometers) দেখতে প্লুরাল মনে হলেও, যখন কোনো নির্দিষ্ট দূরত্ব বা ওজনকে একটি একক সমষ্টি হিসেবে ধরা হয়, তখন ভার্বটি সবসময় Singular বা 'is' হয়।"},
        {id: 267, bookNum: "56.b", type: "normal", raw: "He gave up ________ (play) football when he got married.", ans: "playing", bn: "বিয়ের পর সে ফুটবল খেলা ছেড়ে দিয়েছিল।", ex: "'Give up' (ছেড়ে দেওয়া) একটি Prepositional Phrase। ইংরেজিতে প্রিপজিশন বা প্রিপজিশনাল ফ্রেজের পর কোনো ভার্ব আসলে তার সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 268, bookNum: "57.a", type: "normal", raw: "Rahim always ________ (feel) tension.", ans: "feels", bn: "রহিম সবসময় মানসিক চাপ অনুভব করে।", ex: "বাক্যে 'always' (সবসময়) শব্দটি নিয়মিত সাধারণ অবস্থা বা Present Indefinite Tense নির্দেশ করে। Subject 'Rahim' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'feels' হয়েছে।"},
        {id: 269, bookNum: "57.b", type: "normal", raw: "I already ________ (forget) his name.", ans: "have already forgotten", bn: "আমি ইতিমধ্যেই তার নাম ভুলে গিয়েছি।", ex: "নিয়ম: বাক্যে 'already' (ইতিমধ্যেই) শব্দটি থাকলে তা নির্দেশ করে কাজটি এইমাত্র শেষ হয়েছে, অর্থাৎ এটি Present Perfect Tense (have + already + forgotten) হবে।"},
        {id: 270, bookNum: "57.c", type: "normal", raw: "I prefer ________ (dance) to playing.", ans: "dancing", bn: "আমি খেলার চেয়ে নাচ বেশি পছন্দ করি।", ex: "সমান্তরাল নিয়ম (Parallelism): 'Prefer... to' এর ক্ষেত্রে 'to' এর আগের ভার্ব এবং পরের ভার্ব দুটির রূপ একই হতে হয়। যেহেতু পরে 'playing' আছে, তাই আগেও 'dancing' বসবে।"},
        {id: 271, bookNum: "57.d", type: "normal", raw: "I ________ (meet) him last night.", ans: "met", bn: "গত রাতে আমি তার সাথে দেখা করেছিলাম।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last night' (গত রাত) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (met) বসেছে।"},
        {id: 272, bookNum: "57.e", type: "normal", raw: "I feel like ________ (cry).", ans: "crying", bn: "আমার কাঁদতে ইচ্ছে করছে।", ex: "সহজ নিয়ম: ইংরেজিতে 'feel like' (ইচ্ছে করা) একটি চমৎকার ফ্রেজ, যার ঠিক পরের ভার্বটির সাথে সবসময় বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 273, bookNum: "58.a", type: "normal", raw: "It is a big factory, five hundred people ________ (employ) there.", ans: "are employed", bn: "এটি একটি বড় কারখানা, সেখানে পাঁচশত লোক নিয়োজিত আছে।", ex: "পাঁচশত লোক নিজে নিজেকে নিয়োগ করে না, কারখানার মালিকের দ্বারা নিয়োজিত হয় (Passive Voice)। সাধারণ বর্তমানে এটি Plural Passive হিসেবে 'are employed' হয়েছে।"},
        {id: 274, bookNum: "58.b", type: "normal", raw: "I've been ________ (walk) for three hours.", ans: "walking", bn: "আমি তিন ঘন্টা ধরে হাঁটছি।", ex: "এখানে 'I've been' (I have been) দেওয়াই আছে এবং পরে 'for three hours' সময়ের ব্যাপ্তি নির্দেশ করায় এটি Present Perfect Continuous Tense-এর নিয়মে 'walking' বসেছে।"},
        {id: 275, bookNum: "58.c", type: "normal", raw: "The boat sank quickly but fortunately everybody ________ (rescue).", ans: "was rescued", bn: "নৌকাটি দ্রুত ডুবে গিয়েছিল কিন্তু ভাগ্যবশত সবাই উদ্ধার পেয়েছিল।", ex: "সবাই নিজে নিজে উদ্ধার হয়নি, উদ্ধারকারীদের দ্বারা হয়েছিল (Passive Voice)। 'everybody' ব্যাকরণগতভাবে সিঙ্গুলার হওয়ায় অতীতের প্যাসিভ হিসেবে 'was rescued' বসেছে।"},
        {id: 276, bookNum: "58.d", type: "normal", raw: "When I was on holiday, my camera ________ (steal) from my hotel.", ans: "was stolen", bn: "আমি যখন ছুটিতে ছিলাম, তখন আমার হোটেল থেকে আমার ক্যামেরাটি চুরি হয়ে গিয়েছিল।", ex: "ক্যামেরা নিজে নিজে চুরি করতে পারে না, চোরের দ্বারা চুরি হয়েছিল (Passive Voice)। অতীতকালের একটি একক ঘটনা এবং ক্যামেরা সিঙ্গুলার হওয়ায় 'was stolen' হয়েছে।"},
        {id: 277, bookNum: "58.e", type: "normal", raw: "I ________ (buy) a new bicycle last week.", ans: "bought", bn: "গত সপ্তাহে আমি একটি নতুন বাইসাইকেল কিনেছিলাম।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last week' (গত সপ্তাহ) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (bought) বসেছে।"},
        {id: 278, bookNum: "59.a", type: "normal", raw: "He is yet ________ (return).", ans: "to return", bn: "সে এখনও ফিরে আসেনি/ফিরতে বাকি আছে।", ex: "নিয়ম: বাক্যে 'yet' শব্দটি যখন কোনো Be-verb (is) এর পরে বসে কোনো কাজ বাকি থাকা বোঝায়, তখন ইনফিনিটিভ স্ট্রাকচার অর্থাৎ 'to + V1' (to return) বসে।"},
        {id: 279, bookNum: "59.b", type: "normal", raw: "We found him ________ (watch) TV.", ans: "watching", bn: "আমরা তাকে টিভি দেখা অবস্থায় দেখতে পেলাম।", ex: "সরল বাক্যে (Simple Sentence) প্রথম ভার্বের (found) পর অবজেক্টের একটি চলমান কাজ বা অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করতে হয়।"},
        {id: 280, bookNum: "59.c", type: "normal", raw: "The more you read, the more you ________ (learn).", ans: "learn/will learn", bn: "যত পড়িবে, তত জানিবে।", ex: "এটি একটি আনুপাতিক তুলনামূলক বাক্য। এই ধরনের 'The more..., the more...' স্ট্রাকচারে দুই পাশেই সাধারণত সমান্তরালভাবে Present Indefinite Tense (learn) বসে।"},
        {id: 281, bookNum: "59.d", type: "normal", raw: "While ________ (walk) along the road, I saw him.", ans: "walking", bn: "রাস্তা দিয়ে হাঁটার সময়, আমি তাকে দেখলাম।", ex: "সহজ নিয়ম: 'While'-এর ঠিক পরেই যদি সরাসরি কোনো Subject না থাকে (ব্র্যাকেট থাকে), তবে ওই ভার্বের সাথে সরাসরি ing যুক্ত করে পার্টিসিপল করতে হয়।"},
        {id: 282, bookNum: "59.e", type: "normal", raw: "There is no mother but ________ (love) her child.", ans: "loves", bn: "এমন কোনো মা নেই যিনি তার সন্তানকে ভালোবাসেন না।", ex: "বাক্যে 'There is no... but' স্ট্রাকচারে 'but' শব্দটি এখানে নেগেটিভ রিলেটিভ প্রোনাউন হিসেবে কাজ করে। সাবজেক্ট 'mother' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'loves' হয়েছে।"},
        {id: 283, bookNum: "60.a", type: "normal", raw: "What is lotted cannot ________ (blot).", ans: "be blotted", bn: "ভাগ্যের লিখন না যায় খণ্ডন। (বিখ্যাত প্রবাদ)", ex: "এটি একটি বিখ্যাত প্রবাদ বাক্য। Modal auxiliary (cannot) এর পর প্যাসিভ ভাব প্রকাশ করতে 'be + V3' অর্থাৎ 'be blotted' বসেছে।"},
        {id: 284, bookNum: "60.b", type: "normal", raw: "The police ________ (recover) the stolen money yesterday.", ans: "recovered", bn: "পুলিশ গতকাল চুরি হওয়া টাকা উদ্ধার করেছে।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'yesterday' (গতকাল) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (recovered) বসেছে।"},
        {id: 285, bookNum: "60.c", type: "normal", raw: "He got his house ________ (repair).", ans: "repaired", bn: "সে তার বাড়িটি মেরামত করিয়ে নিল।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (his house) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 286, bookNum: "60.d", type: "normal", raw: "We cannot but ________ (obey) our parents.", ans: "obey", bn: "আমরা আমাদের বাবা-মাকে মান্য না করে পারি না।", ex: "সহজ নিয়ম: বাক্যে 'cannot but' থাকলে এর ঠিক পরের প্রধান ভার্বটির সাথে কোনো কিছু যুক্ত হয় না, সরাসরি একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 287, bookNum: "60.e", type: "normal", raw: "He is too clever to ________ (cheat).", ans: "be cheated", bn: "সে এতই চালাক যে তাকে ঠকানো অসম্ভব।", ex: "সে নিজে কাউকে ঠকাবে না, তাকে অন্য কেউ ঠকাবে (Passive)। তাই 'too... to' স্ট্রাকচারে ইনফিনিটিভের প্যাসিভ রূপ হিসেবে 'to be + V3' (be cheated) বসেছে।"},
        {id: 288, bookNum: "61.a", type: "normal", raw: "The girl ________ (not sing) a song.", ans: "does not sing", bn: "মেয়েটি গান গায় না।", ex: "Present Indefinite Tense-কে না-বোধক করতে Subject যদি Third Person Singular (The girl) হয়, তবে সাহায্যকারী ভার্ব হিসেবে 'does not' এবং মূল ভার্বের V1 বসে।"},
        {id: 289, bookNum: "61.b", type: "normal", raw: "He ________ (not go) to school yesterday.", ans: "did not go", bn: "সে গতকাল স্কুলে যায়নি।", ex: "বাক্যে 'yesterday' থাকায় এটি অতীতকাল। আর Past Indefinite Tense-কে নেগেটিভ বা না-বোধক করতে সাহায্যকারী ভার্ব 'did not' এবং এরপর ভার্বের ১ম রূপ (go) বসে।"},
        {id: 290, bookNum: "61.c", type: "normal", raw: "I ________ (read) for three hours.", ans: "have been reading", bn: "আমি তিন ঘন্টা ধরে পড়ছি।", ex: "তিন ঘন্টা ধরে (for three hours) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। সময়ের এই ব্যাপ্তির কারণে বাক্যটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 291, bookNum: "61.d", type: "normal", raw: "If I were a king, I ________ (help) the poor.", ans: "would help", bn: "আমি যদি রাজা হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "এটি হলো Second Conditional (কাল্পনিক ইচ্ছা)। ইফ ক্লজে 'were' (Past) থাকার কারণে অপর অংশে নিয়ম অনুযায়ী Subject + would + V1 (base form) বসেছে।"},
        {id: 292, bookNum: "61.e", type: "normal", raw: "He ran fast lest he ________ (miss) the train.", ans: "should miss", bn: "সে দ্রুত দৌড়েছিল পাছে সে ট্রেনটি মিস না করে।", ex: "খুব কমন নিয়ম: বাক্যে 'lest' (পাছে ভয় হয় যে) শব্দটি থাকলে, এর পরবর্তী সাবজেক্টের পর সবসময় 'should' অথবা 'might' বসিয়ে ভার্বের V1 বসাতে হয়।"},
        {id: 293, bookNum: "62.a", type: "normal", raw: "It ________ (be verb) raining yesterday.", ans: "was", bn: "গতকাল বৃষ্টি হচ্ছিল।", ex: "বাক্যে 'yesterday' এবং ভার্বের সাথে ing (raining) থাকার কারণে এটি চলমান অতীত বা Past Continuous Tense। তাই একবচন সাবজেক্ট 'It' অনুযায়ী 'was' বসেছে।"},
        {id: 294, bookNum: "62.b", type: "normal", raw: "The baby came to me ________ (ran).", ans: "running", bn: "শিশুটি দৌড়াতে দৌড়াতে আমার কাছে এলো।", ex: "সরল বাক্যে প্রধান ভার্বের (came) পর আরেকটি কাজ একই সাথে সম্পন্ন বা চলমান অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করে পার্টিসিপল করা হয়েছে।"},
        {id: 295, bookNum: "62.c", type: "normal", raw: "The class ________ (be verb) shifted to another room.", ans: "is/was", bn: "ক্লাসটি অন্য রুমে স্থানান্তরিত করা হয়েছে/হয়েছিল।", ex: "ক্লাস নিজে নিজেকে স্থানান্তর করতে পারে না, কর্তৃপক্ষের দ্বারা করা হয় (Passive Voice)। তাই বর্তমানের প্যাসিভ হলে 'is shifted' অথবা অতীতের হলে 'was shifted' দুটিই সঠিক।"},
        {id: 296, bookNum: "62.d", type: "normal", raw: "His mother ________ (die) last year.", ans: "died", bn: "তার মা গত বছর মারা গিয়েছিলেন।", ex: "বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last year' (গত বছর) উল্লেখ আছে। তাই ভার্বটির Past Indefinite Form বা V2 (died) বসেছে।"},
        {id: 297, bookNum: "62.e", type: "normal", raw: "The patient had died before the doctor ________ (come).", ans: "came", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "শর্টকাট টেকনিক: 'Before' (পূর্বে) শব্দটির আগের অংশ যদি Past Perfect (had died) হয়, তবে 'before'-এর পরের অংশটি সবসময় Past Indefinite Form (V2 অর্থাৎ came) হয়।"},
        {id: 298, bookNum: "63.a", type: "normal", raw: "He ran away having ________ (take) the money.", ans: "taken", bn: "টাকাটা নিয়ে সে পালিয়ে গেল।", ex: "নিখুঁত নিয়ম: ইংরেজিতে 'having' শব্দটির পর কোনো অ্যাকশন ভার্ব আসলে, পারফেক্ট পার্টিসিপল গঠনের নিয়ম অনুযায়ী সেই ভার্বটির সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 299, bookNum: "63.b", type: "normal", raw: "The colour of his eye ________ (be) blue.", ans: "is", bn: "তার চোখের রঙ নীল।", ex: "এখানে চোখগুলো (eyes) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The colour' (রঙ), যা সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 300, bookNum: "63.c", type: "normal", raw: "I got the work ________ (do) by him.", ans: "done", bn: "আমি তাকে দিয়ে কাজটি করিয়ে নিলাম।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (the work) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3) বসে।"},
        {id: 301, bookNum: "63.d", type: "normal", raw: "He speaks as though ________ everything.", ans: "he knew", bn: "সে এমনভাবে কথা বলে যেন সে সবকিছুই জানতো।", ex: "নিয়ম: বাক্যে 'as though' বা 'as if' এর আগের অংশ Present Indefinite (speaks) হলে, পরের অংশটি অবাস্তব ধারণা প্রকাশ করতে Past Indefinite Tense (subject + V2) হয়।"},
        {id: 302, bookNum: "63.e", type: "normal", raw: "I would help him if he ________ (want).", ans: "wanted", bn: "সে যদি চাইতো, তবে আমি তাকে সাহায্য করতাম।", ex: "Second Conditional বাক্য। প্রধান ক্লজে যেহেতু 'would + V1' (would help) দেওয়া আছে, তাই ইফ ক্লজটি বাধ্যতামূলকভাবে Past Indefinite Tense (V2 অর্থাৎ wanted) হবে।"},
        {id: 303, bookNum: "64.a", type: "normal", raw: "A stitch in time ________ (save) nine.", ans: "saves", bn: "সময়ের এক ফোঁড়, অসময়ের দশ ফোঁড়। (বিখ্যাত প্রবাদ)", ex: "এটি একটি অতি পরিচিত প্রবাদ বাক্য। প্রবাদ বাক্য সবসময়ই Present Indefinite Tense-এ লিখতে হয়। Subject 'A stitch' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়েছে।"},
        {id: 304, bookNum: "64.b", type: "normal", raw: "He came here with a view to ________ (help) me.", ans: "helping", bn: "সে আমাকে সাহায্য করার উদ্দেশ্যে এখানে এসেছিল।", ex: "খুব কমন নিয়ম: বাক্যে 'with a view to' (উদ্দেশ্যে) শব্দগুচ্ছ থাকলে এর পরবর্তী প্রধান অ্যাকশন ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 305, bookNum: "64.c", type: "normal", raw: "She said that she ________ (do) the work the previous day.", ans: "had done", bn: "সে বলেছিল যে সে আগের দিন কাজটি করেছিল।", ex: "ইনডাইরেক্ট ন্যারেশনের নিয়ম: বাক্যে 'the previous day' থাকা মানে সেটি মূল বাক্যে Past Indefinite ছিল, যা রিপোর্টিং ভার্ব অতীতে (said) থাকার কারণে পরিবর্তিত হয়ে Past Perfect Tense (had + done) হয়েছে।"},
        {id: 306, bookNum: "64.d", type: "normal", raw: "There is no mother but ________ (love) her child.", ans: "loves", bn: "এমন কোনো মা নেই যিনি তার সন্তানকে ভালোবাসেন না।", ex: "বাক্যে 'There is no... but' স্ট্রাকচারে 'but' শব্দটি নেগেটিভ রিলেটিভ প্রোনাউন (যিনি... না) হিসেবে কাজ করে। সাবজেক্ট 'mother' সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'loves' হয়েছে।"},
        {id: 307, bookNum: "64.e", type: "normal", raw: "The girl ________ (play) since afternoon.", ans: "has been playing", bn: "মেয়েটি বিকেল থেকে খেলছে।", ex: "বিকেল থেকে (since afternoon) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। তাই নিয়ম মেনে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 308, bookNum: "65.a", type: "normal", raw: "Why he has done it ________ (be) a mystery.", ans: "is", bn: "সে কেন এটি করেছে তা একটি রহস্য।", ex: "এখানে কোনো একক শব্দ সাবজেক্ট নয়, পুরো ক্লজটি 'Why he has done it' (নউন ক্লজ) একটি একক সিঙ্গুলার ধারণা হিসেবে কাজ করছে। তাই সিঙ্গুলার ভার্ব 'is' বসেছে।"},
        {id: 309, bookNum: "66.a", type: "normal", raw: "What cannot be cured must ________ (endure).", ans: "be endured", bn: "যা প্রতিকার করা যায় না তা অবশ্যই সহ্য করতে হবে। (বিখ্যাত প্রবাদ)", ex: "এটি একটি বিখ্যাত প্রবাদ বাক্য। Modal auxiliary (must) এর পর প্যাসিভ ভাব প্রকাশ করতে (কারণ সহ্য করার কাজটি মানুষ করবে) 'be + V3' অর্থাৎ 'be endured' বসেছে।"},
        {id: 310, bookNum: "67.a", type: "normal", raw: "He always ________ (carry) an umbrella with him.", ans: "carries", bn: "সে সবসময় নিজের সাথে একটি ছাতা বহন করে।", ex: "বাক্যে 'always' (সবসময়) শব্দটি নিয়মতান্ত্রিক অভ্যাস বা সাধারণ বর্তমান প্রকাশ করে। Subject 'He' সিঙ্গুলার হওয়ায় ভার্বের শেষে es যুক্ত হয়ে 'carries' হয়েছে।"},
        {id: 311, bookNum: "67.b", type: "normal", raw: "Where they ________ (go) yesterday?", ans: "did they go", bn: "গতকাল তারা কোথায় গিয়েছিল?", ex: "বাক্যে 'yesterday' (গতকাল) থাকায় ইন্টারোগেটিভ বা প্রশ্নবোধক গঠনে Past Indefinite স্ট্রাকচার (Where + did + subject + V1) বসেছে।"},
        {id: 312, bookNum: "67.c", type: "normal", raw: "No sooner had he ________ (take) the money than he went away.", ans: "taken", bn: "টাকাটা নিতে না নিতেই সে চলে গেল।", ex: "শর্টকাট স্ট্রাকচার: 'No sooner had' এর ঠিক পরেই যেহেতু 'had' বসে গেছে, তাই পরবর্তী প্রধান ভার্বটির সবসময় ৩য় রূপ বা Past Participle (V3 অর্থাৎ taken) বসে।"},
        {id: 313, bookNum: "67.d", type: "normal", raw: "I wish I ________ eat not so much.", ans: "ate", bn: "আমি যদি এত বেশি না খেতাম!", ex: "নিয়ম: বাক্যে অবাস্তব আফসোস বা ইচ্ছা প্রকাশক 'I wish' থাকলে, তার ঠিক পরের ক্লজের মূল ভার্বটি Past Indefinite Form বা V2 (ate) হয়।"},
        {id: 314, bookNum: "68.a", type: "normal", raw: "They look forward to ________ (receive).", ans: "receiving", bn: "তারা চিঠি বা প্রত্যুত্তর পাওয়ার জন্য অধীর আগ্রহে অপেক্ষা করছে।", ex: "নিয়ম মেনে 'look forward to' ফ্রেজটির পর পরবর্তী প্রধান অ্যাকশন ভার্বটির সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 315, bookNum: "68.b", type: "normal", raw: "I wish I ________ (meet) you.", ans: "I wish I met you.", ans: "আমি যদি তোমার সাথে দেখা করতে পারতাম!", ex: "'I wish' এর পর অপূর্ণ ইচ্ছা প্রকাশ করতে পরবর্তী ক্লজের ভার্বটি সবসময় Past Indefinite Form (V2 অর্থাৎ met) হয়।"},
        {id: 316, bookNum: "68.c", type: "normal", raw: "They came home while I ________ (study).", ans: "was studying", bn: "যখন আমি পড়ছিলাম তখন তারা বাড়ি এসেছিল।", ex: "অতীতকালে একটি কাজ চলার সময় (পড়াশোনা করা) মাঝপথে আরেকটি ঘটনা ঘটলে (তারা বাড়ি আসা), চলমান কাজটি 'While' এর পর Past Continuous Tense (was studying) হয়।"},
        {id: 317, bookNum: "68.d", type: "normal", raw: "Would that I ________ (go) there.", ans: "could go", bn: "আমি যদি সেখানে যেতে পারতাম!", ex: "বাক্যের শুরুতে 'Would that' থাকা মানেই এটি একটি তীব্র অথচ অসম্ভব ইচ্ছা প্রকাশ করছে। এই ধরনের বাক্যে সাবজেক্টের পর সবসময় 'could + V1' বসাতে হয়।"},
        {id: 318, bookNum: "68.e", type: "normal", raw: "Shanto played as though he ________ (see) the ball clearly.", ans: "had seen", bn: "শান্ত এমনভাবে খেলল যেন সে বলটি একদম পরিষ্কার দেখতে পেয়েছিল।", ex: "নিয়ম: বাক্যে 'as though' এর আগের অংশ Past Indefinite (played) হলে, পরের অংশটি সবসময় Past Perfect Tense (had + V3 অর্থাৎ had seen) দিয়ে মেলাতে হয়।"},
        {id: 319, bookNum: "69.a", type: "normal", raw: "Ice ________ (float) on water.", ans: "floats", bn: "বরফ পানিতে ভাসে।", ex: "এটি একটি বৈজ্ঞানিক এবং চিরন্তন সত্য ঘটনা। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'Ice' আনকাউন্টেবল বা সিঙ্গুলার হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'floats' হয়েছে।"},
        {id: 320, bookNum: "69.b", type: "normal", raw: "I saw him ________ (run).", ans: "running", bn: "আমি তাকে দৌড়াতে দেখলাম।", ex: "সরল বাক্যে প্রথম প্রধান ভার্বের (saw) পর দ্বিতীয় ভার্বটি দিয়ে যখন কোনো চলমান অবস্থা প্রকাশ পায়, তখন তার সাথে ing যুক্ত করে পার্টিসিপল করতে হয়।"},
        {id: 321, bookNum: "69.c", type: "normal", raw: "While walking at the station. I ________ (meet) him.", ans: "met", bn: "স্টেশনে হাঁটার সময়, তার সাথে আমার দেখা হয়েছিল।", ex: "হাঁটার কাজটি যখন অতীতে চলছিল, ঠিক সেই মুহূর্তে একটি হঠাৎ ঘটা ঘটনা হিসেবে এটি Past Indefinite Tense (V2 অর্থাৎ met) হয়েছে।"},
        {id: 322, bookNum: "69.d", type: "normal", raw: "One of the mangoes ________ (be) rotten.", ans: "was", bn: "আমগুলোর মধ্যে একটি পচা ছিল।", ex: "মনে রাখবেন: 'One of'-এর পর অনেকগুলো আমের কথা বলা হলেও আসল সাবজেক্ট কিন্তু ওই একটি আম (One)। তাই সিঙ্গুলার অতীত ভার্ব হিসেবে 'was' বসেছে।"},
        {id: 323, bookNum: "69.e", type: "normal", raw: "You had better ________ (go) to the class.", ans: "go", bn: "তোমার বরং ক্লাসে যাওয়াই ভালো।", ex: "সহজ নিয়ম: বাক্যে 'had better' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 324, bookNum: "70.b", type: "normal", raw: "Karim watched the boat ________ (flow) down the water.", ans: "flowing", bn: "করিম নৌকাটিকে পানির স্রোতে ভেসে যেতে দেখল।", ex: "সরল বাক্যে 'watched' ভার্বের পর অবজেক্টের (the boat) একটি চলমান অবস্থা চোখের সামনে সচল বোঝাতে ২য় ভার্বের সাথে ing যুক্ত হয়েছে।"},
        {id: 325, bookNum: "70.c", type: "normal", raw: "We ________ (play) a cricket match tomorrow.", ans: "will play", bn: "আমরা আগামীকাল একটি ক্রিকেট ম্যাচ খেলবো।", ex: "বাক্যে ভবিষ্যৎ নির্দেশক স্পষ্ট শব্দ 'tomorrow' (আগামীকাল) উল্লেখ আছে। তাই ভবিষ্যৎ সাধারণ ঘটনা হিসেবে এটি Future Indefinite Tense (will play) হয়েছে।"},
        {id: 326, bookNum: "70.d", type: "normal", raw: "I love ________ (watch) football.", ans: "watching", bn: "আমি ফুটবল দেখতে ভালোবাসি।", ex: "পছন্দ বা অপছন্দ প্রকাশের ভার্ব 'love' এর পর যখন আরেকটি সাধারণ কাজের চিরন্তন ভাব প্রকাশ পায়, তখন দ্বিতীয় ভার্বটির সাথে ing যুক্ত হয়ে Gerund গঠিত হয়।"},
        {id: 327, bookNum: "70.e", type: "normal", raw: "Samina ________ (wash) her hands daily.", ans: "সামিনা প্রতিদিন তার হাত ধোয়।", ans: "washes", ex: "বাক্যে 'daily' (প্রতিদিন) শব্দটি নিয়মিত অভ্যাস নির্দেশ করে (Present Indefinite)। Subject 'Samina' সিঙ্গুলার হওয়ায় ভার্বের শেষে es যুক্ত হয়ে 'washes' হয়েছে।"},
        {id: 328, bookNum: "71.e", type: "normal", raw: "I shall ________ (do) the sum before the teacher comes.", ans: "have done", bn: "শিক্ষক আসার পূর্বেই আমি অঙ্কটি করে ফেলবো।", ex: "ভবিষ্যতের দুটি কাজের মধ্যে 'before'-এর পরের অংশ Present Indefinite (comes) হলে আগের অংশটি Future Perfect Tense (shall have + V3) হয়।"},
        {id: 329, bookNum: "72.b", type: "normal", raw: "If I were you, I ________ (plant) some trees round the house.", ans: "would plant", bn: "আমি যদি তোমার জায়গায় হতাম, তবে বাড়ির চারপাশে কিছু গাছ লাগাতাম।", ex: "এটি হলো Second Conditional (কাল্পনিক পরামর্শ)। ইফ ক্লজে 'were' (Past) থাকার কারণে অপর অংশে নিয়ম অনুযায়ী Subject + would + V1 (plant) বসেছে।"},
        {id: 330, bookNum: "72.c", type: "normal", raw: "My father was ________ (transfer) from Dhaka to Chattogram.", ans: "আমার বাবা ঢাকা থেকে চট্টগ্রামে বদলি হয়েছিলেন।", ans: "transferred", ex: "বাবা নিজে নিজেকে বদলি করেননি, কর্তৃপক্ষের দ্বারা হয়েছিলেন (Passive Voice)। তাছাড়া 'was' এর পর প্যাসিভ ভয়েসের নিয়ম অনুযায়ী মূল ভার্বের Past Participle (V3) বসে।"},
        {id: 331, bookNum: "72.d", type: "normal", raw: "The size of the shoes ________ (be) short.", ans: "জুতো জোড়ার আকার ছোট।", ans: "is", ex: "এখানে জুতো (shoes) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The size' (আকার), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 332, bookNum: "72.e", type: "normal", raw: "There ________ (be) two high schools in our village.", ans: "আমাদের গ্রামে দুটি উচ্চ বিদ্যালয় আছে।", ans: "are", bn: "আমাদের গ্রামে দুটি উচ্চ বিদ্যালয় আছে।", ex: "Introductory 'There' যুক্ত বাক্যে ভার্বটি তার পরের Noun (two high schools - Plural) অনুযায়ী নির্ধারিত হয়। তাই বহুবচন সাবজেক্টের কারণে 'are' বসেছে।"},
        {id: 333, bookNum: "73.b", type: "normal", raw: "That room ________ (use) for a meeting today.", ans: "is used", bn: "ওই রুমটি আজ মিটিংয়ের জন্য ব্যবহার করা হচ্ছে।", ex: "রুম নিজে নিজেকে ব্যবহার করতে পারে না, মানুষের দ্বারা ব্যবহৃত হয় (Passive Voice)। সাধারণ বর্তমানে সিঙ্গুলার নাউনের প্যাসিভ হিসেবে 'is used' বসেছে।"},
        {id: 334, bookNum: "73.c", type: "normal", raw: "Internet connectivity ________ (be) addressed in half a dozen different way.", ans: "is", bn: "ইন্টারনেট সংযোগের বিষয়টি আধ ডজন ভিন্ন উপায়ে সমাধান করা হয়েছে/হয়।", ex: "এখানে আসল সাবজেক্ট হলো 'Internet connectivity' (আনকাউন্টেবল এবং সিঙ্গুলার নাউন)। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 335, bookNum: "73.d", type: "normal", raw: "Ancient Greek ________ (teach) still in some school.", ans: "is still taught", bn: "প্রাচীন গ্রীক ভাষা এখনও কিছু স্কুলে পড়ানো হয়।", ex: "গ্রীক ভাষা নিজে নিজে পড়তে পারে না, শিক্ষকদের দ্বারা পড়ানো হয় (Passive Voice)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে 'is + still + V3 (taught)' বসেছে।"},
        {id: 336, bookNum: "73.e", type: "normal", raw: "I would rather ________ (have) coffee than tea.", ans: "have", bn: "আমি চায়ের চেয়ে বরং কফিই খাবো।", ex: "সহজ নিয়ম: বাক্যে 'would rather' (বরং ভালো) শব্দগুচ্ছের পর কোনো 'to' বসে না, সরাসরি মূল ভার্বের একদম আসল রূপ বা Base Form (V1 অর্থাৎ have) বসে।"},
        {id: 337, bookNum: "74.b", type: "normal", raw: "Don't come tomorrow unless I ________ (phone).", ans: "phone", bn: "আমি ফোন না করা পর্যন্ত আগামীকাল এসো না।", ex: "শর্তযুক্ত বাক্যে 'unless' (যদি না) এর পরের অংশটি সাধারণত সাধারণ বর্তমান বা Present Indefinite Tense (Subject + V1) নিয়মে গঠিত হয়।"},
        {id: 338, bookNum: "74.c", type: "normal", raw: "As soon as I ________ (hear) the bell ringing, I opened the door.", ans: "heard", bn: "ঘণ্টা বাজার শব্দ শোনা মাত্রই আমি দরজাটি খুলেছিলাম।", ex: "নিয়ম: 'As soon as' যুক্ত বাক্যের একপাশের ক্লজটি Past Indefinite (opened) হলে, অন্য পাশের ক্লজটিও সামঞ্জস্য রেখে Past Indefinite Tense (V2 অর্থাৎ heard) হয়।"},
        {id: 339, bookNum: "74.d", type: "normal", raw: "We ________ up by a loud sound during the night.", ans: "woke", bn: "রাতের বেলা একটি বিকট শব্দে আমাদের ঘুম ভেঙে গিয়েছিল।", ex: "অতীতের একটি নির্দিষ্ট রাতের আকস্মিক ঘটনা। তাই সাধারণ অতীত বা Past Indefinite Tense-এর নিয়ম অনুযায়ী ভার্বের ২য় রূপ 'woke' বসেছে।"},
        {id: 340, bookNum: "74.e", type: "normal", raw: "The Principal had his teachers ________ (plan) their lessons in advance.", ans: "planned", bn: "অধ্যক্ষ মহাশয় তাঁর শিক্ষকদের দিয়ে আগে থেকেই পাঠ পরিকল্পনা করিয়ে নিয়েছিলেন।", ex: "Causative Verb 'have/had' এর পর যখন কোনো কাজ বা পরিকল্পনা অন্য কারো দ্বারা অলরেডি সম্পন্ন অবস্থা বোঝায়, তখন পরবর্তী ভার্বের Past Participle (V3) বসে।"},
        {id: 341, bookNum: "75.a", type: "normal", raw: "The door ________ automatically.", ans: "opened", bn: "দরজাটি স্বয়ংক্রিয়ভাবে খুলে গিয়েছিল।", ex: "অতীতের একটি সাধারণ অ্যাকশন বা ঘটনা প্রকাশ করতে এখানে সিম্পল পাস্ট বা Past Indefinite Form (V2 অর্থাৎ opened) ব্যবহৃত হয়েছে।"},
        {id: 342, bookNum: "75.b", type: "normal", raw: "Four and four ________ eight.", ans: "makes", bn: "চারে চারে আট হয়।", ex: "গাণিতিক সংখ্যার হিসাব বা যোগফলকে ইংরেজিতে সবসময় Singular ধারণা হিসেবে গণ্য করা হয়, তাই Singular Verb 'makes' বসেছে।"},
        {id: 343, bookNum: "75.c", type: "normal", raw: "He made me ________ the car.", ans: "wash", bn: "সে আমাকে দিয়ে গাড়িটি ধুইয়েছিল।", ex: "Causative Verb 'make/made' এর নিয়ম: মেক (made) এর পর যদি কোনো ব্যক্তি (me) থাকে, তবে পরবর্তী ভার্বের সাথে কোনো কিছু যুক্ত হয় না, সরাসরি Base Form (V1) বসে।"},
        {id: 344, bookNum: "75.d", type: "normal", raw: "Have you ________ the letter?", ans: "written", bn: "তুমি কি চিঠিটি লিখেছ?", ex: "Present Perfect Tense-এর প্রশ্নবোধক বাক্য। 'Have' সামনে থাকায় নিয়ম অনুযায়ী মূল ভার্বের ৩য় রূপ বা Past Participle (V3অর্থাৎ written) বসেছে।"},
        {id: 345, bookNum: "75.e", type: "normal", raw: "I wish I ________ philosopher!", ans: "were", bn: "আমি যদি একজন দার্শনিক হতাম!", ex: "'I wish' এর পর কোনো অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 346, bookNum: "76.a", type: "normal", raw: "She insisted ________ (go) to the meeting.", ans: "on going", bn: "সে মিটিংয়ে যাওয়ার জন্য জেদ ধরেছিল।", ex: "ইংরেজি ব্যাকরণে 'insist' ভার্বটির পর এপ্রোপ্রিয়েট প্রিপজিশন হিসেবে 'on' বসে এবং প্রিপজিশনের পর ভার্বের সাথে ing যুক্ত হয়ে 'on going' হয়েছে।"},
        {id: 347, bookNum: "76.b", type: "normal", raw: "He is really good ________ (play) the guitar.", ans: "at playing", bn: "সে গিটার বাজানোয় সত্যিই খুব দক্ষ।", ex: "কোনো বিষয়ে দক্ষতা বোঝাতে 'good at' ফ্রেজটি বসে। আর 'at' একটি প্রিপজিশন হওয়ায় এর পরের ভার্বটির সাথে ing যুক্ত হয়ে 'at playing' হয়েছে।"},
        {id: 348, bookNum: "76.c", type: "normal", raw: "We have been waiting ________ the bus.", ans: "for", bn: "আমরা বাসের জন্য অপেক্ষা করছি।", ex: "কারো বা কোনো কিছুর জন্য অপেক্ষা করা বোঝাতে 'wait' ভার্বটির পর এপ্রোপ্রিয়েট প্রিপজিশন হিসেবে সবসময় 'for' বসে।"},
        {id: 349, bookNum: "76.d", type: "normal", raw: "They succeeded ________ (complete) the project.", ans: "in completing", bn: "তারা প্রজেক্টটি সফলভাবে সম্পন্ন করতে পেরেছিল।", ex: "সাফল্য লাভ করা অর্থে 'succeeded' ভার্বটির পর উপযুক্ত প্রিপজিশন 'in' বসে এবং প্রিপজিশনের নিয়ম অনুযায়ী ভার্ব + ing যুক্ত হয়ে 'in completing' হয়েছে।"},
        {id: 350, bookNum: "76.e", type: "normal", raw: "I am looking forward ________ (see) you next month.", ans: "to seeing", bn: "আমি আগামী মাসে তোমার সাথে দেখা করার জন্য অধীর আগ্রহে অপেক্ষা করছি।", ex: "খুব কমন নিয়ম: 'looking forward' এর পর এপ্রোপ্রিয়েট ফ্রেজ হিসেবে 'to' বসে এবং এরপর ভার্বের সাথে সর্বদা ing যুক্ত হয়ে 'to seeing' হয়েছে।"},
