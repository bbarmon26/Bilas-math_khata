        {id: 547, bookNum: "101", type: "previous", raw: "I cannot help ________ (to listen) to them.", ans: "listening", bn: "আমি তাদের কথা না শুনে পারি না।", ex: "সহজ নিয়ম: বাক্যে 'cannot help' থাকলে ব্র্যাকেটের 'to' উঠে যায় এবং পরবর্তী মূল ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত হয়ে Gerund গঠিত হয়।"},
        {id: 448, bookNum: "102", type: "previous", raw: "It ________ (is raining) for five hours.", ans: "has been raining", bn: "পাঁচ ঘণ্টা ধরে বৃষ্টি হচ্ছে।", ex: "পাঁচ ঘণ্টা ধরে (for five hours) একটি কাজ অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। সময়ের এই ব্যাপ্তির কারণে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 549, bookNum: "103", type: "previous", raw: "What you ________ (go) to drink?", ans: "are you going", bn: "তুমি কী পান করতে যাচ্ছ?", ex: "ভবিষ্যতের একটি তাৎক্ষণিক পরিকল্পনা বা প্রশ্ন প্রকাশ করতে 'be going to' স্ট্রাকচার বসে। Subject 'you' হওয়ায় প্রশ্নবোধক গঠনে 'are you going' হয়েছে।"},
        {id: 550, bookNum: "104", type: "previous", raw: "They worried lest they ________ (be) late.", ans: "should be", bn: "তারা চিন্তিত ছিল পাছে তারা দেরি না করে ফেলে।", ex: "পরীক্ষায় বারবার আসা নিয়ম: বাক্যে 'lest' (পাছে ভয় হয় যে) শব্দটি থাকলে, এর পরবর্তী সাবজেক্টের পর সবসময় 'should' অথবা 'might' বসিয়ে ভার্বের V1 বসাতে হয়।"},
        {id: 551, bookNum: "105", type: "previous", raw: "The train ________ (leave) before we ________ (come) to the station.", ans: "had left, came", bn: "আমরা স্টেশনে পৌঁছানোর পূর্বেই ট্রেনটি ছেড়ে চলে গিয়েছিল।", ex: "অতীতের দুটি কাজের মধ্যে 'before' (পূর্বে) এর আগের কাজটি আগে ঘটেছিল (ট্রেন আগে চলে যায়)। তাই সেটি Past Perfect (had left) এবং পরেরটি Past Indefinite (came) হয়েছে।"},
        {id: 552, bookNum: "106", type: "previous", raw: "If you come, I ________ (go) with you.", ans: "will go", bn: "যদি তুমি আসো, তবে আমি তোমার সাথে যাবো।", ex: "এটি হলো First Conditional (সাধারণ শর্ত)। 'If' যুক্ত অংশটি Present Indefinite Tense (come) এ থাকার কারণে, অপর অংশে নিশ্চিত ভবিষ্যৎ হিসেবে Subject + will + V1 বসে।"},
        {id: 553, bookNum: "107", type: "previous", raw: "He could not help ________ (make) the comment.", ans: "making", bn: "সে মন্তব্যটি না করে পারল না।", ex: "সহজ নিয়ম: ইংরেজিতে 'could not help' ফ্রেজটি থাকলে, এর ঠিক পরের অ্যাকশন ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 554, bookNum: "108", type: "previous", raw: "I wanted him ________ (do) the work.", ans: "to do", bn: "আমি তাকে দিয়ে কাজটি করাতে চেয়েছিলাম।", ex: "বাক্যে 'wanted' একটি মূল অ্যাকশন ভার্ব। একই সরল বাক্যে উদ্দেশ্য বা ফল প্রকাশ করতে পরবর্তী দ্বিতীয় ভার্বটির আগে 'to' বসিয়ে ইনফিনিটিভ (to do) করতে হয়।"},
        {id: 555, bookNum: "109", type: "previous", raw: "He insisted on my ________ (go) there.", ans: "going", bn: "সে সেখানে আমার যাওয়ার ব্যাপারে জোর দিয়েছিল।", ex: "এখানে 'my' হলো একটি Possessive Pronoun, আর প্রিপজিশন 'on' আছে। ইংরেজি ব্যাকরণের নিয়ম অনুযায়ী এদের পর কোনো ভার্ব আসলে তার Gerund Form (verb+ing) বসে।"},
        {id: 556, bookNum: "110", type: "previous", raw: "I wish I ________ (be) a millionaire.", ans: "were", bn: "আমি যদি একজন কোটিপতি হতাম!", ex: "'I wish' এর পর কোনো অবাস্তব বা কাল্পনিক ইচ্ছা প্রকাশ করতে সাবজেক্ট যাই থাকুক না কেন, To-be verb হিসেবে সবসময় 'were' বসে, কখনো 'was' হয় না।"},
        {id: 557, bookNum: "111", type: "previous", raw: "It is high time we ________ (start) our work.", ans: "started", bn: "এটাই উপযুক্ত সময় আমাদের কাজ শুরু করার।", ex: "নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ started) হয়।"},
        {id: 558, bookNum: "112", type: "previous", raw: "Either they or I ________ (be) to blame.", ans: "am", bn: "হয় তারা অথবা আমি দোষী।", ex: "নিয়ম: 'Either... or' দ্বারা যুক্ত সাবজেক্টের ক্ষেত্রে 'or'-এর ঠিক পরের সাবজেক্ট (এখানে 'I') অনুযায়ী ভার্ব নির্ধারিত হয়। যেহেতু 'I' আছে, তাই Be-verb হিসেবে 'am' বসেছে।"},
        {id: 559, bookNum: "113", type: "previous", raw: "Many a students ________ (be) present in the class.", ans: "is", bn: "অনেক ছাত্রই ক্লাসে উপস্থিত থাকে।", ex: "সহজ কথা: 'Many' এর পর Plural হলেও, 'Many a' ফ্রেজটির পর Noun এবং Verb দুটিই সবসময় Singular (একবচন) হয়। তাই এখানে 'is' বসেছে।"},
        {id: 560, bookNum: "114", type: "previous", raw: "I could not help ________ (to laugh).", ans: "laughing", bn: "আমি না হেসে পারলাম না।", ex: "সহজ নিয়ম: বাক্যে 'could not help' ফ্রেজটি থাকলে ব্র্যাকেটের 'to' উঠে যায় এবং পরবর্তী মূল ভার্বের সাথে বাধ্যতামূলকভাবে ing যুক্ত করে জেরান্ড করতে হয়।"},
        {id: 561, bookNum: "115", type: "previous", raw: "Had I been a rich man, I ________ (help) the poor.", ans: "would have helped", bn: "আমি যদি ধনী লোক হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "বাক্যের শুরুতে 'Had + Subject + V3' থাকা মানে এটি Third Conditional (অতীতের অবাস্তব ইচ্ছা)। তাই অপর অংশে নিয়ম মেনে 'Subject + would have + V3' বসাতে হয়।"},
        {id: 562, bookNum: "116", type: "previous", raw: "He was ________ for murder. (to hang).", ans: "hanged", bn: "খুনের দায়ে তাঁর ফাঁসি দেওয়া হয়েছিল।", ex: "মানুষকে ফাঁসি দেওয়া অর্থে 'hang' ভার্বটির Past Participle (V3) রূপটি হয় 'hanged'। (আর দেওয়ালে কোনো কিছু ঝুলানো বোঝালে হতো 'hung')। প্যাসিভ ভয়েস হওয়ায় এখানে 'hanged' বসেছে।"},
        {id: 563, bookNum: "117", type: "previous", raw: "She stood up and ________ an excellent speech. (to make).", ans: "made", bn: "তিনি উঠে দাঁড়ালেন এবং একটি চমৎকার ভাষণ দিলেন।", ex: "অতীতের দুটি ধারাবাহিক সাধারণ ঘটনা যা 'and' দ্বারা যুক্ত হয়েছে। প্রথমাংশে 'stood' (Past) থাকায় সামঞ্জস্য রাখতে পরের অংশেও 'make' এর Past Form 'made' বসেছে।"},
        {id: 564, bookNum: "118", type: "previous", raw: "It ________ since morning. (to rain).", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "সকাল থেকে (since morning) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। তাই নিয়ম মেনে এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 565, bookNum: "119", type: "previous", raw: "The children came ________ to meet us. (to run).", ans: "running", bn: "শিশুরা আমাদের সাথে দেখা করতে দৌড়াতে দৌড়াতে এলো।", ex: "সরল বাক্যে প্রধান ভার্বের (came) পর আরেকটি কাজ একই সাথে সম্পন্ন বা চলমান অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করে পার্টিসিপল করা হয়েছে।"},
        {id: 566, bookNum: "120", type: "previous", raw: "The earth ________ round the sun. (to move).", ans: "moves", bn: "পৃথিবী সূর্যের চারদিকে ঘোরে।", ex: "এটি একটি চিরন্তন বৈজ্ঞানিক সত্য (Universal Truth) বাক্য। চিরন্তন সত্য বাক্য সবসময় Present Indefinite Tense হয়। Subject 'The earth' একবচন হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'moves' হয়েছে।"},
        {id: 567, bookNum: "121", type: "previous", raw: "The letter ________ a week ago. (to post).", ans: "was posted", bn: "চিঠিটি এক সপ্তাহ আগে পোস্ট করা হয়েছিল।", ex: "চিঠি নিজে নিজে পোস্ট হতে পারে না, মানুষের দ্বারা হয়েছিল (Passive Voice)। 'a week ago' অতীত নির্দেশ করায় এবং চিঠিটি সিঙ্গুলার হওয়ায় Past Indefinite-এর Passive Form 'was posted' বসেছে।"},
        {id: 568, bookNum: "122", type: "previous", raw: "He kept me ________ outside. (to wait).", ans: "waiting", bn: "সে আমাকে বাইরে দাঁড় করিয়ে রেখেছিল।", ex: "সরল বাক্যে (Simple Sentence) প্রথম ভার্বের (kept) পর অবজেক্টের একটি চলমান কাজ বা অবস্থা প্রকাশ করতে ২য় ভার্বের সাথে ing যুক্ত করতে হয়।"},
        {id: 569, bookNum: "123", type: "previous", raw: "Every flower and every fruit ________ (be) the gift of God.", ans: "is", bn: "প্রতিটি ফুল এবং প্রতিটি ফলই ঈশ্বরের উপহার।", ex: "সহজ নিয়ম: 'and' দ্বারা যুক্ত হলেও যদি প্রতিটির আগে 'Every' বা 'Each' শব্দ দুটি থাকে, তবে পুরো সাবজেক্টটি সবসময় একবচন বা Singular হয়, তাই 'is' বসেছে।"},
        {id: 570, bookNum: "124", type: "previous", raw: "Either the pen on the paper ________ (be) on the table.", ans: "is", bn: "হয় কাগজের ওপরের কলমটি টেবিলে আছে।", ex: "এখানে 'Either' দ্বারা একটি নির্দিষ্ট একক বস্তুকে (the pen) বোঝানো হচ্ছে যা সিঙ্গুলার সাবজেক্ট। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 571, bookNum: "125", type: "previous", raw: "The greater part of the village ________ (flood).", ans: "is flooded", bn: "গ্রামের সিংহভাগ এলাকা প্লাবিত হয়েছে।", ex: "গ্রামের অংশটি নিজে প্লাবিত হতে পারে না, বন্যার পানি দ্বারা হয়েছে (Passive)। এটি একটি একক অংশ বা Singular ধারণা হওয়ায় 'is flooded' হয়েছে।"},
        {id: 572, bookNum: "126", type: "previous", raw: "He ________ (leave) the place just now.", ans: "has left", bn: "সে এইমাত্র স্থানটি ত্যাগ করেছে।", ex: "বাক্যে 'just now' (এইমাত্র) শব্দগুচ্ছ থাকা মানেই কাজটি এইমাত্র শেষ হয়েছে কিন্তু তার ফল এখনও আছে। তাই এটি Present Perfect Tense (have/has + V3) হবে।"},
        {id: 573, bookNum: "127", type: "previous", raw: "I cannot but ________ (shed) tears.", ans: "shed", bn: "আমি চোখের জল না ফেলে পারি না।", ex: "সহজ নিয়ম: বাক্যে 'cannot but' থাকলে এর ঠিক পরের প্রধান ভার্বটির সাথে কোনো কিছু যুক্ত হয় না, সরাসরি একদম আসল রূপ বা Base Form (V1) বসে।"},
        {id: 574, bookNum: "128", type: "previous", raw: "It is high time we ________ (change) our food habits.", ans: "changed", bn: "এটাই উপযুক্ত সময় আমাদের খাদ্যভ্যাস পরিবর্তন করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ changed) হয়।"},
        {id: 575, bookNum: "129", type: "previous", raw: "What you ________ (do) last night?", ans: "did you do", bn: "গত রাতে তুমি কী করছিলে/করেছিলে?", ex: "বাক্যে 'last night' (গত রাত) থাকায় প্রশ্নবোধক বাক্যটি Past Indefinite স্ট্রাকচার (What + did + subject + V1) নিয়মে গঠিত হয়েছে।"},
        {id: 576, bookNum: "130", type: "previous", raw: "She proceeded as though I ________ (not speak).", ans: "had not spoken", bn: "সে এমনভাবে এগিয়ে চলল যেন আমি কোনো কথাই বলিনি।", ex: "নিয়ম: বাক্যে 'as though' এর আগের অংশ Past Indefinite (proceeded) হলে, পরের অংশটি সবসময় Past Perfect Tense (had + not + V3) দিয়ে মেলাতে হয়।"},
        {id: 577, bookNum: "131", type: "previous", raw: "It started to rain while we ________ (play) football.", ans: "were playing", bn: "যখন আমরা ফুটবল খেলছিলাম তখন বৃষ্টি শুরু হয়েছিল।", ex: "ম্যাজিক নিয়ম: 'While'-এর ঠিক পরপরই যদি সরাসরি কোনো Subject (we) থাকে, তবে সেই অংশটি সবসময় চলমান অতীত বা Past Continuous Tense (were playing) হয়।"},
        {id: 578, bookNum: "132", type: "previous", raw: "Karim together with Rahim ________ (to be) absent.", ans: "is", bn: "রহিমের সাথে করিমও অনুপস্থিত ছিল/আছে।", ex: "গুরুত্বপূর্ণ নিয়ম: বাক্যে 'together with', 'along with', 'as well as' দ্বারা দুটি সাবজেক্ট যুক্ত হলে, সবসময় প্রথম সাবজেক্ট (Karim - Singular) অনুযায়ী ভার্ব বসে। তাই 'is' বসেছে।"},
        {id: 579, bookNum: "133", type: "previous", raw: "Each of the girls ________ (be) very intelligent.", ans: "is", bn: "মেয়েদের প্রত্যেকেই খুব বুদ্ধিমান।", ex: "মনে রাখবেন: 'Each of'-এর পর অনেকগুলো মেয়ের কথা বলা হলেও আসল সাবজেক্ট কিন্তু সিঙ্গুলার বা একবচন। তাই সিঙ্গুলার ভার্ব হিসেবে 'is' বসেছে।"},
        {id: 580, bookNum: "134", type: "previous", raw: "He already ________ (finish) the work.", ans: "has already finished", bn: "সে ইতিমধ্যেই কাজটি শেষ করেছে।", ex: "সহজ নিয়ম: বাক্যে 'already' (ইতিমধ্যেই) শব্দটি থাকলে তা নির্দেশ করে কাজটি এইমাত্র শেষ হয়েছে, অর্থাৎ এটি Present Perfect Tense (have/has + V3) হবে।"},
        {id: 581, bookNum: "135", type: "previous", raw: "We could not help ________ (laugh) at his gesture.", ans: "laughing", bn: "আমরা তার অঙ্গভঙ্গি দেখে না হেসে পারলাম না।", ex: "সহজ নিয়ম: ইংরেজিতে 'could not help' অথবা 'cannot help' ফ্রেজটি থাকলে, এর ঠিক পরের অ্যাকশন ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 582, bookNum: "136", type: "previous", raw: "He ran away lest he ________ (arrest).", ans: "should be arrested", bn: "সে পালিয়ে গেল পাছে সে গ্রেপ্তার না হয়।", ex: "বাক্যে 'lest' থাকায় সাবজেক্টের পর 'should' বসবে। যেহেতু সে নিজে নিজেকে গ্রেপ্তার করবে না, পুলিশের দ্বারা হবে (Passive Voice), তাই 'should be + V3' (should be arrested) বসেছে।"},
        {id: 583, bookNum: "137", type: "previous", raw: "The presence of students ________ (be) not satisfactory.", ans: "is", bn: "শিক্ষার্থীদের উপস্থিতি সন্তোষজনক নয়।", ex: "এখানে শিক্ষার্থীরা (students) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The presence' (উপস্থিতি), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 584, bookNum: "138", type: "previous", raw: "Why the baby ________ (cry)?", ans: "is crying", bn: "শিশুটিকে কাঁদছে কেন?", ex: "একটি শিশু বর্তমানে অনবরত কাঁদছে এবং তার পেছনের কারণ জানতে চাওয়া হচ্ছে। তাই সাধারণ চলমান বর্তমান বা Present Continuous Tense (is crying) করা হয়েছে।"},
        {id: 585, bookNum: "139", type: "previous", raw: "Had you labored hard, you ________ (succeed)", ans: "would have succeeded", bn: "যদি তুমি কঠোর পরিশ্রম করতে, তবে তুমি সফল হতে পারতে।", ex: "বাক্যের শুরুতে 'Had + Subject + V3' থাকা মানে এটি Third Conditional (অতীতের অবাস্তব ইচ্ছা)। তাই অপর অংশে নিয়ম মেনে 'Subject + would have + V3' বসাতে হয়।"},
        {id: 586, bookNum: "140", type: "previous", raw: "America ________ (discover) in 1492.", ans: "was discovered", bn: "১৪৯২ সালে আমেরিকা আবিষ্কৃত হয়েছিল।", ex: "আমেরিকা মহাদেশ নিজে নিজেকে আবিষ্কার করেনি, কোলম্বাসের দ্বারা হয়েছিল (Passive Voice)। '1492' অতীত সাল নির্দেশ করায় এটি Past Indefinite-এর Passive Form 'was discovered' বসেছে।"},
        {id: 587, bookNum: "141", type: "previous", raw: "Md. Halim ________ (teach) us English.", ans: "মোঃ হালিম আমাদের ইংরেজি পড়ান।", ans: "teaches", ex: "এটি স্যারের একটি সাধারণ বা পেশাগত নিয়মিত কাজ। Present Indefinite Tense-এ Subject যদি Third Person Singular (Md. Halim) হয়, তবে ভার্বের শেষে s/es যুক্ত করতে হয়।"},
        {id: 588, bookNum: "142", type: "previous", raw: "The proposal ________ (consider) at this moment.", ans: "is being considered", bn: "প্রস্তাবটি এই মুহূর্তে বিবেচনা করা হচ্ছে।", ex: "প্রস্তাব নিজে নিজেকে বিবেচনা করতে পারে না (Passive Voice)। 'at this moment' থাকায় এটি Present Continuous এবং প্যাসিভ হওয়ার কারণে 'is being + V3' (is being considered) বসেছে।"},
        {id: 589, bookNum: "143", type: "previous", raw: "English ________ (teach) in all Secondary Schools in Bangladesh.", ans: "is taught", bn: "বাংলাদেশের সকল মাধ্যমিক বিদ্যালয়ে ইংরেজি পড়ানো হয়।", ex: "ইংরেজি ভাষা নিজে পড়াতে পারে না, শিক্ষকদের দ্বারা পড়ানো হয় (Passive Voice)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে সিঙ্গুলার নাউনের সাথে 'is + V3' (is taught) বসেছে।"},
        {id: 590, bookNum: "144", type: "previous", raw: "The house ________ (built) last year.", ans: "was built", bn: "বাড়িটি গত বছর তৈরি করা হয়েছিল।", ex: "বাড়ি নিজে নিজেকে তৈরি করতে পারে না (Passive)। বাক্যে অতীত নির্দেশক স্পষ্ট শব্দ 'last year' উল্লেখ থাকায় Past Indefinite Tense-এর Passive রূপ (was + V3 অর্থাৎ was built) বসেছে।"},
        {id: 591, bookNum: "145", type: "previous", raw: "At present she ________ (do) a special course in English.", ans: "is doing", bn: "বর্তমানে সে ইংরেজিতে একটি বিশেষ কোর্স করছে।", ex: "শর্টকাট নিয়ম: বাক্যে 'At present' (বর্তমানে) শব্দগুচ্ছ উল্লেখ থাকা মানে কাজটি বর্তমানে চলমান আছে। তাই এটি Present Continuous Tense (is doing) হয়েছে।"},
        {id: 592, bookNum: "146", type: "previous", raw: "Had I been a rich, I ________ (help) the poor.", ans: "would have helped", bn: "আমি যদি ধনী হতাম, তবে গরীবদের সাহায্য করতাম।", ex: "এটি Third Conditional বাক্য। বাক্যের শুরুতে 'Had + Subject + V3' থাকার কারণে, প্রিন্সিপাল ক্লজে Subject + would have + V3 বসেছে।"},
        {id: 593, bookNum: "147", type: "previous", raw: "It was long since I ________ (see) her last.", ans: "had seen", bn: "তার সাথে আমার শেষ দেখা হওয়ার পর অনেক দিন কেটে গিয়েছিল।", ex: "নিয়ম: 'Since'-এর প্রথমাংশ যদি Past Indefinite (was) হয়, তবে 'since'-এর পরের অংশটি সবসময় Past Perfect Tense (had + V3 অর্থাৎ had seen) হয়।"},
        {id: 594, bookNum: "148", type: "previous", raw: "They all came here after we ________ (leave).", ans: "had left", bn: "আমরা চলে যাওয়ার পর তারা সবাই এখানে এসেছিল।", ex: "শর্টকাট টেকনিক: 'After' (পরে) শব্দটির আগের অংশ যদি Past Indefinite (They all came) হয়, তবে 'after'-এর পরের অংশটি সবসময় Past Perfect Tense (had + left) দিয়ে মেলাতে হয়।"},
        {id: 595, bookNum: "149", type: "previous", raw: "I must confess to ________ (know) nothing about golf.", ans: "knowing", bn: "আমাকে স্বীকার করতেই হবে যে আমি গল্ফ সম্পর্কে কিছুই জানি না।", ex: "নিয়ম: সাধারণ 'to' এর পর V1 বসলেও, 'confess to', 'with a view to' ফ্রেজগুলোর পর ব্যাকরণগত নিয়ম অনুযায়ী ভার্বের সাথে সবসময় ing যুক্ত করতে হয়।"},
        {id: 596, bookNum: "150", type: "previous", raw: "I ________ (read) the book since Monday.", ans: "have been reading", bn: "আমি সোমবার থেকে বইটি পড়ছি।", ex: "সোমবার থেকে (since Monday) কাজটি অতীতে শুরু হয়ে এখনও বর্তমানে একটানা চলছে। সময়ের এই নির্দিষ্ট বিন্দুর ব্যাপ্তির কারণে এটি Present Continuous না হয়ে Present Perfect Continuous Tense হয়েছে।"},
        {id: 597, bookNum: "151", type: "previous", raw: "More than one man ________ (be) present.", ans: "was", bn: "একের বেশি মানুষ উপস্থিত ছিলেন।", ex: "গুরুত্বপূর্ণ নিয়ম: 'More than one' এর পর Noun এবং Verb দুটিই সবসময় Singular বা একবচন হয়। তাই অতীতকালের একক Be-verb হিসেবে 'was' বসেছে।"},
        {id: 598, bookNum: "152", type: "previous", raw: "English ________ (speak) all over the world", ans: "is spoken", bn: "সারা বিশ্বে ইংরেজি বলা হয়।", ex: "ইংরেজি ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয় (Passive Voice)। সাধারণ বর্তমানের এই প্যাসিভ গঠনে 'is + V3' (is spoken) বসেছে।"},
        {id: 599, bookNum: "153", type: "previous", raw: "It is high time we ________ (change) our eating habits.", ans: "changed", bn: "এটাই উপযুক্ত সময় আমাদের খাদ্যভ্যাস পরিবর্তন করার।", ex: "পরীক্ষার সবচেয়ে প্রিয় নিয়ম: বাক্যে 'It is high time' এর পর যদি কোনো Subject (we) থাকে, তবে পরবর্তী ভার্বটি চোখ বন্ধ করে Past Indefinite Form (V2 অর্থাৎ changed) হয়।"},
        {id: 600, bookNum: "154", type: "previous", raw: "Every flower and every fruit ________ (express) the beauty of nature.", ans: "প্রতিটি ফুল এবং প্রতিটি ফলই প্রকৃতির সৌন্দর্য প্রকাশ করে।", ans: "expresses", ex: "সহজ নিয়ম: 'and' দ্বারা যুক্ত হলেও যদি প্রতিটির আগে 'Every' বা 'Each' শব্দ দুটি থাকে, তবে পুরো সাবজেক্টটি সবসময় একবচন বা Singular হয়। তাই সাধারণ বর্তমানে ভার্বের সাথে s/es যুক্ত হয়ে 'expresses' হয়েছে।"},
        {id: 601, bookNum: "155", type: "previous", raw: "If I won a lottery, I ________ (travel) in the world.", ans: "would travel", bn: "যদি আমি লটারি জিততাম, তবে আমি বিশ্ব ভ্রমণ করতাম।", ex: "Second Conditional বাক্য। If ক্লজটি Past Indefinite (won) এ থাকায় এটি সেকেন্ড কন্ডিশনাল; তাই অপর ক্লজে Subject + would + V1 (travel) বসেছে।"},
        {id: 602, bookNum: "156", type: "previous", raw: "English ________ (speak) across the globe.", ans: "is spoken", bn: "বিশ্বজুড়ে ইংরেজি বলা হয়।", ex: "ইংরেজি ভাষা নিজে কথা বলে না, বিশ্বজুড়ে মানুষের দ্বারা বলা হয়। তাই অবজেক্ট প্রধান হওয়ায় বাক্যটি Present Indefinite Tense-এর Passive Voice (is + V3) হয়েছে।"},
        {id: 603, bookNum: "157", type: "previous", raw: "Would you mind ________ (to take) a cup of tea?", ans: "taking", bn: "আপনি কি দয়া করে এক কাপ চা খাবেন?", ex: "কাউকে ভদ্রভাবে বা বিনম্র অনুরোধ করতে যখন 'Would you mind' ব্যবহার করা হয়, তখন তার ঠিক পরের ভার্বটির সাথে ব্র্যাকেটের 'to' উঠে গিয়ে বাধ্যতামূলকভাবে ing যুক্ত হয়।"},
        {id: 604, bookNum: "158", type: "previous", raw: "She cannot help ________ (go) there.", ans: "সে সেখানে না গিয়ে পারে না।", ans: "going", ex: "সহজ নিয়ম: ইংরেজিতে 'cannot help' অথবা 'could not help' ফ্রেজটি থাকলে, এর ঠিক পরের অ্যাকশন ভার্বটির সাথে বাধ্যতামূলকভাবে ing যুক্ত করতে হয়।"},
        {id: 605, bookNum: "159", type: "previous", raw: "I got the letter ________ (write) by him.", ans: "written", bn: "আমি চিঠিটি তাকে দিয়ে লিখিয়ে নিলাম।", ex: "Causative Verb 'get/got' এর নিয়ম: গট (got)-এর পর যখন কোনো বস্তুবাচক অবজেক্ট (the letter) থাকে, তখন পরবর্তী ভার্বের সবসময় ৩য় রূপ বা Past Participle (V3 অর্থাৎ written) বসে।"},
        {id: 606, bookNum: "160", type: "previous", raw: "You should stop ________ (complain),", ans: "complaining", bn: "তোমার অভিযোগ করা বন্ধ করা উচিত।", ex: "এখানে 'should stop' অলরেডি একটি ভার্ব ব্লক হিসেবে বসে গেছে। একই সরল বাক্যে আরেকটি কাজের সমাপ্তি বা জেরান্ড অবস্থা বোঝাতে ২য় ভার্বের সাথে ing যুক্ত হয়ে 'complaining' হয়েছে।"},
        {id: 607, bookNum: "161", type: "previous", raw: "The letter ________ a week ago (post),", ans: "was posted", bn: "চিঠিটি এক সপ্তাহ আগে পোস্ট করা হয়েছিল।", ex: "চিঠি নিজে নিজে পোস্ট হতে পারে না (Passive Voice)। 'a week ago' অতীত নির্দেশ করায় এবং চিঠিটি সিঙ্গুলার হওয়ায় Past Indefinite-এর Passive Form 'was posted' বসেছে।"},
        {id: 608, bookNum: "162", type: "previous", raw: "The actors ________ (act) here before.", ans: "had acted", bn: "অভিনেতারা এর আগেও এখানে অভিনয় করেছিলেন।", ex: "অতীতে কোনো নির্দিষ্ট সময়ের পূর্বে একটি কাজ অলরেডি সম্পন্ন হয়ে গিয়েছিল বোঝাতে 'before' এর সাথে Past Perfect Tense (had + V3 অর্থাৎ had acted) বসেছে।"},
        {id: 609, bookNum: "163", type: "previous", raw: "The quality of the mangoes ________ (be) good.", ans: "is", bn: "আমগুলোর গুণগত মান ভালো।", ex: "এখানে আমগুলো (mangoes) সাবজেক্ট নয়, আসল সাবজেক্ট হলো 'The quality' (গুণগত মান), যা একটি সিঙ্গুলার বা একবচন ধারণা। তাই Be-verb হিসেবে সিঙ্গুলার 'is' বসেছে।"},
        {id: 610, bookNum: "164", type: "previous", raw: "I have not yet ________ (to choose) my career.", ans: "chosen", bn: "আমি এখনও আমার পেশা নির্বাচন করিনি।", ex: "বাক্যে সাহায্যকারী ভার্ব 'have' দেওয়া আছে। প্রেজেন্ট পারফেক্ট টেন্সের নিয়ম অনুযায়ী 'have/has' এর পর মূল ভার্বের সবসময় ৩য় রূপ বা Past Participle (choose -> chosen) বসে।"},
        {id: 611, bookNum: "165", type: "previous", raw: "Had I the wings of a bird, I ________ (fly) in the sky.", ans: "would fly", bn: "আমার যদি পাখির মতো ডানা থাকতো, তবে আমি আকাশে উড়ে বেড়াতাম।", ex: "বাক্যের শুরুতে 'Had + Subject + Noun' থাকা মানে এটি Second Conditional (কাল্পনিক বর্তমান)। তাই অপর অংশে নিয়ম মেনে 'Subject + would + V1 (fly)' বসাতে হয়।"},

        {id: 620, bookNum: "174", type: "previous", raw: "He advises me ________ (give up) smoking.", ans: "to give up", bn: "সে আমাকে ধূমপান ছেড়ে দেওয়ার পরামর্শ দেয়।", ex: "বাক্যে 'advises' একটি মূল অ্যাকশন ভার্ব। একই সরল বাক্যে কাউকে কোনো কাজ করার উদ্দেশ্য বা পরামর্শ দিতে পরবর্তী দ্বিতীয় ভার্বটির আগে 'to' বসিয়ে ইনফিনিটিভ (to give up) করতে হয়।"},
        {id: 621, bookNum: "175", type: "previous", raw: "We are used to ________ (eat) rice three times a day", ans: "eating", bn: "আমরা দিনে তিনবার ভাত খাওয়ায় অভ্যস্ত।", ex: "পার্থক্যটি মনে রাখুন: শুধু 'used to' এর পর V1 বসে, কিন্তু 'used to' এর আগে যদি কোনো Be-verb (am/is/are) থাকে, তবে তার অর্থ হয় অভ্যস্ততা এবং তখন বাধ্যতামূলকভাবে ভার্ব + ing বসে।"},
        {id: 622, bookNum: "176", type: "previous", raw: "Samin is my colleague. I ________ (know) him for ten years.", ans: "have known", bn: "সামিন আমার সহকর্মী। আমি তাকে দশ বছর ধরে চিনি।", ex: "খুব সূক্ষ্ম নিয়ম: ১০ বছর ধরে (for ten years) কাজটি চললেও 'know' (জানা/চেনা) একটি Stative Verb। ইংরেজিতে Stative Verb-এর কখনো Continuous রূপ হয় না, তাই এটি Present Perfect Tense (have known) হয়েছে।"},
        {id: 623, bookNum: "177", type: "previous", raw: "He as well as his parents ________ spending vacation abroad.", ans: "is", bn: "তার বাবা-মায়ের পাশাপাশি সেও বিদেশে ছুটি কাটাচ্ছে।", ex: "গুরুত্বপূর্ণ নিয়ম: বাক্যে 'as well as', 'along with' দ্বারা দুটি সাবজেক্ট যুক্ত হলে, সবসময় প্রথম সাবজেক্ট (He - Singular) অনুযায়ী ভার্ব বসে। তাই 'is' বসেছে।"},
        {id: 624, bookNum: "178", type: "previous", raw: "One of my sisters ________ nurse. (are)", ans: "is", bn: "আমার বোনদের মধ্যে একজন সেবিকা।", ex: "মনে রাখবেন: 'One of'-এর পর অনেক বোনের (my sisters) কথা বলা হলেও আসল সাবজেক্ট কিন্তু ওই একজন (One)। তাই সিঙ্গুলার ভার্ব হিসেবে 'is' বসেছে।"},
        {id: 625, bookNum: "179", type: "previous", raw: "The strike ________ (expect) to end soon.", ans: "is expected", bn: "ধর্মঘটটি শীঘ্রই শেষ হবে বলে আশা করা হচ্ছে।", ex: "ধর্মঘট নিজে নিজে আশা করতে পারে না, সাধারণ মানুষের দ্বারা আশা করা হচ্ছে (Passive Voice)। সাধারণ বর্তমানে সিঙ্গুলার নাউনের প্যাসিভ হিসেবে 'is expected' বসেছে।"},
        {id: 626, bookNum: "180", type: "previous", raw: "I ________ (to know) him for a long time.", ans: "have known", bn: "আমি তাকে দীর্ঘ দিন ধরে চিনি।", ex: "দীর্ঘ সময় ধরে (for a long time) চেনার কাজ চললেও 'know' একটি Stative Verb হওয়ায় এর Continuous রূপ হয় না। তাই নিয়ম মেনে এটি Present Perfect Tense (have known) হয়েছে।"}


        
    ];


    const borders = ['rgba(34, 211, 238, 0.25)', 'rgba(244, 63, 94, 0.25)', 'rgba(168, 85, 247, 0.3)'];
    
    let favoriteList = JSON.parse(localStorage.getItem('bilas_verbs_favs')) || [];
    let currentTabMode = 'all'; 
    let isRandomActive = false;

    const contentBox = document.getElementById('app-content');
    const headerNav = document.getElementById('dynamicHeader');
    const rocketBtn = document.getElementById('rocketScrollBtn');
    const tabsRow = document.getElementById('filterTabsRow');

    /* ================= SCROLL ENGINE (BAR HIDE & ROCKET TRIGGER) ================= */
    contentBox.addEventListener('scroll', () => {
        let scrollTop = contentBox.scrollTop;
        
        if(!isRandomActive) {
            if (scrollTop > 80) {
                headerNav.classList.add('header-hidden');
            } else {
                headerNav.classList.remove('header-hidden');
            }
        }
        
        if (scrollTop > 100) {
            rocketBtn.classList.add('visible');
        } else {
            rocketBtn.classList.remove('visible');
        }
    });

    function scrollToTop() {
        contentBox.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleCardRevealToggle(event, cardElement) {
        // Stop detail action if click is generated inside next arrow trigger box or stars
        if(event.target.closest('.card-next-trigger') || event.target.classList.contains('fav-star-btn')) return;
        cardElement.classList.toggle('open');
    }

    /* ================= LOCAL STORAGE FAVORITE SYSTEM MANAGEMENT ================= */
    function toggleFavoriteItem(id, event) {
        event.stopPropagation();
        if(favoriteList.includes(id)) {
            favoriteList = favoriteList.filter(favId => favId !== id);
        } else {
            favoriteList.push(id);
        }
        localStorage.setItem('bilas_verbs_favs', JSON.stringify(favoriteList));
        
        if(isRandomActive) {
            event.target.classList.toggle('is-fav');
        } else {
            renderPracticeHubUI();
        }
    }

    function switchFilterTab(mode) {
        currentTabMode = mode;
        document.getElementById('tabAll').classList.toggle('active', mode === 'all');
        document.getElementById('tabFav').classList.toggle('active', mode === 'fav');
        isRandomActive = false;
        renderPracticeHubUI();
    }

    function triggerSearch() {
        isRandomActive = false;
        renderPracticeHubUI();
    }

    function exitRandomAndGoHome() {
        isRandomActive = false;
        tabsRow.style.display = 'flex'; 
        headerNav.classList.remove('header-hidden');
        renderPracticeHubUI();
    }

    /* ================= 🎲 ADVANCED RANDOM SYSTEM WITH INLINE NEXT ARROW ================= */
    function rollRandomChallengeCard() {
        isRandomActive = true;
        document.getElementById('searchInput').value = '';
        tabsRow.style.display = 'none'; 
        
        const randomItem = verbData[Math.floor(Math.random() * verbData.length)];
        const borderGlow = borders[randomItem.id % borders.length];
        const coreSentenceLayout = randomItem.raw.replace(/________/g, `<span class="ans-placeholder">${randomItem.ans}</span>`);
        const isFav = favoriteList.includes(randomItem.id);

        contentBox.innerHTML = `
            <div class="random-wrapper">
                <div class="random-navigation-row">
                    <button class="btn-home" onclick="exitRandomAndGoHome()">🏠 Home</button>
                </div>
                
                <div class="random-box-holder">
                    <!-- Inline customized Right arrow next trigger placed inside here -->
                    <div class="card has-inline-next" style="border-color: ${borderGlow}; box-shadow: 0 10px 30px ${borderGlow};" onclick="handleCardRevealToggle(event, this)">
                        
                        <div class="card-next-trigger" onclick="rollRandomChallengeCard(); event.stopPropagation();" title="Next Question">
                            <span class="arrow-icon">⏭️</span>
                            <span class="arrow-text">Next</span>
                        </div>

                        <div class="card-header-area">
                            <div>
                                <span class="book-num-tag">${randomItem.bookNum}</span>
                                <div class="sentence-text">${coreSentenceLayout}</div>
                            </div>
                            <button class="fav-star-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavoriteItem(${randomItem.id}, event)">★</button>
                        </div>
                        <p style="color: var(--text-muted); font-size:0.85rem; margin-top:20px; text-align:center;">টাচ করে উত্তর ও ব্যাখ্যা দেখুন</p>
                        
                        <div class="hidden-details">
                            <div class="meta-label">বাংলা অর্থ:</div>
                            <div class="meaning-text">${randomItem.bn}</div>
                            <div class="meta-label">কারণ ও ব্যাকরণগত ব্যাখ্যা:</div>
                            <div class="ex-text">${randomItem.ex}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        contentBox.scrollTo({ top: 0 });
    }

    /* ================= MASTER INTERFACE CORE VIEW RENDERING ================= */
    function renderPracticeHubUI() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        let targetedList = verbData;
        if(currentTabMode === 'fav') {
            targetedList = verbData.filter(item => favoriteList.includes(item.id));
        }

        let filteredList = targetedList.filter(item => 
            item.raw.toLowerCase().includes(query) || 
            item.bn.includes(query) || 
            item.bookNum.includes(query)
        );

        let outputHTML = '';
        let globalCounter = 0; 
        let shownPreviousHeader = false; 

        filteredList.forEach((item) => {
            const coreSentenceLayout = item.raw.replace(/________/g, `<span class="ans-placeholder">${item.ans}</span>`);
            const borderGlow = borders[item.id % borders.length]; 
            const isFav = favoriteList.includes(item.id);

            if (item.type === "previous" && !shownPreviousHeader && currentTabMode !== 'fav') {
                outputHTML += `
                    <div class="section-divider">
                        <span>--- Previous Questions ---</span>
                    </div>
                `;
                shownPreviousHeader = true;
            }

            globalCounter++; 

            outputHTML += `
                <div class="card" style="border-color: ${borderGlow};" onclick="handleCardRevealToggle(event, this)">
                    <div class="card-header-area">
                        <div>
                            <span class="num-prefix">${globalCounter}.</span>
                            <span class="book-num-tag">${item.bookNum}</span>
                            <div class="sentence-text">${coreSentenceLayout}</div>
                        </div>
                        <button class="fav-star-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavoriteItem(${item.id}, event)">★</button>
                    </div>
                    <p style="color: #475569; font-size:0.85rem; margin-top:12px;"></p>
                    
                    <div class="hidden-details">
                        <div class="meta-label">বাংলা অর্থ:</div>
                        <div class="meaning-text">${item.bn}</div>
                        <div class="meta-label">কারণ ও ব্যাকরণগত ব্যাখ্যা:</div>
                        <div class="ex-text">${item.ex}</div>
                    </div>
                </div>
            `;
        });

        contentBox.innerHTML = outputHTML || `<div class="no-result">${currentTabMode === 'fav' ? 'আপনার প্রিয় তালিকায় কোনো বাক্য যুক্ত করেননি ভাই! 📁' : 'কোনো বাক্য খুঁজে পাওয়া যায়নি ভাই! 😞'}</div>`;
    }

    renderPracticeHubUI();
</script>

</html>
