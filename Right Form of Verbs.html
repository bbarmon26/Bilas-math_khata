<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Right Form of Verbs | Bilas Academy Premium Practice</title>
    <!-- Noto Sans Bengali and Poppins Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16; 
            --panel-bg: #131924;
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #22d3ee;
            --accent-pink: #f43f5e;
            --accent-yellow: #facc15;
            --accent-purple: #a855f7;
            --accent-green: #3fb950;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; position: relative;
        }

        body::before {
            content: ''; position: absolute; top: -10%; left: -20%; width: 250px; height: 250px;
            background: rgba(34, 211, 238, 0.05); filter: blur(80px); border-radius: 50%; pointer-events: none;
        }

        .app-layout {
            width: 100%; max-width: 600px; height: 100vh;
            position: relative; display: flex; flex-direction: column; z-index: 10;
        }

        /* Fixed Premium Glass Header */
        .dynamic-header {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 16px 20px; border-bottom: 1px solid var(--glass-border);
            z-index: 200; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-hidden { transform: translateX(-50%) translateY(-100%); }

        .main-app-title {
            text-align: center; font-size: 1.6rem; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .search-control-row { display: flex; gap: 10px; width: 100%; align-items: center; }

        .search-box { position: relative; flex: 1; }
        .search-box input {
            width: 100%; padding: 13px 15px 13px 44px; border-radius: 16px;
            border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.4);
            color: white; outline: none; font-size: 0.95rem;
        }
        .search-box .search-icon-text { position: absolute; left: 18px; top: 12px; color: #475569; }

        .btn-roll-dice {
            background: linear-gradient(135deg, #a855f7, #6d28d9); color: white;
            padding: 13px 20px; border-radius: 16px; font-weight: 700; border: none;
            font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        /* View Mode Filter Row (All vs Favorites) */
        .filter-tabs { display: flex; gap: 8px; margin-top: 2px; }
        .tab-btn {
            background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 6px 14px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active {
            background: rgba(34, 211, 238, 0.15); color: var(--accent-cyan);
            border-color: rgba(34, 211, 238, 0.3);
        }

        /* Scroll Area Container */
        .list-container {
            flex: 1; overflow-y: auto; padding: 195px 18px 40px 18px;
            display: flex; flex-direction: column; gap: 14px; height: 100%;
        }

        /* --- Section Divider Style --- */
        .section-divider {
            text-align: center; margin: 25px 0 10px 0; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .section-divider::before {
            content: ''; position: absolute; left: 0; right: 0; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-purple), transparent);
            z-index: 1;
        }
        .section-divider span {
            background: #090d16; padding: 4px 18px; font-size: 1rem; font-weight: 800;
            color: var(--accent-pink); border-radius: 30px; border: 1px solid rgba(244, 63, 94, 0.3);
            z-index: 2; letter-spacing: 1px; box-shadow: 0 0 15px rgba(244, 63, 94, 0.15);
        }

        /* Question Card Base */
        .card {
            background: var(--panel-bg); border-radius: 24px; padding: 22px; position: relative;
            border: 1px solid var(--glass-border); box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer; transition: 0.2s;
        }
        .card-header-area { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-right: 25px; }

        /* Premium Floating Star/Favorite Button */
        .fav-star-btn {
            background: none; border: none; color: #334155; font-size: 1.5rem;
            cursor: pointer; transition: transform 0.2s, color 0.2s; padding: 2px;
        }
        .fav-star-btn.is-fav { color: var(--accent-yellow); filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.5)); }
        .fav-star-btn:active { transform: scale(0.85); }

        /* ➡️ New Integrated Arrow Next Button Component inside Card Wrapper */
        .card-next-trigger {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 8px 6px; border-radius: 12px; cursor: pointer; transition: all 0.2s; z-index: 100;
        }
        .card-next-trigger:hover { background: rgba(168, 85, 247, 0.2); border-color: var(--accent-purple); }
        .card-next-trigger .arrow-icon { font-size: 1.3rem; color: var(--accent-cyan); animation: bounceRight 1s infinite alternate; }
        .card-next-trigger .arrow-text { font-size: 0.65rem; font-weight: 700; color: #cbd5e1; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-next-trigger:active { transform: translateY(-50%) scale(0.9); }

        /* Smooth padding reduction for text area so button doesn't overlap text fields */
        .card.has-inline-next { padding-right: 65px; }

        .num-prefix { color: var(--accent-cyan); font-weight: 800; margin-right: 6px; font-size: 1.3rem; }
        .book-num-tag {
            font-size: 0.85rem; color: var(--accent-yellow); font-weight: 700; margin-right: 10px;
            background: rgba(250, 204, 21, 0.08); padding: 3px 8px; border-radius: 8px;
            border: 1px solid rgba(250, 204, 21, 0.15); display: inline-block; vertical-align: middle;
        }

        .sentence-text { font-size: 1.3rem; font-weight: 600; line-height: 1.6; color: #f8fafc; display: inline; }

        /* Practice Blanks System */
        .ans-placeholder {
            color: transparent; border-bottom: 2px dashed #475569; padding: 0 14px; margin: 0 5px;
            font-weight: 700; transition: 0.2s;
        }
        .card.open .ans-placeholder { color: var(--accent-pink); border-bottom-color: transparent; text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }

        /* Hidden Details Animation Block */
        .hidden-details { display: none; margin-top: 18px; border-top: 1px dashed var(--glass-border); padding-top: 16px; animation: slideUp 0.3s ease; }
        .card.open .hidden-details { display: block; }

        .meta-label { font-size: 0.85rem; color: var(--accent-cyan); font-weight: 800; margin-bottom: 6px; }
        .meaning-text { font-size: 1.1rem; color: var(--accent-green); font-weight: 600; margin-bottom: 14px; }
        .ex-text { font-size: 1.05rem; color: #cbd5e1; padding-left: 14px; border-left: 4px solid var(--accent-purple); line-height: 1.6; }

        /* Floating 🚀 Rocket Scroll-to-Top Button */
        .rocket-btn {
            position: fixed; bottom: 25px; right: 20px;
            background: linear-gradient(135deg, #f43f5e, #a855f7); color: white;
            width: 52px; height: 52px; border-radius: 50%; font-size: 1.5rem;
            cursor: pointer; border: none; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4); z-index: 999;
            opacity: 0; transform: translateY(20px); pointer-events: none; transition: 0.3s;
        }
        .rocket-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /* Random Control Interface Layout setup */
        .random-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 15px; }
        .random-navigation-row { display: flex; gap: 12px; margin-bottom: 20px; width: 100%; justify-content: flex-start; }
        .btn-home {
            background: rgba(255,255,255,0.08); color: white; padding: 11px 22px; border-radius: 14px;
            font-weight: 700; border: 1px solid var(--glass-border); cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .random-box-holder { width: 100%; position: relative; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceRight { from { transform: translateX(0); } to { transform: translateX(3px); } }
        .no-result { text-align: center; color: #475569; padding: 60px 20px; font-size: 1rem; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-layout">
    
    <!-- Top Action Glass Header Control Center Layout Bar -->
    <header class="dynamic-header" id="dynamicHeader">
        <div class="main-app-title">Right Form of Verbs</div>

        <div class="search-control-row">
            <div class="search-box">
                <span class="search-icon-text">🔍</span>
                <input type="text" id="searchInput" oninput="triggerSearch()" placeholder="বাক্যের শব্দ বা বইয়ের নম্বর লিখুন...">
            </div>
            <button class="btn-roll-dice" onclick="rollRandomChallengeCard()">🎲 Random</button>
        </div>

        <!-- Filter Sub Row Tabs -->
        <div class="filter-tabs" id="filterTabsRow">
            <button class="tab-btn active" id="tabAll" onclick="switchFilterTab('all')">সব বাক্য</button>
            <button class="tab-btn" id="tabFav" onclick="switchFilterTab('fav')">⭐ প্রিয় তালিকা</button>
        </div>
    </header>

    <!-- Master Scrollable Target Content Panel -->
    <div class="list-container" id="app-content"></div>

    <!-- 🚀 Premium Floating Rocket Button Component -->
    <button class="rocket-btn" id="rocketScrollBtn" onclick="scrollToTop()">🚀</button>
    
</div>

<script>
        // =======================================================
    // Right Form of Verbs - Full 100 Questions Database (01.a to 20.e)
    // =======================================================
    const verbData = [
        {id: 1, bookNum: "01.a", type: "normal", raw: "It was ________ (rain) yesterday.", ans: "raining", bn: "গতকাল বৃষ্টি হচ্ছিল।", ex: "Yesterday (অতীত নির্দেশক শব্দ) এবং 'was' থাকার কারণে বাক্যটি Past Continuous Tense হয়েছে।"},
        {id: 2, bookNum: "01.b", type: "normal", raw: "When asked he ________ (deny) the allegations.", ans: "denied", bn: "জিজ্ঞেস করা হলে তিনি অভিযোগগুলো অস্বীকার করেন।", ex: "অতীতের একটি ঘটনার প্রেক্ষিতে আরেকটি ঘটনা ঘটায় বাক্যটি Simple Past Tense (V2) হয়েছে।"},
        {id: 3, bookNum: "01.c", type: "normal", raw: "The patient ________ (die) before the doctor arrived.", ans: "had died", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "অতীতের দুটি কাজের মধ্যে 'before'-এর আগের অংশ Past Perfect Tense (had + V3) হয়।"},
        {id: 4, bookNum: "01.d", type: "normal", raw: "The child was ________ (strike) by a car.", ans: "struck", bn: "শিশুটিকে একটি গাড়ি ধাক্কা দিয়েছিল।", ex: "বাক্যটি Passive Voice-এ আছে। 'was'-এর পর মূল ভার্বের Past Participle Form (strike -> struck) বসেছে।"},
        {id: 5, bookNum: "02.a", type: "normal", raw: "Don't go after him. He ________ (prepare) his lesson.", ans: "is preparing", bn: "তার পেছনে যেও না। সে তার পড়া তৈরি করছে।", ex: "বর্তমানে কোনো কাজ চলছে বোঝাচ্ছে (তাকে ডেকো না, সে পড়ছে), তাই Present Continuous Tense হয়েছে।"},
        {id: 6, bookNum: "02.b", type: "normal", raw: "I am not a friend of Dulal. But he ________ (live) by me.", ans: "lives", bn: "আমি দুলালের বন্ধু নই। তবে সে আমার পাশেই থাকে।", ex: "সাধারণ বর্তমান ঘটনা বা সত্য। Subject 'he' (3rd Person Singular) হওয়ায় ভার্বের সাথে s যুক্ত হয়েছে।"},
        {id: 7, bookNum: "02.c", type: "normal", raw: "Keep silent. He ________ (sleep).", ans: "is sleeping", bn: "নীরব থাকো। সে ঘুমাচ্ছে।", ex: "কাউকে নীরব থাকতে বলা হচ্ছে কারণ বর্তমানে একটি কাজ চলছে, তাই Present Continuous Tense হয়েছে।"},
        {id: 8, bookNum: "02.d", type: "normal", raw: "There should be no distinction between men. We all ________ (be) equal.", ans: "are", bn: "মানুষের মধ্যে কোনো ভেদাভেদ থাকা উচিত নয়। আমরা সবাই সমান।", ex: "সাধারণ সত্য বাক্য। Subject 'We all' প্লুরাল হওয়ায় be verb হিসেবে 'are' বসেছে।"},
        {id: 9, bookNum: "02.e", type: "normal", raw: "This is not my fault. You ________ (realize) one day.", ans: "will realize", bn: "এটি আমার দোষ না। তুমি একদিন বুঝতে পারবে।", ex: "ভবিষ্যতের কোনো সম্ভাবনা বা ঘটনা বোঝাচ্ছে, তাই Future Indefinite Tense (will + V1) হয়েছে।"},
        {id: 10, bookNum: "03.a", type: "normal", raw: "The agenda ________ (be) carefully set.", ans: "is", bn: "আলোচ্যসূচিটি যত্ন সহকারে নির্ধারণ করা হয়েছে।", ex: "'Agenda' শব্দটি দেখতে প্লুরাল হলেও এটি মূলত একটি সমষ্টিগত একক ধারণা (Singular Collective Noun) হিসেবে ব্যবহৃত হওয়ায় Singular Verb 'is' বসেছে।"},
        {id: 11, bookNum: "03.b", type: "normal", raw: "He just ________ (get) the letter.", ans: "has got", bn: "সে এইমাত্র চিঠিটি পেয়েছে।", ex: "বাক্যে 'just', 'just now', 'already' থাকলে বাক্যটি Present Perfect Tense (subject + have/has + V3) নিয়মে গঠিত হয়।"},
        {id: 12, bookNum: "03.c", type: "normal", raw: "The color of the mangoes ________ (look) beautiful.", ans: "looks", bn: "আমগুলোর রঙ দেখতে সুন্দর লাগে।", ex: "এখানে আসল Subject হলো 'The color' (রঙ), যা Singular Noun। Subject Third Person Singular হওয়ায় ভার্বের সাথে s যুক্ত হয়ে 'looks' হয়েছে।"},
        {id: 13, bookNum: "03.d", type: "normal", raw: "It is high time he ________ (leave) the place.", ans: "left", bn: "এটাই উপযুক্ত সময় তার স্থানটি ত্যাগ করার।", ex: "নিয়ম: বাক্যে 'It is time' বা 'It is high time' এর পর সাবজেক্ট থাকলে পরবর্তী ভার্বটি সর্বদা Past Indefinite Form (V2) হয়।"},
        {id: 14, bookNum: "03.e", type: "normal", raw: "When we went to the cinema it already ________ (start).", ans: "had started", bn: "আমরা যখন সিনেমা হলে গেলাম, তখন সেটি ইতিমধ্যেই শুরু হয়ে গিয়েছিল।", ex: "অতীতের দুটি ঘটনার মধ্যে যে কাজটি আগে ঘটেছিল সেটি Past Perfect (had + V3) হয়। সিনেমাটি আগে শুরু হয়েছিল, তাই 'had started'।"},
        {id: 15, bookNum: "04.a", type: "normal", raw: "He is accustomed to ________ (swim) in the river.", ans: "swimming", bn: "সে নদীতে সাঁতার কাটতে অভ্যস্ত।", ex: "সাধারণত To-এর পর V1 বসে, কিন্তু 'accustomed to', 'with a view to', 'look forward to' ইত্যাদির পর ভার্বের সাথে সর্বদা ing যুক্ত হয়।"},
        {id: 16, bookNum: "04.b", type: "normal", raw: "He ________ (reach) the station before the train leave.", ans: "had reached", bn: "ট্রেনটি ছেড়ে যাওয়ার পূর্বেই সে স্টেশনে পৌঁছেছিল।", ex: "'Before' যুক্ত অতীত বাক্যের প্রথমাংশ Past Perfect (had + V3) এবং পরের অংশ Past Indefinite Tense (V2) হয়।"},
        {id: 17, bookNum: "04.c", type: "normal", raw: "It ________ (rain) since 9 a.m. today.", ans: "has been raining", bn: "আজ সকাল ৯টা থেকে বৃষ্টি হচ্ছে।", ex: "অতীতের কোনো নির্দিষ্ট সময় থেকে শুরু হয়ে বর্তমানেও কাজ চলছে বোঝালে তা Present Perfect Continuous Tense (has been + verb+ing) হয়।"},
        {id: 18, bookNum: "04.d", type: "normal", raw: "He would ________ (do) all his works in time.", ans: "do", bn: "সে সময়মতো তার সব কাজ সম্পন্ন করতো।", ex: "Modal Auxiliary Verb (যেমন: would, could, should, must, may) এর পর প্রধান ভার্বের সবসময় Base Form (V1) বসে।"},
        {id: 19, bookNum: "05.a", type: "normal", raw: "Neither of the two pens ________ (write) well.", ans: "writes", bn: "কলম দুটির একটিও ভালো লেখে না।", ex: "Each, Every, Either, Neither যুক্ত বাক্যের সাবজেক্ট সর্বদা Singular হিসেবে গণ্য হয়। তাই ভার্বের সাথে s যুক্ত হয়ে 'writes' হয়েছে।"},
        {id: 20, bookNum: "05.b", type: "normal", raw: "Gymnastics ________ (to be verb) my favorite sports.", ans: "is", bn: "জিমন্যাস্টিকস আমার প্রিয় খেলা।", ex: "কিছু বিষয়ের নাম দেখতে প্লুরাল মনে হলেও (যেমন: Gymnastics, Physics, Economics, News) এগুলো মূলত Singular Noun, তাই এরপর 'is' বসেছে।"},
        {id: 21, bookNum: "05.c", type: "normal", raw: "Having gone to market, I ________ (buy) a pen.", ans: "bought", bn: "বাজারে গিয়ে আমি একটি কলম কিনলাম।", ex: "Having + V3 দিয়ে বাক্য শুরু হলে (Perfect Participle), পরবর্তী প্রধান ক্লজটি সাধারণত Past Indefinite Tense (Subject + V2 অর্থাৎ bought) হয়।"},
        {id: 22, bookNum: "05.d", type: "normal", raw: "It is the proper time we ________ (start) the work.", ans: "started", bn: "এটাই উপযুক্ত সময় আমাদের কাজটি শুরু করার।", ex: "নিয়ম: 'It is proper time' বা 'It is time' এর পর Subject থাকলে পরবর্তী ভার্বটি Past Indefinite Form (V2) হয়।"},
        {id: 23, bookNum: "05.e", type: "normal", raw: "I prefer riding ________ (to swim).", ans: "to swimming", bn: "আমি ঘোড়সওয়ারির চেয়ে সাঁতার কাটা বেশি পছন্দ করি।", ex: "'Prefer' এর পর দুটি কাজের তুলনায় 'Prefer + Noun/Gerund + to + Noun/Gerund' স্ট্রাকচার বসে। আগে riding থাকায় পরে to swimming হয়েছে।"},
        {id: 24, bookNum: "06.a", type: "normal", raw: "A good boy ________ (prepare) his lessons regularly.", ans: "prepares", bn: "একটি ভালো ছেলে নিয়মিত তার পড়া প্রস্তুত করে।", ex: "বাক্যে 'regularly', 'always', 'daily' থাকলে তা Present Indefinite Tense হয়। Subject Singular হওয়ায় ভার্বের সাথে s যুক্ত হয়েছে।"},
        {id: 25, bookNum: "06.b", type: "normal", raw: "He ________ (come) home yesterday.", ans: "came", bn: "সে গতকাল বাড়ি এসেছিল।", ex: "বাক্যে অতীত নির্দেশক শব্দ 'yesterday', 'ago', 'last night' থাকলে বাক্যটি সর্বদা Past Indefinite Tense (V2) হয়।"},
        {id: 26, bookNum: "06.c", type: "normal", raw: "She ________ (sing) a song now.", ans: "is singing", bn: "সে এখন একটি গান গাইছে।", ex: "নিয়ম: বাক্যে 'now' বা 'at this moment' শব্দ থাকলে কাজটি বর্তমানে চলমান বোঝায়, তাই এটি Present Continuous Tense (is + verb+ing) হয়েছে।"},
        {id: 27, bookNum: "06.d", type: "normal", raw: "He ________ (leave) home last night.", ans: "left", bn: "সে গত রাতে বাড়ি থেকে চলে গেছে।", ex: "বাক্যে 'last night' (অতীত নির্দেশক) থাকার কারণে এটি Past Indefinite Tense (V2) হয়েছে।"},
        {id: 28, bookNum: "06.e", type: "normal", raw: "She has ________ (do) the work.", ans: "done", bn: "সে কাজটি করেছে।", ex: "Present Perfect Tense-এ 'have/has' এর পর মূল ভার্বের Past Participle Form (V3) বসে। do -> done।"},
        {id: 29, bookNum: "07.a", type: "normal", raw: "Why ________ yesterday?", ans: "did he come", bn: "সে গতকাল কেন বাড়ি এসেছিল?", ex: "Wh-question এবং 'yesterday' থাকার কারণে ইন্টারোগেটিভ সেন্টেন্সে Past Indefinite স্ট্রাকচার (Why + did + subject + V1) বসেছে।"},
        {id: 30, bookNum: "07.b", type: "normal", raw: "The patient ________ (died) before the doctor came.", ans: "had died", bn: "ডাক্তার আসার পূর্বেই রোগী মারা গিয়েছিল।", ex: "'Before' যুক্ত অতীত বাক্যের প্রথমাংশ Past Perfect (had + V3) এবং পরের অংশ Past Indefinite Tense (V2) হয়।"},
        {id: 31, bookNum: "07.c", type: "normal", raw: "It is high time he ________ (change) his bad habit.", ans: "changed", bn: "এটাই উপযুক্ত সময় তার খারাপ অভ্যাস পরিবর্তন করার।", ex: "'It is high time' এর পর সাবজেক্ট থাকলে পরবর্তী ভার্বটি সর্বদা Past Indefinite Form (V2) হয়।"},
        {id: 32, bookNum: "07.d", type: "normal", raw: "Had I possessed vast property, I ________ (establish) a college.", ans: "would have established", bn: "আমার যদি বিশাল সম্পত্তি থাকতো, তবে আমি একটি কলেজ প্রতিষ্ঠা করতাম।", ex: "Had + Subject + V3 দিয়ে বাক্য শুরু হলে এটি Third Conditional প্রকাশ করে। তাই অপর অংশে Subject + would have + V3 বসে।"},
        {id: 33, bookNum: "07.e", type: "normal", raw: "He may ________ (come) tomorrow.", ans: "come", bn: "সে আগামীকাল আসতে পারে।", ex: "Modal Auxiliary Verb (may, can, must ইত্যাদি) এর পর মূল ভার্বের সবসময় Base Form (V1) বসে।"},
        {id: 34, bookNum: "08.a", type: "normal", raw: "Each of the girls ________ (be) present in the class yesterday.", ans: "was", bn: "মেয়েদের প্রত্যেকেই গতকাল ক্লাসে উপস্থিত ছিল।", ex: "'Each of' এর পর Noun প্লুরাল হলেও ভার্ব Singular হয়। তাছাড়া 'yesterday' থাকায় Past Tense-এর 'was' বসেছে।"},
        {id: 35, bookNum: "08.b", type: "normal", raw: "You, he and I ________ (be) friends.", ans: "are", bn: "তুমি, সে এবং আমি বন্ধু।", ex: "একাধিক ভিন্ন Person 'and' দ্বারা যুক্ত হয়ে যৌথ Subject তৈরি করলে তা Plural Subject হিসেবে গণ্য হয়, তাই 'are' বসেছে।"},
        {id: 36, bookNum: "08.c", type: "normal", raw: "One fourth of the work ________ (to finish).", ans: "has been finished", bn: "কাজের এক-চতুর্থাংশ শেষ হয়েছে।", ex: "ভগ্নাংশের ক্ষেত্রে Noun যদি Uncountable বা একক কাজ বোঝায়, তবে ভার্ব Singular হয়। কাজটি নিজে নিজে শেষ হয় না বিধায় এটি Passive Voice হয়েছে।"},
        {id: 37, bookNum: "08.d", type: "normal", raw: "I already ________ (forget) his name.", ans: "have already forgotten", bn: "আমি ইতিমধ্যেই তার নাম ভুলে গিয়েছি।", ex: "বাক্যে 'already' থাকলে তা সাধারণত Present Perfect Tense (have/has + V3) নির্দেশ করে।"},
        {id: 38, bookNum: "08.e", type: "normal", raw: "After ________ (eat) rice, I shall go to market.", ans: "eating", bn: "ভাত খাওয়ার পর, আমি বাজারে যাবো।", ex: "Preposition (যেমন: after, before, by, without) এর পর কোনো ভার্ব আসলে তার সাথে সর্বদা ing যুক্ত করতে হয়।"},
        {id: 39, bookNum: "09.a", type: "normal", raw: "Government is ________ (import) Sugar from Brazil.", ans: "importing", bn: "সরকার ব্রাজিল থেকে চিনি আমদানি করছে।", ex: "Be verb (am/is/are) এর পর Active Voice-এ চলমান কাজ বোঝাতে ভার্বের সাথে ing যুক্ত হয়ে Present Continuous Tense হয়।"},
        {id: 40, bookNum: "09.b", type: "normal", raw: "They must ________ (follow) the rules of behavior.", ans: "follow", bn: "তাদের অবশ্যই আচরণের নিয়মগুলো মেনে চলতে হবে।", ex: "Modal Auxiliary Verb 'must' এর পর প্রধান ভার্বের সবসময় Base Form (V1) বসে।"},
        {id: 41, bookNum: "09.c", type: "normal", raw: "The boys ________ (send) to school yesterday.", ans: "sent", ans_alternative: "were sent", raw_fix: "The boys ________ (send) to school yesterday.", ans: "sent", bn: "বালকগুলোকে গতকাল স্কুলে পাঠানো হয়েছিল।", ex: "বাক্যটি প্যাসিভ ভাব প্রকাশ করছে। 'yesterday' থাকার কারণে এটি Past Indefinite Form (V2 / were sent) প্রকাশ করে।"},
        {id: 42, bookNum: "09.d", type: "normal", raw: "This problem must ________ (solve) immediately.", ans: "be solved", bn: "এই সমস্যাটি অবিলম্বে সমাধান করা আবশ্যক।", ex: "Modal Verb-এর Passive Voice করার সময় 'Modal + be + V3' স্ট্রাকচার বসে। তাই 'must be solved' হয়েছে।"},
        {id: 43, bookNum: "09.e", type: "normal", raw: "I wish ________ (fill) my demand.", ans: "could fill", bn: "আমি যদি আমার চাহিদা পূরণ করতে পারতাম।", ex: "বাক্যে 'I wish' থাকলে অসম্ভব বা অপূর্ণ ইচ্ছা প্রকাশ করতে পরবর্তী ক্লজে 'could + V1' বা Past Tense বসে।"},
        {id: 44, bookNum: "10.a", type: "normal", raw: "You ever ________ (visit) Sylhet?", ans: "Have you ever visited", bn: "তুমি কি কখনো সিলেট গিয়েছ?", ex: "বাক্যে 'ever' থাকলে ইন্টারোগেটিভ সেন্টেন্সে Present Perfect Tense (Have/Has + Subject + ever + V3) স্ট্রাকচার বসে।"},
        {id: 45, bookNum: "10.b", type: "normal", raw: "I wish I ________ (to be) a king.", ans: "were", bn: "আমি যদি একজন রাজা হতাম!", ex: "'I wish' বা 'If' যুক্ত কাল্পনিক বা অবাস্তব ইচ্ছা প্রকাশ করতে To-be verb হিসেবে সবসময় 'were' বসে।"},
        {id: 46, bookNum: "10.c", type: "normal", raw: "If I had money, I ________ (open) a hospital.", ans: "would open", bn: "আমার যদি টাকা থাকতো, তবে আমি একটি হাসপাতাল খুলতাম।", ex: "If ক্লজটি Past Indefinite Tense (Had) এ থাকলে এটি Second Conditional হয়। তাই অপর ক্লজে Subject + would + V1 বসে।"},
        {id: 47, bookNum: "10.d", type: "normal", raw: "I got the letter ________ (type)", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিলাম।", ex: "Causative Verb হিসেবে 'get/got' এর পর যখন Object-টি বস্তুবাচক (the letter) হয়, তখন পরবর্তী ভার্বের Past Participle (V3) বসে।"},
        {id: 48, bookNum: "10.e", type: "normal", raw: "I ________ (read) for two hours.", ans: "have been reading", bn: "আমি দুই ঘন্টা ধরে পড়ছি।", ex: "নির্দিষ্ট সময় ধরে (for two hours) কোনো কাজ অতীতে শুরু হয়ে বর্তমানেও চলছে বোঝালে Present Perfect Continuous Tense হয়।"},
        {id: 49, bookNum: "11.a", type: "normal", raw: "Neither he nor his friends ________ (attend) the function.", ans: "have attended", bn: "সে অথবা তার বন্ধুরা কেউই অনুষ্ঠানে যোগ দেয়নি।", ex: "'Neither... nor' বা 'Either... or' দ্বারা যুক্ত সাবজেক্টের ক্ষেত্রে 'nor/or'-এর পরের সাবজেক্ট (his friends-Plural) অনুযায়ী ভার্ব নির্ধারিত হয়।"},
        {id: 50, bookNum: "11.b", type: "normal", raw: "I had my rice ________ (cook)", ans: "cooked", bn: "আমি আমার ভাত রান্না করিয়ে নিয়েছিলাম।", ex: "Causative Verb 'have/had' এর পর বস্তুবাচক Object (my rice) থাকলে পরবর্তী প্রধান ভার্বের সর্বদা Past Participle Form (V3) বসে।"},
        {id: 51, bookNum: "11.c", type: "normal", raw: "I saw him ________ (read).", ans: "reading", bn: "আমি তাকে পড়তে দেখলাম।", ex: "একটি Simple Sentence-এ দুটি ভার্ব থাকলে (saw এবং read), সাধারণত দ্বিতীয় ভার্বটির সাথে ing যুক্ত হয়ে পার্টিসিপল বা জেরান্ড গঠিত হয়।"},
        {id: 52, bookNum: "11.d", type: "normal", raw: "I got the letter ________ (type).", ans: "typed", bn: "আমি চিঠিটি টাইপ করিয়ে নিয়েছিলাম।", ex: "Causative 'get/got' এর পর বস্তুবাচক অবজেক্টের কারণে ভার্বের ৩য় রূপ (V3) বসেছে।"},
        {id: 53, bookNum: "11.e", type: "normal", raw: "I ________ (read) for two hours.", ans: "have been reading", bn: "আমি দুই ঘন্টা ধরে পড়ছি।", ex: "সময়ের ব্যাপ্তি (for two hours) নির্দেশ করায় বাক্যটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 54, bookNum: "12.a", type: "normal", raw: "Ill news ________ (run) apace.", ans: "runs", bn: "কুসংবাদ দ্রুত ছড়ায়।", ex: "প্রবাদ বাক্য এবং চিরন্তন সত্য। 'News' শব্দটি দেখতে প্লুরাল হলেও ব্যাকরণগতভাবে Singular, তাই ভার্বের সাথে s যুক্ত হয়েছে।"},
        {id: 55, bookNum: "12.b", type: "normal", raw: "Five and five ________ (to make) ten.", ans: "makes", bn: "পাঁচে পাঁচে দশ হয়।", ex: "গাণিতিক সংখ্যার যোগফল বা হিসাবকে সাধারণত ব্যাকরণে Singular ধারণা হিসেবে গণ্য করা হয়, তাই Singular Verb 'makes' বসেছে।"},
        {id: 56, bookNum: "12.c", type: "normal", raw: "English ________ (speak) all over the world.", ans: "is spoken", bn: "সারা বিশ্বে ইংরেজি বলা হয়।", ex: "ইংরেজি ভাষা নিজে কথা বলতে পারে না, মানুষের দ্বারা বলা হয়। তাই বাক্যটি Present Indefinite Tense-এর Passive Voice (is + V3) হয়েছে।"},
        {id: 57, bookNum: "12.d", type: "normal", raw: "I fancy I ________ (turn) a trifle pale.", ans: "turned", bn: "আমার মনে হলো আমি যেন কিছুটা ফ্যাকাশে হয়ে গেলাম।", ex: "নিয়ম: বাক্যে 'wish', 'fancy' ইত্যাদি থাকলে অবাস্তব বা কাল্পনিক ধারণা প্রকাশ করতে পরবর্তী ভার্বটি Past Indefinite Form (V2) হয়।"},
        {id: 58, bookNum: "12.e", type: "normal", raw: "Why you ________ (to be) not with her?", ans: "are/were", bn: "তুমি কেন তার সাথে নেই/ছিলে না?", ex: "প্রশ্নবোধক বাক্যের সাবজেক্ট 'You' অনুযায়ী be verb হিসেবে বর্তমান বোঝালে 'are' অথবা অতীত বোঝালে 'were' ব্যবহৃত হতে পারে।"},
        {id: 59, bookNum: "13.a", type: "normal", raw: "What you ________ (want) now?", ans: "do you want", bn: "তুমি এখন কী চাও?", ex: "বাক্যে 'now' থাকলে তা Present Indefinite ইন্টারোগেটিভ গঠনে Wh-word + do/does + subject + V1 স্ট্রাকচার ফলো করে।"},
        {id: 60, bookNum: "13.b", type: "normal", raw: "It is many years since I ________ (come) to Dhaka.", ans: "came", bn: "অনেক বছর হলো আমি ঢাকায় এসেছি।", ex: "'Since'-এর আগের অংশ Present Indefinite/Present Perfect থাকলে পরের অংশটি Past Indefinite Tense (V2) হয়।"},
        {id: 61, bookNum: "13.c", type: "normal", raw: "I saw him ________ (go).", ans: "going", bn: "আমি তাকে যেতে দেখলাম।", ex: "একই সরল বাক্যে দ্বিতীয় ভার্ব হিসেবে চলমান অবস্থা বোঝাতে ভার্বের সাথে ing যুক্ত হয়েছে।"},
        {id: 62, bookNum: "13.d", type: "normal", raw: "He will not go out if it ________ (rain).", ans: "rains", bn: "যদি বৃষ্টি হয় তবে সে বাইরে যাবে না।", ex: "First Conditional বাক্য। If যুক্ত ক্লজের অপর অংশটি Future Indefinite (will not go) থাকলে If ক্লজটি Present Indefinite Tense হয়।"},
        {id: 63, bookNum: "13.e", type: "normal", raw: "He ________ (leave) last night.", ans: "left", bn: "সে গত রাতে চলে গেছে।", ex: "অতীত নির্দেশক শব্দ 'last night' থাকার কারণে এটি Past Indefinite Tense (V2) হয়েছে।"},
        {id: 64, bookNum: "14.a", type: "normal", raw: "Fifty miles ________ a long way.", ans: "is", bn: "পঞ্চাশ মাইল একটি দীর্ঘ পথ।", ex: "নির্দিষ্ট দূরত্ব, সময়, ওজন বা টাকার পরিমাণ দেখতে প্লুরাল মনে হলেও তা একটি একক সমষ্টি নির্দেশ করায় Singular Verb 'is' বসে।"},
        {id: 65, bookNum: "14.b", type: "normal", raw: "Cattle ________ grazing in the field.", ans: "are", bn: "গবাদিপশু মাঠে ঘাস খাচ্ছে।", ex: "'Cattle' শব্দটি দেখতে সিঙ্গুলার হলেও এটি জন্মগতভাবেই একটি Plural Noun, তাই এর পর সর্বদা Plural Verb 'are' বসে।"},
        {id: 66, bookNum: "14.c", type: "normal", raw: "The news ________ false.", ans: "is", bn: "সংবাদটি মিথ্যা।", ex: "'News' (খবর) আনকাউন্টেবল এবং সিঙ্গুলার নাউন হিসেবে গণ্য হয়, তাই এর পর Singular Verb 'is' বসেছে।"},
        {id: 67, bookNum: "14.d", type: "normal", raw: "It ________ raining since Monday.", ans: "has been", bn: "সোমবার থেকে বৃষ্টি হচ্ছে।", ex: "'since Monday' অতীতের একটি নির্দিষ্ট দিন থেকে চলমান কাজ নির্দেশ করায় Present Perfect Continuous এর সাহায্যকারী ভার্ব 'has been' বসেছে।"},
        {id: 68, bookNum: "14.e", type: "normal", raw: "We ________ reached home just now.", ans: "have", bn: "আমরা এইমাত্র বাড়ি পৌঁছেছি।", ex: "বাক্যে 'just now' থাকার কারণে এটি Present Perfect Tense হয়েছে। Subject 'We' প্লুরাল হওয়ায় সাহায্যকারী ভার্ব 'have' বসেছে।"},
        {id: 69, bookNum: "15.a", type: "normal", raw: "I ________ (see) him recently.", ans: "have seen", bn: "আমি সম্প্রতি তাকে দেখেছি।", ex: "নিয়ম: বাক্যে 'recently', 'lately', 'already' থাকলে বাক্যটি Present Perfect Tense (have/has + V3) হয়।"},
        {id: 70, bookNum: "15.b", type: "normal", raw: "If he came, I ________ (go).", ans: "would go", bn: "যদি সে আসতো, তবে আমি যেতাম।", ex: "Second Conditional বাক্য। If ক্লজটি Past Indefinite (came) হওয়ায় অপর অংশে Subject + would + V1 (base form) বসেছে।"},
        {id: 71, bookNum: "15.c", type: "normal", raw: "While he ________ (walk) in the garden, a snake bit him.", ans: "was walking", bn: "যখন সে বাগানে হাঁটছিল, তখন একটি সাপ তাকে কামড়েছিল।", ex: "নিয়ম: 'While' এর ঠিক পরপরই সাবজেক্ট থাকলে সেই অংশটি Past Continuous Tense (was/were + verb+ing) নিয়মে গঠিত হয়।"},
        {id: 72, bookNum: "15.d", type: "normal", raw: "The girl went away ________ (dance).", ans: "dancing", bn: "মেয়েটি নাচতে নাচতে চলে গেল।", ex: "প্রধান কাজের সাথে আরেকটি কাজ একই সময়ে চলমান বা সম্পন্ন হওয়া বোঝাতে (Participle হিসেবে) দ্বিতীয় ভার্বের সাথে ing যুক্ত হয়েছে।"},
        {id: 73, bookNum: "15.e", type: "normal", raw: "How difficult the question paper ________ (be).", ans: "is", bn: "প্রশ্নপত্রটি কতই না কঠিন! / প্রশ্নপত্রটি কেমন কঠিন।", ex: "এক্সক্লামেটরি বা সাধারণ বর্ণনায় প্রশ্নপত্রের বর্তমান অবস্থা প্রকাশ করতে Singular Be-verb হিসেবে 'is' বসেছে।"},
        {id: 74, bookNum: "16.a", type: "normal", raw: "No sooner ________ than the students stood up.", ans: "had the teacher entered", bn: "শিক্ষক শ্রেণীকক্ষে প্রবেশ করতে না করতেই ছাত্ররা উঠে দাঁড়ালো।", ex: "'No sooner had... than' এর স্ট্রাকচার অনুযায়ী 'No sooner had' এর পর Subject + V3 (the teacher entered) বসে।"},
        {id: 75, bookNum: "16.b", type: "normal", raw: "The teacher made the children ________ (read) the book.", ans: "read", bn: "শিক্ষক শিশুদের দিয়ে বইটি পড়ালেন।", ex: "Causative Verb 'make/made' এর পর কোনো ব্যক্তিবাচক অবজেক্ট থাকলে পরবর্তী ভার্বের Bare Infinitive বা Base Form (V1) বসে।"},
        {id: 76, bookNum: "16.c", type: "normal", raw: "He had written the book before he ________ (retire).", ans: "retired", bn: "অবসর নেওয়ার পূর্বেই তিনি বইটি লিখেছিলেন।", ex: "'Before' যুক্ত অতীত বাক্যের প্রথমাংশ Past Perfect হলে, 'before'-এর পরের অংশটি সর্বদা Past Indefinite Tense (V2) হয়।"},
        {id: 77, bookNum: "16.d", type: "normal", raw: "As I reached home, I saw my sister ________ (shout) for help.", ans: "shouting", bn: "বাড়ি পৌঁছে আমি আমার বোনকে সাহায্যের জন্য চিৎকার করতে দেখলাম।", ex: "Simple Sentence-এ 'saw' ভার্বের পর অবজেক্টের একটি চলমান অবস্থা বোঝাতে ২য় ভার্বের সাথে ing যুক্ত হয়েছে।"},
        {id: 78, bookNum: "16.e", type: "normal", raw: "If I had seen him, I ________ (tell) him the matter.", ans: "would have told", bn: "আমি যদি তাকে দেখতাম, তবে তাকে বিষয়টি বলতাম।", ex: "Third Conditional বাক্য। If ক্লজটি Past Perfect (had seen) থাকায় অপর অংশে Subject + would have + V3 (told) বসেছে।"},
        {id: 79, bookNum: "17.a", type: "normal", raw: "His father ________ (come) yesterday.", ans: "came", bn: "তার বাবা গতকাল এসেছিলেন।", ex: "অতীত নির্দেশক শব্দ 'yesterday' থাকার কারণে বাক্যটি Past Indefinite Tense (V2) হয়েছে।"},
        {id: 80, bookNum: "17.b", type: "normal", raw: "One of the boys ________ (have) done it.", ans: "has", bn: "বালকদের মধ্যে একজন এটি করেছে।", ex: "নিয়ম: 'One of' এর পর Noun প্লুরাল (the boys) হলেও এর ভেতরের একজনকে নির্দিষ্ট করায় প্রধান সাবজেক্ট Singular হয়, তাই 'has' বসেছে।"},
        {id: 81, bookNum: "17.c", type: "normal", raw: "The girls are ________ (play) in the field.", ans: "playing", bn: "মেয়েরা মাঠে খেলছে।", ex: "সাহায্যকারী ভার্ব am/is/are এর পর কাজটির চলমান অবস্থা বোঝাতে ভার্বের সাথে ing যুক্ত হয়ে Present Continuous Tense হয়েছে।"},
        {id: 82, bookNum: "17.d", type: "normal", raw: "He ________ (write) a letter to his father.", ans: "has written/wrote", bn: "সে তার বাবার কাছে একটি চিঠি লিখেছে/লিখেছিল।", ex: "চিঠি লেখার কাজটি শেষ হয়েছে বোঝালে Present Perfect (has written) অথবা অতীতে লিখেছিল বোঝালে Past Indefinite (wrote) দুটিই সঠিক।"},
        {id: 83, bookNum: "17.e", type: "normal", raw: "It ________ (rain) since morning.", ans: "has been raining", bn: "সকাল থেকে বৃষ্টি হচ্ছে।", ex: "সকাল থেকে (since morning) কোনো কাজ শুরু হয়ে এখনও চলছে বোঝালে তা Present Perfect Continuous Tense হয়।"},
        {id: 84, bookNum: "18.a", type: "normal", raw: "Child labor has ________ (forbid) internationally by the UN.", ans: "been forbidden", bn: "জাতিসংঘ কর্তৃক আন্তর্জাতিকভাবে শিশুশ্রম নিষিদ্ধ করা হয়েছে।", ex: "জাতিসংঘের দ্বারা কাজটি সম্পন্ন হয়েছে। 'has' এর পর Passive Voice গঠনে 'been + V3' (been forbidden) ব্যবহৃত হয়।"},
        {id: 85, bookNum: "18.b", type: "normal", raw: "Yet the number of child labor ________ (go) up day by day.", ans: "is going", bn: "তবুও দিন দিন শিশুশ্রমের সংখ্যা বৃদ্ধি পাচ্ছে।", ex: "বাক্যে 'day by day' (দিনে দিনে) শব্দগুচ্ছ থাকলে কাজটি ক্রমশ পরিবর্তনশীল চলমান বোঝায়, যা Present Continuous Tense নির্দেশ করে।"},
        {id: 86, bookNum: "18.c", type: "normal", raw: "Many children ________ (work) at different sectors now.", ans: "are working", bn: "অনেক শিশু এখন বিভিন্ন খাতে কাজ করছে।", ex: "বাক্যে 'now' শব্দ উল্লেখ থাকায় এটি Present Continuous Tense হয়েছে। Subject Plural হওয়ায় 'are working' বসেছে।"},
        {id: 87, bookNum: "18.d", type: "normal", raw: "But he should not be ________ (carry) on.", ans: "carried", bn: "কিন্তু এটা চালিয়ে যাওয়া উচিত নয়।", ex: "Modal auxiliary verb (should, can ইত্যাদি) এর পর 'be' থাকলে বাক্যটি প্যাসিভ রূপ নেয় এবং মূল ভার্বের Past Participle (V3) বসে।"},
        {id: 88, bookNum: "18.e", type: "normal", raw: "We ________ (to be) immediately address this problem.", ans: "should", bn: "আমাদের অবিলম্বে এই সমস্যাটির সমাধান করা উচিত।", ex: "কর্তব্য বা পরামর্শ বোঝাতে এবং ভার্বের Base Form এর পূর্বে উপযুক্ত মোডাল ভার্ব হিসেবে 'should' ব্যবহৃত হয়েছে।"},
        {id: 89, bookNum: "19.a", type: "normal", raw: "We ________ (learn) English since our childhood.", ans: "have been learning", bn: "আমরা আমাদের শৈশব থেকেই ইংরেজি শিখছি।", ex: "শৈশবকাল থেকে শুরু করে দীর্ঘ সময় ধরে কাজটি এখনও চলছে, তাই এটি Present Perfect Continuous Tense হয়েছে।"},
        {id: 90, bookNum: "19.b", type: "normal", raw: "There ________ (be) no children in the park.", ans: "are/were", bn: "পার্কে কোনো শিশু নেই/ছিল না।", ex: "Introductory 'There' যুক্ত বাক্যে ভার্বটি তার পরের Noun (no children - Plural) অনুযায়ী নির্ধারিত হয়। তাই বর্তমান হলে are অথবা অতীত হলে were সঠিক।"},
        {id: 91, bookNum: "19.c", type: "normal", raw: "He made me ________ (work) very hard.", ans: "work", bn: "সে আমাকে দিয়ে কঠোর পরিশ্রম করিয়েছিল।", ex: "Causative Verb 'make/made' এর পর ব্যক্তিবাচক অবজেক্ট থাকলে পরবর্তী ভার্বের Base Form (Bare Infinitive) বসে।"},
        {id: 92, bookNum: "19.d", type: "normal", raw: "I would rather die ________ (beg).", ans: "than beg", bn: "আমি বরং মরবো তাও ভিক্ষা করবো না।", ex: "নিয়ম: বাক্যে 'would rather' থাকলে দুটি কাজের পছন্দের তুলনায় অপর ভার্বের পূর্বে 'than' বসাতে হয় (would rather die than beg)।"},
        {id: 93, bookNum: "19.e", type: "normal", raw: "We waited until the plane ________ (take) off.", ans: "took", bn: "বিমানটি উড্ডয়ন না করা পর্যন্ত আমরা অপেক্ষা করেছিলাম।", ex: "প্রধান ক্লজটি Past Indefinite Tense ('waited') এ থাকায় 'until' এর পরের অংশটিও সামঞ্জস্য রেখে Past Indefinite Tense (took) হয়েছে।"},
        {id: 94, bookNum: "20.a", type: "normal", raw: "If he (obey) ________ his teacher, he would be successful.", ans: "obeyed", bn: "যদি সে তার শিক্ষককে মান্য করতো, তবে সে সফল হতো।", ex: "Second Conditional বাক্য। প্রিন্সিপাল ক্লজে 'would + V1' থাকার কারণে ইফ ক্লজটি Past Indefinite Tense (V2) হবে।"},
        {id: 95, bookNum: "20.b", type: "normal", raw: "We saw them (work) ________ in the field.", ans: "working", bn: "আমরা তাদেরকে মাঠে কাজ করতে দেখলাম।", ex: "সরল বাক্যে অবজেক্টের তাৎক্ষণিক বা চলমান অবস্থা নির্দেশ করতে ২য় ভার্বের সাথে ing যুক্ত করে পার্টিসিপল করা হয়েছে।"},
        {id: 96, bookNum: "20.c", type: "normal", raw: "I hear her (sing) ________.", ans: "singing", bn: "আমি তাকে গান গাইতে শুনি।", ex: "ইন্দ্রিয়গ্রাহ্য ভার্ব (hear, see, feel) এর পর অবজেক্টের চলমান কাজ বোঝাতে ২য় ভার্বের সাথে ing যুক্ত হয়।"},
        {id: 97, bookNum: "20.d", type: "normal", raw: "I want to see the house (paint) ________ white.", ans: "painted", bn: "আমি বাড়িটি সাদা রঙ করা অবস্থায় দেখতে চাই।", ex: "বাড়িটি নিজে নিজেকে রঙ করতে পারে না, অন্যের দ্বারা করা অবস্থা বোঝাতে এখানে Past Participle বা Passive Participle (painted) বসেছে।"},
        {id: 98, bookNum: "20.e", type: "normal", raw: "He went to London with a view to (develop) ________ a business.", ans: "developing", bn: "সে একটি ব্যবসা বাড়ানোর উদ্দেশ্যে লন্ডনে গিয়েছিল।", ex: "নিয়ম: বাক্যে 'with a view to', 'look forward to' শব্দগুচ্ছের পর যেকোনো ভার্বের সাথে সর্বদা ing যুক্ত করতে হয়।"},
