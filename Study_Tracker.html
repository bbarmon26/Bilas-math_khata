<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study Tracker • Compact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f3f7;
      --card: rgba(255, 255, 255, 0.92);
      --card-border: rgba(255, 255, 255, 0.95);
      --text: #0f172a;
      --subtext: #64748b;
      --accent: #007aff;
      --accent-gradient: linear-gradient(135deg, #007aff, #5856d6);
      --success: #34c759;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(180deg, #f8f9fc 0%, #edf1f7 100%);
      min-height: 100vh;
      padding: 16px 14px 100px;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* iOS Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }
    .top-bar h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-bar p {
      font-size: 12px;
      color: var(--subtext);
      font-weight: 600;
    }
    .category-pill {
      background: rgba(0, 122, 255, 0.12);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      background: rgba(142, 142, 147, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 4px;
      border-radius: 16px;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-item.active {
      background: #ffffff;
      color: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transform: scale(1.02);
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* Compact Topic Card */
    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topic-row {
      background: var(--card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s ease;
    }
    .topic-row:active {
      transform: scale(0.98);
    }

    .topic-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-row-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .topic-row-stat {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent);
    }

    .progress-bar-bg {
      height: 7px;
      background: rgba(142, 142, 147, 0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: var(--accent-gradient);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-bar-fill.completed {
      background: var(--success);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
    }

    /* Floating Pen */
    .fab {
      position: fixed;
      right: 22px;
      bottom: 24px;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 80;
    }
    .fab:active { transform: scale(0.88); }

    /* Modals */
    .sheet-overlay, .context-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 110;
    }
    .context-overlay {
      align-items: center;
      z-index: 120;
    }

    .sheet {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 22px 18px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: sheetUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      text-align: center;
    }
    .sheet-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sheet input {
      width: 100%;
      background: #f2f4f7;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      user-select: text;
    }
    .sheet input:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .sheet-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .context-menu {
      width: 220px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    .context-btn {
      width: 100%;
      padding: 13px 18px;
      display: flex;
      justify-content: space-between;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .context-btn:first-child { border-bottom: 0.5px solid rgba(0, 0, 0, 0.08); }
    .context-btn.del { color: var(--danger); }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-wrap">
    <div class="top-bar">
      <div>
        <h1>স্টাডি ট্র্যাকার</h1>
        <p>পাঠ্য অগ্রগতি ও প্রশ্ন ট্র্যাকিং</p>
      </div>
      <div class="category-pill" id="catBadge">বাংলা</div>
    </div>

    <div class="tab-bar" id="subTabs"></div>

    <div class="feed-header">
      <span>টপিক তালিকা</span>
      <span id="topicCount">০ টি</span>
    </div>

    <div class="topics-list" id="topicFeed"></div>
  </div>

  <button class="fab" onclick="openInputSheet()" title="নতুন টপিক">✏️</button>

  <div class="context-overlay" id="contextMenuOverlay" onclick="closeContextMenu(event)">
    <div class="context-menu">
      <button class="context-btn" onclick="triggerEdit()">
        <span>এডিট করুন</span>
        <span>✎</span>
      </button>
      <button class="context-btn del" onclick="triggerDelete()">
        <span>মুছে ফেলুন</span>
        <span>🗑</span>
      </button>
    </div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheetOnBackdrop(event)">
    <div class="sheet">
      <h3 class="sheet-title" id="sheetHeading">নতুন টপিক যোগ করুন</h3>
      <input type="text" id="topicName" placeholder="টপিকের নাম (যেমন: শতকরা, সমাস)...">
      
      <div class="sheet-grid-2">
        <input type="number" id="topicTotal" placeholder="মোট প্রশ্ন" min="1">
        <input type="number" id="topicCompleted" placeholder="পড়া হয়েছে" min="0">
      </div>

      <button class="sheet-btn" id="saveBtn" onclick="saveData()">সংরক্ষণ করুন</button>
    </div>
  </div>

  <script>
    const subjects = [
      { id: 'Bangla', name: 'বাংলা', icon: '📖' },
      { id: 'English', name: 'ইংরেজি', icon: '📝' },
      { id: 'Math', name: 'গণিত', icon: '📐' },
      { id: 'GK', name: 'সাধারণ জ্ঞান', icon: '🌏' },
      { id: 'BCS', name: 'বিসিএস', icon: '🎯' }
    ];

    const initialData = {
      Bangla: [
        { id: 101, title: 'সমাস', total: 568, completed: 0 },
        { id: 102, title: 'কারক', total: 577, completed: 0 },
        { id: 103, title: 'সন্ধি', total: 947, completed: 0 },
		{ id: 104, title: 'এক কথায় প্রকাশ', total: 531, completed: 0 },
		{ id: 105, title: 'বিপরীত শব্দ', total: 368, completed: 0 },
		{ id: 106, title: 'বাক্য শুদ্ধি', total: 239, completed: 0 },
		{ id: 107, title: 'সমার্থক শব্দ', total: 63, completed: 0 },
		{ id: 108, title: 'বাগধারা', total: 538, completed: 0 },
		{ id: 109, title: 'শব্দার্থ', total: 34, completed: 0 },
		{ id: 110, title: 'লিঙ্গ পরিবর্তন', total: 63, completed: 0 },
		{ id: 111, title: 'বানান শুদ্ধি', total: 553, completed: 0 },
		{ id: 112, title: 'পারিভাষিক শব্দ', total: 207, completed: 0 },
		{ id: 113, title: 'সাহিত্য', total: 0, completed: 0 },
		{ id: 114, title: 'বিবিধ', total: 0, completed: 0 },
		{ id: 115, title: 'Written Question', total: 0, completed: 0 },
		{ id: 116, title: 'BCS Question', total: 0, completed: 0 }
		
      ],
      English: [
        { id: 201, title: 'Number', total: 81, completed: 0 },
        { id: 202, title: 'Gender', total: 88, completed: 0 },
		{ id: 203, title: 'Article', total: 381, completed: 0 },
		{ id: 204, title: 'Preposition', total: 880, completed: 0 },
		{ id: 205, title: 'Idioms & Phrases', total: 656, completed: 0 },
		{ id: 206, title: 'Spelling', total: 206, completed: 0 },
		{ id: 207, title: 'Fill in the black', total: 286, completed: 0 },
		{ id: 208, title: 'Literature', total: 188, completed: 0 },
		{ id: 209, title: 'Correction', total: 1100, completed: 0 },
		{ id: 210, title: 'Voice', total: 450, completed: 0 },
		{ id: 211, title: 'Right Form of Verbs', total: 611, completed: 0 },
		{ id: 212, title: 'Degree', total: 50, completed: 0 },
		{ id: 213, title: 'One Word Substitution', total: 194, completed: 0 },
		{ id: 214, title: 'Miscellaneous', total: 172, completed: 0 }
		
      ],
      Math: [
        { id: 301, title: 'শতকরা ও লাভ-ক্ষতি', total: 160, completed: 80 },
        { id: 302, title: 'ঐকিক নিয়ম ও কাজ', total: 85, completed: 20 }
      ],
      GK: [
        { id: 401, title: 'বাংলাদেশের বিষয়াবলি', total: 2372, completed: 0 },
		{ id: 402, title: 'আন্তর্জাতিক বিষয়াবলি', total: 1288, completed: 0 },
		{ id: 403, title: 'দিবস ও খেলাধূলা', total: 142, completed: 0 },
		{ id: 404, title: 'বিজ্ঞান', total: 628, completed: 0 },
		{ id: 405, title: 'ICT', total: 663, completed: 0 },
		{ id: 406, title: 'Abbreviation', total: 317, completed: 0 }
		
      ],
      BCS: [
        { id: 501, title: 'বিসিএস বিগত সালের প্রশ্ন', total: 500, completed: 220 }
      ]
    };

    let currentSubject = 'Bangla';
    let activeTargetId = null;
    let editModeId = null;
    let pressTimer = null;

    function getDB() {
      const data = localStorage.getItem('study_tracker_compact_db');
      if (!data) {
        setDB(initialData);
        return initialData;
      }
      return JSON.parse(data);
    }

    function setDB(data) {
      localStorage.setItem('study_tracker_compact_db', JSON.stringify(data));
    }

    function renderTabs() {
      const container = document.getElementById('subTabs');
      container.innerHTML = '';
      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `tab-item ${sub.id === currentSubject ? 'active' : ''}`;
        btn.innerHTML = `${sub.icon} ${sub.name}`;
        btn.onclick = () => {
          currentSubject = sub.id;
          document.getElementById('catBadge').innerText = sub.name;
          renderTabs();
          renderFeed();
        };
        container.appendChild(btn);
      });
    }

    function renderFeed() {
      const container = document.getElementById('topicFeed');
      const counter = document.getElementById('topicCount');
      const db = getDB();
      const list = db[currentSubject] || [];

      counter.innerText = `${list.length} টি`;
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 48px 16px; color:#94a3b8; font-size:13px; font-weight:600;">
            কোনো টপিক নেই। নিচে ✏️ বাটনে চাপ দিয়ে যোগ করুন।
          </div>
        `;
        return;
      }

      list.forEach(item => {
        const total = Number(item.total) || 1;
        const comp = Number(item.completed) || 0;
        const pct = Math.min(100, Math.round((comp / total) * 100));
        const isFinished = pct === 100;

        const row = document.createElement('div');
        row.className = 'topic-row';
        row.innerHTML = `
          <div class="topic-row-top">
            <span class="topic-row-title">${item.title}</span>
            <span class="topic-row-stat">${pct}%</span>
          </div>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${isFinished ? 'completed' : ''}" style="width: ${pct}%"></div>
          </div>

          <div class="progress-info">
            <span>পড়েছেন: ${comp} / ${total}</span>
            <span>${Math.max(0, total - comp)} টি বাকি</span>
          </div>
        `;

        // Card tap korle direct edit sheet khulbe
        row.onclick = () => openEditDirect(item.id);

        // Mobile Long Press for Delete/Edit Context Menu
        row.addEventListener('touchstart', () => {
          pressTimer = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate(40);
            showContextMenu(item.id);
          }, 450);
        }, { passive: true });

        row.addEventListener('touchend', () => clearTimeout(pressTimer));
        row.addEventListener('touchmove', () => clearTimeout(pressTimer));

        row.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showContextMenu(item.id);
        });

        container.appendChild(row);
      });
    }

    function openEditDirect(id) {
      const db = getDB();
      const item = (db[currentSubject] || []).find(i => i.id === id);
      if (item) {
        editModeId = id;
        document.getElementById('sheetHeading').innerText = 'টপিক এডিট করুন';
        document.getElementById('topicName').value = item.title;
        document.getElementById('topicTotal').value = item.total;
        document.getElementById('topicCompleted').value = item.completed;
        document.getElementById('saveBtn').innerText = 'আপডেট করুন';
        document.getElementById('sheetOverlay').style.display = 'flex';
      }
    }

    function showContextMenu(id) {
      activeTargetId = id;
      document.getElementById('contextMenuOverlay').style.display = 'flex';
    }

    function closeContextMenu(e) {
      if (e && e.target.id !== 'contextMenuOverlay' && !e.target.classList.contains('context-btn')) return;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      activeTargetId = null;
    }

    function triggerEdit() {
      const id = activeTargetId;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      openEditDirect(id);
    }

    function triggerDelete() {
      const id = activeTargetId;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      const db = getDB();
      db[currentSubject] = (db[currentSubject] || []).filter(i => i.id !== id);
      setDB(db);
      renderFeed();
    }

    function openInputSheet() {
      editModeId = null;
      document.getElementById('sheetHeading').innerText = 'নতুন টপিক যোগ করুন';
      document.getElementById('topicName').value = '';
      document.getElementById('topicTotal').value = '';
      document.getElementById('topicCompleted').value = '0';
      document.getElementById('saveBtn').innerText = 'সংরক্ষণ করুন';
      document.getElementById('sheetOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('topicName').focus(), 150);
    }

    function closeSheetOnBackdrop(e) {
      if (e.target.id === 'sheetOverlay') {
        document.getElementById('sheetOverlay').style.display = 'none';
      }
    }

    function saveData() {
      const title = document.getElementById('topicName').value.trim();
      const total = parseInt(document.getElementById('topicTotal').value, 10);
      const completed = parseInt(document.getElementById('topicCompleted').value, 10) || 0;

      if (!title) {
        alert('টপিকের নাম লিখুন!');
        return;
      }
      if (isNaN(total) || total <= 0) {
        alert('সঠিক মোট প্রশ্নের সংখ্যা দিন!');
        return;
      }

      const db = getDB();
      const list = db[currentSubject] || [];

      if (editModeId) {
        const item = list.find(i => i.id === editModeId);
        if (item) {
          item.title = title;
          item.total = total;
          item.completed = Math.min(completed, total);
        }
      } else {
        list.unshift({
          id: Date.now(),
          title: title,
          total: total,
          completed: Math.min(completed, total)
        });
      }

      db[currentSubject] = list;
      setDB(db);
      document.getElementById('sheetOverlay').style.display = 'none';
      renderFeed();
    }

    renderTabs();
    renderFeed();
  </script>
</body>
</html>
