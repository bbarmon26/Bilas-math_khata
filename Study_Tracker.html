<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study Tracker • Compact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(180deg, #f8f9fc 0%, #edf1f7 100%);
      --card: rgba(255, 255, 255, 0.92);
      --card-border: rgba(255, 255, 255, 0.95);
      --text: #0f172a;
      --subtext: #64748b;
      --accent: #007aff;
      --accent-gradient: linear-gradient(135deg, #007aff, #5856d6);
      --success: #34c759;
      --danger: #ff3b30;
      --target-color: #d97706;
      --sheet-bg: #ffffff;
      --input-bg: #f2f4f7;
      --tab-bg: rgba(142, 142, 147, 0.12);
      --tab-active-bg: #ffffff;
      --tab-active-color: #000000;
      --bar-bg: rgba(142, 142, 147, 0.15);
      --context-bg: rgba(255, 255, 255, 0.95);
    }

    [data-theme="dark"] {
      --bg: linear-gradient(180deg, #090d16 0%, #0f172a 100%);
      --card: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #6366f1);
      --target-color: #fbbf24;
      --sheet-bg: #1e293b;
      --input-bg: #0f172a;
      --tab-bg: rgba(255, 255, 255, 0.06);
      --tab-active-bg: #334155;
      --tab-active-color: #ffffff;
      --bar-bg: rgba(255, 255, 255, 0.1);
      --context-bg: rgba(30, 41, 59, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, sans-serif;
      user-select: none;
    }

    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      padding: 16px 14px 100px;
      color: var(--text);
      display: flex;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }
    .top-bar h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .top-bar p {
      font-size: 12px;
      color: var(--subtext);
      font-weight: 600;
    }
    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .category-pill {
      background: rgba(0, 122, 255, 0.12);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .theme-toggle-btn {
      background: var(--tab-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    .theme-toggle-btn:active {
      transform: scale(0.9);
    }

    .tab-bar {
      display: flex;
      background: var(--tab-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 4px;
      border-radius: 16px;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-item.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transform: scale(1.02);
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
    }

    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      will-change: transform;
    }

    .topic-row {
      background: var(--card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform: translateZ(0);
      backface-visibility: hidden;
      transition: transform 0.15s ease;
    }
    .topic-row:active {
      transform: scale(0.98);
    }

    .topic-row-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }
    .topic-row-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    
    /* Backgroundless, minimal opacity daily target label */
    .daily-target-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      background: transparent;
      padding: 0;
    }
    .daily-target-num {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--target-color);
      letter-spacing: -0.2px;
      line-height: 1;
    }
    .daily-target-label {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--target-color);
      opacity: 0.45;
      white-space: nowrap;
      line-height: 1;
    }
    
    .topic-row-stat {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent);
      text-align: right;
    }

    .progress-bar-bg {
      height: 7px;
      background: var(--bar-bg);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: var(--accent-gradient);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-bar-fill.completed {
      background: var(--success);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
    }

    .fab {
      position: fixed;
      right: 22px;
      bottom: 24px;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 80;
      transform: translateZ(0);
    }
    .fab:active { transform: scale(0.88); }

    .sheet-overlay, .context-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 110;
    }
    .context-overlay {
      align-items: center;
      z-index: 120;
    }

    .sheet {
      background: var(--sheet-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 22px 18px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: sheetUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      color: var(--text);
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      text-align: center;
    }
    .sheet-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sheet input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      user-select: text;
    }
    .sheet input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .sheet-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .context-menu {
      width: 220px;
      background: var(--context-bg);
      backdrop-filter: blur(30px);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }
    .context-btn {
      width: 100%;
      padding: 13px 18px;
      display: flex;
      justify-content: space-between;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .context-btn:first-child { border-bottom: 0.5px solid var(--card-border); }
    .context-btn.del { color: var(--danger); }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-wrap">
    <div class="top-bar">
      <div>
        <h1>স্টাডি ট্র্যাকার</h1>
        <p>পাঠ্য অগ্রগতি ও প্রশ্ন ট্র্যাকিং</p>
      </div>
      <div class="top-right-actions">
        <div class="category-pill" id="catBadge">বাংলা</div>
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="থিম পরিবর্তন">🌙</button>
      </div>
    </div>

    <div class="tab-bar" id="subTabs"></div>

    <div class="feed-header">
      <span>টপিক তালিকা</span>
      <span id="topicCount">০ টি</span>
    </div>

    <div class="topics-list" id="topicFeed"></div>
  </div>

  <button class="fab" onclick="openInputSheet()" title="নতুন টপিক">✏️</button>

  <div class="context-overlay" id="contextMenuOverlay" onclick="closeContextMenu(event)">
    <div class="context-menu">
      <button class="context-btn" onclick="triggerEdit()">
        <span>এডিট করুন</span>
        <span>✎</span>
      </button>
      <button class="context-btn del" onclick="triggerDelete()">
        <span>মুছে ফেলুন</span>
        <span>🗑</span>
      </button>
    </div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheetOnBackdrop(event)">
    <div class="sheet">
      <h3 class="sheet-title" id="sheetHeading">নতুন টপিক যোগ করুন</h3>
      <input type="text" id="topicName" placeholder="টপিকের নাম (যেমন: শতকরা, সমাস)...">
      
      <div class="sheet-grid-2">
        <input type="number" id="topicTotal" placeholder="মোট প্রশ্ন" min="1">
        <input type="number" id="topicCompleted" placeholder="পড়া হয়েছে" min="0">
      </div>

      <input type="number" id="topicDaily" placeholder="প্রতিদিনের পড়ার টার্গেট (যেমন: ১০০)" min="0">

      <button class="sheet-btn" id="saveBtn" onclick="saveData()">সংরক্ষণ করুন</button>
    </div>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('study_tracker_theme');
      if (savedTheme) {
        setTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark ? 'dark' : 'light');
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerText = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('study_tracker_theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {

        ],
      BCS: [
        { id: 501, title: 'বিসিএস বাংলা প্রশ্ন', total: 500, completed: 220, dailyTarget: 50 },
        { id: 502, title: 'বিসিএস ইংরেজি প্রশ্ন', total: 500, completed: 220, dailyTarget: 50 },
        { id: 503, title: 'বিসিএস GK প্রশ্ন', total: 500, completed: 220, dailyTarget: 50 }
      ]
    };

    let currentSubject = 'Bangla';
    let activeTargetId = null;
    let editModeId = null;
    let pressTimer = null;

    function getDB() {
      const data = localStorage.getItem('study_tracker_compact_db_v3');
      if (!data) {
        setDB(initialData);
        return initialData;
      }
      return JSON.parse(data);
    }

    function setDB(data) {
      localStorage.setItem('study_tracker_compact_db_v3', JSON.stringify(data));
    }

    function renderTabs() {
      const container = document.getElementById('subTabs');
      container.innerHTML = '';
      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `tab-item ${sub.id === currentSubject ? 'active' : ''}`;
        btn.innerHTML = `${sub.icon} ${sub.name}`;
        btn.onclick = () => {
          currentSubject = sub.id;
          document.getElementById('catBadge').innerText = sub.name;
          renderTabs();
          renderFeed();
        };
        container.appendChild(btn);
      });
    }

    function renderFeed() {
      const container = document.getElementById('topicFeed');
      const counter = document.getElementById('topicCount');
      const db = getDB();
      const list = db[currentSubject] || [];

      counter.innerText = `${list.length} টি`;
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 48px 16px; color:var(--subtext); font-size:13px; font-weight:600;">
            কোনো টপিক নেই। নিচে ✏️ বাটনে চাপ দিয়ে যোগ করুন।
          </div>
        `;
        return;
      }

      list.forEach(item => {
        const total = Number(item.total) || 1;
        const comp = Number(item.completed) || 0;
        const daily = Number(item.dailyTarget) || 0;
        const pct = Math.min(100, Math.round((comp / total) * 100));
        const isFinished = pct === 100;

        const row = document.createElement('div');
        row.className = 'topic-row';
        row.innerHTML = `
          <div class="topic-row-top">
            <span class="topic-row-title">${item.title}</span>
            <div style="display:flex; justify-content:center;">
              ${daily > 0 ? `
                <div class="daily-target-wrap">
                  <span class="daily-target-num">${daily}</span>
                  <span class="daily-target-label">টি প্রতিদিন</span>
                </div>` : '<span></span>'}
            </div>
            <span class="topic-row-stat">${pct}%</span>
          </div>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${isFinished ? 'completed' : ''}" style="width: ${pct}%"></div>
          </div>

          <div class="progress-info">
            <span>পড়েছেন: ${comp} / ${total}</span>
            <span>${Math.max(0, total - comp)} টি বাকি</span>
          </div>
        `;

        row.onclick = () => openEditDirect(item.id);

        row.addEventListener('touchstart', () => {
          pressTimer = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate(40);
            showContextMenu(item.id);
          }, 450);
        }, { passive: true });

        row.addEventListener('touchend', () => clearTimeout(pressTimer));
        row.addEventListener('touchmove', () => clearTimeout(pressTimer));

        row.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showContextMenu(item.id);
        });

        container.appendChild(row);
      });
    }

    function openEditDirect(id) {
      const db = getDB();
      const item = (db[currentSubject] || []).find(i => i.id === id);
      if (item) {
        editModeId = id;
        document.getElementById('sheetHeading').innerText = 'টপিক এডিট করুন';
        document.getElementById('topicName').value = item.title;
        document.getElementById('topicTotal').value = item.total;
        document.getElementById('topicCompleted').value = item.completed;
        document.getElementById('topicDaily').value = item.dailyTarget || '';
        document.getElementById('saveBtn').innerText = 'আপডেট করুন';
        document.getElementById('sheetOverlay').style.display = 'flex';
      }
    }

    function showContextMenu(id) {
      activeTargetId = id;
      document.getElementById('contextMenuOverlay').style.display = 'flex';
    }

    function closeContextMenu(e) {
      if (e && e.target.id !== 'contextMenuOverlay' && !e.target.classList.contains('context-btn')) return;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      activeTargetId = null;
    }

    function triggerEdit() {
      const id = activeTargetId;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      openEditDirect(id);
    }

    function triggerDelete() {
      const id = activeTargetId;
      document.getElementById('contextMenuOverlay').style.display = 'none';
      const db = getDB();
      db[currentSubject] = (db[currentSubject] || []).filter(i => i.id !== id);
      setDB(db);
      renderFeed();
    }

    function openInputSheet() {
      editModeId = null;
      document.getElementById('sheetHeading').innerText = 'নতুন টপিক যোগ করুন';
      document.getElementById('topicName').value = '';
      document.getElementById('topicTotal').value = '';
      document.getElementById('topicCompleted').value = '0';
      document.getElementById('topicDaily').value = '';
      document.getElementById('saveBtn').innerText = 'সংরক্ষণ করুন';
      document.getElementById('sheetOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('topicName').focus(), 150);
    }

    function closeSheetOnBackdrop(e) {
      if (e.target.id === 'sheetOverlay') {
        document.getElementById('sheetOverlay').style.display = 'none';
      }
    }

    function saveData() {
      const title = document.getElementById('topicName').value.trim();
      const total = parseInt(document.getElementById('topicTotal').value, 10);
      const completed = parseInt(document.getElementById('topicCompleted').value, 10) || 0;
      const dailyTarget = parseInt(document.getElementById('topicDaily').value, 10) || 0;

      if (!title) {
        alert('টপিকের নাম লিখুন!');
        return;
      }
      if (isNaN(total) || total <= 0) {
        alert('সঠিক মোট প্রশ্নের সংখ্যা দিন!');
        return;
      }

      const db = getDB();
      const list = db[currentSubject] || [];

      if (editModeId) {
        const item = list.find(i => i.id === editModeId);
        if (item) {
          item.title = title;
          item.total = total;
          item.completed = Math.min(completed, total);
          item.dailyTarget = dailyTarget;
        }
      } else {
        list.unshift({
          id: Date.now(),
          title: title,
          total: total,
          completed: Math.min(completed, total),
          dailyTarget: dailyTarget
        });
      }

      db[currentSubject] = list;
      setDB(db);
      document.getElementById('sheetOverlay').style.display = 'none';
      renderFeed();
    }

    initTheme();
    renderTabs();
    renderFeed();
  </script>
</body>
</html>
