<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>সংক্ষিপ্ত প্রশ্নোত্তর | BILAS ACADEMY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0d0221;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;
            --neon-pink: #ff416c;
            --heart-red: #ef4444; 
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 🚀 Smooth Auto-Hide Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.88); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            padding: 8px 12px 12px 12px;
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            will-change: transform;
        }

        .header-section.header-hide {
            transform: translateY(-120%) !important;
        }

        .brand-header { text-align: center; padding: 2px 0; }
        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .search-box {
            width: 100%;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            outline: none;
            margin: 8px 0;
            font-size: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        
        .search-box:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .mode-group {
            display: flex;
            gap: 8px;
            flex-grow: 1;
        }

        .mode-btn {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #ccc;
            padding: 6px 0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .mode-btn.active {
            background: rgba(0, 210, 255, 0.12);
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .icon-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--neon-gold);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .icon-btn.active {
            background: rgba(246, 211, 101, 0.15);
            border-color: var(--neon-gold);
            box-shadow: 0 0 15px rgba(246, 211, 101, 0.3);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 135px 15px 120px 10px; 
        }

        .item-wrapper {
            position: relative;
            display: flex;
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px; 
            padding-right: 8px; 
            scroll-margin-top: 140px;
        }

        .serial { 
            color: var(--neon-blue); 
            font-weight: bold; 
            font-size: 14px; 
            min-width: 24px; 
            text-align: right;
            opacity: 0.7; 
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
        }

        .card {
            flex-grow: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 16px; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease;
            will-change: transform;
            transform: translateZ(0);
            padding: 16px 20px;
        }

        .card:active { 
            transform: scale(0.98); 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        .card-practice-content {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .q-practice {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            user-select: none;
            will-change: opacity, transform;
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale3d(1, 1, 1);
        }

        .q-faded {
            opacity: 0.15;
            transform: scale3d(0.96, 0.96, 1);
        }

        .a-practice {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-gold);
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(246, 211, 101, 0.5);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            user-select: none;
            will-change: opacity, transform;
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, -50%) scale3d(0.8, 0.8, 1);
        }

        .a-show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale3d(1, 1, 1);
        }

        .card-reading-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .q-reading {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 500;
            line-height: 1.5;
        }

        .a-reading {
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-gold);
            text-shadow: 0 0 12px rgba(246, 211, 101, 0.4);
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            padding-top: 8px;
        }

        .a-reading span {
            color: var(--neon-blue);
            font-size: 13px;
            margin-right: 6px;
        }

        .fav-btn { 
            position: absolute;
            top: -8px; 
            right: 0px; 
            background: rgba(13, 2, 33, 0.9); 
            border-radius: 50%;
            padding: 4px;
            cursor: pointer; 
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5); 
        }

        .fav-btn:active {
            transform: scale(0.85);
        }

        /* 🚀 Clean Bottom-Right Rocket Hub (No Glow/Aura) */
        .rocket-hub {
            position: fixed !important;
            right: 12px !important;
            bottom: max(12px, env(safe-area-inset-bottom, 0px)) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 999999 !important;
            pointer-events: auto;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(13, 2, 33, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            padding: 15px 10px;
            border-radius: 40px;
            margin-bottom: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.2s ease;
        }

        .r-circle {
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .r-circle.shuffle-active {
            border-color: var(--neon-gold);
            background: rgba(246, 211, 101, 0.2);
            color: var(--neon-gold);
            box-shadow: 0 0 10px rgba(246, 211, 101, 0.4);
        }

        .r-circle:active {
            transform: scale(0.9);
        }

        .jump-box {
            width: 38px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .go-btn { 
            background: var(--neon-pink); 
            border: none; 
            padding: 5px; 
            border-radius: 6px; 
            font-weight: bold; 
            color: #fff; 
            cursor: pointer; 
            font-size: 11px;
        }

        .rocket-icon {
            font-size: 34px; 
            cursor: pointer;
            filter: none !important; /* সব ধরণের আলো/গ্লো রিমুভ করা হলো */
            box-shadow: none !important;
            background: transparent !important;
            transition: transform 0.2s;
            user-select: none;
            line-height: 1;
        }
        .rocket-icon:active { transform: scale(0.9); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(26, 16, 61, 0.95), rgba(13, 2, 33, 0.98));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 22px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.25s ease;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--neon-gold);
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 9px 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-confirm {
            background: linear-gradient(to right, var(--neon-blue), #0088cc);
            color: #000;
            font-weight: 700;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="header-section" id="header">
    <div class="brand-header">
        <span class="brand-name">BILAS ACADEMY</span>
    </div>
    <div style="max-width:600px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="প্রশ্ন বা উত্তর খুঁজুন..." onkeyup="filter()">
        
        <div class="control-row">
            <div class="mode-group">
                <button class="mode-btn" id="mode-reading" onclick="switchMode('reading')">Reading</button>
                <button class="mode-btn active" id="mode-practice" onclick="switchMode('practice')">Practice</button>
            </div>
            <div class="icon-group">
                <button class="icon-btn" onclick="scrollToLastRead()" title="শেষ পড়া">
                    <i data-lucide="clock" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
                </button>
                <button class="icon-btn" id="favViewBtn" onclick="toggleFavView()" title="ফেভারিট">
                    <i data-lucide="star" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" id="shuffleBtn" onclick="handleShuffleClick()" title="এলোমেলো বা রিসেট">
            <i data-lucide="shuffle" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
        </div>
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'}); toggleRocket();">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); toggleRocket();">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<div class="modal-overlay" id="shuffleModal">
    <div class="modal-card">
        <div class="modal-title" id="modalTitle">লিস্ট এলোমেলো করবেন?</div>
        <div class="modal-desc" id="modalDesc">
            সকল প্রশ্নের ক্রমানুসার এলোমেলো হয়ে যাবে এবং অ্যাপ তা মনে রাখবে।<br><br>
            <span style="color: var(--neon-blue); font-size: 13px;">💡 ৫ সেকেন্ড চেপে ধরে বা পুনরায় ট্যাপ করে যে কোনো সময় পূর্বের স্বাভাবিক ক্রমানুসারে ফিরতে পারবেন।</span>
        </div>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeShuffleModal()">বাতিল</button>
            <button class="modal-btn btn-confirm" id="modalConfirmBtn" onclick="executeModalAction()">হ্যাঁ, করুন</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    const originalQuestions = [
        { q: "বাংলা ভাষার জন্ম কোন ভাষা থেকে?", a: "প্রাকৃত" },
        { q: "ভাষা পরিবার অনুযায়ী সাঁওতাল জনগোষ্ঠী প্রধানত কোন পরিবার ভুক্ত?", a: "অস্ট্রিক-অস্ট্রো এশিয়াটিক (মুন্ডা)" },
        { q: "গৌড়ী প্রাকৃত বলতে কী বোঝায়?", a: "গৌড় অঞ্চলের মুখের ভাষা" },
        { q: "কেন্তুমের কোন দুটি শাখা এশিয়ার অন্তর্গত?", a: "হিত্তিক ও তুষারিক" },
        { q: "বাংলার আদি অধিবাসীগণ কোন ভাষাভাষী ছিলেন?", a: "অস্ট্রিক" },
        { q: "বাংলা লিপির উৎস কী?", a: "ব্রাহ্মী লিপি" },
        { q: "বাংলা ভাষার আদি স্তরের স্থিতিকাল কোনটি?", a: "দশম থেকে চতুর্দশ শতাব্দী" },
        { q: "'ভাষা চিন্তার শুধুই বাহনই নয়, চিন্তার প্রসূতিও।' মন্তব্যটি কোন ভাষা চিন্তকের?", a: "সুকুমার সেন" },
        { q: "বাঙ্গালি উপভাষা অঞ্চল কোনটি?", a: "বরিশাল" },
        { q: "সাধু ও চলিত ভাষার মূল পার্থক্য কোন পদে বেশি দেখা যায়?", a: "ক্রিয়া ও সর্বনাম" },
        { q: "'তৎসম' শব্দের ব্যবহার কোন রীতিতে বেশি হয়?", a: "সাধু রীতি" },
        { q: "সাধু ভাষা সাধারণত কোথায় অনুপযোগী?", a: "নাটকের সংলাপে" },
        { q: "সাধু ও চলিত ভাষার পার্থক্য—", a: "ক্রিয়াপদ ও সর্বনাম পদের রূপগত ভিন্নতায়" },
        { q: "বাংলা একাডেমির 'আধুনিক বাংলা অভিধান'র সম্পাদক কে?", a: "জামিল চৌধুরী" },
        { q: "'ধ্বনিবিজ্ঞান ও বাংলা ধ্বনিতত্ত্ব' গ্রন্থের রচয়িতা—", a: "মুহম্মদ আবদুল হাই" },
        { q: "সর্বপ্রথম বাংলা ভাষার ব্যাকরণ রচনা করেন কে?", a: "ম্যানোয়েল দ্য আস্‌সুম্পসাঁও" },
        { q: "বাংলা ভাষায় প্রথম অভিধান সংকলন করেন কে?", a: "রামচন্দ্র বিদ্যাবাগীশ" },
        { q: "কে সর্ব প্রথম বাংলা টাইপ সহযোগে বাংলা ব্যাকরণ মুদ্রণ করেন?", a: "ব্রাসি হ্যালহেড" },
        { q: "মনীষা মঞ্জুষা কে রচনা করেন?", a: "মুহম্মদ এনামুল হক" },
        { q: "প্রথম বাংলা 'থিসরাস' বা 'সমার্থক শব্দের অভিধান' সংকলন করেছেন কে?", a: "মুহাম্মদ হাবিবুর রহমান" },

    /* 🚀 Reliable Scroll Up Detection */
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    const header = document.getElementById('header');

    window.addEventListener('scroll', () => {
        const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
        const diff = currentScrollY - lastScrollY;

        if (currentScrollY <= 15) {
            header.classList.remove('header-hide');
            lastScrollY = currentScrollY;
            return;
        }

        if (diff > 5) {
            header.classList.add('header-hide');
        } else if (diff < -2) {
            header.classList.remove('header-hide');
        }

        lastScrollY = currentScrollY;
    }, { passive: true });

    function switchMode(mode) {
        currentMode = mode;
        localStorage.setItem('shortQues_mode', mode);
        updateModeButtons();
        render();
    }

    function updateModeButtons() {
        document.getElementById('mode-reading').classList.toggle('active', currentMode === 'reading');
        document.getElementById('mode-practice').classList.toggle('active', currentMode === 'practice');
    }

    function magicFlip(index) {
        if (currentMode !== 'practice') return;

        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        if (!q || !a) return;

        if (a.classList.contains('a-show')) {
            q.classList.remove('q-faded');
            a.classList.remove('a-show');
        } else {
            q.classList.add('q-faded');
            a.classList.add('a-show');
        }
        localStorage.setItem('shortQues_lastRead', index + 1);
    }

            pendingAction = 'shuffle';
            title.innerText = "লিস্ট এলোমেলো করবেন?";
            desc.innerHTML = "সকল প্রশ্নের সিরিয়াল এলোমেলো হয়ে যাবে এবং এই অবস্থাটি অ্যাপ সেভ রাখবে।<br><br><span style='color: var(--neon-blue); font-size: 13px;'>💡 পুনরায় স্বাভাবিক অবস্থায় ফিরতে বাটনে ৫ সেকেন্ড চেপে রাখুন অথবা আবার ট্যাপ করে রিসেট নিশ্চিত করুন।</span>";
            confirmBtn.innerText = "হ্যাঁ, এলোমেলো করুন";
        }

        modal.style.display = 'flex';
    }

    function closeShuffleModal() {
        document.getElementById('shuffleModal').style.display = 'none';
    }

    function executeModalAction() {
        closeShuffleModal();
        if (pendingAction === 'shuffle') {
            performShuffle();
        } else {
            resetOriginalData();
        }
    }

    function performShuffle() {
        let arr = [...currentQuestions];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        currentQuestions = arr;
        localStorage.setItem('shortQues_savedOrder', JSON.stringify(arr));
        localStorage.setItem('shortQues_isShuffled', 'true');
        render();
        updateShuffleBtnUI();
        toggleRocket();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetOriginalData() {
        currentQuestions = [...originalQuestions];
        localStorage.removeItem('shortQues_savedOrder');
        localStorage.setItem('shortQues_isShuffled', 'false');
        render();
        updateShuffleBtnUI();
        toggleRocket();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    const shuffleBtn = document.getElementById('shuffleBtn');
    let pressTimer = null;

    function startPress() {
        pressTimer = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            resetOriginalData();
            alert("✅ ৫ সেকেন্ড চেপে ধরায় লিস্ট পূর্বের স্বাভাবিক সিরিয়ালে রিসেট করা হয়েছে!");
        }, 5000);
    }

    function cancelPress() {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    }

    shuffleBtn.addEventListener('mousedown', startPress);
    shuffleBtn.addEventListener('touchstart', startPress, {passive: true});
    shuffleBtn.addEventListener('mouseup', cancelPress);
    shuffleBtn.addEventListener('mouseleave', cancelPress);
    shuffleBtn.addEventListener('touchend', cancelPress);
    shuffleBtn.addEventListener('touchcancel', cancelPress);

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        if (currentQuestions.length === 0) return;

        currentQuestions.forEach((item, index) => {
            const favKey = item.q;
            const isFav = favorites.includes(favKey);
            
            if (showFavs && !isFav) return;

            const heartStyle = isFav 
                ? 'fill: #ef4444; color: #ef4444; filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.6));' 
                : 'color: rgba(255,255,255,0.3);';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;

            let cardContent = '';
            if (currentMode === 'practice') {
                cardContent = `
                    <div class="card-practice-content">
                        <div id="q-${index}" class="q-practice">${item.q}</div>
                        <div id="a-${index}" class="a-practice">${item.a}</div>
                    </div>
                `;
            } else {
                cardContent = `
                    <div class="card-reading-content">
                        <div class="q-reading">${item.q}</div>
                        <div class="a-reading"><span>উত্তর:</span>${item.a}</div>
                    </div>
                `;
            }

            div.innerHTML = `
                <span class="serial">${index + 1}.</span>
                <div class="card" onclick="${currentMode === 'practice' ? `magicFlip(${index})` : `recordRead(${index})`}">
                    ${cardContent}
                </div>
                <div class="fav-btn" onclick="toggleFav(event, '${favKey}')">
                    <i data-lucide="heart" stroke-width="2.5" class="w-[16px] h-[16px]" style="${heartStyle}"></i>
                </div>
            `;
            list.appendChild(div);
        });
        
        lucide.createIcons();
    }

    function recordRead(index) {
        localStorage.setItem('shortQues_lastRead', index + 1);
    }

    function toggleFav(event, favKey) {
        event.stopPropagation(); 
        const pos = favorites.indexOf(favKey);
        if (pos === -1) favorites.push(favKey);
        else favorites.splice(pos, 1);
        localStorage.setItem('shortQues_favs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').classList.toggle('active', showFavs);
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('shortQues_lastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert("এখনও কোনো পড়া মার্ক করা নেই।");
        }
    }

    updateModeButtons();
    updateShuffleBtnUI();
    render();
</script>
</body>
</html>
