<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - বাগধারা মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --accent-cyan: #00e5ff;
            --accent-gold: #ffcf54;
            --accent-pink: #ff416c;
            --card-radius: 16px;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Header */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-name {
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(0, 229, 255, 0.3);
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .top-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover, .btn.active-mode {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 207, 84, 0.4);
        }
        .btn-cyan { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-cyan.active-mode { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Content Container */
        .container { max-width: 700px; margin: 0 auto; padding: 220px 20px 100px 20px; }

        .item-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
            scroll-margin-top: 230px;
        }

        .serial { 
            color: var(--accent-cyan); 
            font-weight: 700; 
            font-size: 16px; 
            min-width: 25px; 
            padding-top: 15px;
            opacity: 0.7; 
        }

        /* Smart Card Design */
        .card {
            flex-grow: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 15px 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .card:active { transform: scale(0.98); }

        .q-text {
            font-size: 20px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* Answer Details - CSS Grid Smooth Animation */
        .ans-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ans-wrapper.show {
            grid-template-rows: 1fr;
        }

        .ans-details {
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ans-wrapper.show .ans-details {
            opacity: 1;
            transition: opacity 0.4s ease 0.1s;
        }

        .ans-content {
            margin-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            padding-top: 12px;
        }

        .ortho {
            font-size: 17px;
            color: #fff;
            margin-bottom: 6px;
        }
        .ortho strong { color: var(--accent-cyan); }

        .bakko {
            font-size: 15px;
            color: #b3b3c6;
            font-style: italic;
            line-height: 1.4;
        }
        .bakko strong { color: #8e8eb3; font-style: normal; }

        .fav-btn { 
            font-size: 22px; 
            color: rgba(255,255,255,0.1); 
            cursor: pointer; 
            padding-top: 12px;
            transition: 0.3s; 
        }
        .fav-btn.active { 
            color: var(--accent-pink); 
            filter: drop-shadow(0 0 8px var(--accent-pink)); 
        }

        /* Rocket Hub */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu { display: none; flex-direction: column; gap: 12px; background: rgba(15, 12, 41, 0.95); padding: 20px 10px; border-radius: 40px; border: 1px solid var(--accent-cyan); margin-bottom: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideUp 0.3s ease; }
        .r-circle { width: 45px; height: 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; }
        .jump-box { width: 45px; height: 35px; background: #000; border: 1px solid var(--accent-pink); color: white; text-align: center; border-radius: 8px; font-size: 14px; outline: none; }
        .go-btn { background: var(--accent-pink); border: none; padding: 6px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 12px;}
        .rocket-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 10px var(--accent-cyan)); transition: 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

<div class="header-section" id="header">
    <span class="brand-name">বাগধারা মাস্টার প্রো</span>
    <div style="max-width:700px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: কানকাটা, বেহায়া)..." onkeyup="filter()">
        <div class="top-btns">
            <button class="btn btn-cyan active-mode" id="modeStudy" onclick="setMode('study')">📖 স্টাডি মোড</button>
            <button class="btn btn-cyan" id="modePractice" onclick="setMode('practice')">🎯 প্র্যাকটিস মোড</button>
            <button class="btn" id="favViewBtn" onclick="toggleFavView()">⭐ ফেভারিট</button>
            <button class="btn" onclick="scrollToLastRead()">🕒 শেষ পড়া</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

                "a": "অর্থ: অহংকার বোধ করা। বাক্য: হঠাৎ বড়লোক হয়ে সে যেন হাতির পাঁচ পা দেখছে।"
        },
        {
                "q": "হাতে জল না গলা",
                "a": "অর্থ: অতি কৃপণ। বাক্য: লোকটার তো হাতে জল গলে না, সে তোমাকে সাহায্য করবে?"
        },
        {
                "q": "হাতের পাঁচ",
                "a": "অর্থ: শেষ সম্বল। বাক্য: এই জমানো টাকা কটাই আমার হাতের পাঁচ, এগুলো খরচ করা যাবে না।"
        },
        {
                "q": "হালে পানি পাওয়া",
                "a": "অর্থ: সুবিধা করা। বাক্য: অনেক চেষ্টার পর অবশেষে লোকটা হালে পানি পেয়েছে।"
        },
        {
                "q": "ठेলা দিয়ে গঙ্গায় ফেলা",
                "a": "অর্থ: বিপদে ফেলা। বাক্য: তুমি তো দেখছি আমাকে ঠেলা দিয়ে গঙ্গায় ফেলে দিলে!"
        }
];

    let favorites = JSON.parse(localStorage.getItem('bilasBagdharaFavs')) || [];
    let showFavs = false;
    let currentMode = 'study'; // 'study' or 'practice'

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudy').classList.remove('active-mode');
        document.getElementById('modePractice').classList.remove('active-mode');
        
        if(mode === 'study') {
            document.getElementById('modeStudy').classList.add('active-mode');
        } else {
            document.getElementById('modePractice').classList.add('active-mode');
        }
        render();
    }

    function parseAnswer(text) {
        let ortho = text;
        let bakko = "";
        if (text.includes("বাক্য:")) {
            let parts = text.split("বাক্য:");
            ortho = parts[0].replace("অর্থ:", "").trim();
            bakko = parts[1].trim();
        } else {
            ortho = text.replace("অর্থ:", "").trim();
        }
        return { ortho, bakko };
    }

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavs && !isFav) return;

            const { ortho, bakko } = parseAnswer(item.a);
            const showClass = currentMode === 'study' ? 'show' : '';
            const sentenceHtml = bakko ? `<div class="bakko"><strong>বাক্য:</strong> ${bakko}</div>` : '';

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card" onclick="handleCardClick(${index})">
                    <div class="q-text">${item.q}</div>
                    <div id="ans-${index}" class="ans-wrapper ${showClass}">
                        <div class="ans-details">
                            <div class="ans-content">
                                <div class="ortho"><strong>অর্থ:</strong> ${ortho}</div>
                                ${sentenceHtml}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤</div>
            `;
            list.appendChild(div);
        });
    }

    function handleCardClick(index) {
        localStorage.setItem('bilasBagdharaLastRead', index + 1);
        
        if (currentMode === 'practice') {
            const ansDiv = document.getElementById(`ans-${index}`);
            ansDiv.classList.toggle('show');
        }
    }

    function toggleFav(idx) {
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('bilasBagdharaFavs', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').innerText = showFavs ? "📖 সব দেখুন" : "⭐ ফেভারিট";
        if(showFavs) {
            document.getElementById('favViewBtn').classList.add('active-mode');
        } else {
            document.getElementById('favViewBtn').classList.remove('active-mode');
        }
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('bilasBagdharaLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Initial Render
    render();
</script>
</body>
</html>
