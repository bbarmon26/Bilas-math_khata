        let currentTab = 'practice';
        let currentCategory = 'all';
        let favorites = [];

        try {
            const savedFavs = localStorage.getItem('bacademy_lit_favs');
            if (savedFavs) favorites = JSON.parse(savedFavs);
        } catch (e) {
            favorites = [];
        }

        let renderList = [...literatureDb];

        /* --- Header Auto-Hide on Scroll Logic --- */
        let lastScrollTop = 0;
        const mainHeader = document.getElementById('mainHeader');
        const scrollThreshold = 10;

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (Math.abs(lastScrollTop - scrollTop) <= scrollThreshold) return;

            if (scrollTop > lastScrollTop && scrollTop > 60) {
                if (mainHeader) mainHeader.classList.add('header-hidden');
            } else {
                if (mainHeader) mainHeader.classList.remove('header-hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, { passive: true });

        function setCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            renderCards();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(tab === 'practice') document.getElementById('nav-practice').classList.add('active');
            if(tab === 'favorites') document.getElementById('nav-fav').classList.add('active');

            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shuffleData() {
            renderList.sort(() => Math.random() - 0.5);
            renderCards();
            showToast("প্রশ্নগুলো এলোমেলো করা হয়েছে! 🔀", "#facc15");
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            if(favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast("বুকমার্ক থেকে সরানো হয়েছে", "#94a3b8");
            } else {
                favorites.push(id);
                showToast("বুকমার্কে সংরক্ষণ করা হয়েছে! ⭐", "#facc15");
            }
            try {
                localStorage.setItem('bacademy_lit_favs', JSON.stringify(favorites));
            } catch (e) {}
            renderCards();
        }

        /* --- Single Open Accordion Logic (Auto-close Previous) --- */
        function toggleCard(cardEl) {
            const isAlreadyOpen = cardEl.classList.contains('revealed');
            
            // পূর্বের যেকোনো খোলা কার্ড বন্ধ করা
            document.querySelectorAll('.lit-card.revealed').forEach(c => {
                c.classList.remove('revealed');
            });

            // ট্যাপ করা কার্ডটি খোলা (যদি আগে থেকে খোলা না থাকে)
            if (!isAlreadyOpen) {
                cardEl.classList.add('revealed');
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsList');
            const searchInput = document.getElementById('searchInput');
            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let filtered = renderList.filter(item => {
                const matchCategory = (currentCategory === 'all') || (item.category === currentCategory);
                const matchQuery = item.question.toLowerCase().includes(query) ||
                                   item.answer.toLowerCase().includes(query) ||
                                   (item.era && item.era.toLowerCase().includes(query)) ||
                                   (item.genre && item.genre.toLowerCase().includes(query)) ||
                                   (item.note && item.note.toLowerCase().includes(query));

                if(currentTab === 'favorites') {
                    return matchCategory && matchQuery && favorites.includes(item.id);
                }
                return matchCategory && matchQuery;
            });

            container.innerHTML = '';

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-book-bookmark" style="font-size: 32px; margin-bottom: 12px; opacity:0.4;"></i>
                        <p style="font-size: 15px;">কোনো প্রশ্ন পাওয়া যায়নি!</p>
                    </div>`;
                return;
            }

            filtered.forEach((item, index) => {
                const isFav = favorites.includes(item.id);
                const favClass = isFav ? 'fav-star active' : 'fav-star';
                const starIcon = isFav ? '★' : '☆';

                let card = document.createElement('div');
                card.id = `card-item-${item.id}`;
                card.className = 'lit-card';
                card.onclick = () => toggleCard(card);

                card.innerHTML = `
                    <div class="card-top-row">
                        <span class="tag-pill">#${index + 1}</span>
                        <div class="question-title">${item.question}</div>
                        <span class="${favClass}" onclick="toggleFav(${item.id}, event)">${starIcon}</span>
                    </div>

                    <div class="answer-drawer">
                        <div class="drawer-inner">
                            <div class="author-answer-box">
                                <i class="fa-solid fa-feather-pointed"></i>
                                <div class="author-text">${item.answer}</div>
                            </div>
                            <p class="meta-detail"><strong>🏛️ Era/Period:</strong> ${item.era || 'English Literature'}</p>
                            <p class="meta-detail"><strong>📖 Work/Genre:</strong> ${item.genre || 'Literature'}</p>
                            <p class="meta-detail"><strong>💡 Key Note:</strong> ${item.note}</p>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleRocketHub() {
            const menu = document.getElementById('rocketMenu');
            if (menu) {
                menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
            }
        }

        function jumpToCard() {
            const inputVal = document.getElementById('jumpInput').value.trim();
            const targetEl = document.getElementById(`card-item-${inputVal}`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                toggleRocketHub();
                targetEl.style.borderColor = 'var(--gold-glow)';
                setTimeout(() => { targetEl.style.borderColor = 'rgba(255, 255, 255, 0.08)'; }, 1600);
            } else {
                showToast("নম্বরটি খুঁজে পাওয়া যায়নি!", "#f43f5e");
            }
        }

        function showToast(msg, color) {
            const toast = document.getElementById('toastMsg');
            if (toast) {
                toast.innerText = msg; 
                toast.style.borderLeft = `4px solid ${color}`; 
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            }
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });
        renderCards();
    </script>
