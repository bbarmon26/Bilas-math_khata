<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>সাহিত্যকর্ম ও রচয়িতা | BILAS ACADEMY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0d0221;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;
            --neon-pink: #ff416c;
            --heart-red: #ef4444; 
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 🚀 Smooth Auto-Hide Header (Touch & Wheel Optimized) */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.88); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            padding: 8px 12px 12px 12px;
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
        }

        .header-section.header-hide {
            transform: translateY(-120%) !important;
        }

        .brand-header { text-align: center; padding: 2px 0; }
        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .search-box {
            width: 100%;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            outline: none;
            margin: 8px 0;
            font-size: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        
        .search-box:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .tab-single {
            flex-grow: 1;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            padding: 6px 0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .icon-group {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--neon-gold);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .icon-btn.active {
            background: rgba(246, 211, 101, 0.15);
            border-color: var(--neon-gold);
            box-shadow: 0 0 15px rgba(246, 211, 101, 0.3);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 135px 15px 140px 10px; 
        }

        .item-wrapper {
            position: relative;
            display: flex;
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px; 
            padding-right: 8px; 
            scroll-margin-top: 140px;
        }

        .serial { 
            color: var(--neon-blue); 
            font-weight: bold; 
            font-size: 13px; 
            min-width: 22px; 
            text-align: right;
            opacity: 0.6; 
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
        }

        .card {
            flex-grow: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 16px; 
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .card:active { 
            transform: scale(0.97); 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        .text-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px; 
            position: relative;
        }

        .sentence { 
            font-size: 17px; 
            color: #f8fafc; 
            font-weight: 500; 
            text-align: center;
            width: 100%;
            user-select: none;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        /* 🏷️ বন্ধনীর ভেতরের ক্যাটাগরির স্টাইল */
        .category-tag {
            font-size: 12.5px;
            color: #38bdf8;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 0.2px;
            margin-left: 2px;
        }
        
        .faded { 
            opacity: 0.15;
            transform: scale(0.96);
        }

        .one-word {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            text-align: center;
            font-size: 20px; 
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(246, 211, 101, 0.6);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, -50%) scale(0.8);
        }

        .show-ans {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-btn { 
            position: absolute;
            top: -10px; 
            right: -6px; 
            background: rgba(13, 2, 33, 0.85); 
            border-radius: 50%;
            padding: 4px;
            cursor: pointer; 
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5); 
        }

        .fav-btn:active {
            transform: scale(0.85);
        }

        /* 🚀 Permanently Floating Rocket Hub */
        .rocket-hub {
            position: fixed;
            right: 18px;
            bottom: max(32px, calc(18px + env(safe-area-inset-bottom, 0px)));
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 999;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(13, 2, 33, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border: 1px solid var(--glass-border);
            padding: 15px 10px;
            border-radius: 40px;
            margin-bottom: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            animation: slideUp 0.2s ease;
        }

        .r-circle {
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .r-circle.shuffle-active {
            border-color: var(--neon-gold);
            background: rgba(246, 211, 101, 0.2);
            color: var(--neon-gold);
            box-shadow: 0 0 10px rgba(246, 211, 101, 0.4);
        }

        .r-circle:active {
            transform: scale(0.9);
        }

        .jump-box {
            width: 38px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-pink);
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .go-btn { 
            background: var(--neon-pink); 
            border: none; 
            padding: 5px; 
            border-radius: 6px; 
            font-weight: bold; 
            color: #fff; 
            cursor: pointer; 
            font-size: 11px;
        }

        .rocket-icon {
            font-size: 34px; 
            cursor: pointer;
            filter: drop-shadow(0 0 10px var(--neon-blue));
            transition: transform 0.2s;
            user-select: none;
        }
        .rocket-icon:active { transform: scale(0.9); }

        /* 🚀 Glassmorphic Confirmation Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(26, 16, 61, 0.95), rgba(13, 2, 33, 0.98));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 22px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.25s ease;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--neon-gold);
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 9px 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-confirm {
            background: linear-gradient(to right, var(--neon-blue), #0088cc);
            color: #000;
            font-weight: 700;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="header-section" id="header">
    <div class="brand-header">
        <span class="brand-name">BILAS ACADEMY</span>
    </div>
    <div style="max-width:600px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="খুঁজুন (যেমন: কবর, উপন্যাস)..." onkeyup="filter()">
        
        <div class="control-row">
            <div class="tab-single">সাহিত্যকর্ম ও রচয়িতা</div>
            <div class="icon-group">
                <button class="icon-btn" onclick="scrollToLastRead()" title="শেষ পড়া">
                    <i data-lucide="clock" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
                </button>
                <button class="icon-btn" id="favViewBtn" onclick="toggleFavView()" title="ফেভারিট">
                    <i data-lucide="star" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <!-- 🔀 Shuffle/Reset Trigger Button -->
        <div class="r-circle" id="shuffleBtn" onclick="handleShuffleClick()" title="এলোমেলো বা পূর্বাবস্থায় ফিরুন">
            <i data-lucide="shuffle" stroke-width="2.5" class="w-[16px] h-[16px]"></i>
        </div>
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'}); toggleRocket();">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); toggleRocket();">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

<!-- 🚀 Shuffle / Reset Confirmation Modal -->
<div class="modal-overlay" id="shuffleModal">
    <div class="modal-card">
        <div class="modal-title" id="modalTitle">লিস্ট এলোমেলো করবেন?</div>
        <div class="modal-desc" id="modalDesc">
            সকল প্রশ্নের সিরিয়াল এলোমেলো হয়ে যাবে এবং এই অবস্থাটি অ্যাপ সেভ করে রাখবে।<br><br>
            <span style="color: var(--neon-blue); font-size: 13px;">💡 পরবর্তীতে পুনরায় আগের মূল সিরিয়ালে ফিরে যেতে এই বাটনে ৫ সেকেন্ড চেপে রাখুন অথবা আবার চাপ দিয়ে রিসেট সিলেক্ট করুন।</span>
        </div>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeShuffleModal()">বাতিল</button>
            <button class="modal-btn btn-confirm" id="modalConfirmBtn" onclick="executeModalAction()">হ্যাঁ, করুন</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>

    const originalData = [

{ q: "পাখির বাসা (শিশুতোষ কাব্যগ্রন্থ)", a: "ফররুখ আহমদ" },
{ q: "ক্রীতদাসের হাসি (উপন্যাস)", a: "শওকত ওসমান" },
{ q: "বিধ্বস্ত নীলিমা (কাব্যগ্রন্থ)", a: "শামসুর রাহমান" },
{ q: "লোক লোকান্তর (কাব্যগ্রন্থ)", a: "আল মাহমুদ" },
{ q: "জাহানারা (উপন্যাস)", a: "বন্দে আলী মিঞা" },
{ q: "সিন্দাবাদ (শিশুতোষ কাব্যগ্রন্থ)", a: "ফররুখ আহমদ" },
{ q: "ছায়া হরিণ (কাব্যগ্রন্থ)", a: "আহসান হাবীব" },
{ q: "হাওয়া বদল (উপন্যাস)", a: "অচিন্ত্যকুমার সেনগুপ্ত" },
{ q: "স্পেন বিজয় কাব্য (মহাকাব্য)", a: "ইসমাইল হোসেন সিরাজী" },

        ];

    let currentDisplayData = [];
    let favorites = JSON.parse(localStorage.getItem('sahityaKormoFavs_v2')) || [];
    let showFavs = false;

    // Load persisted state
    const savedOrder = localStorage.getItem('sahityaKormo_savedOrder');
    if (savedOrder) {
        try {
            currentDisplayData = JSON.parse(savedOrder);
        } catch(e) {
            currentDisplayData = [...originalData];
        }
    } else {
        currentDisplayData = [...originalData];
    }

    /* 🚀 Ultra Responsive Mobile & Desktop Scroll Handler */
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    const header = document.getElementById('header');

    window.addEventListener('scroll', () => {
        const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
        const diff = currentScrollY - lastScrollY;

        // Ignore iOS elastic top drag
        if (currentScrollY <= 20) {
            header.classList.remove('header-hide');
            lastScrollY = currentScrollY;
            return;
        }

        if (diff > 4) {
            // Scroll down
            header.classList.add('header-hide');
        } else if (diff < -4) {
            // Scroll up
            header.classList.remove('header-hide');
        }

        lastScrollY = currentScrollY;
    }, { passive: true });

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        updateShuffleBtnUI();
    }

    function updateShuffleBtnUI() {
        const btn = document.getElementById('shuffleBtn');
        const isShuffled = localStorage.getItem('sahityaKormo_isShuffled') === 'true';
        if (btn) {
            btn.classList.toggle('shuffle-active', isShuffled);
        }
    }

    /* 🚀 Modal Confirmation & State Management */
    let pendingAction = 'shuffle';

    function handleShuffleClick() {
        const isShuffled = localStorage.getItem('sahityaKormo_isShuffled') === 'true';
        const modal = document.getElementById('shuffleModal');
        const title = document.getElementById('modalTitle');
        const desc = document.getElementById('modalDesc');
        const confirmBtn = document.getElementById('modalConfirmBtn');

        if (isShuffled) {
            pendingAction = 'reset';
            title.innerText = "আগের মূল সিরিয়ালে ফিরবেন?";
            desc.innerHTML = "লিস্টটি বর্তমানে এলোমেলো অবস্থায় আছে। আপনি কি পূর্বের স্বাভাবিক ক্রমানুসারে ফেরত যেতে চান?<br><br><span style='color: var(--neon-gold); font-size: 13px;'>💡 এটি রিসেট করলে লিস্ট পুনরায় স্বাভাবিক ১ থেকে ২৩ সিরিয়ালে সাজানো হবে।</span>";
            confirmBtn.innerText = "হ্যাঁ, রিসেট করুন";
        } else {
            pendingAction = 'shuffle';
            title.innerText = "লিস্ট এলোমেলো করবেন?";
            desc.innerHTML = "সকল সাহিত্যকর্মের সিরিয়াল এলোমেলো হয়ে যাবে এবং এই অবস্থাটি অ্যাপ সেভ রাখবে।<br><br><span style='color: var(--neon-blue); font-size: 13px;'>💡 পুনরায় আগের অবস্থায় ফিরতে এই বাটনে ৫ সেকেন্ড চেপে রাখুন অথবা আবার চাপ দিয়ে রিসেট নিশ্চিত করুন।</span>";
            confirmBtn.innerText = "হ্যাঁ, এলোমেলো করুন";
        }

        modal.style.display = 'flex';
    }

    function closeShuffleModal() {
        document.getElementById('shuffleModal').style.display = 'none';
    }

    function executeModalAction() {
        closeShuffleModal();
        if (pendingAction === 'shuffle') {
            performShuffle();
        } else {
            resetOriginalData();
        }
    }

    function performShuffle() {
        let arr = [...currentDisplayData];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        currentDisplayData = arr;
        localStorage.setItem('sahityaKormo_savedOrder', JSON.stringify(arr));
        localStorage.setItem('sahityaKormo_isShuffled', 'true');
        render();
        updateShuffleBtnUI();
        toggleRocket();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetOriginalData() {
        currentDisplayData = [...originalData];
        localStorage.removeItem('sahityaKormo_savedOrder');
        localStorage.setItem('sahityaKormo_isShuffled', 'false');
        render();
        updateShuffleBtnUI();
        toggleRocket();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    /* 🚀 5-Second Long Press Instant Reset */
    const shuffleBtn = document.getElementById('shuffleBtn');
    let pressTimer = null;
    let isLongPressFired = false;

    function startPress(e) {
        isLongPressFired = false;
        pressTimer = setTimeout(() => {
            isLongPressFired = true;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            resetOriginalData();
            alert("✅ ৫ সেকেন্ড চেপে ধরায় লিস্ট পূর্বের স্বাভাবিক সিরিয়ালে রিসেট করা হয়েছে!");
        }, 5000);
    }

    function cancelPress() {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    }

    shuffleBtn.addEventListener('mousedown', startPress);
    shuffleBtn.addEventListener('touchstart', startPress, {passive: true});
    shuffleBtn.addEventListener('mouseup', cancelPress);
    shuffleBtn.addEventListener('mouseleave', cancelPress);
    shuffleBtn.addEventListener('touchend', cancelPress);
    shuffleBtn.addEventListener('touchcancel', cancelPress);

    function render() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        
        if (currentDisplayData.length === 0) return;

        currentDisplayData.forEach((item, index) => {
            const favKey = item.q;
            const isFav = favorites.includes(favKey);
            
            if (showFavs && !isFav) return;

            const heartStyle = isFav 
                ? 'fill: #ef4444; color: #ef4444; filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.6));' 
                : 'color: rgba(255,255,255,0.3);';

            // 🎯 () এর ভেতরের লেখাকে ছোট ও অন্য কালার দেওয়ার জন্য রিপ্লেস করা হচ্ছে
            const formattedQ = item.q.replace(/\(([^)]+)\)/g, '<span class="category-tag">($1)</span>');

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            div.innerHTML = `
                <span class="serial">${index + 1}.</span>
                <div class="card" onclick="magicFlip(${index})">
                    <div class="text-trigger">
                        <div id="q-${index}" class="sentence">${formattedQ}</div>
                        <div id="a-${index}" class="one-word">${item.a}</div>
                    </div>
                </div>
                <div class="fav-btn" onclick="toggleFav(event, '${favKey}')">
                    <i data-lucide="heart" stroke-width="2.5" class="w-[16px] h-[16px]" style="${heartStyle}"></i>
                </div>
            `;
            list.appendChild(div);
        });
        
        lucide.createIcons();
    }

    function magicFlip(index) {
        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        if (a.classList.contains('show-ans')) {
            q.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            q.classList.add('faded');
            a.classList.add('show-ans');
        }
        localStorage.setItem('sahityaKormoLastRead', index + 1);
    }

    function toggleFav(event, favKey) {
        event.stopPropagation(); 
        const pos = favorites.indexOf(favKey);
        if (pos === -1) favorites.push(favKey);
        else favorites.splice(pos, 1);
        localStorage.setItem('sahityaKormoFavs_v2', JSON.stringify(favorites));
        render();
    }

    function toggleFavView() {
        showFavs = !showFavs;
        document.getElementById('favViewBtn').classList.toggle('active', showFavs);
        render();
    }

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocket();
        }
    }

    function scrollToLastRead() {
        let last = localStorage.getItem('sahityaKormoLastRead');
        if(last) {
            const el = document.getElementById(`item-${last}`);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert("এই অংশে এখনও কোনো পড়া সেভ করা নেই।");
        }
    }

    updateShuffleBtnUI();
    render();
</script>
</body>
