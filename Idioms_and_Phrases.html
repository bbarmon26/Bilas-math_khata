<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idioms & Phrases Mastery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-accent: #3b82f6;
            --gold-glow: #f59e0b;
            --switch-pink: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 70px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-accent);
            margin-bottom: 5px;
        }

        /* Search Bar */
        .search-container {
            text-align: center;
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid #334155;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 600;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--primary-accent);
            border-color: var(--primary-accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        #btn-favorites.active {
            background-color: #f59e0b;
            border-color: #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        /* Card Styles */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.3s;
            position: relative;
        }

        .card:hover {
            border-color: #475569;
        }

        /* Favorite Star Button */
        .fav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 2rem;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            z-index: 10;
        }

        .fav-btn.active {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .fav-btn:hover {
            transform: scale(1.15);
        }

        .idiom-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            padding-right: 40px;
        }

        .meaning-line {
            font-size: 1.3rem;
            color: #e2e8f0;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .example-box {
            border-left: 5px solid var(--primary-accent);
            padding-left: 15px;
            margin-top: 10px;
            font-style: italic;
            color: #cbd5e1;
            font-size: 1.2rem;
            background: rgba(59, 130, 246, 0.05);
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 0 8px 8px 0;
        }

        /* Practice Mode Specifics */
        .practice-card {
            cursor: pointer;
        }
        
        .practice-card::after {
            content: '▼ চাপ দিন';
            position: absolute;
            right: 65px;
            top: 30px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        .practice-card.open::after {
            content: '▲ লুকান';
        }

        .hidden-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #475569;
            animation: fadeIn 0.3s ease-in-out;
        }

        .practice-card.open .hidden-details {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-result {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            margin-top: 30px;
        }

        /* --- 🚀 ROCKET NAVIGATION HUB --- */
        .rocket-hub {
            position: fixed;
            right: 20px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
            user-select: none;
        }

        .rocket-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            padding: 14px 10px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            align-items: center;
        }

        .r-circle {
            width: 40px;
            height: 40px;
            background: #1e293b;
            border: 1px solid var(--gold-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .r-circle:active {
            transform: scale(0.9);
            background: var(--primary-accent);
        }

        .jump-box {
            width: 48px;
            height: 34px;
            background: #020617;
            border: 1px solid var(--switch-pink);
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .go-btn {
            background: var(--switch-pink);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .go-btn:active {
            transform: scale(0.9);
        }

        .rocket-icon {
            font-size: 34px;
            cursor: pointer;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }

        .rocket-icon:active {
            transform: scale(0.9);
        }

    </style>
</head>

    <div class="rocket-icon" onclick="toggleRocketHub()">🚀</div>
</div>

    ];


    let currentTab = 'study';
    let favorites = JSON.parse(localStorage.getItem('idiomFavs')) || [];

    // ফেভারিট সেভ বা ডিলিট করার ফাংশন
    function toggleFavorite(id, event) {
        event.stopPropagation();
        
        if(favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        
        localStorage.setItem('idiomFavs', JSON.stringify(favorites));
        renderCards();
    }

    // ট্যাব চেঞ্জ করার ফাংশন
    function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + tabId).classList.add('active');
        renderCards();
    }

    // Practice কার্ড ওপেন/ক্লোজ করার ফাংশন
    function togglePracticeCard(element) {
        element.classList.toggle('open');
    }

    // সার্চ ফাংশন
    function searchIdioms() {
        renderCards();
    }

    // 🚀 রকেট মেনু টগল ফাংশন
    function toggleRocketHub() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    // 🚀 নির্দিষ্ট কার্ড নম্বরে জাম্প করার ফাংশন
    function jumpToCard() {
        const inputVal = document.getElementById('jumpInput').value.trim();
        const targetEl = document.getElementById(`card-item-${inputVal}`);
        if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toggleRocketHub();
            targetEl.style.borderColor = 'var(--gold-glow)';
            setTimeout(() => {
                targetEl.style.borderColor = '#334155';
            }, 1500);
        } else {
            alert("এই নম্বরের কোনো Idiom কার্ড খুঁজে পাওয়া যায়নি!");
        }
    }

    // স্ক্রিনে কার্ডগুলো দেখানোর ফাংশন
    function renderCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        let dataToRender = idiomsData.filter(item => {
            return item.idiom.toLowerCase().includes(query) || 
                   item.meaningEn.toLowerCase().includes(query) || 
                   item.meaningBn.includes(query);
        });

        if(currentTab === 'favorites') {
            dataToRender = dataToRender.filter(item => favorites.includes(item.number));
        }

        let html = '';

        if (dataToRender.length === 0) {
            html = '<div class="no-result">কোনো ফলাফল বা ফেভারিট পাওয়া যায়নি! 😞</div>';
        } else {
            dataToRender.forEach((item, index) => {
                const color = titleColors[index % titleColors.length];
                const isFav = favorites.includes(item.number);
                const starIcon = isFav ? '★' : '☆';
                const starClass = isFav ? 'fav-btn active' : 'fav-btn';

                const detailsHTML = `
                    <div class="pronunciation-line" style="color: #94a3b8; font-size: 1.1rem; margin-bottom: 5px;">
                        <strong>উচ্চারণ:</strong> ${item.idiomPron}
                    </div>
                    <div class="meaning-line">${item.meaningEn} - ${item.meaningBn}</div>
                    <div class="example-box">
                        <strong>Ex:</strong> ${item.exampleEn} <br>
                        <span style="font-size: 1.1rem; color: #94a3b8;">(${item.exampleBn})</span>
                    </div>
                `;

                if (currentTab === 'practice') {
                    html += `
                        <div class="card practice-card" id="card-item-${item.number}" onclick="togglePracticeCard(this)">
                            <button class="${starClass}" onclick="toggleFavorite(${item.number}, event)">${starIcon}</button>
                            <div class="idiom-title" style="color: ${color}">${item.number}. ${item.idiom}</div>
                            <div class="hidden-details">
                                ${detailsHTML}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="card" id="card-item-${item.number}">
                            <button class="${starClass}" onclick="toggleFavorite(${item.number}, event)">${starIcon}</button>
                            <div class="idiom-title" style="color: ${color}">${item.number}. ${item.idiom}</div>
                            <div>${detailsHTML}</div>
                        </div>
                    `;
                }
            });
        }

        document.getElementById('app-content').innerHTML = html;
    }

    renderCards();
</script>
