<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAS ACADEMY - ICT মাস্টার প্রো</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        :root {
            --bg: #0d0221;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-blue: #00d2ff;
            --neon-gold: #f6d365;
            --neon-pink: #ff416c;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Header Section */
        .header-section {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(13, 2, 33, 0.98);
            backdrop-filter: blur(25px);
            padding: 10px 20px 15px 20px;
            transition: transform 0.4s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-hide { transform: translateY(-110%); }

        .brand-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fav-logo { font-size: 24px; cursor: pointer; filter: drop-shadow(0 0 10px var(--neon-pink)); transition: 0.3s; }

        .mode-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            padding: 4px;
            margin: 10px auto;
            max-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 2px;
        }

        .mode-btn {
            flex: 1; padding: 10px 5px;
            border-radius: 50px; border: none;
            background: transparent; color: #999;
            font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s;
        }

        .mode-btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .search-box {
            width: 100%; padding: 12px 20px;
            border-radius: 50px; border: 1px solid rgba(0, 210, 255, 0.3);
            background: rgba(0, 0, 0, 0.4); color: #fff;
            outline: none; margin-top: 10px; box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 240px 20px 100px 20px;
        }

        .item-wrapper { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 25px; scroll-margin-top: 250px; }
        .serial { color: var(--neon-blue); font-weight: bold; font-size: 13px; min-width: 25px; opacity: 0.4; margin-top: 15px; }

        .card {
            flex-grow: 1;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            min-height: 80px;
            position: relative;
            overflow: hidden;
            display: grid;
            align-items: center;
        }

        /* Study Layout */
        .study-content { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .study-word { color: var(--neon-blue); font-weight: 700; font-size: 18px; border-bottom: 1px dashed rgba(0, 210, 255, 0.2); padding-bottom: 8px; }
        .study-ans { color: var(--neon-gold); font-weight: 600; font-size: 16px; line-height: 1.5; }

        /* Practice Layout - Dynamic Height Fix */
        .practice-trigger { padding: 18px; cursor: pointer; display: grid; grid-template-columns: 1fr; }
        .p-word, .p-ans { grid-area: 1 / 1; transition: 0.3s; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.5; }
        
        .p-word { font-size: 18px; color: #fff; font-weight: 600; }
        .faded { opacity: 0.05; visibility: hidden; }

        .p-ans {
            color: var(--neon-gold); font-size: 17px; font-weight: 700;
            text-shadow: 0 0 10px rgba(246, 211, 101, 0.3);
            opacity: 0; transform: scale(0.9); visibility: hidden;
        }
        .show-ans { opacity: 1; transform: scale(1); visibility: visible; }

        .item-fav-btn { font-size: 20px; color: rgba(255,255,255,0.04); cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .item-fav-btn.active { color: var(--neon-pink); filter: drop-shadow(0 0 8px var(--neon-pink)); }

        /* Rocket */
        .rocket-hub { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 2000; }
        .rocket-menu {
            display: none; flex-direction: column; gap: 15px; background: rgba(26, 16, 61, 0.98);
            padding: 25px 12px; border-radius: 50px; border: 1px solid var(--neon-blue);
            margin-bottom: 15px; backdrop-filter: blur(15px); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .r-circle { width: 50px; height: 50px; background: #1a103d; border: 1px solid var(--neon-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .jump-box { width: 50px; height: 40px; background: #000; border: 1px solid var(--neon-pink); color: white; text-align: center; border-radius: 12px; }
        .go-btn { background: var(--neon-pink); border: none; padding: 8px; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; }
        .rocket-icon { font-size: 48px; cursor: pointer; filter: drop-shadow(0 0 15px var(--neon-blue)); transition: 0.3s; }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="header-section" id="header">
    <div class="brand-area">
        <span class="brand-name">BILAS ACADEMY</span>
        <div class="fav-logo" id="favMainBtn" onclick="toggleFavView()">❤️</div>
    </div>
    
    <div class="mode-switcher">
        <button class="mode-btn active" id="studyBtn" onclick="setMode('study')">Study Mode</button>
        <button class="mode-btn" id="practiceBtn" onclick="setMode('practice')">Practice Mode</button>
    </div>

    <div style="max-width:600px; margin: 0 auto;">
        <input type="text" id="search" class="search-box" placeholder="আইসিটি টপিক খুঁজুন..." onkeyup="filter()">
    </div>
</div>

<div class="container">
    <div id="main-list"></div>
</div>

<div class="rocket-hub">
    <div class="rocket-menu" id="rocketMenu">
        <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'}); toggleRocket();">⬆️</div>
        <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
        <button class="go-btn" onclick="jumpTo()">GO</button>
        <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); toggleRocket();">⬇️</div>
    </div>
    <div class="rocket-icon" onclick="toggleRocket()">🚀</div>
</div>

        { q: "মৌলিক লজিক গেইট কী? কোন গেইটে একটি মাত্র ইনপুট ও আউটপুট থাকে? (২২১)", a: "বুলিয়ান অ্যালজেবরার মৌলিক অপারেশনগুলো বাস্তবায়নের গেইটই হলো মৌলিক লজিক গেইট। মৌলিক গেইট ৩টি: OR, AND, NOT। এর মধ্যে NOT Gate-এ একটি মাত্র ইনপুট ও আউটপুট থাকে।" },

        { q: "নেটওয়ার্ক টপোলজি বলতে কী বুঝায়? ৫টি নেটওয়ার্ক টপোলজির নাম লিখুন। (২৫৭)", a: "দুই বা ততোধিক কম্পিউটারকে ক্যাবল বা হাবের মাধ্যমে নেটওয়ার্কের আওতায় আনার পদ্ধতিই হলো টপোলজি। ৫টি নাম: ক) বাস, খ) রিং, গ) স্টার, ঘ) মেস এবং ঙ) ট্রি টপোলজি।" },

        { q: "পরিমাপ লিখুন: ১ মেগাবাইট, ১ বাইট, ১ কিলোবাইট, ১ পেটাবাইট, ১ টেরাবাইট, ১ নিবল। (২৫৯)", a: "৪ বিট = ১ নিবল; ৮ বিট = ১ বাইট; ১০২৪ বাইট = ১ কিলোবাইট; ১০২৪ কিলোবাইট = ১ মেগাবাইট; ১০২৪ মেগাবাইট = ১ গিগাবাইট; ১০২৪ গিগাবাইট = ১ টেরাবাইট; ১০২৪ টেরাবাইট = ১ পেটাবাইট।" },

        { q: "বিশ্বের প্রথম স্বয়ংক্রিয় গণনা যন্ত্রের নাম কী? (২৭২)", a: "MARK-1" },

        { q: "পারসোনাল কম্পিউটারে অপারেটিং লোডিং করার কাজকে কি বলে? (২৮২)", a: "Booting" },
        { q: "RAM এবং ROM কি? (২৮৩)", a: "RAM: র‍্যাম হচ্ছে কম্পিউটারের অস্থায়ী মেমরি যেখানে কম্পিউটারের চলমান সব ডেটা এবং তথ্য সংরক্ষণ হয়। ROM: রম হচ্ছে কম্পিউটারের স্থায়ী স্মৃতি যা কম্পিউটার বন্ধ করলেও তথ্যাবলী অক্ষত থাকে।" },
        { q: "স্ক্যানার কি? স্ক্যানারের কাজ কি? (২৮৪)", a: "কোন ছবি বা লেখা হুবহু ডিজিটাল ডাটায় বা কম্পিউটারে সংরক্ষণের জন্য ব্যবহৃত যন্ত্র হচ্ছে স্ক্যানার। স্ক্যানারের কাজ হচ্ছে কোন ডকুমেন্ট হুবহু কম্পিউটারে স্ক্যান করে সংরক্ষণ করা।" },
        { q: "OMR কি? OMR এর কাজ কি? (২৮৫)", a: "OMR এক ধরনের ইনপুট ডিভাইস, যা পেন্সিল বা কালির দাগ বুঝতে পারে। পরীক্ষার উত্তরপত্র মূল্যায়নের কাজে OMR ব্যবহার করা হয়।" },
        { q: "ডিস্ক বলতে কি বোঝেন? ডিস্ক কত প্রকার ও কি কি? (২৮৬)", a: "ডিস্ক হচ্ছে এক ধরনের স্টোরেজ ডিভাইস। হার্ডডিস্ক ৪ প্রকার: PATA Hard Disk, SATA Hard Disk, SCSI Hard Disk, SSD Hard Disk।" },
        { q: "প্রিন্টার বলতে কি বোঝেন? প্রিন্টার কি ধরণের ডিভাইস? (২৮৭)", a: "যে যন্ত্রের মাধ্যমে কম্পিউটারে প্রাপ্ত ফলাফল কাগজে ছাপানো যায় তাকে প্রিন্টার বলে। প্রিন্টার আউটপুট ডিভাইস।" },
        { q: "Bluetooth কি? সংক্ষেপে বর্ণনা করুন। (২৮৮)", a: "Bluetooth হচ্ছে তারবিহীন পার্সোনাল এরিয়া নেটওয়ার্ক প্রটোকল যা রেডিও ওয়েভ ব্যবহার করে স্বল্প দূরত্বে ডেটা আদান-প্রদান করে।" },
        { q: "ডেটাবেস কাকে বলে? ডেটাবেস ব্যবহারের সুবিধা ও অসুবিধা লিখুন। (২৮৯)", a: "ডেটাবেস হলো কোন কম্পিউটার সিস্টেমে সঞ্চিত উপাত্ত বা রেকর্ডসমূহের একটি কাঠামাবদ্ধ সংগ্রহ। সুবিধা: ক) অতি দ্রুত ডেটা উপস্থাপন করা যায়, খ) অল্প সময়ে ডেটার বিন্যাস ঘটানো যায়। অসুবিধা: ক) নিরাপত্তা ঝুঁকি থাকে, খ) অনেক ডেটাবেস প্রক্রিয়াকরণ পদ্ধতি ধীর গতি সম্পন্ন।" },
        { q: "IP Address এবং ডোমেইন নেইম কী? (২৯০)", a: "IP Address: IP Address হচ্ছে Internet Protocol Address। ইন্টারনেটের সাথে সংযুক্ত প্রতিটি কম্পিউটারের একটি ঠিকানা থাকে এ ঠিকানাকে বলা হয় IP Address। ডোমেইন নেইম: ডোমেইন নেইম হচ্ছে একা বা একাধিক আইপি এড্রেসকে সনাক্ত করার জন্য একটি অদ্বিতীয় আলফানিউমেরিক (ক্যারেক্টর এবং নাম্বার সম্বলিত) ঠিকানা।" },
        { q: "ISP কী? ISP এর দায়িত্বগুলো কী কী? (২৯১)", a: "ISP হলো Internet Service Provider বা ইন্টারনেট সেবা প্রদানকারী প্রতিষ্ঠান, যারা গ্রাহকদের উচ্চগতির ইন্টারনেট সংযোগ ও বিভিন্ন নেটওয়ার্ক সেবা প্রদান করে।" },
                { q: "সার্চ ইঞ্জিন বলতে কি বুঝায়? কয়েকটি সার্চ ইঞ্জিনের নাম লিখুন। (২৯৩)", a: "সার্চ ইঞ্জিন হলো এক প্রকার সফটওয়্যার যা ইন্টারনেটের বিভিন্ন সার্ভারে থাকা তথ্য খুঁজে প্রদর্শন করে। যেমন: Google, Yahoo, Bing।" },

        { q: "IPv6 এর অ্যাড্রেস কত বিটের? (৪৫৬)", a: "১২৮" },

    ];

    let favorites = JSON.parse(localStorage.getItem('ictFavs_v2')) || [];
    let currentMode = 'study';
    let showFavsOnly = false;

    function setMode(mode) {
        currentMode = mode;
        showFavsOnly = false;
        document.getElementById('studyBtn').classList.toggle('active', mode === 'study');
        document.getElementById('practiceBtn').classList.toggle('active', mode === 'practice');
        renderList();
    }

    function toggleFavView() {
        showFavsOnly = !showFavsOnly;
        document.getElementById('favMainBtn').style.filter = showFavsOnly ? "drop-shadow(0 0 20px var(--neon-pink)) scale(1.2)" : "drop-shadow(0 0 10px var(--neon-pink))";
        renderList();
    }

    function renderList() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";
        data.forEach((item, index) => {
            const isFav = favorites.includes(index);
            if (showFavsOnly && !isFav) return;

            const div = document.createElement('div');
            div.className = 'item-wrapper';
            div.id = `item-${index + 1}`;
            
            let cardContent = "";
            if (currentMode === 'study') {
                cardContent = `
                    <div class="study-content">
                        <div class="study-word">${item.q}</div>
                        <div class="study-ans">${item.a}</div>
                    </div>`;
            } else {
                cardContent = `
                    <div class="practice-trigger" onclick="magicFlip(${index})">
                        <div id="q-${index}" class="p-word">${item.q}</div>
                        <div id="a-${index}" class="p-ans">${item.a}</div>
                    </div>`;
            }

            div.innerHTML = `
                <span class="serial">${index + 1}</span>
                <div class="card">${cardContent}</div>
                <div class="item-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${index})">❤️</div>
            `;
            list.appendChild(div);
        });
    }

    function magicFlip(index) {
        const q = document.getElementById(`q-${index}`);
        const a = document.getElementById(`a-${index}`);
        if (a.classList.contains('show-ans')) {
            q.classList.remove('faded');
            a.classList.remove('show-ans');
        } else {
            q.classList.add('faded');
            a.classList.add('show-ans');
        }
    }

    function toggleFav(idx) {
        const pos = favorites.indexOf(idx);
        if (pos === -1) favorites.push(idx);
        else favorites.splice(pos, 1);
        localStorage.setItem('ictFavs_v2', JSON.stringify(favorites));
        renderList();
    }

    function toggleRocket() {
        const menu = document.getElementById('rocketMenu');
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    function jumpTo() {
        let num = document.getElementById('jumpInput').value;
        let el = document.getElementById(`item-${num}`);
        if(el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); toggleRocket(); }
    }

    let lastScroll = 0;
    window.onscroll = () => {
        let top = window.scrollY;
        const header = document.getElementById('header');
        if (top > lastScroll && top > 100) header.classList.add('header-hide');
        else header.classList.remove('header-hide');
        lastScroll = top;
    };

    function filter() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item-wrapper').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    }

    renderList();
</script>
