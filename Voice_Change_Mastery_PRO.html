<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BILAS ACADEMY | Voice Change PRO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        :root {
            --bg-dark: #030712;
            --container-bg: #0b1329;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-glow: rgba(56, 189, 248, 0.25);
            --mint-green: #2dd4bf;
            --gold-glow: #facc15;
            --switch-pink: #f43f5e;
            --sky-blue: #38bdf8;
            --purple-glow: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 100%;
            max-width: 580px;
            min-height: 100vh;
            background-color: var(--container-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Header */
        header { 
            position: sticky; top: 0;
            padding: 16px 20px 12px; 
            display: flex; flex-direction: column; gap: 12px;
            z-index: 50; 
            background: rgba(11, 19, 41, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #a855f7, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn { 
            background: rgba(255, 255, 255, 0.05); color: var(--text-main); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; 
            cursor: pointer; display: flex; align-items: center; gap: 6px; 
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
        }
        .action-btn:active { transform: scale(0.92); }

        /* Search Box */
        .search-box { display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 10px 16px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; }
        .search-box i { color: var(--text-muted); margin-right: 12px; font-size: 14px; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 13.5px; }
        .search-box input::placeholder { color: #64748b; }

        /* Content Area */
        .content-area { 
            flex: 1; 
            padding: 16px 16px 120px; 
            z-index: 10; 
            position: relative; 
        }

        /* --- 60FPS CARD ARCHITECTURE --- */
        .card { 
            background: var(--card-bg); 
            padding: 18px 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-left: 4px solid var(--sky-blue); 
            margin-bottom: 16px; 
            position: relative; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); 
            user-select: none;
            will-change: transform, border-color, box-shadow;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { border-color: var(--border-glow); }
        .card:active { transform: scale(0.99); }
        
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge-cluster { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        
        .serial-badge { background: var(--sky-blue); color: #020617; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .book-badge { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); }
        .type-badge { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(56, 189, 248, 0.2)); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

        .fav-star { font-size: 18px; color: rgba(255, 255, 255, 0.2); cursor: pointer; padding: 2px 6px; transition: color 0.2s ease, transform 0.2s ease; }
        .fav-star:active { transform: scale(1.2); }
        .fav-star.active { color: var(--gold-glow); text-shadow: 0 0 10px var(--gold-glow); }

        /* Voice Sentence Rows */
        .voice-section { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
        
        .question-line { 
            font-size: 16.5px; 
            line-height: 1.5; 
            font-weight: 600; 
            color: #ffffff;
        }

        .answer-line {
            font-size: 16.5px;
            line-height: 1.5;
            font-weight: 600;
            color: var(--mint-green);
        }

        /* 60FPS Smooth Placeholder & Answer Box */
        .practice-card { cursor: pointer; }
        
        .answer-placeholder { 
            display: inline-block; 
            color: var(--gold-glow); 
            background: rgba(250, 204, 21, 0.08); 
            border: 1px dashed var(--gold-glow); 
            padding: 5px 12px; 
            border-radius: 8px; 
            font-size: 13.5px; 
            font-weight: 600;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .practice-card.revealed .answer-placeholder { display: none; }

        .hidden-answer-content {
            display: none;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .practice-card.revealed .hidden-answer-content {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 60FPS Smooth Accordion Details Box */
        .details-box { 
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            padding-top: 0;
            border-top: 1px dashed transparent;
            will-change: max-height, opacity, margin-top;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, margin-top 0.25s ease, padding-top 0.25s ease, border-color 0.25s ease;
            display: flex; 
            flex-direction: column; 
            gap: 6px;
        }
        .card:not(.practice-card) .details-box,
        .practice-card.revealed .details-box { 
            max-height: 500px;
            opacity: 1;
            margin-top: 14px;
            padding-top: 12px;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .meta-line { font-size: 14px; color: #cbd5e1; line-height: 1.5; }
        .meta-line strong { color: var(--sky-blue); font-weight: 700; margin-right: 4px; }
        
        /* Meaning Row with Inline Compact Button */
        .meaning-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .meaning-action-row .meta-line.meaning {
            flex: 1;
        }
        .meaning-action-row .meta-line.meaning strong { color: var(--mint-green); }

        /* Compact Inline Explanation Button */
        .btn-exp-inline { 
            background: rgba(250, 204, 21, 0.08); 
            border: 1px solid rgba(250, 204, 21, 0.35); 
            color: var(--gold-glow); 
            font-size: 11px; 
            font-weight: 700; 
            padding: 3px 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .btn-exp-inline:hover { background: rgba(250, 204, 21, 0.2); border-color: var(--gold-glow); }
        .btn-exp-inline:active { transform: scale(0.92); }
        
        .explanation-box { 
            display: none; 
            margin-top: 8px; 
            padding: 12px 14px; 
            background: rgba(0, 0, 0, 0.4); 
            border-left: 3px solid var(--gold-glow); 
            border-radius: 8px; 
            font-size: 13px; color: #cbd5e1; line-height: 1.6;
            animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hi-gold { color: var(--gold-glow); font-weight: 700; background: rgba(250, 204, 21, 0.12); padding: 1px 4px; border-radius: 4px; }
        .hi-mint { color: var(--mint-green); font-weight: 700; background: rgba(45, 212, 191, 0.12); padding: 1px 4px; border-radius: 4px; }

        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-6px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* --- 🚀 ROCKET NAVIGATION --- */
        .rocket-hub { position: fixed; right: 16px; bottom: 84px; display: flex; flex-direction: column; align-items: center; z-index: 999; }
        .rocket-menu { display: none; flex-direction: column; gap: 8px; background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(15px); padding: 12px 8px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .r-circle { width: 38px; height: 38px; background: #1e293b; border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 13px; font-weight: bold; transition: transform 0.15s ease; }
        .r-circle:active { transform: scale(0.9); }
        .jump-box { width: 44px; height: 32px; background: #030712; border: 1px solid var(--switch-pink); color: white; text-align: center; border-radius: 8px; font-size: 12px; outline: none; }
        .go-btn { background: var(--switch-pink); border: none; padding: 4px; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; font-size: 10px; }
        .rocket-icon { font-size: 32px; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .rocket-icon:active { transform: scale(0.9); }

        /* Floating Nav */
        .bottom-nav { 
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); 
            width: calc(100% - 28px); max-width: 500px; 
            background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; padding: 10px 8px; 
            border: 1px solid rgba(255, 255, 255, 0.12); z-index: 1000; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .nav-item { color: #64748b; font-size: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--sky-blue); transform: translateY(-2px); }
        .nav-item.active span { color: var(--sky-blue); font-weight: 700; }

        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 12px; font-size: 12px; color: white; display: none; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toast" id="toastMsg">Saved!</div>

        <!-- HEADER -->
        <header>
            <div class="brand-bar">
                <div class="logo">
                    <h1>BILAS</h1>
                    <p>Voice Change Mastery PRO</p>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="btnShuffle" style="display: none;" onclick="shufflePracticeData()">
                        <i class="fa-solid fa-shuffle"></i> <span>Shuffle</span>
                    </button>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="বাক্য, উচ্চারণ, অর্থ বা নিয়ম খুঁজুন..." id="searchInput" oninput="renderVoiceCards()">
            </div>
        </header>

        <!-- MAIN LIST AREA -->
        <div class="content-area" id="cardsList"></div>

        <!-- 🚀 ROCKET NAVIGATION HUB -->
        <div class="rocket-hub" id="rocketHub">
            <div class="rocket-menu" id="rocketMenu">
                <div class="r-circle" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆</div>
                <input type="number" id="jumpInput" class="jump-box" placeholder="নং">
                <button class="go-btn" onclick="jumpToCard()">GO</button>
                <div class="r-circle" onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">⬇</div>
            </div>
            <div class="rocket-icon" onclick="toggleRocketHub()">🚀</div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-study" onclick="switchMode('study')">
                <i class="fa-solid fa-book-open"></i><span>Study</span>
            </div>
            <div class="nav-item" id="nav-practice" onclick="switchMode('practice')">
                <i class="fa-solid fa-bolt"></i><span>Practice</span>
            </div>
            <div class="nav-item" id="nav-fav" onclick="switchMode('favorites')">
                <i class="fa-solid fa-star"></i><span>Saved</span>
            </div>
        </div>
    </div>

    <script>
        const voiceDb = [
    {
        id: 1,
        bookNo: "1.a",
        type: "Active ➔ Passive",
        question: "The mango tastes sweet.",
        answer: "The mango is sweet when it is tasted.",
        aPron: "দ্য ম্যাঙ্গো ইজ সুইট হোয়েন ইট ইজ টেস্টেড।",
        aMeaning: "আমটি মিষ্টি যখন এটি আস্বাদন করা হয়।",
        rule: "বিস্তারিত ব্যাখ্যা: এটি একটি <span class='hi-gold'>Quasi-passive Verb</span> (যেসব Verb গঠনে Active কিন্তু অর্থে Passive)। কোনো ইন্দ্রিয়গ্রাহ্য অনুভূতির ক্ষেত্রে Passive করার নিয়ম: <span class='hi-mint'>Subject + be verb (is/are) + Adjective + when + it is/they are + মূল verb-এর V3</span>। এখানে 'The mango' অনুযায়ী 'is sweet when it is tasted' বসেছে।"
    },
    {
        id: 2,
        bookNo: "1.b",
        type: "Active ➔ Passive",
        question: "Who killed the snake?",
        answer: "By whom was the snake killed?",
        aPron: "বাই হুম ওয়াজ দ্য স্নেক কিল্ড?",
        aMeaning: "কার দ্বারা সাপটি মারা হয়েছিল?",
        rule: "বিস্তারিত ব্যাখ্যা: <span class='hi-gold'>Who</span> যুক্ত Past Indefinite Tense-এর Interrogative বাক্যকে Passive করার নিয়ম: <span class='hi-mint'>By whom + Tense অনুযায়ী Auxiliary verb (was/were) + Object-টি Subject + মূল Verb-এর V3 + ?</span>। এখানে 'the snake' একবচন হওয়ায় 'was' বসেছে।"
    },
    {
        id: 3,
        bookNo: "1.c",
        type: "Active ➔ Passive",
        question: "Do it.",
        answer: "Let it be done.",
        aPron: "লেট ইট বি ডান।",
        aMeaning: "এটি করা হোক।",
        rule: "বিস্তারিত ব্যাখ্যা: মূল Verb দিয়ে শুরু হওয়া আদেশমূলক <span class='hi-gold'>Imperative Sentence</span>-কে Passive করার নিয়ম: <span class='hi-mint'>Let + Object + be + Verb-এর Past Participle (V3)</span>। এখানে Object হলো 'it' এবং 'do'-এর V3 হলো 'done'।"
    },
    {
        id: 4,
        bookNo: "1.d",
        type: "Active ➔ Passive",
        question: "She fans herself.",
        answer: "She is fanned by herself.",
        aPron: "শি ইজ ফ্যান্ড বাই হারসেলফ।",
        aMeaning: "সে তার নিজের দ্বারা বাতাসিত হয়।",
        rule: "বিস্তারিত ব্যাখ্যা: বাক্যে <span class='hi-gold'>Reflexive Object</span> (herself, himself, myself ইত্যাদি) থাকলে Subject পরিবর্তন হয় না। নিয়ম: <span class='hi-mint'>মূল Subject + Tense অনুযায়ী be verb + V3 + by + Reflexive Object</span>। Present Indefinite হওয়ায় 'is fanned' বসেছে।"
    },
    {
        id: 5,
        bookNo: "1.e",
        type: "Active ➔ Passive",
        question: "People laugh at him.",
        answer: "He is laughed at by people.",
        aPron: "হি ইজ লাফড অ্যাট বাই পিপল।",
        aMeaning: "সে মানুষের দ্বারা উপহাসের শিকার হয়।",
        rule: "বিস্তারিত ব্যাখ্যা: <span class='hi-gold'>Group Verb / Prepositional Verb</span> (laugh at) যুক্ত বাক্যে Preposition-টি সর্বদা Verb-এর Past Participle-এর সাথে একসাথে যুক্ত থাকে। গঠন: <span class='hi-mint'>Object-এর Subject (He) + be verb (is) + V3 সাথে Preposition (laughed at) + by + Subject (people)</span>।"
    },
    {
        id: 6,
        bookNo: "2.a",
        type: "Active ➔ Passive",
        question: "I have written a letter.",
        answer: "A letter has been written by me.",
        aPron: "আ লেটার হ্যাজ বিন রিটেন বাই মি।",
        aMeaning: "আমার দ্বারা একটি চিঠি লেখা হয়েছে।",
        rule: "বিস্তারিত ব্যাখ্যা: <span class='hi-gold'>Present Perfect Tense</span>-এর Voice Change নিয়ম: <span class='hi-mint'>Object-এর Subject + have been / has been + V3 + by + Subject-এর Object</span>। এখানে 'A letter' 3rd person singular হওয়ায় 'has been' বসেছে।"
    },
    {
        id: 7,
        bookNo: "2.b",
        type: "Active ➔ Passive",
        question: "I offered him a job.",
        answer: "He was offered a job by me.",
        aPron: "হি ওয়াজ অফারড আ জব বাই মি।",
        aMeaning: "তাকে আমার দ্বারা একটি চাকরির প্রস্তাব দেওয়া হয়েছিল।",
        rule: "বিস্তারিত ব্যাখ্যা: বাক্যে দুটি Object থাকলে (ব্যক্তিবাচক 'him' এবং বস্তুবাচক 'a job') ব্যক্তিবাচক Object-টিকে Subject বানিয়ে Passive করা শ্রেয়। Past Indefinite হওয়ায় গঠন: <span class='hi-mint'>He + was + offered + অতিরিক্ত Object (a job) + by + me</span>।"
    },
    {
        id: 8,
        bookNo: "2.c",
        type: "Passive ➔ Active",
        question: "The Science Exhibition was opened by the Principal.",
        answer: "The Principal opened the Science Exhibition.",

        let currentMode = 'study';
        let favorites = JSON.parse(localStorage.getItem('bacademy_voice_favs')) || [];
        let practiceList = null;

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(mode === 'study') document.getElementById('nav-study').classList.add('active');
            if(mode === 'practice') document.getElementById('nav-practice').classList.add('active');
            if(mode === 'favorites') document.getElementById('nav-fav').classList.add('active');

            document.getElementById('btnShuffle').style.display = (mode === 'practice') ? 'flex' : 'none';

            if(mode === 'practice' && !practiceList) {
                practiceList = [...voiceDb];
            }

            renderVoiceCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shufflePracticeData() {
            practiceList = [...voiceDb].sort(() => Math.random() - 0.5);
            renderVoiceCards();
            showToast("প্রশ্নগুলো এলোমেলো করা হয়েছে! 🔀", "#2dd4bf");
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            if(favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast("নোটবুক থেকে মুছে ফেলা হয়েছে", "#64748b");
            } else {
                favorites.push(id);
                showToast("নোটবুকে সেভ করা হয়েছে! ⭐", "#f59e0b");
            }
            localStorage.setItem('bacademy_voice_favs', JSON.stringify(favorites));
            renderVoiceCards();
        }

        function togglePracticeCard(cardEl) {
            cardEl.classList.toggle('revealed');
        }

        function toggleExplanation(event, index) {
            event.stopPropagation();
            const expBox = document.getElementById(`exp-${index}`);
            const btn = event.currentTarget;
            if(expBox.style.display === 'block') {
                expBox.style.display = 'none';
                btn.innerHTML = `<i class="fa-regular fa-lightbulb"></i> ব্যাখ্যা`;
            } else {
                expBox.style.display = 'block';
                btn.innerHTML = `<i class="fa-solid fa-xmark"></i> বন্ধ`;
            }
        }

        function renderVoiceCards() {
            const container = document.getElementById('cardsList');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let dataset = (currentMode === 'practice') ? practiceList : voiceDb;

            let filtered = dataset.filter(item => {
                const matchQuery = item.question.toLowerCase().includes(query) ||
                                   item.answer.toLowerCase().includes(query) ||
                                   item.aMeaning.includes(query) ||
                                   item.bookNo.toLowerCase().includes(query);
                if(currentMode === 'favorites') {
                    return matchQuery && favorites.includes(item.id);
                }
                return matchQuery;
            });

            container.innerHTML = '';

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-folder-open" style="font-size: 32px; margin-bottom: 12px; opacity:0.5;"></i>
                        <p style="font-size: 15px;">কোনো ফলাফল পাওয়া যায়নি!</p>
                    </div>`;
                return;
            }

            filtered.forEach((item, index) => {
                const isFav = favorites.includes(item.id);
                const favClass = isFav ? 'fav-star active' : 'fav-star';
                const starIcon = isFav ? '★' : '☆';

                let card = document.createElement('div');
                card.id = `card-item-${item.id}`;

                if(currentMode === 'practice') {
                    card.className = 'card practice-card';
                    card.onclick = () => togglePracticeCard(card);
                    card.innerHTML = `
                        <div class="card-header-row">
                            <div class="badge-cluster">
                                <span class="serial-badge" style="background:var(--mint-green);">#${index + 1}</span>
                                <span class="book-badge"><i class="fa-solid fa-bookmark"></i> Book: ${item.bookNo}</span>
                                <span class="type-badge">${item.type}</span>
                            </div>
                            <span class="${favClass}" onclick="toggleFav(${item.id}, event)">${starIcon}</span>
                        </div>

                        <div class="voice-section">
                            <div class="question-line">${item.question}</div>
                            <div class="answer-line" style="margin-top: 2px;">
                                <span class="answer-placeholder">❓ উত্তর দেখতে কার্ডে চাপ দিন</span>
                                <span class="hidden-answer-content">${item.answer}</span>
                            </div>
                        </div>

                        <div class="details-box">
                            <p class="meta-line"><strong>🗣️</strong> ${item.aPron}</p>
                            <div class="meaning-action-row">
                                <p class="meta-line meaning"><strong>👉</strong> ${item.aMeaning}</p>
                                <button class="btn-exp-inline" onclick="toggleExplanation(event, ${item.id})"><i class="fa-regular fa-lightbulb"></i> ব্যাখ্যা</button>
                            </div>
                            <div class="explanation-box" id="exp-${item.id}">${item.rule}</div>
                        </div>
                    `;
                } else {
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header-row">
                            <div class="badge-cluster">
                                <span class="serial-badge">#${index + 1}</span>
                                <span class="book-badge"><i class="fa-solid fa-bookmark"></i> Book: ${item.bookNo}</span>
                                <span class="type-badge">${item.type}</span>
                            </div>
                            <span class="${favClass}" onclick="toggleFav(${item.id}, event)">${starIcon}</span>
                        </div>

                        <div class="voice-section">
                            <div class="question-line">${item.question}</div>
                            <div class="answer-line">${item.answer}</div>
                        </div>

                        <div class="details-box">
                            <p class="meta-line"><strong>🗣️</strong> ${item.aPron}</p>
                            <div class="meaning-action-row">
                                <p class="meta-line meaning"><strong>👉</strong> ${item.aMeaning}</p>
                                <button class="btn-exp-inline" onclick="toggleExplanation(event, ${item.id})"><i class="fa-regular fa-lightbulb"></i> ব্যাখ্যা</button>
                            </div>
                            <div class="explanation-box" id="exp-${item.id}">${item.rule}</div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        // --- 🚀 ROCKET FUNCTIONS ---
        function toggleRocketHub() {
            const menu = document.getElementById('rocketMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function jumpToCard() {
            const inputVal = document.getElementById('jumpInput').value.trim();
            const targetEl = document.getElementById(`card-item-${inputVal}`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                toggleRocketHub();
                targetEl.style.borderColor = 'var(--gold-glow)';
                setTimeout(() => { targetEl.style.borderColor = 'rgba(255, 255, 255, 0.07)'; }, 1600);
            } else {
                showToast("নম্বরটি খুঁজে পাওয়া যায়নি!", "#f43f5e");
            }
        }

        function showToast(msg, color) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg; toast.style.borderLeft = `4px solid ${color}`; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // Initialize App
        renderVoiceCards();
    </script>
</body>
</html>
