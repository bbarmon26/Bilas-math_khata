<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Word Substitution - Pro</title>
    <style>
        :root {
            --primary: #0A84FF;
            --primary-glow: rgba(10, 132, 255, 0.25);
            --bg-base: #0B0E14;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F2F2F7;
            --text-sub: #8E8E93;
            --accent-green: #30D158;
            --accent-cyan: #64D2FF;
            --accent-fav: #FFD60A;
            --glass-header: rgba(11, 14, 20, 0.88);
            --mode-btn-bg: #1C2436;
        }

        body.light-mode {
            --primary: #007AFF;
            --primary-glow: rgba(0, 122, 255, 0.15);
            --bg-base: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-main: #1C1C1E;
            --text-sub: #636366;
            --glass-header: rgba(242, 242, 247, 0.88);
            --mode-btn-bg: #E5E5EA;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 14px 14px 90px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px;
        }

        .brand-title {
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(135deg, #64D2FF, #0A84FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-size: 16px;
            transition: transform 0.15s ease;
        }

        .icon-btn:active {
            transform: scale(0.90);
        }

        .fav-nav-btn {
            background: rgba(255, 214, 10, 0.15);
            border: 1px solid rgba(255, 214, 10, 0.3);
            color: var(--accent-fav);
        }

        /* Sticky Search & Controls */
        .search-wrapper {
            position: sticky;
            top: 0;
            background: var(--glass-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 0 10px 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Mode & Count Bar */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .mode-btn {
            background: var(--mode-btn-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .mode-btn:active {
            transform: scale(0.94);
        }

        .count-badge {
            font-size: 12.5px;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* Category Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            background: var(--card-bg);
            color: var(--text-sub);
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--card-border);
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .tab.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: transparent;
            box-shadow: 0 3px 10px var(--primary-glow);
        }

        /* Word Cards */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .word-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .word-card:active {
            transform: scale(0.985);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .main-heading-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .header-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sn-badge {
            background: rgba(10, 132, 255, 0.15);
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 8px;
        }

        .primary-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .pronounce-text {
            font-size: 13.5px;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            color: var(--text-sub);
            transition: transform 0.15s ease;
        }

        .action-icon:active {
            transform: scale(1.3);
        }

        .action-icon.fav.active {
            color: var(--accent-fav);
        }

        .bangla-highlight-meaning {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--accent-green);
            margin-top: 6px;
        }

        /* Card Expand Area */
        .card-expand {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
            opacity: 0;
        }

        .word-card.open .card-expand {
            max-height: 250px;
            opacity: 1;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--card-border);
        }

        .full-def-text {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.5;
            font-style: italic;
        }

        .bangla-def-text {
            font-size: 13px;
            color: #A1A1AA;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Rocket Floating Button */
        .rocket-float {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: linear-gradient(135deg, #0A84FF, #5E5CE6);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--primary-glow);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 22px;
            z-index: 999;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .rocket-float:active {
            transform: scale(0.85) translateY(-6px);
        }

        /* Refresh Frame Anim */
        @keyframes pagePulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        .anim-refresh {
            animation: pagePulse 0.25s ease-out forwards;
        }
    </style>
</head>
<body>

<div class="app-container" id="appRoot">
    <!-- Top Bar -->
    <div class="top-nav">
        <div>
            <div class="brand-title">One Word Master iOS</div>
            <div style="font-size: 11.5px; color: var(--text-sub);">Complete 194 Substitutions</div>
        </div>
        <div class="header-actions">
            
            <button class="icon-btn" onclick="toggleTheme()" title="ডার্ক/লাইট মোড">🌓</button>
            <button class="icon-btn" onclick="refreshApp()" title="রিফ্রেশ">🔄</button>
        </div>
    </div>

    <!-- Search & Filter Area -->
    <div class="search-wrapper">
        <input type="text" class="search-box" id="searchBox" placeholder="শব্দ, উচ্চারণ বা বাংলা অর্থ খুঁজুন...">
        
        <div class="controls-row">
            <button class="mode-btn" onclick="toggleAppMode()">
                <span id="modeIcon">🔀</span>
                <span id="modeLabel">মোড: ছোট &rarr; বড় (Word &rarr; Def)</span>
            </button>
            <span class="count-badge" id="counterText">দেখাচ্ছে: ১৯৪</span>
        </div>

        <div class="tabs" id="tabBar">
            <button class="tab active" onclick="setCategory('All', this)">সবগুলো</button>
            <button class="tab" onclick="setCategory('Favorites', this)">★ ফেভারিট</button>
            <button class="tab" onclick="setCategory('Person', this)">ব্যক্তি ও চরিত্র</button>
            <button class="tab" onclick="setCategory('Marriage', this)">বিবাহ ও চিকিৎসা</button>
            <button class="tab" onclick="setCategory('Places', this)">স্থান, প্রাণী ও হত্যা</button>
            <button class="tab" onclick="setCategory('Govt', this)">শাসন ও বিজ্ঞান</button>
            <button class="tab" onclick="setCategory('Misc', this)">অন্যান্য</button>
        </div>
    </div>

    <!-- Main Word Stream -->
    <div class="word-list" id="wordList"></div>
</div>

<script>
    // 194 Full Dataset with Pronunciation, English Def & Bengali Meaning of Def
    const database = [
        { sn: 1, word: "Philanthropist", pro: "(ফিলানথ্রোপিস্ট)", meaning: "মানব প্রেমিক", def: "A person who loves mankind", defBn: "যে ব্যক্তি সমগ্র মানবজাতিকে ভালোবাসে", cat: "Person" },
        { sn: 2, word: "Misanthropist", pro: "(মিসানথ্রোপিস্ট)", meaning: "মানববিদ্বেষী", def: "A person who hates mankind", defBn: "যে মানুষ মানবজাতিকে ঘৃণা করে", cat: "Person" },
        { sn: 3, word: "Misologist", pro: "(মিসোলজিস্ট)", meaning: "জ্ঞানবিদ্বেষী", def: "A hater of knowledge and learning", defBn: "যে জ্ঞান ও শিক্ষাকে ঘৃণা করে", cat: "Person" },
        { sn: 4, word: "Insolvent", pro: "(ইনসলভেন্ট)", meaning: "দেউলিয়া", def: "A person who cannot pay his debts", defBn: "যে ব্যক্তি নিজের ঋণ পরিশোধ করতে পারে না", cat: "Person" },
        { sn: 5, word: "Optimist", pro: "(অপটিমিস্ট)", meaning: "আশাবাদী", def: "A person who looks to the bright side of life", defBn: "যে জীবনের ইতিবাচক ও উজ্জ্বল দিক দেখে", cat: "Person" },
        { sn: 6, word: "Pessimist", pro: "(পেসিমিস্ট)", meaning: "নৈরাশ্যবাদী", def: "A person who looks to the dark side of life", defBn: "যে জীবনের অন্ধকার বা নেতিবাচক দিক দেখে", cat: "Person" },
        { sn: 7, word: "Theist", pro: "(থীইস্ট)", meaning: "আস্তিক", def: "A person who believes in God", defBn: "যে ঈশ্বরে বিশ্বাস করে", cat: "Person" },
        { sn: 8, word: "Atheist", pro: "(এথেইস্ট)", meaning: "নাস্তিক", def: "A person who does not believe in God", defBn: "যে স্রষ্টায় বিশ্বাস করে না", cat: "Person" },
        { sn: 9, word: "Agnostic", pro: "(অ্যাগনস্টিক)", meaning: "অজ্ঞেয়বাদী", def: "A person not sure of the existence of God", defBn: "যে স্রষ্টার অস্তিত্ব সম্পর্কে নিশ্চিত নয়", cat: "Person" },
        { sn: 10, word: "Monotheist", pro: "(মনোথীইস্ট)", meaning: "একেশ্বরবাদী", def: "A person who believes in one God", defBn: "যে এক ঈশ্বরে বিশ্বাস করে", cat: "Person" },
        { sn: 11, word: "Polytheist", pro: "(পলিথীইস্ট)", meaning: "বহু ঈশ্বরবাদী", def: "A person who believes in many Gods & Goddess", defBn: "যে বহু দেব-দেবীতে বিশ্বাস করে", cat: "Person" },
        { sn: 12, word: "Polyglot", pro: "(পলিগ্লট)", meaning: "বহু ভাষাভাষী", def: "A person who knows many languages", defBn: "যে অনেক ভাষায় কথা বলতে বা জানতে পারে", cat: "Person" },
        { sn: 13, word: "Linguist", pro: "(লিঙ্গুইস্ট)", meaning: "বহু ভাষাবিদ", def: "A person who is skilled in foreign languages", defBn: "বিদেশি ভাষা শিক্ষায় পারদর্শী ব্যক্তি", cat: "Person" },
        { sn: 14, word: "Lexicographer", pro: "(লেক্সিকোগ্রাফার)", meaning: "অভিধান প্রণেতা", def: "A person who compiles/writes dictionary", defBn: "যিনি অভিধান বা ডিকশনারি রচনা করেন", cat: "Person" },
        { sn: 15, word: "Eccentric", pro: "(একসেন্ট্রিক)", meaning: "খেয়ালী / অদ্ভুত স্বভাবের", def: "A person who has unusual habits", defBn: "অস্বাভাবিক বা অদ্ভুত অভ্যাসের অধিকারী ব্যক্তি", cat: "Person" },
        { sn: 16, word: "Curator", pro: "(কিউরেটর)", meaning: "জাদুঘরের তত্ত্বাবধায়ক", def: "A person in charge of a museum", defBn: "জাদুঘরের দায়িত্বে নিয়োজিত কর্মকর্তা", cat: "Person" },
        { sn: 17, word: "Playwright", pro: "(প্লে-রাইট)", meaning: "নাট্যকার", def: "A person who writes plays", defBn: "যিনি নাটক লেখেন", cat: "Person" },
        { sn: 18, word: "Stoic", pro: "(স্টোয়িক)", meaning: "সুখ-দুঃখে নির্বিকার", def: "A person who remains indifferent to pain or pleasure", defBn: "সুখ বা দুঃখে অবিচল থাকা ব্যক্তি", cat: "Person" },
        { sn: 19, word: "Fatalist", pro: "(ফ্যাটালিস্ট)", meaning: "অদৃষ্টবাদী", def: "A person who believes in the powers of fate", defBn: "ভাগ্যের ওপর পূর্ণ বিশ্বাসী ব্যক্তি", cat: "Person" },
        { sn: 20, word: "Epicurean", pro: "(এপিকিউরিয়ান)", meaning: "ভোগবাদী", def: "A person who believes in eating, drinking and being merry", defBn: "খাও-দাও ফুর্তি করো তত্ত্বে বিশ্বাসী", cat: "Person" },
        { sn: 21, word: "Accomplice", pro: "(অ্যাকমপ্লিস)", meaning: "অপরাধের সহযোগী", def: "A person who helps you break the law", defBn: "আইন ভাঙতে যে সাহায্য করে", cat: "Person" },
        { sn: 22, word: "Teetotaler", pro: "(টি-টোটালার)", meaning: "মদ পান বর্জনকারী", def: "A person who abstains completely from alcoholic drinks", defBn: "যে অ্যালকোহল জাতীয় পানীয় সম্পূর্ণ পরিহার করে", cat: "Person" },
        { sn: 23, word: "Traitor", pro: "(ট্রেইটর)", meaning: "দেশদ্রোহী", def: "A person who does not love his country", defBn: "যে নিজের দেশের সাথে বিশ্বাসঘাতকতা করে", cat: "Person" },
        { sn: 24, word: "Reticent", pro: "(রেটিসেন্ট)", meaning: "স্বল্পভাষী", def: "A person who is reserved in speech", defBn: "কম কথা বলে এমন ব্যক্তি", cat: "Person" },
        { sn: 25, word: "Amateur", pro: "(অ্যামেচার)", meaning: "অপেশাদার / শৌখিন", def: "A person who does something for pleasure", defBn: "পেশা হিসেবে নয় আনন্দের জন্য কাজ করে", cat: "Person" },
        { sn: 26, word: "Amicable", pro: "(অ্যামিকেবল)", meaning: "বন্ধুভাবাপন্ন", def: "A person who has a sweet and friendly nature", defBn: "মিষ্ট ও আন্তরিক স্বভাবের ব্যক্তি", cat: "Person" },
        { sn: 27, word: "Astrologer", pro: "(অ্যাস্ট্রোলজার)", meaning: "জ্যোতিষী", def: "A foreteller of things by the stars", defBn: "নক্ষত্র দেখে ভবিষ্যৎ গণনা করেন যিনি", cat: "Person" },
        { sn: 28, word: "Day dreamer", pro: "(ডে ড্রিমার)", meaning: "দিবাস্বপ্নচারী", def: "A person whose head is in the clouds", defBn: "অবাস্তব আকাশ-কুসুম ভাবনায় মগ্ন ব্যক্তি", cat: "Person" },
        { sn: 29, word: "Bibliophile", pro: "(বিব্লিওফাইল)", meaning: "বই প্রেমিক", def: "A great lover of books", defBn: "বই পড়তে ও সংগ্রহ করতে দারুণ ভালোবাসে যে", cat: "Person" },
        { sn: 30, word: "Patriot", pro: "(প্যাট্রিয়ট)", meaning: "দেশপ্রেমিক", def: "One who loves his country", defBn: "যিনি নিজের দেশকে ভালোবাসেন", cat: "Person" },

        { sn: 180, word: "Aborigines", pro: "(অ্যাবোরিজিনিস)", meaning: "আদিবাসী", def: "The original inhabitants of a country", defBn: "কোনো দেশের আদিমতম আদি বাসিন্দা", cat: "Misc" },
        { sn: 181, word: "Adolescence", pro: "(অ্যাডোলেসেন্স)", meaning: "বয়ঃসন্ধিকাল", def: "The period following the onset of puberty", defBn: "শৈশব থেকে যৌবনে পদার্পণের মধ্যবর্তী বয়স", cat: "Misc" },
        { sn: 182, word: "Ambiguous", pro: "(অ্যাম্বিগুয়াস)", meaning: "দ্ব্যর্থবোধক / অস্পষ্ট", def: "Open to more than one interpretation", defBn: "যার একাধিক অর্থ হতে পারে ও পরিষ্কার নয়", cat: "Misc" },
        { sn: 183, word: "Autograph", pro: "(অটোগ্রাফ)", meaning: "স্বহস্তাক্ষর", def: "A signature, especially that of a celebrity", defBn: "খ্যাতিমান ব্যক্তির নিজ হাতের স্বাক্ষর", cat: "Misc" },
        { sn: 184, word: "Autopsy", pro: "(অটপসি)", meaning: "ময়নাতদন্ত", def: "A post-mortem examination to discover cause of death", defBn: "মৃত্যুর কারণ জানতে লাশের ডাক্তারি পরীক্ষা", cat: "Misc" },

        { sn: 188, word: "Equivocation", pro: "(ইকুইভোকেশন)", meaning: "বাকচাতুরী / দ্বিমুখী কথা", def: "The use of ambiguous language to conceal the truth", defBn: "সত্য লুকাতে কৌশলে দ্ব্যর্থক ভাষা ব্যবহার", cat: "Misc" },
        { sn: 189, word: "Epitaph", pro: "(এপিটাফ)", meaning: "সমাধিলিপি", def: "A phrase or statement written in memory of a person who has died", defBn: "মৃত ব্যক্তির স্মরণে কবরে খোদাই করা লেখা", cat: "Misc" },

        { sn: 191, word: "Audible", pro: "(অডিবল)", meaning: "শ্রুতিগোচর", def: "Able to be heard", defBn: "যা স্পষ্টভাবে কানে শোনা যায়", cat: "Misc" },
        { sn: 192, word: "Stagflation", pro: "(স্ট্যাগফ্লেশন)", meaning: "মুদ্রাস্ফীতিজনিত মন্দা", def: "Persistent high inflation combined with high unemployment and stagnant demand", defBn: "উচ্চ দ্রব্যমূল্য ও বেকারত্বযুক্ত অর্থনৈতিক স্থবিরতা", cat: "Misc" },
        { sn: 193, word: "Benevolence", pro: "(বেনেভোলেন্স)", meaning: "বদান্যতা / পরোপকার", def: "The quality of being well meaning and kindness", defBn: "দয়াশীল ও পরোপকারী মনোভাব", cat: "Misc" },
        { sn: 194, word: "Namesake", pro: "(নেইমসেক)", meaning: "মিতা / সমনামধারী", def: "A person or thing that has the same name as another", defBn: "অন্যের সাথে হুবহু একই নামের ব্যক্তি", cat: "Misc" }
    ];

    // App State
    let currentCategory = 'All';
    let isWordFirst = true; // true:(Word -> Def), false: (Def -> Word)
    let favorites = JSON.parse(localStorage.getItem('ow_favs_v3')) || [];

    // Pronunciation with Speech Synthesis
    function speakText(text, e) {
        e.stopPropagation();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
        }
    }

    // Toggle Favorite
    function toggleFavorite(sn, e) {
        e.stopPropagation();
        if (favorites.includes(sn)) {
            favorites = favorites.filter(id => id !== sn);
        } else {
            favorites.push(sn);
        }
        localStorage.setItem('ow_favs_v3', JSON.stringify(favorites));
        renderList();
    }

    // Toggle Mode: Word to Def vs Def to Word
    function toggleAppMode() {
        isWordFirst = !isWordFirst;
        const modeLabel = document.getElementById('modeLabel');
        const modeIcon = document.getElementById('modeIcon');
        
        if(isWordFirst) {
            modeIcon.textContent = "";
            modeLabel.innerHTML = " &rarr; (Word) &rarr; (Def)";
        } else {
            modeIcon.textContent = "";
            modeLabel.innerHTML = " &rarr; (Def) &rarr; (Word)";
        }
        renderList()
    }

    // Set Active Tab Category
    function setCategory(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (el) el.classList.add('active');
        renderList();
    }

    // Open Favorite Tab directly from Top Header Button
    function openFavoritesTab() {
        const favTab = Array.from(document.querySelectorAll('.tab')).find(t => t.textContent.includes('ফেভারিট'));
        setCategory('Favorites', favTab);
    }

    // Theme Switcher
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    // Smooth Scroll To Top (Rocket)
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Refresh Soft Action
    function refreshApp() {
        const root = document.getElementById('appRoot');
        root.classList.add('anim-refresh');
        setTimeout(() => root.classList.remove('anim-refresh'), 300);
        document.getElementById('searchBox').value = '';
        renderList();
    }

    // Core Render Engine
    function renderList() {
        const query = document.getElementById('searchBox').value.trim().toLowerCase();
        const listDiv = document.getElementById('wordList');
        listDiv.innerHTML = '';

        let filtered = database.filter(item => {
            const matches = item.word.toLowerCase().includes(query) || 
                            item.meaning.toLowerCase().includes(query) || 
                            item.pro.includes(query) || 
                            item.def.toLowerCase().includes(query) ||
                            item.defBn.includes(query);

            if (currentCategory === 'All') return matches;
            if (currentCategory === 'Favorites') return matches && favorites.includes(item.sn);
            return matches && item.cat === currentCategory;
        });

        document.getElementById('counterText').textContent = `দেখাচ্ছে: ${filtered.length}`;

        if (filtered.length === 0) {
            listDiv.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:45px 10px; font-size:14px;">কোনো শব্দ পাওয়া যায়নি!</div>`;
            return;
        }

        filtered.forEach(item => {
            const isFav = favorites.includes(item.sn);
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = () => card.classList.toggle('open');

            if (isWordFirst) {
                // ছোট থেকে বড় মোড: উপরে ইংরেজি শব্দ ও উচ্চারণ, নিচে ব্যাখ্যা
                card.innerHTML = `
                    <div class="card-top">
                        <div class="main-heading-group">
                            <div class="header-inline">
                                <span class="sn-badge">#${item.sn}</span>
                                <span class="primary-title">${item.word}</span>
                                <span class="pronounce-text">${item.pro}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-icon" onclick="speakText('${item.word}', event)" title="উচ্চারণ শুনুন">🔊</button>
                            <button class="action-icon fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.sn}, event)">★</button>
                        </div>
                    </div>
                    <div class="bangla-highlight-meaning">${item.meaning}</div>
                    <div class="card-expand">
                        <div class="full-def-text"><b>🧠</b> ${item.def}</div>
                        <div class="bangla-def-text"><b>🧠</b> ${item.defBn}</div>
                    </div>
                `;
            } else {
                // বড় থেকে ছোট মোড: উপরে পূর্ণ Definition ও বাংলা বাক্য, ক্লিক করলে উত্তর আসবে
                card.innerHTML = `
                    <div class="card-top">
                        <div class="main-heading-group">
                            <div class="header-inline">
                                <span class="sn-badge">#${item.sn}</span>
                                <span class="primary-title" style="font-size:15px; font-style:italic;">"${item.def}"</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-icon" onclick="speakText('${item.word}', event)" title="উচ্চারণ শুনুন">🔊</button>
                            <button class="action-icon fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.sn}, event)">★</button>
                        </div>
                    </div>
                    <div class="bangla-highlight-meaning"> ${item.defBn}</div>
                    <div class="card-expand">
                        <div style="font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 4px;">
                            ${item.word} <span style="font-size: 13px; color: var(--accent-cyan); font-weight: normal;">${item.pro}</span>
                        </div>
                        <div style="font-size: 14px; font-weight: 600; color: var(--accent-green);">অর্থ: ${item.meaning}</div>
                    </div>
                `;
            }

            listDiv.appendChild(card);
        });
    }

    // Attach Search Listener
    document.getElementById('searchBox').addEventListener('input', renderList);

    // Initial Execute
    renderList();
</script>
